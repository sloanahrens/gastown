# The app rigs app-promote promotes for, one per line:
#
#   <rig> <forgejo owner/name> [<integration job>]
#
# The integration job is the staging.yml job that proves a commit on the
# deployed staging stack; it defaults to staging. Blank lines and # comments are
# ignored. A rig belongs here once it names merge_queue.forgejo.promote_target
# and promote_key_file; README.md beside this file says how it is installed and
# what it needs.
