# The app rigs app-promote promotes for, one per line:
#
#   <rig> <forgejo owner/name> [<prod integration job>]
#
# GitHub follows prod: a rig's GitHub main advances to a release's commit once
# that release's deploy.yml run passed the prod integration job. The job
# defaults to prod-integration; name it here when the workflow calls it
# otherwise. Blank lines and # comments are ignored. A rig belongs here once it
# names merge_queue.forgejo.promote_target and promote_key_file; README.md beside
# this file says how it is installed and what it needs.
fractals sloan/fractals-nextjs
