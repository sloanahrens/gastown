version: "2"

run:
  timeout: 5m
  tests: false
  # golangci-lint takes a module-wide flock ($TMPDIR/golangci-lint.lock) for the
  # whole run. By default it gives up on that lock after 5s and fails with
  # "parallel golangci-lint is running" — nothing analysed, no findings, and a
  # failure a reader cannot tell apart from a real one. In a town running five
  # polecats plus the refinery, two overlapping lints are routine rather than
  # exotic, and the refinery's batch gate chains this rig's lint_command ("make
  # lint") verbatim with no retry of its own, so a lost coin flip there costs a
  # whole 14-35 min gate slot (gt-taoz, gt-xsty).
  #
  # Serialising is the wanted behaviour, so wait for the holder instead of
  # failing. The wait is not unbounded at this setting's expense: golangci-lint
  # acquires the lock in its preRunE and only starts run.timeout's clock
  # afterwards, so the waiter still gets its full 5m of analysis, and a holder
  # is in turn bounded by its own timeout. `make lint` names the lock before it
  # starts, because golangci-lint prints nothing while it waits.
  allow-serial-runners: true

linters:
  default: 'none'
  enable:
    - errcheck
    - gosec
    - misspell
    - unconvert
    - unparam

  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.Stmt).Close
        - (*database/sql.Conn).Close
        - (*os.File).Close
        - (net.Conn).Close
        - os.RemoveAll
        - os.Remove
        - os.Setenv
        - os.Unsetenv
        - os.Chdir
        - os.MkdirAll
        - fmt.Sscanf
        - fmt.Fprintf
        - fmt.Fprintln
    misspell:
      locale: US

  exclusions:
    rules:
      # G304: File inclusion via variable in tests is safe (test data)
      - path: '_test\.go'
        linters:
          - gosec
        text: "G304"
      # G304: Config/state file loading uses constructed paths, not user input
      # All internal packages read files from constructed paths, not user input
      - path: 'internal/'
        linters:
          - gosec
        text: "G304"
      # G306: File permissions 0644 in tests are acceptable (test fixtures)
      - path: '_test\.go'
        linters:
          - gosec
        text: "G306"
      # G302/G306: Non-sensitive operational files (state, config, logs) can use 0644
      # Internal packages write non-sensitive operational data files
      - path: 'internal/'
        linters:
          - gosec
        text: "G306|G302"
      # G302/G306: Directory/file permissions 0700/0750 are acceptable
      - linters:
          - gosec
        text: "G302.*0700|G301.*0750"
      # G404: math/rand is fine for jitter/backoff calculations, not security
      - path: 'internal/'
        linters:
          - gosec
        text: "G404"
      # G104: Errors unhandled - covered by errcheck exclusions already
      - path: 'internal/'
        linters:
          - gosec
        text: "G104"
      # G204: Safe subprocess launches with validated arguments (internal tools)
      # All internal packages use subprocess calls for trusted internal tools
      - path: 'internal/'
        linters:
          - gosec
        text: 'G204'
      # G115: Integer narrowing conversions in internal code are intentional
      - path: 'internal/'
        linters:
          - gosec
        text: 'G115'
      # G117: Password fields in config/DB structs are not hardcoded secrets
      - path: 'internal/'
        linters:
          - gosec
        text: 'G117'
      # G201: SQL string formatting with backtick-quoted identifiers (dbName, table names)
      # Internal code builds queries with database/table names from internal config, not user input
      - path: 'internal/'
        linters:
          - gosec
        text: 'G201'
      # G702/G703/G704/G705: Taint analysis false positives in internal tooling
      # Internal code uses trusted inputs (constructed paths, internal APIs, validated args)
      - path: 'internal/'
        linters:
          - gosec
        text: 'G702|G703|G704|G705'
      # errcheck: Ignore unchecked errors in test files for common cleanup patterns
      - path: '_test\.go'
        linters:
          - errcheck
        text: "Error return value of .*(Close|Rollback|RemoveAll|Setenv|Unsetenv|Chdir|MkdirAll|Remove|Write).* is not checked"

issues:
  uniq-by-line: true
