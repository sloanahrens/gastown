description = """
Monitor Dolt commit growth on production databases and escalate when
compaction is warranted.

Every bd mutation creates a Dolt commit. Over time this builds an enormous
commit graph (5,000-10,000 commits/day from wisp churn), and the commit graph
IS the storage cost — deleting rows without compaction leaves ghost commits
forever. Compacting that history is a commit-graph rewrite followed by a
force-push, so it is destructive and irreversible.

This dog does NOT compact. It monitors and escalates:

1. It counts commits per production database.
2. Databases at or above the threshold are escalated as "compaction
   recommended", naming the DB and the count.
3. It never rewrites history and never force-pushes.

## Why monitoring only

The daemon patrol used to auto-flatten (and force-push) any database over the
threshold, with no agent or operator judgment in the loop. That is the same
failure mode that gt-e14c fixed in the agent plugin: an unattended path that
rewrites the commit graph and force-pushes the result to remotes. The daemon
now matches the plugin's shape — monitor and escalate — and the only
destructive entry point is the operator-invoked
`plugins/compactor-dog/run.sh --compact`.

## Threshold reconciliation with the plugin

The agent-facing plugin (plugins/compactor-dog/plugin.md) escalates at >500
commits and hard-escalates at >1000. The daemon's default threshold is 2000
(daemon.json: patrols.compactor_dog.threshold). They are not inconsistent:
both paths escalate, and they differ because they run on different cadences
and have different per-run costs.

The daemon's number is higher for one concrete reason: escalating is not free.
Each escalation mints a bead, and beads are Dolt commits. A daemon threshold at
or near the plugin's 500 line would let a single busy 24h cycle push a database
back over the line with its own escalations, re-triggering the patrol on its own
output. The 2000 default is the buffer against that loop.

## ZFC Exemption

This formula is used for **observability tracking only** — the Go code in
compactor_dog.go is the executor. The dog is exempt from agent-driven formula
execution (ZFC) because:

1. Operations require SQL connections via database/sql (agents lack SQL access)
2. The per-run step ledger must be written by the same process that did the
   work, without depending on an agent session surviving the run

The daemon pours this molecule, executes the Go code, and closes/fails each
step for observability. This IS the hybrid approach: formula defines observable
structure, imperative Go is the executor.

## Dog Contract

This is infrastructure work. The daemon:
1. Inspects all production databases for commit count
2. Escalates for databases at or above the threshold
3. Reports findings

There is no verify step: monitoring mutates nothing, so there is no integrity
surface to check. The old verify step existed to compare row counts before and
after compaction, and compaction no longer happens here.

## Order of Operations

Reaper (deletes rows) → Compactor (flattens history) → Doctor (runs gc)

The compactor step in that pipeline is now operator-invoked, not a daemon
patrol. When this dog escalates, a human runs:

```bash
bash plugins/compactor-dog/run.sh --compact
```

## Safety

Monitoring is read-only — it counts commits and files escalations. No
irreversible action is taken by this dog under any threshold or error path.
JSONL backups and Dolt filesystem backups provide recovery points for the
operator-invoked compaction that follows."""
formula = "mol-dog-compactor"
version = 3

[squash]
trigger = "on_complete"
template_type = "work"
include_metrics = true

[[steps]]
id = "inspect"
title = "Inspect databases for commit count"
description = """
Check each production database's commit count against the threshold.

**Database discovery:** Checks compactor config first, falls back to wisp_reaper
config, then auto-discovery via reaper.DefaultDatabases.

**For each database:**
```sql
SELECT COUNT(*) FROM `<database>`.dolt_log;
```

**Record:**
- Database name
- Current commit count
- Whether it is at or above threshold (configurable, default 2000)

A database that cannot be counted is an inspection error and fails this step,
attributed here rather than to a later step.

**Exit criteria:** All databases inspected, candidates identified."""

[[steps]]
id = "monitor"
title = "Escalate for databases over threshold"
needs = ["inspect"]
description = """
Escalate for each database at or above the threshold. Nothing is compacted.

**For each candidate:**
- Log the database and its commit count
- Escalate with a "compaction recommended" message naming the database, the
  count, and the operator-only compaction command
  (`plugins/compactor-dog/run.sh --compact`)

Escalation is the happy path for an over-threshold database, not an error, so
this step does not fail. Repeated escalation for the same database is expected
and is what keeps a growing database visible until an operator acts.

**Exit criteria:** Every candidate escalated, or none were candidates."""

[[steps]]
id = "report"
title = "Report findings and return to kennel"
needs = ["monitor"]
description = """
Generate summary of the monitoring cycle.

**Report includes:**
- Databases inspected (total count)
- Databases above threshold (escalated, with commit counts)
- Databases below threshold
- Any inspection failures or escalations

This step closes unconditionally, including on a cycle with inspection
failures — the failures are already recorded on the step that hit them, and
the summary of a partial cycle is still the summary. This matches the other
dogs (see wisp_reaper.go).

**Exit criteria:** Report logged, dog returned to kennel."""

[vars]
[vars.commit_threshold]
description = "Commit count at or above which the dog escalates (default 2000; must stay well above the plugin's 500/1000 escalation lines to avoid a feedback loop)"
default = "2000"

[vars.databases]
description = "Comma-separated list of databases to check (falls back to wisp_reaper config, then auto-discovery)"
default = "hq,bd,gt"
