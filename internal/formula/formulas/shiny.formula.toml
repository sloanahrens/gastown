description = "Engineer in a Box - the canonical right way. Design before you code. Review before you ship. Test before you submit."
formula = "shiny"
type = "workflow"
version = 1

[[steps]]
description = "Think carefully about architecture before writing code. Consider: How does this fit into the existing system? What are the edge cases? What could go wrong? Is there a simpler approach?\n\nDone when: Design doc committed covering approach, trade-offs, and files to change"
id = "design"
title = "Design {{feature}}"

[[steps]]
description = "Write the code for {{feature}}. Follow the design. Keep it simple. Don't gold-plate.\n\nDone when: All files from the design doc are modified/created and committed"
id = "implement"
needs = ["design"]
title = "Implement {{feature}}"

[[steps]]
description = "Review the implementation. Check for: Does it match the design? Are there obvious bugs? Is it readable and maintainable? Are there security concerns?\n\nDone when: Self-review complete, no obvious bugs, code is readable and secure"
id = "review"
needs = ["implement"]
title = "Review implementation"

[[steps]]
description = "Write and run tests. Unit tests for new code, integration tests if needed, run the full test suite, fix any regressions.\n\nDone when: All tests pass, no regressions, test coverage for new code"
id = "test"
needs = ["review"]
title = "Test {{feature}}"

[[steps]]
description = "Submit for merge. Final check: git status, git diff. Commit with clear message. Follow your role's git workflow for landing code.\n\nDone when: Clean git status, clear commit message, code pushed to feature branch"
id = "submit"
needs = ["test"]
title = "Submit for merge"

[vars]
[vars.assignee]
description = "Who is assigned to this work\n\nDone when: Clean git status, clear commit message, code pushed to feature branch"
[vars.feature]
description = "The feature being implemented\n\nDone when: Clean git status, clear commit message, code pushed to feature branch"
required = true
