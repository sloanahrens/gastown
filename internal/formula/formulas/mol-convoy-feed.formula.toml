description = """
Feed stranded convoys by dispatching ready work to available polecats.

The agent running this formula feeds one stranded convoy. A convoy
is stranded when it has ready issues (open, unblocked, no assignee) but no
workers are processing them.

## Contract

This is infrastructure work. The agent running this formula:
1. Receive convoy ID via variable
2. Load convoy and find ready issues
3. Check idle polecat capacity across rigs
4. Dispatch min(ready_issues, idle_polecats) using gt sling
5. Report actions taken
6. Signals completion

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| convoy | --var | The stranded convoy ID to feed |

## Single Pass Design

The run doesn't babysit or wait for completion. The workflow is:
1. Find ready issues in convoy
2. Dispatch each to an available polecat
3. Exit immediately

If the convoy is still stranded afterwards, a later run feeds it again. This keeps the system stateless and batch-oriented.

## Failure Modes

| Situation | Action |
|-----------|--------|
| Convoy not found | Exit with error |
| No ready issues | Exit success (false positive, convoy is fine) |
| No idle polecats | Exit success, note in report (will retry next cycle) |
| Sling fails | Continue with remaining issues, note failures |"""
formula = "mol-convoy-feed"
version = 2

[[steps]]
id = "load-convoy"
title = "Load convoy and identify ready issues"
description = """
Load the convoy and find issues ready for dispatch.

**1. Check assignment:**
```bash
gt hook               # Shows convoy in hook_bead or vars
```

**2. Load convoy details:**
```bash
gt convoy status {{convoy}} --json
```

**3. Identify ready issues:**

For each tracked issue in the convoy:
```bash
bd show <issue-id> --json
```

An issue is "ready" if ALL of these are true:
- status = "open" (NOT in_progress, closed, or hooked)
- not in blocked list (check: bd blocked --json)
- assignee is empty OR assignee session is dead

Check blocked status:
```bash
bd blocked --json
# If issue ID appears here, it's blocked (skip it)
```

Check assignee session if set:
```bash
# If assignee like "gastown/polecats/nux"
tmux has-session -t gt-gastown-polecat-nux 2>/dev/null && echo "alive" || echo "dead"
```

**4. Build ready list:**
Collect all ready issues with their metadata:
- Issue ID
- Title
- Priority
- Rig (extracted from prefix)

Sort by priority (P0 first) for dispatch order.

**Exit criteria:** Ready issues identified and prioritized."""

[[steps]]
id = "check-capacity"
title = "Check polecat capacity across rigs"
needs = ["load-convoy"]
description = """
Determine how many polecats are available for dispatch.

**1. For each rig that has ready issues:**
```bash
gt polecat list <rig>
# Shows polecat status: idle, working, etc.
```

**2. Count available capacity:**
Available polecats are those that:
- Exist in the rig's polecat pool
- Currently idle (no hooked work)
- Session is running

**3. Calculate dispatch count:**
```
dispatch_count = min(ready_issues, available_polecats)
```

If dispatch_count = 0:
- Log: "No capacity available, will retry next cycle"
- Proceed to report step (no dispatches to make)

**4. Match issues to rigs:**
For each ready issue, determine target rig from issue prefix:
- gt-* issues → gastown rig
- bd-* issues → beads rig
- etc.

**Exit criteria:** Dispatch plan created with issue→rig mappings."""

[[steps]]
id = "dispatch-work"
title = "Dispatch ready issues to polecats"
needs = ["check-capacity"]
description = """
Sling each ready issue to an available polecat.

**First check the operator's dispatch hold (gt-ifijm).** While it is in place,
automatic dispatch is parked town-wide. Sling nothing, report the convoy as
held, and let a later feed pick it up:
```bash
if [ -e "${GT_SEAT_REFILL_HOLD:-$GT_ROOT/seat-refill.hold}" ] || [ -e "$GT_ROOT/ESTOP" ]; then
  echo "dispatch hold active; not feeding this convoy"
fi
```
Skip any issue whose target rig has `$GT_ROOT/ESTOP.<rig>`, and report it as
held rather than failed.

**For each issue in dispatch plan:**

```bash
# Dispatch issue to the appropriate rig
# This spawns a fresh polecat or assigns to idle one
gt sling <issue-id> <rig>

# If the convoy records an agent, re-dispatch with that same agent:
gt sling <issue-id> <rig> --agent <convoy-agent>

# Example:
gt sling gt-abc123 gastown
gt sling bd-xyz789 beads
```

**Preserve the recorded agent (required):**
Check the convoy's `agent` field before dispatching:

```bash
gt convoy status <convoy> --json   # "agent" is present when one was recorded
```

An agent recorded on the convoy is a routing decision made when the work was
slung (`gt sling <bead> <rig> --agent X`). Feeding the bead with the rig default
instead silently overrides it. So:
- `agent` set → pass `--agent <agent>` with the sling
- `agent` absent → sling without `--agent` (the rig default applies) and say so
  in the report

**Track results:**
For each dispatch:
- Success: Note issue ID, target rig, polecat assigned, agent used
- Failure: Note issue ID, error message

**Important notes:**
- `gt sling` handles polecat selection automatically
- It will spawn a new polecat if none available
- The polecat gets the issue hooked and starts immediately
- Don't wait for polecat to complete - fire and forget

**If sling fails:**
- Continue with remaining issues
- Note the failure for the report
- Don't escalate individual failures (will retry next cycle)

**Exit criteria:** All dispatchable issues have been slung."""

[[steps]]
id = "report-results"
title = "Generate and record feeding report"
needs = ["dispatch-work"]
description = """
Create summary report of convoy feeding actions.

**1. Generate report:**
```markdown
## Convoy Feed Report: {{convoy}}

**Ready issues found**: {{ready_count}}
**Polecats available**: {{available_count}}
**Issues dispatched**: {{dispatch_count}}

### Dispatched Work
{{#each dispatched}}
- {{issue_id}}: {{title}} → {{rig}}/{{polecat}}
{{/each}}

### Skipped (no capacity)
{{#if skipped}}
{{#each skipped}}
- {{issue_id}}: {{title}} (will retry next cycle)
{{/each}}
{{else}}
(none)
{{/if}}

### Errors
{{#if errors}}
{{#each errors}}
- {{issue_id}}: {{error}}
{{/each}}
{{else}}
(none)
{{/if}}
```

**2. Record it on the convoy:**
```bash
bd comments add {{convoy}} "$(cat <<'EOF'
Convoy {{convoy}} feeding complete.

Dispatched: {{dispatch_count}}/{{ready_count}} issues
{{#if errors}}Errors: {{error_count}}{{/if}}

{{report_summary}}
EOF
)"
```

**Exit criteria:** Report generated and recorded on the convoy."""

[[steps]]
id = "return-to-kennel"
title = "Signal completion"
needs = ["report-results"]
description = """
Signal work complete.

Close this step with a one-line summary (convoy {{convoy}}: dispatched {{dispatch_count}} of {{ready_count}} ready). The closed molecule is the
record of the run.

**Exit criteria:** Completion recorded."""

[vars]
[vars.convoy]
description = "The convoy ID to feed"
required = true

[vars.available_count]
description = "Number of available polecats (computed during execution)"
default = ""

[vars.dispatch_count]
description = "Number of issues dispatched (computed during execution)"
default = ""

[vars.error]
description = "Error message for a failed dispatch (computed during execution)"
default = ""

[vars.error_count]
description = "Number of dispatch errors (computed during execution)"
default = ""

[vars.issue_id]
description = "Issue ID being dispatched (computed during execution)"
default = ""

[vars.polecat]
description = "Polecat assigned to work (computed during execution)"
default = ""

[vars.ready_count]
description = "Number of ready issues found (computed during execution)"
default = ""

[vars.report_summary]
description = "Summary text for the feeding report (computed during execution)"
default = ""

[vars.rig]
description = "Target rig for dispatch (computed during execution)"
default = ""

[vars.title]
description = "Issue title (computed during execution)"
default = ""
