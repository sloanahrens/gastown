description = """
Full polecat work lifecycle from assignment through completion.

This molecule guides a polecat through a complete work assignment. Each step
has clear entry/exit criteria and specific commands to run. A polecat can
crash after any step and resume from the last completed step.

## Polecat Contract (Self-Cleaning Model)

You are a self-cleaning worker. You:
1. Receive work via your hook (formula checklist + issue)
2. Work through formula steps in order (shown inline at prime time)
3. Complete and self-clean via `gt done` (submit + retire yourself)
4. You are GONE - the daemon's landing worker lands your branch

**Self-cleaning:** When you run `gt done`, it gates and pushes your branch,
marks {{issue}} ready to land, and retires your session. There is no idle
state. Done means gone.

**Important:** This formula defines the workflow template. Steps are shown inline
when you run `gt prime` — there are no separate step beads to close. Work through
the checklist, then run `gt done`.

**Speed principle:** You run the cheap gates (build, typecheck, lint) AFTER
rebasing onto the target branch (pre-verify step), and you submit with plain
`gt done`. It rebases, runs the local gate (lint, build, the unit tier of
the tests) and pushes; no flag skips that gate. The container suite runs once,
on the merged tree, when the landing worker lands your branch.

**You do NOT:**
- Push directly to main (the landing worker lands your branch)
- Close your own issue (the landing worker closes it when it lands)
- Wait for the landing (you're gone after `gt done`)
- Fix pre-existing failures on main (the daemon owns red main)

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| issue | hook_bead | The issue ID you're assigned to work on |
| base_branch | sling vars | The base branch to rebase on (default: main) |
| setup_command | rig config | Setup/install command (e.g., `pnpm install`). Empty = skip. |
| typecheck_command | rig config | Type check command (e.g., `tsc --noEmit`). Empty = skip. |
| test_command | rig config | Test command. Empty = skip. Rig must configure for its language. |
| lint_command | rig config | Lint command (e.g., `eslint .`). Empty = skip. |
| build_command | rig config | Build command (e.g., `go build ./...`). Empty = skip. |

## Failure Modes

| Situation | Action |
|-----------|--------|
| Build fails | Fix it. Do not proceed if it won't compile. |
| Blocked on external | `gt escalate`, then `gt done --status ESCALATED` |
| Context filling | Use gt handoff to cycle to fresh session |
| Unsure what to do | `gt escalate`, don't guess |"""
formula = "mol-polecat-work"
version = 15

[[steps]]
id = "load-context"
title = "Load context and verify assignment"
description = """
Initialize your session and understand your assignment.

**1. Prime your environment:**
```bash
gt prime                    # Load role context
```

**2. Preflight check (validate connectivity):**
```bash
gt hook               # Shows your pinned molecule and hook_bead
bd show {{issue}}           # Validates Dolt connectivity + reads your assignment
```
If `bd show` hangs or fails: run `gt dolt status` to check Dolt health.
If Dolt is down: `gt escalate -s HIGH "Dolt: <symptom>"` — do NOT restart it yourself.

The hook_bead is your assigned issue. Read the output of `bd show` carefully.

**3. Check inbox for additional context:**
```bash
gt mail inbox
# Read any HANDOFF or assignment messages
```

**4. Check for prior landing rejection context:**

If the bead notes contain "MERGE REJECTION", the landing worker rejected a
previous polecat's work.
Read the failure details carefully:
- **Failure-Type**: what broke (tests, build, lint, typecheck)
- **Error**: the actual error output
- **Branch**: the previous branch may still exist with the original work

If a prior branch exists, check it out instead of creating a new one:
```bash
git fetch origin
git branch -a | grep <branch-from-notes>
# If it exists: git checkout <branch> && git rebase origin/{{base_branch}}
```

This lets you make a targeted fix rather than starting from scratch.

**5. Understand the requirements:**
- What exactly needs to be done?
- What files are likely involved?
- Are there dependencies or blockers?
- What does "done" look like?
- If this is a rework: what specifically failed and why?

**6. Verify you can proceed:**
- No unresolved blockers on the issue
- You understand what to do
- Required resources are available

If blocked or unclear, escalate immediately:
```bash
gt escalate "HELP: unclear requirements on {{issue}}" --reason "<what you need clarified>"
```

**Exit criteria:** You understand the work and can begin implementation."""

[[steps]]
id = "branch-setup"
title = "Set up working branch"
needs = ["load-context"]
description = """
Ensure you're on a FRESH branch named for THIS bead, based on latest origin/{{base_branch}}.

**The branch name is load-bearing metadata.** `gt done` infers the bead it
marks ready to land from the bead-id embedded in your branch name. A reused
branch carries the PREVIOUS bead's id: your work gets attributed to the wrong
(often closed) bead, close credit goes to the wrong issue, and your real issue stays
open and hooked forever. NEVER reuse a branch from a previous assignment —
even if your worktree is already checked out on it.

**1. Check current branch state:**
```bash
git status
git branch --show-current
```

If the current branch name embeds a bead-id that is not {{issue}}, it is
leftover from a previous assignment. Do NOT work on it — create a fresh
branch in step 3.

**2. Exception — rejected-landing rework for THIS bead only:**

If the bead notes contain "MERGE REJECTION" with a branch name, that branch holds previous work on {{issue}} itself. Reusing it preserves all previous work:
```bash
git fetch origin
# Check for prior branch
git branch -r | grep <prior-branch>
# If found, check it out:
git checkout -b <prior-branch> origin/<prior-branch>
git rebase origin/{{base_branch}}
```

This exception applies ONLY when the prior branch is for {{issue}}. A branch
from a different bead is never reusable.

**3. Otherwise, create a fresh branch NAMED FOR THE HOOKED BEAD:**
```bash
git fetch origin
git checkout -b "polecat/<name>/{{issue}}+$(openssl rand -hex 3)" origin/{{base_branch}}
```

The format is `polecat/<your-name>/<bead-id>+<short-unique-suffix>`. The
embedded bead-id is what makes landing attribution work; the suffix keeps the
name unique across re-dispatches of the same bead.

**4. Ensure clean working state:**
```bash
git status                  # Should show "working tree clean"
git stash list              # Should be empty
```

If dirty state from previous work:
```bash
# If changes are relevant to this issue:
git add -A && git commit -m "WIP: <description>"

# If changes are unrelated cruft:
git stash push -m "unrelated changes before {{issue}}"
# Or discard if truly garbage:
git checkout -- .
```

**5. Sync with {{base_branch}}:**
```bash
git fetch origin
git rebase origin/{{base_branch}}      # Get latest, rebase your branch
```

If rebase conflicts:
- Resolve them carefully
- If stuck, `gt escalate`

**Integrate ONLY with `git rebase`. Never reset onto the remote.**

`git reset --soft origin/{{base_branch}}` (or `--mixed`/`--hard`) moves HEAD to
the current remote tip while your index and working tree stay as they were when
your worktree was cut. The commit you make afterwards then records
(old tree) - (new tip): a REVERT of every commit merged since you started, plus
your own change, submitted under a message describing only your change. That is
how two polecat branches were submitted with 9 and 17 files of other
people's work deleted (gt-63sz), and `gt done` now refuses such a branch.

Rebase replays YOUR commits onto the new base and leaves the remote's content
alone, which is what you want. The same applies to `git stash` + `git reset` +
`git stash pop` rituals: there is no sequence that needs a reset onto a
remote-tracking ref.

**6. Run project setup (if configured):**

If setup_command is set, run it to install dependencies:
```bash
{{setup_command}}
```

This ensures dependencies are installed before you start work.
Empty setup_command means "not configured" — skip this step.

**Exit criteria:** You're on a clean feature branch whose name embeds {{issue}}, rebased on latest {{base_branch}}, dependencies installed."""

[[steps]]
id = "implement"
title = "Implement the solution"
needs = ["branch-setup"]
description = """
Do the actual implementation work.

**Working principles:**
- Follow existing codebase conventions
- Make atomic, focused commits
- Keep changes scoped to the assigned issue
- Don't gold-plate or scope-creep
- **Scope is a contract.** The bead description defines what you build. If you believe \
the issue requires work beyond what is described, mail the mayor BEFORE implementing it:
  ```bash
  gt mail send mayor/ -s "Scope question: {{issue}}" -m "I think we also need X because Y. Proceed?"
  ```
  Wait for a response before expanding scope. Do NOT build unrequested features and \
present them as complete.
- **NEVER run `sudo` or install system packages** (apt, dnf, yum, pacman, brew install,
  pip install --system, npm install -g). Use the tools already in your workspace.
  If a dependency is missing, file a bead — do not modify the host OS.

**Persist findings as you go (CRITICAL for session survival):**
Your session can die at any time (context limit, crash, SIGKILL). Code changes
survive in git, but analysis, findings, and decisions exist only in your context
window. Persist them to the bead so they survive session death:
```bash
# After completing significant analysis or reaching conclusions:
gt bead note {{issue}} "Findings so far: <what you discovered>"
# For detailed reports, a structured block:
gt bead note {{issue}} "<structured findings>"
```
`gt bead note` appends and never overwrites: a resumed bead already carries the
landing worker's MERGE REJECTION block, and the resume path in load-context greps
notes for it (gt-nxvg).

Do this BEFORE closing molecule steps, not after. If your session dies between
persisting and closing, the findings survive. If you close first, they're lost.

**For report-only tasks** (audits, reviews, research): your findings ARE the
deliverable. There are no code changes to commit. You MUST persist all findings
to the bead with `gt bead note`. Without this, your entire work
product is lost when the session ends.

**Review-only close evidence:** If the bead has `review_only: true`, notes/design
are durable report content but do NOT satisfy `gt done`. Add a fresh evidence
comment after the current assignment, authored by the assignee, with the current
head SHA before completing:
```bash
HEAD_SHA=$(git rev-parse HEAD)
gt bead comment {{issue}} "PR-SHERIFF-EVIDENCE: review complete
head_sha: ${HEAD_SHA}
verdict: <pass|block>
summary: <brief findings>"
```

**Commit frequently (for code tasks):**
```bash
# After each logical unit of work:
git add <files>
git commit -m "<type>: <what the change does> ({{issue}})"
```

Commit types: feat, fix, refactor, test, docs, chore

**The subject describes what the commit DOES, and ends with `({{issue}})`.**

A bead title states the PROBLEM; pasting it as the subject makes the commit
read as if it introduced that problem. Bead title "formula sync never
removes town copies the binary dropped" ships as subject
`fix: formula sync reports town copies the binary no longer embeds (gt-zggoh)`,
not `feat: formula sync never removes town copies the binary dropped (gt-zggoh)`.

The bead id goes at the END of the subject, not in the body: readers scan
`git log --oneline` subjects, and the subject is what the landed commit keeps.

A commit message is the description and the bead id, nothing more: NO
Co-Authored-By trailer, no AI attribution anywhere.

**Discovered work:**
If you find bugs or improvements outside your scope:
```bash
gt bead create --title "Found: <description>" --type bug --priority 2
# Note the ID, continue with your work
```

Do NOT fix unrelated issues in this branch.

**If stuck:**
Don't spin for more than 15 minutes. Escalate:
```bash
gt escalate "HELP: stuck on {{issue}}" --reason "Trying to: <what you're attempting>
Problem: <what's blocking you>
Tried: <what you've attempted>"
```

**Exit criteria (HARD GATE):** Implementation complete AND code committed to git.
- Code tasks: `git status` shows clean working tree, `git log origin/{{base_branch}}..HEAD` shows at least 1 commit
- Report tasks: all findings persisted to bead with `gt bead note`
Do NOT proceed to the next step with uncommitted changes."""

[[steps]]
id = "commit-changes"
title = "Commit all implementation changes"
needs = ["implement"]
description = """
Ensure ALL implementation work is committed IMMEDIATELY after implementation.
This step exists to prevent the #1 polecat failure mode: context exhaustion
before code is committed. Commit NOW, review and build AFTER.

**CRITICAL: You MUST commit all changes from implementation.**
NEVER use `git checkout -- .` or `git restore .` to discard implementation work.
ALWAYS commit ALL uncommitted changes from your implementation.

**1. Check for uncommitted changes:**
```bash
git status
```

**2. If there are ANY uncommitted changes, commit them now:**
```bash
git add -A && git commit -m "<type>: <what the change does> ({{issue}})"
```

**3. If working tree is already clean, that's fine — but you MUST still have commits (step 4).**

**3b. Read your subjects back before going further:**
```bash
git log --format=%s origin/{{base_branch}}..HEAD
```
Every subject must (a) say what the change does, not restate the bead title's
problem, and (b) end with `({{issue}})`. Fix a failing subject now, while it
costs one reword; the landed commit keeps it forever. The subject that lands is
your branch tip's — or, when `gt done` squashes auto-save checkpoints into the
branch, the first subject that is not machine-generated. Either way, a branch
whose ONLY commits are auto-save checkpoints never reaches this gate: `gt done`
synthesizes the subject from the bead title, which states the problem rather
than the fix.

**4. VERIFY commits exist (HARD GATE — do NOT close this step without passing):**
```bash
git log origin/{{base_branch}}..HEAD --oneline
```

This MUST show at least 1 commit. If it shows NOTHING:
- You have NOT completed your implementation. Do NOT close this step.
- Go back to the implement step and do the work.
- If the task genuinely requires no code changes (already fixed upstream, etc.),
  run `gt done --status DEFERRED` and skip remaining steps.
- Do NOT proceed to review or build with zero commits.

**5. VERIFY clean working tree:**
```bash
git status
```
Must show "nothing to commit, working tree clean".

**Report-only tasks (audits, reviews, research — no code changes):**
If your task produced no code changes, verify your findings are persisted to the bead:
```bash
bd show {{issue}}    # Check the notes field has your findings
```
If the bead is `review_only: true`, also verify a fresh assignee-authored
`PR-SHERIFF-EVIDENCE` comment exists for the current `HEAD`.
If findings/evidence are persisted, proceed to review. Report-only tasks with
findings persisted can skip commit verification.

**Exit criteria:** Working tree clean AND either (a) at least 1 commit ahead of
origin/{{base_branch}}, whose every subject describes the change and ends with
`({{issue}})`, or (b) report-only task with findings persisted to bead."""

[[steps]]
id = "self-review"
title = "Self-review changes"
needs = ["commit-changes"]
description = """
Review your own changes before the build check. Use `/review --branch` for
structured grading, or do a manual review.

**Option A: Use /review (recommended)**
```bash
/review --branch
```
This gives you a structured grade (A-F) with CRITICAL/MAJOR/MINOR findings
and specific fix suggestions. Fix any CRITICAL or MAJOR issues before proceeding.

**Option B: Manual review**

**1. Review the diff:**
```bash
git diff origin/{{base_branch}}...HEAD     # All changes vs {{base_branch}}
git log --oneline origin/{{base_branch}}..HEAD  # All commits
```

**2. Check for common issues:**

| Category | Look For |
|----------|----------|
| Bugs | Off-by-one, null handling, edge cases |
| Security | Injection, auth bypass, exposed secrets |
| Style | Naming, formatting, code organization |
| Completeness | Missing error handling, incomplete paths |
| Cruft | Debug prints, commented code, TODOs |

**3. Fix issues found:**
Don't just note them - fix them now. Amend or add commits as needed.

**4. Verify no unintended changes:**
```bash
git diff --stat origin/{{base_branch}}...HEAD
# Only files relevant to {{issue}} should appear
```

If you accidentally modified unrelated files, remove those changes.

**Exit criteria:** Changes are clean, reviewed (Grade B or better if using /review),
and ready for build check."""

[[steps]]
id = "build-check"
title = "Build and sanity check"
needs = ["self-review"]
description = """
Verify your changes compile and pass basic sanity checks. The landing worker
runs the full gate on the merged tree; your job is to catch obvious problems
fast so a rejection does not cost a re-dispatch.

**1. Build (REQUIRED — must pass):**

If build_command is set:
```bash
{{build_command}}
```

If setup_command is set (ensure new deps are installed):
```bash
{{setup_command}}
```

If typecheck_command is set:
```bash
{{typecheck_command}}
```

Empty commands mean "not configured" — skip silently.

**2. If build fails:**
- Fix it. Return to implement step if needed.
- Do NOT submit broken code for landing.

**3. Targeted tests (OPTIONAL — run if fast and relevant):**

If you modified or added test files, run THOSE tests with a `-run` filter to
catch obvious regressions. Never a whole package of internal/cmd, daemon
or polecat (3-10 minutes each; the guard refuses it) and never the full
suite — the landing worker runs the suite once per submission and `gt done`
tests the light packages you changed (gt-pxlg).

```bash
# Run only the tests you touched, in the package you changed
go test ./internal/pkg/you/changed/ -run 'TestOne|TestTwo'
# Or for JS: npx jest --testPathPattern="changed-file"
```

Container-backed tests (Dolt, testcontainers) are opt-in and skip unless
`GT_TEST_DOCKER=1` is set, so a filtered run is bare, fast and never touches
Docker or the container-gate slot. You normally do not need them: the
landing worker runs them. If you must see one locally, opt in AND take the slot:
```bash
gt slot run --role <rig>/<your-name> -- env GT_TEST_DOCKER=1 go test ./internal/pkg/ -run TestThatOne
```

If you're unsure which tests are relevant, skip this — the landing gate will catch it.

**4. Lint (OPTIONAL — run if configured and fast):**

If lint_command is set:
```bash
{{lint_command}}
```

**Exit criteria:** Code compiles. Obvious regressions caught. Ready to submit."""

[[steps]]
id = "pre-verify"
title = "Pre-merge rebase verification"
needs = ["build-check"]
description = """
Rebase onto the target branch and run the CHEAP gates. Do not run the test
suite here: `gt done` itself lints and tests the changed packages that spin
no containers, and the landing worker runs the Docker-backed suite exactly
once per submission (gt-yihz). A polecat running test_command as well
duplicates that gate and, on the shared host, slows the landing gate down —
three concurrent suites tripled a merge gate on 2026-09-17 (gt-d7ir).

**1. Fetch and rebase onto target:**
```bash
git fetch origin {{base_branch}}
git rebase origin/{{base_branch}}
```

If rebase conflicts:
- Resolve them carefully
- Re-run the build to ensure the resolution is correct
- If stuck, `gt escalate`

After the rebase, confirm you are on YOUR branch and not a detached HEAD
(`git status` must not say "HEAD detached"); if it does:
```bash
git switch -C <your-branch>
```

**2. Run the cheap gates on the rebased result:**

If build_command is set:
```bash
{{build_command}}
```

If typecheck_command is set:
```bash
{{typecheck_command}}
```

If lint_command is set (gt done runs it again; fixing findings now saves a
round trip):
```bash
{{lint_command}}
```

**Do NOT run {{test_command}} and do NOT run whole packages.** The landing
worker runs the full suite once per submission and `gt done` tests the light
packages you changed. If you want one more signal on the rebased result, run
only the tests you touched with a `-run` filter, bare (container tests are
opt-in via GT_TEST_DOCKER=1 and skip otherwise). Never the whole suite.

Empty commands mean "not configured" — skip silently.

**3. If a gate fails after rebase:** fix the issue, commit, and re-run from
step 1.

**4. Submit with plain `gt done` (next step).** It rebases onto
{{base_branch}} again, runs the local gate and pushes. No flag skips the gate,
and the landing worker gates the merged tree again before anything lands.

**5. Confirm the branch contains only YOUR files:**
```bash
git diff --stat origin/{{base_branch}}...HEAD     # three dots
```

This is the last check before submission, and the one that catches a stale
tree. Every line of the stat should be a file you meant to touch for
{{issue}}. A file you have never heard of, or a large negative line count in
files unrelated to your change, means your tree predates work merged into
{{base_branch}} — most often because something reset onto origin/{{base_branch}}
instead of rebasing. Fix it by rebasing your CHANGES (step 1), not by
reverting anyone's work. `gt done` prints this same stat and refuses a branch
that undoes merged work.

**Exit criteria:** Branch rebased onto latest origin/{{base_branch}}, on your
own branch (not detached), the three-dot stat lists only files you changed,
build/typecheck/lint pass."""

[[steps]]
id = "submit-and-exit"
title = "Submit work and self-clean"
needs = ["pre-verify"]
description = """
Submit your work and clean up. You cease to exist after this step.

**Self-Cleaning Model:**
Once `gt done` succeeds, you're gone. The command:
1. Rebases your branch onto origin/{{base_branch}} and squashes auto-save commits
2. Runs the local gate (lint, build, the tests of the packages your branch changed)
3. Pushes your branch and marks {{issue}} ready to land
4. Exits your session

If any stage fails, `gt done` exits non-zero, names what failed, and your
session stays up: fix it, commit, and run `gt done` once more.

**Pre-flight: Verify you have actual work to submit (HARD GATE):**
```bash
git log origin/{{base_branch}}..HEAD --oneline
```
This MUST show at least 1 commit. If it shows nothing, do NOT run `gt done`.
`gt done` will reject zero-commit branches for polecats.

**Pre-flight: Tick the acceptance criteria your work satisfies.**
The landing worker rejects a bead with any `- [ ]` acceptance line left, after
your session has retired. `gt done` refuses first and lists each unchecked
line. `bd show {{issue}}` prints the current criteria; resend the whole block
with `- [x]` on each line your work satisfies:
```bash
gt bead update {{issue}} --acceptance="<the block, those lines ticked>"
```
Exit criterion: `bd show {{issue}}` shows no `- [ ]` line.

**Pre-flight: Is your bead's title still true?**
Every later reader sees a bead's title before the diff, and the title outlives
the investigation that produced it. If the work DISPROVED or changed the
title's claim — a hypothesis that did not hold, a scope that shrank or
redirected — amend the title before submitting:
```bash
gt bead update {{issue}} --title "DISPROVEN: <original claim>; <what actually shipped>"
```
Prefixing `DISPROVEN:` is the cheap default; restating the title to what
shipped is equivalent. Exit criterion: `bd show {{issue}}` no longer asserts
anything the work disproved, because the title becomes the merged commit
subject and the next reader's premise (gt-3t2).

**While gt done runs — do not touch it (gt-7dxw):**

gt done runs the local gate itself (lint, build and the tests of the packages your branch changed; no container slot), which can take several minutes. That is normal. Do not interrupt it and do not close the bead.

**Never script a retry around gt done** — no `for`/`while`/`until` loop, no
watcher, no generated retry script; the dangerous-command guard refuses the
loop shape. If gt done exits non-zero it names what failed (exit codes 10-16,
see `gt done --help`) and your session stays up: fix what it names, commit,
and run `gt done` once more. If you believe a gate failure is not caused by
your change, add a bead comment with the error, then `gt escalate -s medium`
and wait. No flag skips the gate.

**Do not run container suites yourself. Run the non-container packages, then
gt done** — the landing worker runs the container suites on the merged tree.
Before you run `gt slot run`, read the container-gate rule in `docs/reference.md`.

**Run gt done:**
```bash
# For code tasks (gt done rebases, runs the local gate, pushes and marks the
# bead ready; the landing worker runs the Docker suite on the merged tree):
gt done --target {{base_branch}}

# For report-only tasks (no commits — audits, reviews, research):
gt done --status DEFERRED
```

You should see output like:
```
✓ Local gate passed: pass (lint exit 0 …, build exit 0 …, test exit 0 …)
✓ Branch pushed to origin
✓ Submitted for landing
  Branch: polecat/<name>/<bead> @ <sha>
  Target: {{base_branch}}
  Issue:  {{issue}}
✓ Polecat session retiring after durable handoff
```

**What happens next (not your concern):**
- The daemon's landing worker merges your branch onto {{base_branch}} in a
  throwaway worktree and gates the merged tree while om reviews it
- If green and approved: it lands and closes {{issue}} with the landed commit
- If not: it writes a MERGE REJECTION note on {{issue}} and the bead is
  dispatched again for rework

You are NOT involved in any of that. You're gone. Done means gone.

**Exit criteria:** Work submitted for landing, session exited."""

[vars]
[vars.issue]
description = "The issue ID assigned to this polecat"
required = true

[vars.base_branch]
description = "The base branch to rebase on and compare against (e.g., main, integration/epic-id)"
default = "main"

[vars.setup_command]
description = "Setup/install command (e.g., pnpm install). Empty = skip."
default = ""

[vars.typecheck_command]
description = "Type check command (e.g., tsc --noEmit). Empty = skip."
default = ""

[vars.test_command]
description = "Command to run tests (auto-detected from rig settings)"
default = ""

[vars.lint_command]
description = "Command to run linting. Empty = skip."
default = ""

[vars.build_command]
description = "Command to run build. Empty = skip."
default = ""
