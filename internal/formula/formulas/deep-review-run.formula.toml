description = "mol-deep-review's work step."
formula = "deep-review-run"
type = "expansion"
version = 2

[[template]]
id = "review"
title = "Review risk-path landings, a rotating slice and its docs"
description = """
You orchestrate; subagents read.
A block that only reads the run directory starts with
`D=/tmp/deep-review-{{issue}}` (each Bash call is a fresh shell); one that creates
or redirects into it writes the literal path: the polecat-paths guard refuses a
target built from `$D`.

**1. Load the ledger and plan. The script decides; you do not.**
```bash
mkdir -p /tmp/deep-review-{{issue}}
cat {{review_script}} > /tmp/deep-review-{{issue}}/deep-review.sh &&
bd list -l {{run_label}} --all --limit 60 --json > /tmp/deep-review-{{issue}}/runs.json &&
  jq -r '(if type == "object" then .data else . end)[] | select(.id != "{{issue}}") | .notes // empty' /tmp/deep-review-{{issue}}/runs.json > /tmp/deep-review-{{issue}}/prev-notes.txt &&
  cat "${GT_TOWN_ROOT:-$HOME/gt}/.runtime/landings/{{landings_rig}}.jsonl" > /tmp/deep-review-{{issue}}/landings-all.jsonl &&
  git fetch origin {{base_branch}} &&
  bash /tmp/deep-review-{{issue}}/deep-review.sh plan --landings /tmp/deep-review-{{issue}}/landings-all.jsonl \\
    --prev-notes /tmp/deep-review-{{issue}}/prev-notes.txt --repo . --ref origin/{{base_branch}} --mode {{mode}} \\
    --slice {{slice_files}} --slice-bytes {{slice_bytes}} --run {{issue}} --out /tmp/deep-review-{{issue}} > /tmp/deep-review-{{issue}}/plan.txt
echo "plan exit: $?"; cat /tmp/deep-review-{{issue}}/plan.txt
```
The jq reads the bare array and the `BD_MACHINE=1` envelope. A non-zero plan exit
is a failure, never a quiet day (exit 3 is an untrusted input): run
`gt escalate "deep-review plan failed: <stderr>" --severity medium`, then
`gt done --status ESCALATED`.

The plan prints `quiet=`, `landings=`, `unparsed=`, and writes
`$D/landings.jsonl`, `$D/slice.txt`, `$D/docs.txt`, leaving empty what
`{{mode}}` skips. Mode `slice` also skips step 8 and step 9's `cursor:` line: no landing cursor moves.

**2. A quiet day ends here.** If `quiet=true`:
```bash
gt bead note {{issue}} "quiet: no risk-path landings since the last review"
```
Then skip to the submit step, which closes {{issue}} and runs
`gt done --status DEFERRED`.

**3. Pick up what earlier runs left.** `bash /tmp/deep-review-{{issue}}/deep-review.sh queued
--prev-notes $D/prev-notes.txt` prints confirmed findings an earlier run
recorded but did not file. Step 5 refutes each like any other finding; file
it as step 6 describes, ahead of this run's findings. A non-zero exit is an
untrusted ledger, not an empty queue: escalate as step 1 does.

**4. Review (at most {{max_reviewers}} subagents, read-only).** Reviewers read
the tree on `origin/{{base_branch}}`, not the worktree:
`git show origin/{{base_branch}}:<path>`. Split by area:
- each landing in `$D/landings.jsonl`: review `git diff <landed_commit>^1
  <landed_commit>` (a one-parent squash; `<landed_commit>^1` is its base)
  against the code on origin/{{base_branch}}. Group landings touching one
  package under one reviewer.
- the files in `$D/slice.txt`: read each whole. Open a test file only by
  grepping it (`git show origin/{{base_branch}}:<test path> | grep -n <symbol>`)
  for the symbols under review; read only matching functions. For each
  predicate the slice computes (a verdict, status, eligibility or
  `landed`/`pushed`/`idle` judgment), grep origin/{{base_branch}} for another package
  answering differently: kind `duplicate-definition`, severity P2, fingerprint
  `<file>:<symbol>:duplicate-definition`, claim naming both places and their
  difference, failure scenario an input where they disagree.
- the docs in `$D/docs.txt`: check every behavioral claim, command, flag and
  path against the code on origin/{{base_branch}}. A contradiction is a finding of
  kind `doc-drift`, severity P3, fingerprint `<doc>:<short claim anchor>:doc-drift`
  (for example `docs/INSTALLING.md:install-tree-rigs-dir:doc-drift`),
  `file:line` the contradicting code, its claim one line naming the stale text
  and ending `-> <exact replacement text>`. Docs under docs/plans, docs/design,
  docs/adr and docs/research are historical: never review them for drift.

Every reviewer prompt: read-only; never fetch or pull in
mayor/rig; cite file:line on origin/{{base_branch}}; report only a concrete
failure scenario (input or state, wrong behavior); skip style
and anything the ledger holds, `digest-only` included (`bash /tmp/deep-review-{{issue}}/deep-review.sh seen --prev-notes $D/prev-notes.txt
<fingerprint>` exits 0). A fingerprint is `<file>:<symbol>:<kind>`, one token, no
spaces. Each
finding returns fingerprint, file:line, claim (one line), failure scenario,
severity P1|P2|P3.

**5. Verify (one subagent per three findings, at most {{max_verifiers}}).**
Each verifier refutes its three: read the
cited code, trace the scenario, answer CONFIRMED or REFUTED with the deciding
lines. Refute a `duplicate-definition` by showing the two agree on every input,
or one already calls the other. Drop REFUTED, and any finding already fixed on
origin/{{base_branch}}. Past capacity, hand them out in
priority order, all P1, then all P2, then all P3 (step 3's findings first within
a severity). A finding left past capacity is never dropped: step 7 records it
unverified. Count `total`, `refuted` and
`unverified` for the digest.

**6. File the CONFIRMED findings.** Each P1 and P2 finding, P1 first, becomes one
shaped bead labelled `review-deep` with the finding's priority, whatever path it
cites: om review and the landing gate still gate the landing. A P3 finding, even a queued one, is not filed alone.
Record it, add it to the ledger file (this run's notes lack it),
then list the batches:
```bash
D=/tmp/deep-review-{{issue}}
gt bead note {{issue}} "p3: <YYYY-MM-DD> <fingerprint> <file:line> <claim>"
echo "p3: <YYYY-MM-DD> <fingerprint> <file:line> <claim>" >> /tmp/deep-review-{{issue}}/prev-notes.txt
bash /tmp/deep-review-{{issue}}/deep-review.sh batches --prev-notes $D/prev-notes.txt
```
`batches` prints `batch <package dir>` and its p3 lines. File one
bead per block: label `review-deep`, priority 3, a title naming the
package, `## Goal` listing each finding as file:line and claim, one
`## Acceptance` checkbox per finding, `## Size` one worker. A block holding
both kinds files two beads, `doc-drift` apart. A `doc-drift` bead's
`## Goal` lists each doc, the claim, the file:line that contradicts it and the
replacement text; `## Gate` says docs-only change; `## Constraints` forbid touching code.
- A finding citing a path in the repo's `internal/land/riskpaths.txt`
  (gastown: a guard, Dolt data deletion, process lifecycle or an install
  script): the bead body names that risk path in `## Constraints`.
- A `duplicate-definition` bead is titled `Consolidate: <question> is decided in
  <pkg A> and <pkg B>`, `## Goal` one shared predicate naming both call sites.
- Cap: at most {{max_beads}} beads per run, batch beads included. A P1 or P2
  finding past the cap is `queued` in step 7 and the next run files it first;
  a batch past the cap stays unfiled for the next `batches`.

Write the bead body to `/tmp/deep-review-{{issue}}/body.md` with a quoted heredoc. It needs `## Goal`, `## Constraints`, `## Out of scope`,
`## Gate` (what the landing gate runs, plus any extra test this diff needs),
`## Size`, and `## Acceptance` with 1-6 checkbox items: one item per code
finding, batch beads included, naming the test that fails before the fix and
passes after (file, test name, assertion), which `## Gate` runs. A finding with
no such test (a timing or platform risk) files anyway, `## Goal` saying why in
one sentence and its digest `filed` entry reading `no-test`. A `doc-drift` bead
needs none, keeping its docs-only gate.
```bash
gt bead create "<one line>" --type bug -p <1|2|3> -l review-deep -q \\
  -d "$(cat $D/body.md)"
gt spec lint <new id>          # must exit 0; fix the body until it does
```
With `{{dry_run}}` `true`, file nothing: every confirmed finding is `queued`.

**7. Record the findings, before any cursor.** A `finding:` line per finding a
bead covers (a batch covers each finding), a `queued:` line per P1 or P2 finding
past the cap, a `queued:` line per unverified finding (below), and a `reviewed:`
note per line of
`$D/reviewed-lines.txt` (already `reviewed: <date> <path>`) and per doc in
`$D/docs.txt` (`reviewed: <date> <doc>`):
```bash
gt bead note {{issue}} "finding: <fingerprint> <bead id | digest-only>"
gt bead note {{issue}} "queued: <fingerprint> <P1|P2|P3> <file:line> <claim>"
gt bead note {{issue}} "<one line of reviewed-lines.txt>"
gt bead comment {{issue}} "$(cat $D/digest.md)"
```
A filed bead takes a `finding:` line naming it; a P1 or P2 finding past the
cap, and every dry-run one, takes a `queued:` line, which a later run's
step 3 picks up until one names it. A P3 finding takes its `p3:`
line from step 6 and a `finding:` line once a batch covers it. An older
run's `digest-only` line makes the fingerprint `seen`.

A finding the verifiers had no capacity for takes a `queued:` line with its own
severity, whatever that is; the next run verifies it. Never leave a finding
unrecorded because it is a P3 or cheap to find again: the 21-day file
skip keeps later runs off its file. The digest has:
landings reviewed (bead, commit), `unparsed=`, slice files and docs
read, reviewers and verifiers used, then numbered `filed`, `would file` and
`queued` lists, `refuted=<n> of <total>` and `unverified=<n>` (findings past
capacity, 0 when none). When `total`>=5 and `refuted`=0,
add the line `UNCHALLENGED: no finding was refuted`.

**8. Record the reviews of the risk-path items covered** (live runs only; skip when
`{{dry_run}}` is `true` or the mode is `slice`). Per landing: `gt bead review <bead> PASS`,
or `FAIL --finding <bead>` when a CONFIRMED finding sits on a line its diff added
or changed; else PASS. A FAIL stays open, naming findings, until a later PASS.

**9. Commit the cursor, last** (not in mode `slice`). It tells the next run those
landings are covered:
```bash
gt bead note {{issue}} "cursor: <reviewed_until_new from the plan> <rotation_cursor_new from the plan>"
```

**Done when:** the plan exited 0, the digest comment, every `finding:`,
`queued:`, `reviewed:` and `p3:` line and then the `cursor:` line (none in mode
`slice`) are on {{issue}} (`bd show {{issue}}`), and (live runs) every filed bead
passed `gt spec lint`.
"""
