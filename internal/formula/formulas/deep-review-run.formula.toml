description = "mol-deep-review's work step: a daily, skip-if-quiet, read-only review of recent risk-path landings plus a rotating slice. Expands mol-polecat-work's implement step."
formula = "deep-review-run"
type = "expansion"
version = 2

[[template]]
id = "review"
title = "Review recent risk-path landings and a rotating slice"
description = """
You orchestrate; subagents read. Nothing in this step edits the repository.
Each Bash call starts a fresh shell, so a block that only reads the run
directory begins with `D=/tmp/deep-review-{{issue}}`. A block that creates it or
redirects into it writes the literal path, because the polecat-paths guard
refuses a target built from `$D`.

**1. Load the ledger and plan. The script decides; you do not.**
```bash
mkdir -p /tmp/deep-review-{{issue}}
bd list -l scheduled:deep-review --all --limit 60 --json > /tmp/deep-review-{{issue}}/runs.json &&
  jq -r '(if type == "object" then .data else . end)[] | select(.id != "{{issue}}") | .notes // empty' /tmp/deep-review-{{issue}}/runs.json > /tmp/deep-review-{{issue}}/prev-notes.txt &&
  cat "${GT_TOWN_ROOT:-$HOME/gt}/.runtime/landings/gastown.jsonl" > /tmp/deep-review-{{issue}}/landings-all.jsonl &&
  git fetch origin {{base_branch}} &&
  bash scripts/deep-review.sh plan --landings /tmp/deep-review-{{issue}}/landings-all.jsonl \\
    --prev-notes /tmp/deep-review-{{issue}}/prev-notes.txt --repo . --ref origin/{{base_branch}} \\
    --slice {{slice_files}} --out /tmp/deep-review-{{issue}} > /tmp/deep-review-{{issue}}/plan.txt
echo "plan exit: $?"; cat /tmp/deep-review-{{issue}}/plan.txt
```
This block writes the literal path: the polecat-paths guard refuses a `mkdir`
or a redirect whose target is built from a variable. The jq reads both shapes of
`bd --json`: the bare array and the `BD_MACHINE=1` envelope with its `data`
array. Run the block as written.
A plan that exits non-zero is a failure, never a quiet day: the script's
stderr says why (exit 3 is an input it cannot trust). Run
`gt escalate "deep-review plan failed: <stderr>" --severity medium`, then
`gt done --status ESCALATED`.

The plan prints `quiet=`, `landings=`, `unparsed=`, the cursors, and writes
`$D/landings.jsonl` and `$D/slice.txt`.

**2. A quiet day ends here.** If `quiet=true`:
```bash
gt bead note {{issue}} "quiet: no risk-path landings since the last review"
```
Then skip to the submit step, which closes {{issue}} and runs
`gt done --status DEFERRED`.

**3. Pick up what earlier runs left.** `bash scripts/deep-review.sh queued
--prev-notes $D/prev-notes.txt` prints confirmed findings an earlier run
recorded but did not file (over the cap, or a dry run). Send each through step 5
again, then file it as step 6 describes, ahead of this run's new findings. A
non-zero exit from that command is a ledger the script cannot trust, not an
empty queue: escalate as step 1 does and exit `ESCALATED`.

**4. Review (at most {{max_reviewers}} subagents, read-only).** The tree is
`origin/{{base_branch}}`, not the worktree: reviewers read a file with
`git show origin/{{base_branch}}:<path>`. Split the work by area, not by count:
- each landing in `$D/landings.jsonl`: review `git diff <landed_commit>^1
  <landed_commit>` (land commits are merges; the first parent is main)
  against the code on origin/{{base_branch}}. Group landings that touch the
  same package under one reviewer.
- the files in `$D/slice.txt`: read each whole file with its tests.

Every reviewer prompt carries: read-only; never fetch or pull in
mayor/rig; cite file:line on origin/{{base_branch}}; report a finding only
with a concrete failure scenario (input or state, wrong behavior); skip style;
skip anything the ledger already holds, an earlier run's `digest-only` line
included (`bash scripts/deep-review.sh seen --prev-notes $D/prev-notes.txt
<fingerprint>` exits 0). A fingerprint is
`<file>:<symbol>:<kind>`, for example
`internal/daemon/daemon.go:StopDaemon:held-lock-unlinked`. Each finding returns:
fingerprint, file:line, claim (one line), failure scenario, severity P1|P2|P3.

**5. Verify (at most {{max_verifiers}} subagents).** Hand every finding to a
verifier whose job is to refute it: read the cited code, trace the scenario,
and answer CONFIRMED or REFUTED with the lines that decide it. Drop REFUTED.
Drop a finding whose fix is already on origin/{{base_branch}}.

**6. File every CONFIRMED finding.** In priority order, P1 then P2 then P3, each
finding becomes one shaped bead:
- Crew-only paths, below: the bead carries label `crew-only`; it is never
  slung, at any severity.
- Any other path: label `review-deep` and the finding's priority.
- Cap: at most {{max_beads}} beads per run. A finding past the cap is `queued`
  in step 7, and the next run files it first.

Crew-only paths: `internal/cmd/tap_guard*`, `scripts/guards/`, data deletion in
`internal/doltserver/` and `internal/doltbackup/`, process lifecycle in
`internal/daemon/`, `internal/supervisor/`, `internal/estop/`, and the install
scripts.

Write the bead body to `/tmp/deep-review-{{issue}}/body.md` (the literal path)
with a quoted heredoc (no backticks or code in double-quoted text). It needs `## Goal`, `## Constraints`, `## Out of scope`,
`## Gate` (what the landing gate runs for this bead, plus any extra test only
this diff needs), `## Size`, and `## Acceptance` with 1-6 checkbox items:
```bash
gt bead create "<one line>" --type bug -p <1|2|3> -l review-deep -q \\
  -d "$(cat $D/body.md)"
gt spec lint <new id>          # must exit 0; fix the body until it does
```
A crew-only finding runs those two commands with `-l crew-only` in place of
`-l review-deep`.
With `{{dry_run}}` `true`, file nothing: every confirmed finding is `queued` and
the digest lists it under `would file`.

**7. Record the findings.** One line per CONFIRMED finding, before any cursor:
```bash
gt bead note {{issue}} "finding: <fingerprint> <bead id | digest-only>"
gt bead note {{issue}} "queued: <fingerprint> <P1|P2|P3> <file:line> <claim>"
gt bead comment {{issue}} "$(cat $D/digest.md)"
```
A filed bead takes a `finding:` line naming it; a finding past the cap, and
every finding of a dry run, takes a `queued:` line, which later runs pick up in
step 3 until a `finding:` line names it. `digest-only` is what a run before this
one wrote for a finding it filed no bead for: such a line stays as written, and
the fingerprint is `seen`, so the finding is not re-filed. The digest has:
landings reviewed (bead, commit), `unparsed=` from the plan, slice files read,
reviewers and verifiers used, then numbered `filed`, `would file`, `queued` and
`crew-only` lists and the count of `refuted`.

**8. Clear the risk-path items you covered** (live runs only; skip when
`{{dry_run}}` is `true`). For each reviewed landing: `gt bead review <bead>
PASS` when no CONFIRMED finding cites its paths, `gt bead review <bead> FAIL`
when one does.

**9. Commit the cursor, last.** This line is what tells the next run these
landings are covered, so it follows every line above:
```bash
gt bead note {{issue}} "cursor: <reviewed_until_new from the plan> <rotation_cursor_new from the plan>"
```

**Done when:** the plan exited 0, the digest comment, every `finding:` and
`queued:` line and then the `cursor:` line are on {{issue}} (`bd show
{{issue}}`), and (live runs) every filed bead passed `gt spec lint`.
"""
