description = "Per-rig worker monitor patrol loop.\n\nThe Witness is the Pit Boss for your rig. You watch polecats, nudge them toward\ncompletion, verify clean git state before kills, and escalate stuck workers.\n\n**You do NOT do implementation work.** Your job is oversight, not coding.\n\n## Persistent Polecat Model (gt-4ac)\n\nPolecats persist after work completion — sandbox is preserved for reuse:\n\n```\nPolecat lifecycle: spawning → working → mr_submitted → idle (sandbox preserved)\nMR lifecycle:      created → queued → processed → merged (Refinery handles)\n```\n\nOnce a polecat calls gt done and submits an MR, it transitions to idle state.\nThe MR lifecycle continues independently in the Refinery. The polecat is NOT\nnuked — its sandbox is preserved for reuse by future slings.\n\n**CRITICAL**: Do NOT nuke polecats with pending MRs. The refinery needs the\nremote branch to exist to process the merge. Nuking deletes the remote branch\nand orphans the MR. See gt-6a9d.\n\n**Key principle**: Polecat lifecycle is separate from MR lifecycle. Polecats\ngo idle after work, they are NOT destroyed.\n\n## Restart-First Policy (gt-dsgp)\n\nThe witness NEVER nukes polecats automatically. When a polecat is stuck, hung,\nor has a dead agent process, the witness RESTARTS the session instead of nuking.\nThis preserves the polecat's worktree and branch, preventing work loss.\n\n- Dead agent process → restart session\n- Stuck in gt done → restart session\n- Done polecat (bead closed) → leave alone (sandbox preserved)\n- Polecat with pending MR → leave alone (refinery handles)\n- Live agent, no recent work → RESTART ONLY WITH A POSITIVE STALL SIGNAL (see below)\n\n## Stall Judgement: \"no output\" is defined by content, never by a pane counter (gt-xb27)\n\nA restart is only justified by POSITIVE evidence that a LIVE agent has stopped\nworking. Elapsed time alone is not evidence: a polecat deep inside one long\nagentic turn writes nothing new for a while and looks enormous on every clock\nyou can see, while being perfectly healthy.\n\n**What does NOT prove a stall — never restart on any of these alone:**\n\n- **The pane's rendered elapsed label.** Claude Code draws a per-turn spinner\n  such as `Imagining… (8h 54m 38s)`. That number is the age of the CURRENT TURN,\n  not time since output. A 2026-09-17 restart of polecat opal (gt-hmaf) cited\n  exactly this string as evidence of \"hung session (no output 30+ min)\" and\n  killed a working polecat — 408 tool calls, a file write 17 minutes earlier,\n  about nine hours of context lost. Reading the spinner is the bug.\n- **Session uptime, token count, or output volume.** Asymmetric work legitimately\n  runs hours longer than its siblings. A polecat that ran 2h37m while auditing a\n  second occurrence of the bug it had just fixed was healthy the whole time.\n- **A `stalled` reading from `gt polecat list` on a polecat dispatched less than\n  a minute ago.** That is a spawn transient, not a stall.\n- **`gt nudge` reporting \"submit not verified: message stranded in composer\".**\n  That means the target is BUSY or sitting at an idle prompt; it is a false\n  negative for a working agent, and the nudges do arrive.\n- **A `Waiting for API response - will retry in Nm` banner.** That is a scheduled\n  client retry. Allow at least two minutes after it clears before judging.\n\n**What DOES prove a stall — the only admissible evidence:**\n\nSignal (a), transcript recency: the session's Claude Code transcript stopped\ngrowing. The transcript advances on real conversation events (tool calls, file\nwrites, assistant messages) and not on terminal redraws, so its mtime is \"last\nreal work\".\n\nSignal (b), pane content change: the pane's non-volatile content is unchanged.\n`gt patrol scan` prints a `pane_signature` per live session with spinner chrome,\nelapsed counters and progress percentages already stripped — an identical\nsignature means nothing on screen changed except chrome.\n\n**Procedure — a positive stall signal requires ALL of:**\n\n1. The agent process is alive. A dead agent is a different class: handle it with\n   normal zombie restart, do not call it a stall.\n2. Two observations at least **30 minutes apart**. `gt patrol scan` uses 30\n   minutes for every polecat, local-model sessions included. Do NOT apply a\n   shorter 10-minute local-model window by hand: judge only by the scan's\n   `stalled` field.\n3. The transcript did not advance between them.\n4. The pane signature is byte-identical between them.\n\nIf any condition fails you do NOT have a stall. **When in doubt, nudge — do not\nrestart.**\n\n**`gt patrol scan` applies this procedure for you (claude-8w7).** Do not hold\nsample 1 in your own context: a respawn would lose it. The scan saves sample 1\nper polecat in `<rig>/witness/stall_samples.json` and compares every later\nscan against it, re-recording it whenever the polecat shows work. Read each\nactivity item's `stalled`, `stall_reason` and `stall_sample_age_seconds`\n(`--json`), or the STALLED line in the human output. `stalled: true` is the\nonly positive stall signal; everything else, including a large\n`stall_sample_age_seconds`, is not.\n\n```bash\ngt patrol scan --json          # read stalled / stall_reason per activity item\ngt nudge --mode=queue <rig>/polecats/<name> \"Status check: what's your current step?\"\n```\n\nA nudge is free and reversible. A restart discards the agent's context and is\nnot. If the scan reports `stalled: true`, nudge, and if a later scan still\nreports it, escalate to the Mayor with the `stall_reason` and both sample\ntimes rather than restarting unilaterally — and if the agent answers the\nnudge, it was never stalled.\n\nNuking only happens via explicit `gt polecat nuke` command from a human or Mayor.\n\n## Design Philosophy\n\nThis patrol follows Gas Town principles:\n- **Discovery over tracking**: Observe reality each cycle, with minimal agent-bead state for duration tracking\n- **Beads over mail**: survey-workers discovers completion state from agent bead metadata (gt-w0br); inbox-check POLECAT_DONE is fallback only\n- **Persistent by default**: Clean polecats go idle, sandbox preserved for reuse (gt-4ac)\n- **Cleanup wisps for merge tracking**: Created when MR is pending in refinery\n- **Task tool for parallelism**: Subagents inspect polecats, not molecule arms\n- **Swim lane discipline**: Only close wisps YOU created. Wisp lifecycle for non-witness wisps is the reaper Dog's job. Report orphaned foreign wisps — never close them.\n\n## Patrol Shape (Linear)\n\n```\ninbox-check ─► process-cleanups ─► check-refinery ─► survey-workers ─► state-collapse\n                                                                             │\n         ┌───────────────────────────────────────────────────────────────────┘\n         ▼\n  check-timer-gates ─► check-swarm ─► patrol-cleanup ─► context-check ─► loop-or-exit\n```\n\nNo dynamic arms. No fanout gates. No persistent nudge counters.\nState is discovered each cycle from reality (tmux, beads, mail).\n\n## Abbreviated Patrol Mode (Idle Effort Tuning)\n\nWhen `await-signal` outputs `EFFORT: reduced`, run an ABBREVIATED patrol.\nThis happens when idle_cycles >= {{idle_effort_threshold}} (no activity detected).\n\nAbbreviated patrol rules:\n- **inbox-check**: Run `gt mail drain` only. Skip individual message processing unless drain reports new HELP messages.\n- **process-cleanups**: Skip entirely (say \"Abbreviated: skipping cleanups\").\n- **check-refinery**: Quick `gt session status` checks only. Skip queue health analysis, deacon health, and the container-gate slot check.\n- **survey-workers**: Run `gt patrol scan --notify` only. Skip orphaned bead detection.\n- **state-collapse**: Skip entirely (the full branch/MR scan is the most expensive step in the cycle and it resolves the entire open-MR queue; a collapse is created by polecat activity, and abbreviated cycles only run after sustained idleness).\n- **check-timer-gates**: Skip entirely.\n- **check-swarm-completion**: Skip entirely.\n- **patrol-cleanup**: Skip entirely.\n- **context-check**: Quick self-assessment only (one sentence).\n- **loop-or-exit**: Normal (await-signal as usual).\n\nWhen `await-signal` outputs `EFFORT: full`, run all steps thoroughly (normal mode).\n\nThe goal: idle cycles should burn ~10% of the tokens a full patrol uses."
formula = 'mol-witness-patrol'
version = 21

[vars]
[vars.wisp_type]
description = "Type of wisp created for this molecule"
default = "patrol"

[vars.idle_effort_threshold]
description = "Idle cycles before switching to abbreviated patrol (0 = always full)"
default = "1"

[vars.rig]
description = "Name of the rig this witness belongs to (e.g., gastown, laser)"
default = "UNSET_RIG"

[vars.prefix]
description = "Beads prefix for this rig (e.g., gt for gastown, la for laser)"
default = "gt"

[[steps]]
description = "> **Verify a hook by its RENDERED TITLE.** A title printed by `gt hook` or\n> `gt mol status` is the liveness proof; for a hooked MAIL use `gt mail show <id>`.\n> A `not found` from `bd show` is not evidence of a purge — `bd show <hq-id>` from\n> inside a rig was unreliable before bd 8a1eeb9 (be-v1o), so a miss there proves\n> nothing. A handoff MAIL on the hook at startup is the DESIGNED state\n> (`gt handoff <bead>` = hook + restart): read it and execute it. Run\n> `gt patrol new` only after a rendered title has proven the hook gone — it\n> replaces the hook rather than repairing it (gt-vahe).\n\nFirst, clean up CLOSED wisps from previous cycles:\n```bash\nbd mol wisp gc --closed --force --exclude-type chore\n```\n\n> **Warning (gt-0ok):** `--exclude-type chore` is REQUIRED. Plugin-run receipts are ephemeral `chore`-type beads closed immediately after creation — unscoped `--closed --force` deletes every receipt town-wide each cycle, permanently opening all cooldown gates.\n\n> **Warning (gt-5bg):** Do not run unscoped age-based wisp GC (`bd mol wisp\n> gc --age ...`) from inside this patrol. This molecule's own currently-hooked\n> patrol wisp can be older than the age threshold before this step runs\n> (e.g. after a context-exit respawn that skipped `gt patrol report`); age-based\n> GC will delete it out from under the running patrol and break the\n> report -> next-cycle chain (observed: hq-wisp-vkx). Use closed-only\n> cleanup here — stale open-wisp cleanup belongs outside active patrol\n> molecules (reaper Dog).\n\n🚨 **SWIM LANE RULE: Do NOT close wisps you didn't create.**\nWisp lifecycle management (close, delete, gc) for non-witness wisps is the\nreaper Dog's responsibility, NOT yours. If you see wisps that look orphaned\nor stale but were NOT created by your patrol, **report them — don't close them**:\n```bash\ngt mail send deacon/ -s \"NOTICE: Possibly orphaned wisps\" -m \"Found wisps that may be orphaned:\n<list wisp IDs>\nThese were NOT created by witness patrol. Reporting for reaper review.\"\n```\nClosing foreign wisps kills active polecat work molecules.\n\n## Step 0: Drain stale protocol messages (ALWAYS run first)\n\nBefore processing individual messages, bulk-drain stale protocol messages.\nThis prevents inbox backlog from consuming patrol context.\n\n```bash\ngt mail drain --identity <rig>/witness --max-age 30m\n```\n\nThis archives POLECAT_DONE, POLECAT_STARTED, LIFECYCLE:*, MERGED,\nMERGE_READY, MERGE_FAILED, and SWARM_START messages older than 30 minutes.\nHELP and HANDOFF messages are NEVER drained (they need attention).\n\nIf the drain reports > 0 archived messages, log the count and continue.\n\n## Step 1: Check inbox size and batch if needed\n\n```bash\ngt mail inbox\n```\n\n**Batch processing rule**: If inbox has > 10 messages after drain:\n- Process messages in batches by type, not one-by-one\n- Group POLECAT_DONE messages together: archive all at once\n- Group MERGED messages: close cleanup wisps, then archive batch\n- Process HELP messages individually (they need assessment)\n- Log summary counts: \"Processed 5 POLECAT_DONE, 3 MERGED, 1 HELP\"\n\n**If inbox ≤ 10 messages**: Process each individually as described below.\n\nFor each message:\n\n**POLECAT_STARTED**:\nA new polecat has started working. Acknowledge and archive.\n```bash\n# Acknowledge startup (optional: log for activity tracking)\ngt mail archive <message-id>\n```\nNo action needed beyond acknowledgment - archive immediately.\n\n**POLECAT_DONE / LIFECYCLE:Shutdown** (FALLBACK — primary discovery is via survey-workers bead scan, gt-w0br):\n\n*PERSISTENT MODEL (gt-4ac)*: Polecats persist after work completion.\nThe polecat transitions to idle state — its sandbox is preserved for reuse.\nThe MR lifecycle continues independently in the Refinery.\n\nPolecat lifecycle: spawning → working → mr_submitted → idle (preserved)\nMR lifecycle: created → queued → processed → merged (handled by Refinery)\n\n⚠️ **CRITICAL (gt-6a9d): Do NOT nuke polecats with pending MRs.**\nThe refinery needs the remote branch to merge. Nuking deletes the branch\nand orphans the MR, causing work loss.\n\nThe handler (HandlePolecatDone) will:\n1. If pending MR exists: Create cleanup wisp, send MERGE_READY to refinery\n2. If no MR: Acknowledge completion (polecat is idle)\n\n```bash\n# The handler does this automatically:\n# - With MR: create cleanup wisp + send MERGE_READY → archive mail\n# - Without MR: acknowledge → archive mail\n# - Polecat goes idle in BOTH cases — no nuke.\n```\n\nDo NOT run gt polecat nuke on POLECAT_DONE (or any automatic trigger). The polecat is idle, not dead.\nArchive the message after the handler processes it.\n\n**MERGED**:\nA branch was merged successfully. The polecat's cleanup wisp can be closed.\nThe polecat remains idle (sandbox preserved for reuse).\n\nIf a cleanup wisp exists, close it:\n```bash\n# Find the cleanup wisp for this polecat (cleanup wisps are ephemeral).\n# gt-4mnd: bd list hides ephemeral beads by default. Either form works:\n#   bd query \"ephemeral=true AND label=... AND status=open\"\n#   bd list --all --include-infra --label ... --status=open\n# Both verified to return identical ID sets. Never a bare bd list --label.\nbd query \"ephemeral=true AND label=polecat:<name> AND label=state:merge-requested AND status=open\" --json\n\n# If found, close the wisp (work is merged, cleanup tracked)\nbd close <wisp-id> --reason \"merged successfully\"\n```\nDo NOT nuke the polecat. Archive after cleanup wisp is closed.\n\n**HELP / Blocked**:\nThe handler (HandleHelp) automatically classifies the request by category and\nseverity using keyword matching. The assessment appears in the handler output.\n\n**Assessment categories and routing:**\n| Category | Severity | Route to | Trigger keywords |\n|----------|----------|----------|------------------|\n| emergency | critical | overseer | security, vulnerability, breach, data corruption, data loss |\n| failed | high | deacon | crash, panic, fatal, oom, disk full, connection refused, database error |\n| blocked | high | mayor | blocked, merge conflict, deadlock, stuck, cannot proceed |\n| decision | medium | deacon | which approach, ambiguous, unclear, design choice, architecture |\n| lifecycle | medium | witness | session, respawn, zombie, hung, timeout, no progress |\n| help | medium | deacon | (default when no keywords match) |\n\nUse the assessment as guidance, but apply your own judgment:\n1. **Can you resolve it directly?** (e.g., lifecycle issues, simple guidance) → Help and archive\n2. **Need to escalate?** → Route to the suggested target:\n```bash\ngt mail send <suggested-target>/ -s \"Escalation: <polecat> needs help\" -m \"Category: <category>\nSeverity: <severity>\n<original details>\"\n```\n3. **Override assessment if needed** — the heuristic is a starting point, not gospel.\n\nArchive after handling (escalated or resolved):\n```bash\ngt mail archive <message-id>\n```\n\n**HANDOFF**:\nRead predecessor context. Continue from where they left off.\nArchive after absorbing context:\n```bash\ngt mail archive <message-id>\n```\n\n**SWARM_START**:\nMayor initiating batch polecat work. Initialize swarm tracking.\n```bash\n# Parse swarm info from mail body: {\"swarm_id\": \"batch-123\", \"beads\": [\"bd-a\", \"bd-b\"]}\nbd create --ephemeral --wisp-type patrol --title \"swarm:<swarm_id>\" --description \"Tracking batch: <swarm_id>\" --labels swarm,swarm_id:<swarm_id>,total:<N>,completed:0,start:<timestamp>\n```\nArchive after creating swarm tracking wisp:\n```bash\ngt mail archive <message-id>\n```\n\n**Hygiene principle**: Archive messages after they're fully processed.\nKeep only: active work, unprocessed requests. Inbox should be near-empty."
id = 'inbox-check'
title = 'Process witness mail'

[[steps]]
description = "Process cleanup wisps (merge tracking and dirty state handling).\n\nCleanup wisps are created for two reasons:\n1. Pending MR: HandlePolecatDone creates a wisp in 'merge-requested' state\n   when a polecat has work in the refinery queue. These are resolved when\n   the MERGED signal arrives.\n2. Dirty state: When a polecat has uncommitted changes or unpushed commits\n   that need manual intervention.\n\n```bash\n# Find all cleanup wisps (ephemeral).\n# gt-4mnd: bd list hides ephemeral beads by default. Either form works:\n#   bd query \"ephemeral=true AND label=cleanup AND status=open\"\n#   bd list --all --include-infra --label cleanup --status=open\n# Both verified to return identical ID sets. Never a bare bd list --label.\n#\n# gt-gsrz: bd routes by cwd. This molecule's own Working Directory rule pins\n# you to the rig witness dir, but cleanup wisps live in the TOWN database —\n# querying from the rig dir silently returns 0, indistinguishable from a\n# genuinely clean rig. Scope explicitly to the town DB and filter by\n# assignee (createCleanupWisp sets --assignee=<rig>/witness on every cleanup\n# wisp at creation time; polecat NAMES collide across rigs, so never filter\n# by name alone). Pass --limit 0 — the default is 50, and a full page looks\n# exactly like a complete, clean result too.\nbd -C \"$GT_TOWN_ROOT\" query \"ephemeral=true AND label=cleanup AND status=open AND assignee={{rig}}/witness\" --limit 0 --json\n```\n\nA zero result is only trustworthy if it matches expectation: if this rig has an MR in the refinery queue (`gt refinery ready --all --json`), a cleanup wisp SHOULD exist, and zero is then evidence the query broke rather than evidence the rig is clean. If no wisps and no queued MR, skip this step (most common case in ephemeral model).\n\nFor each cleanup wisp, investigate and resolve the dirty state:\n\n## State: pending (needs investigation)\n\n1. **Extract polecat name** from wisp title/labels\n\n2. **Diagnose the problem**:\n```bash\ncd polecats/<name>\ngit status                    # What's uncommitted?\ngit stash list                # Any stashed work?\ngit log @{u}..HEAD     # Any unpushed commits?\n```\n\n3. **Resolution options**:\n   - **Uncommitted changes**: Commit and push, then nuke\n   - **Stashed work**: Pop and commit, or discard if not valuable\n   - **Unpushed commits**: Push to origin, then nuke\n   - **All valuable work lost**: Escalate to Deacon for recovery\n\n4. **If resolvable locally**: Fix and nuke\n```bash\n# Example: push unpushed commits\ngit push origin HEAD\n\n# Then nuke\ngt session restart <rig>/<name>\n\n# Close the wisp\nbd close <wisp-id> --reason \"Resolved: pushed commits, nuked\"\n```\n\n5. **If needs escalation**: Send RECOVERY_NEEDED to Deacon\n```bash\ngt mail send deacon/ -s \"RECOVERY_NEEDED <rig>/<polecat>\" \\\n  -m \"Cleanup Status: <status>\nBranch: <branch>\nIssue: <issue-id>\n\nCannot auto-resolve. Please advise.\"\n```\nLeave wisp open until Deacon resolves.\n\n## State: merge-requested (legacy, rare)\n\nThis state was used before the ephemeral model. If found, the polecat is\nwaiting for a MERGED signal. The inbox-check step handles these.\n\n**Parallelism**: Use Task tool subagents to process multiple cleanups concurrently.\nEach cleanup is independent - perfect for parallel execution."
id = 'process-cleanups'
needs = ['inbox-check']
title = 'Process pending cleanup wisps'

[[steps]]
description = "Check refinery, mayor, and deacon health.\n\n**Step 1: Check refinery session**\n```bash\ngt session status <rig>/refinery\n```\n\nIf MRs waiting AND refinery not running:\n```bash\ngt session start <rig>/refinery\ngt mail send <rig>/refinery -s \"PATROL: Wake up\" -m \"Merge requests in queue. Please process.\"\ngt mol step emit-event --channel refinery --rig <rig> --type PATROL_WAKE \\\n  --payload source=witness --payload queue_depth=<N>\n```\n\n**Event emission**: Always emit a file event when waking the refinery.\nThis ensures the refinery's `await-event` unblocks instantly instead of\nwaiting for its next timeout cycle.\n\n**Composer stall (gt-hkhu)**: a refinery can pass every liveness check and\nstill be doing nothing. It has no heartbeat, so a session holding an\nunsubmitted instruction reads as running — the gastown refinery idled 78 and\n100+ minutes that way on 2026-09-18 with MRs aging in the queue behind it.\n`gt patrol scan` covers this in its `refinery` section: it submits input a\nfrozen session is holding and reports the result.\n\n- No entry, or `checked 1` with no stalls → healthy. Nothing to do.\n- Action `submitted-queued-input` / `submitted-pending-input` → the input was\n  submitted and the refinery should resume on its own. Confirm on the next\n  cycle that the queue moved.\n- Action `still-pending` → the keystroke did not free the composer. Restart\n  the refinery (`gt refinery restart <rig>`, the operator's interim fix) and\n  escalate.\n\n⚠️ **Do NOT diagnose a stall from pane shape.** A non-empty input box with a\n\"ctrl+x ctrl+s to send now\" footer is also what a healthy idle-await refinery\nshows between cycles for a nudge it is about to consume — and the gt nudge\n`submit not verified: message stranded in composer` error fires against those\nsame healthy targets. Both were live false positives on 2026-09-18. The scan\nrequires unsubmitted input AND a full 5 minutes with no pane output at all;\ntrust its verdict rather than re-diagnosing with `gt peek`.\n\n**Step 2: Queue health analysis**\n\nRun the full queue view to get raw data for every open MR:\n```bash\ngt refinery ready --all --json\n```\n\nThis returns all open MRs with timestamps, assignees, and branch existence data.\nUse your judgment to assess the queue — there are no hardcoded thresholds.\n\n**What to look for:**\n\n- **Stale claimed MRs**: MRs with a non-empty `Assignee` but old `UpdatedAt`.\n  Consider the queue size, time of day, and typical processing time.\n  A claimed MR that hasn't been updated in a while may indicate a stuck refinery.\n\n- **Orphaned branches**: MRs where both `BranchExistsLocal` and `BranchExistsRemote`\n  are false. The source branch may have been deleted while the MR bead is still open.\n  These likely need to be closed or investigated.\n\n- **Queue depth**: A large number of unclaimed MRs may indicate the refinery is down\n  or overwhelmed. Consider waking it or escalating.\n\n**Step 3: Check mayor health**\n\n⚠️ **The mayor may be running via Agent Client Protocol (ACP)** instead of tmux.\nUse the built-in status check which is ACP-aware:\n\n```bash\ngt mayor status --running\n```\n\nIf `false`, the mayor is dead. Escalate via `gt escalate` (severity HIGH):\n```bash\ngt escalate -s HIGH \"Mayor dead - session not found (TMUX or ACP)\"\n```\n\n**Step 4: Check deacon health (gt-p7k: heartbeat-aware dead-check)**\n\n⚠️ **The deacon tmux session is named `hq-deacon`** (NOT `deacon`).\nTown-level agents use the `hq-` prefix.\n\nUse `gt deacon status --json` to check BOTH session existence AND heartbeat freshness.\nDo NOT alert based on session absence alone — the daemon may be restarting the deacon,\nwhich causes a brief window where the session is down but the heartbeat is still fresh.\n\n```bash\ngt deacon status --json\n```\n\nInterpret the JSON output:\n- `running: true` → Deacon is alive. No action needed.\n- `running: false` AND heartbeat `fresh: true` (age < 5 min) → Deacon is likely\n  restarting (daemon killed a stuck session and is respawning). **Do NOT alert.**\n  Log the observation and move on. The daemon handles restart automatically.\n- `running: false` AND heartbeat `stale: true` or `very_stale: true` (age >= 5 min)\n  → Deacon is genuinely down. Escalate to Mayor:\n```bash\ngt mail send mayor/ -s \"ALERT: Deacon session hq-deacon is down\" \\\n  -m \"Deacon tmux session (hq-deacon) not found.\nHeartbeat age: <age_seconds>s (stale).\nDetected during witness patrol.\nPlease restart the deacon.\"\n```\n- `running: false` AND no heartbeat (heartbeat field is null) → Deacon has never\n  started or heartbeat file is missing. Escalate to Mayor.\n\nThis prevents false DEACON_DOWN alerts during brief restart windows.\n\n**Step 5: Check container-gate slot for unwrapped suites (gt-tuiy)**\n\nContainer-backed suites (Dolt, testcontainers) that bypass `gt slot run`\nnever take the token but still occupy the shared Docker VM, starving\nwhatever suite IS holding the slot.\n\n```bash\ngt slot status\n```\n\nIf it reports free, or held by a known role, no action needed.\n\nIf it reports \"BUSY — unwrapped container suite detected\", identify the\noffending host process and file a finding with its pid and cwd — this is a\nprocess that started Dolt/testcontainers without going through `gt slot run`:\n```bash\ndocker ps --format '{{.Image}} {{.Names}} {{.RunningFor}}'   # confirm what's up\nps aux | grep -E 'go test|make test|testcontainers' | grep -v grep   # candidate host pids\nlsof -a -d cwd -p <candidate-pid>   # resolve that pid's cwd\n```\n\nFile the finding (do NOT kill the process — an in-flight suite is real work;\nfiling the finding is enough):\n```bash\nbd create --title \"Unwrapped container suite detected (pid <pid>, cwd <cwd>)\" \\\n  --type bug --priority 2 \\\n  --description \"gt slot status reported BUSY with an unwrapped container suite. docker ps: <output>. Host pid: <pid>. cwd: <cwd>. This suite bypassed gt slot run.\"\n```\n\n**Step 6: Escalate if needed**\n\nIf you identify problems, escalate to Deacon with specific MR IDs and context:\n```bash\ngt mail send deacon/ -s \"QUEUE_HEALTH: <summary>\" \\\n  -m \"MR IDs: <ids>\nObservation: <what you found>\nRecommendation: <what should happen>\"\n```"
id = 'check-refinery'
needs = ['process-cleanups']
title = 'Check refinery, mayor, and deacon health'

[[steps]]
description = "Survey all polecats for zombies, stalls, and completions.\n\n🚨 **MANDATORY: You MUST run `gt patrol scan` for zombie detection.**\nDo NOT improvise with `gt polecat list`, `gt peek`, or manual tmux checks.\nThe Go-side scan uses HasSession() liveness checks that are precise and\ncomprehensive. Ad-hoc interpretation of peek output WILL miss zombies.\n\n## Step 1: Run `gt patrol scan` (REQUIRED — not optional)\n\n```bash\ngt patrol scan --notify\n```\n\nThis single command performs ALL detection:\n- **Zombie detection**: Cross-references agent bead state with tmux sessions.\n  Dead sessions with active state → restarted. Dead agent processes → restarted.\n  Dirty state → cleanup wisp created.\n- **Stall detection**: Finds agents stuck at startup prompts and auto-dismisses.\n- **Completion discovery**: Scans agent beads for `exit_type` + `completion_time`\n  metadata written by `gt done`. Routes completions (MR → cleanup wisp + refinery\n  nudge; no MR → acknowledge idle). Clears metadata to prevent re-processing.\n\nUse `--json` for machine-readable output.\n\n## Step 2: Review scan output and handle follow-ups\n\nThe scan output tells you exactly what was found and what actions were taken.\nReview it for items needing manual follow-up:\n- Stuck polecats that need nudging\n- Escalations that need routing\n- Dirty state that needs investigation\n\n## Step 3: Nudge running polecats with no recent progress\n\nThe scan's `Real Activity` section reports, per live session, when real work last\nhappened and the pane signature to compare against. Use it: a polecat whose last\nreal activity is older than the threshold (or that has no transcript) is a\nCANDIDATE for inspection, not a verdict.\n\nNudge candidates — do not restart them:\n```bash\ngt nudge --mode=queue <rig>/polecats/<name> \"How's progress? Need help?\"\n```\n\nOnly an activity item with `stalled: true` is a positive stall signal: the scan\ncompared it against the sample 1 it persisted a full window earlier and found\nan unchanged `pane_signature` AND an unadvanced transcript. See \"Stall\nJudgement\" above for the complete rule and the list of signals that are NOT\nevidence. A long-running turn is the normal explanation for\nan old-looking polecat, and a restart throws it away.\n\n## Step 4: Escalate unresolvable issues\n\nIf the scan found issues it couldn't auto-resolve:\n```bash\ngt mail send deacon/ -s \"Escalation: <polecat> stuck\" \\\n  -m \"Polecat <name> reports stuck. Please intervene.\"\n```\n\n## Step 5: Orphaned bead detection (scan from beads side)\n\n🚨 Once a polecat is nuked and its directory removed, its beads become invisible\nto zombie detection. Scan from beads to catch this:\n\n```bash\nbd list --status=in_progress --json --limit=0\nbd list --status=hooked --json --limit=0\n```\n\nFor each in_progress or hooked bead with a polecat assignee:\n1. Verify bead status is still in_progress/hooked (not closed since listing).\n   If closed, skip — the polecat completed its work. (gt-sy8)\n2. Only check beads assigned to polecats in YOUR rig\n3. Check tmux session: `gt session status <rig>/<name> --json | jq -r '.running'`\n4. Check polecat directory: `ls <rig>/polecats/<name> 2>/dev/null`\n5. If BOTH session dead AND directory missing → orphan. Before any reset, check\n   whether the bead's work survives on a polecat branch (gt-vm5g4):\n   ```bash\n   gt polecat surviving-work <bead-id>\n   ```\n   Labels on the bead are the memory between cycles:\n   - `gt:preserved-orphan`: the mayor was told this orphan's work survives.\n   - `gt:survival-unknown`: the last answer was \"cannot tell\".\n   - `gt:survival-escalated`: this run of \"cannot tell\" answers was escalated.\n\n   A definite answer (exit 0 or 3) ends a \"cannot tell\" run: clear both\n   survival labels, so the next run starts over and escalates again. Each\n   label write is guarded by a `grep`, so a quiet cycle writes nothing. Write\n   the IDs into the commands literally. Heredocs are quoted, so the shell\n   expands nothing in them (gt-reafp).\n   - **Exit 0** (prints a branch) → the work survives. Do NOT reset: keep the bead\n     hooked. Clear the survival labels, then tell the mayor once and add\n     `gt:preserved-orphan`:\n     ```bash\n     bd show <bead-id> --json | grep -q '\"gt:survival-unknown\"' \\\n       && bd update <bead-id> --remove-label gt:survival-unknown\n     bd show <bead-id> --json | grep -q '\"gt:survival-escalated\"' \\\n       && bd update <bead-id> --remove-label gt:survival-escalated\n     bd show <bead-id> --json | grep -q '\"gt:preserved-orphan\"' || {\n       gt mail send mayor/ -s \"PRESERVED_ORPHAN: <bead-id>\" --stdin <<'EOF'\n     Bead <bead-id> is hooked to <rig>/polecats/<name>, which no longer exists.\n     Its work survives on branch <branch>. Resume it:\n       gt sling <bead-id> <rig> --branch <branch>\n     EOF\n       bd update <bead-id> --add-label gt:preserved-orphan\n     }\n     ```\n     Resetting would let a fresh polecat start from main over that work (gt-ibt8).\n   - **Exit 3** → no surviving work. Clear the survival labels, then reset the\n     bead, guarded on the dead polecat still holding it. Only when the reset\n     succeeds, remove `gt:preserved-orphan`, so a later orphan run tells the\n     mayor again, and tell the deacon:\n     ```bash\n     bd show <bead-id> --json | grep -q '\"gt:survival-unknown\"' \\\n       && bd update <bead-id> --remove-label gt:survival-unknown\n     bd show <bead-id> --json | grep -q '\"gt:survival-escalated\"' \\\n       && bd update <bead-id> --remove-label gt:survival-escalated\n     bd update <bead-id> --status=open --assignee= --if-assignee=<rig>/polecats/<name> && {\n       bd show <bead-id> --json | grep -q '\"gt:preserved-orphan\"' \\\n         && bd update <bead-id> --remove-label gt:preserved-orphan\n       gt mail send deacon/ -s \"ORPHAN_RECOVERED: <bead-id>\" --stdin <<'EOF'\n     Bead <bead-id> was assigned to <rig>/polecats/<name>, which no longer exists.\n     The bead has been reset to open with no assignee.\n     Please re-dispatch it to an available polecat.\n     EOF\n     }\n     ```\n     A failed reset (exit 13: someone else holds the bead now) changes nothing\n     more.\n   - **Any other exit** (2 = cannot tell, or any error) → do NOT reset. Keep the\n     bead hooked and check again next cycle. Escalate once per run of \"cannot\n     tell\" answers: on the second cycle in a row, escalate and add\n     `gt:survival-escalated`; while that label is present, do not escalate\n     again:\n     ```bash\n     if bd show <bead-id> --json | grep -q '\"gt:survival-escalated\"'; then\n       : # already escalated this run; wait for a definite answer\n     elif bd show <bead-id> --json | grep -q '\"gt:survival-unknown\"'; then\n       gt escalate -s MEDIUM \"Cannot verify surviving work for orphaned bead <bead-id> (2 cycles)\" \\\n         && bd update <bead-id> --add-label gt:survival-escalated\n     else\n       bd update <bead-id> --add-label gt:survival-unknown\n     fi\n     ```\n6. If directory exists but session dead → skip (scan already handled it)\n7. If session alive → not an orphan, skip\n\n---\n\n**DO NOT use manual detection.** `gt patrol scan` replaces all manual\ncross-referencing of agent beads, tmux sessions, and git state. The Go code\nin internal/witness/handlers.go (DetectZombiePolecats / detectZombieDeadSession)\nis correct and comprehensive — it checks tmux session liveness, heartbeat\nfreshness, pending MRs, terminal states, and spawning grace periods.\n\nIf `gt patrol scan` fails with an error, fix the error or escalate — do NOT\nfall back to manual detection, which is unreliable."
id = 'survey-workers'
needs = ['check-refinery']
title = 'Inspect all active polecats'

[[steps]]
description = "Detect state collapse: an issue recorded as done while the fix it describes is not in force.\n\nA collapse is silent by construction — the issue shows CLOSED, so nothing else in the cycle looks at it. Two independent failure modes, both covered by one command:\n\n- **MR-driven (gt-zzd)**: the source issue is CLOSED while the merge-request created to land its fix is still OPEN in the queue.\n- **Branch-driven (gt-3ii)**: the source issue is CLOSED, its polecat branch never reached the target, and no open MR covers it. Strictly worse: there is no queue entry acting as a reminder, and nothing in the system will ever land the fix.\n\n## Step 1: Run the detector\n\n```bash\ngt patrol state-collapse\n```\n\n`--json` for machine-readable output; `--rig <rig>` to scan a rig other than the current one.\n\n## Step 2: Read the summary line before the findings\n\n- `✓ <rig>: No state collapse found (checked N open MR(s) — lookup ran; M closed-issue branch(es) checked)` — the scan ran and is clean. Nothing to do.\n- `⚠ <rig>: Found N state collapse(s) ...` — findings follow, one line each.\n- `  - <issue> is CLOSED but <mr> is still <status> ...` — an MR-driven finding.\n- `  - <issue> is CLOSED but branch <branch> was never merged and no open MR covers it ...` — a branch-driven finding.\n- `  ~ <issue>: branch <branch> suppressed — issue's record names <mr> as carrying the fix forward` — NOT a finding. A candidate the scan examined and adjudicated as superseded (either a rejected attempt resubmitted through the queue, or a close reason naming a later issue/MR whose fix is verified in force); printed so the suppression stays visible. No action.\n\n🚨 **A ⚠ with no findings is not a clean result — it means the scan could not run.** When the open merge-request queue cannot be resolved, both detectors decline to judge and the summary says so *in place of* an all-clear (gt-akap, gt-92ry). A scan that never resolved the queue examined nothing, and \"checked and clean\" must never read the same as \"never ran\". Escalate the unavailability:\n\n```bash\ngt escalate -s HIGH \"gt patrol state-collapse: MR lookup unavailable — <rig>\"\n```\n\n## Step 3: Do NOT re-escalate findings\n\nEach finding has already been reported by the command itself: it appends a `STATE-COLLAPSE` comment to the source issue and mails the rig's mayor (urgent priority) with the branch, the target, and a copy-pasteable at-source verification command. Adding your own escalation for the same finding doubles the mail for every finding on every cycle — a mail storm aimed at the mayor, where each message is also a permanent Dolt commit. Add nothing.\n\nFollow up only when:\n\n- the summary reports the scan could not run (Step 2), or\n- the SAME finding is still reported a full cycle later, after the mayor has had a cycle to act on the first report. That means the report is not being picked up. Confirm it at source FIRST — the command's mail carries the exact check for the finding it sent. The branch-driven check reasons from git state, which cannot see a fix that landed under a different issue token unless the close reason names the successor (gt-xpro fixed the named-successor case; an un-attributed supersession is still invisible to git state), so a finding that fails to reproduce at source is the detector's error, not a strand: file it, do not escalate it. Escalate only what still fails at source, citing the issue ID and the number of cycles it has persisted.\n\n**Exit criteria**: the detector ran, every finding is understood as either the command's own already-delivered report or a refused verdict, and nothing was re-escalated without a cycle of inaction behind it."
id = 'state-collapse'
needs = ['survey-workers']
title = 'Detect state collapse (closed issues whose fix is not in force)'

[[steps]]
description = "Check for expired timer gates and escalate as needed.\n\nTimer gates are async wait conditions with a timeout. When the timeout expires,\nthe gate should be escalated to the overseer for human intervention.\n\n**Step 1: Run timer gate check**\n```bash\nbd gate check --type=timer --escalate\n```\n\nThis command:\n1. Finds all open gate issues with await_type=timer\n2. Checks if `now > created_at + timeout`\n3. Escalates expired gates via `gt escalate` (HIGH severity)\n4. Reports summary of gate status\n\n**Step 2: Review output**\n\nIf expired gates were found and escalated:\n- The escalation creates an audit trail bead\n- Overseer will be notified via mail\n- Gate remains open until manually resolved\n\nIf no expired gates:\n- Continue patrol normally\n\n**Note**: Timer gates do NOT auto-close on expiration. They escalate.\nThis ensures human oversight of timeout conditions.\n\n**Parallelism**: This is a single command, no parallel execution needed."
id = 'check-timer-gates'
needs = ['state-collapse']
title = 'Check timer gates for expiration'

[[steps]]
description = "If Mayor started a batch (SWARM_START), check if all polecats have completed.\n\n**Step 1: Find active swarm tracking wisps**\nSwarm tracking wisps are ephemeral. gt-4mnd: bd list hides ephemeral beads\nby default. Either form works: bd query \"ephemeral=true AND label=swarm AND\nstatus=open\" or bd list --all --include-infra --label swarm --status=open.\nBoth verified to return identical ID sets. Never a bare bd list --label.\n```bash\nbd query \"ephemeral=true AND label=swarm AND status=open\" --json\n```\nIf no active swarm, skip this step.\n\n**Step 2: Count completed polecats for this swarm**\n\nExtract from wisp labels: swarm_id, total, completed, start timestamp.\nCheck how many cleanup wisps have been closed for this swarm's polecats.\n\n**Step 3: If all complete, notify Mayor**\n```bash\ngt mail send mayor/ -s \"SWARM_COMPLETE: <swarm_id>\" -m \"All <total> polecats merged.\nDuration: <minutes> minutes\nSwarm: <swarm_id>\"\n\n# Close the swarm tracking wisp\nbd close <swarm-wisp-id> --reason \"All polecats merged\"\n```\n\nNote: Runs every patrol cycle. Notification sent exactly once when all complete."
id = 'check-swarm-completion'
needs = ['check-timer-gates']
title = 'Check if active swarm is complete'

[[steps]]
description = "Verify inbox hygiene before ending patrol cycle.\n\n**Step 1: Run drain to catch any protocol messages that arrived during patrol**\n```bash\ngt mail drain --identity <rig>/witness --max-age 30m\n```\nThis catches protocol messages that accumulated while you were processing\nother patrol steps.\n\n**Step 2: Check inbox state**\n```bash\ngt mail inbox\n```\n\nIn the persistent model, POLECAT_DONE messages create cleanup wisps and\nsend MERGE_READY to refinery. Inbox should contain ONLY:\n- Unprocessed messages (just arrived, will handle next cycle)\n- MERGED notifications (close cleanup wisp, then archive)\n\n**Step 3: Archive any remaining stale messages**\n\nLook for messages that were processed but not archived:\n- HELP/Blocked that was escalated → archive\n- Any other processed messages still in inbox → archive\n\n```bash\n# For each stale message found:\ngt mail archive <message-id>\n```\n\n**Step 4: Verify cleanup wisp hygiene**\n\nIn the persistent model, cleanup wisps track pending MRs and dirty state.\nThey are ephemeral. gt-4mnd: bd list hides ephemeral beads by default.\nEither form works: bd query \"ephemeral=true AND label=cleanup AND\nstatus=open\" or bd list --all --include-infra --label cleanup --status=open.\nBoth verified to return identical ID sets. Never a bare bd list --label.\n\ngt-gsrz: same cwd-routing hazard as process-cleanups — cleanup wisps live in\nthe TOWN database, not the rig dir this molecule pins you to. Use the same\nscoped query (see process-cleanups for the full rationale): scope to the\ntown DB, filter by assignee (not polecat name, which collides across rigs),\nand pass --limit 0.\n```bash\nbd -C \"$GT_TOWN_ROOT\" query \"ephemeral=true AND label=cleanup AND status=open AND assignee={{rig}}/witness\" --limit 0 --json\n```\n\n- state:pending → Needs investigation in process-cleanups\n- state:merge-requested → Legacy state, handle in inbox-check\n\nA zero result here is only trustworthy if it matches expectation — cross-check\nagainst any MRs actually in the refinery queue before reading it as clean.\nIf cleanup wisps are accumulating, investigate why polecats aren't clean.\n\n**Goal**: Inbox should be nearly empty. Cleanup wisps should be rare."
id = 'patrol-cleanup'
needs = ['check-swarm-completion']
title = 'End-of-cycle inbox hygiene'

[[steps]]
description = "Check own context usage.\n\nIf context is HIGH (>80%):\n- Ensure any notes are written to handoff mail\n- Prepare for session restart\n\nIf context is LOW:\n- Can continue patrolling"
id = 'context-check'
needs = ['patrol-cleanup']
title = 'Check own context limit'

[[steps]]
description = """
End of patrol cycle decision.

**If context LOW** (can continue patrolling):

Resolve your agent bead ID for this patrol cycle. Verify your agent bead exists before subscribing:
```bash
YOUR_AGENT_BEAD=$(gt agents resolve --role witness --rig {{rig}})
```
This must resolve exactly one bead ID. If it fails, STOP and report the error. If it reports multiple results, STOP and report the ambiguity — manual disambiguation is required.

Then use await-signal with exponential backoff to wait for activity:

```bash
gt mol step await-signal --rig {{rig}} --agent-bead "$YOUR_AGENT_BEAD" \
  --backoff-base 30s --backoff-mult 2 --backoff-max 5m
```

This command:
1. Subscribes to the town events feed (`~/gt/.events.jsonl`)
2. Returns IMMEDIATELY on {{rig}} activity — an event from a {{rig}} agent, or one
   addressed to {{rig}} (mail or nudge to you, a sling onto one of your polecats)
3. Ignores other rigs' activity (gt-qwfp), so an idle {{rig}} reaches the cap below
4. If no {{rig}} activity, times out with exponential backoff:
   - First timeout: 30s
   - Second timeout: 60s
   - Third timeout: 120s
   - ...capped at 5 minutes max
5. Tracks `idle:N` label on your agent bead for backoff state: a timeout
   increments it, a signal resets it to 0
6. Outputs `EFFORT: reduced` or `EFFORT: full` directive for next cycle

**On signal received** (activity detected):
await-signal has already reset the idle counter to 0. Start the next patrol
cycle. Only if its output shows `Failed to reset agent bead idle count`, reset
it by hand:
```bash
gt agents state "$YOUR_AGENT_BEAD" --set idle=0
```

**On timeout** (no activity):
The idle counter was auto-incremented. Continue to next patrol cycle
(the longer backoff will apply next time).

## Effort-Based Patrol Routing

After await-signal returns, check the EFFORT directive in the output:

**If `EFFORT: full`** — Run all steps thoroughly (normal patrol).

**If `EFFORT: reduced`** — Run ABBREVIATED patrol:
- inbox-check: `gt mail drain` only, skip individual messages unless HELP found
- process-cleanups: SKIP
- check-refinery: Quick session status checks only
- survey-workers: `gt patrol scan --notify` only, skip orphan bead detection
- state-collapse: SKIP
- check-timer-gates: SKIP
- check-swarm-completion: SKIP
- patrol-cleanup: SKIP
- context-check: One-sentence self-assessment

Abbreviated patrol should complete in ~10% of the tokens of a full patrol.
If you pass `--steps`, every entry needs a `:STATUS` suffix — executed steps
get OK, skipped steps get SKIP. A bare step id is rejected, not silently
counted (gt-gvo8m).

After await-signal returns (either by signal or timeout):
1. Generate a brief summary of this patrol cycle's observations
2. Close current patrol and start next cycle:
```bash
gt patrol report --summary "<brief summary of patrol observations>"
```
This closes the current patrol wisp and automatically creates a new one.
3. Continue executing from the first step of the new patrol cycle

**A respawn may follow a quiet report (claude-8w7).** When the rig sets
`witness.cycle_session_at_idle_cap`, `gt patrol report` itself may respawn this
session right after the report: when this cycle's await-signal timed out at
the 5m cap and the session has run at least 3 cycles, or after 8 cycles
whatever the wait did. It prints `session kept: <cause>` when it does not.
You do not need to do anything either way: do not hand off, write notes or
wait for it. Everything the next session needs is already outside your
context (stall samples, `idle:N`, the patrol wisp, mail, queued nudges), and
the fresh session starts from `gt prime`. The report is always the LAST
command of a cycle, so nothing is lost when the pane is replaced. With this
setting on, await-signal does not print queued nudges: the report prints them
when it keeps the session, and leaves them queued for the next session when it
respawns. Handle any nudges the report prints before the next cycle.

**If context HIGH** (approaching limit):
1. Write handoff mail with notable observations:
```bash
gt handoff -s "Witness patrol handoff" -m "<observations>"
```
2. Exit cleanly - the daemon will respawn a fresh Witness session

**NOTE (gt-058d)**: `gt handoff` enforces a minimum 2-minute cooldown between
handoffs. If the previous handoff was less than 2 minutes ago, the command
will sleep until the cooldown expires before proceeding. This prevents tight
restart loops when the rig is idle and patrols complete quickly.

**IMPORTANT**: You must either report and loop (context LOW) or exit (context HIGH).
Never leave the session idle without work on your hook.
"""
id = 'loop-or-exit'
needs = ['context-check']
title = 'Loop or exit for respawn'
