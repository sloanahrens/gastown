description = """
Reap stale wisps and close stale issues across all Dolt databases.

The Reaper Dog executes this formula to clean up wisp and issue tables.
SQL operations are exposed via `gt reaper` CLI helpers — the Dog calls
these commands, inspects results, and uses judgment for anomalies.

## Dog Contract

This is infrastructure cleanup work:
1. Scan all production databases for candidates
2. Reap (close) wisps past max_age whose parent is closed/missing, plus step-wisps whose parent molecule is already closed
3. Purge (delete) closed wisps past purge_age + old closed mail
4. Auto-close stale issues (>stale_issue_age, not P0/P1, not infrastructure
   types/agent beads, no active deps) — dry-run and echo the count first, hand
   the dry run's preview hash to the live run, and skip entirely when
   auto_close=false
5. Close completed convoys via `gt convoy check` (tracked-bead status, never staleness)
6. Report findings and flag anomalies

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| max_age | config | Max wisp age before reaping (default 24h) |
| purge_age | config | Max closed wisp age before purging (default 7d) |
| stale_issue_age | config | Max issue staleness before auto-close (default 30d) |
| mail_delete_age | config | Max closed mail age before purging (default 7d) |
| auto_close | config | If "false", SKIP the auto-close step entirely (default: run it) |
| alert_threshold | config | Open wisp count that triggers escalation (default 3000) |
| dry_run | config | If "true", report without acting |
| databases | config | Comma-separated DB list (default: auto-discover) |
| db_delay | config | Delay between databases to reduce Dolt load (default 250ms) |

## Safety

Reaping closes wisps — reversible (can reopen). Purging deletes rows — irreversible
but only targets already-closed wisps past retention.

Auto-close is the one destructive step that writes to the durable issue tracker,
so it carries the whole of the 2026-09-16 mis-close (gt-2qzr, 102 beads) as its
guard rails. It only targets issues that are not P0/P1, not an infrastructure
type (epic, convoy, molecule, rig, agent, event), not an agent or infrastructure
bead by label or id pattern, and have no active dependencies. On top of that:

- `gt reaper auto-close` REFUSES a stale-age below 7d. Never work around a
  refusal — a refusal IS the designed stop.
- It REFUSES a run whose candidate count exceeds `--max-closes` (default 20 per
  database). Nothing is closed on a refusal.
- daemon.json `patrols.wisp_reaper.auto_close=false` disarms the step. Do not
  pass `--force`.
- It REFUSES a live run that does not carry the preview hash of the set it is
  about to close (`--preview=<hash>`, gt-39bu). The live command refuses on its
  own, so the writing stays behind the counting whatever order the two commands
  were run in. Do not pass `--force` to get past it — re-run the dry run.
- **Dry run first, every run.** Run `gt reaper auto-close --dry-run` and report
  the candidate count before running it for real. If the count is a surprise,
  stop and escalate — do not run it live "to see".

## Scope Boundary (gt-61x, enforced at runtime since gt-9iv)

This formula's writes are limited to wisp/issue/mail ROWS via the `gt reaper`
and `gt convoy check` commands listed in the steps. The command_allowlist
declared below is ENFORCED by the dog session's formula-allowlist guard:
shell commands outside the allowlist (plus the standard dog lifecycle
baseline) are blocked before they run. Database-level operations
are OUT OF SCOPE for this formula:

- NEVER run `gt dolt cleanup` (with or without --force)
- NEVER drop, remove, or delete database directories by any means
- NEVER bypass a refusal from a safety check (a refusal IS the designed stop)

If orphan databases or other database-level problems surface during a run,
report them and escalate to the mayor (`gt escalate`) — do not act on them.
Forced cleanup by agents requires recorded authorization
(`gt dolt cleanup --force --authorized-by <bead-id>`), and databases under an
open hold bead (label `dolt-hold:<dbname>` or blanket `dolt-hold`) are
excluded from cleanup regardless.

## Anomaly Detection

The Dog should watch for and flag:
- Dangling parent references (wisps referencing purged parents)
- Sudden spikes in reap candidates (suggests a wisp lifecycle problem)
- Open wisp counts exceeding alert_threshold
- Dolt commit failures (data may not be persisted)

NOT anomalies (do NOT escalate these):
- Scan/reap count mismatch (scan finds N, reap closes M < N): this is a benign
  race condition — the witness closes wisps for dead sessions concurrently.
  This is expected behavior, not a bug."""
formula = "mol-dog-reaper"
version = 5

# Enforced command allowlist (gt-9iv): dog sessions executing this formula may
# only run these commands, plus the built-in dog lifecycle baseline
# (gt hook/prime/dog done/nudge/escalate, bd basics, read-only utilities).
# See the Scope Boundary section above; escalate instead of working around it.
command_allowlist = [
	"gt reaper",
	"gt convoy check",
	"gt convoy list",
	"gt escalate",
	"gt dog done",
]

[squash]
trigger = "on_complete"
template_type = "work"
include_metrics = true

[[steps]]
id = "scan"
title = "Scan databases for reaper candidates"
description = """
Discover databases and count candidates for each operation.

**1. List databases to scan:**
```bash
gt reaper databases --json
```
Or use configured database list from {{databases}} variable.

**2. Scan each database:**
```bash
gt reaper scan --db=<name> \\
  --max-age={{max_age}} --purge-age={{purge_age}} \\
  --mail-age={{mail_delete_age}} --stale-age={{stale_issue_age}} \\
  --db-delay={{db_delay}} \\
  --json
```

**3. Inspect results for anomalies:**
- Check the `anomalies` array in the JSON output
- Treat an absent `molecule_step_candidates` field as zero
- Flag any `dangling_parent_ref` anomalies — these indicate wisps with
  parent dependency records pointing to purged/missing parents
- If `open_wisps` exceeds {{alert_threshold}}, escalate

**4. Decide whether to proceed:**
- If no candidates found across all databases, including `molecule_step_candidates`, skip remaining steps
- If anomalies are severe, consider escalating before proceeding

**Exit criteria:** Scan complete, candidates identified, anomalies flagged."""

[[steps]]
id = "reap"
title = "Reap stale wisps"
needs = ["scan"]
description = """
Close wisps past max_age whose parent molecule is closed or missing, and close
step-wisps immediately when their parent molecule is already closed.

**1. For each database with `reap_candidates` or `molecule_step_candidates`:**
```bash
gt reaper reap --db=<name> \\
  --max-age={{max_age}} --db-delay={{db_delay}} {{#if dry_run}}--dry-run{{/if}} --json
```

**2. Inspect results:**
- Compare reaped and molecule-step counts to scan candidates. A mismatch (scan > reap) is NORMAL
  and expected — the witness may close wisps for dead polecat sessions between
  scan and reap. Do NOT escalate scan/reap count mismatches.
- Only escalate if reap returns an actual error (not a zero count).
- Check for any anomalies in the response

**3. Alert check:**
If total open wisps across all databases exceed {{alert_threshold}},
log a warning and consider escalating.

**Exit criteria:** All stale wisps closed (or dry-run counts reported)."""

[[steps]]
id = "purge"
title = "Purge old closed wisps and mail"
needs = ["reap"]
description = """
Delete closed wisps past purge_age and closed mail past mail_delete_age.

**1. For each database with purge candidates:**
```bash
gt reaper purge --db=<name> \\
  --purge-age={{purge_age}} --mail-age={{mail_delete_age}} \\
  --db-delay={{db_delay}} \\
  {{#if dry_run}}--dry-run{{/if}} --json
```

**2. Inspect results for anomalies:**
- Check for `dolt_commit_failed` anomalies — purged data may not be persisted
- Verify purge counts are reasonable (not suspiciously high or low)

**Safety:** Only deletes wisps that are already closed AND past the purge
retention window, and it spares any wisp a live agent bead still names as
active_mr or hook_bead — deleting one strands a pointer the polecat can never
resolve again (gt-gyb6). Active wisps are never touched. Reverse dependency
references are cleaned up to prevent dangling parent refs.

**Exit criteria:** Old closed wisps and mail purged."""

[[steps]]
id = "auto-close"
title = "Auto-close stale issues"
needs = ["purge"]
description = """
Close issues that have been open with no status change past stale_issue_age.

**Disarm check, before anything else.** The daemon renders the arm state in
`auto_close={{auto_close}}` (empty or "true" = armed). If that value is the
literal "false", **SKIP THIS STEP**: do not run `gt reaper auto-close` in any
form, report "auto-close disarmed" in the final report, and continue to the
next step. This is a deliberate setting, not a problem to work around.

**1. DRY RUN FIRST — always, no exceptions:**
```bash
gt reaper auto-close --db=<name> \\
  --stale-age={{stale_issue_age}} \\
  --db-delay={{db_delay}} --dry-run --json
```

Echo the candidate count in your report BEFORE the live run. The count is the
whole point of this step: it is the only chance to notice that the threshold or
a filter is wrong while nothing has been written. If the count is larger than
you can account for, or exceeds --max-closes (default 20), STOP and escalate —
do not run live, and do not reach for --force.

The dry run prints this set's preview hash (`--preview=<hash>` in the text
output, `preview_hash` under `--json`). Keep it for step 2.

**2. Live run, carrying the preview hash from step 1:**
```bash
gt reaper auto-close --db=<name> \\
  --stale-age={{stale_issue_age}} \\
  --db-delay={{db_delay}} \\
  --preview=<hash printed by step 1> \\
  {{#if dry_run}}--dry-run{{/if}} --json
```

A live run with no preview hash, or with one naming a different set (an issue
was updated or closed in between), refuses and closes nothing: re-run the dry
run rather than reaching for `--force`.

**3. Inspect results:**
- Review the count of closed issues against the dry-run count — they should match
- Verify exclusions held: P0/P1, epics, convoys, molecules, agent beads, and
  dependency-linked issues must never appear as candidates
- A "REFUSED" line means the run was blocked and nothing was closed. That is a
  designed stop, not a bug to work around.

{{#if dry_run}}**Dry run is set** — step 2 performs no writes.{{/if}}

**Exit criteria:** Dry-run count echoed and its preview hash carried into the
live run; all eligible stale issues auto-closed, or the run refused for want of
a matching preview, or the step reported as disarmed."""

[[steps]]
id = "convoy-check"
title = "Close completed convoys (tracked-bead status, not staleness)"
needs = ["auto-close"]
description = """
Close convoys whose tracked beads are ALL closed. Convoy lifecycle is driven
by tracked-bead status, never by staleness — `gt reaper auto-close` therefore
excludes convoys entirely, and this step is what retires them (hq-jnap).

The refinery closes convoys post-merge, but tracked beads closed by other
paths (manual close, audits/sweeps, `gt done --status DEFERRED`) leave the
convoy open with nothing left to track. This step bridges that gap.

**1. Run convoy check (cross-prefix aware, town-level):**
```bash
gt convoy check {{#if dry_run}}# dry_run set: run 'gt convoy list' and report instead of closing{{/if}}
```

`gt convoy check` closes every open convoy whose tracked issues are all
closed and notifies subscribers. It NEVER closes a convoy with open tracked
issues — if a convoy looks stale but its tracked beads are open, that is a
dispatch problem to flag, not a cleanup target.

**2. Inspect results:**
- Note which convoys were closed and why
- If a convoy has been open >7d with all tracked issues open and unassigned,
  flag it in the report (stranded convoy — needs feeding, not closing)

**Exit criteria:** All completed convoys closed; stranded convoys flagged."""

[[steps]]
id = "report"
title = "Report findings and return to kennel"
needs = ["convoy-check"]
description = """
Generate summary and signal completion.

**1. Generate report:**
```markdown
## Reaper Dog Report

**Databases scanned**: (count)
**Wisps reaped**: (total closed stale open wisps)
**Wisps purged**: (total deleted old closed wisps)
**Mail purged**: (total deleted old closed mail)
**Issues auto-closed**: (stale > stale_issue_age, excl. epics/convoys/molecules/P0-P1/deps)
**Auto-close dry-run count**: (candidates reported before the live run, or "disarmed")
**Convoys closed**: (all tracked beads closed, via gt convoy check)
**Open wisps remaining**: (total)
**Anomalies**: (list any anomalies found)
```

**2. If anomalies were found, escalate:**
```bash
gt escalate "Reaper anomalies detected" -s MEDIUM -m "<anomaly details>"
```

**Exit criteria:** Report generated, anomalies escalated if any."""

[vars]
[vars.max_age]
description = "Max wisp age before reaping (e.g., '24h')"
default = "24h"

[vars.purge_age]
description = "Max closed wisp age before purging (e.g., '168h' = 7 days)"
default = "168h"

[vars.stale_issue_age]
description = "Max issue staleness before auto-close (e.g., '720h' = 30 days; '30d' also accepted)"
default = "720h"

[vars.auto_close]
description = "If 'false', skip the auto-close step entirely. Empty (default) means armed."
default = ""

[vars.mail_delete_age]
description = "Max closed mail age before purging (e.g., '168h' = 7 days)"
default = "168h"

[vars.alert_threshold]
description = "Open wisp count that triggers escalation warning"
default = "3000"

[vars.dry_run]
description = "If 'true', report without modifying data"
default = ""

[vars.databases]
description = "Comma-separated database names (empty = auto-discover)"
default = ""

[vars.db_delay]
description = "Delay between databases to reduce Dolt load"
default = "250ms"
