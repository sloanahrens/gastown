description = """
Reap stale wisps and close stale issues across all Dolt databases.

The daemon's wisp_reaper patrol is the executor: it runs the sweep inline
(wisp_reaper.go) and pours this molecule only as the cycle's receipt, closing
or failing each step as it goes. No agent runs it. The step bodies double as
the runbook for an operator running `gt reaper scan`/`reap`/`purge`/`auto-close`
by hand. The daemon's sweep does not run `gt convoy check`; that step is for a
hand run.

Variables and their defaults are under [vars] at the end of this file.

## Safety

Reaping closes wisps and is reversible. Purging deletes rows, irreversibly, but
only already-closed wisps past retention.

Auto-close is the one step that writes to the durable issue tracker, and it
carries the 2026-09-16 mis-close (gt-2qzr, 102 beads) as guard rails: it skips
P0/P1, infrastructure types and agent beads, and anything with active
dependencies; it refuses a stale-age below 7d (a soft error, exit 0), a run over
`--max-closes`, and a live run without the dry run's preview hash. Every refusal
is the designed stop. **Never pass `--force`**: re-run the dry run, or report the
mis-set threshold.

## Scope Boundary (gt-61x)

Writes are limited to wisp/issue/mail ROWS via the gt reaper subcommands and
`gt convoy check`. Database-level operations are OUT OF SCOPE:

- NEVER run `gt dolt cleanup` (with or without --force)
- NEVER drop, remove, or delete database directories by any means
- NEVER bypass a refusal from a safety check (a refusal IS the designed stop)

Report orphan databases or other database-level problems and escalate to the
mayor (`gt escalate`); do not act on them.

## Anomalies

Flag dangling parent references, sudden spikes in reap candidates, open wisps
over alert_threshold, and Dolt commit failures. A scan/reap count mismatch
(reap closes fewer than scan found) is a benign race, NOT an anomaly: do not
escalate it."""
formula = "mol-dog-reaper"
version = 7

# Declared command allowlist (gt-9iv), no longer enforced: see Scope Boundary.
command_allowlist = [
	"gt reaper",
	"gt convoy check",
	"gt convoy list",
	"gt escalate",
	"gt dog done",
]

[squash]
trigger = "on_complete"
template_type = "work"
include_metrics = true

[[steps]]
id = "scan"
title = "Scan databases for reaper candidates"
description = """
Discover databases and count candidates for each operation.

**1. List databases to scan:**
```bash
gt reaper databases --json
```
Or use configured database list from {{databases}} variable.

**2. Scan each database:**
```bash
gt reaper scan --db=<name> \\
  --max-age={{max_age}} --purge-age={{purge_age}} \\
  --mail-age={{mail_delete_age}} --stale-age={{stale_issue_age}} \\
  --db-delay={{db_delay}} \\
  --json
```

**3. Inspect results:** flag the `anomalies` array (a `dangling_parent_ref`
is a wisp whose parent was purged), and escalate if `open_wisps` exceeds
{{alert_threshold}}. An absent `molecule_step_candidates` is zero. With no
candidates in any database, skip the remaining steps.

**Exit criteria:** Scan complete, candidates identified, anomalies flagged."""

[[steps]]
id = "reap"
title = "Reap stale wisps"
needs = ["scan"]
description = """
Close wisps past max_age whose parent molecule is closed or missing, and close
step-wisps immediately when their parent molecule is already closed.

**1. For each database with `reap_candidates` or `molecule_step_candidates`:**
```bash
gt reaper reap --db=<name> \\
  --max-age={{max_age}} --db-delay={{db_delay}} {{#if dry_run}}--dry-run{{/if}} --json
```

**2. Inspect results:** scan > reap is NORMAL (a race with other closers); do
not escalate it. Escalate only an actual error, or total open wisps over
{{alert_threshold}}.

**Exit criteria:** All stale wisps closed (or dry-run counts reported)."""

[[steps]]
id = "purge"
title = "Purge old closed wisps and mail"
needs = ["reap"]
description = """
Delete closed wisps past purge_age and closed mail past mail_delete_age.

**1. For each database with purge candidates:**
```bash
gt reaper purge --db=<name> \\
  --purge-age={{purge_age}} --mail-age={{mail_delete_age}} \\
  --db-delay={{db_delay}} \\
  {{#if dry_run}}--dry-run{{/if}} --json
```

**2. Inspect results:** a `dolt_commit_failed` anomaly means purged data may
not be persisted; flag counts that look suspiciously high or low.

Purge spares any wisp a live agent bead still names as active_mr or hook_bead
(gt-gyb6), and cleans reverse dependency references.

**Exit criteria:** Old closed wisps and mail purged."""

[[steps]]
id = "auto-close"
title = "Auto-close stale issues"
needs = ["purge"]
description = """
Close issues that have been open with no status change past stale_issue_age.

**Disarm check, before anything else.** The daemon renders the arm state in
`auto_close={{auto_close}}` (empty or "true" = armed). If that value is the
literal "false", **SKIP THIS STEP**: do not run `gt reaper auto-close` in any
form, report "auto-close disarmed" in the final report, and continue to the
next step. This is a deliberate setting, not a problem to work around.

**1. DRY RUN FIRST — always, no exceptions:**
```bash
gt reaper auto-close --db=<name> \\
  --stale-age={{stale_issue_age}} \\
  --db-delay={{db_delay}} --dry-run --json
```

Echo the candidate count in your report BEFORE the live run: it is the only
chance to notice a wrong threshold or filter while nothing has been written. If
the count is larger than you can account for, or exceeds --max-closes (default
20), STOP and escalate — do not run live, and do not reach for --force.

The dry run prints this set's preview hash (`--preview=<hash>` in the text
output, `preview_hash` under `--json`). Keep it for step 2.

**2. Live run, carrying the preview hash from step 1:**
```bash
gt reaper auto-close --db=<name> \\
  --stale-age={{stale_issue_age}} \\
  --db-delay={{db_delay}} \\
  --preview=<hash printed by step 1> \\
  {{#if dry_run}}--dry-run{{/if}} --json
```

A live run with no preview hash, or with one naming a different set (an issue
was updated or closed in between), refuses and closes nothing: re-run the dry
run rather than reaching for `--force`.

**3. Inspect results:**
- The closed count should match the dry-run count
- P0/P1, epics, convoys, molecules, agent beads, and dependency-linked issues
  must never appear as candidates
- A "REFUSED" line (per-run cap, preview) closed nothing: a designed stop
- A "below the floor" notice (gt-ecpj) closed nothing and exited 0: report the
  mis-set threshold as a config fix, and continue

{{#if dry_run}}**Dry run is set** — step 2 performs no writes.{{/if}}

**Exit criteria:** Dry-run count echoed and its preview hash carried into the
live run; all eligible stale issues auto-closed, or the run refused for want of
a matching preview, or the step reported as disarmed."""

[[steps]]
id = "convoy-check"
title = "Close completed convoys (tracked-bead status, not staleness)"
needs = ["auto-close"]
description = """
Close convoys whose tracked beads are ALL closed. Convoy lifecycle is driven
by tracked-bead status, never by staleness — `gt reaper auto-close` therefore
excludes convoys entirely, and this step is what retires them (hq-jnap).

Tracked beads closed outside a landing (manual close, sweeps,
`gt done --status DEFERRED`) leave a convoy open with nothing left to track.

**1. Run convoy check (cross-prefix aware, town-level):**
```bash
gt convoy check {{#if dry_run}}# dry_run set: run 'gt convoy list' and report instead of closing{{/if}}
```

It NEVER closes a convoy with open tracked issues. A convoy open >7d with all
tracked issues open and unassigned is stranded: flag it in the report (it needs
feeding, not closing).

**Exit criteria:** All completed convoys closed; stranded convoys flagged."""

[[steps]]
id = "report"
title = "Report findings and return to kennel"
needs = ["convoy-check"]
description = """
Generate the cycle summary. The daemon logs these counts in one summary line
and closes this step; a hand run reports them the same way. (The step title is
historical; it is kept because the daemon matches poured steps by title.)

**1. Generate report:**
```markdown
## Reaper Report

**Databases scanned**: (count)
**Wisps reaped**: (total closed stale open wisps)
**Wisps purged**: (total deleted old closed wisps)
**Mail purged**: (total deleted old closed mail)
**Issues auto-closed**: (stale > stale_issue_age, excl. epics/convoys/molecules/P0-P1/deps)
**Auto-close dry-run count**: (candidates reported before the live run, or "disarmed")
**Convoys closed**: (all tracked beads closed, via gt convoy check)
**Open wisps remaining**: (total)
**Anomalies**: (list any anomalies found)
```

**2. If anomalies were found, escalate:**
```bash
gt escalate "Reaper anomalies detected" -s MEDIUM -m "<anomaly details>"
```

**Exit criteria:** Report generated, anomalies escalated if any."""

[vars]
[vars.max_age]
description = "Max wisp age before reaping (e.g., '24h')"
default = "24h"

[vars.purge_age]
description = "Max closed wisp age before purging (e.g., '168h' = 7 days)"
default = "168h"

[vars.stale_issue_age]
description = "Max issue staleness before auto-close (e.g., '720h' = 30 days; '30d' also accepted)"
default = "720h"

[vars.auto_close]
description = "If 'false', skip the auto-close step. Empty (default) means armed; the daemon's sweep auto-closes only when daemon.json sets patrols.wisp_reaper.auto_close=true."
default = ""

[vars.mail_delete_age]
description = "Max closed mail age before purging (e.g., '168h' = 7 days)"
default = "168h"

[vars.alert_threshold]
description = "Open wisp count that triggers escalation warning (default 3000)"
default = "3000"

[vars.dry_run]
description = "If 'true', report without modifying data"
default = ""

[vars.databases]
description = "Comma-separated database names (empty = auto-discover)"
default = ""

[vars.db_delay]
description = "Delay between databases to reduce Dolt load"
default = "250ms"
