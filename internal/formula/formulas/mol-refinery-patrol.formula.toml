description = """
Merge queue processor patrol loop.

The Refinery is the Engineer in the engine room. You process polecat branches, merging them to their effective target branches one at a time without rewriting submitted heads.

**The Scotty Test**: Before proceeding past any failure, ask yourself: "Would Scotty walk past a warp core leak because it existed before his shift?"

## Merge Flow

The Refinery receives MERGE_READY mail from Witnesses when polecats complete work:

```
Witness                    Refinery                      Git        Polecat
   │                          │                           │            │
   │ MERGE_READY              │                           │            │
   │─────────────────────────>│                           │            │
   │                          │                           │            │
   │                    (verify branch)                   │            │
   │                          │ fetch & merge rehearsal    │            │
   │                          │──────────────────────────>│            │
   │                          │                           │            │
   │                    (run tests)                       │            │
   │                          │                           │            │
   │                    (if pass)                         │            │
   │                          │ merge & push              │            │
   │                          │──────────────────────────>│            │
   │ MERGED                   │                           │            │
   │<─────────────────────────│                           │            │
   │                          │                           │            │
   │                    (if fail)                         │            │
   │                          │          FIX_NEEDED       │            │
   │                          │───────────────────────────────────────>│
   │                          │                           │   (fix code)
   │                          │                           │  (resubmit)
```

After successful merge, Refinery sends MERGED mail back to Witness so it can
complete cleanup (nuke the polecat worktree).

On failure, Refinery sends FIX_NEEDED directly to the Polecat. The polecat
fixes the code in-place and resubmits the MR without losing context.

## CRITICAL: Read Step Instructions Before Acting

Before executing ANY step, you MUST run `bd show <step-id>` and read the full
description. Steps contain **Config:** values that override default behavior.
If a config says to skip, you skip. If it specifies a command, you use that
exact command — not your own assumption. Do NOT guess what a step requires
based on the step title or your role knowledge. The step description is the
source of truth.

## Variables

| Variable | Default | Description |
|----------|---------|-------------|
| wisp_type | patrol | Type of wisp created for this molecule |
| integration_branch_refinery_enabled | true | Whether refinery merges to integration branches |
| integration_branch_auto_land | false | Whether to auto-land integration branches when epic children all closed |
| run_tests | true | Whether to run tests before merging |
| setup_command | (empty) | Setup/install command (e.g., `pnpm install`). Empty = skip. |
| typecheck_command | (empty) | Type check command (e.g., `tsc --noEmit`). Empty = skip. |
| lint_command | (empty) | Lint command (e.g., `eslint .`). Empty = skip. |
| test_command | (empty) | Test command to run (if run_tests is true). Empty = skip. |
| build_command | (empty) | Build command (e.g., `go build ./...`). Empty = skip. |
| target_branch | main | Default target branch for merges |
| delete_merged_branches | true | Whether to delete source branches after merge |
| editorial_required | false | Whether merge_queue.editorial.required is set for this rig; gates whether quality-review calls gt mq review at all |
| merge_strategy | direct | Merge strategy: 'direct' (merge+push) or 'pr' (GitHub PR) |
| require_review | false | Require at least one approving GitHub review before merging (pr mode only) |
| batch_enabled | false | Whether to batch-gate multiple ready MRs instead of processing one at a time |

## Target Resolution Rule

When instructions reference `<merge-target>` or `<verification-target>`,
resolve that placeholder with this rule:

- If integration_branch_refinery_enabled = "true": use MR target when present, otherwise {{target_branch}}.
- If integration_branch_refinery_enabled = "false": always use {{target_branch}}.

## FORBIDDEN Actions

- FORBIDDEN: Landing integration branches to the default branch via raw git commands (`git merge`, `git push`).
  Integration branches may ONLY be landed via `gt mq integration land <epic-id>`.
  This applies regardless of `auto_land` configuration. The pre-push hook enforces this.
- FORBIDDEN: Invoking `gt mq review` against the raw `origin/<polecat-branch>`
  instead of the rehearsed `temp` branch. If the branch forked behind a
  target that has since moved, an unrehearsed comparison shows the target's
  own later merges as deletions authored by the polecat — a false "this
  reverts X" verdict (gt-oh41). Always pass `--rehearsed temp`, the branch
  process-branch already built.

## Step Execution Order

You MUST process steps in strict DAG order. Walk through each step sequentially,
unless you are explicitly told to skip to a step.

## Abbreviated Patrol Mode (Idle Effort Tuning)

When `await-event` outputs `EFFORT: reduced`, run an ABBREVIATED patrol.
This happens when idle_cycles >= {{idle_effort_threshold}} (no events on channel).

Abbreviated patrol rules:
- **inbox-check**: Run `gt mail drain` and quick inbox check. Skip individual message processing unless new MERGE_READY found.
- **queue-scan**: Quick `gt mq list` check. If queue is empty, skip directly to check-integration-branches.
- **merged-pr-sweep**: Run even in reduced mode when queue-scan found queued MRs.
- **batch-scan through merge-push**: Only run if queue-scan found remaining actionable work. Otherwise SKIP all.
- **loop-check through generate-summary**: SKIP if no merges were processed.
- **check-integration-branches**: Quick check only.
- **context-check**: Quick self-assessment (one sentence).
- **patrol-cleanup**: SKIP.
- **burn-or-loop**: Normal (await-event as usual).

When `await-event` outputs `EFFORT: full`, run all steps thoroughly (normal mode).

The goal: idle cycles should burn ~10% of the tokens a full patrol uses."""
formula = "mol-refinery-patrol"
version = 31

[vars]
[vars.wisp_type]
description = "Type of wisp created for this molecule"
default = "patrol"

[vars.idle_effort_threshold]
description = "Idle cycles before switching to abbreviated patrol (0 = always full)"
default = "1"

[vars.integration_branch_refinery_enabled]
description = "Whether the refinery merges to integration branches (true) or always to target_branch (false)"
default = "true"

[vars.integration_branch_auto_land]
description = "Whether to auto-land integration branches when epic children are all closed"
default = "false"

[vars.run_tests]
description = "Whether to run tests before merging"
default = "true"

[vars.setup_command]
description = "Setup/install command (e.g., pnpm install). Empty = skip."
default = ""

[vars.typecheck_command]
description = "Type check command (e.g., tsc --noEmit). Empty = skip."
default = ""

[vars.lint_command]
description = "Lint command (e.g., eslint .). Empty = skip."
default = ""

[vars.test_command]
description = "Test command to run (if run_tests is true). Empty = skip."
default = ""

[vars.build_command]
description = "Build command (e.g., go build ./...). Empty = skip."
default = ""

[vars.target_branch]
description = "Default target branch for merges"
default = "main"

[vars.delete_merged_branches]
description = "Whether to delete source branches after merge"
default = "true"

[vars.editorial_required]
description = "Whether merge_queue.editorial.required is set for this rig (from config, resolved at prime time). Gates whether quality-review invokes gt mq review at all."
default = "false"

[vars.merge_strategy]
description = "Merge strategy: 'direct' (ff-only merge + push) or 'pr' (create GitHub PR). Default: direct."
default = "direct"

[vars.require_review]
description = "Require at least one approving GitHub review before merging (only applies when merge_strategy=pr)."
default = "false"

[vars.batch_enabled]
description = "Whether to batch-gate multiple ready MRs (stack, one suite run, bisect on red) instead of processing one at a time"
default = "false"

[vars.rig]
description = "Name of the rig this refinery belongs to (e.g., gastown, laser)"
default = "UNSET_RIG"

[vars.prefix]
description = "Beads prefix for this rig (e.g., gt for gastown, la for laser)"
default = "gt"

[[steps]]
id = "inbox-check"
title = "Check refinery mail"
description = """
> **Verify a hook by its RENDERED TITLE.** A title printed by `gt hook` or
> `gt mol status` is the liveness proof; for a hooked MAIL use `gt mail show <id>`.
> A `not found` from `bd show` is not evidence of a purge — `bd show <hq-id>` from
> inside a rig was unreliable before bd 8a1eeb9 (be-v1o), so a miss there proves
> nothing. A handoff MAIL on the hook at startup is the DESIGNED state
> (`gt handoff <bead>` = hook + restart): read it and execute it. Run
> `gt patrol new` only after a rendered title has proven the hook gone — it
> replaces the hook rather than repairing it (gt-vahe).

First, clean up CLOSED wisps from previous cycles:
```bash
bd mol wisp gc --closed --force --exclude-type chore
```

> **Warning (gt-0ok):** `--exclude-type chore` is REQUIRED on the closed-wisp
> pass. Plugin-run receipts are ephemeral `chore`-type beads closed
> immediately after creation — unscoped `--closed --force` deletes every
> receipt town-wide each cycle, permanently opening all cooldown gates.

> **Warning (gt-xciy):** Do not run unscoped age-based wisp GC (`bd mol wisp
> gc --age ...`) from inside this patrol. It has no hook-awareness — it
> reaps any non-closed wisp older than the age threshold regardless of
> who owns it, including this molecule's own currently-hooked patrol wisp
> and every other agent's in-progress work wisps. A dry run found 403
> wisps at risk, 100% foreign `mol-polecat-work` step wisps and 0%
> refinery-owned. Use closed-only cleanup here — stale open-wisp cleanup
> belongs outside active patrol molecules (reaper Dog).

Then check mail for MERGE_READY submissions, escalations, and messages.

```bash
gt mail inbox
```

For each message:

**MERGE_READY**:
A polecat's work is ready for merge. Extract details and track for processing.

```bash
# Parse MERGE_READY message body:
# Branch: <branch>
# Issue: <issue-id>
# Polecat: <polecat-name>
# MR: <mr-bead-id>
# Verified: clean git state, issue closed

# Track in your merge queue for this patrol cycle:
# - Branch name
# - Issue ID
# - Polecat name (REQUIRED for MERGED notification)
# - MR bead ID (REQUIRED for closing after merge)
```

**IMPORTANT**: You MUST track the polecat name, MR bead ID, AND message ID. On a
merge, `gt mq post-merge` sends MERGED, closes the MR bead and archives this mail
itself, printing ✓/○/✗ for each chore; you redo only a chore that printed ✗.
On a reject or skip path you archive the mail yourself.

Mark as read. The work will be processed in queue-scan/process-branch.
**Do NOT archive yet** - it is archived after the merge/reject decision.

**PATROL: Wake up**:
Witness detected MRs waiting but refinery idle. Acknowledge and archive:
```bash
gt mail archive <message-id>
```

**HELP / Blocked**:
Assess and respond. If you can't help, escalate to Mayor.
Archive after handling:
```bash
gt mail archive <message-id>
```

**HANDOFF**:
Read predecessor context. Check for in-flight merges.
Archive after absorbing context:
```bash
gt mail archive <message-id>
```

**Hygiene principle**: Archive messages after they're fully processed.
Keep only: pending MRs in queue. Inbox should be near-empty."""

[[steps]]
id = "queue-scan"
title = "Scan merge queue"
needs = ["inbox-check"]
description = """
Check the beads merge queue - this is the SOURCE OF TRUTH for pending merges.

```bash
git fetch --prune origin
gt mq list <rig>
```

The beads MQ tracks all pending merge requests. Do NOT rely on `git branch -r | grep polecat`
as branches may exist without MR beads, or MR beads may exist for already-merged work.

If queue empty, skip to "check-integration-branches" step.

If any MR's STATUS column reads `duplicate`, two open MRs claim the same
branch (gt-k1qf). Do not process either through process-branch: mail
`<rig>/witness` naming both MR IDs and the branch (`gt mq list <rig>`
prints both under a "DUPLICATE BRANCH MRs" banner), then continue queue-scan
with the remaining MRs.

For each MR in the queue, verify the branch still exists:
```bash
git branch -r | grep <branch>
```

If branch doesn't exist for a queued MR:
- First resolve PR state with the authoritative queue lookup:
  ```bash
  PR_JSON=$(gt mq pr-status <rig> <mr-id> --json)
  PR_STATE=$(echo "$PR_JSON" | jq -r '.pr.state // "NOT_FOUND"')
  PR_URL=$(echo "$PR_JSON" | jq -r '.pr.url // empty')
  ```
- If lookup errors or reports ambiguity: leave the MR open, do NOT close it as missing.
- If `PR_STATE=MERGED`: handle it in merged-pr-sweep below; do NOT close as missing.
- If `PR_STATE=OPEN`: leave the MR open; the branch may be a fork/head PR.
- If `PR_STATE=CLOSED`: do NOT send MERGED; leave the MR for manual rejection/supersede review.
- If `PR_STATE=NOT_FOUND`: fail closed; leave the MR open rather than risking owner-merged/deleted-head misclassification.

Track verified MR list for this cycle. That list is for verification only: it
is a snapshot, so it is NOT the order you process MRs in. process-branch takes
each next MR from `gt mq next` (gt-tgey7)."""

[[steps]]
id = "merged-pr-sweep"
title = "Drain already-merged PRs"
needs = ["queue-scan"]
description = """
Sweep queued MRs for PRs that were merged outside the refinery flow.

This step prevents owner-merged PRs from rotting in the queue, including fork-head
and deleted-head PRs. Use exactly one authoritative lookup path:

```bash
PR_JSON=$(gt mq pr-status <rig> <mr-id> --json)
PR_STATE=$(echo "$PR_JSON" | jq -r '.pr.state // "NOT_FOUND"')
PR_URL=$(echo "$PR_JSON" | jq -r '.pr.url // empty')
```

`gt mq pr-status` prefers recorded PR URL/number metadata from the MR/source bead.
Only when no recorded PR identity exists does it perform a target-repo head lookup,
and ambiguous head matches fail closed. Do NOT replace it with `gh pr view <branch>`,
branch-only `gh pr list --limit 1`, retries, or broad fallback searches.

For each queued MR:
- If lookup errors or reports ambiguity: leave the MR open and continue to the next MR.
- If `PR_STATE=MERGED`: run post-merge cleanup with branch deletion skipped:
  ```bash
  gt mq post-merge <rig> <mr-id> --skip-branch-delete
  ```
  Post-merge sends MERGED and archives MERGE_READY itself (claude-7fc); verify
  its ✓ lines and do only a ✗ chore by hand. It may also print `🔄 unit
  complete, respawning …` and end this session: that is expected, and the
  fresh successor re-runs this sweep and continues with the MRs still queued.
- If `PR_STATE=OPEN`: leave it for the normal process-branch/merge-push path.
- If `PR_STATE=CLOSED`: do NOT send MERGED; leave it for manual rejection/supersede review.
- If `PR_STATE=NOT_FOUND`: leave it open; do not close as "Branch no longer exists".

After sweeping merged PRs, process only MRs still actionable in process-branch."""

[[steps]]
id = "batch-scan"
title = "Batch-gate ready MRs (if enough have queued up)"
needs = ["merged-pr-sweep"]
description = """
**Config: batch_enabled = {{batch_enabled}}**

The eligibility window, the batch size and the minimum count all come from
this rig's own config (`merge_queue.batch_min_age`, `merge_queue.batch_max`,
`merge_queue.batch_min_count` in the rig's config.json): `gt mq batch
candidates` and `gt mq batch run` read them when called without
`--min-age`/`--max`/`--min-count`. Never pass those flags from this
formula. A formula-level value drifts from the config (gt-kd6b), and
the command's own header line prints the values it actually used.

**If batch_enabled = "false": SKIP this entire step, proceed to process-branch
(single-MR path).**

Rebasing, gating, and pushing one ready MR at a time costs a full test suite
run per MR (often ~10 min). When several MRs have queued up, batch them:
stack them onto one rebase, gate once, and land them all in one push — or
bisect to isolate a single red MR if the suite fails. P0 MRs are never
batched; they always take the single-MR path first so critical fixes aren't
held up waiting for a batch to assemble. P1 MRs batch alongside P2 — the
P1 exclusion was removed on 2026-09-19 because most of this town's work is
filed at P1, so excluding them meant batching never engaged at all.

**Step 1: Check how many MRs are batch-eligible**

```bash
gt mq batch candidates <rig> --json
```

This excludes P0 MRs, anything younger than the rig's `merge_queue.batch_min_age`,
and any MR a previous batch isolated as a culprit at the head it still carries
(see Step 5), sorts by priority score, and caps at `merge_queue.batch_max`.
Read `.eligible_total` from the output; `.batch_culprit_skipped` counts the
MRs the last of those exclusions held back, so a short list is never read as
an empty queue.

**If `.eligible_total` is 0: SKIP the rest of this step, proceed to
process-branch.** Otherwise run Step 2: `gt mq batch run` enforces the
rig's `merge_queue.batch_min_count` itself and exits without batching when
too few are eligible (its output says so); on that exit, proceed to
process-branch as if this step had been skipped.

**Step 2: `gt mq batch run` reviews every candidate itself (T7, gt-2liq, on main since 2026-09-11)**

The batch run rehearses each candidate onto the target, runs the om editorial
review on each one (bounded parallelism), and then stacks only the approved
members. A member whose review comes back request_changes is DROPPED FROM THE
BATCH AND REJECTED (gt-bsmp): the run closes its MR bead with a `rejected:
EDITORIAL REJECTION ...` reason and hands its source bead to dead-worker
recovery, which writes the MERGE REJECTION notes and mails RECOVERED_BEAD to
the deacon. Send no FIX_NEEDED from this step — the deacon's redispatch owns
the resubmit. A member that fails for an infra reason (exit 2) is left queued
and untouched: that is not a verdict on its diff, so the next cycle reviews it
again. A member whose patch-id changed once stacked is ejected the same way.
Do NOT pre-review candidates here. On an editorial_required rig the batch
lands only members that hold an approve note, which the run itself produced.

**Step 3: Assemble, gate, and land the batch — as a background call**

A batch run is not bounded like a single gate: a red first gate costs a
flaky retry, then a bisection of several more gates, each a full suite, and
a foreground Bash call carrying that is killed at the tool's time ceiling
mid-bisection (gt-f75t). So never run it in the foreground. Run this ONE
Bash call with
`run_in_background: true` — the tool then owns the process with no timeout,
keeps it running across your turns, and notifies you when it exits:

```bash
gt mq batch run <rig> --json > /tmp/<rig>-batch.json 2> /tmp/<rig>-batch.err
echo "BATCH_EXIT=$?" >> /tmp/<rig>-batch.err
```

Fixed paths, so nothing has to be remembered across calls. Wait for the
completion notification; to see progress in the meantime, a short separate
call `tail -n 3 /tmp/<rig>-batch.json` shows the `[Batch]` / `[Bisect]`
lines as they land. While it runs do nothing else to the rig checkout or
the queue — the batch holds the gate slot and owns {{target_branch}} in the
rig checkout.

When the notification arrives, `tail -n 1 /tmp/<rig>-batch.err` decides:

- `BATCH_EXIT=0` or `BATCH_EXIT=<non-zero>` — the run ended. The .json
  file holds the `[Batch]` / `[Bisect]` progress lines FOLLOWED BY the JSON
  result when one was produced (both go to stdout), so extract the trailing
  object rather than parsing the whole file:
  ```bash
  sed -n '/^{/,$p' /tmp/<rig>-batch.json > /tmp/<rig>-batch-result.json
  test -s /tmp/<rig>-batch-result.json && echo HAS_JSON || echo NO_JSON
  ```
  `NO_JSON` with exit 0 is a normal not-batched exit (below
  `merge_queue.batch_min_count`, no eligible MRs, merge_strategy=pr): nothing
  was landed; go to Step 6. `HAS_JSON`: read `.merged[]`, `.culprits[]`,
  `.conflicts[]` and `.error` from `/tmp/<rig>-batch-result.json`, then
  answer two questions in this order, whatever the exit code:

  1. Did the run fail before or beside the landing? A non-zero exit whose
     `.error` does not start with `post-merge cleanup proof failed for` (the
     exact prefix the cleanup failures below carry) is an infra failure (push
     refused, slot, editorial precondition, eligibility recheck): escalate
     it observably exactly as handle-failures does for a single MR (`.error`
     text, mail the mayor) FIRST, before any recovery below, so the same
     failure is not silently retried one MR at a time.
  2. What landed? `.merged[]` lists only members whose post-merge cleanup
     succeeded; every one of them is on {{target_branch}} and the batch run
     already sent its Witness mail as part of that cleanup (gt-9gjl) — do
     NOT send it again. A member can also have landed WITHOUT appearing there —
     its commits pushed, its cleanup failed, its MR bead and branch left
     behind (`.error` records only the first such failure, and a batch that
     shrank to one member reports it with an empty `.merged[]`). Find every
     one with
     `grep -E 'Post-merge (proof|cleanup) failed for' /tmp/<rig>-batch.json`
     and run the verified cleanup for each, never a manual close:
     `gt mq post-merge <rig> <mr-id> --skip-branch-delete --no-cycle` re-runs
     the post-merge proof and closes MR and source issue together (the tool
     merged-pr-sweep uses for the same case). `--no-cycle` is REQUIRED here:
     without it the first recovered member could respawn this session and
     abandon the rest; with it post-merge prints `○ session kept: cycle
     suppressed (--no-cycle)`. Proof fails again → it did NOT land, leave it
     queued for process-branch. Proof passes → post-merge sends MERGED
     itself; do not send it a second time.
  `NO_JSON` with a non-zero exit is the same kind of infra failure earlier
  in the run (candidate listing, gate-slot wait): nothing was landed;
  escalate it the same way (tail of `/tmp/<rig>-batch.err`, mail the mayor)
  and go to Step 6.
- no `BATCH_EXIT=` line at all — the process died abnormally (killed,
  crashed, session lost). Do NOT wait. The container-gate slot needs
  nothing: it is a kernel flock and cleared when the process died. Two
  things can be left behind, and both need the mayor, not you: (1) the rig
  checkout — `git status`; if {{target_branch}} sits on a stacked commit it
  must go back to `origin/{{target_branch}}`, a hard reset you do not run
  yourself; (2) the beads merge slot, taken as `<rig>/refinery/push/<ts>`
  while the stack was being pushed, which has no staleness eviction and
  keeps the push path blocked until released. Mail the mayor both facts
  (the sha the checkout sits on, the merge-slot holder if any) and continue
  to Step 6 treating the batch as not run, so process-branch takes the MRs
  one at a time once the mayor has cleared the way.

The command stacks the eligible MRs via ancestry-preserving merges,
enforces the push precondition described in Step 2, runs the configured gate
commands once, and either fast-forwards the whole batch to {{target_branch}}
or bisects to isolate a red MR and lands the rest. It also
runs the same post-merge cleanup as a single-MR merge for every MR in
`.merged[]` — closes MR + source beads, deletes branches, nudges mayor,
sends MERGED to the witness for polecat branches (gt-9gjl), and archives
each MR's MERGE_READY (claude-7fc). Post-merge sends MERGED itself; do NOT
send it yourself.

**Step 4: Expect a possible respawn**

Closing this patrol cycle and respawning your session happens only when you
are this rig's refinery running in your own pane,
`merge_queue.cycle_session_after_merge` is on (rig-root config.json), the
batch had no error, and the handoff cooldown is clear. When it happens, `gt
mq batch run` prints `🔄 unit complete, respawning <session> for the next
unit` and your session ends there by design — a fresh successor starts the
next patrol cycle. Otherwise it prints `○ session kept: <cause>`; continue
to Step 6 (the single-MR path) in this session, same as today. An errored
batch always keeps the session, and the Step 3 recovery post-merges pass
`--no-cycle`, so recovery never respawns you mid-way.

**Step 5: Leave culprits and conflicts alone**

Entries in `.culprits[]` (isolated by bisection) and `.conflicts[]` (stack
conflicts) are intentionally left untouched here — no bead was closed, no
branch deleted. Do not duplicate conflict/failure bookkeeping in this step;
they remain open/ready and are picked up by process-branch next, same as any
other ready MR (see Step 6).

Each culprit additionally carries a `batch-culprit:<head>` label, written by
the run at the head bisection judged. `gt mq batch candidates` skips an MR
whose mark still names its submitted head, so the next cycle does not stack it
again — a re-run re-derives the failure the bisection already paid for while
the batch's good MRs wait behind it. The mark is keyed to the head, so a
rework that moves the branch head makes the MR batch-eligible again; no step
writes or clears it.

**Step 6: Continue to the single-MR path — do NOT skip it**

`gt mq batch run` only ever touches non-P0 MRs older than the rig's
`merge_queue.batch_min_age`, capped at `merge_queue.batch_max`. P0 MRs are never batched (by design, so critical fixes
aren't held up assembling a batch), and any MR beyond `merge_queue.batch_max`
or younger than `merge_queue.batch_min_age` was left untouched too. All of those are still sitting in
the tracked MR list from queue-scan.

**Do NOT skip to loop-check.** Continue forward in DAG order to process-branch
as normal, exactly as you would if batch-scan had been skipped (empty
eligible_total) — this is what prevents P0 fixes from starving behind a
batch run. MRs the batch already merged are closed and gone from the queue,
so process-branch will not see them again; MRs left in `.culprits[]` or
`.conflicts[]` remain ready and are handled by process-branch's existing
conflict-handling and test-failure-handling logic, same as any other MR —
no special-casing needed."""

[[steps]]
id = "process-branch"
title = "Merge rehearsal"
needs = ["batch-scan"]
description = """
Pick the next MR with `gt mq next`, then rehearse an ancestry-preserving merge against the MR's effective target branch.

**Step -1: Pick the MR (priority order, gt-tgey7)**

Immediately before each pick, re-read the queue and take exactly the MR it names:
```bash
MR=$(gt mq next <rig> --quiet)   # empty = no ready MR: go to loop-check
```
Never pick from the list you noted at queue-scan: it is a snapshot, and an MR
queued since (a P0 fix, say) must be taken at the next pick, not next cycle. On
2026-09-23 a P0 waited behind a P2 exactly that way. `gt mq review` enforces
this: it exits 2 with "out of priority order: <mr> ... outranks" while a ready,
higher-scored MR waits. Treat that as "switch to the named MR", not as an infra
failure. For a real exception (a stack that depends on this MR) pass
`--out-of-order "<reason>"` to `gt mq review` and say why in your notes.

**Config: integration_branch_refinery_enabled = {{integration_branch_refinery_enabled}}**
**Config: target_branch = {{target_branch}}**

**Step 0: Determine merge target**

Resolve `<merge-target>` using the **Target Resolution Rule** above.
Do NOT hardcode `main` unless `main` is actually the resolved MR target.

**Step 0.5: Verify branch still exists (race-condition guard)**

Branches can disappear between queue-scan and here (e.g. cherry-picked to target directly).

```bash
git ls-remote --exit-code origin refs/heads/<polecat-branch>
```

If the branch no longer exists (exit code non-zero):
- Resolve PR state with `gt mq pr-status <rig> <mr-id> --json`.
- If `PR_STATE=MERGED`: return to merged-pr-sweep behavior for this MR.
- If lookup errors, ambiguity, `OPEN`, `CLOSED`, or `NOT_FOUND`: leave the MR open and skip to loop-check; do NOT close it as missing, do NOT nudge the polecat.

**Step 1: Checkout and rehearse merge without rewriting the submitted head**
```bash
git fetch --prune origin
git checkout -b temp origin/<polecat-branch>
git merge --no-ff --no-edit origin/<merge-target>
```

The fetch is not optional: `origin/<merge-target>` in this clone is only as
fresh as the last fetch, and a rehearsal against a stale target scores a
gate that cannot be attributed to the MR (gt-x1x3). If the target moves
while the gate runs, the review itself stays sound (`gt mq review` diffs
from the merge-base, not from the moved target), but the merge in
merge-push must be rehearsed again on the new tip before it is pushed
(merge-push fetches and fast-forwards the target first and says so).

**Step 1 note (REBASE-BEFORE-REVIEW, gt-oh41):** This rehearsal exists to
make `temp` safe to review, not only to test the merge. Once it succeeds,
`temp`'s merge-base with `origin/<merge-target>` IS `origin/<merge-target>`'s
current tip, so a three-dot diff and a plain diff against `temp` agree by
construction. The raw `origin/<polecat-branch>` — before this rehearsal —
is NOT safe to pass to `gt mq review` directly: quality-review always
invokes it with `--rehearsed temp`, this branch.

**Step 2: Check merge rehearsal result**

The merge exits with:
- Exit code 0: Success - proceed to run-tests
- Exit code 1 (conflicts): Conflict detected - proceed to Step 3

To detect conflict state after merge fails:
```bash
# The refinery runs in a worktree, where .git is a gitdir pointer file, so a
# hardcoded .git/ path never resolves — read MERGE_HEAD through git (gt-cdo3)
git rev-parse -q --verify MERGE_HEAD >/dev/null && echo "CONFLICT_STATE"
```

**Step 3: Handle conflicts (if any)**

If merge rehearsal SUCCEEDED (exit code 0):
- Skip to run-tests step (continue normal merge flow)

If merge rehearsal FAILED with conflicts:

1. **Abort the merge** (DO NOT leave repo in conflicted state):
```bash
git merge --abort
```

2. **Record the conflict on the MR wisp (REQUIRED — single command)**:
```bash
gt mq record-conflict <rig> <mr-bead-id>
```

This single command handles everything: it creates the dispatchable
conflict-resolution task, blocks the MR on that task (it re-enters the queue
once the task closes), and writes `conflict_task_id`, `last_conflict_sha`,
and `retry_count` onto the MR bead. It also clears any `pre_verified` metadata
on the MR — a conflict means the target has moved, so a prior pre-verification
is stale and must not let a later fast-path skip gates.

**Do NOT** recreate this bookkeeping by hand with a raw `bd create` — that
leaves `conflict_task_id`/`last_conflict_sha` null and `pre_verified` stale on
the MR wisp (gt-nao), silently breaking the conflict audit trail.

If the command reports the conflict was deferred (merge slot busy), no task
was created — the MR simply stays in queue and will be retried on a future
patrol cycle. This is not a failure.

3. **Skip this MR** (do NOT delete branch or close MR bead):
- Leave branch intact for conflict resolution
- Leave MR bead open (will be re-processed after the conflict task closes,
  or retried next cycle if the conflict was deferred)
- Continue to loop-check for next branch

**CRITICAL**: Never delete a branch that has conflicts. The branch contains
the original work and must be preserved for conflict resolution.

Track: merge rehearsal result (success/conflict), conflict task ID if created."""

[[steps]]
id = "run-tests"
title = "Run quality checks and tests"
needs = ["process-branch"]
description = """
**⚠ FIRST CHECK: If run_tests = "false", skip this ENTIRE step. Proceed directly to the next step. Do not run any quality checks or tests.**

**Config: run_tests = {{run_tests}}**
**Config: test_command = {{test_command}}**
**Config: setup_command = {{setup_command}}**
**Config: typecheck_command = {{typecheck_command}}**
**Config: lint_command = {{lint_command}}**
**Config: build_command = {{build_command}}**

If run_tests is "false": STOP HERE. Skip everything below and proceed to the next step.

**0. Gate load check (mayor standing rule):** Before starting — or retrying —
a full-suite gate, check 1-minute load average:
```bash
sysctl -n vm.loadavg 2>/dev/null || uptime   # macOS vs Linux fallback
```
Do NOT start or retry a full-suite gate while 1-min loadavg > 60. If a gate
is killed or times out under load, the result is INCONCLUSIVE — never count
it as a failure against the branch. Wait for load to drop and retry, or
escalate if it stays high.

**1. Run quality checks (skip any that are not configured):**

If setup_command is set: `{{setup_command}}`
If typecheck_command is set: `{{typecheck_command}}`
If lint_command is set: `{{lint_command}}`
If build_command is set: `{{build_command}}`

```bash
{{setup_command}}           # Make sure all newly added dependencies are installed (if command set)
{{typecheck_command}}       # Check for type errors (if command set)
{{lint_command}}            # Check for lint errors (if command set)
{{build_command}}           # Make sure it builds (if command set)
```

Empty commands mean "not configured for this project" — skip silently.

**2. If quality checks fail:**

Proceed to handle-failures step. Track which specific check failed
(setup/typecheck/lint/build) for the failure diagnosis.

**3. Run the test suite:**

**Rule (gt-tuiy, shared with mol-polecat-work's pre-verify step and
mol-polecat-work-monorepo's pre-verify step — keep all in sync): wrap
test_command through the container-gate slot only when it
spins Docker containers (Dolt, testcontainers) for THIS rig; run it bare
otherwise.** The slot is a townwide lock shared by every rig — wrapping a
non-Docker rig's gate serializes it behind every other rig's Dolt/
testcontainers suite for no reason, and (gt-tuiy attempt 2) a stopped Docker
Desktop would fail even suites that never touch it. Wrapping IS required
when test_command spins Dolt/testcontainers (e.g. beads, gastown's
testcontainers-based patrol tests) — an unwrapped suite like that collides
with any other rig's container-backed suite on the shared Docker VM even
though `gt slot status` looked free.

If {{rig}}'s test_command spins Docker containers:
```bash
gt slot run --role {{rig}}/refinery -- {{test_command}}
```
Otherwise run it bare:
```bash
{{test_command}}
```

**Never substitute a bare `go test ./...` for the configured
`{{test_command}}` (gt-885g).** This rig's Makefile exports
CGO_CPPFLAGS/CGO_LDFLAGS for keg-only icu4c; bare `go test` fails to build
go-icu-regex with "unicode/regex.h file not found", producing ~21 packages
"[build failed]" that reads as broken code rather than a missing env. Always
run the exact configured test_command (e.g. `make test`), never your own
substitute.

**Run the gate in the foreground and wait for it.** One Bash call with a
timeout of 2700000 ms (45 minutes; this role's preset allows up to
3600000 ms, use that if the suite legitimately needs it), writing the log
to a file so a red run stays inspectable. No pipeline: the exit code must
come straight from the gate, and PIPESTATUS does not exist in zsh:

```bash
gt slot run --role {{rig}}/refinery -- {{test_command}} > /tmp/<mr-bead-id>-gate.log 2>&1; echo "GATE_EXIT=$?"; tail -40 /tmp/<mr-bead-id>-gate.log
```

Never run the gate in the background and sleep-poll it: the call returns
the instant the suite exits, while a `sleep 290` poll loop leaves the
refinery idle for up to five minutes after the suite is already done
(measured 4m52s, 2m43s and 1m26s on three consecutive MRs on 2026-09-19).
If the foreground call is refused because the Bash ceiling is still the
default (preset not yet applied to this session), background it and check
every 30 seconds at most.

Track results: pass count, fail count, specific failures."""

[[steps]]
id = "quality-review"
title = "Editorial review via gt mq review"
needs = ["run-tests"]
description = """
`gt mq review` is the single invoker of om: it accepts the already-rehearsed
`temp` branch process-branch built, asserts the harness manifest version,
invokes the rig's editorial gate, classifies the outcome, retries once for
transient failures, and on a verdict writes a git note and a receipt bead.
Never invoke om directly from this formula — always go through this command.

**Config: editorial_required = {{editorial_required}}**

**Step 0: Skip this step entirely when the rig hasn't opted into editorial
review**

`editorial_required` reflects the rig's `merge_queue.editorial.required`
setting, which defaults to `false`. Most rigs have never set this block.
`gt mq review` refuses to run without `--force` on such a rig (exit 2,
Class: config_error) — that refusal is not an infra failure, it is the
command correctly declining an unconfigured review, and this formula never
calls `--force`.

**If `editorial_required` is not `"true"`: do NOT call `gt mq review` at
all.** This step auto-completes with no action; continue straight to
handle-failures exactly as if quality-review did not exist.

**If `editorial_required` is `"true"`, continue with Step 1.**

**Step 1: Run the review against the rehearsed branch**

Determine N: this issue's current attempt number (count prior `MERGE
REJECTION (attempt` entries in the issue's bd notes, plus 1 — first attempt
is N=1). Reuse this same N below in the FIX_NEEDED mail and the reject
reason.

```bash
REVIEW_DIR="${TMPDIR:-/tmp}/gt-mq-review-$(id -u)"; mkdir -p -m 700 "$REVIEW_DIR"
gt mq review <mr-bead-id> --rehearsed temp --attempt <N> --json > "$REVIEW_DIR/<mr-bead-id>.json"
REVIEW_EXIT=$?
cat "$REVIEW_DIR/<mr-bead-id>.json"
```

Keep that file: the reject call on a request_changes verdict records the
verdict's findings from it, and the exit-2 branch reads its `Class`. A verdict
you pipe or retype instead of writing to the file is one the reject call
cannot record.

Write it under your own uid's directory, as above, and not to a bare
`/tmp/<mr-bead-id>-review.json`: the file is input to the reject call, so a
predictable name in a world-writable directory is one another local user can
pre-create or symlink to feed the source bead findings the refinery never
produced. The other blocks name the same path as
`"${TMPDIR:-/tmp}/gt-mq-review-$(id -u)/<mr-bead-id>.json"` — each fenced block
is its own shell, so re-derive it rather than expecting a variable to survive.

Run it in the foreground and wait: a review takes about five minutes,
well inside any Bash ceiling, so there is nothing to background. A
`sleep 290` poll after a backgrounded review adds up to five idle minutes
per MR for no reason.

**Step 2: Branch on the exit code**

**Exit 0 — approve:** Continue to handle-failures, then merge-push, as normal.

**Exit 1 — request_changes:** The rehearsed branch has editorial findings.
- Abort the rehearsal (same cleanup as a test/build rejection):
  ```bash
  git checkout {{target_branch}}
  git branch -D temp
  ```
- Send FIX_NEEDED directly to the polecat:
  ```bash
  gt mail send <rig>/polecats/<polecat-name> -s "FIX_NEEDED <polecat-name>" --stdin <<'BODY'
  Branch: <branch>
  Issue: <issue-id>
  Polecat: <polecat-name>
  Rig: <rig>
  Target: <target-branch>
  Failed-At: $(date -u +%Y-%m-%dT%H:%M:%SZ)
  Failure-Type: om-editorial
  Error: findings are on MR bead <mr-bead-id> and source issue <issue-id>
  MR-Bead-ID: <mr-bead-id>
  Attempt-Number: <N>
  BODY
  ```
- **Record the rejection and close the MR bead as rejected** (gt-bsmp). The
  verdict IS the rejection, and an MR left `ready` behind it is a rejected
  diff the queue re-rehearses and re-reviews on an unchanged head every cycle
  — a re-roll that comes back approve satisfies the push precondition for a
  diff a reviewer already rejected (gt-bveg). One call does both:
  ```bash
  gt mq reject <rig> <mr-bead-id> --no-recover --attempt <N> --findings-json "${TMPDIR:-/tmp}/gt-mq-review-$(id -u)/<mr-bead-id>.json" --reason "EDITORIAL REJECTION (attempt <N>): om gate request_changes, <score>, <n> findings"
  ```
  `--findings-json` appends the MERGE REJECTION note to the source bead —
  the marker, the Branch/Target/MR lines, and one machine-parsable line per om
  finding — which is where the next attempt's prior-findings builder and the
  mol-polecat-work resume path read them. Never compose the finding lines
  yourself: a line the formatter did not write parses as no finding, so the
  rejection reaches the next attempt without them and the same defect is
  re-merged (gt-3mp1, gt-s4f6). The call errors if it could not write them, so
  a rejection you see reported is one the record survived.
  `--attempt <N>` is the same N the reason names, so the recorded note's own
  `(attempt <N>)` header agrees with it instead of falling back to the MR's
  conflict-retry count.
  `--no-recover` because the polecat-liveness check and dead-polecat
  RECOVERED_BEAD redispatch below are this step's own; a second recovery would
  hand the deacon a second redispatch request for the same bead.
- **Check whether the polecat is still alive** (gt-tc0 — transient polecats
  exit at `gt done` and their source bead is closed, so FIX_NEEDED mail to a
  dead polecat is never read and this rejection sits unread forever while the
  MR stays closed):
  ```bash
  gt session status <rig>/<polecat-name> --json   # check .running
  ```
  **If running is false (or the session does not exist):**
  1. Reopen the source bead so it is dispatchable:
     ```bash
     bd update <issue-id> --status=open --assignee=
     ```
  2. Hand it to the deacon redispatch pipeline (cooldown + attempt limits
     are enforced there):
     ```bash
     gt mail send deacon/ -s "RECOVERED_BEAD <issue-id>" --stdin <<'BODY'
     Merge rejection with no live worker (transient polecat).

     Bead: <issue-id>
     Polecat: <rig>/polecats/<polecat-name>
     MR: <mr-bead-id>
     Branch: <branch>
     Failure-Type: om-editorial
     Attempt-Number: <N>

     Source bead reopened with MERGE REJECTION notes. Please re-dispatch.
     The branch survives on origin; the next polecat can resume it.
     BODY
     ```
  The redispatched polecat reads that note — finding lines included — and
  fixes forward on the branch. **Completion condition:** the polecat's session
  was checked, and either it is running (FIX_NEEDED reaches it) or the bead is
  reopened and the deacon has been mailed.
- Leave the polecat branch in place — the next polecat fixes forward on it,
  which is what makes this a resubmit rather than a fresh start.
- Archive the MERGE_READY message and skip to loop-check.

**Exit 2 — execution error (never an approval):** `gt mq review` could not
produce a verdict — binary missing, version mismatch, backend timeout, or
similar — with one exception below. This is an infra failure, not a judgment
on the branch. (Since Step 0 already skips the call when `editorial_required`
is not `"true"`, a config_error here means the rig's config changed to
required mid-run, or a `--force` call happened elsewhere — treat it the same
as any other exit 2, never as an approval or a skip.)
- Read the failure class from the review JSON:
  ```bash
  jq -r '.Class' "${TMPDIR:-/tmp}/gt-mq-review-$(id -u)/<mr-bead-id>.json"
  ```
- **If the class is `review_in_flight`: not an infra failure.** A review of
  the same work already holds the marker (gt-97cm) and will write its own
  verdict shortly. Skip escalation (do NOT mail the witness) and go straight
  to the cleanup and loop-check below — the next patrol cycle finds either
  that review's note recorded or the marker still held.
- For every other class:
  - Leave the MR bead open and the branch intact — do not touch either.
  - Escalate to the witness with the failure class:
    ```bash
    gt mail send <rig>/witness -s "HELP: gt mq review failed" -m "MR: <mr-bead-id>
    Issue: <issue-id>
    Branch: <branch>
    failure_class: <class from above>"
    ```
- Clean up the temp branch and skip to loop-check:
  ```bash
  git checkout {{target_branch}}
  git branch -D temp
  ```
- Do NOT send FIX_NEEDED. Do NOT send MERGE_FAILED.

Track: review exit code, failure class (exit 2 only) and whether
review_in_flight was left open with no escalation, polecat liveness checked
and the dead-polecat case reopened + handed to the deacon, and — exit 1 only —
the MR closed as rejected with the source bead carrying the MERGE REJECTION
note and its finding lines."""

[[steps]]
id = "handle-failures"
title = "Handle quality check or test failures"
needs = ["quality-review"]
description = """
**VERIFICATION GATE**: This step enforces the Beads Promise.

If all checks and tests PASSED: This step auto-completes. Proceed to merge.

If any check or test FAILED:
1. Diagnose: Is this a branch regression or pre-existing on the target branch?
2. If branch caused it:
   - Abort merge (clean up temp branch)
   - **Send FIX_NEEDED directly to the polecat** (event-driven lifecycle):
     ```bash
     gt mail send <rig>/polecats/<polecat-name> -s "FIX_NEEDED <polecat-name>" --stdin <<'BODY'
     Branch: <branch>
     Issue: <issue-id>
     Polecat: <polecat-name>
     Rig: <rig>
     Target: <target-branch>
     Failed-At: $(date -u +%Y-%m-%dT%H:%M:%SZ)
     Failure-Type: <tests|build|lint|typecheck>
     Error: <failure description/output>
     MR-Bead-ID: <mr-bead-id>
     Attempt-Number: <N>
     BODY
     ```
   - **Update the bead** with failure details so they survive session death.
     Use `--append-notes` (plain `--notes` REPLACES the polecat's own notes —
     gt-nxvg), the exact "MERGE REJECTION" vocabulary, and the branch — the
     polecat resume path (mol-polecat-work) greps notes for this marker and
     the branch name to make a targeted fix on the surviving branch:
     ```bash
     bd update <issue-id> --append-notes "MERGE REJECTION (attempt <N>): <failure-type> - <error summary>
     Branch: <branch>
     Target: <target-branch>
     MR: <mr-bead-id>"
     ```
   - **Check whether the polecat is still alive** (gt-tc0 — transient
     polecats exit at `gt done` and their source bead is closed, so
     FIX_NEEDED mail to a dead polecat is never read and the MR would
     re-queue forever while the fix never happens):
     ```bash
     gt session status <rig>/<polecat-name> --json   # check .running
     ```
     **If running is false (or the session does not exist):**
     1. Reopen the source bead so it is dispatchable:
        ```bash
        bd update <issue-id> --status=open --assignee=
        ```
     2. Hand it to the deacon redispatch pipeline (cooldown + attempt
        limits are enforced there):
        ```bash
        gt mail send deacon/ -s "RECOVERED_BEAD <issue-id>" -m "Merge rejection with no live worker (transient polecat).

        Bead: <issue-id>
        Polecat: <rig>/polecats/<polecat-name>
        MR: <mr-bead-id>
        Branch: <branch>
        Failure-Type: <failure-type>

        Source bead reopened with MERGE REJECTION notes. Please re-dispatch.
        The branch survives on origin; the next polecat can resume it."
        ```
     The redispatched polecat reads the MERGE REJECTION note, checks out
     the existing branch, and fixes forward.
   - **Close the MR bead as rejected** (gt-bsmp) when the gate ran and the
     branch caused the failure. The fix is resubmitted as a NEW MR from this
     same branch, so an MR left `ready` here only keeps a rejected diff
     merge-eligible: the queue re-gates (and, on an editorial_required rig,
     re-reviews) it on the unchanged head every cycle until something else
     clears it. Close it with the failure as the reason:
     ```bash
     gt mq reject <rig> <mr-bead-id> --no-recover --reason "GATE REJECTION: <failure-type> - <error summary>"
     ```
     `--no-recover` because the polecat-liveness check and the RECOVERED_BEAD
     redispatch above are this step's own; a second recovery would hand the
     deacon a second redispatch request for the same bead.
   - **An infra failure is not a gate rejection — leave the MR open** and
     escalate the gate problem instead. A timeout, an `exit 127`, an empty
     gate command and a gate that would not launch all say nothing about the
     branch, and closing on a gate flap dequeues every MR in the queue and
     sends every worker off to fix nothing.
   - **Do NOT delete the branch** — the next session needs it for the fix
   - **Do NOT reopen the source issue when the polecat is ALIVE** — it is
     still working on it (reopen ONLY in the dead-polecat case above)
   - **Do NOT send MERGE_FAILED to witness** — FIX_NEEDED goes to polecat directly
   - Clean up temp branch and skip to loop-check:
     ```bash
     git checkout {{target_branch}}
     git branch -D temp
     ```
   - Archive the MERGE_READY message
   - Skip to loop-check
3. If pre-existing on the target branch:
   - **DUPLICATE CHECK (MANDATORY)**: Before filing a new bug, search for existing open bugs:
     ```bash
     bd search "<failure description>" --status open --label gt:bug --limit 5
     ```
     If an existing open bug covers the same failure, do NOT create a duplicate.
     Instead, note the existing bead ID and proceed.
   - Only if NO existing bug matches: bd create --type=bug --priority=1 --title="Pre-existing failure: <description>"
   - FORBIDDEN: Writing code to fix quality check or test failures. You merge branches, you do not develop.
   - Proceed with the merge if the failure is pre-existing (not caused by the branch).

**FIX_NEEDED CHECKLIST** (all required before skipping to loop-check):
- [ ] FIX_NEEDED sent to polecat (with failure details)
- [ ] Bead updated with MERGE REJECTION notes appended (marker + branch)
- [ ] Polecat liveness checked; if dead → bead reopened + RECOVERED_BEAD sent to deacon
- [ ] MR bead closed as rejected, or left open because the gate never ran
      (infra) and the gate problem escalated
- [ ] Temp branch cleaned up (NOT the polecat branch!)
- [ ] MERGE_READY message archived

**GATE REQUIREMENT**: You CANNOT proceed to merge-push without:
- All quality checks and tests passing, OR
- Bead filed (or existing duplicate confirmed) for the pre-existing failure

FORBIDDEN: Writing application code, exploring polecat implementations, or
re-implementing fixes. You are a mechanical merge processor.

This is non-negotiable. Never disavow. Never "note and proceed." """

[[steps]]
id = "merge-push"
title = "Merge and push"
needs = ["handle-failures"]
description = """
Merge and push. CRITICAL: verified post-merge cleanup comes immediately after
push. `gt mq post-merge` now does the MERGED / MERGE_READY / temp / attestation
chores itself (claude-7fc, see Step 3 below) — fall back to sending MERGED or
doing another chore by hand only for one that printed `✗`.

**Config: integration_branch_refinery_enabled = {{integration_branch_refinery_enabled}}**
**Config: target_branch = {{target_branch}}**
**Config: delete_merged_branches = {{delete_merged_branches}}**
**Config: merge_strategy = {{merge_strategy}}**
**Config: require_review = {{require_review}}**
**Config: editorial_required = {{editorial_required}}**

**Step 1: Merge (strategy-dependent)**

Determine `<merge-target>` using the **Target Resolution Rule** above.

**If merge_strategy = "direct" (default):**

```bash
git fetch origin
git checkout <merge-target>
git merge --ff-only origin/<merge-target>
git merge --no-ff -m "Merge <polecat-branch> into <merge-target>" origin/<polecat-branch>
git push origin <merge-target>
```

If `git merge --ff-only origin/<merge-target>` moved the local target past
the tip the rehearsal in process-branch used, the merge you are about to
push was never rehearsed on this tip: go back to process-branch and
rehearse again before merging (gt-x1x3). The push rejects a stale merge as
non-fast-forward anyway, but only after the gate was spent.

The two merges move different refs. `--ff-only` brings the local *target* up
to origin and never applies to the polecat branch; that one is always merged
`--no-ff`. Only a merge commit's own diff from its first parent equals the MR's
diff, which is the equality an om note's patch-id proves: the
editorial-coverage check recomputes patch-id(commit^1..commit) for every
first-parent commit it walks, and `gt mq rekey-note` proves that same pair
before stamping. Fast-forwarding the branch lands its commits as plain
first-parent commits whose own diffs are fractions of the MR, leaving main
with commits no verdict can cover and no re-key or hand-written note able to
repair them (gt-nhqoa).

**Step 1.5 (direct only): VERIFY PUSH SUCCEEDED (CRITICAL - PATCH-003)**

Push can fail silently (network, auth, hooks). IMMEDIATELY verify:
```bash
git fetch origin
LOCAL_SHA=$(git rev-parse <merge-target>)
REMOTE_SHA=$(git rev-parse origin/<merge-target>)
echo "Local:  $LOCAL_SHA"
echo "Remote: $REMOTE_SHA"
```

**If SHAs match**: Push succeeded.

**Step 1.6 (direct only): CHECK FOR OPEN PR ON BRANCH (gas-fk4)**

Before proceeding to post-merge cleanup (which deletes the remote branch),
check if this branch has an open GitHub PR. Deleting the remote branch would
cause GitHub to auto-close the PR as "closed" (not "merged"), destroying
the PR audit trail and making it appear that work was rejected.

```bash
if PR_JSON=$(gt mq pr-status <rig> <mr-bead-id> --json); then
  PR_STATE=$(echo "$PR_JSON" | jq -r '.pr.state // "NOT_FOUND"')
else
  PR_STATE="LOOKUP_ERROR"
fi
if [ "$PR_STATE" = "OPEN" ] || [ "$PR_STATE" = "LOOKUP_ERROR" ]; then
  echo "Open PR found on branch — will use --skip-branch-delete in post-merge"
  # Set flag for Step 3 (post-merge cleanup) to skip branch deletion
  SKIP_BRANCH_DELETE=true
fi
```

If an open PR exists, pass `--skip-branch-delete` to `gt mq post-merge` in Step 3.
The PR should be merged or closed through the GitHub API, not by branch deletion.

Continue to Step 2.

**If SHAs differ**: STOP. Push failed silently.
- DO NOT send MERGED notification
- DO NOT close MR bead
- DO NOT delete branch
- Debug the push failure (check `git push` output, network, auth)
- Retry push and verify again before proceeding

**If merge_strategy = "pr":**

Create a GitHub PR for the submitted branch instead of direct merge. Do not
force-push or rebase the polecat branch; post-merge proof depends on the
submitted head remaining stable.

```bash
# Create the PR using bead metadata for title/description
PR_URL=$(gh pr create \
  --base <merge-target> \
  --head <polecat-branch> \
  --title "<issue-title> (<issue-id>)" \
  --body "## Summary

Automated merge from polecat branch.

- **Issue**: <issue-id>
- **Polecat**: <polecat-name>
- **Branch**: <polecat-branch>
- **Tests**: Passed (verified by refinery)

---
*Created by Gas Town Refinery*")
echo "PR created: $PR_URL"
```

If the PR already exists for this branch, `gh pr create` will fail. In that case,
find the existing PR:
```bash
PR_JSON=$(gt mq pr-status <rig> <mr-bead-id> --json)
PR_URL=$(echo "$PR_JSON" | jq -r '.pr.url // empty')
```

**Step 1.5 (pr only): VERIFY PR CREATED**

```bash
gh pr view "$PR_URL" --json url,state -q '.url + " " + .state'
```

If the PR was not created or is in an unexpected state, debug and retry.

**Step 1.6 (pr only): WAIT FOR CI CHECKS TO PASS**

⚠️ **DO NOT PROCEED until CI passes. DO NOT send MERGED until the PR is actually merged.**

```bash
# Get the repo URL for gh commands
REPO_URL=$(git remote get-url origin | sed 's/.*github.com[:/]\\(.*\\)\\.git/\\1/')

# Wait for CI checks (timeout 15 minutes)
gh pr checks "$PR_URL" --repo "$REPO_URL" --watch --fail-fast
```

**If CI checks FAIL:**
Do NOT merge. Send FIX_NEEDED back to the polecat:
```bash
FAILURE_OUTPUT=$(gh pr checks "$PR_URL" --repo "$REPO_URL" 2>&1)
gt mail send <rig>/polecats/<polecat-name> -s "FIX_NEEDED <polecat-name>" --stdin <<'BODY'
Branch: <branch>
Issue: <issue-id>
PR: ${PR_URL}
Failure-Type: ci-checks
Error: $FAILURE_OUTPUT
Attempt-Number: 1
BODY
```
Then archive the MERGE_READY mail (`gt mail archive <id>`), delete temp
(`git branch -D temp`), and skip to loop-check.

**If CI checks PASS:**

**Step 1.7 (pr only): CHECK REVIEW APPROVAL STATUS (gas-fk4)**

⚠️ **DO NOT merge a PR that has not been explicitly approved.**
Plain review comments (COMMENTED) are NOT approval. Only an explicit
"APPROVED" reviewDecision allows the merge to proceed.

```bash
REVIEW_DECISION=$(gh pr view "$PR_URL" --repo "$REPO_URL" --json reviewDecision -q '.reviewDecision')
echo "Review decision: $REVIEW_DECISION"
```

| reviewDecision | Action |
|----------------|--------|
| `APPROVED` | Proceed to merge |
| `CHANGES_REQUESTED` | Send FIX_NEEDED to polecat (reviewer rejected), skip merge |
| `REVIEW_REQUIRED` or empty | PR has not been reviewed yet — skip merge, leave PR open |

**If CHANGES_REQUESTED:**
```bash
gt mail send <rig>/polecats/<polecat-name> -s "FIX_NEEDED <polecat-name>" --stdin <<'BODY'
Branch: <branch>
Issue: <issue-id>
PR: ${PR_URL}
Failure-Type: review-rejected
Error: Reviewer requested changes on the PR. Address the review feedback and resubmit.
Attempt-Number: 1
BODY
```
Clean up temp branch, archive MERGE_READY, skip to loop-check.

**If REVIEW_REQUIRED or empty (not yet reviewed):**
Do NOT merge. Do NOT close. Do NOT send FIX_NEEDED. Leave the PR open
for human review. Archive the MERGE_READY mail — the PR will be picked
up on a future patrol cycle if/when it gets approved.
Clean up temp branch and skip to loop-check.

**If APPROVED:**
Merge the PR:
```bash
gh pr merge "$PR_URL" --repo "$REPO_URL" --merge
```

If merge fails (conflict, branch protection), debug and retry.

⚠️ **STOP HERE - DO NOT PROCEED UNTIL THE PR IS ACTUALLY MERGED ON GITHUB**

**Step 2: Re-key the om verdict, then post-merge cleanup (REQUIRED — single command)**

On an editorial_required rig the landed commit first gets this MR's om verdict
re-keyed onto it (gt-fr3r) — the verdict is keyed to the rehearsal head `gt mq
review` reviewed, which this path never lands. Then the same command handles
closing the MR bead, closing the source issue, and deleting the remote polecat
branch (respects delete_merged_branches config):

```bash
# If an open PR was detected in Step 1.6 (direct), pass --skip-branch-delete
# to avoid auto-closing the PR via head_ref_delete.
# Otherwise, omit the flag.
SKIP_FLAG=""
if [ "${SKIP_BRANCH_DELETE:-false}" = "true" ]; then
  SKIP_FLAG="--skip-branch-delete"
fi

# Which commit is actually on <merge-target>?
#   direct: LOCAL_SHA, captured by Step 1.5 after the push was verified
#   pr:     the merge commit GitHub created for the PR
LANDED_SHA="${LOCAL_SHA:-}"
if [ -z "$LANDED_SHA" ] && [ -n "${PR_URL:-}" ]; then
  LANDED_SHA=$(gh pr view "$PR_URL" --json mergeCommit -q '.mergeCommit.oid')
fi

# A conflict-resolved MR needs an explicit --landed-commit attestation
# (gt-mlla). Resolving a conflict rewrites the source branch, so the
# commit_sha recorded at submission time no longer identifies what landed:
# the merge proof's file-level binding cannot hold for a branch whose work
# legitimately changed shape on the way to <merge-target>. The refinery used
# to pass this flag by hand, which meant it was passed on the cycles someone
# remembered and omitted on the rest — and an omitted attestation fails the
# post-merge proof outright, so the MR closes only on the remembered cycles.
LANDED_FLAG=""
CONFLICT_TASK=$(gt mq status <mr-bead-id> --json | jq -r '.conflict_task_id // empty')
if [ -n "$CONFLICT_TASK" ]; then
  if [ -z "$LANDED_SHA" ]; then
    echo "STOP: MR <mr-bead-id> went through conflict resolution (task $CONFLICT_TASK), but the SHA pushed to <merge-target> could not be determined. Do not run post-merge blind; resolve the landed SHA first."
    exit 1
  fi
  LANDED_FLAG="--landed-commit $LANDED_SHA"
  echo "Conflict-resolved MR (task $CONFLICT_TASK) — attesting landed commit $LANDED_SHA"
fi

# gt-fr3r: re-key this MR's om verdict onto the commit that landed. The verdict
# is keyed to the rehearsal head `gt mq review` reviewed — process-branch's
# `temp` — which never lands; the merge above creates a different merge commit.
# The Go engineer path copies the note forward itself
# (editorial.CopyNotesToLanded); this path is raw git, so it asks for the same
# copy. gt mq rekey-note refuses rather than guesses (the patch-id must match)
# and stamps rekeyed_from on the note, so the post-hoc copy is on the record.
#
# Fires only when the merge above created this commit for THIS branch: when
# origin/<polecat-branch> was already contained in <merge-target> the merge
# created nothing, and LANDED_SHA is the previous MR's merge commit — which
# carries its own note. Re-keying onto it would be a patch-id mismatch.
if [ "{{editorial_required}}" = "true" ] && [ -n "$LANDED_SHA" ]; then
  BRANCH_TIP=$(git rev-parse origin/<polecat-branch> 2>/dev/null)
  LANDED_PARENTS=$(git log -1 --format=%P "$LANDED_SHA" 2>/dev/null)
  MERGE_LANDED_HERE=false
  case " $LANDED_PARENTS " in
    *" $BRANCH_TIP "*) MERGE_LANDED_HERE=true ;;
  esac
  if [ -n "$BRANCH_TIP" ] && [ "$MERGE_LANDED_HERE" = "true" ]; then
    REKEY_REASON="wisp raw-git merge-push: the verdict is keyed to the rehearsal head and the landed commit is a different merge (gt-fr3r)"
    if ! gt mq rekey-note <mr-bead-id> --landed "$LANDED_SHA" --target <merge-target> --reason "$REKEY_REASON"; then
      echo "EDITORIAL_RECORD_FAILED: <mr-bead-id> landed as $LANDED_SHA with no om note on it. Until the note is re-keyed, editorial-coverage counts the landed commit as covered by patch-id (a backfill moves the proof, not the verdict) and reports a Warning; a run that re-walks this commit will keep naming it in the details."
      gt mail send <rig>/witness -s "HELP: om note missing on landed commit <mr-bead-id>" --stdin <<BODY
MR: <mr-bead-id>
Issue: <issue-id>
Landed: $LANDED_SHA
Target: <merge-target>
Problem: gt mq rekey-note refused or failed, so the landed commit carries no om note.
Retry: gt mq rekey-note <mr-bead-id> --landed $LANDED_SHA --target <merge-target> --reason "$REKEY_REASON"
BODY
    fi
  fi
fi

gt mq post-merge <rig> <mr-bead-id> $LANDED_FLAG $SKIP_FLAG
```

The MR bead ID was in the MERGE_READY message or find via:
```bash
bd list --type=merge-request --status=open | grep <polecat-name>
```

Verify the command output shows all steps succeeded (✓ for each). On an
editorial_required rig whose merge created the commit, the re-key must have
printed `Re-keyed note` or `Note already on every target`; a failure there is
escalated to the witness, and the repair is another `gt mq rekey-note` run.

**Note**: In PR mode, run post-merge cleanup only after `gh pr merge` succeeds.
The branch is deleted by `gt mq post-merge` after merge proof passes, not by
`gh pr merge`. The `--skip-branch-delete` flag (gas-fk4) prevents branch deletion
when an open PR is detected in direct merge mode.

**Step 3: Verify post-merge finished the unit (REQUIRED)**

`gt mq post-merge` now does the per-MR chores itself (claude-7fc) and prints
a line for each:

- `✓ MERGED sent to <rig>/witness` — polecat branches only
- `✓ MERGE_READY archived: <id>`, or `○ no MERGE_READY mail for <id>` when
  none matched — either line means the chore ran, there is nothing to redo
- `✓ temp branch deleted`, or `○ no temp branch to delete` when there was
  none — either line means the chore ran, there is nothing to redo
- the landed-commit attestation comment on the MR bead, added silently when
  you passed `--landed-commit` (a failure there prints `✗ attestation
  comment failed on <id>: ...`; there is no separate success line)

It also reports the source branch: `✓ Deleted remote branch: <b>` for a
polecat/integration branch, or `○ remote branch <b> left for its owner (not a
polecat/integration branch)` for a crew or other branch — the refinery never
deletes those, and the `○` line needs no action. If a polecat/integration
branch delete fails, post-merge prints `✗ remote branch cleanup failed: …`,
escalates it to the operator itself, and still finishes the unit (post-merge
command, chores, respawn) with exit 0: do NOT re-run post-merge and do NOT
delete the branch by hand for that line.

Any real failure prints `✗` (a failed MERGED send, a MERGE_READY that could
not be archived or an unreadable inbox, a temp branch that could not be
deleted); `○` lines never need action. If a line shows `✗`, do that one
chore by hand
(`gt mail send <rig>/witness -s "MERGED <polecat-name>" …`,
`gt mail archive <id>`, `git branch -D temp`). Do NOT repeat a chore that
printed `✓` — a second MERGED is a duplicate mail.

**Expect a possible respawn.** Closing this patrol cycle and respawning your
session happens only when you are this rig's refinery running in your own
pane, `merge_queue.cycle_session_after_merge` is on (rig-root config.json),
and the handoff cooldown is clear. When it happens, post-merge prints `🔄
unit complete, respawning <session> for the next unit` and your session ends
there by design — a fresh successor starts the next patrol cycle. Otherwise
it prints `○ session kept: <cause>`; continue to loop-check yourself, same
as today, and keep your own patrol wisp.

**VERIFICATION GATE**: You CANNOT proceed to loop-check without:
- [x] Post-merge completed (MR closed, source issue closed, branch deleted
  or left for its owner; a `✗ remote branch cleanup failed` is already
  escalated)
- [x] No chore line shows `✗`, or you did that ✗ chore by hand (`✓` and `○`
  lines, e.g. `○ no MERGE_READY mail` or `○ no temp branch to delete`, pass)

If a chore printed `✗` and you have not done it by hand yet, GO BACK AND DO IT NOW.

Target branch has moved. Any remaining branches need rebasing on new baseline."""

[[steps]]
id = "loop-check"
title = "Check for more work"
needs = ["merge-push"]
description = """
More branches to process?

**Entry paths:**
- Normal: After successful merge-push
- Conflict-skip: After process-branch created conflict-resolution task

If yes, pick the path by what is left in the queue, using the same
candidates call batch-scan Step 1 makes (no flags: the rig config decides
the window, the size and the minimum count):

```bash
gt mq batch candidates <rig> --json
```

- `.eligible_total` > 0: return to **batch-scan** and land them as one
  batch (`gt mq batch run` applies the rig's `merge_queue.batch_min_count`
  itself and falls through to process-branch when too few remain). Visiting batch-scan only once per cycle and then
  walking the rest of the queue through process-branch costs one full
  container suite per MR; a batch is one suite for up to the rig's
  `merge_queue.batch_max`.
- Fewer: return to process-branch with the next branch.
- A rubric-changing MR never goes into a batch. Check each candidate:

  ```bash
  git diff --name-only origin/<merge-target>...origin/<polecat-branch> | grep -qx '.om.json' && echo RUBRIC
  ```

  Land a RUBRIC candidate alone via process-branch (the town directive for
  this role says how the manifest is re-stamped afterwards), then batch
  the rest. If isolating it leaves too few candidates for the rig's
  `merge_queue.batch_min_count`, the remainder goes through process-branch too.

If no: Continue to generate-summary.

**Track for this cycle:**
- branches_merged: count and names of successfully merged branches
- branches_conflict: count and names of branches skipped due to conflicts
- conflict_tasks: IDs of conflict-resolution tasks created

This tracking feeds into generate-summary for the patrol digest."""

[[steps]]
id = "generate-summary"
title = "Generate handoff summary"
needs = ["loop-check"]
description = """
Summarize this patrol cycle.

**VERIFICATION**: Before generating summary, confirm for each merged branch:
- [ ] `gt mq post-merge` (or `gt mq batch run`) completed verified cleanup
- [ ] none of its chore lines showed `✗`, or you redid that ✗ chore by hand

If verified cleanup was missed, run `gt mq post-merge`; never manually close
MR/source issues outside verified cleanup. Post-merge sends MERGED, archives
MERGE_READY and deletes temp itself and reports ✓/○/✗ for each; redo only a
chore that printed ✗ — never re-send a MERGED that printed ✓.

Include in summary:
- Branches merged (count, names)
- MERGED mails sent (count - should match branches merged)
- MR beads closed (count - should match branches merged)
- Source issues closed (count - should match branches merged)
- MERGE_READY mails archived (count - should match branches merged)
- Test results (pass/fail)
- Branches with conflicts (count, names)
- Conflict-resolution tasks created (IDs)
- Issues filed (if any)
- Any escalations sent

**Conflict tracking is important** for monitoring MQ health. If many branches
conflict, it may indicate target branches are moving too fast or branches are too stale.

This becomes the digest when the patrol is squashed."""

[[steps]]
id = "check-integration-branches"
title = "Check integration branches for landing"
needs = ["generate-summary"]
description = """
**Config: integration_branch_refinery_enabled = {{integration_branch_refinery_enabled}}**
**Config: integration_branch_auto_land = {{integration_branch_auto_land}}**

Read the two config values above, then:

- If integration_branch_refinery_enabled = "false": Say "Integration branches disabled." Close step.
- If integration_branch_auto_land = "false": Say "Auto-land disabled, nothing to do." Close step.
  FORBIDDEN: If auto_land is false, you MUST NOT land integration branches yourself using
  raw git commands. Do not merge integration branches to the default/target branch. Do not push
  integration branch merges. The auto_land=false setting means landing requires a human
  to run `gt mq integration land` manually. Respect this boundary unconditionally.
- If BOTH are "true":
  1. `bd list --type=epic --status=open` to find epics
  2. `gt mq integration status <epic-id>` for each epic
  3. If `ready_to_land: true`: run `gt mq integration land <epic-id>` and capture exit code + stderr
  4. If `ready_to_land: false`: do nothing, epic work is incomplete
  Never land partial epics — ALL children must be closed first.

## CRITICAL: Handling `gt mq integration land` failures (gh#3604)

> **The Refinery NEVER leaves a consolidation in an unobservable state.**
> Every non-zero exit from `gt mq integration land` MUST trigger the
> handler below. Silent skips are forbidden — they cause integration
> branches to sit orphaned and stall the merge queue indefinitely.

Capture the exit code and stderr from the land command:

```bash
LAND_OUTPUT=$(gt mq integration land <epic-id> 2>&1)
LAND_EXIT=$?
echo "$LAND_OUTPUT"
```

If `LAND_EXIT == 0`: success, continue to next epic.

If `LAND_EXIT != 0`, you MUST do **all** of the following, in order. Do not
skip a step. Do not "note and proceed". Do not move on to the next epic until
this handler completes:

**1. Verify temp worktree is clean (defensive — Go side already cleans up).**

The land command uses an isolated `.land-worktree` that is auto-removed via
defer. But if the binary crashed mid-merge, the dir may persist:

```bash
RIG_PATH=$(gt rig path)   # path to current rig root
if [ -d "$RIG_PATH/.land-worktree" ]; then
  # Best-effort manual cleanup: abort any in-progress merge and remove the worktree
  git -C "$RIG_PATH/.land-worktree" merge --abort 2>/dev/null || true
  git -C "$RIG_PATH/.land-worktree" reset --hard 2>/dev/null || true
  git -C "$RIG_PATH/.repo.git" worktree remove --force "$RIG_PATH/.land-worktree" 2>/dev/null || true
  rm -rf "$RIG_PATH/.land-worktree"
fi
```

After this block, the rig MUST have no leftover `.land-worktree`.

**2. Classify the failure.**

Look in `$LAND_OUTPUT` for the structured marker emitted by the Go binary:

```
LAND_FAILED: epic=<id> branch=<name> target=<target> reason=<conflict|merge-error|...>
```

- `reason=conflict`: branch consolidation hit merge conflicts. Goes to step 3.
- `reason=merge-error` or other: infrastructure/transient error. Goes to step 4.
- No `LAND_FAILED:` marker (e.g., precondition failure like open MRs / open
  children): record the message and skip to step 5 (escalate). DO NOT retry
  the same epic this cycle.

**3. (conflict) File a conflict-resolution bead and block the epic.**

```bash
TASK_ID=$(bd create --type=task --priority=1 \\
  --title="Resolve consolidation conflicts: <epic-title> (<epic-id>)" \\
  --description="## Consolidation conflict — gh#3604

Epic: <epic-id>
Integration branch: <branch>
Target: <target>
Detected: $(date -u +%Y-%m-%dT%H:%M:%SZ)
Conflict files (from LAND_FAILED marker):
<files-from-marker-or-'unknown'>

## Repro
```
git fetch origin
git checkout origin/<branch>
git merge origin/<target>
```
Resolve the conflicts on the integration branch and push it, then re-run
`gt mq integration land <epic-id>` to retry the consolidation.

## Why this exists
`gt mq integration land` exited non-zero with a merge conflict during
consolidation. The refinery filed this bead to make the failure observable
and to block the epic from re-attempting the land until conflicts are
resolved." \\
  --json | jq -r '.id')

# Block the epic on the conflict-resolution task so the next patrol
# cycle does NOT silently re-attempt the same broken consolidation.
bd update <epic-id> --add-blockedby "$TASK_ID"
```

**4. (any non-conflict failure) Nudge mayor and file a tracking bead.**

```bash
gt nudge mayor/ "INTEGRATION_LAND_FAILED epic=<epic-id> branch=<branch> reason=<reason> err=<one-line-error-summary>"

# File a tracking bead so the failure is durable across patrol cycles:
TASK_ID=$(bd create --type=task --priority=1 \\
  --title="Investigate integration land failure: <epic-id>" \\
  --description="`gt mq integration land <epic-id>` failed with non-conflict error.

Epic: <epic-id>
Branch: <branch>
Reason: <reason from LAND_FAILED marker, or 'unknown'>
Captured at: $(date -u +%Y-%m-%dT%H:%M:%SZ)

## Output (last 40 lines)
```
<tail-of-LAND_OUTPUT>
```" \\
  --json | jq -r '.id')

bd update <epic-id> --add-blockedby "$TASK_ID"
```

**5. ALWAYS escalate observably.**

Regardless of classification, the failure must surface to a human-monitorable
channel:

```bash
gt escalate -s HIGH "Refinery: integration land failed for <epic-id> (reason=<reason>) — see bead $TASK_ID"
```

**6. STOP processing this epic for this patrol cycle.**

Do NOT retry the same epic this cycle. Continue to the next epic in the list
(if any). After processing all epics, proceed to context-check as normal.

## Self-check (verification gate)

Before leaving this step on a failure path, ALL of the following MUST be true:

- [ ] `.land-worktree` directory does not exist on disk
- [ ] A conflict-resolution OR tracking bead was created (`$TASK_ID` is set)
- [ ] The epic is `--add-blockedby` the new task
- [ ] mayor was nudged AND `gt escalate` was called
- [ ] The next patrol will NOT silently re-attempt the same land

If any box is unchecked, GO BACK and complete it. The Scotty Test applies."""

[[steps]]
id = "context-check"
title = "Assess session health"
needs = ["check-integration-branches"]
description = """
Assess whether this session should continue or hand off to a fresh one.

**Gather signals:**

1. **Process memory** — check your own RSS:
```bash
ps -o rss= -p $$   # KB — divide by 1024 for MB
```

2. **Session age** — how long has this tmux session been running:
```bash
CREATED=$(tmux display-message -t $(tmux display-message -p '#S') -p '#{session_created}')
echo "Session age: $(( ($(date +%s) - CREATED) / 3600 ))h"
```

3. **Context usage** — your internal sense of how much context you've consumed.
Are you losing track of earlier conversation? Getting verbose? Repeating yourself?

4. **Work done this cycle** — how many merges, how much complexity processed.

**The principle:** Fresh sessions are cheap. Memory bloat compounds over time and
affects the entire system — other agents, Dolt, and the OS all share the same RAM.
An idle session at 1.5 GB is worse than cycling and restarting at 200 MB.

**Make a judgment call.** If multiple signals suggest you're getting heavy
(high RSS, long session, substantial context consumed), hand off. If you're
light and there's active work in the queue, continue."""

[[steps]]
id = "patrol-cleanup"
title = "End-of-cycle inbox hygiene"
needs = ["context-check"]
description = """
Verify inbox hygiene before ending patrol cycle.

**Step 1: Check inbox state**
```bash
gt mail inbox
```

Inbox should contain ONLY:
- Unprocessed MERGE_READY messages (will process next cycle)
- Active work items

**Step 2: Archive any stale messages**

Look for messages that were processed but not archived:
- PATROL: Wake up that was acknowledged → archive
- HELP/Blocked that was handled → archive
- MERGE_READY where merge completed but archive was missed → archive

```bash
# For each stale message found:
gt mail archive <message-id>
```

**Step 3: Check for orphaned MR beads**

Look for open MR beads with no corresponding branch:
```bash
bd list --type=merge-request --status=open
```

For each open MR bead:
1. Check if branch exists: `git ls-remote origin refs/heads/<branch>`
2. Determine `<merge-target>` using the **Target Resolution Rule** above.
3. If branch is gone, pick `<verification-target>`:
   - If `origin/<merge-target>` exists, use `<merge-target>`.
   - If `origin/<merge-target>` is missing (e.g. deleted integration branch), use `{{target_branch}}`.
4. Verify landed work: `git log origin/<verification-target> --oneline | grep "<source_issue>"`
5. If work found → close MR with reason "Merged (verified on <verification-target>; merge target was <merge-target>)"
6. If work NOT found → investigate before closing:
   - Check source_issue validity (should be gt-xxxxx, not branch name)
   - Search reflog/dangling commits if possible
   - If unverifiable, close with reason "Unverifiable - no audit trail"
   - File bead if this indicates lost work

**NEVER close an MR bead without verifying the work landed or is unrecoverable.**

**Goal**: Inbox should have ≤3 active messages at end of cycle.
Keep only: pending MRs in queue."""

[[steps]]
id = "burn-or-loop"
title = "Burn and respawn or loop"
needs = ["patrol-cleanup"]
description = """
End of patrol cycle decision. Use the signals from context-check to decide.

**If you decide to continue patrolling:**

Resolve your agent bead ID for this patrol cycle:
```bash
YOUR_AGENT_BEAD=$(gt agents resolve --role refinery --rig {{rig}})
```
This must resolve exactly one bead ID. If it fails, STOP and report the error. If it reports multiple results, STOP and report the ambiguity — manual disambiguation is required. Use the resolved `YOUR_AGENT_BEAD` in the commands below.

Then use await-event to subscribe to the refinery event channel with exponential backoff:

```bash
gt mol step await-event --channel refinery --rig {{rig}} --agent-bead "$YOUR_AGENT_BEAD" \
  --backoff-base 30s --backoff-mult 2 --backoff-max 15m --cleanup \
  --context-check-interval 5m
```

This command:
1. Watches `~/gt/events/refinery/{{rig}}/` for event files (polling-based; the
   channel is per-rig, so other rigs' events are invisible to you)
2. Returns IMMEDIATELY when an event is emitted (MERGE_READY, PATROL_WAKE, MQ_SUBMIT)
3. If no events, times out with exponential backoff:
   - First timeout: 30s
   - Second timeout: 60s
   - Third timeout: 120s
   - ...capped at 15 minutes max
4. Tracks `idle:N` label on refinery agent bead for backoff state
5. Returns `reason: context-yield` after 5m if no event arrived (see below)
6. `--cleanup` auto-deletes processed event files
7. Outputs `EFFORT: reduced` or `EFFORT: full` directive for next cycle

**Supported events:**
- `MERGE_READY` — from witness when polecat branch is pushed and ready to merge
- `PATROL_WAKE` — from witness when MRs waiting but refinery appears idle
- `MQ_SUBMIT` — from polecat via `gt mq submit`

**On event received** (refinery-specific activity):
await-event has already reset the idle counter to 0. Start the next patrol
cycle. The manual reset below is only a fallback and is harmless to repeat:
```bash
gt agents state "$YOUR_AGENT_BEAD" --set idle=0
```

**On timeout** (no events):
The idle counter was auto-incremented. Continue to next patrol cycle
(the longer backoff will apply next time).

**On context-yield** (5-minute interval reached, no events):
`await-event` output shows `CONTEXT: check`. Assess session health NOW, before
starting a new patrol cycle. This is the designed yield point — do NOT skip it.

```
1. Check RSS: ps -o rss= -p $$  (KB; divide by 1024 for MB)
2. Check session age (see context-check step instructions above)
3. Use your internal sense of context: are you forgetting earlier conversation?
```

If context is ACCEPTABLE (< 70% consumed, RSS < 1 GB, session < 8h):
- Call await-event again with the same parameters to continue waiting
- Do NOT start a full patrol cycle (avoids unnecessary token burn on idle rig)

If context is HIGH (≥ 70% consumed, or RSS ≥ 1 GB, or session ≥ 8h):
- Hand off immediately:
  ```bash
  gt patrol report --summary "context-yield handoff: <RSS>MB, <age>h"
  gt handoff -s "Refinery context-yield handoff" -m "Yield after <age>h. Queue: <state>."
  ```

## Effort-Based Patrol Routing

After await-event returns, check the EFFORT directive in the output:

**If `EFFORT: full`** — Run all steps thoroughly (normal patrol).

**If `EFFORT: reduced`** — Run ABBREVIATED patrol:
- inbox-check: Quick drain + check for MERGE_READY only
- queue-scan: Quick `gt mq list`. If empty, skip to check-integration-branches
- process-branch through merge-push: SKIP if queue empty
- loop-check through generate-summary: SKIP if no merges processed
- check-integration-branches: Quick check only
- context-check: One-sentence self-assessment
- patrol-cleanup: SKIP

Abbreviated patrol should complete in ~10% of the tokens of a full patrol.
Mark skipped steps as SKIP in the patrol report.

After await-event returns (either by event, timeout, or context-yield):
1. **Re-assess session health** (check RSS, context, age again — conditions change)
2. If reason is `context-yield` and context is acceptable: re-enter await-event (skip steps 3-4)
3. Close current patrol and start next cycle:
```bash
gt patrol report --summary "<brief summary: branches merged, test results, queue state>"
```
This closes the current patrol wisp and automatically creates a new one.
4. Continue executing from the first step of the new patrol cycle

**If you decide to hand off:**

Report and exit using `gt handoff` for clean session transition:

```bash
gt handoff -s "Patrol complete" -m "Merged X branches, Y tests passed.
Queue: empty/N remaining
RSS: X MB, Session age: Xh
Next: [any notes for successor]"
```

`gt handoff` sends handoff mail to yourself, respawns with a fresh Claude instance,
SessionStart hook runs gt prime, and your successor picks up from the hook.

**DO NOT just exit.** Always use `gt handoff` for proper lifecycle.

**IMPORTANT**: Never sleep-poll manually (e.g., `sleep 30 && bd list`).
Always use `gt mol step await-event` — it's event-driven and tracks backoff state."""
