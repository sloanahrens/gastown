# Generated by gt for the container supervisor; every deploy rewrites this file.
services:
  daemon:
    image: "gt-daemon:4f2a1c9"
    container_name: "gt-scratch-daemon-1"
    restart: unless-stopped
    init: true
    stop_grace_period: "30s"
    working_dir: "/towns/scratch"
    # After a failed scratch install the entrypoint refuses every start until
    # the operator removes .gt-install-incomplete and what the install left,
    # from the host side of the scratch directory.
    command: ["--scratch-town"]
    depends_on:
      scratch-dind:
        condition: service_healthy
      scratch-dolt:
        condition: service_healthy
    environment:
      DOCKER_HOST: "tcp://scratch-dind:2375"
      GT_DAEMON_CONTAINER_NAME: "gt-scratch-daemon-1"
      GT_DAEMON_SUPERVISOR: "container"
      GT_DAEMON_TAKEOVER: "${GT_DAEMON_TAKEOVER:-}"
      GT_TOWN_ROOT: "/towns/scratch"
    volumes:
      - type: bind
        source: "/towns/scratch"
        target: "/towns/scratch"
    networks:
      - scratch-egress
      - scratch-internal
  scratch-dind:
    image: "data.forgejo.org/oci/docker@sha256:7dcdfc4a20246236f558175182ccace1eb15a41bd3eb119dd2284f393498b7c1"
    restart: unless-stopped
    privileged: true
    command: ["--tls=false"]
    environment:
      DOCKER_TLS_CERTDIR: ""
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    volumes:
      - type: volume
        source: scratch_dind_data
        target: /var/lib/docker
    networks:
      - scratch-internal
  scratch-dolt:
    image: "dolthub/dolt-sql-server:2.3.2@sha256:38d5e900583267f35e36ad738e13f202e62860b351aa4c088dceaf7dbaed7ab6"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3306"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    volumes:
      - type: volume
        source: scratch_dolt_data
        target: /var/lib/dolt
    networks:
      - scratch-internal
  scratch-forgejo-db:
    image: "postgres:17.11"
    restart: unless-stopped
    environment:
      POSTGRES_USER: forgejo
      POSTGRES_DB: forgejo
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgejo -d forgejo"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - type: volume
        source: scratch_forgejo_pgdata
        target: /var/lib/postgresql/data
    networks:
      - scratch-forge
  scratch-forgejo:
    image: "data.forgejo.org/forgejo/forgejo:16.0.5"
    restart: unless-stopped
    depends_on:
      scratch-forgejo-db:
        condition: service_healthy
    environment:
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: scratch-forgejo-db:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__server__DOMAIN: scratch-forgejo
      FORGEJO__server__ROOT_URL: http://scratch-forgejo:3000/
      FORGEJO__server__SSH_DOMAIN: scratch-forgejo
      FORGEJO__server__SSH_PORT: "2322"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__actions__ENABLED: "true"
      FORGEJO__repository__DEFAULT_REPO_UNITS: "repo.code,repo.actions,repo.pulls,repo.issues"
    volumes:
      - type: volume
        source: scratch_forgejo_data
        target: /data
    ports:
      - "127.0.0.1:3100:3000"
      - "127.0.0.1:2322:22"
    networks:
      - scratch-forge
      - scratch-forge-ci
      - scratch-egress
  scratch-forge-dind:
    image: "data.forgejo.org/oci/docker@sha256:7dcdfc4a20246236f558175182ccace1eb15a41bd3eb119dd2284f393498b7c1"
    restart: unless-stopped
    privileged: true
    command: ["--insecure-registry=scratch-forgejo:3000"]
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - type: volume
        source: scratch_forge_certs
        target: /certs
      - type: volume
        source: scratch_forge_dind_data
        target: /var/lib/docker
    networks:
      scratch-forge-ci:
        aliases:
          - docker
  scratch-forge-runner:
    image: "data.forgejo.org/forgejo/runner:13.2.0"
    restart: "no"
    depends_on:
      scratch-forgejo:
        condition: service_started
      scratch-forge-dind:
        condition: service_started
    working_dir: /data
    command: ["forgejo-runner", "--config", "config.yml", "daemon"]
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
    volumes:
      - type: volume
        source: scratch_forge_runner_data
        target: /data
      - type: volume
        source: scratch_forge_certs
        target: /certs
    networks:
      - scratch-forge-ci
networks:
  scratch-egress:
  scratch-internal:
    internal: true
  scratch-forge:
    internal: true
  scratch-forge-ci:
volumes:
  scratch_dind_data:
  scratch_dolt_data:
  scratch_forgejo_pgdata:
  scratch_forgejo_data:
  scratch_forge_certs:
  scratch_forge_dind_data:
  scratch_forge_runner_data:
