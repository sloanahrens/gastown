# Generated by gt for the container supervisor; every deploy rewrites this file.
services:
  daemon:
    image: "gt-daemon:4f2a1c9"
    container_name: "gt-town-daemon-1"
    restart: unless-stopped
    stop_grace_period: "30s"
    working_dir: "/towns/live"
    environment:
      DOCKER_HOST: "tcp://sweep-dind:2375"
      GT_DAEMON_CONTAINER_NAME: "gt-town-daemon-1"
      GT_DAEMON_SUPERVISOR: "container"
      GT_DAEMON_TAKEOVER: "${GT_DAEMON_TAKEOVER:-}"
      GT_TOWN_ROOT: "/towns/live"
    volumes:
      - type: bind
        source: "/towns/live"
        target: "/towns/live"
