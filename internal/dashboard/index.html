  const said = [r.owner, r.severity, r.level, r.rule, r.needs_human, r.priority, r.effort, r.state, r.title,
    r.question, r.recommended, r.held_count, (r.held || []).join(","), r.malformed, r.escalated_by].join("\u0000");
  let h = 2166136261;
  for (let i = 0; i < said.length; i++) h = Math.imul(h ^ said.charCodeAt(i), 16777619);
  return (h >>> 0).toString(36);
}
function attnFoldKey(r) { return attnItemKey(r) + ":" + attnStamp(r); }

function saveAttnFolds() {
  const next = readAttnFolds();
  for (const k of Object.keys(attnFolds)) if (!attnWritten[k]) next[k] = true;
  for (const k of Object.keys(attnWritten)) if (!attnFolds[k]) delete next[k];
  try { localStorage.setItem(ATTN_FOLD_KEY, JSON.stringify(next)); } catch (e) {}
  attnFolds = next;
  attnWritten = Object.assign({}, next);
}

// keepAttnFolds drops the folds whose item has left the list, so a key waits
// for nothing that is gone. A list short by a read that failed, has not
// reported, or came back empty is not a list an item left: its folds are kept.
function keepAttnFolds(rows, failed, pending) {
  if (failed.length || pending.length || !rows.length) return;
  const live = new Set(rows.map(attnFoldKey));
  const gone = Object.keys(attnFolds).filter(k => !live.has(k));
  if (!gone.length) return;
  for (const k of gone) delete attnFolds[k];
  saveAttnFolds();
}

// foldAttnRow folds the row where it stands rather than redrawing the panel, so
// the button the reader pressed keeps the keyboard and the next Enter folds the
// next row (gt-1kaed).
function foldAttnRow(head, caret, body, r) {
  const k = attnFoldKey(r);
  const folded = !attnFolds[k];
  if (folded) attnFolds[k] = true; else delete attnFolds[k];
  saveAttnFolds();
  head.setAttribute("aria-expanded", folded ? "false" : "true");
  caret.textContent = folded ? "▸" : "▾";
  body.replaceChildren(...(folded ? [] : attentionBody(r)));
}

// The Attention panel: the one list of what is waiting on a decision or an
// action — the open escalations, the overseer's open questions and the
// attention queue's standing items — every row tagged with the owner who has to
// move, so the human and the overseer read the same list and neither needs a
// panel of their own (gt-bi6w0).
//
// Every cell goes through el(), which writes textContent: a question, a
// recommended answer and a queue summary are other agents' own words, and a tag
// in them shows as that text and never as markup. The panel writes nothing —
// a question is answered with gt answer, a comment on the bead, from a
// terminal.
function renderAttention(s) {
  attentionState = s;
  const note = $("attentionnote");
  const at = s.attention;
  const rows = at ? (at.rows || []) : [];
  const shown = rows.filter(ownerShown);

  // The note counts the two groups the panel is showing — the rows that need a
  // person and the rows waiting on work already in flight — and, past four
  // hours, how long the oldest question among them has waited: the question is
  // the row type that stops the town until it is answered. The rows the readers
  // capped out are counted beside the shown ones only while the filter is
  // showing the whole list, which is who the cap belongs to (gt-bi6w0,
  // gt-tv5v2).
  const asks = shown.filter(r => r.kind === "question").map(r => r.age_sec).filter(a => a != null);
  const oldest = asks.length ? Math.max(...asks) : null;
  const stale = oldest != null && oldest > QUESTION_OLDEST_SEC;
  const capped = shown.length === rows.length ? (at && at.more) || 0 : 0;
  const needs = shown.filter(needsYou).length, pipeline = shown.length - needs;
  note.className = stale ? "r warnc" : "r";
  note.textContent = shown.length
    ? needs + " need you · " + pipeline + " in the pipeline" + (capped ? " · " + shown.length + " of " + (shown.length + capped) : "") + (stale ? " · oldest question " + fmtDur(oldest) : "")
    : "";
  renderOwnerChips(rows);
  drawAttention();
}

// drawAttention draws the panel's body: the reads behind the list that have
// something to say, then the rows the owner chips are showing. Switching a chip
// redraws it, so the list holds the rows the reader asked for rather than
// holding every row and hiding some (gt-bi6w0).
function drawAttention() {
  const box = $("attention");
  box.replaceChildren();
  const at = attentionState ? attentionState.attention : null;
  if (!at) { box.append(el("div", "empty", "reading…")); return; }
  const failed = at.failed || [], pending = at.pending || [];
  // The folds are swept against the whole list rather than the rows a chip is
  // showing: an owner switched off is not an item that went away.
  keepAttnFolds(at.rows || [], failed, pending);
  // A read that failed is a named state, never an empty panel: "nothing is
  // waiting" and "the list could not be read" must not look alike. The rows the
  // readers did return are still drawn beside the line.
  if (failed.length) box.append(el("div", "badc", "unavailable: the " + failed.join(" and the ") + " could not be read"));
  // A reader that has not reported yet is not a reader that found nothing, so
  // its absence is named before the empty line can stand for it.
  if (pending.length) box.append(el("div", "empty", "the " + pending.join(" and the ") + " have not been read yet"));
  // The rows are read; only Jev's answers behind them are not. The panel says
  // so beside the rows rather than rendering them as a queue nothing scored.
  if (at.scores_failed) box.append(el("div", "empty", "Jev's needs_human answers could not be read: every queue item reads needs ?"));
  // The risk-path rows are ranked by the landing answers, which are the same kind
  // of read: a failed one keeps the order of the last good answers, and the panel
  // says so rather than presenting that order as this read's (gt-n8tmf).
  if (at.landing_risk_failed) box.append(el("div", "empty", "Jev's landing risk answers could not be read: the risk-path rows keep the order of the last good answers"));
  const shown = (at.rows || []).filter(ownerShown);
  if (!shown.length) {
    // A filter with no chip on is the reader's own doing; otherwise the panel is
    // showing every row it holds and there is nothing waiting on them.
    if (!failed.length && !pending.length) box.append(el("div", "empty", shownOwners.size ? "nothing needs you" : "every owner chip is off"));
    return;
  }
  // The two groups are the panel's own order, each under its heading: what
  // needs a person first, then what is only waiting on work already in flight
  // (attention.Classify, gt-tv5v2). An empty group draws no heading.
  for (const g of [{name: "Needs you", rows: shown.filter(needsYou)},
                   {name: "In the pipeline", rows: shown.filter(r => !needsYou(r))}]) {
    if (!g.rows.length) continue;
    box.append(el("div", "agroup", g.name));
    for (const r of g.rows) box.append(attentionRow(r));
  }
}

// needsYou reports whether a row needs a person to move: everything but the
// rows the reader classified as pipeline. A row with no class is one this page
// does not know, and an unknown condition is seen rather than filed away
// (attention.Classify).
function needsYou(r) { return r.class !== "pipeline"; }

// ownerShown reports whether the owner chips are showing a row. A row whose
// owner the page has no chip for is shown rather than hidden: a rule a newer
// daemon writes reaches the reader who can act on it, and the panel sorts it
// last (attention.ownerRank).
function ownerShown(r) { return OWNERS.indexOf(r.owner) < 0 || shownOwners.has(r.owner); }

// The owner chips are the panel's one filter: one chip per owner the reader can
// tag a row with, carrying the count of the rows it holds. The choice survives
// reloads the way the feed's class chips do, and a chip is drawn at zero rather
// than dropped, so an owner never disappears from the page.
// Storage that throws — a locked-down browser, private mode — leaves the chips
// on their default rather than taking the page down.
let shownOwners = new Set([PANEL_OPENS_ON]);
try { shownOwners = new Set(JSON.parse(localStorage.getItem("gt-attention-owners") || "null") || [PANEL_OPENS_ON]); } catch (e) {}
let attentionState = null;
function renderOwnerChips(rows) {
  const counts = {};
  for (const r of rows) counts[r.owner] = (counts[r.owner] || 0) + 1;
  const box = $("attentionchips");
  box.replaceChildren();
  for (const o of OWNERS) {
    const b = el("button", "chip" + (shownOwners.has(o) ? " on" : ""), o);
    b.title = "show or hide the rows " + o + " has to act on";
    b.append(el("b", "", String(counts[o] || 0)));
    b.onclick = () => {
      shownOwners.has(o) ? shownOwners.delete(o) : shownOwners.add(o);
      try { localStorage.setItem("gt-attention-owners", JSON.stringify([...shownOwners])); } catch (e) {}
      renderAttention(attentionState);
    };
    box.append(b);
  }
}

// attentionRow is one row of the list: the header line a reader scans — the
// owner, the id and title, what the row ranks, its age and a caret — and, under
// it, the words attentionBody holds.
//
// The header is the fold's button, and only where there is something to fold: a
// caret on a row that hides nothing promises a fold that never comes. The words
// sit outside the button so the answer line can be dragged and copied whole,
// and every cell goes through el(), which writes textContent and never markup
// (gt-1kaed, gt-bi6w0).
function attentionRow(r) {
  const words = attentionBody(r);
  const foldable = words.length > 0;
  const folded = foldable && !!attnFolds[attnFoldKey(r)];
  const row = el("div", "arow");
  row.dataset.owner = r.owner;
  const head = el(foldable ? "button" : "div", "arow-head");
  const caret = foldable ? el("span", "caret", folded ? "▸" : "▾") : null;
  if (caret) head.append(caret);
  head.append(el("span", "tag own-" + r.owner, r.owner || "?"));
  if (r.kind === "escalation") {
    head.append(el("span", "esc " + (SEV_CLASS[r.severity] || "sev-low"), r.severity || "–"));
    head.append(el("span", "bead", r.id || ""));
    if (r.escalated_by) head.append(el("span", "by", "raised by " + r.escalated_by));
  } else if (r.kind === "item") {
    // The rule is what the row is about and the level is how loud the queue
    // raised it, so both are drawn: an item nothing ranks is the reader's to
    // name, not the page's to guess at.
    head.append(el("span", "alvl " + (r.level || "info"), r.level || "info"));
    head.append(el("span", "tag rule", r.rule || ""));
    // A pipeline row says who holds the condition and what it is waiting on,
    // both on its header line: a reader can tell work in flight from work that
    // needs them without opening the row (gt-tv5v2). "held by" rather than
    // "owner", which the row's own owner tag already says and says differently.
    if (r.held_by) head.append(el("span", "heldby", "held by " + r.held_by));
    if (r.waiting_on) head.append(el("span", "waiting", "waiting on " + r.waiting_on));
    // Jev's needs_human probability is drawn beside the row the server ordered
    // by it inside its alert level, so a low score sinks it without hiding it. A
    // dash is an item no answer names yet, which still stands in the list; a
    // question mark says the answers log could not be read, which is not the
    // same claim (gt-b9j3o.2).
    head.append(el("span", "nh", r.needs_human == null
      ? (attentionState && attentionState.attention && attentionState.attention.scores_failed ? "needs ?" : "needs –")
      : "needs " + r.needs_human.toFixed(2)));
    // The landing battery's risk level is drawn beside a risk-path row, so a
    // reader sees why the row sits where it does. Only a risk-path row carries
    // one: a row no landing answer names draws none, not a dash.
    if (r.landing_risk != null) {
      const lr = el("span", "lrisk", "risk " + r.landing_risk);
      lr.title = "landing battery risk level";
      head.append(lr);
    }
  } else {
    head.append(el("span", "bead", r.id || ""));
  }
  head.append(el("span", "title", r.title || ""));
  if (r.kind === "question") {
    // The priority is why the row is where it is, so it is drawn, and P0 and P1
    // in the amber the page marks what wants attention with. The state is the
    // reader's own word.
    head.append(el("span", r.priority <= 1 ? "qpri warnc" : "qpri", "P" + r.priority));
    if (r.effort) head.append(el("span", "qeffort", r.effort));
    head.append(el("span", "qstate", r.state === "answered" ? "answered, overseer acting" : "awaiting you"));
  }
  if (r.age_sec != null) head.append(el("span", "qage", fmtDur(r.age_sec)));
  row.append(head);
  if (!foldable) return row;
  // A folded row is drawn without its words rather than over them, so the page's
  // find and its select-all do not read what the reader folded away. The box
  // below is what the fold empties and fills, which is why no other row is
  // redrawn with it (gt-1kaed).
  const body = el("div", "arow-body");
  if (!folded) body.append(...words);
  head.setAttribute("aria-expanded", folded ? "false" : "true");
  head.onclick = () => foldAttnRow(head, caret, body, r);
  row.append(body);
  return row;
}

// attentionBody is the words a row says under its header line, drawn by the row
// and by the fold from the one function: a folded row cannot open onto cells a
// redraw would not have drawn (gt-1kaed). The recommended answer is a paragraph
// and the row is a line the human scans, so a row carries its opening line.
function attentionBody(r) {
  const body = [];
  if (r.question) body.push(el("span", "qtext", r.question));
  if (r.recommended) body.push(el("span", "qrec", "Recommended: " + firstLine(r.recommended)));
  const held = [];
  if (r.held_count) held.push("holds " + r.held_count + (r.held_count === 1 ? " bead" : " beads"));
  if ((r.held || []).length) held.push("Held: " + r.held.join(", "));
  if (held.length) body.push(el("span", "qheld", held.join(" · ")));
  if (r.malformed) body.push(el("span", "badc", "the bead's description has no question and recommended answer"));
  if (r.kind === "question" && r.id) body.push(el("span", "qcmd", 'gt answer ' + r.id + ' "<answer>"'));
  return body;
}

// The heartbeat block of the Overseer panel: whether the overseer session is
// alive, what it has done lately and what it does most, and the tail of its
// journal. The status is the reader's own word, judged against the silence
// window the daemon's silent-overseer rule uses, so the panel and the push
// agree on when the overseer went quiet. Read-only: the overseer writes its
// heartbeat and journal with gt overseer beat and log.
//
// Every cell goes through el(), which writes textContent: a journal line is the
// overseer's own text and shows as that text, never as markup.
function drawHeartbeat(panel, s) {
  const { box } = oblock(panel, "Heartbeat");
  const o = s.overseer;
  if (!o) { box.append(el("div", "empty", "reading…")); return; }
  // A read that failed is a named state: "the overseer is silent" and "its
  // files could not be read" must not look alike.
  if (o.unavailable) { box.append(el("div", "badc", "unavailable: the overseer's heartbeat or journal could not be read")); return; }
  const head = el("div", "kv");
  const cell = el("div");
  const alive = o.status === "alive";
  cell.append(el("b", alive ? "good" : "warnc", o.status === "none" ? "no heartbeat" : o.status));
  cell.append(el("span", "", o.last_active_sec != null ? "last active " + fmtDur(o.last_active_sec) + " ago" : "has never beaten"));
  head.append(cell);
  if (o.state) { const c = el("div"); c.append(el("b", "", o.state), el("span", "", "state")); head.append(c); }
  if (o.open_questions != null) { const c = el("div"); c.append(el("b", "", String(o.open_questions)), el("span", "", "open questions")); head.append(c); }
  box.append(head);
  const counts = o.interventions || [];
  if (counts.length) {
    box.append(el("div", "empty", "last 7 days: " + counts.map(c => c.kind + " " + c.count).join(" · ")));
  }
  const lines = o.journal || [];
  if (!lines.length) { box.append(el("div", "empty", "no journal lines")); return; }
  for (const l of lines) {
    const row = el("div", "ojline");
    row.append(el("span", "ojage", fmtDur(l.age_sec)), el("span", "okind", l.kind));
    if (l.bead) row.append(el("span", "bead", l.bead));
    row.append(el("span", "", l.text));
    box.append(row);
  }
}

// The Deep review block of the Overseer panel: one row per schedule the town
// configures — every entry of daemon.patrols.scheduled_slings — with when that
// schedule is next due and the newest run it filed: the run's bead, whether it
// is still open, what its notes counted as findings and as beads filed, and
// the digest it wrote. Read-only: a run is triggered, paused and edited from a
// terminal.
//
// The rows are the config's, not a set of names this page knows: a schedule
// configured beside the review's slice and risk paths is a row the moment it
// exists (gt-uv08f). A schedule whose interval is unusable, and one the
// dispatcher holds, still carry their row: the reader's words for those states
// are what the row's next cell shows. A held town starts no run whatever a
// schedule's interval says, so "paused" heads the block and is named in it.
//
// Every cell goes through el(), which writes textContent: a schedule's name,
// the run's bead id and the hold's reason are text and never markup. The digest
// cell is a reference — the bead and its comment count — and never the digest's
// text.
function drawDeepReview(panel, s) {
  const { box, note } = oblock(panel, "Deep review");
  const d = s.deepreview;
  if (!d) { box.append(el("div", "empty", "reading…")); return; }
  // A read that failed is a named state, never an empty block: "no deep review
  // has run" and "the runs could not be read" must not look alike.
  if (d.unavailable) { box.append(el("div", "badc", "unavailable: deep reviews could not be read")); return; }
  if (d.paused) {
    note.className = "r warnc";
    note.textContent = "paused";
    note.title = d.paused;
    box.append(el("div", "warnc", "paused: " + d.paused));
  }
  const scheds = d.schedules || [];
  if (!scheds.length) { box.append(el("div", "empty", "no deep review schedule configured")); return; }
  const t = el("table");
  const hr = el("tr");
  [["Schedule", "an entry of daemon.patrols.scheduled_slings"], ["Next", "when the schedule is next due"], ["Last run", "the newest run the schedule filed"], ["Findings", "finding: lines in that run's notes", 1], ["Filed", "those findings that named a bead", 1], ["Digest", "that run's digest bead and its comment count"]]
    .forEach(([h, tip, num]) => { const th = el("th", num ? "n" : "", h); if (tip) th.title = tip; hr.append(th); });
  t.append(hr);
  for (const sc of scheds) {
    const tr = el("tr");
    const name = el("td", "title", sc.name || "–");
    if (sc.rig) name.title = sc.rig;
    tr.append(name);
    tr.append(el("td", sc.next === "due now" || sc.next === "running" ? "warnc" : "", sc.next));
    const last = sc.last || null;
    // The run cell carries the run's bead and the two marks the reader makes
    // about it: a run that has not closed is in flight — its counts are the
    // counts so far — and one whose notes were cut or malformed says so.
    const run = el("td", "title");
    run.append(el("span", "", last ? last.id : "–"));
    if (last && last.status !== "closed") {
      const b = el("span", "badge warnc", last.status);
      b.title = "the run has not closed: its counts are the ones so far";
      run.append(document.createTextNode(" "), b);
    }
    if (last && last.unparsed) {
      const b = el("span", "badge warnc", "unparsed");
      b.title = "a finding: or queued: line in the run's notes is missing its fields";
      run.append(document.createTextNode(" "), b);
    }
    tr.append(run);
    if (!last) {
      tr.append(el("td", "n", "–"), el("td", "n", "–"), el("td", "title", "–"));
    } else {
      tr.append(el("td", "n", String(last.findings)), el("td", "n", String(last.filed)));
      tr.append(el("td", "title", last.digest || "–"));
    }
    t.append(tr);
  }
  box.append(t);
}

// The block of the Overseer panel that lists what the overseer owes a move on:
// the rows of the attention list whose owner is the overseer — a landing that
// wants a post-landing look because it touched a risk path, an idle dispatcher,
// a stalled polecat, an answered question — drawn with the same row the
// Attention panel draws them with, so the two panels cannot drift into two
// readings of one list (gt-bi6w0).
//
// The panel exists because the Attention panel opens on the human's rows: the
// overseer reads its own rows here without switching that panel's chips, which
// is how one list serves both readers (gt-uv08f).
function drawOverseerQueue(panel, s) {
  const { box, note } = oblock(panel, "For the overseer");
  const at = s.attention;
  if (!at) { box.append(el("div", "empty", "reading…")); return; }
  const rows = (at.rows || []).filter(r => r.owner === "overseer");
  note.textContent = rows.length ? rows.length + " waiting" : "";
  if (!rows.length) { box.append(el("div", "empty", "nothing is waiting on the overseer")); return; }
  for (const r of rows) box.append(attentionRow(r));
}

// The Usage part of the Cost panel: what the town spent over the last day, from
// the records the usage scan writes. Each block is a fold of its own, closed by
// default, with a one-line summary on its heading; the Cost panel's header
// carries the day's DeepSeek estimate and how many beads ran over twenty
// minutes. Read-only.
//
// Money and tokens are in separate columns: Spend ($) holds dollars and is
// "est." for DeepSeek rows only, since the scan estimates no cost for Claude
// rows; Tokens holds the uncached token count of every row. A read that failed
// and a scan that never ran are named states, never an empty list. Every cell
// goes through el(), which writes textContent: a bead id or model name is text
// and never markup.
const USAGE_STALE_SEC = 3 * 3600;
const isDeepSeek = model => /^deepseek/i.test(model || "");
const fmtTokens = n => {
  n = Number(n) || 0;
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
  return String(n);
};
// costTable is a table of heads ([text, numeric?]) over rows of [text, class,
// title?] cells, shared by the Usage and rework parts of the Cost panel. A
// title is the cell's hover, for a figure whose numbers are behind it.
function costTable(heads, rows) {
  const t = el("table");
  const hr = el("tr");
  heads.forEach(([h, num]) => hr.append(el("th", num ? "n" : "", h)));
  t.append(hr);
  for (const cells of rows) {
    const tr = el("tr");
    cells.forEach(([text, cls, title]) => {
      const td = el("td", cls || "", text);
      if (title) td.title = title;
      tr.append(td);
    });
    t.append(tr);
  }
  return t;
}
// costUsage draws the part into box from the usage payload u and the whole
// state s, and returns what the panel's caption says of it: text, the tooltip
// that explains the text, and whether it is a warning (warn) or a failure (bad).
function costUsage(box, u, s) {
  if (!u) { box.append(el("div", "empty", "reading…")); return {}; }
  if (u.unavailable) {
    box.append(el("div", "badc", "usage records unreadable"));
    return {text: "usage unreadable", bad: true};
  }
  const byClass = u.by_class_model || [], deep = u.deep_review_runs || [], top = u.top_beads || [], over = u.over20 || [];
  const est = byClass.filter(r => isDeepSeek(r.model)).reduce((sum, r) => sum + (r.est_cost_usd || 0), 0);
  const caption = {
    text: "DeepSeek est. " + money(est) + " · " + over.length + (over.length === 1 ? " bead" : " beads") + " over 20m",
    title: "DeepSeek spend estimated from the usage records over the last " + (u.window || "24h") + "; beads that ran over twenty minutes in the last 48 hours",
    warn: over.length > 0,
  };

  const win = u.window || "24h";
  const table = costTable;
  const none = text => el("div", "empty", text);
  const plural = (n, one, many) => n + " " + (n === 1 ? one : many);

  const calls = byClass.reduce((n, r) => n + (r.calls || 0), 0);
  const tokens = byClass.reduce((n, r) => n + (r.uncached || 0), 0);
  const byClassFold = costFold(box, "cost.byclass", "By class and model",
    byClass.length ? calls + " calls · " + fmtTokens(tokens) + " tokens" : "no usage in the last " + win);
  byClassFold.body.append(byClass.length
    ? table([["Class"], ["Model"], ["Calls", 1], ["Spend ($)", 1], ["Tokens", 1]], byClass.map(r => [
        [r.class], [r.model, "title"], [String(r.calls), "n"],
        [r.est_cost_usd ? "est. " + money(r.est_cost_usd) : "–", "n"],
        [fmtTokens(r.uncached), "n"]]))
    : none("no usage in the last " + win));

  // What a run's tokens bought: its findings, joined by bead id from the runs
  // the Deep review block's reader carries. A run that reader does not list has
  // no count ("-"), and a run with none has no per-finding figure to divide
  // into.
  const found = new Map(((s.deepreview && s.deepreview.runs) || []).map(r => [r.id, r.findings]));
  const latest = deep.reduce((a, r) => (!a || new Date(r.end) > new Date(a.end) ? r : a), null);
  const deepLine = latest ? plural(deep.length, "run", "runs") + " · last " + age(latest.end) + " ago" : "no deep review runs";
  // The state chip: paused while the town holds dispatch or its scheduled_slings
  // patrol is switched off, scheduled while a schedule is on and has filed runs,
  // and unknown when the deep review state is missing or could not be read. A
  // state that did not arrive must not read as a healthy schedule, so only a
  // state that names a schedule can say "scheduled".
  const dr = (s && s.deepreview) || null;
  const scheds = (dr && dr.schedules) || [];
  const unread = !dr || !!dr.unavailable;
  const off = !unread && (!!dr.paused || scheds.some(sc => sc && sc.next === "patrol disabled"));
  const deepFold = costFold(box, "cost.deepreview", "Deep reviews", deepLine);
  const chip = unread ? el("span", "badge warnc", "unknown")
    : off ? el("span", "badge warnc", "paused")
    : scheds.length && deep.length ? el("span", "badge good", "scheduled") : null;
  if (chip) chip.title = unread ? "the deep review state is missing or could not be read, so the schedule is unknown"
    : off ? (dr.paused || "the town's scheduled_slings patrol is switched off")
    : "the schedule is on and has filed runs";
  const bits = [];
  if (chip) bits.push(document.createTextNode(" "), chip);
  if (latest) bits.push(document.createTextNode(" "), el("span", "title", "last run " + new Date(latest.end).toLocaleDateString([], {month: "short", day: "numeric"})));
  deepFold.bits.replaceChildren(...bits);
  deepFold.body.append(deep.length
    ? table([["Run"], ["Ended"], ["Took", 1], ["Tokens", 1], ["In subagents", 1], ["Findings", 1], ["Tokens per finding", 1]], deep.map(r => {
        const f = found.get(r.bead);
        return [
          [r.bead], [age(r.end) + " ago", "title"], [fmtDur(r.wall_s), "n"], [fmtTokens(r.uncached), "n"], [Math.round((r.subagent_share || 0) * 100) + "%", "n"],
          [f == null ? "-" : String(f), "n"], [f ? fmtTokens(Math.round(r.uncached / f)) : "-", "n"]];
      }))
    : none("no deep review runs"));

  const topFold = costFold(box, "cost.topbeads", "Top beads",
    top.length ? "top " + top[0].bead + " " + fmtTokens(top[0].uncached) + " tokens" : "no beads in the last " + win);
  topFold.body.append(top.length
    ? table([["Bead"], ["Class"], ["Took", 1], ["Spend ($)", 1], ["Tokens", 1]], top.map(r => [
        [r.bead], [r.class, "title"], [fmtDur(r.wall_s), "n"],
        [r.est_cost_usd ? "est. " + money(r.est_cost_usd) : "–", "n"],
        [fmtTokens(r.uncached), "n"]]))
    : none("no beads in the last " + win));

  const overFold = costFold(box, "cost.over20", "Over 20 minutes (48h)",
    over.length ? plural(over.length, "bead", "beads") + " in the last 48h" : "none in the last 48h");
  overFold.body.append(over.length
    ? table([["Bead"], ["Rig"], ["Took", 1], ["Tests", 1]], over.map(r => [
        [r.bead, "warnc"], [r.rig, "title"], [fmtDur(r.wall_s), "n warnc"],
        [r.test_runs + " runs, " + r.failed_test_runs + " failed", "n" + (r.failed_test_runs ? " badc" : "")]]))
    : none("none in the last 48h"));

  // How old the records are: the scan runs on a schedule, so an old AsOf means
  // the numbers in the folds are a past day's, and the fold says so.
  const counts = (u.unmatched || 0) + " unmatched · " + (u.incomplete || 0) + " incomplete · " + (u.skipped || 0) + " skipped";
  const quality = costFold(box, "cost.quality", "Data quality", counts);
  const scanned = u.as_of ? new Date(u.as_of).getTime() : NaN;
  if (isNaN(scanned)) quality.body.append(el("div", "empty warnc", "never scanned"));
  else {
    const old = (Date.now() - scanned) / 1000 > USAGE_STALE_SEC;
    quality.body.append(el("div", "empty" + (old ? " warnc" : ""), "records last scanned " + age(u.as_of) + " ago" + (old ? " (stale)" : "")));
  }
  quality.body.append(el("div", "empty", counts));
  return caption;
}

// costFolds keeps each fold of the Cost panel's usage part by its key, built once
// like the chart folds: a redraw refills the fold's body and its heading's chip
// and date, so a reading that arrives every few seconds does not stack a second
// fold on the same key.
const costFolds = {};
// costFold draws a closed fold under key into box, titled title, with line as
// the one line its heading shows while closed, and returns it. Its heading holds
// the title, then the bits span a redraw sets (a state chip, a date), then the
// closed line foldable adds.
function costFold(box, key, title, line) {
  let f = costFolds[key];
  if (!f) {
    const sec = el("section");
    sec.dataset.fold = key;
    const head = el("h2", "", title);
    f = costFolds[key] = {sec: sec, head: head, bits: el("span", ""), body: el("div", "body"), line: line};
    head.append(f.bits);
    sec.append(head, f.body);
    f.fold = foldable(sec, {key: key, summary: () => f.line});
  }
  f.line = line;
  f.fold.paint(state);
  f.body.replaceChildren();
  box.append(f.sec);
  return f;
}

// costJevFold draws the Jev fold: the calls, the window and the top caller from
// the Jev spend read. The provider row above carries the dollars. A town with no
// Jev reader has neither a row nor a read, so it has no fold; a configured Jev
// whose read failed says so in the fold.
function costJevFold(box, s) {
  const jev = s && s.jev_spend;
  const rows = Array.isArray(s && s.cost_providers) ? s.cost_providers : [];
  if (!jev && !rows.some(p => p && p.id === "jev")) return;
  if (!jev) {
    const missing = "the Jev spend could not be read";
    costFold(box, "cost.jev", "Jev spend", missing).body.append(el("div", "badc", missing));
    return;
  }
  const calls = jev.calls + (jev.calls === 1 ? " call" : " calls") + (jev.window ? " in " + jev.window : "");
  const top = jev.top_caller ? " · top caller " + jev.top_caller + " (" + jev.top_caller_calls + (jev.top_caller_calls === 1 ? " call" : " calls") + ")" : "";
  costFold(box, "cost.jev", "Jev spend", calls + top).body.append(el("div", "empty", calls + top));
}

// The om rework part of the Cost panel: what each review bar costs in rework,
// from the landing worker's review log, for the last seven days and the seven
// before them, in one table with a row per window and bar. A bead counts under
// the bar in force at its first review in the window. A bar of 0 is a tree that
// named none and reads "?". A read that failed is a named state, never an empty
// week, and a window with no bars says so under the table. The om time column is
// the mean of the landed beads' own totals, each the sum of every review that
// bead had before it landed; a bar no bead has a time for draws a dash.
function costRework(box, r) {
  if (!r) { box.append(el("div", "empty", "om rework · reading…")); return; }
  if (r.unavailable) { box.append(el("div", "badc", "om rework · review log unreadable")); return; }
  const heads = [["Window"], ["Bar", 1], ["Reviews", 1], ["First try", 1], ["Rework", 1], ["Reviews per landed", 1], ["Mean om time", 1], ["Loops out", 1], ["Mean score", 1]];
  if (r.om_unavailable) box.append(el("div", "badc", "om rework · om times unavailable: the daemon log could not be read"));
  const rows = [], empty = [];
  for (const w of r.windows || []) {
    const bars = w.bars || [];
    if (!bars.length) { empty.push(w.name); continue; }
    for (const b of bars) rows.push([
      [w.name],
      [b.bar ? b.bar.toFixed(2) : "?", "n"],
      [String(b.reviews), "n"],
      [b.first_try + "/" + b.beads, "n"],
      [Math.round(100 * b.rejected / b.reviews) + "%", "n"],
      [b.landed ? b.reviews_per_landed.toFixed(2) : "–", "n"],
      [b.om_beads ? fmtMS(b.mean_om_secs) : "–", "n", omTimeHover(b)],
      [String(b.loops_out), "n" + (b.loops_out ? " badc" : "")],
      [b.mean_score.toFixed(2), "n"]]);
  }
  if (rows.length) box.append(el("h3", "sub", "om rework"), costTable(heads, rows));
  for (const name of empty) box.append(el("div", "empty", name + ": no om reviews"));
}

// omTimeHover is what the Mean om time cell says behind the figure: how many
// landed beads it averages, the median bead total and the slowest one, and how
// many reviews the log gave no om time for — the reviews left out of the sums,
// which is why a bar can average over fewer beads than it landed. A part that
// is not known is left out rather than drawn as a zero.
function omTimeHover(b) {
  const parts = [];
  if (b.om_beads) {
    parts.push("mean of " + b.om_beads + " landed bead" + (b.om_beads === 1 ? "" : "s") + ", each the sum of its reviews");
    parts.push("median " + fmtMS(b.median_om_secs));
    parts.push("slowest " + (b.slowest_om_bead ? b.slowest_om_bead + " " : "") + fmtMS(b.slowest_om_secs));
  }
  if (b.om_reviews_missing) parts.push(b.om_reviews_missing + " review" + (b.om_reviews_missing === 1 ? "" : "s") + " with no om time");
  return parts.join(" · ");
}

// The GCP budget line of the Cost panel: the budget_alert findings the Cloud
// panel's reader already carries, one line each, coloured by the finding's
// severity. The patrol writes the figures into the finding's Detail sentence
// ("project P has spent 4.57 USD of its 5.00 USD budget ..., 91% of the
// budget ..."), so the line reads them back out of it; a sentence that does not
// match is shown whole rather than dropped. A healthy patrol with no finding
// draws no line: a project under its alert threshold has nothing to say here.
// An unhealthy source does draw one, because a line that exists to alarm must
// not go quiet when it cannot see: after a failed read, a missing report or an
// overdue patrol, no alert means "unknown", not "under budget". A machine with
// no patrol at all has no budget to watch and draws nothing.
const BUDGET_SPENT = /spent ([\d.,]+) ([A-Za-z]{3}) of its ([\d.,]+) [A-Za-z]{3} budget/;
const BUDGET_PCT = /(\d+(?:\.\d+)?)% of the budget/;
function costGCP(box, c) {
  if (!c) return;
  if (c.state === "error") { box.append(el("div", "badc", "GCP budget · cloud read failed" + (c.note ? " · " + c.note : ""))); return; }
  if (c.state === "missing") { if (!c.no_patrol) box.append(el("div", "empty", "GCP budget · no patrol report")); return; }
  const rows = (c.findings || []).filter(f => f.kind === "budget_alert");
  const late = c.state === "overdue" ? " · patrol overdue" : "";
  for (const f of rows) {
    const detail = f.detail || "", spent = BUDGET_SPENT.exec(detail), pct = BUDGET_PCT.exec(detail);
    const what = spent && pct ? spent[1] + " of " + spent[3] + " " + spent[2] + " · " + pct[1] + "%" : detail || "alert";
    const line = el("div", CLOUD_SEV[f.severity] || "sev-low", "GCP budget · " + (f.project ? f.project + " · " : "") + what + late);
    line.title = detail;
    box.append(line);
  }
  if (!rows.length && late) box.append(el("div", "warnc", "GCP budget · patrol overdue, no alert on its last report"));
}

// The JEV panel, under the Tier sweeps and folded until opened. The title line
// carries the totals, the scorecard window with the read's age, and a chip per
// verdict; each battery is a table row, its not-yet questions folded behind
// their count. A failed or stale read says
// unavailable on the title line and draws no rows, since the last window's
// verdicts would pass as current. A read that lost only some batteries draws the
// rest, names the lost ones, and shows a lost battery's last good row marked
// stale, or its name alone. Neither a report nor a status means no scorecard
// command is configured, or it has not answered yet, so the panel stays hidden.
// The chips take the tokens every other panel colours with, so both themes read
// them; the title's tooltip gives each verdict's meaning.
const JV_VERDICTS = ["earning", "no-signal", "not-yet"];
const JV_CLASS = {earning: "jv-earning", "no-signal": "jv-nosignal", "not-yet": "jv-notyet"};
const JV_MEANING = {
  earning: "enough labels and a signal",
  "no-signal": "enough labels, nothing beyond the base rate",
  "not-yet": "under 30 labels",
};
// The batteries whose not-yet questions the operator opened. The panel is drawn
// again on every event, so a row that folded itself back would lose the place
// the operator had opened it at.
const jevOpened = new Set();

function jevPct(v) { return (v * 100).toFixed(1) + "%"; }

function jevChip(verdict, text, title) {
  const c = el("span", "jvchip " + (JV_CLASS[verdict] || "jv-notyet"), text);
  if (title) c.title = title;
  return c;
}

// jevQuestionChip draws one question. Its tooltip carries the figures the
// scorecard reported for it, and only those: an older report omits them.
function jevQuestionChip(q) {
  const bits = [];
  if (q.labeled) bits.push("labeled " + q.labeled);
  if (q.base_rate != null) bits.push("base rate " + jevPct(q.base_rate));
  if (q.precision != null) bits.push("precision at 0.5 " + jevPct(q.precision));
  return jevChip(q.verdict, q.id, bits.join(" · "));
}

// jevRow draws one battery: its name and counts, then its questions as chips. A
// battery with no log in the window is a dash row; a kept or lost line says so
// in the questions cell. A battery counting something other than items says its
// own unit after the count, and one whose report skipped lines says how many
// went unanswered.
function jevRow(b) {
  const tr = el("tr", b.failed ? "jvstale" : "");
  tr.append(el("td", "jvname", b.name));
  const has = b.items > 0;
  const items = has ? String(b.items) + (b.unit ? " " + b.unit : "") : "-";
  tr.append(el("td", "n", items), el("td", "n", has ? String(b.labeled || 0) : "-"));
  const cell = el("td", "jvq");
  tr.append(cell);
  if (b.failed && !b.kept) {
    cell.append(el("span", "empty", "unavailable"));
    return tr;
  }
  if (b.unanswered > 0) {
    const skip = el("span", "empty", b.unanswered + " unanswered");
    skip.title = "these lines logged no answer";
    cell.append(skip);
  }
  const qs = b.questions || [];
  // Only not-yet folds, the verdict the title counts under that name. A verdict
  // this page does not know stays shown, dim, so a scorecard that grows one
  // neither hides its questions nor inflates the fold's count.
  const shown = qs.filter(q => q.verdict !== "not-yet");
  const pending = qs.filter(q => q.verdict === "not-yet");
  for (const q of shown) cell.append(jevQuestionChip(q));
  if (pending.length) {
    const more = el("div", "jvmore");
    more.hidden = !jevOpened.has(b.name);
    for (const q of pending) more.append(jevQuestionChip(q));
    // The plus says the row is showing fewer questions than the battery has.
    const fold = el("button", "jvchip jv-notyet jvfold", (shown.length ? "+" : "") + pending.length + " not yet");
    fold.type = "button";
    const word = () => { fold.title = (jevOpened.has(b.name) ? "hide" : "show") + " this battery's not-yet questions"; };
    word();
    fold.onclick = () => {
      if (jevOpened.has(b.name)) jevOpened.delete(b.name); else jevOpened.add(b.name);
      more.hidden = !jevOpened.has(b.name);
      word();
    };
    cell.append(fold, more);
  }
  if (b.failed) cell.append(el("span", "empty", " (stale: the read failed)"));
  return tr;
}

// renderJev draws the JEV panel: the totals as the title line with the
// scorecard's window and the read's age (or that the age cannot be known),
// three verdict counts as chips beside them, then one table row per battery in
// name order, its earning and no-signal questions as chips and the not-yet ones
// folded. The counts come from the server's Tally, so the page never adds them
// up.
function renderJev(s) {
  const sec = $("jevsec"), box = $("jev"), note = $("jevnote");
  const sc = s.jev_scorecard, r = readOf(s, "jev_scorecard");
  box.replaceChildren();
  sec.hidden = !sc && !r;
  note.className = "r"; note.textContent = ""; note.title = "";
  if (!sc && !r) return;
  if (!sc || (r && r.stale)) {
    const why = !sc || (r && r.error) ? "the read failed" : "the read went stale";
    note.className = "r " + (why === "the read failed" ? "badc" : "warnc");
    note.textContent = "unavailable — " + why;
    return;
  }
  const t = sc.totals || {};
  const lost = sc.unavailable || [];
  const parts = [(t.batteries || 0) + (t.batteries === 1 ? " battery" : " batteries"), (t.items || 0) + " items", (t.labeled || 0) + " labeled"];
  if (sc.window) parts.push("last " + sc.window);
  // The title line always dates its reading: a scorecard whose read carries no
  // stamp says the age cannot be known rather than leaving it out.
  parts.push(r && r.ageSec != null ? "read " + fmtDur(r.ageSec) + " ago" : "read age unknown");
  note.append(document.createTextNode(parts.join(" · ")));
  const counts = {earning: t.earning || 0, "no-signal": t.no_signal || 0, "not-yet": t.not_yet || 0};
  for (const v of JV_VERDICTS) note.append(document.createTextNode(" "), jevChip(v, counts[v] + " " + v, JV_MEANING[v]));
  note.title = JV_VERDICTS.map(v => v + ": " + JV_MEANING[v] + ".").join(" ");
  if (lost.length) {
    note.append(document.createTextNode(" · " + lost.length + " unavailable: " + lost.join(", ")));
    note.className = "r warnc";
  }

  const table = el("table", "jvtable");
  const head = el("tr");
  head.append(el("th", "", "battery"), el("th", "n", "items"), el("th", "n", "labeled"), el("th", "", "questions"));
  const thead = document.createElement("thead"); thead.append(head); table.append(thead);
  const body = document.createElement("tbody"); table.append(body);
  box.append(table);

  const batteries = (sc.batteries || []).slice().sort((a, b) => {
    const x = a.name || "", y = b.name || "";
    return x < y ? -1 : x > y ? 1 : 0;
  });
  for (const b of batteries) body.append(jevRow(b));
}

// MG_WORDS gives the title line a word to count each verdict by, where a target
// row keeps the panel's own word; MG_MEANING says what a verdict means for the
// chip's tooltip in Mango's terms, not the Jev panel's labels.
const MG_WORDS = {earning: "earning", "no-signal": "no-signal", "not-yet": "not checkable"};
const MG_MEANING = {
  earning: "enough positives and a signal replicated on the holdout",
  "no-signal": "enough positives, nothing beyond the base rate",
  "not-yet": "too few positives, or none in the holdout, to check",
};

// renderMango draws the Mango panel. A not-yet target is not a verdict to line up
// with the others, so it leaves the table for a line of its own. A missing or
// unreadable panel draws no target rows: the last analysis would pass as current.
// Every string is the reader's, already stripped and capped, and is set with
// textContent only.
function renderMango(s) {
  const sec = $("mangosec"), box = $("mango"), note = $("mangonote");
  const m = s.mango;
  box.replaceChildren();
  note.className = "r"; note.textContent = ""; note.title = "";
  sec.hidden = !m;
  if (!m) return;
  const stale = m.state === "stale";
  const read = m.state === "fresh" || stale;
  if (read) {
    const c = m.counts || {};
    const parts = [m.items + (m.items === 1 ? " landing" : " landings"), m.snapshot_hours + " snapshot hours", m.generated_at ? "analysed " + age(m.generated_at) + " ago" : "analysis age unknown", m.note];
    note.append(document.createTextNode(parts.join(" · ")));
    const counts = {earning: c.earning || 0, "no-signal": c.no_signal || 0, "not-yet": c.not_yet || 0};
    for (const v of JV_VERDICTS) note.append(document.createTextNode(" "), jevChip(v, counts[v] + " " + MG_WORDS[v], MG_MEANING[v]));
    if (stale) note.className = "r warnc";
  } else {
    note.className = m.state === "error" ? "r badc" : "r";
    note.textContent = m.note;
  }

  const table = el("table", "jvtable mgtable");
  // The stacked layout sets display on the table's parts, which some browsers
  // read as dropping their table roles, so the roles are stated (gt-c6ge9).
  table.setAttribute("role", "table");
  const head = el("tr");
  // The header row names each column so the stylesheet can give that column a
  // share of the row; a fixed-layout table reads its widths from this row. The
  // interval column is narrower than the word it heads, so the cell clips what
  // it cannot draw and the word rides in a title (gt-c6ge9).
  const intervalHead = el("th", "mgc-interval", "interval");
  intervalHead.setAttribute("title", "interval");
  head.append(el("th", "mgc-target", "target"), el("th", "mgc-verdict", "verdict"), el("th", "mgc-rate", "rate"), intervalHead, el("th", "mgc-evidence", "evidence"), el("th", "mgc-box", "best box"));
  const thead = document.createElement("thead"); thead.append(head); table.append(thead);
  const body = document.createElement("tbody"); table.append(body);
  box.append(table);

  const col = el("tr", stale ? "jvstale" : "");
  col.append(el("td", "jvname", "collection"), el("td"), el("td", "n"), el("td", "n"), el("td", "n"), el("td", m.state === "error" ? "badc" : "empty", m.note));
  body.append(col);
  if (!read) return;
  const unchecked = [];
  for (const t of m.targets || []) {
    // A target the panel could not check is not a verdict to line up with the
    // others; it goes under the table as one line saying why.
    if (t.verdict === "not-yet") unchecked.push(t);
    else body.append(mangoRow(t, stale));
  }
  for (const t of unchecked) box.append(mangoUnchecked(t, stale));
  const trend = mangoTrend(m, stale);
  if (trend) box.append(trend);
}

// mangoTrend draws the rejected-share trend under the panel's targets: a line
// with a dot and the share at each week, the week and its landings under the
// dot, and each regime event as a vertical marker against the day it happened,
// labelled with what changed. A panel the writer gave no weekly series gets no
// trend block, so an older panel still renders. Fewer than two weeks is not a
// trend the page can draw, and its heading says so rather than leaving a blank
// chart under the targets.
function mangoTrend(m, stale) {
  if (!Array.isArray(m.weekly)) return null;
  const block = el("div", "mgt" + (stale ? " jvstale" : ""));
  const head = el("div", "mgthead");
  block.append(head);
  const DAYMS = 864e5;
  const day = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
  // The reader drops a week it cannot place or whose share is not a proportion;
  // the page makes the same check so a state that skipped the reader cannot
  // draw a point at NaN, which an SVG renders as nothing at all.
  const weeks = m.weekly.filter(w => w && typeof w.week === "string" && Number.isFinite(day(w.week)) && Number.isFinite(w.rejected_share));
  if (weeks.length < 2) {
    head.textContent = "not enough weeks yet";
    return block;
  }
  head.textContent = "Rejected before landing, by week";

  // The side margins leave room for a week label centred on either end of the
  // span and for the share scale's labels on the left. Label rows are 14 units
  // apart at 11 units of type, and the plot starts 52 units down, so the third
  // row's baseline clears it.
  const W = 700, left = 44, right = W - 44, baseTop = 52, baseBottom = 132, rowPx = 14;
  // The x span runs from the first week to a week past the last one, so the
  // newest dot is not drawn against the right edge; an event outside the span
  // has no x on the trend and is left out.
  const first = day(weeks[0].week), last = day(weeks[weeks.length - 1].week) + 7 * DAYMS;
  const span = Math.max(DAYMS, last - first);
  const xAt = d => left + (d - first) / span * (right - left);

  const marks = (m.events || []).filter(e => { const d = day(e.date); return d >= first && d <= last; }).sort((a, b) => day(a.date) - day(b.date));

  // The page's font is monospace, so a label's width is its character count
  // times the advance at font-size 11 (0.6em, 6.6px): an estimate that
  // under-measures lays two labels on one row whose text then runs together,
  // and the viewBox scales the whole chart as one piece, so the page width
  // cannot part them (gt-ejvpk).
  const charPx = 6.6, labelGap = 8, chartPad = 2;
  // The viewBox clips anything past its edge, so a label is cut to the width it
  // is measured at, at a word boundary and with an ellipsis, rather than losing
  // its end where no one can see it was cut.
  const labelChars = 60;
  const labelText = what => {
    if (what.length <= labelChars) return what;
    const cut = what.slice(0, labelChars - 1);
    const space = cut.lastIndexOf(" ");
    return (space > labelChars / 2 ? cut.slice(0, space) : cut).trimEnd() + "…";
  };

  // An event's label sits right of its marker, and left of it when the text
  // would pass the plot's right edge and the left side holds the whole label.
  // Each label takes the first row whose extents its own does not touch, so two
  // events close in time sit on separate rows instead of overprinting; when
  // every row is taken a new one is added. The clamp is the guard that keeps a
  // label's end inside the box the viewBox clips at.
  const rows = [];
  const touches = (used, iv) => used.some(u => u[0] < iv[1] && iv[0] < u[1]);
  const placed = marks.map(e => {
    const x = xAt(day(e.date));
    const shown = labelText(String(e.what || ""));
    const width = shown.length * charPx + labelGap;
    const flip = x + 4 + width > right && x - 4 - width >= chartPad;
    const at = flip ? x - 4 : Math.min(x + 4, W - chartPad - width);
    const ext = flip ? [at - width, at] : [at, at + width];
    let row = 0;
    while (row < rows.length && touches(rows[row], ext)) row++;
    (rows[row] = rows[row] || []).push(ext);
    return {x, shown, anchor: flip ? "end" : "start", at, row};
  });

  // Three rows fit above the plot in the chart's base height; each row past
  // them lengthens the chart by one row's worth, so the plot keeps its own size
  // and every label keeps its space above it (gt-ejvpk).
  const extra = Math.max(0, rows.length - 3) * rowPx;
  const H = 170 + extra, top = baseTop + extra, bottom = baseBottom + extra;
  let peak = 0;
  for (const w of weeks) peak = Math.max(peak, w.rejected_share);
  // The share axis runs from 0 to the largest share rounded up to the next five
  // points, and never shorter than 20% so a quiet trend is not drawn as a spike.
  // The epsilon keeps a share already on a five-point mark from rounding up.
  const step = 0.05;
  const yMax = Math.max(0.2, Math.round(Math.ceil(peak / step - 1e-9) * step * 100) / 100);
  const yAt = share => bottom - (share / yMax) * (bottom - top);

  const svg = svgEl("svg", {viewBox: "0 0 " + W + " " + H, class: "mgchart", role: "img",
    "aria-label": "Rejected share by week: " + weeks.length + " weeks from " + weeks[0].week.slice(5) + " to " + weeks[weeks.length - 1].week.slice(5) + ", with " + marks.length + (marks.length === 1 ? " regime event" : " regime events")});

  // The 10% and 20% marks are labelled dotted gridlines, so a share reads as a
  // height against a scale rather than as a point on a bare line.
  for (const tick of [0.1, 0.2]) {
    const y = yAt(tick);
    svg.append(svgEl("line", {x1: left, x2: right, y1: y.toFixed(1), y2: y.toFixed(1), class: "mgtgrid", stroke: "currentColor", "stroke-dasharray": "2 3", "stroke-opacity": "0.35"}));
    const label = svgEl("text", {x: left - 6, y: (y + 3).toFixed(1), "text-anchor": "end", class: "mgtytick", fill: "currentColor", "font-size": "11", "fill-opacity": "0.6"});
    label.textContent = Math.round(tick * 100) + "%";
    svg.append(label);
  }
  svg.append(svgEl("line", {x1: left, x2: right, y1: bottom, y2: bottom, class: "mgtaxis", stroke: "currentColor", "stroke-opacity": "0.4"}));

  const pts = weeks.map(w => ({x: xAt(day(w.week)), y: yAt(w.rejected_share), w}));
  svg.append(svgEl("polyline", {points: pts.map(p => p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" "), fill: "none", stroke: "var(--teal)", "stroke-width": "1.5", class: "mgtline"}));
  for (const p of pts) {
    svg.append(svgEl("circle", {cx: p.x.toFixed(1), cy: p.y.toFixed(1), r: "3", class: "mgtdot", fill: "var(--teal)"}));
    const pct = svgEl("text", {x: p.x.toFixed(1), y: (p.y - 7).toFixed(1), "text-anchor": "middle", class: "mgtpct", fill: "currentColor", "font-size": "11", stroke: "var(--panel)", "stroke-width": "3", "paint-order": "stroke", "stroke-linejoin": "round"});
    pct.textContent = jevPct(p.w.rejected_share);
    svg.append(pct);
    const wk = svgEl("text", {x: p.x.toFixed(1), y: String(H - 14), "text-anchor": "middle", class: "mgtwk", fill: "currentColor", "font-size": "11", "fill-opacity": "0.7"});
    wk.textContent = "wk of " + p.w.week.slice(5) + " (" + p.w.landings + ")";
    svg.append(wk);
  }

  // Each label is haloed in the panel's colour, so a dashed marker that runs
  // under its text is cut under the word rather than running through it. A
  // label sits 4 units off its own marker, so the marker under it is usually a
  // neighbouring event's; a long label pushed back inside the plot's right edge
  // can start left of its own marker, and that marker is cut too.
  for (const {x, shown, anchor, at, row} of placed) {
    svg.append(svgEl("line", {x1: x.toFixed(1), x2: x.toFixed(1), y1: top, y2: bottom, class: "mgtmark", stroke: "currentColor", "stroke-dasharray": "3 3", "stroke-opacity": "0.55"}));
    const label = svgEl("text", {x: at.toFixed(1), y: String(11 + row * rowPx), "text-anchor": anchor, class: "mgtwhat", fill: "currentColor", "font-size": "11", "fill-opacity": "0.8", stroke: "var(--panel)", "stroke-width": "3", "paint-order": "stroke", "stroke-linejoin": "round"});
    label.textContent = shown;
    svg.append(label);
  }
  block.append(svg);

  // The caption names the number of weeks the chart holds: a fixed count would
  // misstate a series that is not four weeks long.
  const countWords = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];
  const count = countWords[weeks.length] || String(weeks.length);
  const cap = el("div", "mgtcap");
  cap.textContent = "Landings per week in brackets. " + count.charAt(0).toUpperCase() + count.slice(1) + " weeks is too few to say what caused the rise; dashed lines mark when a regime changed.";
  block.append(cap);
  return block;
}

// mangoRow draws one checkable target as a row of the panel's table, so its
// cells stay under the columns the collection row sets.
function mangoRow(t, stale) {
  const tr = el("tr", stale ? "jvstale" : "");
  tr.setAttribute("role", "row");
  // The label is the panel's plain-words title; a target it has no title for
  // shows its id, so a target added to the analysis still draws a row.
  tr.append(mgCell(el("td", "jvname", t.label || t.target), "target"));

  const verdict = el("td", "mgverdict");
  // A verdict this page does not know keeps the panel's word and stays dim, so
  // it never wears a counted verdict's colour.
  verdict.append(jevChip(t.verdict, t.verdict, MG_MEANING[t.verdict] || "a verdict this page does not know"));
  // A thin box's rate rests on too few positives to read as a measurement; the
  // chip names the count it rests on.
  if (t.thin) verdict.append(el("span", "jvchip jvthin", "thin n=" + t.holdout_n));
  tr.append(mgCell(verdict, "verdict"));

  tr.append(mgCell(mangoRates(t), "rate"));
  tr.append(mgCell(mangoInterval(t), "interval"));
  tr.append(mgCell(mangoEvidence(t), "evidence"));
  tr.append(mgCell(el("td", "mgbox", t.best_box || "-"), "best box"));
  return tr;
}

// mgCell names a body cell's column on the cell itself, so the stacked layout
// can print the name above a line whose column is no longer visible above it
// (gt-c6ge9).
function mgCell(td, label) {
  td.setAttribute("data-label", label);
  td.setAttribute("role", "cell");
  return td;
}

// mangoRates draws the rate beside the baseline it is measured against. A rate
// or baseline the panel did not report is a dash, never a zero. A baseline of
// zero makes the lift a division by zero rather than a large effect, so it is
// left out.
function mangoRates(t) {
  const td = el("td", "mgrates");
  const pct = v => v == null ? "-" : jevPct(v);
  const big = el("div", "mgbig");
  big.append(el("span", "", pct(t.holdout_rate)));
  // An older panel carries no holdout positives, so the group's count is the
  // rate's own "of N" and the numerator is not drawn.
  if (t.holdout_rate != null && t.holdout_positives == null && t.holdout_n) big.append(el("span", "mgof", " of " + t.holdout_n));
  td.append(big);
  td.append(el("div", "mgvs", "vs " + pct(t.baseline) + " across all recent landings"));
  if (t.baseline > 0 && t.holdout_rate != null) td.append(el("div", "mglift", (t.holdout_rate / t.baseline).toFixed(1) + "x as likely"));
  if (t.holdout_positives != null) td.append(el("div", "mggroup", t.holdout_positives + " of " + t.holdout_n + " recent landings in the group"));
  return td;
}

// mangoInterval draws the box's interval on a 0..100% track. A panel that
// carried no interval, or only one bound, draws no bar: a range the writer did
// not measure is not drawn.
function mangoInterval(t) {
  const td = el("td", "mginterval");
  if (t.ci_low == null || t.ci_high == null || t.ci_high < t.ci_low) return td;
  const at = v => (v * 100).toFixed(1) + "%";
  const bar = el("div", "mgbar");
  bar.setAttribute("role", "img");
  bar.setAttribute("aria-label", (t.holdout_rate == null ? "no rate" : jevPct(t.holdout_rate)) + ", interval " + jevPct(t.ci_low) + " to " + jevPct(t.ci_high));
  bar.append(el("div", "mgtrack"));
  if (t.baseline != null) {
    const base = el("div", "mgbase"); base.style.left = at(t.baseline); bar.append(base);
  }
  const ci = el("div", "mgci"); ci.style.left = at(t.ci_low); ci.style.width = at(t.ci_high - t.ci_low); bar.append(ci);
  if (t.holdout_rate != null) {
    const dot = el("div", "mgdot"); dot.style.left = at(t.holdout_rate); bar.append(dot);
  }
  td.append(bar);
  return td;
}

// mangoEvidence draws the box's conditions so a reader can see what the box was
// built from: the ones that narrow the group as chips, the rest only in a closed
// fold, greyed and marked, where they cost no row space. A target from an older
// panel carries no conditions, so its best box stands in for them in the fold.
function mangoEvidence(t) {
  const td = el("td", "mgevidence");
  const conds = t.conditions || [];
  for (const c of conds) if (c.narrows) td.append(el("span", "jvchip mgcondchip", c.text + " " + jevPct(c.share) + " of landings"));
  const fold = el("details", "mgfold");
  fold.append(el("summary", "", "how it was found"));
  const list = el("div", "mgcondlist");
  for (const c of conds) {
    const row = el("div", "mgcond" + (c.narrows ? "" : " jvstale"));
    row.append(el("span", "mgcondtext", c.text), el("span", "mgcondshare", jevPct(c.share) + " of landings"));
    if (!c.narrows) row.append(el("span", "mgcondtag", "doesn't narrow"));
    list.append(row);
  }
  if (!conds.length) list.append(el("div", "mgbox", t.best_box || "-"));
  fold.append(list);
  td.append(fold);
  return td;
}

// mangoUnchecked draws a target the panel could not check as one line under the
// table. The reason is the line's whole use, so a word the page has no sentence
// for is still drawn as the panel's own word; a skipped target from an older
// panel carries no reason key, and too few positives is that writer's only skip.
function mangoUnchecked(t, stale) {
  const line = el("div", "mgnot" + (stale ? " jvstale" : ""));
  line.append(el("span", "jvchip jv-notyet", "not checkable"), el("span", "mgnotlabel", t.label || t.target), el("span", "mgnotpos", t.positives + (t.positives === 1 ? " positive" : " positives")));
  let why = "";
  if (t.reason === "few_positives") why = "too few positives to check";
  else if (t.reason === "no_holdout_positives") {
    why = "no positives in the recent landings to check it on";
    if (t.last_positive) why += ", its last positive was " + t.last_positive;
  } else if (t.reason) why = "a reason this page does not know: " + t.reason;
  else if (t.skipped) why = "too few positives to check";
  if (why) line.append(el("span", "mgnotwhy", why));
  return line;
}

// costBarChart draws one of the Cost panel's charts from its data, which the
// server builds (CostChart): one bar or gap per entry, a bar for each series the
// chart draws beside them on the same buckets, an optional limit line, and the
// aria-label that carries the numbers. The page only places what it is given; it
// decides no value, label or line of its own.
function costBarChart(box, c, kind, providers) {
  if (!c || !Array.isArray(c.bars) || !c.bars.length) return;
  const daily = kind === "daily";
  // A series is drawn only when it lines up bucket for bucket; a series the
  // server built on other buckets would put one day's dollars over another. A
  // series not drawn says so under the chart, like one the server left out: a
  // chart never goes quiet about why a provider's dollars are missing.
  // A drawn series' role is its place in the series array, so a series left out
  // does not hand the first series' gap tick and daily amount to the next one.
  const drawn = [], roles = [], notDrawn = [];
  costChartSeries(c).forEach((s, at) => {
    if (!s.why && Array.isArray(s.bars) && s.bars.length === c.bars.length) { drawn.push(s); roles.push(at); }
    else notDrawn.push({name: s.name || s.id, why: s.why || "the series does not line up with the chart's buckets: it has " + (Array.isArray(s.bars) ? s.bars.length : "no") + " where the chart has " + c.bars.length});
  });
  const n = drawn.length;
  const W = 700, H = daily ? 150 : 120, pad = 26, base = H - (daily ? 26 : 22);
  const top = Math.max(0.01, c.limit ? c.limit.value : 0, ...drawn.flatMap(s => s.bars.map(b => b.value || 0)));
  const y = v => base - (Math.max(0, v) / top) * (base - 16);
  const slot = (W - 2 * pad) / c.bars.length;
  // The drawn series share the wide part of the slot with a 2px gap between
  // bars: one series takes all of it, two take the halves the DeepSeek and
  // Claude pair always had.
  const wide = slot * (daily ? 0.56 : 0.6);
  const w = n ? (wide - 2 * (n - 1)) / n : wide;
  const svg = svgEl("svg", {viewBox: "0 0 " + W + " " + H, class: "dchart " + kind, role: "img", "aria-label": c.aria});
  if (n > 1) svg.append(costHatch(kind));
  svg.append(svgEl("line", {x1: pad, x2: W - pad, y1: base, y2: base, class: "axis"}));
  c.bars.forEach((b, i) => {
    const cx = pad + slot * i + slot / 2;
    drawn.forEach((s, k) => {
      costSeriesBucket(svg, s.bars[i], roles[k], cx - wide / 2 + k * (w + 2), w, base, y, kind, costChartColour(providers, s.id, k));
    });
    if (daily || i % 3 === 0) {
      const lbl = svgEl("text", {x: cx, y: H - (daily ? 8 : 6), class: "day", "text-anchor": "middle"});
      lbl.textContent = b.label;
      svg.append(lbl);
    }
  });
  // The limit is a dashed line only. Its words are a caption under the legend,
  // not text over the bars, which the bars would overprint (gt-p39fq).
  if (c.limit) svg.append(svgEl("line", {x1: pad, x2: W - pad, y1: y(c.limit.value), y2: y(c.limit.value), class: "limit"}));
  box.append(svg);
  // The legend names each series the chart draws, since the colour is the only
  // thing that tells them apart; a series' own name says in full what its
  // dollars are. The legend follows the providers array, so it lists only the
  // series drawn.
  const named = {};
  drawn.forEach(s => { named[s.id] = s.name || true; });
  const lg = costLegend(providers, named);
  if (lg) box.append(lg);
  if (c.limit) box.append(el("div", "title", "dashed line: " + c.limit.label));
  // A series not drawn says why on the panel, so an absent series is not read
  // as a week of no spend.
  for (const s of notDrawn) box.append(el("div", "title", s.name + " series not drawn: " + s.why));
}

// costChartSeries is the chart's series the page draws: the server's series
// array, or, for a server older than the array, the DeepSeek bars and the Claude
// series beside them in the same shape. The fallback goes with the array's
// fallback in a later bead.
function costChartSeries(c) {
  if (Array.isArray(c.series)) return c.series;
  const out = [{id: "deepseek", name: "", bars: c.bars}];
  if (c.claude) out.push({id: "claude", name: c.claude.name, bars: c.claude.bars});
  else if (c.claude_why) out.push({id: "claude", name: COST_SERIES_NAMES.claude, why: c.claude_why});
  return out;
}

// costChartColour is the colour a series' bars are drawn in, the one its legend
// swatch shows: the provider's place in the providers array, or, for a series
// with no provider there, its place among the drawn series.
function costChartColour(providers, id, k) {
  const at = (Array.isArray(providers) ? providers : []).findIndex(p => p && typeof p === "object" && p.id === id);
  return costSeriesColour(id, at >= 0 ? at : k);
}

// costSeriesBucket draws one bucket of a drawn series at x. role is the series'
// place in the series array. A value is a bar in the series' colour with its
// tooltip; a gap is a tick under the array's first series, as the DeepSeek bars
// always marked one, and a hatched column under the others, as the Claude series
// did. The first series also carries the daily amount above its bar. The class
// keeps the look of the second series; the fill is the legend swatch's colour, so
// a bar matches its swatch whichever series comes first.
function costSeriesBucket(svg, b, role, x, w, base, y, kind, colour) {
  if (b.gap) {
    if (role === 0) {
      const mid = x + w / 2;
      svg.append(svgEl("line", {x1: mid, x2: mid, y1: base - 3, y2: base, class: "gap"}));
    } else {
      const r = svgEl("rect", {x: x, y: 16, width: w, height: base - 16, class: "cgap", fill: "url(#dhatch-" + kind + ")"});
      const t = svgEl("title", {}); t.textContent = b.title;
      r.append(t);
      svg.append(r);
    }
    return;
  }
  const bar = svgEl("rect", {x: x, y: y(b.value), width: w, height: Math.max(0, base - y(b.value)), class: role === 1 ? "cbar" : "bar", style: "fill:" + colour});
  const t = svgEl("title", {}); t.textContent = b.title;
  bar.append(t);
  svg.append(bar);
  if (role === 0 && kind === "daily") {
    const amt = svgEl("text", {x: x + w / 2, y: y(b.value) - 4, class: "amt", "text-anchor": "middle"});
    amt.textContent = money(b.value);
    svg.append(amt);
  }
}

// costHatch is the pattern a series' bucket with no sample is filled with, from
// the second series on: the absence of a reading is marked, never drawn as a bar
// of zero, which would read as a quiet bucket.
function costHatch(kind) {
  const defs = svgEl("defs", {});
  const pat = svgEl("pattern", {id: "dhatch-" + kind, width: "4", height: "4", patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)"});
  pat.append(svgEl("line", {x1: "0", y1: "0", x2: "0", y2: "4", class: "hatch"}));
  defs.append(pat);
  return defs;
}

// COST_SERIES_COLOURS pins the DeepSeek and Claude series to the colours their
// bars have always been drawn in (blue and violet), so a legend swatch matches
// its bar, whatever order the providers come in. A bar takes this colour as its
// inline fill, not from its class. A provider with no pinned colour takes the
// palette by its place in the providers array.
const COST_SERIES_COLOURS = {deepseek: "var(--blue)", claude: "var(--violet)"};
const COST_PALETTE = ["var(--amber)", "var(--green)", "var(--red)"];
const COST_SERIES_NAMES = {deepseek: "DeepSeek", claude: "Claude"};
function costSeriesColour(id, i) {
  return COST_SERIES_COLOURS[id] || COST_PALETTE[i % COST_PALETTE.length];
}
// costLegend lists the series a chart draws, one entry per provider that has
// one, in the providers' order. drawn maps a provider's id to the name its
// series carries: true takes the provider's own label, a string is the series'
// own name. A provider with no series in the chart has no entry, and no entry
// means no legend at all. A series whose provider is not in the array (the
// array is missing) is still named, so the legend does not vanish with the list.
function costLegend(providers, drawn) {
  const items = [];
  const named = new Set();
  (Array.isArray(providers) ? providers : []).forEach((p, i) => {
    if (!p || typeof p !== "object" || !drawn[p.id]) return;
    named.add(p.id);
    const name = typeof drawn[p.id] === "string" ? drawn[p.id] : p.label || p.id;
    items.push([costSeriesColour(p.id, i), name]);
  });
  for (const id of Object.keys(drawn)) {
    if (!drawn[id] || named.has(id)) continue;
    const name = typeof drawn[id] === "string" ? drawn[id] : COST_SERIES_NAMES[id] || id;
    items.push([costSeriesColour(id, items.length), name]);
  }
  return items.length ? legend(items) : null;
}
// costChartFolds keeps each chart's fold by its key. A fold is a section of its
// own that foldable folds like every other section, and it is built once: the
// fold keeps one entry per section, so a redraw that built a new section would
// stack a second fold on the same key.
const costChartFolds = {};
// costChartFold draws a Cost chart into box as a fold under its own heading. The
// daily chart starts open and the hourly one closed, unless the reader has
// chosen otherwise. A chart the server did not build leaves no fold at all.
function costChartFold(box, kind, chart, providers) {
  if (!chart || !Array.isArray(chart.bars) || !chart.bars.length) return;
  const key = "cost." + kind;
  let f = costChartFolds[key];
  if (!f) {
    const sec = el("section");
    sec.dataset.fold = key;
    const body = el("div", "body");
    sec.append(el("h2", "", kind === "daily" ? "Daily spend" : "Hourly spend"), body);
    foldable(sec, {key: key, defaultOpen: kind === "daily"});
    f = costChartFolds[key] = {sec: sec, body: body};
  }
  f.body.replaceChildren();
  costBarChart(f.body, chart, kind, providers);
  box.append(f.sec);
}

// renderCost draws the Cost panel. The table draws even without a spend report,
// since its rows come from the other readers too. It sits outside the part a
// stale spend read greys, so only the DeepSeek row, whose money that read feeds,
// greys inside the table; the Claude and Jev rows stay clear. The charts stay in
// the greyed part.
function renderCost(s) {
  const box = $("cost"), note = $("costnote");
  box.replaceChildren();
  note.className = "r"; note.textContent = ""; note.title = "";
  const d = s.spend, u = s.usage, r = readOf(s, "spend");
  costProviders(box, s.cost_providers, !!(r && r.stale));
  const spendBox = el("div", "spendpart");
  box.append(spendBox);
  paintsRead(spendBox, note, r);
  // A usage scan that has not answered yet is reading, not missing.
  if (!d) spendBox.append(el("div", "empty", (r ? "unavailable — the spend read failed" : "no spend report") + (u ? "" : "; usage still reading…")));
  if (!d && !u) {
    costGCP(box, s.cloud);
    return;
  }
  const charts = s.cost_charts || {};
  costChartFold(spendBox, "daily", charts.daily, s.cost_providers);
  costChartFold(spendBox, "hourly", charts.hourly, s.cost_providers);
  costGCP(box, s.cloud);
  const usage = costUsage(box, u, s);
  costJevFold(box, s);
  costRework(box, s.rework);
  // The caption carries the spend report's ledger sample and its read age,
  // which the table's hover does not, beside the usage glance.
  const spendWords = [d && d.last_sample ? "ledger " + d.last_sample.replace("T", " ") : null, r && r.ageSec != null ? "read " + fmtDur(r.ageSec) + " ago" : null];
  note.textContent = readCaption(r, [usage.text || null].concat(spendWords));
  note.title = usage.title || "";
  // A stale or failed spend read has already coloured the caption; the usage
  // part only colours one that is otherwise plain.
  if (note.className === "r" && (usage.bad || usage.warn)) note.className = "r " + (usage.bad ? "badc" : "warnc");
}

// An escalation's severity is why a row is where it is, so the panel colours
// every one of the four and no two share a colour.
const SEV_CLASS = {critical: "sev-critical", high: "sev-high", medium: "sev-medium", low: "sev-low"};

// Alerts. The server decides what needs attention and pushes each new one as an
// "alert" event; the page shows a toast, marks the title, and (when the browser
// allows it) raises a notification — but only while the operator has alerts on.
// What is waiting rather than merely noticed is the Attention panel's, and a
// routine line such as a rejected landing is the feed's.
const BASE_TITLE = document.title;
let alertsOn = false;
try { alertsOn = localStorage.getItem("gt-alerts") === "on"; } catch (e) { alertsOn = false; }
let unreadAlerts = 0;

function syncAlertCtl() {
  const b = $("alertsctl");
  b.className = alertsOn ? "on" : "";
  b.textContent = "alerts: " + (alertsOn ? "on" : "off");
  b.title = alertsOn
    ? "alerts are on: a toast, a title marker, and a browser notification while the tab is in the background"
    : "turn alerts on: a toast, a title marker, and a browser notification while the tab is in the background";
}

function markTitle() {
  document.title = alertsOn && unreadAlerts > 0 && !document.hasFocus() ? "(!) " + BASE_TITLE : BASE_TITLE;
}

function showToast(a) {
  const box = $("toasts");
  const t = el("div", "toast " + a.level);
  const body = el("div");
  body.append(el("div", "tt", a.title || "alert"), el("div", "tx", a.text || ""));
  const x = el("button", "", "✕");
  x.type = "button";
  x.title = "dismiss";
  x.onclick = () => t.remove();
  t.append(body, x);
  box.prepend(t);
  while (box.children.length > 5) box.lastChild.remove();
}

function notify(a) {
  if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
  try { new Notification(a.title || "Gas Town", {body: a.text || ""}); } catch (e) {}
}

function onAlert(a) {
  if (!alertsOn) return;
  showToast(a);
  notify(a);
  if (!document.hasFocus()) { unreadAlerts++; markTitle(); }
}

function initAlerts() {
  syncAlertCtl();
  $("alertsctl").onclick = () => {
    alertsOn = !alertsOn;
    try { localStorage.setItem("gt-alerts", alertsOn ? "on" : "off"); } catch (e) {}
    syncAlertCtl();
    if (alertsOn) {
      unreadAlerts = 0;
      markTitle();
      if (typeof Notification !== "undefined" && Notification.permission === "default") {
        try { const p = Notification.requestPermission(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
      }
    } else {
      $("toasts").replaceChildren();
    }
  };
  window.addEventListener("focus", () => { unreadAlerts = 0; markTitle(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { unreadAlerts = 0; markTitle(); } });
}

let qTab = "ready";
// The queue opens the way the operator uses it: every store, dispatchable
// beads only (gt-x9gk4, reversing gt-fi93j). Not persisted, so a reload always
// returns to this view rather than to a filter left on another store.
const DEFAULT_QRIG = "all";
const DEFAULT_QSHAPE = "ok";
// The Blocked tab hides wisp rows unless the chip is on (gt-q6ed5): a retired
// patrol or an old polecat run leaves dead step beads behind, and they outnumber
// the real blocked work. The server decides which rows those are (QueueBead.Wisp),
// the same verdict the Work panel's blocked line counts.
const DEFAULT_QWISP = false;
let qRig = DEFAULT_QRIG;
let qShape = DEFAULT_QSHAPE;
let qWisp = DEFAULT_QWISP;
const qOpen = new Set();
const qDetail = {};
let wKey = "";
const QTABS = [["ready", "Ready to build", "ready_total", "ready"], ["landing", "Waiting to land", "landing_total", "landing"], ["blocked", "Blocked", "blocked_total", "blocked"]];
const isWisp = b => !!b.wisp;

// beadDetailFor fetches one bead's text into store under "rig/id" and calls
// done when it lands. The Work panel's rows and the Report pane's ids open a
// bead through here, so both read the one route and draw the one detail. An
// entry is {loading}, the detail, or {error}; a bead already in the store is
// never fetched twice, and a failed read is remembered as the failure it was.
function beadDetailFor(rig, id, store, done) {
  const key = rig + "/" + id;
  if (store[key]) return;
  store[key] = {loading: true};
  fetch("/api/bead?rig=" + encodeURIComponent(rig) + "&id=" + encodeURIComponent(id))
    .then(r => r.ok ? r.json() : Promise.reject(new Error(String(r.status))))
    .then(d => { store[key] = d; done(); })
    .catch(() => { store[key] = {error: true}; done(); });
}

function openBead(b) {
  const id = b.rig + "/" + b.id;
  if (qOpen.has(id)) { qOpen.delete(id); renderWork(state, true); return; }
  qOpen.add(id);
  beadDetailFor(b.rig, b.id, qDetail, () => renderWork(state, true));
  renderWork(state, true);
}

function detailBlock(d) {
  const box = el("div", "qdetail");
  if (d.loading) { box.append(el("div", "empty", "loading…")); return box; }
  if (d.error) { box.append(el("div", "badc", "could not read this bead right now")); return box; }
  const meta = [d.status, d.assignee ? "assigned " + d.assignee : "unassigned", d.created_at ? "created " + age(d.created_at) + " ago" : null, d.updated_at ? "updated " + age(d.updated_at) + " ago" : null].filter(Boolean).join(" · ");
  box.append(el("div", "title", meta));
  if ((d.labels || []).length) { const l = el("div"); d.labels.forEach(x => l.append(el("span", "tag", x))); box.append(l); }
  if ((d.blocked_by || []).length) box.append(el("div", "warnc", "blocked by " + d.blocked_by.join(", ")));
  const sec = (name, text) => { if (!text) return; box.append(el("h4", "", name), el("pre", "", text)); };
  sec("Description", d.description);
  sec("Acceptance", d.acceptance);
  sec("Design", d.design);
  sec("Notes", d.notes);
  if ((d.comments || []).length) {
    box.append(el("h4", "", "Comments"));
    d.comments.forEach(c => { const x = el("div", "qcomment"); x.append(el("div", "title", (c.author || "?") + (c.at ? " · " + age(c.at) + " ago" : "")), el("div", "", c.text)); box.append(x); });
  }
  if (d.truncated) box.append(el("div", "empty", "some text was cut to keep this small; bd show " + d.id + " has all of it"));
  return box;
}

// skipWhy is a tick's skip reason without the "<bead id>: " the dispatcher
// writes in front of it ("gt-vesnm: no seat: over the town total"). Only a
// bead-id shape is cut: "held: ..." and "unshaped: ..." are reasons, not ids
// (gt-fvtw7).
function skipWhy(reason) {
  return String(reason || "").replace(/^[a-z]{1,6}-[a-z0-9]+(?:\.[a-z0-9]+)*: /, "");
}

// skipClass says what a tick's skip reason means to the operator (gt-qt0ym):
// "waiting for a seat" when the reason begins "no seat" once the bead id is cut
// (the bead is fine and every seat is taken or capped), "skipped" for any other
// reason, an empty one included, which stays warning-coloured so a real defect
// is not hidden.
