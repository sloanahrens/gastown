function skipClass(reason) {
  return /^no seat/.test(skipWhy(reason)) ? "waiting for a seat" : "skipped";
}

// isReadyToDispatch is the one "ready to dispatch" set: the beads the dispatcher
// would slot plus those its last tick passed over (gt-qt0ym).
function isReadyToDispatch(b) { return b.shape === "ok" || b.shape === "skipped"; }

// seatPlaces maps each bead waiting for a seat to its place "N of M" in the
// dispatch order: priority, then oldest created_at, then id, the order
// specdispatch.Order uses. It is counted over every store in the ready list,
// since the seats are the town's; a list the server capped counts only the rows
// it sent, and then the places read "N of M+" (capped): the page cannot know
// the true count, and a wrong "of M" is worse than none.
function seatPlaces(all, capped) {
  const waiting = all.filter(b => b.shape === "skipped" && skipClass(b.skip_reason || b.shape_note) === "waiting for a seat");
  const t = b => { const n = Date.parse(b.created_at); return Number.isFinite(n) ? n : Infinity; };
  // A missing or non-numeric priority sorts last, like an unparseable time.
  const pri = b => (b.priority != null && Number.isFinite(Number(b.priority))) ? Number(b.priority) : 99;
  waiting.sort((a, b) => pri(a) - pri(b) || (t(a) === t(b) ? 0 : t(a) < t(b) ? -1 : 1) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  const places = {};
  waiting.forEach((b, i) => { places[b.rig + "/" + b.id] = (i + 1) + " of " + waiting.length + (capped ? "+" : ""); });
  return places;
}

// queueSkipLine is the dim line a ready row wears when the dispatcher's last
// tick passed it over (gt-e2cif): the class the tick filed it under, how long
// that verdict has stood — the time in the viewer's own clock, the tick count —
// and the tick's own reason. A row the ledger does not hold gets null and no
// line. The reason is another agent's text, so it is folded into a string that
// el() writes with textContent: nothing in it is markup.
function queueSkipLine(b) {
  if (!b.skip_class && !b.skip_reason) return null;
  const since = b.skipped_since ? "since " + clock(b.skipped_since) : "";
  const ticks = b.skip_ticks ? "for " + b.skip_ticks + (b.skip_ticks === 1 ? " tick" : " ticks") : "";
  const when = [since, ticks].filter(Boolean).join(" ");
  const what = (b.skip_class || "skipped") + (when ? " " + when : "");
  return b.skip_reason ? what + ": " + b.skip_reason : what;
}

// drawQueueList draws the whole queue into box: the tabs, the store and shape
// chips, and the rows that open a bead's text. It draws nothing without a queue.
function drawQueueList(box, s) {
  const q = s.queue;
  if (!q) return;
  const unshaped = {};
  ((s.dispatch && s.dispatch.named) || []).forEach(n => { if (n.bead && /^unshaped/.test(n.reason)) unshaped[n.bead] = n.reason; });
  if ((q.unreadable || []).length) box.append(el("div", "badc", "⚠ could not read: " + q.unreadable.join(", ") + " (its beads are missing below)"));
  const tabs = el("div", "qtabs");
  QTABS.forEach(([k, label, totalKey]) => {
    const b = el("button", "chip" + (qTab === k ? " on" : ""), label);
    b.append(el("b", "", String(q[totalKey] || 0)));
    b.onclick = () => { qTab = k; renderWork(state, true); };
    tabs.append(b);
  });
  box.append(tabs);
  const caption = {ready: "Open beads with nothing blocking them. Only the green “ready” ones are taken by the spec dispatcher: shaped, unassigned, not an epic, and in a rig that is not parked. Beads held by an assignee wait for that person; beads in parked rigs wait until the rig is re-enabled.",
    landing: "Submitted by a polecat or crew and waiting for the landing worker.",
    blocked: "Open beads waiting on another bead to close. Wisp steps left by retired patrols and old polecat runs are hidden by default; the wisps chip shows them."}[qTab];
  // The caption wears a class of its own: "empty" also marks the placeholder
  // inside the scrolling rows, so a test looking for it cannot tell a queue
  // list with a caption from one without.
  box.append(el("div", "qcaption", caption));
  const [, , totalKey, listKey] = QTABS.find(t => t[0] === qTab);
  const all = q[listKey] || [];
  // A ledger the page cannot call current backs no skip at all: the note under
  // the chips says why, and no chip, tag or row line says a bead is one
  // (gt-e2cif).
  const stale = !!q.verdicts_stale;
  // filters: which store, (for the ready list) whether the dispatcher would
  // slot it, and (for the blocked list) whether wisps are shown
  const rigs = Object.assign({}, q[listKey + "_rigs"] || {});
  if (!Object.keys(rigs).length) all.forEach(b => rigs[b.rig] = (rigs[b.rig] || 0) + 1);
  const rigNames = Object.keys(rigs).sort((a, b) => rigs[b] - rigs[a]);
  if (qRig !== "all" && !rigs[qRig]) qRig = "all";
  if (rigNames.length > 1 || qTab === "ready" || qTab === "blocked") {
    const f = el("div", "qtabs");
    const chip = (label, count, on, fn, tip) => { const b = el("button", "chip" + (on ? " on" : ""), label); if (tip) b.title = tip; b.append(el("b", "", String(count))); b.onclick = fn; f.append(b); };
    if (rigNames.length > 1) {
      chip("all stores", q[totalKey] || all.length, qRig === "all", () => { qRig = "all"; renderWork(state, true); });
      const parkedRigs = q.parked_rigs || [];
      rigNames.forEach(r => chip(r + (parkedRigs.indexOf(r) >= 0 ? " (parked)" : ""), rigs[r], qRig === r, () => { qRig = r; renderWork(state, true); }));
    }
    if (qTab === "ready") {
      const inRig = all.filter(b => qRig === "all" || b.rig === qRig);
      // One chip: a bead the last tick passed over lints clean exactly like
      // one it has not reached yet, so both are "ready to dispatch" and the
      // row's tag says which kind (gt-qt0ym, gt-e2cif).
      chip("ready to dispatch", inRig.filter(isReadyToDispatch).length, qShape === "ok", () => { qShape = qShape === "ok" ? "all" : "ok"; renderWork(state, true); },
        "shaped, unassigned and in a rig that is not parked: the dispatcher takes these as seats free up");
      chip("needs shaping", inRig.filter(b => b.shape === "fix").length, qShape === "fix", () => { qShape = qShape === "fix" ? "all" : "fix"; renderWork(state, true); });
      chip("held", inRig.filter(b => b.shape === "held").length, qShape === "held", () => { qShape = qShape === "held" ? "all" : "held"; renderWork(state, true); });
    }
    if (qTab === "blocked") {
      const inRig = all.filter(b => qRig === "all" || b.rig === qRig);
      chip("wisps", inRig.filter(isWisp).length, qWisp, () => { qWisp = !qWisp; renderWork(state, true); });
    }
    box.append(f);
  }
  // A ledger the page cannot present as current says so once, above the rows:
  // a verdict nobody re-took is not a current skip, so the page draws the note
  // and leaves the rows to the shape the lint gave them (gt-e2cif). A ledger
  // that could not be read at all has no time to age, and says that instead.
  if (stale) {
    // A ledger the server could not read carries no time, and one it sent with
    // a zero time has no age to give: both say the ledger could not be read
    // rather than age year 1 into a billion minutes.
    const at = q.verdicts_at ? new Date(q.verdicts_at).getTime() : NaN;
    const mins = Number.isFinite(at) && at > 0 ? Math.max(0, Math.round((Date.now() - at) / 60000)) : null;
    box.append(el("div", "warnc", mins == null
      ? "the dispatcher's verdict ledger could not be read, so no row says what its last tick decided"
      : "the dispatcher's verdicts are " + mins + (mins === 1 ? " minute" : " minutes") + " old, so no row shows a current skip"));
  }
  // Only the bead rows scroll: the caption and the chips above stay in view.
  const rowsBox = el("div", "qrows");
  box.append(rowsBox);
  const rows = all.filter(b => (qRig === "all" || b.rig === qRig) && (qTab !== "ready" || qShape === "all" || (qShape === "ok" ? isReadyToDispatch(b) : b.shape === qShape)) && (qTab !== "blocked" || qWisp || !isWisp(b)));
  if (!rows.length) {
    let msg;
    // The pane opens on the ready-to-dispatch view, so an empty one reports
    // what the beads are waiting on instead of "no filter matched" (gt-x9gk4).
    if (qTab === "ready" && qShape === "ok") {
      const inRig = all.filter(b => qRig === "all" || b.rig === qRig);
      const shaping = inRig.filter(b => b.shape === "fix").length;
      const held = inRig.filter(b => b.shape === "held").length;
      const parts = [];
      if (inRig.length) {
        parts.push(shaping === 1 ? "1 bead needs shaping" : shaping + " beads need shaping");
        parts.push(held === 1 ? "1 bead is held" : held + " beads are held");
      }
      msg = "nothing is dispatchable right now" + (parts.length ? " — " + parts.join(", ") : "");
    } else if (qTab === "blocked" && !qWisp) {
      // With wisps hidden the blocked list can empty out even when the tab
      // reports a total, so name what the chip would reveal (gt-q6ed5).
      const wisps = all.filter(b => (qRig === "all" || b.rig === qRig) && isWisp(b)).length;
      msg = wisps ? "nothing is blocked outside " + (wisps === 1 ? "1 wisp" : wisps + " wisps") + " — turn on the wisps chip to see them" : "nothing is blocked";
    } else {
      msg = all.length ? "nothing matches these filters" : qTab === "ready" ? "nothing is waiting to be built" : qTab === "landing" ? "nothing is waiting to land" : "nothing is blocked";
    }
    rowsBox.append(el("div", "empty", msg));
  }
  // The ready list is capped when the page holds fewer ready rows than the
  // server counted (queueMaxRows lives in the server, not here). A reading with
  // no count cannot show the list was not cut, so it counts as capped.
  const readyCounted = typeof q.ready_total === "number" && Number.isFinite(q.ready_total);
  const seatsCapped = qTab === "ready" && (!readyCounted || all.length < q.ready_total);
  const places = seatPlaces(all, seatsCapped);
  rows.forEach(b => {
    const id = b.rig + "/" + b.id;
    const open = qOpen.has(id);
    const row = el("div", "qrow");
    const head = el("button", "qhead");
    head.setAttribute("aria-expanded", open ? "true" : "false");
    head.append(el("span", "tag p" + Math.min(b.priority, 4), "P" + b.priority));
    const idc = el("span", "bead"); idc.append(el("span", "caret", open ? "▾" : "▸"), document.createTextNode(b.id));
    head.append(idc);
    const t = el("span", "t", b.title || "(no title)");
    if (b.shape === "ok") { const g = el("span", "tag good", "ready"); g.title = "the spec dispatcher would slot this bead"; t.append(document.createTextNode(" "), g); }
    else if (b.shape === "skipped") {
      // A stale ledger's skipped shape is left over from a tick the page
      // cannot vouch for, so the row is only "ready" (gt-e2cif). A current one
      // is told by cause (gt-qt0ym): no free seat is waiting, in line; any
      // other reason stays a warning with the reason in the tag.
      const reason = b.skip_reason || b.shape_note || "";
      if (stale) { const g = el("span", "tag good", "ready"); g.title = "the spec dispatcher would slot this bead"; t.append(document.createTextNode(" "), g); }
      else if (skipClass(reason) === "waiting for a seat") {
        const place = places[id];
        const g = el("span", "tag", "waiting for a seat" + (place ? " #" + place : ""));
        g.title = "nothing is wrong with this bead: every seat is taken or capped, and it goes in the order shown (priority, then oldest). " + (seatsCapped ? "The ready list was cut, so the total is at least this many. " : "") + reason;
        t.append(document.createTextNode(" "), g);
      } else { const g = el("span", "tag warnc", skipWhy(reason) ? "skipped: " + skipWhy(reason) : "skipped"); g.title = "the dispatcher's last real tick passed this bead over; the line below says why and since when"; t.append(document.createTextNode(" "), g); }
    }
    else if (b.shape === "parked") { const g = el("span", "tag", "rig parked"); g.title = b.shape_note || ""; t.append(document.createTextNode(" "), g); }
    else if (b.shape === "held") { const g = el("span", "tag", "held"); g.title = b.shape_note || ""; t.append(document.createTextNode(" "), g); }
    else if (b.shape === "fix") { const g = el("span", "tag warnc", "needs shaping"); g.title = b.shape_note || ""; t.append(document.createTextNode(" "), g); }
    else if (b.shape === "planning") { const g = el("span", "tag", "needs planning"); g.title = b.shape_note || ""; t.append(document.createTextNode(" "), g); }
    else if (unshaped[b.id]) t.append(document.createTextNode(" "), el("span", "tag warnc", "unshaped"));
    (b.labels || []).filter(l => !/^gt:/.test(l) && l !== "rework").forEach(l => t.append(document.createTextNode(" "), el("span", "tag", l)));
    if (b.labels && b.labels.indexOf("rework") >= 0) t.append(document.createTextNode(" "), el("span", "tag warnc", "rework"));
    head.append(t, el("span", "title", b.created_at ? age(b.created_at) : ""));
    const sub = [b.type, b.rig !== "gastown" ? b.rig : null, b.assignee ? "→ " + b.assignee : null, (b.blocked_by || []).length ? "blocked by " + b.blocked_by.join(", ") : null].filter(Boolean).join(" · ");
    if (sub) head.append(el("span", "qsub", sub));
    // The dispatcher's verdict on this row, in the dim line class the sub line
    // already uses. A stale ledger draws none of these: the note above the rows
    // says why, and no row claims a skip the dispatcher did not just take.
    const skip = stale ? null : queueSkipLine(b);
    if (skip) head.append(el("span", "qsub", skip));
    head.onclick = () => openBead(b);
    row.append(head);
    if (open) row.append(detailBlock(qDetail[id] || {loading: true}));
    rowsBox.append(row);
  });
  const shownInRig = rows.length;
  const totalInRig = qRig === "all" ? (q[totalKey] || 0) : (rigs[qRig] || 0);
  if (qShape === "all" && totalInRig > shownInRig) box.append(el("div", "empty", "+" + (totalInRig - shownInRig) + " more, lower priority, not shown (pick a store to see its first " + 40 + ")"));
}

function renderAll() { if (!state) return; renderHealth(state.health); renderStrip(state); renderModelsPanel(state); renderAttention(state); renderOverseer(state); renderCost(state); renderRigs(state); renderWork(state); renderTrend(state); renderNews(state); renderMachine(state); renderCloud(state); renderDeploys(state); renderHealthMark(state); renderForgejo(state); renderTierSweep(state); renderJev(state); renderMango(state); renderOM(state); paintFolds(state); }

const CLASSES = ["failure", "warning", "success", "landing", "dispatch", "restart", "plain"];
// The feed's class chips: every class but "plain" is on until the reader turns
// it off, and storage that throws leaves that default rather than taking the
// page down.
const defaultChips = () => CLASSES.filter(c => c !== "plain");
let shown = new Set(defaultChips());
try { shown = new Set(JSON.parse(localStorage.getItem("gt-chips") || "null") || defaultChips()); } catch (e) {}
const counts = {};
function renderChips() {
  const box = $("chips");
  box.replaceChildren();
  for (const c of CLASSES) {
    const b = el("button", "chip" + (shown.has(c) ? " on" : ""), c);
    b.title = "show or hide " + c + " lines";
    b.append(el("b", "", String(counts[c] || 0)));
    b.onclick = () => { shown.has(c) ? shown.delete(c) : shown.add(c); try { localStorage.setItem("gt-chips", JSON.stringify([...shown])); } catch (e) {} renderChips(); applyFilter(); };
    box.append(b);
  }
}
function rowFor(e) {
  const r = el("div", "row c-" + e.class);
  r.dataset.class = e.class;
  r.append(el("span", "t", clock(e.at)), el("span", "g", e.rig + (e.kind === "landings" ? " ⬇" : "")), el("span", "x", e.text));
  r.hidden = !shown.has(e.class);
  return r;
}
function applyFilter() { for (const r of $("feed").children) r.hidden = !shown.has(r.dataset.class); }
function pushEntry(e, stick) {
  const f = $("feed");
  const atBottom = f.scrollHeight - f.scrollTop - f.clientHeight < 40;
  f.append(rowFor(e));
  counts[e.class] = (counts[e.class] || 0) + 1;
  while (f.children.length > 800) { counts[f.firstChild.dataset.class]--; f.firstChild.remove(); }
  if (!pushEntry.t) pushEntry.t = setTimeout(() => { pushEntry.t = null; renderChips(); }, 1000);
  if (atBottom || stick) f.scrollTop = f.scrollHeight;
}

// The stream, kept alive by the page and not only by the browser. A browser
// retries a stream it closed itself, but not one the connection ended for good:
// WebKit reaches EventSource.CLOSED after a failed reconnect and never calls
// back. Nor does it notice a stream that stays open and sends nothing. Either
// way the tab keeps a stale page until a manual reload, so a failed stream is
// replaced on a backoff and a quiet one by a watchdog. (gt-rpble)
const RECONNECT_MS = 2000, RECONNECT_CAP_MS = 15000;
const WATCHDOG_MS = 10000, SILENT_MS = 90000;
let stream = null;        // the live stream, so a replacement can close it
let dropped = false;      // a stream that opens again after a drop is a new build
let reconnecting = false; // a replacement is waiting out its delay
let retryMs = 0;          // that delay, doubled per failed connect up to the cap
let lastEvent = 0;        // when the live stream last sent a named event

function connect() {
  const es = new EventSource("/stream");
  stream = es;
  reconnecting = false;
  lastEvent = Date.now();
  es.onopen = () => {
    // A connect that worked clears the backoff, and it clears it whatever the
    // page does next: the reload below ends this page, so a reset after it
    // would never run (gt-3q3go).
    retryMs = 0;
    // The server restarts in place when the gt binary is replaced; a stream
    // that comes back after dropping may be a new build, so take its page.
    if (dropped) { location.reload(); return; }
    $("conn").className = "on"; $("conn").textContent = "live";
  };
  es.onerror = () => {
    dropStream();
    // A stream the browser is still connecting comes back on its own; one it has
    // given up on is the page's to replace.
    if (es.readyState === EventSource.CLOSED) reconnectStream(es);
  };
  const seen = () => { lastEvent = Date.now(); };
  es.addEventListener("state", ev => { seen(); state = JSON.parse(ev.data); renderAll(); });
  es.addEventListener("backlog", ev => { seen(); $("feed").replaceChildren(); for (const k of Object.keys(counts)) delete counts[k]; JSON.parse(ev.data).forEach(e => pushEntry(e, true)); });
  es.addEventListener("entry", ev => { seen(); pushEntry(JSON.parse(ev.data)); });
  es.addEventListener("alert", ev => { seen(); onAlert(JSON.parse(ev.data)); });
}
// dropStream records that the page's stream is gone, whether the browser said so
// or the page found it out itself. The chip stops claiming the stream is live,
// and the stream that follows is taken as a new build's page: whatever comes
// back after a drop says nothing about the build this page is running (gt-3q3go).
function dropStream() {
  dropped = true;
  $("conn").className = "off"; $("conn").textContent = "reconnecting";
}
// reconnectStream makes the next stream itself, after a delay that doubles while
// connects keep failing. A stream that is no longer the live one was replaced
// already, so its error does not become a second reconnect.
function reconnectStream(failed) {
  if (reconnecting || failed !== stream) return;
  reconnecting = true;
  retryMs = retryMs ? Math.min(retryMs * 2, RECONNECT_CAP_MS) : RECONNECT_MS;
  setTimeout(connect, retryMs);
}
initAlerts();
// FOLD_KEY is where each section's fold is remembered: one map of the section's
// own key to true when it is closed, so a retitled panel keeps the operator's
// choice and every section folds the same way (gt-5de3i).
const FOLD_KEY = "gt-fold";
// FOLD_DEFAULT_OPEN is the sections a reader with no saved choice sees open;
// every other section starts closed. A pane that opts out with
// data-default-collapsed starts closed whatever this holds. This list is the
// operator's to edit.
const FOLD_DEFAULT_OPEN = ["attention", "overseer", "cost", "work", "landings"];
// FOLD_AGE_RE matches one part of a note that says only how long ago its pane
// was read — "read 51s ago", "seats read 3m ago". A note that is only ages
// tells a closed section nothing, which is what the summary line is for.
const FOLD_AGE_RE = /(^|\s)read\s+\S+\s+ago$/;
function foldNoteIsAge(text) {
  const parts = String(text || "").split(" · ").map(p => p.trim()).filter(Boolean);
  return parts.length > 0 && parts.every(p => FOLD_AGE_RE.test(p));
}
// FOLD_SUMMARY is what a closed section says about itself when its note is only
// a read age: the figures the operator would otherwise open it to read, taken
// from the same fields the panel and the top strip draw. A section with nothing
// to add there returns null and shows only its title.
const FOLD_SUMMARY = {
  // The top strip's two counts: polecats holding work with a live session, and
  // what is submitted and waiting for the landing worker.
  work: s => {
    const out = [];
    if (s && s.polecats) out.push(polecatsWorking(s.polecats) + " working");
    const q = s && s.summary ? s.summary.ready_to_land : null;
    if (q != null) out.push(q + " waiting to land");
    return out.length ? out.join(" · ") : null;
  },
  // The one attention list's split, exactly as the panel's own note counts it:
  // the rows that need a person, then the rows only waiting on work in flight.
  // With every owner chip off the panel says so, and the summary says it too.
  attention: s => {
    const at = s && s.attention;
    if (!at) return null;
    const shown = (at.rows || []).filter(ownerShown);
    if (!shown.length) return shownOwners.size ? "nothing needs you" : "every owner chip is off";
    const needs = shown.filter(needsYou).length, pipeline = shown.length - needs;
    return needs + " need you" + (pipeline ? " · " + pipeline + " in the pipeline" : "");
  },
  // The Cost panel's providers, one figure and status each, in the array's order.
  cost: s => costHeadline(s && s.cost_providers),
};
// foldStore is the saved choices, keyed as FOLD_KEY holds them. Storage that
// throws — a locked-down browser, private mode — reads as no choice at all, so
// the defaults apply and folding still works for the session.
function foldStore() {
  try { return JSON.parse(localStorage.getItem(FOLD_KEY) || "{}") || {}; } catch (e) { return {}; }
}
function foldSave(key, closed) {
  const saved = foldStore();
  saved[key] = !!closed;
  try { localStorage.setItem(FOLD_KEY, JSON.stringify(saved)); } catch (e) {}
}
// foldLegacyTitle is the name a section's choice was saved under before it had
// a key: the heading's first text run, or the whole heading where the first
// child is an element with no text of its own (the tier sweep's icon).
function foldLegacyTitle(head) {
  return String(((head.firstChild && head.firstChild.textContent) || head.textContent) || "").trim();
}
function foldLegacySaved(title) {
  try { return (JSON.parse(localStorage.getItem("gt-collapsed") || "{}") || {})[title]; } catch (e) { return undefined; }
}
// folds is every section the page made foldable, so a reading that arrives
// after the page loaded repaints each section's summary line without reopening
// it. A closed section keeps its body and its render function keeps drawing
// into it, so opening it shows what the page last knew with no extra fetch.
const folds = [];
function paintFolds(s) { for (const f of folds) f.paint(s); }
// foldable is what makes an element fold under its own heading, and the only
// fold the page's sections use: it owns the caret, aria-expanded, Enter and
// Space, the saved choice and the one line a closed section shows. Options:
//
//   key         the section's stable key, which its choice is saved under
//   head        the heading element that carries the caret and acts as a
//               button (default: the element's own first h2 child)
//   summary     a function of the last reading returning the summary line, or
//               null when the section has nothing to add there
//   defaultOpen whether a reader with no saved choice sees it open
//   legacy      the title its choice was saved under before keys existed, so
//               an entry written then still applies
//
// A section with no heading or no key is left unfolded rather than given a fold
// nothing can remember.
function foldable(root, opts) {
  const head = opts.head || root.querySelector(":scope > h2");
  const key = opts.key || root.dataset.fold;
  if (!head || !key) return null;
  // A section folds once: a second call hands back the fold it already has
  // rather than a second caret and a second click handler on the same header.
  const existing = folds.find(f => f.el === root);
  if (existing) return existing;
  // The note sits in the header already; while the section is closed its place
  // is taken by the summary, so the header says something worth reading
  // instead of how long ago the pane was drawn.
  const note = head.querySelector(".r");
  const caret = el("span", "caret");
  head.prepend(caret);
  const summary = el("span", "foldsum");
  head.append(summary);
  head.setAttribute("role", "button");
  head.tabIndex = 0;
  const saved = foldStore();
  const remembered = saved[key] !== undefined ? saved[key]
    : (opts.legacy ? foldLegacySaved(opts.legacy) : undefined);
  // A pane that opts out with data-default-collapsed starts closed whatever the
  // default list says, until the reader opens it.
  const defaultOpen = !!opts.defaultOpen && !root.hasAttribute("data-default-collapsed");
  const fold = {
    el: root,
    key: key,
    closed: remembered !== undefined ? !!remembered : !defaultOpen,
    summaryOf: opts.summary,
  };
  fold.paint = s => {
    const text = fold.closed ? foldSummaryLine(fold, s, note) : "";
    root.classList.toggle("collapsed", fold.closed);
    caret.textContent = fold.closed ? "▸" : "▾";
    head.setAttribute("aria-expanded", fold.closed ? "false" : "true");
    if (note) note.hidden = fold.closed;
    summary.textContent = text;
    summary.hidden = !fold.closed || !text;
  };
  const toggle = () => {
    fold.closed = !fold.closed;
    fold.paint(state);
    foldSave(key, fold.closed);
  };
  head.addEventListener("click", ev => {
    if (ev && ev.target && ev.target.closest && ev.target.closest("button, .chips, a")) return;
    toggle();
  });
  head.addEventListener("keydown", ev => {
    if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle(); }
  });
  folds.push(fold);
  fold.paint(state);
  return fold;
}
// foldSummaryLine is the one line a closed section shows: the note's own text
// when it says something a reader can use, and otherwise the summary its
// section supplies from the last reading.
function foldSummaryLine(fold, s, note) {
  const text = note ? String(note.textContent || "").trim() : "";
  if (text && !foldNoteIsAge(text)) return text;
  const own = fold.summaryOf ? fold.summaryOf(s || {}) : null;
  return own || "";
}
// setupCollapse makes every section of the page foldable, with the key its
// markup declares.
function setupCollapse() {
  document.querySelectorAll("main section, .grid section").forEach(sec => {
    const head = sec.querySelector(":scope > h2");
    if (!head) return;
    const key = sec.dataset.fold;
    foldable(sec, {
      key: key,
      head: head,
      summary: FOLD_SUMMARY[key],
      defaultOpen: FOLD_DEFAULT_OPEN.indexOf(key) >= 0,
      legacy: foldLegacyTitle(head),
    });
  });
}
setupCollapse();
// Painted only after setupCollapse has read each pane's heading: the icon is
// the tier title's first child, so a glyph already in it would become the
// pane's legacy fold name and drop a remembered one.
paintTierIcon(null);
// A running action's elapsed and a finished one's age drift between pushes, so
// each of those cells carries the stamp it counts from and one ticker a second
// moves them, without redrawing a pane the reader may be reading.
setInterval(() => {
  document.querySelectorAll("#forgejoacts [data-since]").forEach(c => { c.textContent = fmtDur(secsSince(c.dataset.since)); });
  document.querySelectorAll("#om [data-since]").forEach(c => { c.textContent = fmtDur(secsSince(c.dataset.since)); });
}, 1000);
// The activity feed folds under the Actions section, which stays visible, and
// the choice is remembered per viewer. Storage that throws — a locked-down
// browser, private mode — must not take the pane down: the feed then starts
// expanded and folding still works for the session.
let feedFolded = false, feedCount = null;
try { feedFolded = localStorage.getItem("gt-forgejo-feed") === "folded"; } catch (e) {}
function paintFeedHead() {
  const h = $("forgejofeedhead");
  h.replaceChildren(el("span", "caret", feedFolded ? "▸" : "▾"), el("span", "", feedFolded ? "activity · " + (feedCount == null ? 0 : feedCount) + " events" : "activity"));
  h.setAttribute("aria-expanded", feedFolded ? "false" : "true");
}
// foldFeed applies the remembered choice. The header rides the Actions section,
// which is the layout the fold belongs to: without one the feed is drawn as it
// was before the section existed, expanded and with no header to click.
function foldFeed(hasActions) {
  $("forgejofeedhead").hidden = !hasActions;
  $("forgejo").classList.toggle("folded", !!hasActions && feedFolded);
  paintFeedHead();
}
function toggleFeed() {
  feedFolded = !feedFolded;
  foldFeed(true);
  try { localStorage.setItem("gt-forgejo-feed", feedFolded ? "folded" : "open"); } catch (e) {}
}
$("forgejofeedhead").addEventListener("click", toggleFeed);
foldFeed(false); // no state has arrived yet, so there is no Actions section
$("models").addEventListener("click", toggleModels);
paintModelsLine();
renderChips();
connect();
// The watchdog is for a stream the browser has lost without saying so: a
// half-open connection never reaches CLOSED and never calls back, and an open
// one that sends nothing reports nothing. A named event is the only liveness the
// page can read — the server's keepalive is a comment, which is not an event —
// and the server publishes one on every poll, the fastest every 5 s
// (dashboard.HealthEvery). SILENT_MS without one is therefore the page's stream
// to drop rather than a server to wait for, and the margin is wide enough that
// only a stalled or restarted server reaches it; a server quiet that long costs
// the refresh that follows the drop, and the page holds the state it has until
// then (gt-rpble, gt-3q3go).
setInterval(() => {
  if (reconnecting) return; // a replacement is already on its way
  if (Date.now() - lastEvent < SILENT_MS) return;
  dropStream();
  stream.close();
  connect();
}, WATCHDOG_MS);
// Ages and elapsed times drift between pushes; redraw the cheap parts locally.
setInterval(() => { if (state) { renderStrip(state); renderWork(state); renderTierSweep(state); renderForgejo(state); renderNews(state); } }, 15000);
</script>
