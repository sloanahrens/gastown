// carried no interval, or only one bound, draws no bar: a range the writer did
// not measure is not drawn.
function mangoInterval(t) {
  const td = el("td", "mginterval");
  if (t.ci_low == null || t.ci_high == null || t.ci_high < t.ci_low) return td;
  const at = v => (v * 100).toFixed(1) + "%";
  const bar = el("div", "mgbar");
  bar.setAttribute("role", "img");
  bar.setAttribute("aria-label", (t.holdout_rate == null ? "no rate" : jevPct(t.holdout_rate)) + ", interval " + jevPct(t.ci_low) + " to " + jevPct(t.ci_high));
  bar.append(el("div", "mgtrack"));
  if (t.baseline != null) {
    const base = el("div", "mgbase"); base.style.left = at(t.baseline); bar.append(base);
  }
  const ci = el("div", "mgci"); ci.style.left = at(t.ci_low); ci.style.width = at(t.ci_high - t.ci_low); bar.append(ci);
  if (t.holdout_rate != null) {
    const dot = el("div", "mgdot"); dot.style.left = at(t.holdout_rate); bar.append(dot);
  }
  td.append(bar);
  return td;
}

// mangoEvidence draws the box's conditions so a reader can see what the box was
// built from: the ones that narrow the group as chips, the rest only in a closed
// fold, greyed and marked, where they cost no row space. A target from an older
// panel carries no conditions, so its best box stands in for them in the fold.
function mangoEvidence(t) {
  const td = el("td", "mgevidence");
  const conds = t.conditions || [];
  for (const c of conds) if (c.narrows) td.append(el("span", "jvchip mgcondchip", c.text + " " + jevPct(c.share) + " of landings"));
  const fold = el("details", "mgfold");
  fold.append(el("summary", "", "how it was found"));
  const list = el("div", "mgcondlist");
  for (const c of conds) {
    const row = el("div", "mgcond" + (c.narrows ? "" : " jvstale"));
    row.append(el("span", "mgcondtext", c.text), el("span", "mgcondshare", jevPct(c.share) + " of landings"));
    if (!c.narrows) row.append(el("span", "mgcondtag", "doesn't narrow"));
    list.append(row);
  }
  if (!conds.length) list.append(el("div", "mgbox", t.best_box || "-"));
  fold.append(list);
  td.append(fold);
  return td;
}

// mangoUnchecked draws a target the panel could not check as one line under the
// table. The reason is the line's whole use, so a word the page has no sentence
// for is still drawn as the panel's own word; a skipped target from an older
// panel carries no reason key, and too few positives is that writer's only skip.
function mangoUnchecked(t, stale) {
  const line = el("div", "mgnot" + (stale ? " jvstale" : ""));
  line.append(el("span", "jvchip jv-notyet", "not checkable"), el("span", "mgnotlabel", t.label || t.target), el("span", "mgnotpos", t.positives + (t.positives === 1 ? " positive" : " positives")));
  let why = "";
  if (t.reason === "few_positives") why = "too few positives to check";
  else if (t.reason === "no_holdout_positives") {
    why = "no positives in the recent landings to check it on";
    if (t.last_positive) why += ", its last positive was " + t.last_positive;
  } else if (t.reason) why = "a reason this page does not know: " + t.reason;
  else if (t.skipped) why = "too few positives to check";
  if (why) line.append(el("span", "mgnotwhy", why));
  return line;
}

// costBarChart draws one of the Cost panel's charts from its data, which the
// server builds (CostChart): one bar or gap per entry, a bar for each series the
// chart draws beside them on the same buckets, an optional limit line, and the
// aria-label that carries the numbers. The page only places what it is given; it
// decides no value, label or line of its own.
function costBarChart(box, c, kind, providers) {
  if (!c || !Array.isArray(c.bars) || !c.bars.length) return;
  const daily = kind === "daily";
  // A series is drawn only when it lines up bucket for bucket; a series the
  // server built on other buckets would put one day's dollars over another. A
  // series not drawn says so under the chart, like one the server left out: a
  // chart never goes quiet about why a provider's dollars are missing.
  // A drawn series' role is its place in the series array, so a series left out
  // does not hand the first series' gap tick and daily amount to the next one.
  const drawn = [], roles = [], notDrawn = [];
  costChartSeries(c).forEach((s, at) => {
    if (!s.why && Array.isArray(s.bars) && s.bars.length === c.bars.length) { drawn.push(s); roles.push(at); }
    else notDrawn.push({name: s.name || s.id, why: s.why || "the series does not line up with the chart's buckets: it has " + (Array.isArray(s.bars) ? s.bars.length : "no") + " where the chart has " + c.bars.length});
  });
  const n = drawn.length;
  const W = 700, H = daily ? 150 : 120, pad = 26, base = H - (daily ? 26 : 22);
  const top = Math.max(0.01, c.limit ? c.limit.value : 0, ...drawn.flatMap(s => s.bars.map(b => b.value || 0)));
  const y = v => base - (Math.max(0, v) / top) * (base - 16);
  const slot = (W - 2 * pad) / c.bars.length;
  // The drawn series share the wide part of the slot with a 2px gap between
  // bars: one series takes all of it, two take the halves the DeepSeek and
  // Claude pair always had.
  const wide = slot * (daily ? 0.56 : 0.6);
  const w = n ? (wide - 2 * (n - 1)) / n : wide;
  const svg = svgEl("svg", {viewBox: "0 0 " + W + " " + H, class: "dchart " + kind, role: "img", "aria-label": c.aria});
  if (n > 1) svg.append(costHatch(kind));
  svg.append(svgEl("line", {x1: pad, x2: W - pad, y1: base, y2: base, class: "axis"}));
  c.bars.forEach((b, i) => {
    const cx = pad + slot * i + slot / 2;
    drawn.forEach((s, k) => {
      costSeriesBucket(svg, s.bars[i], roles[k], cx - wide / 2 + k * (w + 2), w, base, y, kind, costChartColour(providers, s.id, k));
    });
    if (daily || i % 3 === 0) {
      const lbl = svgEl("text", {x: cx, y: H - (daily ? 8 : 6), class: "day", "text-anchor": "middle"});
      lbl.textContent = b.label;
      svg.append(lbl);
    }
  });
  // The limit is a dashed line only. Its words are a caption under the legend,
  // not text over the bars, which the bars would overprint (gt-p39fq).
  if (c.limit) svg.append(svgEl("line", {x1: pad, x2: W - pad, y1: y(c.limit.value), y2: y(c.limit.value), class: "limit"}));
  box.append(svg);
  // The legend names each series the chart draws, since the colour is the only
  // thing that tells them apart; a series' own name says in full what its
  // dollars are. The legend follows the providers array, so it lists only the
  // series drawn.
  const named = {};
  drawn.forEach(s => { named[s.id] = s.name || true; });
  const lg = costLegend(providers, named);
  if (lg) box.append(lg);
  if (c.limit) box.append(el("div", "title", "dashed line: " + c.limit.label));
  // A series not drawn says why on the panel, so an absent series is not read
  // as a week of no spend.
  for (const s of notDrawn) box.append(el("div", "title", s.name + " series not drawn: " + s.why));
}

// costChartSeries is the chart's series the page draws: the server's series
// array, or, for a server older than the array, the DeepSeek bars and the Claude
// series beside them in the same shape. The fallback goes with the array's
// fallback in a later bead.
function costChartSeries(c) {
  if (Array.isArray(c.series)) return c.series;
  const out = [{id: "deepseek", name: "", bars: c.bars}];
  if (c.claude) out.push({id: "claude", name: c.claude.name, bars: c.claude.bars});
  else if (c.claude_why) out.push({id: "claude", name: COST_SERIES_NAMES.claude, why: c.claude_why});
  return out;
}

// costChartColour is the colour a series' bars are drawn in, the one its legend
// swatch shows: the provider's place in the providers array, or, for a series
// with no provider there, its place among the drawn series.
function costChartColour(providers, id, k) {
  const at = (Array.isArray(providers) ? providers : []).findIndex(p => p && typeof p === "object" && p.id === id);
  return costSeriesColour(id, at >= 0 ? at : k);
}

// costSeriesBucket draws one bucket of a drawn series at x. role is the series'
// place in the series array. A value is a bar in the series' colour with its
// tooltip; a gap is a tick under the array's first series, as the DeepSeek bars
// always marked one, and a hatched column under the others, as the Claude series
// did. The first series also carries the daily amount above its bar. The class
// keeps the look of the second series; the fill is the legend swatch's colour, so
// a bar matches its swatch whichever series comes first.
function costSeriesBucket(svg, b, role, x, w, base, y, kind, colour) {
  if (b.gap) {
    if (role === 0) {
      const mid = x + w / 2;
      svg.append(svgEl("line", {x1: mid, x2: mid, y1: base - 3, y2: base, class: "gap"}));
    } else {
      const r = svgEl("rect", {x: x, y: 16, width: w, height: base - 16, class: "cgap", fill: "url(#dhatch-" + kind + ")"});
      const t = svgEl("title", {}); t.textContent = b.title;
      r.append(t);
      svg.append(r);
    }
    return;
  }
  const bar = svgEl("rect", {x: x, y: y(b.value), width: w, height: Math.max(0, base - y(b.value)), class: role === 1 ? "cbar" : "bar", style: "fill:" + colour});
  const t = svgEl("title", {}); t.textContent = b.title;
  bar.append(t);
  svg.append(bar);
  if (role === 0 && kind === "daily") {
    const amt = svgEl("text", {x: x + w / 2, y: y(b.value) - 4, class: "amt", "text-anchor": "middle"});
    amt.textContent = money(b.value);
    svg.append(amt);
  }
}

// costHatch is the pattern a series' bucket with no sample is filled with, from
// the second series on: the absence of a reading is marked, never drawn as a bar
// of zero, which would read as a quiet bucket.
function costHatch(kind) {
  const defs = svgEl("defs", {});
  const pat = svgEl("pattern", {id: "dhatch-" + kind, width: "4", height: "4", patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)"});
  pat.append(svgEl("line", {x1: "0", y1: "0", x2: "0", y2: "4", class: "hatch"}));
  defs.append(pat);
  return defs;
}

// COST_SERIES_COLOURS pins the DeepSeek and Claude series to the colours their
// bars have always been drawn in (blue and violet), so a legend swatch matches
// its bar, whatever order the providers come in. A bar takes this colour as its
// inline fill, not from its class. A provider with no pinned colour takes the
// palette by its place in the providers array.
const COST_SERIES_COLOURS = {deepseek: "var(--blue)", claude: "var(--violet)"};
const COST_PALETTE = ["var(--amber)", "var(--green)", "var(--red)"];
const COST_SERIES_NAMES = {deepseek: "DeepSeek", claude: "Claude"};
function costSeriesColour(id, i) {
  return COST_SERIES_COLOURS[id] || COST_PALETTE[i % COST_PALETTE.length];
}
// costLegend lists the series a chart draws, one entry per provider that has
// one, in the providers' order. drawn maps a provider's id to the name its
// series carries: true takes the provider's own label, a string is the series'
// own name. A provider with no series in the chart has no entry, and no entry
// means no legend at all. A series whose provider is not in the array (the
// array is missing) is still named, so the legend does not vanish with the list.
function costLegend(providers, drawn) {
  const items = [];
  const named = new Set();
  (Array.isArray(providers) ? providers : []).forEach((p, i) => {
    if (!p || typeof p !== "object" || !drawn[p.id]) return;
    named.add(p.id);
    const name = typeof drawn[p.id] === "string" ? drawn[p.id] : p.label || p.id;
    items.push([costSeriesColour(p.id, i), name]);
  });
  for (const id of Object.keys(drawn)) {
    if (!drawn[id] || named.has(id)) continue;
    const name = typeof drawn[id] === "string" ? drawn[id] : COST_SERIES_NAMES[id] || id;
    items.push([costSeriesColour(id, items.length), name]);
  }
  return items.length ? legend(items) : null;
}
// costChartFolds keeps each chart's fold by its key. A fold is a section of its
// own that foldable folds like every other section, and it is built once: the
// fold keeps one entry per section, so a redraw that built a new section would
// stack a second fold on the same key.
const costChartFolds = {};
// costChartFold draws a Cost chart into box as a fold under its own heading. The
// daily chart starts open and the hourly one closed, unless the reader has
// chosen otherwise. A chart the server did not build leaves no fold at all.
function costChartFold(box, kind, chart, providers) {
  if (!chart || !Array.isArray(chart.bars) || !chart.bars.length) return;
  const key = "cost." + kind;
  let f = costChartFolds[key];
  if (!f) {
    const sec = el("section");
    sec.dataset.fold = key;
    const body = el("div", "body");
    sec.append(el("h2", "", kind === "daily" ? "Daily spend" : "Hourly spend"), body);
    foldable(sec, {key: key, defaultOpen: kind === "daily"});
    f = costChartFolds[key] = {sec: sec, body: body};
  }
  f.body.replaceChildren();
  costBarChart(f.body, chart, kind, providers);
  box.append(f.sec);
}

// costHeaderParts is the Cost panel's collapsed header, the three things the
// operator watches while he looks at the rest of the page: DeepSeek's balance
// and its hourly spend, the Claude week's percent and its hourly spend, and the
// age of the spend read. Every figure is a provider row's own value, and the
// hourly one is the table's Last 1h column, so the header and the table cannot
// disagree. A figure the row cannot give is drawn as "?", never left out and
// never drawn as a zero. A provider the list does not name is not configured,
// so it has no part; a list that did not arrive leaves both figures unknown. A
// stale or failed read colours its parts and says so in the age part, since grey
// figures alone must not pass as live ones.
function costHeaderParts(s, d, r) {
  const list = Array.isArray(s.cost_providers) ? s.cost_providers.filter(p => p && typeof p === "object") : null;
  const row = id => list ? list.find(p => p.id === id) : null;
  const deep = row("deepseek"), claude = row("claude");
  const readCls = costReadClass(r);
  const hourly = p => { const v = costNum(p && p.per_hour_1h); return v == null ? "?" : money(v) + "/h"; };
  const parts = [];
  if (!list || deep) {
    const bal = costNum(deep && deep.balance);
    parts.push({
      text: "DeepSeek " + (bal == null ? "?" : money(bal)) + " · " + hourly(deep),
      cls: readCls || COST_STATUS_CLASS[deep && deep.status] || "",
      title: (deep && (deep.why || deep.status_text)) || "",
    });
  }
  if (!list || claude) {
    const pct = costNum(claude && claude.plan_pct);
    parts.push({
      text: "Claude " + (pct == null ? "?" : Math.round(pct) + "% (wk)") + " · " + hourly(claude),
      cls: readCls || COST_STATUS_CLASS[claude && claude.status] || "",
      // The limit's status is the row's text, shown on hover and never parsed.
      title: (claude && (claude.why || claude.status_text)) || "",
    });
  }
  const ago = readAgeWords(r) || "read ?";
  if (r && r.stale && r.error) parts.push({text: ago + " · read failed" + (deep && deep.why ? ": " + deep.why : ""), cls: "badc"});
  else if (!d) parts.push({text: "no spend read", cls: "warnc"});
  else if (r && r.stale) parts.push({text: ago + " · stale", cls: "warnc"});
  else parts.push({text: ago});
  return parts;
}

// costNum reads a figure the server sent, or null when there is none to read.
const costNum = v => v == null || isNaN(Number(v)) ? null : Number(v);
// costReadClass is the colour of a spend read that is not current, the same
// rule paintsRead gives a pane's caption: red for a read that failed, amber for
// one gone old, and none for a live reading.
function costReadClass(r) { return r && r.stale ? (r.error ? "badc" : "warnc") : ""; }

// paintCostHeader writes the header parts into note, one span each so a part
// wears its own status colour. The three groups are set apart by a run of
// non-breaking spaces, since each group's own figures are joined by " · ".
function paintCostHeader(note, parts) {
  note.replaceChildren();
  parts.forEach((p, i) => {
    if (i) note.append(document.createTextNode("\u00a0\u00a0\u00a0"));
    const span = el("span", p.cls || "", p.text);
    if (p.title) span.title = p.title;
    note.append(span);
  });
}

// costSummary is the expanded panel's line above the table, where the figures
// the collapsed header no longer carries go, so the information moves rather
// than goes. Today's total names cash and the plan's estimate apart; the
// DeepSeek estimate and the beads over twenty minutes come from the usage scan;
// the ledger time says how old the spend ledger is. An unreadable usage scan
// says so, and the over-twenty count is a badge only when there is one to count.
function costSummary(box, s, d, u) {
  const rows = (Array.isArray(s.cost_providers) ? s.cost_providers : []).filter(p => p && typeof p === "object" && !p.why);
  let cash = null, planEst = null;
  for (const p of rows) {
    const v = costNum(p.today);
    if (v == null) continue;
    if (p.kind === "plan") planEst = (planEst || 0) + v;
    else cash = (cash || 0) + v;
  }
  const parts = [];
  if (cash != null || planEst != null) {
    // Cash spend and the Claude plan's estimate of today's tokens are different
    // money, so the total names each rather than adding them under one word.
    const bits = [];
    if (cash != null) bits.push(money(cash) + " cash");
    if (planEst != null) bits.push(money(planEst) + " plan est.");
    parts.push(el("span", "", "today " + bits.join(" · ")));
  }
  if (u && u.unavailable) parts.push(el("span", "badc", "usage unreadable"));
  else if (u && Array.isArray(u.by_class_model)) {
    const est = u.by_class_model.filter(r => isDeepSeek(r.model)).reduce((sum, r) => sum + (costNum(r.est_cost_usd) || 0), 0);
    const e = el("span", "", "DeepSeek est. " + money(est));
    e.title = "DeepSeek spend estimated from the usage records over the last " + (u.window || "24h");
    parts.push(e);
  }
  const over = u && !u.unavailable ? (u.over20 || []).length : 0;
  if (over > 0) {
    const b = el("span", "badge warnc", over + (over === 1 ? " bead" : " beads") + " over 20m");
    b.title = "beads that ran over twenty minutes in the last 48 hours";
    parts.push(b);
  }
  if (d && d.last_sample) parts.push(el("span", "", "ledger " + d.last_sample.replace("T", " ")));
  if (!parts.length) return;
  const line = el("div", "title");
  parts.forEach((p, i) => { if (i) line.append(document.createTextNode(" · ")); line.append(p); });
  box.append(line);
}

// renderCost draws the Cost panel. The table draws even without a spend report,
// since its rows come from the other readers too. It sits outside the part a
// stale spend read greys, so only the DeepSeek row, whose money that read feeds,
// greys inside the table; the Claude and Jev rows stay clear. The summary line
// and the GCP budget line go above and under the table, and the charts stay in
// the greyed part.
function renderCost(s) {
  if (pushSkip("cost", s)) return;
  const box = $("cost"), note = $("costnote");
  box.replaceChildren();
  // The header starts every render with no status class: the colour is whatever
  // this render's read earns, so a stale or failed read of the last render
  // cannot outlast it.
  note.className = "r";
  const d = s.spend, u = s.usage, r = readOf(s, "spend");
  // The header is the collapsed line: DeepSeek's balance and hourly spend, the
  // Claude week and its hourly spend, and the read's age. The ledger time goes
  // in its tooltip, and the rest is in the expanded panel below.
  paintCostHeader(note, costHeaderParts(s, d, r));
  note.title = d && d.last_sample ? "ledger " + d.last_sample.replace("T", " ") : "";
  costSummary(box, s, d, u);
  costProviders(box, s.cost_providers, !!(r && r.stale));
  costGCP(box, s.cloud);
  const spendBox = el("div", "spendpart");
  box.append(spendBox);
  // paintsRead colours the header from the same read the figures are read from.
  paintsRead(spendBox, note, r);
  // A usage scan that has not answered yet is reading, not missing.
  // A spend tool or ledger that is absent where the dashboard runs is drawn as
  // its reason, in place of the body; a read that failed is still a failed read.
  if (!d && s.spend_reason) spendBox.append(el("div", "empty", s.spend_reason));
  else if (!d) spendBox.append(el("div", "empty", (r ? "unavailable — the spend read failed" : "no spend report") + (u ? "" : "; usage still reading…")));
  if (!d && !u) return;
  const charts = s.cost_charts || {};
  costChartFold(spendBox, "daily", charts.daily, s.cost_providers);
  if (s.spend_hours_reason) spendBox.append(el("div", "empty", s.spend_hours_reason));
  else costChartFold(spendBox, "hourly", charts.hourly, s.cost_providers);
  costUsage(box, u, s);
  costJevFold(box, s);
}

// An escalation's severity is why a row is where it is, so the panel colours
// every one of the four and no two share a colour.
const SEV_CLASS = {critical: "sev-critical", high: "sev-high", medium: "sev-medium", low: "sev-low"};

// Alerts. The server decides what needs attention and pushes each new one as an
// "alert" event. Every one lands in the EVENTS panel, the history the operator
// opens when they want it. The alerts switch controls what reaches past the page
// (a title marker, and a browser notification when the browser allows it), and
// only while the operator has alerts on. What is waiting rather than merely
// noticed is the Attention panel's.
const BASE_TITLE = document.title;
let alertsOn = false;
try { alertsOn = localStorage.getItem("gt-alerts") === "on"; } catch (e) { alertsOn = false; }
let unreadAlerts = 0;

function syncAlertCtl() {
  const b = $("alertsctl");
  b.className = alertsOn ? "on" : "";
  b.textContent = "alerts: " + (alertsOn ? "on" : "off");
  b.title = alertsOn
    ? "alerts are on: a title marker and a browser notification while the tab is in the background"
    : "turn alerts on: a title marker and a browser notification while the tab is in the background";
}

function markTitle() {
  document.title = alertsOn && unreadAlerts > 0 && !document.hasFocus() ? "(!) " + BASE_TITLE : BASE_TITLE;
}

// EVENTS is the alerts' history: every alert the page has been told of, newest
// first, the last EVENTS_KEPT. Nothing overlays the page and nothing needs
// dismissing. An alert reaches the page on the stream and again in the state's
// recent list, so the feed keeps each id once. While the panel is shut its header
// counts what is unread; opening the panel reads it.
const EVENTS_KEPT = 100;
const eventIDs = new Set();
let eventLines = [];      // newest first
let eventsUnread = 0;
let eventsPrimed = false; // the first reading is a baseline: what was raised before the page opened is read

function eventsOpen() { const s = $("eventssec"); return !!s && !s.classList.contains("collapsed"); }
// takeEvent adds one alert to the feed unless it is there already, and reports
// whether it did. fresh says whether it is news: an alert off the stream always
// is, and a reading's alerts are once the baseline has been taken. The alert goes
// to the place its time says (placeEvent).
function takeEvent(a, fresh) {
  if (!noteEvent(a, fresh)) return false;
  placeEvent(eventLines, a);
  keepEvents();
  return true;
}
// noteEvent records an alert the feed has not held before, counts it as news when
// fresh says so, and reports whether it was new. Its id stays until it leaves the
// feed.
function noteEvent(a, fresh) {
  if (!a || eventIDs.has(a.id)) return false;
  eventIDs.add(a.id);
  if (fresh && !eventsOpen()) eventsUnread++;
  return true;
}
// alertNewerThan is the hub's EVENTS order (alertNewer in alerts.go): an alert with
// a time comes before one without, and of two timed alerts the newer comes first.
// Neither comes before the other on a tie.
function alertNewerThan(a, b) {
  const ta = a.at ? new Date(a.at).getTime() : NaN;
  const tb = b.at ? new Date(b.at).getTime() : NaN;
  if (!isFinite(ta) || !isFinite(tb)) return isFinite(ta) && !isFinite(tb);
  return ta > tb;
}
// placeEvent puts a into the list above the first row it is not older than, so it
// lands among the rows of its time, and on a tie it goes above them.
function placeEvent(list, a) {
  let i = 0;
  while (i < list.length && alertNewerThan(list[i], a)) i++;
  list.splice(i, 0, a);
}
// keepEvents drops the rows past EVENTS_KEPT off the bottom, and their ids with
// them. The bottom is the oldest by time, and the state's recent list holds fewer
// alerts than the feed keeps, so a row dropped here is one the state has moved on
// from.
function keepEvents() {
  while (eventLines.length > EVENTS_KEPT) eventIDs.delete(eventLines.pop().id);
}
function eventRow(a) {
  const r = el("div", "evrow " + (a.level || "info"));
  r.append(el("span", "t", clock(a.at)), el("span", "k", a.title || "alert"), el("span", "b", a.bead || ""), el("span", "x", a.text || ""));
  return r;
}
// EVENT_STATS_WINDOW_MS is the window the header's stats count: the last hour,
// measured from the clock each time the header is painted, with no timer of its
// own. The stats come from the alerts the feed already holds.
const EVENT_STATS_WINDOW_MS = 3600e3;
// EVENT_LEVELS is the levels the header counts, in the page's severity order,
// each drawn in the colour the feed's rows carry for it.
const EVENT_LEVELS = ["info", "warn", "crit"];
// eventStats is the feed's last hour: how many events of each level arrived in
// the window ending at now — an event exactly an hour old is still inside it —
// and how long ago the newest event arrived (ageSec, null while the feed holds
// none or its first row has no readable time). The feed is in the order the hub
// serves it, newest first, so the newest event is its first row. An event with no
// readable time is left out of the counts, and a level the page has no colour for
// counts as info, the level the feed draws a row without one in.
function eventStats(lines, now) {
  const counts = {};
  for (const lvl of EVENT_LEVELS) counts[lvl] = 0;
  const since = now - EVENT_STATS_WINDOW_MS;
  for (const a of lines || []) {
    if (!a || !a.at) continue;
    const t = new Date(a.at).getTime();
    if (!isFinite(t) || t < since) continue;
    counts[EVENT_LEVELS.indexOf(a.level) < 0 ? "info" : a.level]++;
  }
  const first = lines && lines.length && lines[0] && lines[0].at ? new Date(lines[0].at).getTime() : NaN;
  const newest = isFinite(first) ? first : null;
  // A clock that runs behind the hub dates its newest alert ahead of now; an age
  // before now is no age at all, so it reads as just arrived.
  return {counts: counts, ageSec: newest === null ? null : Math.max(0, Math.round((now - newest) / 1000))};
}
// paintEventStats draws the header's stats as chips beside the unread count. They
// ride the heading rather than the body, so a shut panel — how the panel starts —
// still says how busy and how bad the hour has been; a feed with nothing to count
// draws none (gt-y3fau).
function paintEventStats(now) {
  const chips = [];
  const st = eventStats(eventLines, now);
  for (const lvl of EVENT_LEVELS) {
    if (st.counts[lvl]) chips.push(el("span", "echip " + lvl, st.counts[lvl] + " " + lvl));
  }
  if (st.ageSec != null) chips.push(el("span", "echip", "newest " + fmtDur(st.ageSec) + " ago"));
  $("eventschips").replaceChildren(...chips);
}
// paintEvents draws the feed, its header count and the header's stats. The count
// sits in the header's note, which the fold hides while the panel is shut and
// shows as its summary; the stats sit beside it in the heading, which stays.
function paintEvents() {
  const box = $("events");
  box.replaceChildren(...eventLines.map(eventRow));
  if (!eventLines.length) box.append(el("div", "empty", "no events yet"));
  $("eventsnote").textContent = eventsUnread ? eventsUnread + " unread" : "";
  paintEventStats(Date.now());
  paintFolds(state);
}
// renderEvents draws the state's recent alerts in the order the hub serves them,
// newest first, and keeps that order. A row the stream brought that the list does
// not carry goes among them at the place its time says. The state repeats alerts
// the stream has already delivered; each id is taken once.
function renderEvents(s) {
  if (pushSkip("events", s)) return;
  const served = ((s && s.alerts) || []).filter(a => a);
  const ids = new Set(served.map(a => a.id));
  const streamOnly = eventLines.filter(a => !ids.has(a.id));
  served.forEach(a => noteEvent(a, eventsPrimed));
  eventLines = served.slice();
  streamOnly.forEach(a => placeEvent(eventLines, a));
  keepEvents();
  eventsPrimed = true;
  paintEvents();
}
// eventsRead is the operator opening the panel: what it held is read.
function eventsRead() { eventsUnread = 0; paintEvents(); }

function notify(a) {
  if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
  try { new Notification(a.title || "Gas Town", {body: a.text || ""}); } catch (e) {}
}

function onAlert(a) {
  if (takeEvent(a, true)) paintEvents();
  if (!alertsOn) return;
  notify(a);
  if (!document.hasFocus()) { unreadAlerts++; markTitle(); }
}

function initAlerts() {
  syncAlertCtl();
  $("alertsctl").onclick = () => {
    alertsOn = !alertsOn;
    try { localStorage.setItem("gt-alerts", alertsOn ? "on" : "off"); } catch (e) {}
    syncAlertCtl();
    if (alertsOn) {
      unreadAlerts = 0;
      markTitle();
      if (typeof Notification !== "undefined" && Notification.permission === "default") {
        try { const p = Notification.requestPermission(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
      }
    }
  };
  window.addEventListener("focus", () => { unreadAlerts = 0; markTitle(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { unreadAlerts = 0; markTitle(); } });
}

let qTab = "ready";
// The queue opens the way the operator uses it: every store, dispatchable
// beads only (gt-x9gk4, reversing gt-fi93j). Not persisted, so a reload always
// returns to this view rather than to a filter left on another store.
const DEFAULT_QRIG = "all";
const DEFAULT_QSHAPE = "ok";
// The Blocked tab hides wisp rows unless the chip is on (gt-q6ed5): a retired
// patrol or an old polecat run leaves dead step beads behind, and they outnumber
// the real blocked work. The server decides which rows those are (QueueBead.Wisp),
// the same verdict the Work panel's blocked line counts.
const DEFAULT_QWISP = false;
let qRig = DEFAULT_QRIG;
let qShape = DEFAULT_QSHAPE;
let qWisp = DEFAULT_QWISP;
const qOpen = new Set();
const qDetail = {};
let pKey = "", bKey = "";
const QTABS = [["ready", "Ready to build", "ready_total", "ready"], ["landing", "Waiting to land", "landing_total", "landing"], ["blocked", "Blocked", "blocked_total", "blocked"]];
const isWisp = b => !!b.wisp;

// beadDetailFor fetches one bead's text into store under "rig/id" and calls
// done when it lands. The Work panel's rows and the Report pane's ids open a
// bead through here, so both read the one route and draw the one detail. An
// entry is {loading}, the detail, or {error}; a bead already in the store is
// never fetched twice, and a failed read is remembered as the failure it was.
function beadDetailFor(rig, id, store, done) {
  const key = rig + "/" + id;
  if (store[key]) return;
  store[key] = {loading: true};
  fetch("/api/bead?rig=" + encodeURIComponent(rig) + "&id=" + encodeURIComponent(id))
    .then(r => r.ok ? r.json() : Promise.reject(new Error(String(r.status))))
    .then(d => { store[key] = d; done(); })
    .catch(() => { store[key] = {error: true}; done(); });
}

function openBead(b) {
  const id = b.rig + "/" + b.id;
  if (qOpen.has(id)) { qOpen.delete(id); renderBeads(state, true); return; }
  qOpen.add(id);
  beadDetailFor(b.rig, b.id, qDetail, () => renderBeads(state, true));
  renderBeads(state, true);
}

function detailBlock(d) {
  const box = el("div", "qdetail");
  if (d.loading) { box.append(el("div", "empty", "loading…")); return box; }
  if (d.error) { box.append(el("div", "badc", "could not read this bead right now")); return box; }
  const meta = [d.status, d.assignee ? "assigned " + d.assignee : "unassigned", d.created_at ? "created " + age(d.created_at) + " ago" : null, d.updated_at ? "updated " + age(d.updated_at) + " ago" : null].filter(Boolean).join(" · ");
  box.append(el("div", "title", meta));
  if ((d.labels || []).length) { const l = el("div"); d.labels.forEach(x => l.append(el("span", "tag", x))); box.append(l); }
  if ((d.blocked_by || []).length) box.append(el("div", "warnc", "blocked by " + d.blocked_by.join(", ")));
  const sec = (name, text) => { if (!text) return; box.append(el("h4", "", name), el("pre", "", text)); };
  sec("Description", d.description);
  sec("Acceptance", d.acceptance);
  sec("Design", d.design);
  sec("Notes", d.notes);
  if ((d.comments || []).length) {
    box.append(el("h4", "", "Comments"));
    d.comments.forEach(c => { const x = el("div", "qcomment"); x.append(el("div", "title", (c.author || "?") + (c.at ? " · " + age(c.at) + " ago" : "")), el("div", "", c.text)); box.append(x); });
  }
  if (d.truncated) box.append(el("div", "empty", "some text was cut to keep this small; bd show " + d.id + " has all of it"));
  return box;
}

// SKIP_ID is a store-issued bead id and the ": " the dispatcher writes after
// it: a lowercase prefix, then one or more hyphen-separated segments (a wisp's
// id has several, "hq-wisp-dvrty"), then any dotted child ids ("gt-tpg0p.46").
const SKIP_ID = /^[a-z][a-z0-9]*(?:-[a-z0-9]+)+(?:\.[a-z0-9]+)*: /;

// skipWhy is a tick's skip reason without the "<bead id>: " the dispatcher
// writes in front of it ("gt-vesnm: no seat: over the town total"). Only a
// bead-id shape is cut: "held: ..." and "unshaped: ..." are reasons, not ids
// (gt-fvtw7).
function skipWhy(reason) {
  return String(reason || "").replace(SKIP_ID, "");
}

// skipClass says what a tick's skip reason means to the operator (gt-qt0ym):
// "waiting for a seat" when the reason begins "no seat" once the bead id is cut
// (the bead is fine and every seat is taken or capped), "skipped" for any other
// reason, an empty one included, which stays warning-coloured so a real defect
// is not hidden.
function skipClass(reason) {
  return /^no seat/.test(skipWhy(reason)) ? "waiting for a seat" : "skipped";
}

// TOWN_STORE is the town's own store. The spec dispatcher reads one store per
// rig, so a bead here is never dispatched however well it is shaped, and the
// ready view lists it under its own chip rather than as ready to dispatch
// (gt-50dkq). "hq" is the store's name in the queue reader itself
// (QueueBead.Rig in queue.go), and the reading carries no field naming which
// store is the town's: this is that one name, in one place, for the page.
const TOWN_STORE = "hq";
const isTownStore = b => b.rig === TOWN_STORE;

// isReadyToDispatch is the one "ready to dispatch" set: the beads the dispatcher
// would slot plus those its last tick passed over (gt-qt0ym).
function isReadyToDispatch(b) { return b.shape === "ok" || b.shape === "skipped"; }

// READY_PIECES is the partition of the ready list the Beads header and its
// chips both draw (gt-xwul0): every ready bead is in exactly one piece, and
// the pieces add up to the ready rows this read carried. The order is the order
// both draw. "now", "seat" and "guard" split the "ready to dispatch" union by
// what the dispatcher's last tick decided; the town store's beads are never
// dispatched, so they keep a piece of their own (gt-50dkq). The header's ready
// total is the server's own count, exact even when it capped the rows.
const READY_PIECES = [
  {key: "now", label: "start now", chip: "start now", tip: "ready beads the spec dispatcher would slot on its next tick: shaped, unassigned and in a rig that is not parked"},
  {key: "seat", label: "waiting for a seat", chip: "waiting for a seat", tip: "ready beads the dispatcher's last tick passed over only because every seat is taken or capped; they go in priority order as seats free up"},
  {key: "guard", label: "skipped by a guard", chip: "skipped by a guard", tip: "ready beads the dispatcher's last tick passed over for another reason: a hold, a startup backoff or a per-tick limit"},
  {key: "fix", label: "need shaping", chip: "needs shaping", tip: "ready beads the dispatcher will not take as they stand: a required field is missing, it needs shaping or planning, it is not a work bead, or its rig is parked"},
  {key: "held", label: "held", chip: "held", tip: "ready beads an assignee holds: the spec dispatcher takes only unassigned beads"},
  {key: "town", label: "town store", chip: "town store", tip: "the town's own store (hq): the spec dispatcher reads each rig's store, never this one, so these beads are never dispatched"},
];

// readyPiece names the one piece of the ready list a bead belongs to. The
// header counts these pieces, the chips filter by them and the row filter
// reads them, so the three cannot say different things (gt-xwul0). A shape the
// dispatcher will not take and nobody holds (an epic, a bead for the planner,
// a parked rig's bead) is the need-shaping piece: the page has no other.
function readyPiece(b) {
  if (isTownStore(b)) return "town";
  if (b.shape === "ok") return "now";
  if (b.shape === "skipped") return skipClass(b.skip_reason || b.shape_note) === "waiting for a seat" ? "seat" : "guard";
  if (b.shape === "held") return "held";
  return "fix";
}

// readyShown is whether a ready row passes the shape filter the chips set:
// "all" is no filter, "ok" is the dispatcher's union (shaped and skipped) that
// the "ready to dispatch" chip sets, and every other value is one READY_PIECES
// key — the piece chip that set it.
function readyShown(b, shape) {
  if (shape === "all") return true;
  if (shape === "ok") return isReadyToDispatch(b);
  return readyPiece(b) === shape;
}

// seatPlaces maps each bead waiting for a seat to its place "N of M" in the
// dispatch order: priority, then oldest created_at, then id, the order
// specdispatch.Order uses. It is counted over every store in the ready list,
// since the seats are the town's; a list the server capped counts only the rows
// it sent, and then the places read "N of M+" (capped): the page cannot know
// the true count, and a wrong "of M" is worse than none.
function seatPlaces(all, capped) {
  const waiting = all.filter(b => b.shape === "skipped" && skipClass(b.skip_reason || b.shape_note) === "waiting for a seat");
  const t = b => { const n = Date.parse(b.created_at); return Number.isFinite(n) ? n : Infinity; };
  // A missing or non-numeric priority sorts last, like an unparseable time.
  const pri = b => (b.priority != null && Number.isFinite(Number(b.priority))) ? Number(b.priority) : 99;
  waiting.sort((a, b) => pri(a) - pri(b) || (t(a) === t(b) ? 0 : t(a) < t(b) ? -1 : 1) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  const places = {};
  waiting.forEach((b, i) => { places[b.rig + "/" + b.id] = (i + 1) + " of " + waiting.length + (capped ? "+" : ""); });
  return places;
}

// queueSkipLine is the dim line a ready row wears when the dispatcher's last
// tick passed it over (gt-e2cif): the class the tick filed it under, how long
// that verdict has stood — the time in the viewer's own clock, the tick count —
// and the tick's own reason. A row the ledger does not hold gets null and no
// line. The reason is another agent's text, so it is folded into a string that
// el() writes with textContent: nothing in it is markup.
function queueSkipLine(b) {
  if (!b.skip_class && !b.skip_reason) return null;
  const since = b.skipped_since ? "since " + clock(b.skipped_since) : "";
  const ticks = b.skip_ticks ? "for " + b.skip_ticks + (b.skip_ticks === 1 ? " tick" : " ticks") : "";
  const when = [since, ticks].filter(Boolean).join(" ");
  const what = (b.skip_class || "skipped") + (when ? " " + when : "");
  return b.skip_reason ? what + ": " + b.skip_reason : what;
}

// drawQueueList draws the whole queue into box: the tabs, the store and shape
// chips, and the rows that open a bead's text. It draws nothing without a queue.
function drawQueueList(box, s) {
  const q = s.queue;
  if (!q) return;
  const unshaped = {};
  ((s.dispatch && s.dispatch.named) || []).forEach(n => { if (n.bead && /^unshaped/.test(n.reason)) unshaped[n.bead] = n.reason; });
  if ((q.unreadable || []).length) box.append(el("div", "badc", "⚠ could not read: " + q.unreadable.join(", ") + " (its beads are missing below)"));
  const tabs = el("div", "qtabs");
  QTABS.forEach(([k, label, totalKey]) => {
    const b = el("button", "chip" + (qTab === k ? " on" : ""), label);
    b.append(el("b", "", String(q[totalKey] || 0)));
    b.onclick = () => { qTab = k; renderBeads(state, true); };
    tabs.append(b);
  });
  box.append(tabs);
  const caption = {ready: "Open beads with nothing blocking them. Only the green “ready” ones are taken by the spec dispatcher: shaped, unassigned, not an epic, and in a rig that is not parked. Beads held by an assignee wait for that person; beads in parked rigs wait until the rig is re-enabled. Beads in the town store are never taken: the dispatcher reads each rig's store only, so they wait under their own chip.",
    landing: "Submitted by a polecat or crew and waiting for the landing worker.",
    blocked: "Open beads waiting on another bead to close. Wisp steps left by retired patrols and old polecat runs are hidden by default; the wisps chip shows them."}[qTab];
  // The help paragraph takes the place of rows the operator reads, so it folds
  // behind a one-word disclosure beside the tabs (gt-mxn86). openQueueHelp
  // holds the open state, so the redraw that rebuilds this list every poll
  // leaves the help as the operator set it. The caption keeps a class of its
  // own: "empty" also marks the placeholder inside the scrolling rows, so a
  // test looking for it cannot tell a queue list with a caption from one
  // without.
  const help = document.createElement("details");
  help.className = "qhint";
  help.open = openQueueHelp;
  help.ontoggle = () => { openQueueHelp = help.open; };
  help.append(el("summary", "title", "help"));
  help.append(el("div", "qcaption", caption));
  box.append(help);
  const [, , totalKey, listKey] = QTABS.find(t => t[0] === qTab);
  const all = q[listKey] || [];
  // A ledger the page cannot call current backs no skip at all: the note under
  // the chips says why, and no chip, tag or row line says a bead is one
  // (gt-e2cif).
  const stale = !!q.verdicts_stale;
  // filters: which store, (for the ready list) whether the dispatcher would
  // slot it, and (for the blocked list) whether wisps are shown
  const rigs = Object.assign({}, q[listKey + "_rigs"] || {});
  if (!Object.keys(rigs).length) all.forEach(b => rigs[b.rig] = (rigs[b.rig] || 0) + 1);
  const rigNames = Object.keys(rigs).sort((a, b) => rigs[b] - rigs[a]);
  if (qRig !== "all" && !rigs[qRig]) qRig = "all";
  // The town store's piece chip is drawn in the all-stores view alone, since a
  // single rig's view cannot hold it. A rig switch leaves its filter behind,
  // and it passes no row there, so the list would strand empty with no chip to
  // clear it: clear the filter with the view that drew it (gt-xwul0).
  if (qRig !== "all" && qShape === "town") qShape = "all";
  // The ready tab's all-stores view is the dispatcher's own set, and the town's
  // store is not in it: its beads are listed under their own chip instead. The
  // landing and blocked views list it like any store (gt-50dkq).
  const inStore = b => qRig === "all" ? qTab !== "ready" || !isTownStore(b) : b.rig === qRig;
  // listTotal is the count the all-stores view of this tab can draw: the
  // server's total for the list, less the town store's beads on the ready tab,
  // which that view leaves to the town's own chip. The per-store counts are
  // exact even when the server capped the rows, so the town's share comes off
  // the total the server sent rather than out of the rows (gt-50dkq). Both are
  // counted in one pass over the list, so the town's share never exceeds it; a
  // reading that carries no total counts the rows in that view instead.
  const townTotal = qTab === "ready" ? (rigs[TOWN_STORE] || 0) : 0;
  const listTotal = typeof q[totalKey] === "number" && Number.isFinite(q[totalKey]) ? q[totalKey] - townTotal : all.filter(b => qTab !== "ready" || !isTownStore(b)).length;
  // On the ready tab the town store gets a chip of its own even when it is the
  // only store with rows: its beads are listed there and nowhere else, so
  // without the chip a town of nothing but town-store beads would show no way
  // to reach them.
  const townListed = rigNames.indexOf(TOWN_STORE) >= 0;
  if (rigNames.length > 1 || qTab === "ready" || qTab === "blocked") {
    const f = el("div", "qtabs");
    const chip = (label, count, on, fn, tip) => { const b = el("button", "chip" + (on ? " on" : ""), label); if (tip) b.title = tip; b.append(el("b", "", String(count))); b.onclick = fn; f.append(b); };
    if (rigNames.length > 1 || townListed) {
      chip("all stores", listTotal, qRig === "all", () => { qRig = "all"; renderBeads(state, true); });
      const parkedRigs = q.parked_rigs || [];
      // The town's store is named for what it means to the operator: its beads
      // are listed like any store's, and the dispatcher never takes them.
      rigNames.forEach(r => chip((r === TOWN_STORE ? (qTab === "ready" ? "town store, not dispatched" : "town store") : r) + (parkedRigs.indexOf(r) >= 0 ? " (parked)" : ""), rigs[r], qRig === r, () => { qRig = r; renderBeads(state, true); },
        r === TOWN_STORE ? "the town's own store (hq): the spec dispatcher reads each rig's store, never this one" : ""));
    }
    // No shape chip applies to the town store: none of its beads is dispatched,
    // so its chip lists every ready bead it holds.
    if (qTab === "ready" && qRig !== TOWN_STORE) {
      const inRig = all.filter(inStore);
      // One chip: a bead the last tick passed over lints clean exactly like
      // one it has not reached yet, so both are "ready to dispatch" and the
      // row's tag says which kind (gt-qt0ym, gt-e2cif).
      chip("ready to dispatch", inRig.filter(isReadyToDispatch).length, qShape === "ok", () => { qShape = qShape === "ok" ? "all" : "ok"; renderBeads(state, true); },

// FOLD_SUMMARY_ALWAYS is the sections whose summary stays in the header while

// the header for (gt-lpo20).
const FOLD_SUMMARY_ALWAYS = ["polecats", "beads"];

// the one section whose unread count is cleared by opening it.
const FOLD_ON_TOGGLE = {events: closed => { if (!closed) eventsRead(); }};

// throws — a locked-down browser, private mode — reads as no choice at all, so
// the defaults apply and folding still works for the session.
function foldStore() {
  try { return JSON.parse(localStorage.getItem(FOLD_KEY) || "{}") || {}; } catch (e) { return {}; }
}
function foldSave(key, closed) {

}
// foldLegacyTitle is the name a section's choice was saved under before it had

function foldLegacyTitle(head) {

}
function foldLegacySaved(title) {

}
// folds is every section the page made foldable, so a reading that arrives

const folds = [];

// foldable is what makes an element fold under its own heading, and the only

//
//   key         the section's stable key, which its choice is saved under
//   head        the heading element that carries the caret and acts as a
//               button (default: the element's own first h2 child)
//   summary     a function of the last reading returning the summary line, or
//               null when the section has nothing to add there
//   summaryAlways whether the summary stays in the header while the section is
//               open too, beside the note, rather than standing in for the note
//               only while it is closed
//   defaultOpen whether a reader with no saved choice sees it open
//   legacy      the title its choice was saved under before keys existed, so
//               an entry written then still applies
//   alwaysClosed whether it starts closed on every load, a saved choice or not

function foldable(root, opts) {

  const existing = folds.find(f => f.el === root);
  if (existing) return existing;

  // is taken by the summary, so the header says something worth reading
  // instead of how long ago the pane was drawn.
  const note = head.querySelector(".r");
  const caret = el("span", "caret");
  head.prepend(caret);
  const summary = el("span", "foldsum");
  head.append(summary);

  // default list says, until the reader opens it.
  const defaultOpen = !!opts.defaultOpen && !root.hasAttribute("data-default-collapsed");

    el: root,
    key: key,
    closed: opts.alwaysClosed || (remembered !== undefined ? !!remembered : !defaultOpen),
    summaryOf: opts.summary,
    summaryAlways: !!opts.summaryAlways,

    // into summaryAlways shows it while open too, the note beside it.
    const text = fold.closed ? foldSummaryLine(fold, s, note)
      : (fold.summaryAlways && fold.summaryOf ? (fold.summaryOf(s || {}) || "") : "");

    fold.closed = !fold.closed;

    // it is what draws it.
    if (!fold.closed) openSection(key);

    if (ev && ev.target && ev.target.closest && ev.target.closest("button, .chips, a")) return;

  });

    if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle(); }
  });

}
// foldSummaryLine is the one line a closed section shows: the note's own text

function foldSummaryLine(fold, s, note) {
  const text = note ? String(note.textContent || "").trim() : "";

}
// setupCollapse makes every section of the page foldable, with the key its

function setupCollapse() {

  // in it; "main section" is not on the page and is kept as it was.
  document.querySelectorAll("main section, .grid section, section.wide, section.wide section").forEach(sec => {
    const head = sec.querySelector(":scope > h2");
    if (!head) return;
    const key = sec.dataset.fold;

      head: head,
      summary: FOLD_SUMMARY[key],
      summaryAlways: FOLD_SUMMARY_ALWAYS.indexOf(key) >= 0,
      defaultOpen: FOLD_DEFAULT_OPEN.indexOf(key) >= 0,
      alwaysClosed: FOLD_ALWAYS_CLOSED.indexOf(key) >= 0,

setInterval(() => {

function foldFeed(hasActions) {

$("forgejofeedhead").addEventListener("click", toggleFeed);
foldFeed(false); // no state has arrived yet, so there is no Actions section
$("models").addEventListener("click", toggleModels);

// A tab that comes back has a stream whose events may still be queued behind

// stream (gt-t0qi7).
document.addEventListener("visibilitychange", () => { if (!document.hidden) lastEvent = Date.now(); });
// The watchdog is for a stream the browser has lost without saying so: a

// and the server publishes one on every poll, the fastest every 5 s

// then (gt-rpble, gt-3q3go).
// A tick more than two intervals after the last one is the page's own timer

// nothing about the stream, whose events may still be queued behind the tick.

(() => {

    stream.close();
    connect();

})();
