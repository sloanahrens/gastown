<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gas Town</title>
<style>
:root{
  --bg:#0d1117;--panel:#141a22;--line:#232c38;--text:#d7dee8;--dim:#7d8896;
  --green:#3fb950;--amber:#d29922;--red:#f85149;--blue:#58a6ff;--teal:#39c5bb;--violet:#b392f0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
body{padding:0 16px 24px;max-width:1500px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
h1{font-size:15px;margin:0;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.pill{padding:3px 10px;border-radius:999px;font-weight:700;font-size:12px;border:1px solid currentColor}
.pill.green{color:var(--green)}.pill.degraded{color:var(--amber)}.pill.red{color:var(--red)}.pill.unknown{color:var(--dim)}
#healthline{color:var(--dim);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#conn{font-size:12px;color:var(--dim)}
#conn.on::before{content:"● ";color:var(--green)}#conn.off::before{content:"● ";color:var(--red)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tile .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-size:22px;font-weight:700;margin-top:2px}
.tile .s{color:var(--dim);font-size:11px;min-height:15px}
.tile.warn .v{color:var(--amber)}.tile.bad .v{color:var(--red)}.tile.ok .v{color:var(--green)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:12px}
@media (max-width:1000px){.grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
section>h2{white-space:nowrap;margin:0;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);display:flex;gap:10px;align-items:center}
section>h2 .r{margin-left:auto;text-transform:none;letter-spacing:0;white-space:normal;text-align:right}
.body{padding:10px 12px}
table{border-collapse:collapse;width:100%}
th{color:var(--dim);font-weight:400;text-align:left;font-size:11px;padding:3px 8px 3px 0}
td{padding:4px 8px 4px 0;vertical-align:top;border-top:1px solid var(--line)}
td.n,th.n{text-align:right}
.bead{color:var(--blue)}.title{color:var(--dim)}
.empty{color:var(--dim);padding:6px 0}
.spark{width:100%;height:56px;display:block}
.chart{width:100%;height:64px;display:block}
.hbars{display:flex;align-items:stretch;gap:2px;height:64px;margin:4px 0 2px}
.hbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;min-height:1px}
.hbar i{display:block;min-height:1px}
.hok{background:var(--blue);border-radius:0 0 2px 2px}
.hrej{background:var(--red);border-radius:2px 2px 0 0}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--dim);font-size:11px;margin-top:3px}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.kv{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:6px}#spend .kv{margin-bottom:2px}
.kv b{font-size:16px}.kv span{color:var(--dim);font-size:11px;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--dim);background:none;font:inherit;font-size:11px}
.chip.on{color:var(--text);border-color:var(--blue);background:#1c2a3d}
.chip b{font-weight:400;color:var(--dim);margin-left:4px}
#feed{max-height:68vh;overflow:auto;padding:4px 0}
.row{display:grid;grid-template-columns:62px 82px 1fr;gap:8px;padding:2px 12px}
[hidden]{display:none !important}
.row:hover{background:#19212b}
.row .t{color:var(--dim)}.row .g{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .x{overflow-wrap:anywhere}
.c-failure .x{color:var(--red)}.c-warning .x{color:var(--amber)}.c-success .x{color:var(--green)}
.c-landing .x{color:var(--violet)}.c-dispatch .x{color:var(--blue)}.c-restart .x{color:var(--teal)}.c-plain .x{color:var(--dim)}
.bars{display:flex;align-items:flex-end;gap:3px;height:54px;margin:4px 0 2px;position:relative}
.bars i{flex:1;background:var(--blue);min-height:1px;border-radius:2px 2px 0 0;position:relative}
.bars i.low{background:var(--red)}
.bars .thr{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--amber)}
.axis{display:flex;justify-content:space-between;color:var(--dim);font-size:10px}
.stack{display:flex;height:9px;border-radius:2px;overflow:hidden;background:var(--line);min-width:90px}
.stack i{display:block;height:100%}
.sa{background:var(--green)}.ss{background:var(--dim)}.se{background:var(--amber)}.sr{background:var(--red)}
.tag{display:inline-block;padding:0 6px;border-radius:4px;font-size:11px;border:1px solid var(--line);margin-right:4px}
.o-approved{color:var(--green)}.o-skipped{color:var(--dim)}.o-error{color:var(--amber)}.o-rejected{color:var(--red)}
.tag.live{color:var(--green);border-color:var(--green)}
tr.live{background:#101a13}
.badge{padding:1px 8px;border-radius:999px;font-size:11px;border:1px solid currentColor;white-space:nowrap}
.st-working{color:var(--green)}.st-gating{color:var(--violet)}.st-queued{color:var(--blue)}
.st-needs-human{color:var(--red)}.st-quiet{color:var(--amber)}.st-stalled{color:var(--red)}.st-review-needed,.st-recovery{color:var(--amber)}.st-spawning{color:var(--teal)}.st-parked,.st-idle,.st-unknown{color:var(--dim)}
.tag.p0,.tag.p1{color:var(--red)}.tag.p2{color:var(--amber)}.tag.p3,.tag.p4{color:var(--dim)}
.cmd{display:inline-block;margin:2px 6px 0 0;padding:0 6px;border:1px solid var(--line);border-radius:4px;color:var(--dim);background:none;font:inherit;font-size:11px;cursor:pointer;text-align:left}
.cmd:hover{color:var(--text);border-color:var(--dim)}.cmd.done{color:var(--green);border-color:var(--green)}
.skip{padding:3px 0;border-top:1px solid var(--line)}.skip .why{color:var(--dim);display:block}
.qtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qrow{border-top:1px solid var(--line)}
.qhead{display:grid;grid-template-columns:auto auto 1fr auto;gap:4px 8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:5px 0;cursor:pointer}
.qhead:hover{background:#19212b}
.qhead .t{overflow-wrap:anywhere}
.qhead .caret{color:var(--dim);width:10px;display:inline-block}
.qsub{grid-column:2 / -1;color:var(--dim);font-size:11px}
.qdetail{padding:4px 0 10px 18px;overflow-wrap:anywhere}
.qdetail h4{margin:8px 0 2px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:400}
.qdetail pre{margin:0;white-space:pre-wrap;font:inherit;background:#10161d;border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-height:320px;overflow:auto}
.qcomment{border-left:2px solid var(--line);padding-left:8px;margin:4px 0}
section>h2{cursor:pointer;user-select:none}
section>h2:hover{color:var(--text)}
section>h2 .caret{display:inline-block;width:10px;color:var(--dim)}
section.collapsed>:not(h2){display:none}
section.collapsed>h2{border-bottom:0}
#queue{max-height:70vh;overflow:auto}
#forgejo{max-height:240px;overflow:auto}
#forgejo.folded{display:none}
.feedhead{display:flex;align-items:center;gap:6px;width:100%;background:none;border:0;padding:2px 0 3px;color:var(--dim);font:inherit;font-size:11px;letter-spacing:.04em;text-align:left;cursor:pointer}
.feedhead:hover{color:var(--text)}
.feedhead .caret{display:inline-block;width:10px}
.acts{margin-bottom:6px}
.actssum{color:var(--dim);padding:1px 0 3px}
.actsrow{display:grid;grid-template-columns:10px 17ch minmax(0,1fr) 10ch 13ch 52px 46px;gap:8px;align-items:center;height:16px;line-height:16px}
.actsrow>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actsrow .an,.actsrow .apolecat{color:var(--dim)}
.actsrow .acommit a{color:var(--blue);text-decoration:none}
.actsrow .acommit a:hover{text-decoration:underline}
.actsrow.act-failure,.actsrow.act-failure .an{color:var(--red)}
.actsidle{color:var(--dim);height:16px;line-height:16px}
.actdiv{border-top:1px solid var(--line);margin:2px 0}
.adot{width:8px;height:8px;border-radius:50%;background:currentColor;justify-self:center}
.act-success{color:var(--green)}
.act-failure{color:var(--red)}
.act-running,.act-waiting,.act-blocked{color:var(--amber)}
.act-cancelled,.act-skipped{color:var(--dim)}
.fev{display:grid;grid-template-columns:52px 88px 1fr minmax(0,auto);gap:8px;align-items:baseline;padding:3px 0;border-top:1px solid var(--line)}
.fev:first-child{border-top:0}
.fev .t{color:var(--dim);white-space:nowrap}
.fev .a{color:var(--teal);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fev .s{overflow-wrap:anywhere}
.fev .rp{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltable td{vertical-align:top}
.ltable td.n,.ltable th.n{padding-left:14px}
.ltable td:nth-child(2){overflow-wrap:anywhere}
.good{color:var(--green)}.warnc{color:var(--amber)}.badc{color:var(--red)}
.sweepico{font-weight:700}
#alertsctl{cursor:pointer;background:none;font:inherit;font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
#alertsctl.on{color:var(--teal);border-color:var(--teal)}
#toasts{position:fixed;top:54px;right:16px;z-index:5;display:flex;flex-direction:column;gap:6px;width:min(420px,90vw)}
.toast{display:flex;gap:8px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--dim);border-radius:6px;padding:7px 9px}
.toast.info{border-left-color:var(--blue)}.toast.warn{border-left-color:var(--amber)}.toast.crit{border-left-color:var(--red)}
.toast .tt{font-weight:700;overflow-wrap:anywhere}
.toast .tx{color:var(--dim);overflow-wrap:anywhere}
.toast button{margin-left:auto;background:none;border:0;color:var(--dim);font:inherit;cursor:pointer}
.alvl{display:inline-block;padding:0 6px;border-radius:4px;font-size:11px;border:1px solid currentColor;margin-right:6px}
.alvl.info{color:var(--blue)}.alvl.warn{color:var(--amber)}.alvl.crit{color:var(--red)}
.arow{border-top:1px solid var(--line);padding:4px 0;overflow-wrap:anywhere}
.arow .t{color:var(--dim)}
.arow .tx{color:var(--dim)}
.esc{font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.04em;white-space:nowrap}
.sev-critical{color:var(--red)}.sev-high{color:var(--amber)}.sev-medium{color:var(--blue)}.sev-low{color:var(--dim)}
.chead{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.cchips{display:flex;gap:4px;flex-wrap:wrap}
.cchips .tag{margin-right:0}
.crow{display:flex;gap:8px;align-items:baseline;width:100%;padding:4px 0;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.crow:hover{background:#19212b}
.crow .tag{margin-right:0}
.ckind{flex:0 0 auto;white-space:nowrap}
.cres{display:flex;gap:4px;align-items:baseline;flex:0 1 auto;min-width:0}
.cproj{flex:0 0 auto;white-space:nowrap}
.cname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cdetail{flex:1 1 24ch;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfull{padding:4px 0 8px 10px;margin-bottom:4px;border-left:2px solid var(--line);overflow-wrap:anywhere}
h3.sub{display:flex;gap:10px;align-items:center;margin:0;padding:10px 12px 0;font-size:11px;font-weight:400;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
h3.sub .r{margin-left:auto;text-transform:none;letter-spacing:0;white-space:normal;text-align:right}
.dhead,.drow{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.dhead{color:var(--dim);font-size:11px;padding-bottom:2px}
.drow{padding:4px 0;border-top:1px solid var(--line)}
.drepo,.dref,.dhash,.dstate,.dage{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drepo{flex:0 0 var(--drepo,15ch)}
.dref{flex:0 0 13ch}.dhash{flex:0 0 9ch}.dstate{flex:0 0 9ch}.dage{flex:0 0 7ch}
.drow .dref,.drow .dhash,.drow .dage{color:var(--dim)}
a.drow{color:inherit;text-decoration:none;cursor:pointer}
a.drow:hover{background:#19212b}
.dstage{flex:0 1 auto;min-width:0;display:flex;gap:4px;flex-wrap:wrap}
.dstage .tag{margin-right:0}
.dstage .live{font-weight:700}
.dwarn{flex:1 0 100%;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
  <h1>Gas Town</h1>
  <span id="verdict" class="pill unknown">UNKNOWN</span>
  <span id="healthline">waiting for the town…</span>
  <span id="conn" class="off">connecting</span>
  <button id="alertsctl" type="button">alerts: off</button>
</header>

<div id="toasts"></div>

<div class="tiles" id="tiles"></div>

<div class="grid">
  <div class="col">
    <section><h2>Escalations <span class="r" id="escalationnote"></span></h2><div class="body" id="escalations"></div></section>
    <section><h2>Alerts <span class="r" id="alertsnote"></span></h2><div class="body" id="alerts"></div></section>
    <section><h2>DeepSeek <span class="r" id="spendnote"></span></h2><div class="body" id="spend"></div></section>
    <section><h2>Rigs <span class="r" id="rigsnote"></span></h2><div class="body" id="rigs"></div></section>
    <section><h2><span class="sweepico" id="tiersweepico"></span>Tier sweeps <span class="r" id="tiersweepnote"></span></h2><div class="body" id="tiersweep"></div></section>
    <section><h2>Polecats <span class="r" id="seatsnote"></span></h2><div class="body" id="seats"></div></section>
    <section><h2>Dispatcher <span class="r" id="dispnote"></span></h2><div class="body" id="disp"></div></section>
    <section><h2>Work queue <span class="r" id="queuenote"></span></h2><div class="body" id="queue"></div></section>
    <section>
      <h2>Feed <span class="chips" id="chips"></span></h2>
      <div id="feed"></div>
    </section>
  </div>
  <div class="col">
    <section><h2>Machine <span class="r" id="machnote"></span></h2><div class="body" id="machine"></div></section>
    <section><h2>Cloud <span class="r" id="cloudnote"></span></h2><div class="body" id="cloud"></div><h3 class="sub">Deploys <span class="r" id="deploysnote"></span></h3><div class="body" id="deploys"></div></section>
    <section><h2>Forgejo <span class="r" id="forgejonote"></span></h2><div class="body"><div id="forgejoacts"></div><button id="forgejofeedhead" type="button" class="feedhead" aria-controls="forgejo"></button><div id="forgejo"></div></div></section>
    <section><h2>om review <span class="r" id="omnote"></span></h2><div class="body" id="om"></div></section>
    <section id="trendsec" hidden><h2>Landings <span class="r" id="trendnote"></span></h2><div class="body" id="trend"></div></section>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const fmtDur = s => {
  if (s == null || s < 0) return "–";
  s = Math.round(s);
  if (s < 90) return s + "s";
  const m = Math.round(s / 60);
  if (m < 90) return m + "m";
  const h = Math.floor(m / 60);
  if (h >= 48) return Math.floor(h / 24) + "d";
  return h + "h" + String(m % 60).padStart(2, "0") + "m";
};
const age = iso => iso ? fmtDur((Date.now() - new Date(iso).getTime()) / 1000) : "–";
const clock = iso => new Date(iso).toLocaleTimeString([], {hour12: false});
const money = v => v == null ? "–" : "$" + Number(v).toFixed(2);

let state = null;

function tile(k, v, sub, cls) {
  const t = el("div", "tile" + (cls ? " " + cls : ""));
  t.append(el("div", "k", k), el("div", "v", v), el("div", "s", sub || ""));
  return t;
}

// causeText keys one non-green health field the way the health line does —
// name, /rig, :subject — then the detail that explains it.
function causeText(c) {
  let k = c.name || "";
  if (c.rig) k += "/" + c.rig;
  if (c.subject) k += ":" + c.subject;
  return c.detail ? k + ": " + c.detail : k;
}

// renderHealth shows the verdict and, when it is not green, the worst cause
// beside it, so the pill answers "why" without reading the line under it.
function renderHealth(h) {
  const v = (h && h.verdict) || "unknown";
  const causes = (h && h.causes) || [];
  const p = $("verdict");
  p.className = "pill " + v;
  p.textContent = v.toUpperCase() + (causes.length ? " · " + causeText(causes[0]) : "");
  p.title = causes.map(causeText).join("\n");
  $("healthline").textContent = h && h.line ? h.line : "no health report";
}

function renderTiles(s) {
  const sm = s.summary || {};
  const tiles = $("tiles");
  tiles.replaceChildren();
  const q = sm.ready_to_land;
  let oldest = sm.oldest_ready ? (Date.now() - new Date(sm.oldest_ready).getTime()) / 1000 : null;
  tiles.append(tile("Waiting to land", q == null ? "–" : String(q),
    q ? "oldest " + fmtDur(oldest) : "queue empty", q == null ? "" : (oldest > 3600 ? "bad" : oldest > 900 ? "warn" : q ? "" : "ok")));
  const pcs = s.polecats || [];
  const live = pcs.filter(p => !p.rig_parked);   // a parked rig is stood down on purpose
  const n = k => live.filter(p => p.state === k).length;
  const active = n("working") + n("quiet") + n("gating");
  const bad = n("stalled") + n("needs-human");
  tiles.append(tile("Polecats working", pcs.length ? String(active) : "–",
    [sm.seats_cap ? "cap " + sm.seats_cap : null, pcs.length > live.length ? (pcs.length - live.length) + " in parked rigs" : null, n("queued") ? n("queued") + " queued" : null, n("stalled") ? n("stalled") + " stalled" : null, n("unknown") ? n("unknown") + " unknown (tmux unreadable)" : null, n("needs-human") ? n("needs-human") + " need a human" : null, n("quiet") ? n("quiet") + " quiet" : null].filter(Boolean).join(" · "),
    bad ? "bad" : n("quiet") ? "warn" : ""));
  tiles.append(tile("Escalations", sm.escalations == null ? "–" : String(sm.escalations), "", sm.escalations ? "bad" : (sm.escalations === 0 ? "ok" : "")));
  const med = sm.median_deploy_min;
  tiles.append(tile("Ship time", med == null ? "–" : Math.round(med) + "m", "median dispatch→deploy" +
    (sm.deploy_waiting ? " · " + sm.deploy_waiting + " awaiting deploy" : "")));
  tiles.append(tile("main vs gt", sm.behind == null ? "–" : (sm.behind === 0 ? "current" : sm.behind + " behind"),
    sm.main_tip ? sm.main_tip + " / " + (sm.installed_gt || "?") + " · as of the install repo’s last fetch" : "", sm.behind > 20 ? "warn" : ""));
  const m = s.machine || {};
  const cores = navigator.hardwareConcurrency || 8;
  tiles.append(tile("Load", m.load1 == null ? "–" : m.load1.toFixed(1),
    m.load5 != null ? "5m " + m.load5.toFixed(1) + " · 15m " + m.load15.toFixed(1) : "",
    m.load1 > cores * 3 ? "bad" : m.load1 > cores ? "warn" : ""));
  $("tiles").dataset.at = s.summary_at || "";
}

function copyText(text, btn) {
  const ok = () => { const old = btn.textContent; btn.classList.add("done"); btn.textContent = "copied"; setTimeout(() => { btn.classList.remove("done"); btn.textContent = old; }, 1200); };
  const fallback = () => { const t = document.createElement("textarea"); t.value = text; document.body.append(t); t.select(); try { document.execCommand("copy"); ok(); } catch (e) {} t.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
}
const STATE_HELP = {
  working: "holds a bead and its session is producing output",
  gating: "its bead is being gated and om-reviewed by the landing worker",
  queued: "its bead is submitted and waiting to land",
  "needs-human": "its bead is waiting on an operator",
  quiet: "its session has been silent for 10 minutes or more",
  stalled: "has assigned work and no live session: nothing is doing it",
  spawning: "dispatched seconds ago, session not up yet",
  "review-needed": "a live session holding uncommitted or unpushed work",
  recovery: "idle, but its worktree needs recovery before it can be reused",
  parked: "parked by an operator",
  unknown: "tmux could not be read, so this polecat cannot be told apart from a working one",
  idle: "holds nothing"
};
let openIdle = false;
let openParkedRig = false;
// Names for the polecats in view. label() is the short name, because each rig
// draws its polecats from that rig's own name theme, so the name alone places
// the polecat — except a short name that more than one rig uses, which without
// its rig would name none of them. rigOf() is the one rig using a short name,
// so a cell can carry the full rig/name in its title.
function polecatNames(polecats) {
  const rigs = new Map();
  for (const p of polecats || []) {
    if (!p.name) continue;
    let s = rigs.get(p.name);
    if (!s) rigs.set(p.name, s = new Set());
    s.add(p.rig || "");
  }
  return {
    label: (rig, name) => {
      const s = rigs.get(name);
      return name && s && s.size > 1 && rig ? rig + "/" + name : (name || "");
    },
    rigOf: name => { const s = rigs.get(name); return s && s.size === 1 ? [...s][0] : ""; },
  };
}
// One compact line per rig: whether it is parked, and where its work is. A
// count the dashboard could not read says so rather than showing a zero.
function renderRigs(s) {
  const box = $("rigs");
  box.replaceChildren();
  const rows = s.rigs || [];
  if (!rows.length) { box.append(el("div", "empty", s.queue ? "no rigs" : "reading…")); $("rigsnote").textContent = ""; return; }
  const t = el("table");
  const hr = el("tr");
  [["Rig"], ["Names", "the name theme this rig draws its polecats from; hover for a few of its names", 0],
   ["State"], ["Seats", "polecats in this rig that hold nothing and are free to take work", 1],
   ["Ready", "beads in this rig open with nothing blocking them", 1],
   ["Landing", "beads in this rig submitted and waiting to land", 1]].forEach(([h, tip, num]) => {
    const th = el("th", num ? "n" : "", h);
    if (tip) th.title = tip;
    hr.append(th);
  });
  t.append(hr);
  const cell = v => { const td = el("td", "n" + (v == null ? " title" : ""), v == null ? "unavailable" : String(v)); if (v == null) td.title = "the dashboard could not read this"; return td; };
  // The theme names the pool a rig's polecats come from, and its samples are
  // the names themselves, so the rig a short name belongs to can be looked up
  // here.
  const themeCell = r => {
    const td = el("td", "title", r.theme || "–");
    if (r.theme) td.title = (r.names || []).length ? r.theme + ": " + r.names.join(", ") : r.theme;
    else td.title = "this rig's polecat names are an explicit list: it has no name theme";
    return td;
  };
  for (const r of rows) {
    const tr = el("tr");
    tr.append(el("td", "", r.name), themeCell(r));
    const st = el("td");
    const badge = el("span", "badge st-" + (r.parked ? "parked" : "working"), r.parked ? "parked" : "active");
    if (r.parked) badge.title = "stood down by an operator: the dispatcher does not serve it";
    st.append(badge);
    tr.append(st, cell(r.seats), cell(r.ready), cell(r.landing));
    t.append(tr);
  }
  box.append(t);
  const parked = rows.filter(r => r.parked).length;
  const at = s.queue && s.queue.at;
  $("rigsnote").textContent = rows.length + " rigs" + (parked ? " · " + parked + " parked" : "") + (at ? " · read " + age(at) + " ago" : "");
}
function renderSeats(s) {
  const box = $("seats");
  box.replaceChildren();
  const pcs = s.polecats || [];
  if (!pcs.length) { box.append(el("div", "empty", s.summary ? "no polecats" : "reading…")); $("seatsnote").textContent = ""; return; }

  const by = {};
  pcs.filter(p => !p.rig_parked).forEach(p => by[p.state] = (by[p.state] || 0) + 1);
  const parkedCount = pcs.filter(p => p.rig_parked).length;
  const sum = el("div", "kv");
  ["needs-human", "unknown", "stalled", "review-needed", "recovery", "quiet", "working", "spawning", "gating", "queued", "parked", "idle"].forEach(k => {
    if (!by[k]) return;
    const x = el("div"); x.title = STATE_HELP[k];
    x.append(el("b", "st-" + k, String(by[k])), el("span", "", k));
    sum.append(x);
  });
  if (parkedCount) { const x = el("div"); x.title = "polecats in parked rigs: stood down on purpose, not counted above"; x.append(el("b", "st-parked", String(parkedCount)), el("span", "", "in parked rigs")); sum.append(x); }
  box.append(sum);

  const busy = pcs.filter(p => p.state !== "idle" && !p.rig_parked);
  const parkedRigPcs = pcs.filter(p => p.rig_parked).sort((x, y) => (x.state === "idle") - (y.state === "idle") || (x.rig + x.name).localeCompare(y.rig + y.name));
  const idle = pcs.filter(p => p.state === "idle" && !p.rig_parked).sort((x, y) => (y.landed_24h - x.landed_24h) || (x.rig + x.name).localeCompare(y.rig + y.name));
  const now = Date.now();
  const names = polecatNames(pcs);
  // The short name places the polecat; the full rig/name stays on the cell.
  const nameCell = p => { const td = el("td", "", names.label(p.rig, p.name)); td.title = p.rig + "/" + p.name; return td; };
  // The three right-hand columns are the polecat's last 24 hours of landings.
  const R = [
    ["Landed", "beads this polecat landed in the last 24 hours", p => p.landed_24h ? String(p.landed_24h) : "–"],
    ["om ok", "share of those landings om approved (the rest landed without a review or after an error)", p => p.landed_24h ? Math.round(p.approved_24h / p.landed_24h * 100) + "%" : "–"],
    ["Score", "average om score on its approved landings", p => p.avg_score_24h != null ? p.avg_score_24h.toFixed(2) : "–"],
  ];
  const head = cols => { const hr = el("tr"); cols.forEach(([h, tip, num]) => { const th = el("th", num ? "n" : "", h); if (tip) th.title = tip; hr.append(th); }); return hr; };
  const rightCells = (tr, p) => R.forEach(([, , f]) => tr.append(el("td", "n", f(p))));
  const busyTable = list => {
    const t = el("table");
    t.append(head([["Polecat"], ["State"], ["Bead"], ["On it", "time since the bead was dispatched", 1], ["Quiet", "time since its session last printed anything", 1], ...R.map(r => [r[0], r[1], 1])]));
    for (const p of list) {
      const tr = el("tr");
      tr.append(nameCell(p));
      const st = el("td"); const badge = el("span", "badge st-" + p.state, p.state); badge.title = (STATE_HELP[p.state] || "") + (p.reason && p.bead ? " — " + p.reason : ""); st.append(badge); tr.append(st);
      const bd = el("td");
      if (p.bead) {
        bd.append(el("span", "bead", p.bead));
        if (p.priority != null) bd.append(document.createTextNode(" "), el("span", "tag p" + Math.min(p.priority, 4), "P" + p.priority));
        (p.labels || []).forEach(l => bd.append(document.createTextNode(" "), el("span", "tag warnc", l)));
        if (p.title) bd.append(document.createElement("br"), el("span", "title", p.title));
      } else bd.append(el("span", "title", p.reason || "–"));
      if ((p.hints || []).length) {
        bd.append(document.createElement("br"));
        p.hints.forEach(h => { const b = el("button", "cmd", h); b.title = "copy (the dashboard never runs it)"; b.onclick = () => copyText(h, b); bd.append(b); });
      }
      tr.append(bd);
      const on = p.slung ? (now - new Date(p.slung).getTime()) / 1000 : null;
      tr.append(el("td", "n" + (on > 5400 ? " warnc" : ""), p.bead ? (on == null ? "–" : fmtDur(on)) : ""));
      const q = p.last_active ? (now - new Date(p.last_active).getTime()) / 1000 : null;
      tr.append(el("td", "n" + (q != null && q >= 600 ? " warnc" : ""), p.bead ? (p.state === "unknown" ? "?" : p.has_session ? fmtDur(q) : "no session") : ""));
      rightCells(tr, p);
      t.append(tr);
    }
    return t;
  };
  const idleTable = list => {
    const t = el("table");
    t.append(head([["Polecat"], ...R.map(r => [r[0], r[1], 1])]));
    for (const p of list) { const tr = el("tr"); tr.append(nameCell(p)); rightCells(tr, p); t.append(tr); }
    return t;
  };
  if (busy.length) box.append(busyTable(busy));
  if (parkedRigPcs.length) {
    const d = document.createElement("details");
    d.open = openParkedRig;
    d.ontoggle = () => { openParkedRig = d.open; };
    d.append(el("summary", "title", parkedRigPcs.length + " in parked rigs (stood down on purpose; not alerts)"), busyTable(parkedRigPcs));
    box.append(d);
  }
  if (idle.length) {
    const d = document.createElement("details");
    d.open = openIdle;
    d.ontoggle = () => { openIdle = d.open; };
    d.append(el("summary", "title", idle.length + " idle (free to take work) · last 24h landings on the right"), idleTable(idle));
    box.append(d);
  }
  $("seatsnote").textContent = s.summary_at ? "read " + age(s.summary_at) + " ago" : "";
}

function spark(points, w, h, color) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 " + w + " " + h);
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("class", "spark");
  if (points.length < 2) return svg;
  const max = Math.max(...points, 1);
  const d = points.map((v, i) => (i / (points.length - 1) * w).toFixed(1) + "," + (h - 2 - v / max * (h - 6)).toFixed(1)).join(" ");
  const pl = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
  pl.setAttribute("points", d); pl.setAttribute("fill", "none"); pl.setAttribute("stroke", color); pl.setAttribute("stroke-width", "1.5");
  svg.append(pl);
  return svg;
}

const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
// chartSVG draws one or more time series. A null value breaks the line, so a
// gap in the data is a gap in the drawing, not a line across it.
function chartSVG(series, x0, x1, w, h, gapMs) {
  gapMs = gapMs || 45 * 60e3;   // a quiet spell is a gap, not a slope between two landings
  const svg = svgEl("svg", {viewBox: "0 0 " + w + " " + h, preserveAspectRatio: "none", class: "chart"});
  let max = 0;
  for (const s of series) for (const p of s.pts) if (p.v != null && p.v > max) max = p.v;
  if (max <= 0) return svg;
  const span = Math.max(1, x1 - x0);
  const X = t => (Math.min(Math.max(t, x0), x1) - x0) / span * (w - 6) + 3;
  const Y = v => h - 4 - v / max * (h - 10);
  series.forEach(s => {
    let run = [];
    const flush = () => {
      if (run.length > 1) svg.append(svgEl("polyline", {points: run.join(" "), fill: "none", stroke: s.color, "stroke-width": "1.2", "stroke-opacity": "0.8"}));
      run = [];
    };
    let prev = null;
    for (const p of s.pts) {
      if (p.v == null) { flush(); prev = null; continue; }
      if (prev != null && p.t - prev > gapMs) flush();
      const x = X(p.t).toFixed(1), y = Y(p.v).toFixed(1);
      run.push(x + "," + y);
      svg.append(svgEl("circle", {cx: x, cy: y, r: "1.4", fill: s.color}));
      prev = p.t;
    }
    flush();
  });
  return svg;
}
function legend(items) {
  const d = el("div", "legend");
  for (const [color, label] of items) {
    const x = el("span");
    const sw = el("i", "sw"); sw.style.background = color;
    x.append(sw, document.createTextNode(label));
    d.append(x);
  }
  return d;
}
function median(xs) {
  const v = xs.filter(x => x != null).sort((a, b) => a - b);
  if (!v.length) return null;
  const m = Math.floor(v.length / 2);
  return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
}

// Four evenly spaced time labels and "now", under a chart that spans t0..t1.
function timeAxis(t0, t1) {
  const hhmm = ms => new Date(ms).toLocaleTimeString([], {hour12: false}).slice(0, 5);
  const a = el("div", "axis");
  for (let i = 0; i < 4; i++) a.append(el("span", "", hhmm(t0 + i * (t1 - t0) / 4)));
  a.append(el("span", "", "now"));
  return a;
}

// backoffDetail is a failing landing's run of failures, its next retry and the
// last error's first line.
function backoffDetail(r) {
  const parts = [(r.failures || 0) + " in a row"];
  if (r.next_try) {
    const inSecs = (new Date(r.next_try) - Date.now()) / 1000;
    parts.push(inSecs > 0 ? "next try in " + fmtDur(inSecs) : "retrying now");
  }
  if (r.detail) parts.push(r.detail);
  return parts.join(" · ");
}

function renderTrend(s) {
  const sec = $("trendsec"), box = $("trend");
  const t = s.trend;
  if (!t || !(t.hours || []).length) { sec.hidden = true; box.replaceChildren(); return; }
  sec.hidden = false;
  box.replaceChildren();
  const hours = t.hours;
  const names = polecatNames(s.polecats);
  const hhmm = iso => new Date(iso).toLocaleTimeString([], {hour12: false}).slice(0, 5);
  const t0 = new Date(hours[0].hour).getTime();
  const t1 = new Date(hours[hours.length - 1].hour).getTime() + 3600e3;
  const stages = t.stages || [];
  const landed = hours.reduce((n, h) => n + h.landed, 0);
  const rejected = hours.reduce((n, h) => n + h.rejected, 0);
  $("trendnote").textContent = landed + " landed · " + rejected + " rejected";

  // the day in numbers
  const kv = el("div", "kv");
  const add = (v, k, tip, cls) => { const x = el("div"); if (tip) x.title = tip; x.append(el("b", cls || "", v), el("span", "", k)); kv.append(x); };
  add(String(landed), "landed");
  add(String(rejected), "rejected", "rejections in the last 24 hours, whatever the reason", rejected ? "warnc" : "");
  const attempts = landed + rejected;
  if (attempts) add(Math.round(landed / attempts * 100) + "%", "first-pass", "landings as a share of landing attempts (landed + rejected)");
  const mg = median(stages.map(p => p.gate_secs)), mo = median(stages.map(p => p.om_secs));
  const mt = median(stages.map(p => p.lint_secs + p.gate_secs + (p.om_secs || 0)));
  if (mg != null) add(fmtDur(mg), "median gate");
  if (mo != null) add(fmtDur(mo), "median om");
  if (mt != null) add(fmtDur(mt), "median total", "lint + gate + om, per landing");
  const slow = stages.length ? Math.max(...stages.map(p => p.lint_secs + p.gate_secs + (p.om_secs || 0))) : null;
  if (slow != null) add(fmtDur(slow), "slowest", "the longest landing in the window", slow > 600 ? "warnc" : "");
  box.append(kv);

  // landings per hour: the blue part landed, the red part is rejections
  const max = Math.max(1, ...hours.map(h => h.landed + h.rejected));
  const bars = el("div", "hbars");
  for (const h of hours) {
    const col = el("div", "hbar");
    col.title = hhmm(h.hour) + " · " + h.landed + " landed" + (h.rejected ? " · " + h.rejected + " rejected" : "") + (h.load_avg != null ? " · load " + h.load_avg.toFixed(1) : "");
    if (h.rejected) { const r = el("i", "hrej"); r.style.height = h.rejected / max * 100 + "%"; col.append(r); }
    if (h.landed) { const l = el("i", "hok"); l.style.height = h.landed / max * 100 + "%"; col.append(l); }
    bars.append(col);
  }
  box.append(el("div", "k title", "landings per hour, red = rejected"), bars, timeAxis(t0, t1));

  // gate and om seconds per landing: dots are landings, lines join neighbours but not across a quiet spell
  if (stages.length) {
    const hasOM = stages.some(p => p.om_secs != null);
    const series = [{color: "#d29922", pts: stages.map(p => ({t: new Date(p.at).getTime(), v: p.gate_secs}))}];
    const key = [["#d29922", "gate"]];
    if (hasOM) {
      series.push({color: "#39c5bb", pts: stages.map(p => ({t: new Date(p.at).getTime(), v: p.om_secs}))});
      key.push(["#39c5bb", "om"]);
    }
    const peak = Math.max(...series.flatMap(x => x.pts.map(p => p.v == null ? 0 : p.v)));
    box.append(el("div", "k title", "gate and om time per landing · peak " + fmtDur(peak)), chartSVG(series, t0, t1, 600, 56), timeAxis(t0, t1), legend(key));
  } else box.append(el("div", "empty", "no stage lines in the last 24 hours"));

  // hourly load average (recorded only while a page is open)
  const loads = hours.filter(h => h.load_avg != null).map(h => ({t: new Date(h.hour).getTime() + 1800e3, v: h.load_avg}));
  if (loads.length) {
    const peak = Math.max(...loads.map(p => p.v));
    box.append(el("div", "k title", "hourly load average · peak " + peak.toFixed(1) + " · " + loads.length + " of 24 hours recorded (only while a page is open)"), chartSVG([{color: "#58a6ff", pts: loads}], t0, t1, 600, 44, 90 * 60e3), timeAxis(t0, t1));
  } else box.append(el("div", "empty", "no load history yet (it fills while a page is open)"));

  // the recent landings: live rows on top, then the last ten finished, newest first
  const rows = t.recent || [];
  if (rows.length) {
    const thr = s.om && s.om.threshold != null ? s.om.threshold : null;
    const tbl = el("table", "ltable");
    const hr = el("tr");
    [["When"], ["Landing"], ["By", "who built it: the polecat, or the crew member whose branch it was"], ["Score", "om's score", 1], ["Gate", "wall time of the gate stage", 1], ["om", "wall time of the om review", 1], ["Ship", "total ship time: dispatched to deployed, minutes", 1]].forEach(([h, tip, num]) => { const th = el("th", num ? "n" : "", h); if (tip) th.title = tip; hr.append(th); });
    tbl.append(hr);
    const today = new Date().toDateString();
    for (const r of rows) {
      const tr = el("tr");
      const when = new Date(r.at);
      if (r.outcome === "running") tr.className = "live";
      tr.append(el("td", "title", r.outcome === "running" ? "merging " + fmtDur((Date.now() - when.getTime()) / 1000) : r.outcome === "backoff" ? "checked " + clock(r.at).slice(0, 5) : (when.toDateString() === today ? clock(r.at).slice(0, 5) : when.toLocaleDateString([], {month: "short", day: "numeric"}) + " " + clock(r.at).slice(0, 5))));
      const main = el("td");
      main.append(el("span", "bead", r.bead));
      if (r.outcome === "running") { const g = el("span", "tag live", "running"); g.title = "merged; the worker is gating the merged tree and running the om review"; main.append(document.createTextNode(" "), g); }
      else if (r.outcome === "rejected") { const g = el("span", "tag badc", "rejected · " + (r.kind || "?")); main.append(document.createTextNode(" "), g); }
      else if (r.outcome === "backoff") { const g = el("span", "tag badc", "failing · " + (r.stage || "?")); g.title = "the landing worker keeps retrying this landing and losing; the stage is where the last attempt failed"; main.append(document.createTextNode(" "), g); }
      else if (r.verdict === "skipped") main.append(document.createTextNode(" "), el("span", "tag", "no review"));
      else if (r.verdict === "error") { const g = el("span", "tag warnc", "om error"); g.title = r.detail || ""; main.append(document.createTextNode(" "), g); }
      if (r.risk) { const g = el("span", "warnc", " ⚑"); g.title = "touched risk paths"; main.append(g); }
      if (r.title) main.append(document.createElement("br"), el("span", "title", r.title));
      if (r.outcome === "rejected" && r.detail) main.append(document.createElement("br"), el("span", "badc", r.detail));
      if (r.outcome === "backoff") main.append(document.createElement("br"), el("span", "badc", backoffDetail(r)));
      const total = (r.lint_secs || 0) + (r.gate_secs || 0) + (r.om_secs || 0);
      tr.title = [r.commit ? "commit " + r.commit : null, total ? "lint " + fmtDur(r.lint_secs || 0) + " + gate " + fmtDur(r.gate_secs || 0) + " + om " + fmtDur(r.om_secs || 0) + " = " + fmtDur(total) : null, r.route ? "route " + r.route : null].filter(Boolean).join(" · ");
      tr.append(main);
      // By names the holder the way the seats pane does: the short name, and
      // its rig only where two rigs in view use that name. The row's own rig
      // is the holder's for a live run; for a finished one it is read back from
      // the polecat roster, so a shared short name still gets its rig.
      const who = r.polecat || (r.route ? r.route.replace(/^overseer-/, "") : "");
      const rig = r.rig || names.rigOf(who);
      const by = el("td", "title");
      if (who) { by.textContent = names.label(rig, who); by.title = rig ? rig + "/" + who : who; }
      else if (r.outcome === "running" && r.rig) by.textContent = r.rig;
      else by.textContent = "–";
      tr.append(by);
      tr.append(el("td", "n" + (r.score != null && thr != null && r.score < thr ? " badc" : ""), r.score != null ? r.score.toFixed(2) : "–"));
      tr.append(el("td", "n" + (r.gate_secs > 180 ? " warnc" : ""), r.gate_secs != null ? fmtDur(r.gate_secs) : "–"));
      tr.append(el("td", "n" + (r.om_secs > 240 ? " warnc" : ""), r.om_secs != null ? fmtDur(r.om_secs) : "–"));
      const ship = el("td", "n" + (r.ship_pending ? " warnc" : ""));
      if (r.ship_secs != null) { ship.textContent = Math.round(r.ship_secs / 60) + "m"; ship.title = "dispatched to deployed"; }
      else if (r.ship_pending) { ship.textContent = "pending"; ship.title = "landed; waiting for the restart that installs it"; }
      else ship.textContent = "–";
      tr.append(ship);
      tbl.append(tr);
    }
    box.append(el("div", "k title", "landings: the ones running now and the ones failing in backoff on top, then the last 10 finished (newest first; hover a row for the commit and stage times)"), tbl);
  }
}

function renderMachine(s) {
  const box = $("machine");
  box.replaceChildren();
  const m = s.machine || {};
  const loads = (s.loads || []).map(p => p.load);
  box.append(spark(loads, 400, 56, "#58a6ff"));
  const note = loads.length > 1 ? "load, last " + fmtDur((new Date(s.loads[s.loads.length - 1].at) - new Date(s.loads[0].at)) / 1000) : "";
  $("machnote").textContent = note;
  const top = m.top || [];
  if (top.length) {
    const t = el("table");
    for (const p of top) { const tr = el("tr"); tr.append(el("td", "", p.name), el("td", "n", p.cpu >= 100 ? (p.cpu / 100).toFixed(1) + " cores" : p.cpu.toFixed(0) + "%")); t.append(tr); }
    box.append(el("div", "k title", "busiest processes"), t);
  }
}

// The Cloud panel draws what the reader stripped and capped out of another
// account's report. Every cell goes through el(), which writes textContent, so
// a Detail holding an HTML tag shows as that text and never as markup. A
// finding is one line — severity, kind, resource, then as much of the Detail as
// the line holds — and opening the row shows the whole Detail under it. The
// opened rows live in cloudOpen, so the refresh that redraws the list leaves
// them open (gt-1hob8).
const CLOUD_SEV = {urgent: "sev-critical", normal: "sev-medium", low: "sev-low"};
const cloudOpen = new Set();
// A finding carries no id of its own, so a row is keyed by its own text. The
// reader strips control runes, so the separator cannot appear inside a key.
const findingID = f => [f.project, f.resource, f.kind, f.detail].join("\u0000");

function renderCloud(s) {
  const box = $("cloud"), note = $("cloudnote");
  box.replaceChildren();
  const c = s.cloud;
  if (!c) { note.className = "r"; note.textContent = ""; box.append(el("div", "empty", "reading…")); return; }
  // The reader names the state — fresh, overdue, the error that stopped it, or
  // why there is no report — and overdue and error take the amber the page
  // already marks a stale reading with.
  const stale = c.state === "overdue" || c.state === "error";
  note.className = stale ? "r warnc" : "r";
  note.textContent = c.note || c.state || "";
  if (c.state === "missing" || c.state === "error") { box.append(el("div", c.state === "error" ? "badc" : "empty", c.note || c.state)); return; }
  const projects = c.projects || [];
  // One header line: the run, then the counts over the whole report beside it,
  // the zero counts left out. The projects the run watched ride the line's
  // title, so naming them costs no width.
  const head = el("div", "chead");
  head.title = projects.length ? projects.join(", ") : "no projects in the report";
  head.append(el("span", "title", "last run " + age(c.last_run) + " ago · " + projects.length + (projects.length === 1 ? " project" : " projects")));
  const counts = c.counts || {};
  const chips = el("span", "cchips");
  [["urgent", counts.urgent || 0], ["normal", counts.normal || 0], ["low", counts.low || 0]].forEach(([k, n]) => {
    if (n) chips.append(el("span", "tag " + (CLOUD_SEV[k] || "sev-low"), n + " " + k));
  });
  // A severity the patrol does not write yet is still a finding: count it
  // rather than dropping it.
  if (counts.other) chips.append(el("span", "tag sev-low", counts.other + " other"));
  if (chips.children.length) head.append(chips);
  box.append(head);
  if (!c.total) { box.append(el("div", "empty", "no findings")); return; }
  const findings = c.findings || [];
  // The project column is dropped when one project owns every finding — the
  // header already names it — and otherwise rides the resource as a dim prefix
  // that never takes a line of its own.
  const multi = new Set(findings.map(f => f.project || "")).size > 1;
  for (const f of findings) {
    const id = findingID(f);
    const open = cloudOpen.has(id);
    const row = el("button", "crow");
    row.setAttribute("aria-expanded", open ? "true" : "false");
    row.title = f.detail || "";
    const sev = el("span", "tag esc " + (CLOUD_SEV[f.severity] || "sev-low"), f.severity || "–");
    if (f.observed_at) sev.title = "observed " + new Date(f.observed_at).toLocaleString();
    row.append(sev, el("span", "ckind title", f.kind || "–"));
    const res = el("span", "cres");
    if (multi && f.project) res.append(el("span", "cproj title", f.project));
    res.append(el("span", "cname", f.resource || "–"));
    row.append(res, el("span", "cdetail", f.detail || ""));
    row.onclick = () => { open ? cloudOpen.delete(id) : cloudOpen.add(id); renderCloud(state); };
    box.append(row);
    if (open) box.append(el("div", "cfull", f.detail || ""));
  }
  if (c.more) box.append(el("div", "empty", "and " + c.more + " more"));
}

// The Deploys block draws the deploy workflow's runs: repo, ref, commit, state,
// age and the stages in needs order, on one line while the panel is wide enough
// to hold them and wrapped when it is not. A stage name and a ref are a
// repository's own text, so every cell goes through el() and nothing here
// parses markup.
//
// The chips are the page's own colours for a job state: a stage that ran green,
// a failure the alert red, a running stage the live colour the landing rows
// mark a running landing with, and a stage that did not run (waiting, blocked,
// skipped, cancelled) dim. The chip carries the state's word on its title and
// the glyph of it beside the name, so a row of chips is read at a glance. A run
// nothing has picked up, and one that has not moved, carry the reader's warning
// instead.
const DEPLOY_STAGE = {success: "good", failure: "badc", running: "live", waiting: "sev-low", blocked: "sev-low", skipped: "sev-low", cancelled: "sev-low"};
const DEPLOY_GLYPH = {success: "✓", failure: "✗", running: "◌"};

function renderDeploys(s) {
  const box = $("deploys"), note = $("deploysnote");
  box.replaceChildren();
  const d = s.deploys;
  // No reader at all is no viewer token, which is the same the Forgejo panel
  // says: both are wired from the one viewer client.
  if (!d) { note.className = "r"; note.textContent = ""; box.append(el("div", "empty", "no viewer token")); return; }
  // The reader names what it could not read — the class of a refresh that read
  // nothing, or the repos that failed — and the patrol findings above are
  // untouched by either.
  const err = d.error || "", unreadable = (d.missing || []).length;
  note.className = err || unreadable ? "r warnc" : "r";
  note.textContent = err ? "could not read the runs: " + err : (unreadable ? unreadable + (unreadable === 1 ? " repo unreadable" : " repos unreadable") : "");
  const runs = d.runs || [];
  if (!runs.length) { box.append(el("div", err ? "badc" : "empty", err ? "no deploy runs: " + err : "no deploy runs yet")); return; }
  // The repo column is as wide as the longest name the block lists, so no name
  // is cut to make room for another (gt-1hob8).
  let widest = 0;
  for (const r of runs) widest = Math.max(widest, repoShort(r.repo).length);
  box.style.setProperty("--drepo", widest + "ch");
  const head = el("div", "dhead");
  [["Repo", "drepo"], ["Ref", "dref"], ["Commit", "dhash"], ["State", "dstate"], ["Age", "dage"]].forEach(([h, cls]) => head.append(el("span", cls, h)));
  box.append(head);
  for (const r of runs) box.append(deployRow(r));
}

// deployRow is one run: the repo, ref, commit, state and age on one line, the
// stages after them while they fit on that line, and the reader's warning under
// it. The row itself is the run's link, so the run the operator is reading is
// the one they open; a run the reader kept no URL for is the same row unlinked
// rather than a link to nowhere. The repo cell shows the shortened name with
// the whole one on its title, the way the Actions rows name a repo.
function deployRow(r) {
  const row = r.url ? el("a", "drow") : el("div", "drow");
  if (r.url) { row.href = r.url; row.target = "_blank"; row.rel = "noopener"; row.title = r.url; }
  const repo = el("span", "drepo", repoShort(r.repo));
  if (repo.textContent !== r.repo) repo.title = r.repo;
  row.append(repo, el("span", "dref", r.ref || "–"), el("span", "dhash", r.hash || "–"), el("span", "dstate", r.status || "–"), el("span", "dage", r.at ? age(r.at) : "–"), deployStages(r));
  if (r.warn) row.append(el("span", "dwarn warnc", r.warn));
  return row;
}

// The stage cell: one chip per stage, in the order the reader sorted the jobs'
// needs into, each carrying its name and the glyph of the state the API
// reported, with the state's own word on the chip's title. A run whose jobs
// were not read says so rather than drawing a blank the operator would read as
// a run with no stages.
function deployStages(r) {
  const cell = el("span", "dstage");
  const stages = r.stages || [];
  if (!stages.length) { cell.className += " title"; cell.textContent = r.stages_unread ? "stages not read" : "–"; return cell; }
  for (const st of stages) {
    const chip = el("span", "tag " + (DEPLOY_STAGE[st.status] || "sev-low"), (st.name || "–") + " " + (DEPLOY_GLYPH[st.status] || "–"));
    chip.title = (st.name || "–") + " " + (st.status || "?");
    cell.append(chip);
  }
  return cell;
}

// One compact line per sweep: when, which rig and sha, a verdict per tier, and
// how long the whole cycle took. A tier the sweep did not run is left blank, and
// a RED one carries the failing units its rig's record still holds.
const TIERSWEEP_TIERS = ["shell", "integration", "race"];

// The When column's reading of a sweep's stamp, shared with the icon's tooltip
// so the two cannot disagree about which sweep a verdict came from.
function sweepWhen(at) {
  const d = new Date(at);
  return d.toDateString() === new Date().toDateString() ? clock(at).slice(0, 5) : d.toLocaleDateString([], {month: "short", day: "numeric"}) + " " + clock(at).slice(0, 5);
}

// Each tier's most recent verdict, keyed by tier. This is the rule the daemon's
// attention list holds to (internal/daemon/attention.go): a tier a sweep did
// not run keeps the result of the sweep that last did, so a newer shell-only
// GREEN cannot hide an integration RED still standing. The first row naming a
// tier wins because the reader hands them over newest first
// (dashboard_tier_sweep.go recent()).
function tierSweepLatest(sweeps) {
  const latest = {};
  for (const row of sweeps || []) (row.stages || []).forEach(x => { if (!latest[x.tier]) latest[x.tier] = {verdict: x.verdict, at: row.at}; });
  return latest;
}

// The pane's title icon, the one verdict a collapsed pane still shows. Green
// needs every tier's most recent result GREEN and red needs one RED; a tier
// that has never reported leaves it neutral, because an unknown result is
// neither. A sweep in flight is not a verdict (gt-5qk83).
function tierSweepIcon(ts) {
  const none = {glyph: "–", cls: "", title: "no tier sweep results"};
  if (!ts) return none;
  if (ts.unavailable) return {glyph: "–", cls: "", title: "the daemon log could not be read"};
  if (!(ts.sweeps || []).length) return none;
  const latest = tierSweepLatest(ts.sweeps);
  const title = TIERSWEEP_TIERS.map(tier => { const v = latest[tier]; return tier + " " + (v ? v.verdict + " " + sweepWhen(v.at) : "–"); }).join(", ");
  // RED first: one red tier outranks any number of greens.
  if (TIERSWEEP_TIERS.some(tier => latest[tier] && latest[tier].verdict === "RED")) return {glyph: "✗", cls: "badc", title};
  if (TIERSWEEP_TIERS.every(tier => latest[tier] && latest[tier].verdict === "GREEN")) return {glyph: "✓", cls: "good", title};
  return {glyph: "–", cls: "", title};
}

// The neutral state carries no colour class of its own, so the dash takes the
// h2's muted tone. Green and red reuse the page's good and badc tokens, which
// keeps colour from being the only carrier of the verdict.
function paintTierIcon(ts) {
  const ico = $("tiersweepico");
  if (!ico) return;
  const v = tierSweepIcon(ts);
  ico.textContent = v.glyph;
  ico.className = "sweepico" + (v.cls ? " " + v.cls : "");
  ico.title = v.title;
}

function renderTierSweep(s) {
  const box = $("tiersweep");
  box.replaceChildren();
  const ts = s.tiersweep;
  // Painted ahead of the empty paths' returns, so an unreadable log reads as
  // nothing known rather than as a stale green.
  paintTierIcon(ts);
  if (!ts) { box.append(el("div", "empty", "reading the daemon log…")); $("tiersweepnote").textContent = ""; return; }
  if (ts.unavailable) { box.append(el("div", "badc", "unavailable: the daemon log could not be read")); $("tiersweepnote").textContent = ""; return; }
  const kv = el("div", "kv");
  const run = ts.running;
  const st = el("div");
  // The cycle's own stage list when the daemon logged one; an older log gives
  // only the stage the fallback inferred.
  if (run) {
    const stages = (run.tiers && run.tiers.length) ? run.tiers.join(", ") : run.tier;
    st.append(el("b", "good", "running"), el("span", "", run.rig + " · " + stages + " · " + fmtDur((Date.now() - new Date(run.since).getTime()) / 1000)));
  } else st.append(el("b", "", "idle"), el("span", "", "no sweep is running"));
  kv.append(st);
  box.append(kv);
  const rows = ts.sweeps || [];
  if (!rows.length) { box.append(el("div", "empty", "no sweeps in the daemon log")); $("tiersweepnote").textContent = ""; return; }
  const t = el("table");
  const hr = el("tr");
  [["When"], ["Rig"], ["Sha"], ...TIERSWEEP_TIERS.map(x => [x]), ["Total", "the whole cycle, every stage the sweep ran", 1]].forEach(([h, tip, num]) => { const th = el("th", num ? "n" : "", h); if (tip) th.title = tip; hr.append(th); });
  t.append(hr);
  for (const row of rows) {
    const tr = el("tr");
    tr.append(el("td", "title", sweepWhen(row.at)));
    tr.append(el("td", "", row.rig));
    tr.append(el("td", "title", row.sha || "–"));
    const by = {};
    (row.stages || []).forEach(x => by[x.tier] = x);
    TIERSWEEP_TIERS.forEach(tier => {
      const v = by[tier];
      if (!v) { tr.append(el("td", "title", "–")); return; }
      const cell = el("td", v.verdict === "RED" ? "badc" : v.verdict === "GREEN" ? "good" : "", v.verdict);
      if ((v.failed || []).length) cell.title = "failed: " + v.failed.join(", ");
      tr.append(cell);
    });
    tr.append(el("td", "n", row.secs == null ? "–" : fmtDur(row.secs)));
    t.append(tr);
  }
  box.append(t);
  // The newest RED the record still explains, named under the table so it reads
  // without a hover.
  const newest = rows[0];
  (newest.stages || []).filter(x => x.verdict === "RED" && (x.failed || []).length).forEach(x => {
    box.append(el("div", "badc title", newest.rig + " " + x.tier + " RED: " + x.failed.join(", ")));
  });
  $("tiersweepnote").textContent = rows.length + " sweeps · last " + fmtDur((Date.now() - new Date(newest.at).getTime()) / 1000) + " ago";
}

// The Actions section's status colours, reusing the page's own tokens: success
// green, failure red, one still waiting or running amber, cancelled or skipped
// muted. A status the page has never seen stays muted rather than guessing.
const ACT_CLASS = {success: "act-success", failure: "act-failure", running: "act-running", waiting: "act-waiting", blocked: "act-blocked", cancelled: "act-cancelled", skipped: "act-skipped"};

// secsSince is how long ago an RFC3339 stamp is, or null when it is absent or
// unreadable; fmtDur renders null as "–".
function secsSince(iso) {
  if (!iso) return null;
  const t = Date.parse(iso);
  return isNaN(t) ? null : (Date.now() - t) / 1000;
}

// actsSum is the section's one line: what is running or queued, then how the
// newest completed runs went. The tally counts the runs the stats were taken
// over — the newest twenty completed — so its denominator is what was scored,
// not the whole history; a window of nothing but cancelled or skipped runs
// reads "none" rather than pretending a zero.
function actsSum(a) {
  const st = a.stats || {};
  const ok = st.ok || 0, failed = st.failed || 0, scored = ok + failed;
  const tally = [];
  if (ok) tally.push(ok + " ok");
  if (failed) tally.push(failed + " failed");
  const parts = [(st.running || 0) + " running", (st.queued || 0) + " queued"];
  parts.push(scored ? "last " + scored + ": " + (tally.length ? tally.join(" ") : "none") : "no completed runs");
  if (scored && st.median_secs > 0) parts.push("median " + fmtDur(st.median_secs));
  const unreadable = a.errors || [];
  if (unreadable.length) parts.push(unreadable.length + " unreadable");
  return parts.join(" · ");
}

// repoShort is what the repo cell shows: the part after the last "/", because
// the owner is the same for every run the panel reads and the name is the part
// that tells rigs apart. A name already without an owner, and a trailing slash
// with nothing after it, come back as they came — never empty (gt-fn9e6.54).
function repoShort(name) {
  const s = name || "";
  const cut = s.lastIndexOf("/");
  const short = cut >= 0 ? s.slice(cut + 1) : s;
  return short || s;
}

// actCommit is the row's commit cell: the hash of the commit the run tested,
// cut to the eight characters the Actions page shows, and the run's number
// beside it ("645edaf6 #20"). The hash opens the run in a new tab, so a row can
// be matched to a commit on main and opened without hunting the pane. A run the
// API sent no sha for leaves the cell empty rather than a link to nowhere; one
// with no URL shows the same text unlinked.
function actCommit(a) {
  const cell = el("span", "acommit");
  const hash = a.hash || "";
  if (!hash) return cell;
  const text = hash + (a.number ? " #" + a.number : "");
  if (!a.url) { cell.textContent = text; return cell; }
  const link = el("a", "", text);
  link.href = a.url;
  link.target = "_blank";
  link.rel = "noopener";
  cell.append(link);
  return cell;
}

// actPolecat is the row's polecat cell: who built the landing, read off the
// branch the run's title names ("land: polecat/obsidian/gt-xvw20+..."). The
// column is a fixed width, so a run whose title names no polecat — a push, a
// probe — draws nothing there without shifting the columns after it. The name
// is truncated to the column and the whole of it rides on the cell's title.
function actPolecat(a) {
  const cell = el("span", "apolecat", a.polecat || "");
  if (a.polecat) cell.title = a.polecat;
  return cell;
}

// actRow is one compact action line: status dot, repo, bead, polecat, commit,
// how long the run took, and how long ago it finished. A run still going shows
// its elapsed in place of the duration, ticking from its start — the start is
// its only stamp, so the age cell stays empty rather than repeating that
// number; a run that has not started has neither stamp and leaves both time
// cells blank. Each cell is one line with the whole value in its title, and the
// row's title carries the line the columns ellipsized.
function actRow(a) {
  const st = a.status || "";
  const running = st === "running";
  const row = el("div", "actsrow" + (st === "failure" ? " act-failure" : ""));
  const dot = el("span", "adot " + (ACT_CLASS[st] || ""));
  dot.title = st || "unknown status";
  const repo = repoShort(a.repo);
  const repoCell = el("span", "arepo", repo);
  // The shortened cell is the one whose text no longer says which owner the
  // repo came from, so it alone carries the full name on hover.
  if (repo !== (a.repo || "")) repoCell.title = a.repo;
  row.append(dot, repoCell, el("span", "abead", a.bead || ""), actPolecat(a), actCommit(a));
  const took = el("span", "an", running || a.started ? fmtDur(running ? secsSince(a.started) : a.duration_secs) : "");
  if (running && a.started) { took.dataset.since = a.started; took.title = "running for " + fmtDur(secsSince(a.started)); }
  else took.title = a.started ? "ran " + fmtDur(a.duration_secs) : "not started";
  row.append(took);
  const ago = el("span", "an", a.stopped ? fmtDur(secsSince(a.stopped)) : "");
  if (a.stopped) { ago.dataset.since = a.stopped; ago.title = "finished " + fmtDur(secsSince(a.stopped)) + " ago"; }
  row.append(ago);
  row.title = (a.repo || "") + " " + (a.bead || "") + " · " + (st || "unknown") + (a.event ? " (" + a.event + ")" : "") + (a.sha ? "\n" + a.sha : "") + (a.url ? "\n" + a.url : "");
  return row;
}

// renderForgejoActs draws the Actions section above the feed: the stats line,
// the runs still queued or running (or a muted idle line when there are none),
// a thin divider, then the newest completed. It is left out entirely when the
// server sends no actions — an older server, or a reader that has nothing to
// report — and then the pane is the feed it was before (gt-fn9e6.48).
function renderForgejoActs(a) {
  const box = $("forgejoacts");
  box.replaceChildren();
  if (!a) return;
  const wrap = el("div", "acts");
  const sum = el("div", "actssum", actsSum(a));
  if ((a.errors || []).length) sum.title = "runs unreadable in: " + a.errors.join(", ");
  wrap.append(sum);
  const current = a.current || [], recent = a.recent || [];
  if (current.length) current.forEach(r => wrap.append(actRow(r)));
  else wrap.append(el("div", "actsidle", "idle"));
  if (recent.length) { wrap.append(el("div", "actdiv")); recent.forEach(r => wrap.append(actRow(r))); }
  box.append(wrap);
}

// The Forgejo panel is a tail like the feed: one line per event, oldest first,
// following its own end. Where it was scrolled is read before the lines are
// replaced, so a reader who has scrolled up keeps their place and following
// resumes on its own once they come back to the bottom.
function renderForgejo(s) {
  const box = $("forgejo");
  const follow = box.scrollHeight - box.scrollTop - box.clientHeight <= 4;
  box.replaceChildren();
  $("forgejonote").textContent = "";
  $("forgejonote").className = "r";
  const f = s.forgejo;
  if (!f) { renderForgejoActs(null); feedCount = null; foldFeed(false); box.append(el("div", "empty", "no viewer token")); return; }
  renderForgejoActs(f.actions);
  const events = f.events || [];
  feedCount = events.length;
  foldFeed(!!f.actions);
  // A repo the viewer's token cannot read is named: silently reading a subset is
  // how a rig's landings went missing with no error anywhere (gt-faml5).
  const missing = f.missing || [];
  if (missing.length) box.append(el("div", "badc title", "not readable by the viewer: " + missing.join(", ")));
  if (!events.length) {
    if (!missing.length) { box.append(el("div", f.error ? "badc" : "empty", f.error ? "unavailable: " + f.error : "no activity")); return; }
  } else {
    const today = new Date().toDateString();
    for (const e of events) {
      const when = new Date(e.at);
      const stamp = when.toDateString() === today ? clock(e.at).slice(0, 5) : when.toLocaleDateString([], {month: "short", day: "numeric"});
      const row = el("div", "fev");
      row.append(el("span", "t", stamp), el("span", "a", e.actor), el("span", "s", e.summary), el("span", "rp", e.repo));
      box.append(row);
    }
  }
  // The note ages the SNAPSHOT, not the newest event. A quiet repo's feed is
  // current with its newest event hours old, and a frozen pane is the other way
  // round, so the event's age cannot tell them apart (gt-faml5).
  const read = Date.parse(f.at || "");
  const every = f.every_seconds || 0;
  const age = read > 0 ? (Date.now() - read) / 1000 : null;
  const stale = age != null && every > 0 && age > 2 * every;
  let note = (f.error ? "stale (" + f.error + ") · " : "") + events.length + " events";
  if (age != null) note += " · snapshot " + fmtDur(age) + " old";
  if (stale) note += " · STALE";
  $("forgejonote").textContent = note;
  if (stale) $("forgejonote").className = "r badc";
  if (follow) box.scrollTop = box.scrollHeight;
}

function renderSpend(s) {
  const box = $("spend");
  box.replaceChildren();
  const d = s.spend;
  if (!d) { box.append(el("div", "empty", "no spend report")); $("spendnote").textContent = ""; return; }
  const live = d.live || {};
  const kv = el("div", "kv");
  const add = (v, k, cls) => { const x = el("div"); x.append(el("b", cls || "", v), el("span", "", k)); kv.append(x); };
  add(money(d.balance), "balance", live.available === false ? "badc" : "");
  add(money(d.spent_total), "spent since top-up");
  add(d.pace_1h ? money(d.pace_1h.per_hour) + "/h" : "–", "last 1h");
  add(d.pace_24h ? money(d.pace_24h.per_hour) + "/h" : "–", "last 24h");
  const rw = d.runway_days_at_24h_pace;
  add(rw == null ? "–" : rw.toFixed(1) + "d", "runway", rw != null && rw < 3 ? "badc" : rw != null && rw < 7 ? "warnc" : "");
  box.append(kv);
  // One dim line of the last few days instead of a table, to keep the panel short.
  const days = Object.entries(d.per_day || {}).slice(-4).reverse();
  if (days.length) {
    box.append(el("div", "title", days.map(([day, v]) => day.slice(5) + " " + (v.spent < 0 ? "top-up" : money(v.spent))).join(" · ")));
  }
  const alerts = d.alerts || [];
  if (live.ok === false) box.append(el("div", "badc", "live balance unreachable; showing the ledger"));
  if (d.watcher_pid == null || d.watcher_pid === "") box.append(el("div", "badc", "spend watcher is not running"));
  $("spendnote").textContent = d.last_sample ? "ledger " + d.last_sample.replace("T", " ") : "";
}

function sec(v) { return v == null ? "–" : fmtDur(v); }
function renderOM(s) {
  const box = $("om");
  box.replaceChildren();
  const om = s.om;
  if (!om) { box.append(el("div", "empty", "reading the landings and the daemon log…")); $("omnote").textContent = ""; return; }
  $("omnote").textContent = [om.backend, om.depth, om.threshold != null ? "threshold " + om.threshold : null, om.timeout_s ? om.timeout_s + "s timeout" : null].filter(Boolean).join(" · ");

  const t = el("table");
  const hr = el("tr");
  ["", "Landed", "Approved", "No review", "Errors", "Rejected", "Avg score", "om median", "om p95"].forEach((x, i) => hr.append(el("th", i ? "n" : "", x)));
  t.append(hr);
  for (const w of om.windows || []) {
    const tr = el("tr");
    tr.append(el("td", "", w.label));
    const rej = w.rejected, err = w.errors;
    [w.landed, w.approved, w.skipped, err, rej].forEach((v, i) => tr.append(el("td", "n" + (i === 3 && v ? " warnc" : "") + (i === 4 && v ? " badc" : ""), String(v))));
    tr.append(el("td", "n", w.avg_score == null ? "–" : w.avg_score.toFixed(2)), el("td", "n", sec(w.median_secs)), el("td", "n" + (w.p95_secs > 240 ? " warnc" : ""), sec(w.p95_secs)));
    t.append(tr);
  }
  box.append(t);

  // score histogram: approvals and review rejections by decile; red below the threshold
  const scores = om.scores || [];
  const max = Math.max(1, ...scores);
  const bars = el("div", "bars");
  scores.forEach((n, i) => {
    const b = el("i", om.threshold != null && (i + 1) / 10 <= om.threshold ? "low" : "");
    b.style.height = (n / max * 100) + "%";
    b.title = (i / 10).toFixed(1) + "–" + ((i + 1) / 10).toFixed(1) + ": " + n;
    bars.append(b);
  });
  if (om.threshold != null) { const th = el("div", "thr"); th.style.left = (om.threshold * 100) + "%"; bars.append(th); }
  const kd = el("div", "k title", "score distribution (approvals + review rejections)");
  const axis = el("div", "axis"); ["0.0", "0.5", "1.0"].forEach(x => axis.append(el("span", "", x)));
  box.append(kd, bars, axis);

  const meta = el("div", "", "");
  meta.style.margin = "8px 0";
  const rj = Object.entries(om.rejects || {}).sort((a, b) => b[1] - a[1]);
  meta.append(el("span", "title", "rejected: "));
  if (!rj.length) meta.append(el("span", "", "none"));
  rj.forEach(([k, n]) => meta.append(el("span", "tag", k + " " + n)));
  const rt = Object.entries(om.routes || {}).sort((a, b) => b[1] - a[1]);
  meta.append(document.createElement("br"), el("span", "title", "routes: "));
  rt.forEach(([k, n]) => meta.append(el("span", "tag", k + " " + n)));
  if (om.risk_paths) meta.append(document.createElement("br"), el("span", "title", "touched risk paths: "), el("span", "warnc", om.risk_paths + " landings"));
  box.append(meta);

  const days = om.days || [];
  if (days.length) {
    const dt = el("table");
    const dh = el("tr");
    ["Day", "", "om avg"].forEach((x, i) => dh.append(el("th", i === 2 ? "n" : "", x)));
    dt.append(dh);
    const dmax = Math.max(1, ...days.map(d => d.approved + d.skipped + d.errors + d.rejected));
    for (const d of days) {
      const tr = el("tr");
      tr.append(el("td", "", d.day));
      const td = el("td"); const st = el("div", "stack"); st.style.width = ((d.approved + d.skipped + d.errors + d.rejected) / dmax * 100) + "%";
      [["sa", d.approved], ["ss", d.skipped], ["se", d.errors], ["sr", d.rejected]].forEach(([c, n]) => { if (n) { const i = el("i", c); i.style.flex = n; i.title = c + " " + n; st.append(i); } });
      td.append(st); tr.append(td);
      const lbl = d.approved + " ok" + (d.skipped ? " · " + d.skipped + " manual" : "") + (d.errors ? " · " + d.errors + " err" : "") + (d.rejected ? " · " + d.rejected + " rej" : "");
      td.append(el("div", "title", lbl));
      tr.append(el("td", "n", sec(d.avg_secs)));
      dt.append(tr);
    }
    box.append(el("div", "k title", "by day"), dt);
  }

}

function renderDispatch(s) {
  const box = $("disp");
  box.replaceChildren();
  const d = s.dispatch;
  if (!d) { box.append(el("div", "empty", "no dispatcher tick in the daemon log yet")); $("dispnote").textContent = ""; return; }
  const ageSec = (Date.now() - new Date(d.at).getTime()) / 1000;
  const stale = ageSec > 300;
  $("dispnote").textContent = "last tick " + fmtDur(ageSec) + " ago";
  $("dispnote").className = "r" + (stale ? " badc" : ageSec > 150 ? " warnc" : "");
  if (stale) box.append(el("div", "badc", "⚠ the dispatcher has not ticked for " + fmtDur(ageSec) + " (it ticks every minute)"));
  const kv = el("div", "kv");
  const add = (v, k, cls) => { const x = el("div"); x.append(el("b", cls || "", String(v)), el("span", "", k)); kv.append(x); };
  add(d.roster || "–", "roster");
  add(d.candidates, "candidates");
  add(d.dispatched, "dispatched", d.dispatched ? "good" : "");
  add(d.skipped, "skipped", d.skipped ? "warnc" : "");
  if (d.refused) add(d.refused, "refused", "warnc");
  if (d.failed) add(d.failed, "failed", "badc");
  if (d.held) add(d.held, "held (failed label)", "warnc");
  box.append(kv);
  const named = d.named || [];
  if (!named.length && !d.skipped) box.append(el("div", "empty", d.candidates ? "everything ready was dispatched" : "nothing ready to dispatch"));
  named.forEach(n => {
    const row = el("div", "skip");
    row.append(el("span", "bead", n.bead || "?"), el("span", "why", n.reason));
    box.append(row);
  });
  if (d.more) box.append(el("div", "empty", "+" + d.more + " more not named in the log line"));
}

// The Escalations pane: the town's open escalation beads, newest first. An
// alert is what the dashboard noticed; an escalation is a bead somebody raised,
// with a severity and a raiser, that stays open until it is closed. Read-only —

const SEV_CLASS = {critical: "sev-critical", high: "sev-high", medium: "sev-medium", low: "sev-low"};
function renderEscalations(s) {
