  // The pane answers "when" as well as "how long ago", for the report it is
  // showing: the latest the hub polled, or the earlier one the reader chose,
  // dated by its own instant so the header always says which is on the pane.
  const shown = rPick ? reportTime(rPick) : new Date(r.written);
  note.className = !rPick && r.overdue ? "r warnc" : "r";
  note.textContent = "written " + age(shown) + " ago" + (!rPick && r.overdue ? " · overdue" : "");
  note.title = shown.toLocaleString();
  // A new report is different text, and so is a reader's switch between two of
  // them: the ids opened in the one before belong to text no longer on the
  // pane, so they close with it.
  const key = rPick || String(r.written);
  if (rKey !== key) { rOpen.clear(); rKey = key; }
  if (rPick) {
    const back = el("div", "rback");
    const b = el("button", "rbead", "← back to latest");
    b.type = "button";
    b.onclick = showLatest;
    back.append(b);
    box.append(back);
  }
  const prefixes = (s.queue && s.queue.prefixes) || {};
  const read = rPick ? rRead[rPick] : null;
  // A report still being read says so, and one that could not be read names
  // that failure: showing the latest under a header that names another report
  // would read as a report that had nothing to say.
  if (rPick && !(read && read.text != null)) {
    box.append(el("div", read && read.error ? "badc" : "empty", read && read.error ? "could not read this report" : "reading…"));
  } else {
    const rep = el("div", "reptext");
    rep.append(...reportNodes(rPick ? read.text : r.text, prefixes));
    box.append(rep);
  }
  // Every open id draws its detail under the report, and a store the reader
  // could not reach reads as the failure it was rather than as an empty pane.
  for (const id of rOpen) {
    const bd = el("div", "rbeadrow");
    bd.append(el("div", "title", id));
    bd.append(detailBlock(rDetail[id] || {loading: true}));
    box.append(bd);
  }
  // The list the reader sends starts at the report above, so the disclosure
  // holds the timestamps that are not the one drawn. Each is a button — its
  // text written through el() — that reads that report in place of the latest.
  const earlier = times.slice(1);
  if (earlier.length) {
    const d = document.createElement("details");
    d.append(el("summary", "title", earlier.length + (earlier.length === 1 ? " earlier report" : " earlier reports")));
    const ul = el("ul", "reptimes");
    for (const t of earlier) {
      const name = reportFile(t);
      const b = el("button", "rtime" + (name === rPick ? " on" : ""), new Date(t).toLocaleString());
      b.type = "button";
      b.title = "read this report";
      b.onclick = () => openReport(name);
      const li = el("li");
      li.append(b);
      ul.append(li);
    }
    d.append(ul);
    box.append(d);
  }
}

// The Deploys block draws the deploy workflows' runs — a release and a
// landing's staging deploy — as repo, ref, commit, state, age and the stages in
// needs order, on one line while the panel is wide enough to hold them and
// wrapped when it is not. A stage name and a ref are a repository's own text,
// so every cell goes through el() and nothing here parses markup.
//
// The chips are the page's own colours for a job state: a stage that ran green,
// a failure the alert red, a running stage the live colour the landing rows
// mark a running landing with, and a stage that did not run (waiting, blocked,
// skipped, cancelled) dim. The chip carries the state's word on its title and
// the glyph of it beside the name, so a row of chips is read at a glance. A run
// nothing has picked up, and one that has not moved, carry the reader's warning
// instead.
const DEPLOY_STAGE = {success: "good", failure: "badc", running: "live", waiting: "sev-low", blocked: "sev-low", skipped: "sev-low", cancelled: "sev-low"};
const DEPLOY_GLYPH = {success: "✓", failure: "✗", running: "◌"};

// The staging workflow, as the reader names the runs of it: a landing deploys
// main to staging, where a release run deploys a v* tag, and the tag beside a
// staging run's ref keeps the two from reading alike.
const DEPLOY_STAGING = "staging.yml";

// The Ref column: the width it holds in the row's font, and the characters a
// staging run's tag spends beside its ref — "staging" at the tag's 11px, plus
// its padding, border and the gap before it. The column is measured from both,
// so neither the ref nor the tag beside it is cut (gt-2h2lx).
const DEPLOY_REF_CH = 13;
const DEPLOY_STAGING_TAG_CH = 9;

function renderDeploys(s) {
  const box = $("deploys"), note = $("deploysnote");
  box.replaceChildren();
  const d = s.deploys;
  // No reader at all is no viewer token, which is the same the Forgejo panel
  // says: both are wired from the one viewer client.
  if (!d) { note.className = "r"; note.textContent = ""; box.append(el("div", "empty", "no viewer token")); return; }
  // The reader names what it could not read — the class of a refresh that read
  // nothing, the repos whose runs failed, and the repos whose scheduled checks
  // it could not fold, which have no row to draw in the block — and the patrol
  // findings above are untouched by any of them.
  const err = d.error || "", unreadable = (d.missing || []).length, unchecked = (d.health_missing || []).length;
  note.className = err || unreadable || unchecked ? "r warnc" : "r";
  note.textContent = err ? "could not read the runs: " + err : [
    unreadable ? unreadable + (unreadable === 1 ? " repo unreadable" : " repos unreadable") : "",
    unchecked ? unchecked + (unchecked === 1 ? " repo's checks unreadable" : " repos' checks unreadable") : "",
  ].filter(Boolean).join(" · ");
  const runs = d.runs || [], health = d.health || [];
  // A block with neither kind of row is still a town with no deploys: the
  // scheduled rows are drawn only where a repo has health runs, so their
  // absence is not something this note has to name.
  if (!runs.length && !health.length) { box.append(el("div", err ? "badc" : "empty", err ? "no deploy runs: " + err : "no deploy runs yet")); return; }
  // The repo column is as wide as the longest name the block lists, plus one
  // character so the rounding of a name that fits does not ellipsize it, and
  // no name is cut to make room for another (gt-1hob8, gt-egffr). The ref
  // column keeps the width it always held, and a staging run's tag rides inside
  // it, so a list holding one takes the tag's own width as well and shows no
  // ref narrower than it would among releases (gt-2h2lx). Every header cell
  // carries its column's class and the header takes the rows' font, since the
  // widths are in ch and a ch is the drawing font's own (gt-egffr). The
  // scheduled rows' app column is measured the same way, from the apps they
  // name, which are not always the repos the runs below name.
  let widest = 0, tags = false, happ = 0;
  for (const r of runs) {
    widest = Math.max(widest, repoShort(r.repo).length);
    tags = tags || r.workflow === DEPLOY_STAGING;
  }
  for (const h of health) happ = Math.max(happ, (h.app || "–").length);
  box.style.setProperty("--drepo", (widest + 1) + "ch");
  box.style.setProperty("--dref", (DEPLOY_REF_CH + (tags ? DEPLOY_STAGING_TAG_CH : 0)) + "ch");
  if (happ) box.style.setProperty("--happ", (happ + 1) + "ch");
  if (runs.length) {
    const head = el("div", "dhead");
    [["Repo", "drepo"], ["Ref", "dref"], ["Commit", "dhash"], ["State", "dstate"], ["Age", "dage"]].forEach(([h, cls]) => head.append(el("span", cls, h)));
    box.append(head);
  }
  for (const r of runs) box.append(deployRow(r));
  // The scheduled checks are the block's other kind of row, under the runs and
  // with a header of their own: one row is an app and an environment folded
  // over the day's checks, not a run, so it has no stages, commit or ref to
  // line up with (gt-t9w60).
  if (health.length) box.append(healthHead());
  for (const h of health) box.append(healthRow(h));
}

// healthHead is the scheduled rows' column names. Every header cell carries its
// column's class, and the header takes the rows' font for the reason the runs'
// header does: the widths are in ch (gt-egffr).
function healthHead() {
  const head = el("div", "hhead");
  [["App", "happ"], ["Environment", "henv"], ["Result", "hstate"], ["Age", "hage"], ["Last green", "hgreen"], ["Passed", "hpass"]].forEach(([h, cls]) => head.append(el("span", cls, h)));
  return head;
}

// One scheduled check's result as the page says it. The API's word is not
// enough: a run whose check was skipped because the app is off is "off on
// purpose" — the deployment was not tested, so it is not green and never reads
// as one — and a run the reader could not read says that rather than leaving a
// blank that reads as a clean pass.
const HEALTH_RESULT = {success: "green", failure: "failed", skipped: "off on purpose"};

// Only a pass and a failure carry a colour. Every other word — running,
// blocked, cancelled, off on purpose, not read — is the column's own dim,
// which is the rule that keeps a check nobody ran from reading as a check that
// passed.
const HEALTH_RESULT_CLASS = {success: "good", failure: "badc"};

function healthResult(h) {
  const raw = h.status || "";
  return HEALTH_RESULT[raw] || raw || "–";
}

// healthRow is one app's scheduled check in one environment: the app and the
// environment, the newest result and how long ago it ran, when this
// environment was last green, and how many of the window's runs it passed. The
// row links the newest run the way a deploy row links its run; a row the reader
// could not read has no run to send the operator to and says so.
function healthRow(h) {
  const row = h.url ? el("a", "hrow") : el("div", "hrow");
  if (h.url) { row.href = h.url; row.target = "_blank"; row.rel = "noopener"; row.title = h.url; }
  const app = el("span", "happ", h.app || "–");
  if (app.textContent !== h.repo) app.title = h.repo;
  const result = el("span", "hstate " + (HEALTH_RESULT_CLASS[h.status] || "title"), h.unread ? "not read" : healthResult(h));
  // The API's own word stays on the title where the page words it another way,
  // so an operator reading "off on purpose" can see the run itself was skipped.
  if (h.status && result.textContent !== h.status) result.title = h.status;
  const green = el("span", "hgreen", h.last_green ? age(h.last_green) + " ago" : "–");
  if (!h.last_green) green.title = "not green in the runs the reader read";
  // The count is over the runs the reader read the window for. The runs it could
  // not read carry this environment's job or not — the block cannot tell — so
  // they are neither passed nor failed, and they are said beside the count
  // rather than dropped from it.
  const passes = el("span", "hpass", (h.runs ? h.passed + "/" + h.runs : "–") + (h.not_read ? " +" + h.not_read : ""));
  if (h.not_read) passes.title = h.not_read + (h.not_read === 1 ? " run of the window was not read" : " runs of the window were not read");
  row.append(app, el("span", "henv", h.env || "–"), result,
    el("span", "hage", h.at ? age(h.at) : "–"), green, passes);
  return row;
}

// deployRow is one run: the repo, ref, commit, state and age on one line, the
// stages after them while they fit on that line, and the reader's warning under
// it. The row itself is the run's link, so the run the operator is reading is
// the one they open; a run the reader kept no URL for is the same row unlinked
// rather than a link to nowhere. The repo cell shows the shortened name with
// the whole one on its title, the way the Actions rows name a repo. A staging
// run's ref is the branch the landing deployed (main), where a release's is a
// tag, so the ref cell carries the dim tag that names the kind (gt-2h2lx).
function deployRow(r) {
  const row = r.url ? el("a", "drow") : el("div", "drow");
  if (r.url) { row.href = r.url; row.target = "_blank"; row.rel = "noopener"; row.title = r.url; }
  const repo = el("span", "drepo", repoShort(r.repo));
  if (repo.textContent !== r.repo) repo.title = r.repo;
  const ref = el("span", "dref", r.ref || "–");
  if (r.workflow === DEPLOY_STAGING) {
    const g = el("span", "tag", "staging");
    g.title = "the staging workflow's run: a landing deployed " + (r.ref || "main") + " to staging, not a release";
    ref.append(g);
  }
  const state = el("span", "dstate", deployState(r));
  // The cell says running for a run that is moving; the API's own word stays
  // on its title, since that is the status the reader inferred the run's
  // trouble from (gt-egffr).
  if (state.textContent !== (r.status || "–")) state.title = r.status;
  row.append(repo, ref, el("span", "dhash", r.hash || "–"), state, el("span", "dage", r.at ? age(r.at) : "–"), deployStages(r));
  if (r.warn) row.append(el("span", "dwarn warnc", r.warn));
  return row;
}

// deployState is the State cell's word. Forgejo calls a run "blocked" in the
// moment between one job finishing and the next being picked up, so a run the
// API calls blocked or waiting with a stage already succeeded or running is a
// run that is moving: the cell says running. A run no stage has started in is
// still waiting for its first stage and says what the API said (gt-egffr).
const DEPLOY_MOVING = {blocked: true, waiting: true};
const DEPLOY_STARTED = {success: true, running: true};

function deployState(r) {
  const raw = r.status || "–";
  if (!DEPLOY_MOVING[raw]) return raw;
  return (r.stages || []).some(st => DEPLOY_STARTED[st.status]) ? "running" : raw;
}

// The stage cell: one chip per stage, in the order the reader sorted the jobs'
// needs into, each carrying its name and the glyph of the state the API
// reported, with the state's own word on the chip's title. A run the reader
// asked for jobs of and could not have says so rather than drawing a blank the
// operator would read as a run with no stages; one past the job-fetch cap
// draws nothing, since a line on every capped row doubles the block's height
// for a stage list nobody can be shown (gt-egffr).
function deployStages(r) {
  const cell = el("span", "dstage");
  const stages = r.stages || [];
  if (!stages.length) {
    if (r.stages_unread) { cell.className += " title"; cell.textContent = "stages not read"; }
    else if (!r.stages_skipped) cell.textContent = "–";
    return cell;
  }
  for (const st of stages) {
    const chip = el("span", "tag " + (DEPLOY_STAGE[st.status] || "sev-low"), (st.name || "–") + " " + (DEPLOY_GLYPH[st.status] || "–"));
    chip.title = (st.name || "–") + " " + (st.status || "?");
    cell.append(chip);
  }
  return cell;
}

// One compact line per sweep: when, which rig and sha, a verdict per tier, and
// how long the whole cycle took. A tier the sweep did not run is left blank, and
// a RED one carries the failing units its rig's record still holds.
const TIERSWEEP_TIERS = ["shell", "integration", "race"];

// The When column's reading of a sweep's stamp, shared with the icon's tooltip
// so the two cannot disagree about which sweep a verdict came from.
function sweepWhen(at) {
  const d = new Date(at);
  return d.toDateString() === new Date().toDateString() ? clock(at).slice(0, 5) : d.toLocaleDateString([], {month: "short", day: "numeric"}) + " " + clock(at).slice(0, 5);
}

// Each tier's most recent verdict, keyed by tier. This is the rule the daemon's
// attention list holds to (internal/daemon/attention.go): a tier a sweep did
// not run keeps the result of the sweep that last did, so a newer shell-only
// GREEN cannot hide an integration RED still standing. The first row naming a
// tier wins because the reader hands them over newest first
// (dashboard_tier_sweep.go recent()).
function tierSweepLatest(sweeps) {
  const latest = {};
  for (const row of sweeps || []) (row.stages || []).forEach(x => { if (!latest[x.tier]) latest[x.tier] = {verdict: x.verdict, at: row.at}; });
  return latest;
}

// The pane's title icon, the one verdict a collapsed pane still shows. Green
// needs every tier's most recent result GREEN and red needs one RED; a tier
// that has never reported leaves it neutral, because an unknown result is
// neither. A sweep in flight is not a verdict (gt-5qk83).
function tierSweepIcon(ts) {
  const none = {glyph: "–", cls: "", title: "no tier sweep results"};
  if (!ts) return none;
  if (ts.unavailable) return {glyph: "–", cls: "", title: "the daemon log could not be read"};
  if (!(ts.sweeps || []).length) return none;
  const latest = tierSweepLatest(ts.sweeps);
  const title = TIERSWEEP_TIERS.map(tier => { const v = latest[tier]; return tier + " " + (v ? v.verdict + " " + sweepWhen(v.at) : "–"); }).join(", ");
  // RED first: one red tier outranks any number of greens.
  if (TIERSWEEP_TIERS.some(tier => latest[tier] && latest[tier].verdict === "RED")) return {glyph: "✗", cls: "badc", title};
  if (TIERSWEEP_TIERS.every(tier => latest[tier] && latest[tier].verdict === "GREEN")) return {glyph: "✓", cls: "good", title};
  return {glyph: "–", cls: "", title};
}

// The neutral state carries no colour class of its own, so the dash takes the
// h2's muted tone. Green and red reuse the page's good and badc tokens, which
// keeps colour from being the only carrier of the verdict.
function paintTierIcon(ts) {
  const ico = $("tiersweepico");
  if (!ico) return;
  const v = tierSweepIcon(ts);
  ico.textContent = v.glyph;
  ico.className = "sweepico" + (v.cls ? " " + v.cls : "");
  ico.title = v.title;
}

function renderTierSweep(s) {
  const box = $("tiersweep");
  box.replaceChildren();
  const ts = s.tiersweep;
  // Painted ahead of the empty paths' returns, so an unreadable log reads as
  // nothing known rather than as a stale green.
  paintTierIcon(ts);
  if (!ts) { box.append(el("div", "empty", "reading the daemon log…")); $("tiersweepnote").textContent = ""; return; }
  if (ts.unavailable) { box.append(el("div", "badc", "unavailable: the daemon log could not be read")); $("tiersweepnote").textContent = ""; return; }
  const kv = el("div", "kv");
  const run = ts.running;
  const st = el("div");
  // The cycle's own stage list when the daemon logged one; an older log gives
  // only the stage the fallback inferred.
  if (run) {
    const stages = (run.tiers && run.tiers.length) ? run.tiers.join(", ") : run.tier;
    st.append(el("b", "good", "running"), el("span", "", run.rig + " · " + stages + " · " + fmtDur((Date.now() - new Date(run.since).getTime()) / 1000)));
  } else st.append(el("b", "", "idle"), el("span", "", "no sweep is running"));
  kv.append(st);
  box.append(kv);
  const rows = ts.sweeps || [];
  if (!rows.length) { box.append(el("div", "empty", "no sweeps in the daemon log")); $("tiersweepnote").textContent = ""; return; }
  const t = el("table");
  const hr = el("tr");
  [["When"], ["Rig"], ["Sha"], ...TIERSWEEP_TIERS.map(x => [x]), ["Total", "the whole cycle, every stage the sweep ran", 1]].forEach(([h, tip, num]) => { const th = el("th", num ? "n" : "", h); if (tip) th.title = tip; hr.append(th); });
  t.append(hr);
  for (const row of rows) {
    const tr = el("tr");
    tr.append(el("td", "title", sweepWhen(row.at)));
    tr.append(el("td", "", row.rig));
    tr.append(el("td", "title", row.sha || "–"));
    const by = {};
    (row.stages || []).forEach(x => by[x.tier] = x);
    TIERSWEEP_TIERS.forEach(tier => {
      const v = by[tier];
      if (!v) { tr.append(el("td", "title", "–")); return; }
      const cell = el("td", v.verdict === "RED" ? "badc" : v.verdict === "GREEN" ? "good" : "", v.verdict);
      if ((v.failed || []).length) cell.title = "failed: " + v.failed.join(", ");
      tr.append(cell);
    });
    tr.append(el("td", "n", row.secs == null ? "–" : fmtDur(row.secs)));
    t.append(tr);
  }
  box.append(t);
  // The newest RED the record still explains, named under the table so it reads
  // without a hover.
  const newest = rows[0];
  (newest.stages || []).filter(x => x.verdict === "RED" && (x.failed || []).length).forEach(x => {
    box.append(el("div", "badc title", newest.rig + " " + x.tier + " RED: " + x.failed.join(", ")));
  });
  $("tiersweepnote").textContent = rows.length + " sweeps · last " + fmtDur((Date.now() - new Date(newest.at).getTime()) / 1000) + " ago";
}

// The Actions section's status colours, reusing the page's own tokens: success
// green, failure red, one still waiting or running amber, cancelled or skipped
// muted. A status the page has never seen stays muted rather than guessing.
const ACT_CLASS = {success: "act-success", failure: "act-failure", running: "act-running", waiting: "act-waiting", blocked: "act-blocked", cancelled: "act-cancelled", skipped: "act-skipped"};

// secsSince is how long ago an RFC3339 stamp is, or null when it is absent or
// unreadable; fmtDur renders null as "–".
function secsSince(iso) {
  if (!iso) return null;
  const t = Date.parse(iso);
  return isNaN(t) ? null : (Date.now() - t) / 1000;
}

// actsSum is the section's one line: what is running or queued, then how the
// newest completed runs went. The tally counts the runs the stats were taken
// over — the newest twenty completed — so its denominator is what was scored,
// not the whole history; a window of nothing but cancelled or skipped runs
// reads "none" rather than pretending a zero.
function actsSum(a) {
  const st = a.stats || {};
  const ok = st.ok || 0, failed = st.failed || 0, scored = ok + failed;
  const tally = [];
  if (ok) tally.push(ok + " ok");
  if (failed) tally.push(failed + " failed");
  const parts = [(st.running || 0) + " running", (st.queued || 0) + " queued"];
  parts.push(scored ? "last " + scored + ": " + (tally.length ? tally.join(" ") : "none") : "no completed runs");
  if (scored && st.median_secs > 0) parts.push("median " + fmtDur(st.median_secs));
  const unreadable = a.errors || [];
  if (unreadable.length) parts.push(unreadable.length + " unreadable");
  return parts.join(" · ");
}

// repoShort is what the repo cell shows: the part after the last "/", because
// the owner is the same for every run the panel reads and the name is the part
// that tells rigs apart. A name already without an owner, and a trailing slash
// with nothing after it, come back as they came — never empty (gt-fn9e6.54).
function repoShort(name) {
  const s = name || "";
  const cut = s.lastIndexOf("/");
  const short = cut >= 0 ? s.slice(cut + 1) : s;
  return short || s;
}

// actCommit is the row's commit cell: the hash of the commit the run tested,
// cut to the eight characters the Actions page shows, and the run's number
// beside it ("645edaf6 #20"). The hash opens the run in a new tab, so a row can
// be matched to a commit on main and opened without hunting the pane. A run the
// API sent no sha for leaves the cell empty rather than a link to nowhere; one
// with no URL shows the same text unlinked.
function actCommit(a) {
  const cell = el("span", "acommit");
  const hash = a.hash || "";
  if (!hash) return cell;
  const text = hash + (a.number ? " #" + a.number : "");
  if (!a.url) { cell.textContent = text; return cell; }
  const link = el("a", "", text);
  link.href = a.url;
  link.target = "_blank";
  link.rel = "noopener";
  cell.append(link);
  return cell;
}

// actPolecat is the row's polecat cell: who built the landing, read off the
// branch the run's title names ("land: polecat/obsidian/gt-xvw20+..."). The
// column is a fixed width, so a run whose title names no polecat — a push, a
// probe — draws nothing there without shifting the columns after it. The name
// is truncated to the column and the whole of it rides on the cell's title.
function actPolecat(a) {
  const cell = el("span", "apolecat", a.polecat || "");
  if (a.polecat) cell.title = a.polecat;
  return cell;
}

// actRow is one compact action line: status dot, repo, bead, polecat, commit,
// how long the run took, and how long ago it finished. A run still going shows
// its elapsed in place of the duration, ticking from its start — the start is
// its only stamp, so the age cell stays empty rather than repeating that
// number; a run that has not started has neither stamp and leaves both time
// cells blank. Each cell is one line with the whole value in its title, and the
// row's title carries the line the columns ellipsized.
function actRow(a) {
  const st = a.status || "";
  const running = st === "running";
  const row = el("div", "actsrow" + (st === "failure" ? " act-failure" : ""));
  const dot = el("span", "adot " + (ACT_CLASS[st] || ""));
  dot.title = st || "unknown status";
  const repo = repoShort(a.repo);
  const repoCell = el("span", "arepo", repo);
  // The shortened cell is the one whose text no longer says which owner the
  // repo came from, so it alone carries the full name on hover.
  if (repo !== (a.repo || "")) repoCell.title = a.repo;
  row.append(dot, repoCell, el("span", "abead", a.bead || ""), actPolecat(a), actCommit(a));
  const took = el("span", "an", running || a.started ? fmtDur(running ? secsSince(a.started) : a.duration_secs) : "");
  if (running && a.started) { took.dataset.since = a.started; took.title = "running for " + fmtDur(secsSince(a.started)); }
  else took.title = a.started ? "ran " + fmtDur(a.duration_secs) : "not started";
  row.append(took);
  const ago = el("span", "an", a.stopped ? fmtDur(secsSince(a.stopped)) : "");
  if (a.stopped) { ago.dataset.since = a.stopped; ago.title = "finished " + fmtDur(secsSince(a.stopped)) + " ago"; }
  row.append(ago);
  row.title = (a.repo || "") + " " + (a.bead || "") + " · " + (st || "unknown") + (a.event ? " (" + a.event + ")" : "") + (a.sha ? "\n" + a.sha : "") + (a.url ? "\n" + a.url : "");
  return row;
}

// renderForgejoActs draws the Actions section above the feed: the stats line,
// the runs still queued or running (or a muted idle line when there are none),
// a thin divider, then the newest completed. It is left out entirely when the
// server sends no actions — an older server, or a reader that has nothing to
// report — and then the pane is the feed it was before (gt-fn9e6.48).
function renderForgejoActs(a) {
  const box = $("forgejoacts");
  box.replaceChildren();
  if (!a) return;
  const wrap = el("div", "acts");
  const sum = el("div", "actssum", actsSum(a));
  if ((a.errors || []).length) sum.title = "runs unreadable in: " + a.errors.join(", ");
  wrap.append(sum);
  const current = a.current || [], recent = a.recent || [];
  if (current.length) current.forEach(r => wrap.append(actRow(r)));
  else wrap.append(el("div", "actsidle", "idle"));
  if (recent.length) { wrap.append(el("div", "actdiv")); recent.forEach(r => wrap.append(actRow(r))); }
  box.append(wrap);
}

// The Forgejo panel is a tail like the feed: one line per event, oldest first,
// following its own end. Where it was scrolled is read before the lines are
// replaced, so a reader who has scrolled up keeps their place and following
// resumes on its own once they come back to the bottom.
function renderForgejo(s) {
  const box = $("forgejo");
  const follow = box.scrollHeight - box.scrollTop - box.clientHeight <= 4;
  box.replaceChildren();
  $("forgejonote").textContent = "";
  $("forgejonote").className = "r";
  const f = s.forgejo;
  if (!f) { renderForgejoActs(null); feedCount = null; foldFeed(false); box.append(el("div", "empty", "no viewer token")); return; }
  renderForgejoActs(f.actions);
  const events = f.events || [];
  feedCount = events.length;
  foldFeed(!!f.actions);
  // A repo the viewer's token cannot read is named: silently reading a subset is
  // how a rig's landings went missing with no error anywhere (gt-faml5).
  const missing = f.missing || [];
  if (missing.length) box.append(el("div", "badc title", "not readable by the viewer: " + missing.join(", ")));
  if (!events.length) {
    if (!missing.length) { box.append(el("div", f.error ? "badc" : "empty", f.error ? "unavailable: " + f.error : "no activity")); return; }
  } else {
    const today = new Date().toDateString();
    for (const e of events) {
      const when = new Date(e.at);
      const stamp = when.toDateString() === today ? clock(e.at).slice(0, 5) : when.toLocaleDateString([], {month: "short", day: "numeric"});
      const row = el("div", "fev");
      row.append(el("span", "t", stamp), el("span", "a", e.actor), el("span", "s", e.summary), el("span", "rp", e.repo));
      box.append(row);
    }
  }
  // The note ages the SNAPSHOT, not the newest event. A quiet repo's feed is
  // current with its newest event hours old, and a frozen pane is the other way
  // round, so the event's age cannot tell them apart (gt-faml5).
  const read = Date.parse(f.at || "");
  const every = f.every_seconds || 0;
  const age = read > 0 ? (Date.now() - read) / 1000 : null;
  const stale = age != null && every > 0 && age > 2 * every;
  let note = (f.error ? "stale (" + f.error + ") · " : "") + events.length + " events";
  if (age != null) note += " · snapshot " + fmtDur(age) + " old";
  if (stale) note += " · STALE";
  $("forgejonote").textContent = note;
  if (stale) $("forgejonote").className = "r badc";
  if (follow) box.scrollTop = box.scrollHeight;
}

function renderSpend(s) {
  const box = $("spend");
  box.replaceChildren();
  const d = s.spend;
  const r = readOf(s, "spend");
  paintsRead(box, $("spendnote"), r);
  // No spend command is configured at all — no reader, so no status either —
  // which is not the same as one that failed or has not answered yet (gt-q6h8e).
  if (!d) { box.append(el("div", "empty", r ? "unavailable — the spend read failed" : "no spend report")); $("spendnote").textContent = ""; return; }
  const live = d.live || {};
  const kv = el("div", "kv");
  const add = (v, k, cls) => { const x = el("div"); x.append(el("b", cls || "", v), el("span", "", k)); kv.append(x); };
  add(money(d.balance), "balance", live.available === false ? "badc" : "");
  // Spent is the sum of the sampled drops from ledger_since; only a report with
  // no ledger total falls back to spent_total.
  if (d.spent_ledger != null) {
    const since = /^\d{4}-\d{2}-\d{2}/.exec(String(d.ledger_since || ""));
    add(money(d.spent_ledger), "spent (sampled" + (since ? " since " + since[0] : "") + ")");
  } else add(money(d.spent_total), "spent since top-up");
  add(d.pace_1h ? money(d.pace_1h.per_hour) + "/h" : "–", "last 1h");
  add(d.pace_24h ? money(d.pace_24h.per_hour) + "/h" : "–", "last 24h");
  const rw = d.runway_days_at_24h_pace;
  add(rw == null ? "–" : rw.toFixed(1) + "d", "runway", rw != null && rw < 3 ? "badc" : rw != null && rw < 7 ? "warnc" : "");
  box.append(kv);
  // Cash vs credit under the balance, so granted credit is not read as money
  // paid in. Both fields are needed; a report without them gets no line.
  if (d.cash != null && d.credit != null) {
    box.append(el("div", "title", money(d.cash) + " cash + " + money(d.credit) + " credit"));
    const cr = d.credit_runway_days_at_24h_pace;
    if (d.credit > 0 && cr != null) box.append(el("div", "title", "credit lasts ~" + cr.toFixed(1) + "d, then cash"));
  }
  // One dim line of the last few days instead of a table, to keep the panel short.
  // A negative day is a balance rise; the credits line below says of what kind.
  const days = Object.entries(d.per_day || {}).slice(-4).reverse();
  if (days.length) {
    box.append(el("div", "title", days.map(([day, v]) => day.slice(5) + " " + (v.spent < 0 ? "+" + money(-v.spent) + " added" : money(v.spent))).join(" · ")));
  }
  // The last balance rises, each with what the report made of it.
  const creditText = c => {
    const kind = { "credit": " credit", "top-up": " top-up", "credit+top-up": " credit + top-up" }[c.kind];
    return String(c.at || "").slice(5, 16).replace("T", " ") + " +" + money(c.amount) + (kind || " added");
  };
  const credits = Array.isArray(d.credits) ? d.credits.slice().reverse() : [];
  if (credits.length) box.append(el("div", "title", credits.map(creditText).join(" · ")));
  const alerts = d.alerts || [];
  if (live.ok === false) box.append(el("div", "badc", "live balance unreachable; showing the ledger"));
  if (d.watcher_pid == null || d.watcher_pid === "") box.append(el("div", "badc", "spend watcher is not running"));
  $("spendnote").textContent = readCaption(r, [d.last_sample ? "ledger " + d.last_sample.replace("T", " ") : null, r && r.ageSec != null ? "read " + fmtDur(r.ageSec) + " ago" : null]);
}

function sec(v) { return v == null ? "–" : fmtDur(v); }
function renderOM(s) {
  const box = $("om");
  box.replaceChildren();
  const om = s.om;
  const r = readOf(s, "om");
  paintsRead(box, $("omnote"), r);
  if (!om) {
    // A read that has failed says so; only a read that has not happened yet is
    // still "reading…" (gt-q6h8e).
    box.append(el("div", "empty", r ? "unavailable — the om records could not be read" : "reading the landings and the daemon log…"));
    $("omnote").textContent = "";
    return;
  }
  $("omnote").textContent = readCaption(r, [om.model, om.depth, om.threshold != null ? "threshold " + om.threshold + (om.threshold_source ? " (" + om.threshold_source + ")" : "") : (om.threshold_source ? "threshold unknown (" + om.threshold_source + ")" : null), om.timeout_s ? om.timeout_s + "s timeout" : null, r && r.ageSec != null ? "read " + fmtDur(r.ageSec) + " ago" : null]);

  // Running now, then the last five om ran, above both folds. A server that
  // sends neither list draws neither block.
  const cell = (tr, cls, text, title) => { const c = el("td", cls, text); if (title) c.title = title; tr.append(c); };
  const running = Array.isArray(om.running) ? om.running : [];
  if (running.length) {
    box.append(el("div", "k title", "running now"));
    const runT = el("table");
    for (const x of running) {
      const tr = el("tr");
      if (!x || typeof x !== "object") { cell(tr, "warnc", "unparsed"); runT.append(tr); continue; }
      cell(tr, x.bead ? "bead" : "title", x.bead || "unknown bead");
      cell(tr, "", x.rig || "–");
      cell(tr, "", x.polecat || "–");
      const took = el("td", "n", fmtDur(secsSince(x.started)));
      if (x.started) { took.dataset.since = x.started; took.title = "running since " + x.started; }
      tr.append(took);
      const shas = x.base || x.head ? String(x.base || "").slice(0, 7) + ".." + String(x.head || "").slice(0, 7) : "–";
      cell(tr, "title", shas, (x.base || "") + ".." + (x.head || ""));
      runT.append(tr);
    }
    box.append(runT);
  }
  const last = Array.isArray(om.last) ? om.last : [];
  if (last.length) {
    box.append(el("div", "k title", "last " + last.length + " om ran"));
    const lt = el("table");
    for (const x of last) {
      const tr = el("tr");
      if (!x || typeof x !== "object" || !x.bead || !x.outcome || isNaN(Date.parse(x.at))) {
        cell(tr, "warnc", "unparsed");
        lt.append(tr);
        continue;
      }
      cell(tr, "title", clock(x.at), x.at);
      cell(tr, "bead", x.bead);
      cell(tr, "", x.rig || "–");
      cell(tr, x.outcome === "rejected" ? "badc" : x.outcome === "error" ? "warnc" : "", x.outcome === "rejected" && x.kind ? "rejected · " + x.kind : x.outcome, x.detail || "");
      cell(tr, "n", typeof x.score === "number" ? x.score.toFixed(2) : "–");
      cell(tr, "n", sec(x.secs));
      cell(tr, "title", x.route || "–");
      lt.append(tr);
    }
    box.append(lt);
  }

  // fold builds one section the way the polecats panel builds its idle line: a
  // details element whose open state lives in a module variable, so the redraw
  // that rebuilds it puts it back as the viewer left it.
  const fold = (title, isOpen, setOpen, ...kids) => {
    const d = document.createElement("details");
    d.open = isOpen;
    d.ontoggle = () => { setOpen(d.open); saveOMOpen(); };
    d.append(el("summary", "title", title), ...kids);
    box.append(d);
  };

  // Stats: the windows table and the rejected, routes and risk-paths chips.
  const wins = om.windows || [];
  const day = wins.find(w => w.label === "24h") || wins[0];
  const t = el("table");
  const hr = el("tr");
  ["", "Landed", "Approved", "No review", "Errors", "Rejected", "Avg score", "om median", "om p95"].forEach((x, i) => hr.append(el("th", i ? "n" : "", x)));
  t.append(hr);
  for (const w of wins) {
    const tr = el("tr");
    tr.append(el("td", "", w.label));
    const rej = w.rejected, err = w.errors;
    [w.landed, w.approved, w.skipped, err, rej].forEach((v, i) => tr.append(el("td", "n" + (i === 3 && v ? " warnc" : "") + (i === 4 && v ? " badc" : ""), String(v))));
    tr.append(el("td", "n", w.avg_score == null ? "–" : w.avg_score.toFixed(2)), el("td", "n", sec(w.median_secs)), el("td", "n" + (w.p95_secs > 240 ? " warnc" : ""), sec(w.p95_secs)));
    t.append(tr);
  }
  const meta = el("div", "", "");
  meta.style.margin = "8px 0";
  const rj = Object.entries(om.rejects || {}).sort((a, b) => b[1] - a[1]);
  meta.append(el("span", "title", "rejected: "));
  if (!rj.length) meta.append(el("span", "", "none"));
  rj.forEach(([k, n]) => meta.append(el("span", "tag", k + " " + n)));
  const rt = Object.entries(om.routes || {}).sort((a, b) => b[1] - a[1]);
  meta.append(document.createElement("br"), el("span", "title", "routes: "));
  rt.forEach(([k, n]) => meta.append(el("span", "tag", k + " " + n)));
  if (om.risk_paths) meta.append(document.createElement("br"), el("span", "title", "touched risk paths: "), el("span", "warnc", om.risk_paths + " landings"));
  fold("Stats" + (day ? " · " + day.label + ": " + day.landed + " landed, " + day.rejected + " rejected" : ""), openOMStats, v => { openOMStats = v; }, t, meta);

  // Scores: the score histogram (approvals and review rejections by decile; red
  // below the threshold) and the by-day table.
  const scores = om.scores || [];
  const max = Math.max(1, ...scores);
  const bars = el("div", "bars");
  scores.forEach((n, i) => {
    const b = el("i", om.threshold != null && (i + 1) / 10 <= om.threshold ? "low" : "");
    b.style.height = (n / max * 100) + "%";
    b.title = (i / 10).toFixed(1) + "–" + ((i + 1) / 10).toFixed(1) + ": " + n;
    bars.append(b);
  });
  if (om.threshold != null) { const th = el("div", "thr"); th.style.left = (om.threshold * 100) + "%"; bars.append(th); }
  const kd = el("div", "k title", "score distribution (approvals + review rejections)");
  const axis = el("div", "axis"); ["0.0", "0.5", "1.0"].forEach(x => axis.append(el("span", "", x)));
  const scoreKids = [kd, bars, axis];
  const days = om.days || [];
  if (days.length) {
    const dt = el("table");
    const dh = el("tr");
    ["Day", "", "om avg"].forEach((x, i) => dh.append(el("th", i === 2 ? "n" : "", x)));
    dt.append(dh);
    const dmax = Math.max(1, ...days.map(d => d.approved + d.skipped + d.errors + d.rejected));
    for (const d of days) {
      const tr = el("tr");
      tr.append(el("td", "", d.day));
      const td = el("td"); const st = el("div", "stack"); st.style.width = ((d.approved + d.skipped + d.errors + d.rejected) / dmax * 100) + "%";
      [["sa", d.approved], ["ss", d.skipped], ["se", d.errors], ["sr", d.rejected]].forEach(([c, n]) => { if (n) { const i = el("i", c); i.style.flex = n; i.title = c + " " + n; st.append(i); } });
      td.append(st); tr.append(td);
      const lbl = d.approved + " ok" + (d.skipped ? " · " + d.skipped + " manual" : "") + (d.errors ? " · " + d.errors + " err" : "") + (d.rejected ? " · " + d.rejected + " rej" : "");
      td.append(el("div", "title", lbl));
      tr.append(el("td", "n", sec(d.avg_secs)));
      dt.append(tr);
    }
    scoreKids.push(el("div", "k title", "by day"), dt);
  }
  const scored = day && day.avg_score != null ? day : wins.find(w => w.avg_score != null);
  fold("Scores" + (scored ? " · avg " + scored.avg_score.toFixed(2) : ""), openOMScores, v => { openOMScores = v; }, ...scoreKids);
}

function renderDispatch(s) {
  const box = $("disp");
  box.replaceChildren();
  const d = s.dispatch;
  if (!d) { box.append(el("div", "empty", "no dispatcher tick in the daemon log yet")); $("dispnote").textContent = ""; return; }
  const ageSec = (Date.now() - new Date(d.at).getTime()) / 1000;
  const stale = ageSec > 300;
  $("dispnote").textContent = "last tick " + fmtDur(ageSec) + " ago";
  $("dispnote").className = "r" + (stale ? " badc" : ageSec > 150 ? " warnc" : "");
  if (stale) box.append(el("div", "badc", "⚠ the dispatcher has not ticked for " + fmtDur(ageSec) + " (it ticks every minute)"));
  const kv = el("div", "kv");
  const add = (v, k, cls) => { const x = el("div"); x.append(el("b", cls || "", String(v)), el("span", "", k)); kv.append(x); };
  add(d.roster || "–", "roster");
  add(d.candidates, "candidates");
  add(d.dispatched, "dispatched", d.dispatched ? "good" : "");
  add(d.skipped, "skipped", d.skipped ? "warnc" : "");
  if (d.refused) add(d.refused, "refused", "warnc");
  if (d.failed) add(d.failed, "failed", "badc");
  if (d.held) add(d.held, "held (failed label)", "warnc");
  box.append(kv);
  const named = d.named || [];
  if (!named.length && !d.skipped) box.append(el("div", "empty", d.candidates ? "everything ready was dispatched" : "nothing ready to dispatch"));
  named.forEach(n => {
    const row = el("div", "skip");
    row.append(el("span", "bead", n.bead || "?"), el("span", "why", n.reason));
    box.append(row);
  });
  if (d.more) box.append(el("div", "empty", "+" + d.more + " more not named in the log line"));
}

// A question that has waited four hours is the one the header marks, in the
// amber the page carries for every other stale reading.
const QUESTION_OLDEST_SEC = 4 * 3600;

// The Questions pane: what the overseer has filed for Sloan, most urgent first
// and, at one priority, the longest wait first, so what can stop the town is
// the first thing he reads. Each card carries the question, its priority and
// effort tag, the answer the overseer recommends, the work it holds up,
// whether Sloan has answered it, and the line that answers it.
//
// Every cell goes through el(), which writes textContent: the question and the
// recommended answer are the overseer's own words, and a tag in them shows as
// that text and never as markup. The pane writes nothing — the answer is gt answer,
// a comment on the bead, from a terminal.
function renderQuestions(s) {
  const box = $("questions"), note = $("questionsnote");
  box.replaceChildren();
  const q = s.questions;
  if (!q) { note.className = "r"; note.textContent = ""; box.append(el("div", "empty", "reading…")); return; }
  // A read that failed is a named state, never an empty pane: "the overseer has
  // asked nothing" and "the questions could not be read" must not look alike.
  if (q.unavailable) { note.className = "r"; note.textContent = ""; box.append(el("div", "badc", "unavailable: questions could not be read")); return; }
  const rows = q.rows || [];
  // The header names the count and, past four hours, how long the oldest
  // question has waited, in the amber the page marks every other stale reading
  // with.
  const ages = rows.map(r => r.age_sec).filter(a => a != null);
  const oldest = ages.length ? Math.max(...ages) : null;
  const stale = oldest != null && oldest > QUESTION_OLDEST_SEC;
  note.className = stale ? "r warnc" : "r";
  note.textContent = rows.length
    ? rows.length + (q.more ? " of " + (rows.length + q.more) : "") + " open" + (stale ? " · oldest " + fmtDur(oldest) : "")
    : "";
  if (!rows.length) { box.append(el("div", "empty", "none open")); return; }
  for (const r of rows) box.append(questionCard(r));
  if (q.more) box.append(el("div", "empty", "+" + q.more + " more"));
}

// questionCard is one question. The state is the reader's own word: awaiting
// you while the newest comment is the overseer's, answered, overseer acting
// once Sloan has replied. The command line is the page's whole answer path.
function questionCard(r) {
  const c = el("div", "qcard");
  const head = el("div", "chead");
  head.append(el("span", "bead", r.id));
  head.append(el("span", "title", r.title || ""));
  // The priority is why a card is where it is in the pane, so it is drawn, and
  // P0 and P1 in the amber the page marks what wants attention with.
  head.append(el("span", r.priority <= 1 ? "qpri warnc" : "qpri", "P" + r.priority));
  if (r.effort) head.append(el("span", "qeffort", r.effort));
  if (r.age_sec != null) head.append(el("span", "qage", fmtDur(r.age_sec)));
  head.append(el("span", "qstate", r.state === "answered" ? "answered, overseer acting" : "awaiting you"));
  c.append(head);
  if (r.question) c.append(el("div", "qtext", r.question));
  if (r.recommended) c.append(el("div", "qrec", "Recommended: " + r.recommended));
  if ((r.held || []).length) c.append(el("div", "qheld", "Held: " + r.held.join(", ")));
  if (r.malformed) c.append(el("div", "badc", "the bead's description has no question and recommended answer"));
  c.append(el("div", "qcmd", 'gt answer ' + r.id + ' "<answer>"'));
  return c;
}

// The Overseer pane: whether the overseer session is alive, what it has done
// lately and what it does most. The status is the reader's own word, judged
// against the silence window the daemon's silent-overseer rule uses, so the
// pane and the push agree on when the overseer went quiet. Read-only: the
// overseer writes its heartbeat and journal with gt overseer beat and log.
//
// Every cell goes through el(), which writes textContent: a journal line is the
// overseer's own text and shows as that text, never as markup.
function renderOverseer(s) {
  const box = $("overseer"), note = $("overseernote");
  box.replaceChildren();
  const o = s.overseer;
  note.className = "r"; note.textContent = "";
  if (!o) { box.append(el("div", "empty", "reading…")); return; }
  // A read that failed is a named state: "the overseer is silent" and "its
  // files could not be read" must not look alike.
  if (o.unavailable) { box.append(el("div", "badc", "unavailable: the overseer's heartbeat or journal could not be read")); return; }
  const head = el("div", "kv");
  const cell = el("div");
  const alive = o.status === "alive";
  cell.append(el("b", alive ? "good" : "warnc", o.status === "none" ? "no heartbeat" : o.status));
  cell.append(el("span", "", o.last_active_sec != null ? "last active " + fmtDur(o.last_active_sec) + " ago" : "has never beaten"));
  head.append(cell);
  if (o.state) { const c = el("div"); c.append(el("b", "", o.state), el("span", "", "state")); head.append(c); }
  if (o.open_questions != null) { const c = el("div"); c.append(el("b", "", String(o.open_questions)), el("span", "", "open questions")); head.append(c); }
  box.append(head);
  note.className = alive ? "r" : "r warnc";
  note.textContent = alive ? "" : "silent window " + fmtDur(o.silent_after_sec);
  const counts = o.interventions || [];
  if (counts.length) {
    box.append(el("div", "empty", "last 7 days: " + counts.map(c => c.kind + " " + c.count).join(" · ")));
  }
  const lines = o.journal || [];
  if (!lines.length) { box.append(el("div", "empty", "no journal lines")); return; }
  for (const l of lines) {
    const row = el("div", "ojline");
    row.append(el("span", "ojage", fmtDur(l.age_sec)), el("span", "okind", l.kind));
    if (l.bead) row.append(el("span", "bead", l.bead));
    row.append(el("span", "", l.text));
    box.append(row);
  }
}

// The Deep review pane: when each of the review's schedules is next due, or why
// the town holds them, and the last ten runs, newest first. Read-only: a run is
// triggered, paused and edited from a terminal.
//
// The standing is one cell per configured schedule — two since the review was
// split into a slice path and a risk path — carrying the schedule's next-run
// text with its name under it. The reader's own words are what a cell shows; a
// town with no schedule configured says so in one nameless cell. A held town
// starts no run whatever an interval says, so "paused" replaces the cells
// rather than sitting beside them. Every cell goes through el(), which writes
// textContent: the run's bead id and the hold's reason are text and never
// markup. The digest column is a reference — the bead and its comment count —
// and never the digest's text.
function renderDeepReview(s) {
  const box = $("deepreview"), note = $("deepreviewnote");
  box.replaceChildren();
  const d = s.deepreview;
  note.className = "r"; note.textContent = "";
  if (!d) { box.append(el("div", "empty", "reading…")); return; }
  // A read that failed is a named state, never an empty pane: "no deep review
  // has run" and "the runs could not be read" must not look alike.
  if (d.unavailable) { box.append(el("div", "badc", "unavailable: deep reviews could not be read")); return; }
  const nexts = d.next || [];
  const kv = el("div", "kv");
  if (d.paused) {
    const cell = el("div");
    cell.append(el("b", "warnc", "paused"), el("span", "", d.paused));
    kv.append(cell);
  } else {
    // The reader sends one line per configured schedule, and one nameless line
    // for a town that has none: that line's label is the pane's own subject,
    // and its text is the reader's word for the state.
    for (const n of nexts) {
      const cell = el("div");
      cell.append(el("b", "", n.text), el("span", "", n.name || "deep review"));
      kv.append(cell);
    }
  }
  box.append(kv);
  const standing = d.paused ? d.paused : nexts.map(n => (n.name ? n.name + " " : "") + n.text).join(" · ");
  note.className = d.paused ? "r warnc" : "r";
  note.textContent = d.paused ? "paused" : standing;
  note.title = (d.paused ? "paused: " : "next: ") + standing;
  const rows = d.rows || [];
  if (!rows.length) { box.append(el("div", "empty", "no runs yet")); return; }
  const t = el("table");
  const hr = el("tr");
  [["Run"], ["Kind", "the schedule that filed the run"], ["Status"], ["Took", "closed minus created", 1], ["Found", "finding: lines in the run's notes", 1], ["Filed", "findings that named a bead", 1], ["Queued", "queued: lines in the run's notes", 1], ["Digest"]]
    .forEach(([h, tip, num]) => { const th = el("th", num ? "n" : "", h); if (tip) th.title = tip; hr.append(th); });
  t.append(hr);
  for (const r of rows) {
    const tr = el("tr");
    const id = el("td", "title", r.id);
    if (r.unparsed) { const b = el("span", "badge warnc", "unparsed"); b.title = "a finding:, queued: or cursor: line in the notes is missing its fields"; id.append(document.createTextNode(" "), b); }
    tr.append(id);
    tr.append(el("td", "title", r.kind || "–"));
    tr.append(el("td", r.status === "open" ? "warnc" : "", r.status));
    tr.append(el("td", "n", r.duration_sec == null ? "–" : fmtDur(r.duration_sec)));
    tr.append(el("td", "n", String(r.findings)));
    tr.append(el("td", "n", String(r.filed)));
    tr.append(el("td", "n", String(r.queued)));
    tr.append(el("td", "title", r.digest || "–"));
    t.append(tr);
  }
  box.append(t);
}

// The Usage pane: what the town spent over the last day, from the records the
// usage scan writes. Collapsed by default, with the two numbers an operator
// wants without opening it in the header: the day's DeepSeek estimate and how
// many beads ran over twenty minutes. Read-only.
//
// Claude rows show uncached tokens, since the scan estimates no cost for them;
// DeepSeek rows show estimated dollars, labelled "est." because they are a rate
// over the tokens and not a bill. A read that failed and a scan that never ran
// are named states, never an empty list. Every cell goes through el(), which
// writes textContent: a bead id or model name is text and never markup.
let openUsage = false;
const USAGE_STALE_SEC = 3 * 3600;
const isDeepSeek = model => /^deepseek/i.test(model || "");
const fmtTokens = n => {
  n = Number(n) || 0;
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
  return String(n);
};
function renderUsage(s) {
  const box = $("usage"), note = $("usagenote");
  box.replaceChildren();
  const u = s.usage;
  note.className = "r"; note.textContent = ""; note.title = "";
  if (!u) { box.append(el("div", "empty", "reading…")); return; }
  if (u.unavailable) {
    box.append(el("div", "badc", "usage records unreadable"));
    note.className = "r badc"; note.textContent = "unreadable";
    return;
  }
  const byClass = u.by_class_model || [], deep = u.deep_review_runs || [], top = u.top_beads || [], over = u.over20 || [];
  const est = byClass.filter(r => isDeepSeek(r.model)).reduce((sum, r) => sum + (r.est_cost_usd || 0), 0);
  note.className = over.length ? "r warnc" : "r";
  note.textContent = "est. " + money(est) + " · " + over.length + " over 20m";
  note.title = "estimated DeepSeek spend over the last " + (u.window || "24h") + "; beads that ran over twenty minutes in the last 48 hours";

  // How old the records are: the scan runs on a schedule, so an old AsOf means
  // the numbers below are a past day's, and the pane says so beside them.
  const scanned = u.as_of ? new Date(u.as_of).getTime() : NaN;
  if (isNaN(scanned)) box.append(el("div", "empty warnc", "never scanned"));
  else {
    const old = (Date.now() - scanned) / 1000 > USAGE_STALE_SEC;
    box.append(el("div", "empty" + (old ? " warnc" : ""), "records last scanned " + age(u.as_of) + " ago" + (old ? " (stale)" : "")));
  }

  const d = document.createElement("details");
  d.open = openUsage;
  d.ontoggle = () => { openUsage = d.open; };
  d.append(el("summary", "title", "last " + (u.window || "24h") + " by class and model, deep reviews, top and slow beads"));
  const table = (heads, rows) => {
    const t = el("table");
    const hr = el("tr");
    heads.forEach(([h, num]) => hr.append(el("th", num ? "n" : "", h)));
    t.append(hr);
    for (const cells of rows) {
      const tr = el("tr");
      cells.forEach(([text, cls]) => tr.append(el("td", cls || "", text)));
      t.append(tr);
    }
    return t;
  };
  const section = (title, node) => { d.append(el("h3", "sub", title), node); };
  const none = text => el("div", "empty", text);

  section("By class and model", byClass.length
    ? table([["Class"], ["Model"], ["Calls", 1], ["Spend", 1]], byClass.map(r => [
        [r.class], [r.model, "title"], [String(r.calls), "n"],
        [isDeepSeek(r.model) ? "est. " + money(r.est_cost_usd) : fmtTokens(r.uncached) + " tokens", "n"]]))
    : none("no usage in the last " + (u.window || "24h")));
  // What a run's tokens bought: its findings, joined by bead id from the Deep
  // review pane's rows. A run that pane does not list has no count ("-"), and a
  // run with none has no per-finding figure to divide into.
  const found = new Map(((s.deepreview && s.deepreview.rows) || []).map(r => [r.id, r.findings]));
  section("Deep reviews", deep.length
    ? table([["Run"], ["Ended"], ["Took", 1], ["Tokens", 1], ["In subagents", 1], ["Findings", 1], ["Tokens per finding", 1]], deep.map(r => {
        const f = found.get(r.bead);
        return [
          [r.bead], [age(r.end) + " ago", "title"], [fmtDur(r.wall_s), "n"], [fmtTokens(r.uncached), "n"], [Math.round((r.subagent_share || 0) * 100) + "%", "n"],
          [f == null ? "-" : String(f), "n"], [f ? fmtTokens(Math.round(r.uncached / f)) : "-", "n"]];
      }))
    : none("no deep review runs"));
  section("Top beads", top.length
    ? table([["Bead"], ["Class"], ["Took", 1], ["Spend", 1]], top.map(r => [
        [r.bead], [r.class, "title"], [fmtDur(r.wall_s), "n"],
        [r.est_cost_usd ? "est. " + money(r.est_cost_usd) : fmtTokens(r.uncached) + " tokens", "n"]]))
    : none("no beads in the last " + (u.window || "24h")));
  section("Over 20 minutes (48h)", over.length
    ? table([["Bead"], ["Rig"], ["Took", 1], ["Tests", 1]], over.map(r => [
        [r.bead, "warnc"], [r.rig, "title"], [fmtDur(r.wall_s), "n warnc"],

// Alerts. The server decides what needs attention and pushes each new one as an
// "alert" event; the page shows a toast, marks the title, and (when the browser
// allows it) raises a notification — but only while the operator has alerts on.
// The recent list below renders from State.Alerts either way, so switching
// alerts off never hides what happened.
const BASE_TITLE = document.title;
let alertsOn = false;
try { alertsOn = localStorage.getItem("gt-alerts") === "on"; } catch (e) { alertsOn = false; }
let unreadAlerts = 0;

function syncAlertCtl() {
  const b = $("alertsctl");
  b.className = alertsOn ? "on" : "";
  b.textContent = "alerts: " + (alertsOn ? "on" : "off");
  b.title = alertsOn
    ? "alerts are on: a toast, a title marker, and a browser notification while the tab is in the background"
    : "turn alerts on: a toast, a title marker, and a browser notification while the tab is in the background";
}

function markTitle() {
  document.title = alertsOn && unreadAlerts > 0 && !document.hasFocus() ? "(!) " + BASE_TITLE : BASE_TITLE;
}

function showToast(a) {
  const box = $("toasts");
  const t = el("div", "toast " + a.level);
  const body = el("div");
  body.append(el("div", "tt", a.title || "alert"), el("div", "tx", a.text || ""));
  const x = el("button", "", "✕");
  x.type = "button";
  x.title = "dismiss";
  x.onclick = () => t.remove();
  t.append(body, x);
  box.prepend(t);
  while (box.children.length > 5) box.lastChild.remove();
}

function notify(a) {
  if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
  try { new Notification(a.title || "Gas Town", {body: a.text || ""}); } catch (e) {}
}

function onAlert(a) {
  if (!alertsOn) return;
  showToast(a);
  notify(a);
  if (!document.hasFocus()) { unreadAlerts++; markTitle(); }
}

function renderAlerts(s) {
  const box = $("alerts");
  box.replaceChildren();
  const list = ((s && s.alerts) || []).slice().reverse();
  $("alertsnote").textContent = list.length ? list.length + " recent" : "";
  if (!list.length) { box.append(el("div", "empty", "nothing has needed attention")); return; }
  for (const a of list) {
    const row = el("div", "arow");
    row.append(el("span", "alvl " + a.level, a.level || "info"), el("span", "t", clock(a.at) + "  "));
    row.append(el("span", "tt", a.title || ""), el("div", "tx", a.text || ""));
    box.append(row);
  }
}

function initAlerts() {
  syncAlertCtl();
  $("alertsctl").onclick = () => {
    alertsOn = !alertsOn;
    try { localStorage.setItem("gt-alerts", alertsOn ? "on" : "off"); } catch (e) {}
    syncAlertCtl();
    if (alertsOn) {
      unreadAlerts = 0;
      markTitle();
      if (typeof Notification !== "undefined" && Notification.permission === "default") {
        try { const p = Notification.requestPermission(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
      }
    } else {
      $("toasts").replaceChildren();
    }
  };
  window.addEventListener("focus", () => { unreadAlerts = 0; markTitle(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { unreadAlerts = 0; markTitle(); } });
}

// beadDetailFor fetches one bead's text into store under "rig/id" and calls
// done when it lands. The Work queue's rows and the Report pane's ids open a
// bead through here, so both read the one route and draw the one detail. An
// entry is {loading}, the detail, or {error}; a bead already in the store is
// never fetched twice, and a failed read is remembered as the failure it was.
function beadDetailFor(rig, id, store, done) {
  const key = rig + "/" + id;
  if (store[key]) return;
  store[key] = {loading: true};
  fetch("/api/bead?rig=" + encodeURIComponent(rig) + "&id=" + encodeURIComponent(id))
    .then(r => r.ok ? r.json() : Promise.reject(new Error(String(r.status))))
    .then(d => { store[key] = d; done(); })
    .catch(() => { store[key] = {error: true}; done(); });
}

function openBead(b) {
  const id = b.rig + "/" + b.id;

}

function renderQueue(s, force) {
  const box = $("queue");
  const q = s.queue;
  const r = readOf(s, "queue");
  paintsRead(box, $("queuenote"), r);
  // The note is written on every call, above the unchanged-key early return, so
  // its age keeps moving between queue polls instead of freezing with the rows
  // (gt-q6h8e).
  if (q) {
    const ok = (q.ready || []).filter(b => b.shape === "ok").length;
    $("queuenote").textContent = readCaption(r, [(q.ready_total || 0) + " ready (" + ok + " dispatchable) · " + (q.landing_total || 0) + " landing · " + (q.blocked_total || 0) + " blocked · read " + age(q.at) + " ago"]);
  } else {

  const key = q.at + "|" + qTab + "|" + qRig + "|" + qShape + "|" + [...qOpen].join(",") + "|" + Object.keys(qDetail).map(k => k + (qDetail[k].loading ? "L" : qDetail[k].error ? "E" : "D")).join(",") + "|" + Object.keys(unshaped).join(",");
  // A pane still holding the placeholder from a failed read is redrawn even
  // when the queue's own reading is unchanged (gt-q6h8e).
  if (!force && !box.dataset.empty && key === qKey) return;
  qKey = key;
  delete box.dataset.empty;
  box.replaceChildren();
  if ((q.unreadable || []).length) box.append(el("div", "badc", "⚠ could not read: " + q.unreadable.join(", ") + " (its beads are missing below)"));
  const tabs = el("div", "qtabs");
  QTABS.forEach(([k, label, totalKey]) => {
    const b = el("button", "chip" + (qTab === k ? " on" : ""), label);
    b.append(el("b", "", String(q[totalKey] || 0)));
    b.onclick = () => { qTab = k; renderQueue(state, true); };
    tabs.append(b);
  });
  box.append(tabs);
  const caption = {ready: "Open beads with nothing blocking them. Only the green “ready” ones are taken by the spec dispatcher: shaped, unassigned, not an epic, and in a rig that is not parked. Beads held by an assignee wait for that person; beads in parked rigs wait until the rig is re-enabled.",
    landing: "Submitted by a polecat or crew and waiting for the landing worker.",
    blocked: "Open beads waiting on another bead to close. Wisp steps left by retired patrols and old polecat runs are hidden by default; the wisps chip shows them."}[qTab];
  box.append(el("div", "empty", caption));
  const [, , totalKey, listKey] = QTABS.find(t => t[0] === qTab);
  const all = q[listKey] || [];
  // filters: which store, (for the ready list) whether the dispatcher would
  // slot it, and (for the blocked list) whether wisps are shown
  const rigs = Object.assign({}, q[listKey + "_rigs"] || {});
  if (!Object.keys(rigs).length) all.forEach(b => rigs[b.rig] = (rigs[b.rig] || 0) + 1);
  const rigNames = Object.keys(rigs).sort((a, b) => rigs[b] - rigs[a]);
  if (qRig !== "all" && !rigs[qRig]) qRig = "all";
  if (rigNames.length > 1 || qTab === "ready" || qTab === "blocked") {
    const f = el("div", "qtabs");
    const chip = (label, count, on, fn) => { const b = el("button", "chip" + (on ? " on" : ""), label); b.append(el("b", "", String(count))); b.onclick = fn; f.append(b); };
    if (rigNames.length > 1) {

      const parkedRigs = q.parked_rigs || [];
      rigNames.forEach(r => chip(r + (parkedRigs.indexOf(r) >= 0 ? " (parked)" : ""), rigs[r], qRig === r, () => { qRig = r; renderQueue(state, true); }));
    }
    if (qTab === "ready") {

      chip("dispatchable", ok, qShape === "ok", () => { qShape = qShape === "ok" ? "all" : "ok"; renderQueue(state, true); });
      chip("needs shaping", inRig.filter(b => b.shape === "fix").length, qShape === "fix", () => { qShape = qShape === "fix" ? "all" : "fix"; renderQueue(state, true); });
      chip("held", inRig.filter(b => b.shape === "held").length, qShape === "held", () => { qShape = qShape === "held" ? "all" : "held"; renderQueue(state, true); });
    }

    }

  }

  if (!rows.length) {
    let msg;

    // the beads are waiting on instead of "no filter matched" (gt-x9gk4).
    if (qTab === "ready" && qShape === "ok") {
      const inRig = all.filter(b => qRig === "all" || b.rig === qRig);
      const shaping = inRig.filter(b => b.shape === "fix").length;
      const held = inRig.filter(b => b.shape === "held").length;
      const parts = [];

    } else if (qTab === "blocked" && !qWisp) {

      const wisps = all.filter(b => (qRig === "all" || b.rig === qRig) && isWisp(b)).length;
      msg = wisps ? "nothing is blocked outside " + (wisps === 1 ? "1 wisp" : wisps + " wisps") + " — turn on the wisps chip to see them" : "nothing is blocked";
    } else {
      msg = all.length ? "nothing matches these filters" : qTab === "ready" ? "nothing is waiting to be built" : qTab === "landing" ? "nothing is waiting to land" : "nothing is blocked";
    }
    box.append(el("div", "empty", msg));
  }
  rows.forEach(b => {
    const id = b.rig + "/" + b.id;
    const open = qOpen.has(id);
    const row = el("div", "qrow");
    const head = el("button", "qhead");
    head.setAttribute("aria-expanded", open ? "true" : "false");

    head.append(idc);
    const t = el("span", "t", b.title || "(no title)");
    if (b.shape === "ok") { const g = el("span", "tag good", "ready"); g.title = "the spec dispatcher would slot this bead"; t.append(document.createTextNode(" "), g); }
    else if (b.shape === "parked") { const g = el("span", "tag", "rig parked"); g.title = b.shape_note || ""; t.append(document.createTextNode(" "), g); }
    else if (b.shape === "held") { const g = el("span", "tag", "held"); g.title = b.shape_note || ""; t.append(document.createTextNode(" "), g); }
    else if (b.shape === "fix") { const g = el("span", "tag warnc", "needs shaping"); g.title = b.shape_note || ""; t.append(document.createTextNode(" "), g); }
    else if (b.shape === "planning") { const g = el("span", "tag", "needs planning"); g.title = b.shape_note || ""; t.append(document.createTextNode(" "), g); }
    else if (unshaped[b.id]) t.append(document.createTextNode(" "), el("span", "tag warnc", "unshaped"));
    (b.labels || []).filter(l => !/^gt:/.test(l) && l !== "rework").forEach(l => t.append(document.createTextNode(" "), el("span", "tag", l)));
    if (b.labels && b.labels.indexOf("rework") >= 0) t.append(document.createTextNode(" "), el("span", "tag warnc", "rework"));
    head.append(t, el("span", "title", b.created_at ? age(b.created_at) : ""));
    const sub = [b.type, b.rig !== "gastown" ? b.rig : null, b.assignee ? "→ " + b.assignee : null, (b.blocked_by || []).length ? "blocked by " + b.blocked_by.join(", ") : null].filter(Boolean).join(" · ");
    if (sub) head.append(el("span", "qsub", sub));
    head.onclick = () => openBead(b);
    row.append(head);
    if (open) row.append(detailBlock(qDetail[id] || {loading: true}));
    box.append(row);
  });
  const shownInRig = rows.length;
  const totalInRig = qRig === "all" ? (q[totalKey] || 0) : (rigs[qRig] || 0);
  if (qShape === "all" && totalInRig > shownInRig) box.append(el("div", "empty", "+" + (totalInRig - shownInRig) + " more, lower priority, not shown (pick a store to see its first " + 40 + ")"));
}

const CLASSES = ["failure", "warning", "success", "landing", "dispatch", "restart", "plain"];
const shown = new Set(JSON.parse(localStorage.getItem("gt-chips") || "null") || CLASSES.filter(c => c !== "plain"));
const counts = {};
function renderChips() {
  const box = $("chips");

function rowFor(e) {
  const r = el("div", "row c-" + e.class);
  r.dataset.class = e.class;

function applyFilter() { for (const r of $("feed").children) r.hidden = !shown.has(r.dataset.class); }
function pushEntry(e, stick) {
  const f = $("feed");
  const atBottom = f.scrollHeight - f.scrollTop - f.clientHeight < 40;
  f.append(rowFor(e));

  if (!pushEntry.t) pushEntry.t = setTimeout(() => { pushEntry.t = null; renderChips(); }, 1000);
  if (atBottom || stick) f.scrollTop = f.scrollHeight;
}

function connect() {
  const es = new EventSource("/stream");
  let dropped = false;
  // The server restarts in place when the gt binary is replaced; a stream that
  // comes back after dropping may be a new build, so take its page.
  es.onopen = () => { if (dropped) { location.reload(); return; } $("conn").className = "on"; $("conn").textContent = "live"; };
  es.onerror = () => { dropped = true; $("conn").className = "off"; $("conn").textContent = "reconnecting"; };
  es.addEventListener("state", ev => { state = JSON.parse(ev.data); renderAll(); });
  es.addEventListener("backlog", ev => { $("feed").replaceChildren(); for (const k of Object.keys(counts)) delete counts[k]; JSON.parse(ev.data).forEach(e => pushEntry(e, true)); });
  es.addEventListener("entry", ev => pushEntry(JSON.parse(ev.data)));
  es.addEventListener("alert", ev => onAlert(JSON.parse(ev.data)));
}

function setupCollapse() {
  let saved = {};

  document.querySelectorAll("main section, .grid section").forEach(sec => {
    const h = sec.querySelector(":scope > h2");

    const caret = el("span", "caret");

    const apply = collapsed => { sec.classList.toggle("collapsed", collapsed); caret.textContent = collapsed ? "▸" : "▾"; h.setAttribute("aria-expanded", collapsed ? "false" : "true"); };
    apply(!!saved[name]);
    const toggle = ev => {
      if (ev && ev.target && ev.target.closest && ev.target.closest("button, .chips, a")) return;
      const now = !sec.classList.contains("collapsed");
      apply(now);
      saved[name] = now;

    };
    h.addEventListener("click", toggle);
    h.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle(ev); } });
  });
}

}, 1000);
// The activity feed folds under the Actions section, which stays visible, and
// the choice is remembered per viewer. Storage that throws — a locked-down
// browser, private mode — must not take the pane down: the feed then starts
// expanded and folding still works for the session.
let feedFolded = false, feedCount = null;
try { feedFolded = localStorage.getItem("gt-forgejo-feed") === "folded"; } catch (e) {}
function paintFeedHead() {
  const h = $("forgejofeedhead");
  h.replaceChildren(el("span", "caret", feedFolded ? "▸" : "▾"), el("span", "", feedFolded ? "activity · " + (feedCount == null ? 0 : feedCount) + " events" : "activity"));
  h.setAttribute("aria-expanded", feedFolded ? "false" : "true");
}
// foldFeed applies the remembered choice. The header rides the Actions section,
// which is the layout the fold belongs to: without one the feed is drawn as it
// was before the section existed, expanded and with no header to click.
function foldFeed(hasActions) {
  $("forgejofeedhead").hidden = !hasActions;
  $("forgejo").classList.toggle("folded", !!hasActions && feedFolded);
  paintFeedHead();
}
function toggleFeed() {
  feedFolded = !feedFolded;
  foldFeed(true);
  try { localStorage.setItem("gt-forgejo-feed", feedFolded ? "folded" : "open"); } catch (e) {}
}
$("forgejofeedhead").addEventListener("click", toggleFeed);
foldFeed(false); // no state has arrived yet, so there is no Actions section
$("models").addEventListener("click", toggleModels);
paintModelsLine();
renderChips();
connect();
// Ages and elapsed times drift between pushes; redraw the cheap parts locally.
setInterval(() => { if (state) { renderStrip(state); renderSeats(state); renderTierSweep(state); renderForgejo(state); renderQueue(state); } }, 15000);
</script>
</body>
</html>
