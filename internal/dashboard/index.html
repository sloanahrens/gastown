<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gas Town</title>
<style>
:root{
  --bg:#0d1117;--panel:#141a22;--line:#232c38;--text:#d7dee8;--dim:#7d8896;
  --green:#3fb950;--amber:#d29922;--red:#f85149;--blue:#58a6ff;--teal:#39c5bb;--violet:#b392f0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
body{padding:0 16px 24px;max-width:1500px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
h1{font-size:15px;margin:0;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.pill{padding:3px 10px;border-radius:999px;font-weight:700;font-size:12px;border:1px solid currentColor}
.pill.green{color:var(--green)}.pill.degraded{color:var(--amber)}.pill.red{color:var(--red)}.pill.unknown{color:var(--dim)}
/* The header's dispatch-hold chip and the gt update chip beside it: one compact
   mark each. The hold chip is amber while the operator's hold file is present,
   quiet while the town is dispatching, and amber "hold?" when the file could
   not be read (gt-zzkhh); the update chip is amber while a run is in flight or
   ended badly, and quiet for a run the operator stopped. */
#hold,#update{padding:2px 9px;border-radius:999px;font-size:12px;border:1px solid currentColor;white-space:nowrap}
#hold.warn,#update.warn{color:var(--amber)}
#hold.quiet,#update.quiet{color:var(--dim)}
#healthline{color:var(--dim);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Below 640 px the health line wraps instead of ending in an ellipsis: its tick
   age and landed count sit at the end of the text, where the cut hid them (gt-ec79s). */
@media (max-width:640px){#healthline{white-space:normal;text-overflow:clip}}
#healthmark{white-space:nowrap}
#strip{color:var(--dim);min-width:0}
#strip b{font-weight:700}
#strip .v{color:var(--text)}
#strip .warn{color:var(--amber)}
#strip .bad{color:var(--red)}
#models{background:none;border:0;padding:0;color:var(--dim);font:inherit;cursor:pointer;white-space:nowrap}
#models:hover{color:var(--text)}
#modelspanel{display:flex;gap:32px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
#modelspanel:empty{display:none}
#modelspanel table{width:auto;min-width:260px}
#conn{font-size:12px;color:var(--dim)}
#conn.on::before{content:"● ";color:var(--green)}#conn.off::before{content:"● ";color:var(--red)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:12px}
@media (max-width:1000px){.grid{grid-template-columns:1fr}}
section.wide{margin-top:12px}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
section>h2{white-space:nowrap;margin:0;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);display:flex;gap:10px;align-items:center}
section>h2 .r{margin-left:auto;text-transform:none;letter-spacing:0;white-space:normal;text-align:right}
.body{padding:10px 12px}
table{border-collapse:collapse;width:100%}
th{color:var(--dim);font-weight:400;text-align:left;font-size:11px;padding:3px 8px 3px 0}
td{padding:4px 8px 4px 0;vertical-align:top;border-top:1px solid var(--line)}
td.n,th.n{text-align:right}
.bead{color:var(--blue)}.title{color:var(--dim)}
.empty{color:var(--dim);padding:6px 0}
.qcaption{color:var(--dim);padding:6px 0}
.qhint summary{cursor:pointer}
.body.stale,#cost .spendpart.stale{opacity:.55}
.spark{width:100%;height:56px;display:block}
.chart{width:100%;height:64px;display:block}
.dchart{width:100%;height:auto;display:block;margin:4px 0 2px}.dchart .bar{fill:var(--blue)}.dchart .axis{stroke:var(--line)}.dchart .limit{stroke:var(--amber);stroke-width:1.5;stroke-dasharray:4 3}.dchart text{fill:var(--dim);font-size:11px}.dchart .amt{fill:var(--text)}.dchart .gap{stroke:var(--dim);stroke-width:1;stroke-dasharray:2 2}
.dchart .cbar{fill:var(--violet)}.dchart .cgap{opacity:.35}.dchart .hatch{stroke:var(--violet);stroke-width:1}
.hbars{display:flex;align-items:stretch;gap:2px;height:64px;margin:4px 0 2px}
.hbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;min-height:1px}
.hbar i{display:block;min-height:1px}
.hok{background:var(--blue);border-radius:0 0 2px 2px}
.hrej{background:var(--red);border-radius:2px 2px 0 0}
.hpts{background:var(--violet);border-radius:2px 2px 0 0}
.hcap{height:4px;background:repeating-linear-gradient(45deg,var(--violet) 0 2px,transparent 2px 4px)}
/* The velocity's differences, D1 and D2: thin signed rows over the feed's own
   window, one column per hour. A bar grows from the row's zero line, up for a
   positive difference and down for a negative one, and a bar whose difference
   is within noise is muted (gt-vd91ny.7). */
.dbars{display:flex;align-items:center;gap:4px;margin:2px 0}
.dlabel{flex:0 0 2ch;color:var(--dim);font-size:11px}
.dbody{position:relative;flex:1;display:flex;gap:2px;height:32px}
.dbody::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--line)}
.dcol{position:relative;flex:1;min-width:1px}
.dbar{position:absolute;left:15%;right:15%;display:block;background:var(--violet)}
.dup{bottom:50%;border-radius:2px 2px 0 0}
.ddn{top:50%;border-radius:0 0 2px 2px}
.dmute{opacity:.4}
/* The landings head folds the day's figures and the per-hour bars away
   together, as the Actions feed folds under its own section; the table below
   never folds (gt-q4cac). */
.lheadbtn{display:flex;align-items:center;gap:6px;width:100%;background:none;border:0;padding:2px 0 3px;color:var(--dim);font:inherit;font-size:11px;letter-spacing:.04em;text-align:left;cursor:pointer}
.lheadbtn:hover{color:var(--text)}
.lheadbtn .caret{display:inline-block;width:10px}
.lheadbody{margin-bottom:6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--dim);font-size:11px;margin-top:3px}
.vpick{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:11px;margin:2px 0}
button.vsel{background:none;border:1px solid var(--line);border-radius:3px;color:var(--dim);font:inherit;font-size:11px;padding:0 6px;cursor:pointer}
button.vsel:hover{color:var(--text)}
button.vsel.on{color:var(--text);border-color:var(--dim)}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.kv{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:6px}#cost .kv{margin-bottom:2px}
.kv b{font-size:16px}.kv span{color:var(--dim);font-size:11px;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--dim);background:none;font:inherit;font-size:11px}
.chip.on{color:var(--text);border-color:var(--blue);background:#1c2a3d}
.chip b{font-weight:400;color:var(--dim);margin-left:4px}
[hidden]{display:none !important}
.bars{display:flex;align-items:flex-end;gap:3px;height:54px;margin:4px 0 2px;position:relative}
.bars i{flex:1;background:var(--blue);min-height:1px;border-radius:2px 2px 0 0;position:relative}
.bars i.low{background:var(--red)}
.bars .thr{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--amber)}
.axis{display:flex;justify-content:space-between;color:var(--dim);font-size:10px}
.stack{display:flex;height:9px;border-radius:2px;overflow:hidden;background:var(--line);min-width:90px}
.stack i{display:block;height:100%}
.sa{background:var(--green)}.ss{background:var(--dim)}.se{background:var(--amber)}.sr{background:var(--red)}
.tag{display:inline-block;padding:0 6px;border-radius:4px;font-size:11px;border:1px solid var(--line);margin-right:4px}
.o-approved{color:var(--green)}.o-skipped{color:var(--dim)}.o-error{color:var(--amber)}.o-rejected{color:var(--red)}
.tag.live{color:var(--green);border-color:var(--green)}
tr.live{background:#101a13}
.badge{padding:1px 8px;border-radius:999px;font-size:11px;border:1px solid currentColor;white-space:nowrap}
.st-working{color:var(--green)}.st-gating{color:var(--violet)}.st-queued{color:var(--blue)}
.st-needs-human,.st-needs-overseer,.st-needs-operator{color:var(--red)}.st-quiet{color:var(--amber)}.st-stalled{color:var(--red)}.st-review-needed,.st-recovery{color:var(--amber)}.st-spawning{color:var(--teal)}.st-parked,.st-idle,.st-unknown,.st-kept{color:var(--dim)}
.tag.p0,.tag.p1{color:var(--red)}.tag.p2{color:var(--amber)}.tag.p3,.tag.p4{color:var(--dim)}
.cmd{display:inline-block;margin:2px 6px 0 0;padding:0 6px;border:1px solid var(--line);border-radius:4px;color:var(--dim);background:none;font:inherit;font-size:11px;cursor:pointer;text-align:left}
.cmd:hover{color:var(--text);border-color:var(--dim)}.cmd.done{color:var(--green);border-color:var(--green)}
/* The Work panel's seat table. One grid owns the columns — polecat, agent,
   bead, state, age, in that order — and the header row, every seat row and the
   rows of every fold take their tracks from it, so a column is as wide as the
   table's widest cell rather than the widest cell in one row, and a row cannot
   start a column where its neighbour started another (gt-n7yb8). Each track is
   named for the cell it holds so a swap in workHead cannot leave the template
   describing the old order. Only the bead takes what is left of the width, and
   at wide widths every track may shrink to nothing, so a long bead title cannot
   carry a row past its panel. Below 640 px the four tracks other than the bead
   hold their content instead (see the rule below). */
.wtable{display:grid;grid-template-columns:[polecat] minmax(0,max-content) [agent] minmax(0,max-content) [bead] minmax(0,1fr) [state] minmax(0,max-content) [age] minmax(0,8ch);gap:2px 8px;align-items:baseline}
/* Below 640 px the four tracks other than the bead hold the width their text
   needs, so their text is not clipped by its own track at 470 px. The floor
   is minmax(max-content,max-content), not a bare max-content: a track's minimum
   is auto, which resolves to 0 here because .workrow>* sets min-width:0, so a bare
   max-content lets the track shrink. Only the bead shrinks to make room (gt-ec79s);
   if the four fixed tracks together exceed the panel, the grid overflows rather
   than shrinking them. */
@media (max-width:640px){.wtable{grid-template-columns:[polecat] minmax(max-content,max-content) [agent] minmax(max-content,max-content) [bead] minmax(0,1fr) [state] minmax(max-content,max-content) [age] minmax(max-content,max-content)}}
.workrow{grid-column:1 / -1;display:grid;grid-template-columns:subgrid;align-items:baseline;padding:4px 0;border-top:1px solid var(--line)}
/* A fold's summary spans the table, and its rows are a subgrid of it, so a
   collapsed group hides rows that would still line up with the live ones. */
.wfold{grid-column:1 / -1}
.wfoldrows{grid-column:1 / -1;display:grid;grid-template-columns:subgrid;align-items:baseline}
.wfoldrows[hidden]{display:none}
.workrow>*{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.workrow.whead{color:var(--dim);font-size:11px;border-top:0}
.workrow .wagent,.workrow .wname{color:var(--dim)}
.workrow .wnum{text-align:right;color:var(--dim)}
.workrow .whints{grid-column:1 / -1;overflow:visible;white-space:normal}
.wsum{margin-top:8px}
.wblocked{padding:2px 0}
.qrows{max-height:70vh;overflow:auto}
.qtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qrow{border-top:1px solid var(--line)}
.qhead{display:grid;grid-template-columns:auto auto 1fr auto;gap:4px 8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:5px 0;cursor:pointer}
.qhead:hover{background:#19212b}
.qhead .t{overflow-wrap:anywhere}
.qhead .caret{color:var(--dim);width:10px;display:inline-block}
.qsub{grid-column:2 / -1;color:var(--dim);font-size:11px}
.qdetail{padding:4px 0 10px 18px;overflow-wrap:anywhere}
.qdetail h4{margin:8px 0 2px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:400}
.qdetail pre{margin:0;white-space:pre-wrap;font:inherit;background:#10161d;border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-height:320px;overflow:auto}
.qcomment{border-left:2px solid var(--line);padding-left:8px;margin:4px 0}
section>h2{cursor:pointer;user-select:none}
section>h2:hover{color:var(--text)}
section>h2 .caret{display:inline-block;width:10px;color:var(--dim)}
section.collapsed>:not(h2){display:none}
section.collapsed>h2{border-bottom:0}
/* The one line a closed section says about itself, in the note's place: the
   header keeps the title and the caret, and the figures the operator would
   otherwise open the section to read (foldable, index.html's script). */
section>h2 .foldsum{margin-left:auto;text-transform:none;letter-spacing:0;white-space:normal;text-align:right;color:var(--text)}
/* A panel whose summary stays in the header while the panel is open (Polecats
   and Beads) keeps its read-age note beside it. The note's own auto margin
   already takes the free space and pushes both right, so the summary beside it
   must not take a share as well. */
section>h2 .r:not([hidden])+.foldsum{margin-left:0}
/* The Polecats section sits inside the Landings body, between its figures and
   its landing rows: a card of its own, spaced from both. */
#trend>#polecatssec{margin:10px 0}
/* The News pane: one line per story, the title taking what the comments link
   leaves. Both tracks may shrink, so a long title is ellipsed rather than
   widening the panel. */
#news{padding-top:2px}
.nrow{display:grid;grid-template-columns:minmax(0,1fr) max-content;gap:8px;align-items:baseline;padding:3px 0;border-top:1px solid var(--line)}
.nrow:first-child{border-top:0}
.nrow>*{min-width:0}
.nrow .ntitle{color:var(--text);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow .ntitle:hover{color:var(--blue);text-decoration:underline}
.nrow .ncmt{color:var(--dim);font-size:11px;text-decoration:none;white-space:nowrap}
.nrow .ncmt:hover{color:var(--text)}
#forgejo{max-height:240px;overflow:auto}
#forgejo.folded{display:none}
.feedhead{display:flex;align-items:center;gap:6px;width:100%;background:none;border:0;padding:2px 0 3px;color:var(--dim);font:inherit;font-size:11px;letter-spacing:.04em;text-align:left;cursor:pointer}
.feedhead:hover{color:var(--text)}
.feedhead .caret{display:inline-block;width:10px}
.acts{margin-bottom:6px}
.actssum{color:var(--dim);padding:1px 0 3px}
.actsrow{display:grid;grid-template-columns:10px 17ch minmax(0,1fr) 10ch 13ch 52px 46px;gap:8px;align-items:center;height:16px;line-height:16px}
.actsrow>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actsrow .an,.actsrow .apolecat{color:var(--dim)}
.actsrow .acommit a{color:var(--blue);text-decoration:none}
.actsrow .acommit a:hover{text-decoration:underline}
.actsrow.act-failure,.actsrow.act-failure .an{color:var(--red)}
.actsidle{color:var(--dim);height:16px;line-height:16px}
.actdiv{border-top:1px solid var(--line);margin:2px 0}
.adot{width:8px;height:8px;border-radius:50%;background:currentColor;justify-self:center}
.act-success{color:var(--green)}
.act-failure{color:var(--red)}
.act-running,.act-waiting,.act-blocked{color:var(--amber)}
.act-cancelled,.act-skipped{color:var(--dim)}
.fev{display:grid;grid-template-columns:52px 88px 1fr minmax(0,auto);gap:8px;align-items:baseline;padding:3px 0;border-top:1px solid var(--line)}
.fev:first-child{border-top:0}
.fev .t{color:var(--dim);white-space:nowrap}
.fev .a{color:var(--teal);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fev .s{overflow-wrap:anywhere}
.fev .rp{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* The landings table sizes its columns from their content, so the title's floor
   and the When cell's nowrap widen the table into the scroll box; a fixed
   layout would size the columns from the table width and ignore both. */
.ltable{table-layout:auto}
.ltable td{vertical-align:top}
.ltable td.n,.ltable th.n{padding-left:14px}
/* A landing's title keeps a floor, so a narrow panel scrolls the table rather
   than squeezing the title into a column of one-word fragments. */
.ltable td.main{min-width:200px;overflow-wrap:break-word}
/* The When cell is one reading, never a sentence split over two lines: "merging
   47s" reads as one value (gt-u7xe9). */
.ltable td.when{white-space:nowrap}
.lrows{max-height:70vh;overflow-y:auto}
/* Below 640 px the eight columns cannot sit side by side, so each row stacks: the
   title first on a full line (two lines at most, the rest on its hover), then the
   other cells in a wrapping line, each led by its column's name because the
   header row is hidden. Nothing is cut and the page does not scroll sideways
   (gt-bqxpz). */
@media (max-width:640px){
  .ltable{display:block}
  .ltable tr{display:flex;flex-wrap:wrap;gap:2px 12px;padding:6px 0;border-top:1px solid var(--line)}
  .ltable tr:first-child{display:none}
  .ltable td,.ltable td.n{display:block;border-top:0;padding:0;text-align:left}
  .ltable td.main{order:-1;flex:1 0 100%}
  .ltable td[data-label]::before{content:attr(data-label) " ";color:var(--dim);font-size:11px}
  .ltable td.main .title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
}
.lrows th{position:sticky;top:0;background:var(--panel)}
.costchip{border:1px solid currentColor;border-radius:999px;padding:0 7px;font-size:11px;white-space:nowrap;color:var(--dim)}
/* A wide table in a narrow panel scrolls sideways, and the fade at the cut edge
   is the cue: a dim gradient under a panel-coloured cover that scrolls with the
   table, so the fade shows only while the table overflows. The Cost panel's
   providers table and the Landings table share it (gt-k21do, gt-u7xe9). */
.costscroll,.lrows{
  overflow-x:auto;
  background:
    linear-gradient(to left, var(--panel) 60%, transparent) right center,
    linear-gradient(to right, var(--panel) 60%, transparent) left center,
    radial-gradient(farthest-side at 100% 50%, var(--dim), transparent) right center,
    radial-gradient(farthest-side at 0 50%, var(--dim), transparent) left center;
  background-repeat:no-repeat;
  background-size:40px 100%,40px 100%,16px 100%,16px 100%;
  background-attachment:local,local,scroll,scroll;
}
.costprov tr.dimrow td{color:var(--dim)}
.good{color:var(--green)}.warnc{color:var(--amber)}.badc{color:var(--red)}
/* The JEV panel's chips. A chip is inline-block, so a battery's questions wrap
   inside their cell; the battery name is nowrap, so a name never splits. */
.jvtable td{vertical-align:top}
.jvname{white-space:nowrap}
.jvchip{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:0 7px;margin:1px 4px 1px 0;font:inherit;font-size:11px;line-height:16px;white-space:nowrap;background:none}
.jv-earning{color:var(--green)}.jv-nosignal{color:var(--amber)}.jv-notyet{color:var(--dim)}
button.jvfold{cursor:pointer}
button.jvfold:hover{color:var(--text)}
.jvmore{margin-top:2px}
.jvstale td{color:var(--dim)}
/* The JEV header, the spend bar, and the groups under it. The bar's track is
   the panel's line colour and its fill the good colour; a day at or over the cap
   fills red. A group's heading is small and dim, so the figures carry the panel. */
.jvhead{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-bottom:4px}
.jvtitle{font-weight:600}
.jvspend{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-bottom:8px}
.jvbar{position:relative;display:inline-block;width:160px;max-width:100%;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.jvbar i{position:absolute;left:0;top:0;bottom:0;background:var(--green);border-radius:4px}
.jvbar.over i{background:var(--red)}
.jvgroup{margin:8px 0 2px}
.jvgh{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.jvearn{border-collapse:collapse;max-width:100%}
.jvearn th,.jvearn td{padding:2px 10px 2px 0;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.jvearn th.n,.jvearn td.n{text-align:right}
.jvcauses{display:flex;flex-wrap:wrap;gap:2px 8px}
.jvcauses>section>h2{padding:2px 8px;border-bottom:0;text-transform:none;letter-spacing:0;font-size:11px}
.jvretire{margin-top:2px;overflow-wrap:anywhere}
section[data-fold="jev.batteries"]>.body{overflow-x:auto}
@media (max-width:640px){.jvbar{width:100px}.jvtable td,.jvearn td{overflow-wrap:anywhere}}
/* A Mango row is a multi-line block, so every cell aligns to its top and only
   the first body row drops the rule under the header. */
.mgtable td{vertical-align:top;padding:6px 10px 6px 0;border-top:1px solid var(--line)}
.mgtable tbody tr:first-child td{border-top:0}
.mgbig{font-size:20px;font-weight:700;line-height:1.2;white-space:nowrap}
/* The rate cell stacks the rate with its baseline, lift and group count, so its
   four line boxes are most of a row's height. The three secondary lines take
   the chips' 11px, since at 12px the longest baseline breaks to three lines,
   and a 1.2 line box, since the page's 1.45 leading would stand the cell at
   133px — past the 120px a row may take (gt-g4vif). */
.mgrates{line-height:1.2}
.mgof{font-size:12px;font-weight:400;color:var(--dim)}
.mgvs,.mggroup{color:var(--dim);font-size:11px}

/* The Mango table takes its column widths from the shares below, not from what
   its cells hold, so a long target label or condition wraps inside its own
   column and the row never widens past the panel. The box carries the panel's
   longest prose — a condition runs to 240 characters — so it takes the widest
   column, and a prose cell wraps so no word crosses the panel's right edge
   (gt-6q7zj). The rate takes a share as wide as the evidence's, enough for
   "vs 24.3% across all recent landings" to read in two lines, and the interval
   takes the narrowest, since it draws a bar and no text (gt-g4vif). A chip is
   one token and keeps to one line, and the verdict column also keeps a floor
   in em as wide as its chip; a target name wraps between words and inside a
   word only when that word is longer than its column. The interval header
   draws in a column narrower than its word, so it clips inside its own cell
   and the whole word rides in the cell's title (gt-c6ge9). */
.mgtable{table-layout:fixed;width:100%}
.mgtable .mgc-target{width:11%}
.mgtable .mgc-verdict{width:14%}
.mgtable .mgc-rate{width:22%}
.mgtable .mgc-interval{width:6%}
.mgtable .mgc-evidence{width:23%}
.mgtable .mgc-box{width:24%}
.mgtable td:last-child{padding-right:0}
.mgtable th.mgc-interval{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mgtable .jvchip,.mgtable .mgbox,.mgtable .mgvs,.mgtable .mglift,.mgtable .mggroup,.mgtable .mgcondtext,.mgtable .mgcondshare,.mgtable .mgcondtag,.mgtable td.badc,.mgtable td.empty{overflow-wrap:anywhere}
.mgtable td.jvname{overflow-wrap:break-word}
.mgtable td.mgverdict .jvchip{white-space:nowrap;overflow-wrap:normal}
.mgtable td.jvname,.mgtable .jvchip,.mgtable .mgcondtext,.mgtable .mgcondshare,.mgtable .mgcondtag,.mgtable .mgbig{white-space:normal}
.mgtable .mgcond{flex-wrap:wrap}
/* The panel draws in the dashboard's left column, a few hundred pixels wide,
   where six columns of prose are too narrow to hold their words. At or below
   760px each target row draws as a block of lines: the name beside its verdict,
   the rate beside its interval bar, the evidence fold beside the best box. The
   header row is clipped off the page rather than removed, so assistive
   technology still reads each cell's column through its role and data-label,
   and each stacked line shows that name as its small label (gt-c6ge9). */
#mangosec{container-type:inline-size}
@container (max-width: 760px) {
  .mgtable,.mgtable tbody{display:block;width:auto}
  .mgtable thead{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .mgtable tbody tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:10px;row-gap:2px;padding:8px 0;border-top:1px solid var(--line)}
  .mgtable tbody tr:first-child{padding-top:0;border-top:0}
  .mgtable tbody td{display:block;width:auto;padding:0;border-top:0}
  .mgtable tbody td:empty{display:none}
  .mgtable tbody td.jvname{grid-area:1/1}
  .mgtable tbody td.mgverdict{grid-area:1/2}
  .mgtable tbody td.mgrates{grid-area:2/1}
  .mgtable tbody td.mginterval{grid-area:2/2}
  .mgtable tbody td.mgevidence{grid-area:3/1}
  .mgtable tbody td.mgbox{grid-area:3/2}
  .mgtable tbody td.mgrates::before,.mgtable tbody td.mginterval::before,.mgtable tbody td.mgevidence::before,.mgtable tbody td.mgbox::before{content:attr(data-label);display:block;font-size:11px;line-height:1.2;color:var(--dim)}
}

<body>
<header>
  <h1>Gas Town</h1>
  <span id="verdict" class="pill unknown">UNKNOWN</span>
  <span id="hold" class="quiet" hidden></span>
  <span id="update" class="quiet" hidden></span>
  <span id="healthline">waiting for the town…</span>
  <span id="healthmark" class="pill red" hidden></span>
  <span id="strip"></span>
  <button id="models" type="button" aria-expanded="false" aria-controls="modelspanel" title="every seat, and the model each role runs">models ▸</button>
  <span id="conn" class="off">connecting</span>
  <button id="alertsctl" type="button">alerts: off</button>
</header>

<div id="modelspanel" hidden></div>

<div class="grid">
  <div class="col">
    <section data-fold="birds" data-default-collapsed><h2>Birds <span class="r" id="birdsnote"></span></h2><div class="body" id="birds"></div></section>
    <section data-fold="attention"><h2>Attention <span class="chips" id="attentionchips"></span> <span class="r" id="attentionnote"></span></h2><div class="body" id="attention"></div></section>
    <section id="eventssec" data-fold="events" data-default-collapsed><h2>EVENTS <span class="chips" id="eventschips"></span> <span class="r" id="eventsnote"></span></h2><div class="body" id="events"></div></section>
    <section data-fold="cost"><h2>Cost <span class="r" id="costnote"></span></h2><div class="body" id="cost"></div></section>
    <section data-fold="rigs"><h2>Rigs <span class="r" id="rigsnote"></span></h2><div class="body" id="rigs"></div></section>
    <section data-fold="tiersweep"><h2><span class="sweepico" id="tiersweepico"></span>Tier sweeps <span class="r" id="tiersweepnote"></span></h2><div class="body" id="tiersweep"></div></section>
    <section data-fold="beads"><h2>Beads <span class="r" id="beadsnote"></span></h2><div class="body" id="beads"></div></section>
  </div>
  <div class="col">
    <section id="newssec" data-fold="news" hidden><h2>Hacker News <span class="r" id="newsnote"></span></h2><div class="body" id="news"></div></section>
    <section data-fold="machine"><h2>Machine <span class="r" id="machnote"></span></h2><div class="body" id="machine"></div></section>
    <section data-fold="cloud"><h2>Cloud <span class="r" id="cloudnote"></span></h2><div class="body" id="cloud"></div><h3 class="sub">Deploys <span class="r" id="deploysnote"></span></h3><div class="body" id="deploys"></div></section>
    <section data-fold="forgejo"><h2>Forgejo <span class="r" id="forgejonote"></span></h2><div class="body"><div id="forgejoacts"></div><button id="forgejofeedhead" type="button" class="feedhead" aria-controls="forgejo"></button><div id="forgejo"></div></div></section>
    <section data-fold="om"><h2>om review <span class="r" id="omnote"></span></h2><div class="body" id="om"></div></section>
    <section id="jevsec" data-fold="jev" data-default-collapsed hidden><h2>JEV · <span class="r" id="jevnote"></span></h2><div class="body" id="jev"></div></section>
    <section id="mangosec" data-fold="mango" data-default-collapsed hidden><h2>Mango · <span class="r" id="mangonote"></span></h2><div class="body" id="mango"></div></section>
  </div>
</div>
<!-- Below the grid, full width: Landings, the pane the operator reads daily. Its
     body reads top to bottom: the figures and notes, the Polecats section (kept
     in place by renderTrend, which draws around it), then the landing rows. -->
<section id="trendsec" class="wide" data-fold="landings" hidden><h2>Landings <span class="r" id="trendnote"></span></h2><div class="body" id="trend"><section id="polecatssec" data-fold="polecats"><h2>Polecats <span class="r" id="polecatsnote"></span></h2><div class="body" id="polecats"></div></section></div></section>

<script>
"use strict";
// blindBoxes is set for the length of a push to the detached box each closed
// section's body ids answer with: a closed pane still draws its heading's note
// and its section's summary line, while the body the reader cannot see costs
// nothing until they open the section (gt-quuq5).
let blindBoxes = null;
const $ = id => (blindBoxes && blindBoxes[id]) || document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const fmtDur = s => {
  if (s == null || s < 0) return "–";
  s = Math.round(s);
  if (s < 90) return s + "s";
  const m = Math.round(s / 60);
  if (m < 90) return m + "m";
  const h = Math.floor(m / 60);
  if (h >= 48) return Math.floor(h / 24) + "d";
  return h + "h" + String(m % 60).padStart(2, "0") + "m";
};
// polecatDur is the Landings pane's Polecat column: a bead's polecat time in
// fmtDur's units below 59.5 minutes, then whole hours and minutes with an empty
// minute dropped ("26h") — fmtDur keeps minutes to 89 and pads that hour's
// "00m", which a column of one kind of duration does not want. A positive
// reading under a second reads "<1s" rather than a rounded zero. Null or zero
// is a dash: a crew landing, or a record written before the reading existed
// (gt-90wi1). A lower bound carries a trailing "+" (the figure may understate
// the time) and an upper bound a leading "≤" (it was read from the bead's
// dispatch, so it may overstate it) (gt-v7ptp).
const polecatDur = (secs, lower, upper) => {
  if (secs == null || !(secs > 0)) return "–";
  const s = Math.round(secs);
  let out;
  if (secs < 1) out = "<1s";
  else if (s < 59.5 * 60) out = fmtDur(s);
  else {
    const m = Math.round(s / 60), h = Math.floor(m / 60);
    out = h + "h" + (m % 60 ? String(m % 60).padStart(2, "0") + "m" : "");
  }
  // An upper bound reads "≤23m"; a sub-second one folds the two signs into
  // "≤1s" rather than the "≤<1s" that concatenation would give.
  if (upper) return "≤" + (out.startsWith("<") ? out.slice(1) : out);
  return lower ? out + "+" : out;
};
const age = iso => iso ? fmtDur((Date.now() - new Date(iso).getTime()) / 1000) : "–";
// fmtMS is a span in minutes and seconds, the form the om rework table draws a
// review's time in: "0:48", "12:05". fmtDur rounds to the nearest unit, which
// is what a column of unlike durations wants and not what a column of one
// table's row times does.
const fmtMS = s => {
  s = Math.round(Number(s) || 0);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
};
// firstLine is the opening line of a text another agent wrote — a recommended
// answer, which runs to a paragraph — for a row that carries one line of it.
const firstLine = t => String(t).split("\n")[0].trim();
const clock = iso => new Date(iso).toLocaleTimeString([], {hour12: false});
const money = v => v == null ? "–" : "$" + Number(v).toFixed(2);

// readOf is one poller's last read, off the per-source status the server sends.
// A value whose read failed, or that has aged past a few of the poll's own
// intervals, is stale: the pane keeps drawing the last good value, greyed,
// rather than letting it pass as current. The server stamps the same thing
// (readStaleFactor, internal/dashboard/types.go); the age is measured again here
// because it drifts between pushes, and the two factors must agree (gt-q6h8e).
// A read that has never happened has no age (neverRead): it is stale, and the
// pane says "never read" where an age would be.
function readOf(s, source) {
  const x = (s && s.reads && s.reads[source]) || null;
  if (!x) return null;
  const never = neverRead(x.at);
  const ageSec = never ? null : (Date.now() - new Date(x.at).getTime()) / 1000;
  const every = x.every_sec || 0;
  const stale = !!x.stale || ageSec == null || (every > 0 && ageSec > every * 3);
  return {ageSec: ageSec, error: !!x.error, stale: stale, never: never};
}
// neverRead is the one decider of "never read": a read stamp that is empty, does
// not parse, or is before the year 2000. The server sends a zero time
// (0001-01-01T00:00:00Z) for a source that has never been read, and subtracting
// that from now prints an age in centuries. readOf asks this for a pane's read,
// and every other read-age line asks it for the stamp it draws.
const NEVER_READ_BEFORE = Date.UTC(2000, 0, 1);
const neverRead = at => !at || !(new Date(at).getTime() >= NEVER_READ_BEFORE);
// readAgeWords is the age a pane draws beside one read: "never read" for a read
// that has not happened, "read 4m ago" for one that has, and null when there is
// no read to age (the caller then says so in its own words).
function readAgeWords(r) {
  if (!r) return null;
  if (r.never) return "never read";
  return r.ageSec != null ? "read " + fmtDur(r.ageSec) + " ago" : null;
}
// readInput is the status fields readOf turns into what a pane draws: its stamp,
// its interval and its two flags. A pane that calls readOf names this in its
// read list, so a read that failed or moved on while its value did not still
// draws the pane on a push (gt-quuq5).
function readInput(s, source) {
  const x = (s && s.reads && s.reads[source]) || null;
  return x && [x.at, x.every_sec, x.error, x.stale];
}
// paintsRead greys a pane whose reading is stale and colours its caption in the
// page's own idiom: red for a read that failed, amber for one gone old.
function paintsRead(box, note, r) {
  box.classList.toggle("stale", !!(r && r.stale));
  note.className = "r" + (r && r.stale ? (r.error ? " badc" : " warnc") : "");
}
// readCaption joins a pane's own words with the reason its reading is not
// current, so every pane says which of its numbers are live. A read that has
// never happened says so before the reason it is not current.
function readCaption(r, parts) {
  const never = r && r.never ? "never read" : null;
  const why = r && r.stale ? (r.error ? "read failed" : "stale") : null;
  return parts.filter(Boolean).concat(never ? [never] : [], why ? [why] : []).join(" · ");
}
// failWhy is the reason the server named for a read that failed, held to the
// WHY_MAX characters a reason is drawn at. A read that named none is "".
const WHY_MAX = 200;
function failWhy(s, source) {
  const sm = s.summary || {};
  const why = source === "seats" ? sm.seats_why : source === "ready" ? sm.ready_why : source === "questions" ? (s.questions || {}).why : "";
  return why ? Array.from(String(why)).slice(0, WHY_MAX).join("") : "";
}

let state = null;

// Every state a polecat's session is read into (the State* constants of
// internal/dashboard/types.go), and what the strip draws from it: whether it
// is work in progress — a session is on somebody's bead — and the word the
// strip names a count of them by beside the working number. The reader sends
// states this page has never seen the moment the town learns one, so no state
// is dropped: one in neither table is counted as a state this page does not
// know, and which of them alarm is the reader's own verdict (StripAlarms).
// KEPT_MEANING is what the page says of the "kept (jev)" state, the one the
// daemon keeps a finished sandbox seat in until the jev_rules battery has asked
// about its submission: one sentence, used wherever the page explains it
// (gt-ddg96x). The state tables keep the literal key: the strip test reads them.
const KEPT_MEANING = "finished, and the daemon keeps its seat until the jev_rules battery has asked about its submission";
const POLE_WORKING = {working: 1, quiet: 1, gating: 1, queued: 0, spawning: 0, stalled: 0, "review-needed": 0, recovery: 0, "kept (jev)": 0, "needs-human": 0, "needs-overseer": 0, "needs-operator": 0, parked: 0, idle: 0, unknown: 0};
const POLE_WORD = {queued: "queued", spawning: "spawning", stalled: "stalled", "review-needed": "need review", recovery: "recovering", "kept (jev)": "kept (jev)", "needs-human": "need a human", "needs-overseer": "need the overseer", "needs-operator": "need the operator", parked: "parked", unknown: "unknown (tmux unreadable)", quiet: "quiet"};
// polecatsWorking is the strip's working count and the Work section's summary:
// the live polecats whose state is work in progress. A parked rig holds nothing
// and is counted nowhere, so both readers take their number from here.
function polecatsWorking(polecats) {
  const live = (polecats || []).filter(p => !p.rig_parked);
  return Object.keys(POLE_WORKING).reduce((sum, k) => sum + (POLE_WORKING[k] ? live.filter(p => p.state === k).length : 0), 0);
}

// factBox opens one reading of the strip, joined to the one before it by the
// page's middot.
function factBox(box) {
  if (box.childElementCount) box.append(document.createTextNode(" · "));
  const x = el("span", "");
  box.append(x);
  return x;
}

// fact writes one reading: its value, the name of what it counts and the
// reading's own detail in the title. cls is the verdict the value wears — the
// reader's own token where there is one, the bright one for a reading it had
// nothing to say about — and a reading nobody has made is the strip's own dim;
// lead puts the name first, for a value that only reads as a word.
function fact(box, value, name, opts) {
  opts = opts || {};
  const x = factBox(box);
  const b = el("b", opts.cls == null ? "v" : opts.cls, value);
  if (opts.lead) x.append(document.createTextNode(name + " "), b);
  else x.append(b, document.createTextNode(" " + name));
  if (opts.extra) x.append(document.createTextNode(" · " + opts.extra));
  if (opts.tip) x.title = opts.tip;
  return x;
}

// causeText keys one health field the way the health line does — name, /rig,
// :subject — then the detail that explains it. A NEW cause is a rig with no
// landing yet, not a fault, so it is marked NEW and the pill keeps the town
// verdict's colour: the reader sees which rig is new without reading green as
// broken (gt-30ehe8).
function causeText(c) {
  let k = c.name || "";
  if (c.rig) k += "/" + c.rig;
  if (c.subject) k += ":" + c.subject;
  const text = c.detail ? k + ": " + c.detail : k;
  return c.tag === "NEW" ? "NEW " + text : text;
}

// renderHealthMark draws the strip's pill as the deploys reader decided it
// (health_mark: red, degraded or absent); an absent mark hides the pill.
function renderHealthMark(s) {
  if (pushSkip("healthmark", s)) return;
  const box = $("healthmark"), m = (s && s.deploys && s.deploys.health_mark) || null;
  box.hidden = !m;
  box.className = "pill " + (m && m.state === "red" ? "red" : "degraded");
  box.textContent = m ? m.text : "";
}

// renderHold draws the header's dispatch-hold chip: "hold" in amber while the
// operator's hold file is present, a quiet "dispatch on" when it is not, and
// "hold?" when the file could not be read. Only a reading that says the file
// is absent draws "dispatch on": a failed read, and equally a reading that
// says neither present nor absent, tells the operator nothing, and "dispatch
// on" would claim a hold is off that nothing has ruled out (gt-ifijm,
// gt-zzkhh). The note and the age sit in the title, where a long note costs the
// header no width. A reader that has not reported yet draws "dispatch ?"
// rather than no chip, since an absent chip would read as a town that is
// dispatching.
function renderHold(s) {
  if (pushSkip("hold", s)) return;
  const box = $("hold"), h = (s && s.hold) || null;
  box.hidden = false;
  if (!h) { box.className = "quiet"; box.textContent = "dispatch ?"; box.title = "the hold file has not been read yet"; return; }
  if (h.error) { box.className = "warn"; box.textContent = "hold?"; box.title = "the hold file could not be read: " + h.error; return; }
  if (h.present === true) {
    const set = h.age_seconds == null ? "" : "set " + fmtDur(h.age_seconds) + " ago";
    box.className = "warn"; box.textContent = "hold";
    box.title = [set, h.note].filter(Boolean).join(": ");
    return;
  }
  if (h.present === false) {
    box.className = "quiet"; box.textContent = "dispatch on";
    box.title = "no operator dispatch hold: automatic dispatch may run";
    return;
  }
  box.className = "warn"; box.textContent = "hold?";
  box.title = "the hold file's state is unknown: the reader reported neither a hold nor none";
}

// renderUpdate draws the header's gt update chip beside the hold chip: amber
// while a run is in flight, amber for a run that ended badly, a quiet word for
// one the operator stopped, and nothing at all for a run that ended ok or a
// feed with no update section. A running run whose heartbeat has gone past
// three minutes, or that reports no heartbeat at all, is drawn stalled rather
// than current, because its record is the last thing it wrote, not what it is
// doing now. The tooltip carries the run's id and source and one line per step,
// so the header stays one short chip while the detail is a hover away.
function renderUpdate(s) {
  if (pushSkip("update", s)) return;
  const box = $("update"), u = (s && s.update) || null;
  box.hidden = true; box.className = "quiet"; box.textContent = ""; box.title = "";
  if (!u) return;
  const steps = (u.steps || []).map(st => st.name + ": " + st.result + (st.detail ? " - " + st.detail : ""));
  const run = [u.run_id, u.source].filter(Boolean).join(" · ");
  const tip = lead => [lead].concat(steps).filter(Boolean).join("\n");
  if (u.running) {
    box.hidden = false; box.className = "warn";
    // A heartbeat that is missing or not a number is unknown, and unknown must
    // not read as current: undefined > 180 is false, so the bound alone would.
    if (!Number.isFinite(u.heartbeat_age_sec) || u.heartbeat_age_sec > 180) {
      box.textContent = "update stalled";
      box.title = tip(Number.isFinite(u.heartbeat_age_sec)
        ? "no heartbeat for " + fmtDur(u.heartbeat_age_sec)
        : "no heartbeat reported");
      return;
    }
    box.textContent = "update: " + (u.current || "starting") + " " + fmtDur(u.elapsed_sec);
    box.title = tip(run);
    return;
  }
  if (u.outcome === "ok") return;
  box.hidden = false;
  if (u.outcome === "interrupted") {
    box.className = "quiet"; box.textContent = "update: interrupted";
  } else {
    // A failed, partial or aborted run, and an outcome this page does not know,
    // which is not an ok run either: an unknown state must not read as clean.
    box.className = "warn"; box.textContent = "update: " + (u.outcome || "unknown");
  }
  box.title = tip(run);
}

// renderHealth shows the verdict and, when it is not green, the worst cause
// beside it, so the pill answers "why" without reading the line under it.
function renderHealth(h) {
  if (pushSkip("health", h)) return;
  const v = (h && h.verdict) || "unknown";
  const causes = (h && h.causes) || [];
  const p = $("verdict");
  p.className = "pill " + v;
  p.textContent = v.toUpperCase() + (causes.length ? " · " + causeText(causes[0]) : "");
  p.title = causes.map(causeText).join("\n");
  $("healthline").textContent = h && h.line ? h.line : "no health report";
}

// seatCount is a seat's live count as the strip and the models panel print it:
// the number the dispatcher's roster counts, "–" before that read is made,
// and "?" when it failed, so a failed read is not drawn as one not yet made.
// why names the missing count for the cell's hover.
function seatCount(sr, m) {
  if (sr.live != null) return {text: String(sr.live), why: ""};
  if (m && m.seats_unreadable) return {text: "?", why: "the dispatcher's roster could not be read"};
  return {text: "–", why: "the dispatcher's roster has not been read yet"};
}

// seatFacts is the strip's seats: what each open seat runs and how full it is,
// off the seat rows the reader fills from the dispatcher's roster, so the strip
// counts the seats a sling is refused against rather than every polecat the
// inventory lists (gt-ly90n). A closed seat, which nothing may fill, is left to
// the models line; a seat whose config nobody could read says unknown rather
// than passing as a seat nobody runs. No rows at all is a settings read that has
// not come back, not a town with no seats: the reader always sends the seats it
// read.
function seatFacts(m) {
  if (!m || !(m.seat_rows || []).length) return null;
  const out = [];
  for (const sr of m.seat_rows) {
    const key = sr.key || "no config key recorded";
    if (sr.unknown) { out.push({text: "seats unknown", title: "the seat map could not be read · " + key}); continue; }
    if (sr.closed) continue;
    const c = seatCount(sr, m);
    out.push({
      text: (sr.agent ? seatName(sr.agent) : "no agent") + " " + c.text + "/" + sr.cap,
      title: (sr.agent ? sr.agent + " · " : "") + key + (c.why ? " · " + c.why : ""),
    });
  }
  return out;
}

// renderStrip is the page's one status strip, and the whole of its top: the
// day's shape and what needs the operator as one line of facts, each drawn once
// from the reader that owns it — the landings off the Landings pane's own
// window, the seats off the dispatcher's roster, the queue off the ready read,
// the host and the install off the Machine pane's. A reading nobody has made
// says so, in the strip's own dim: a strip that drew a zero it had not read
// would answer the operator with a fact it invented.
function renderStrip(s) {
  if (pushSkip("strip", s)) return;
  const box = $("strip");
  box.replaceChildren();
  const sm = s.summary || {};
  // The verdicts the reader decided against the readings it holds, so no
  // threshold is restated here (gt-ywlei).
  const a = s.strip || {};

  // Landings: the trend's own last 24 hours. No trend is a window nobody has
  // read yet, not a day in which nothing landed.
  const t = s.trend || null;
  const landed = ((t && t.hours) || []).reduce((n, h) => n + h.landed, 0);
  fact(box, t ? String(landed) : "–", "landed/24h",
    {cls: t ? "v" : "", tip: t ? "what landed in the last 24 hours, off the Landings pane's own window" : "the landings window has not been read yet"});

  // Seats: one entry per open seat.
  const seats = seatFacts(s.models);
  const sp = factBox(box);
  if (!seats) { sp.append(el("b", "", "–"), document.createTextNode(" seats")); sp.title = "the town's settings have not been read yet"; }
  else if (!seats.length) { sp.append(el("b", "", "no open seats")); sp.title = "every seat is closed: the pool seat and the second seat name no agent the dispatcher could run"; }
  else seats.forEach((f, i) => { const x = el("span", "", (i ? " · " : "") + f.text); if (f.title) x.title = f.title; sp.append(x); });

  // Working: the polecats on the job, off POLE_WORKING, so which states are
  // work in progress is one table. A parked rig is stood down on purpose and
  // holds nothing, so it is counted nowhere; every other state the town has is
  // named beside the count.
  const pcs = s.polecats || [];
  const live = pcs.filter(p => !p.rig_parked);
  const n = k => live.filter(p => p.state === k).length;
  const active = polecatsWorking(pcs);
  const worst = s.polecats ? (a.working || "") : "";
  const rest = Object.keys(POLE_WORD).filter(k => n(k)).map(k => n(k) + " " + POLE_WORD[k]);
  const strangers = live.filter(p => !(p.state in POLE_WORKING)).length;
  if (strangers) rest.push(strangers + " in a state this page does not know");
  const parked = pcs.length - live.length;
  const also = [sm.seats_cap ? "cap " + sm.seats_cap : null, parked ? parked + " in parked rigs" : null].concat(rest).filter(Boolean).join(" · ");
  fact(box, s.polecats ? String(active) : "–", "working",
    {cls: worst, tip: "polecats holding work with a live session" + (also ? " · " + also : "") + (worst === "bad" ? " · the Work panel has the rows" : "")});

  // Waiting to land: the ready reader's count, and how long the oldest has
  // waited. The count is drawn even when the read behind it failed or aged —
  // it is never a drained queue — and the age is drawn live, because it is the
  // one reading that moves between the reader's snapshots.
  const rr = readOf(s, "ready");
  const q = sm.ready_to_land;
  const oldest = sm.oldest_ready ? (Date.now() - new Date(sm.oldest_ready).getTime()) / 1000 : null;
  const readWhy = failWhy(s, "ready");
  const why = rr && rr.stale ? (rr.error ? "the read that lists what is waiting to land failed" + (readWhy ? ": " + readWhy : "") : "the last count of what is waiting to land is old") : null;
  if (q == null && why) fact(box, "unavailable", "waiting to land", {cls: a.waiting || "", tip: why});
  else fact(box, q == null ? "–" : String(q), "waiting to land",
    {cls: q == null ? "" : (a.waiting || ""), extra: oldest == null ? null : "oldest " + fmtDur(oldest),
     tip: ["beads submitted and waiting for the landing worker", why, q == null && !why ? "the read that lists them has not come back" : null, oldest == null ? null : "the age is the oldest one's"].filter(Boolean).join(" · ")});

  // Needs you: the human's share of the one attention list, off the same
  // payload the Attention panel draws, so the strip and the panel cannot
  // disagree about what is waiting (gt-bi6w0).
  const at = s.attention || null;
  const failed = at ? (at.failed || []) : [], pending = at ? (at.pending || []) : [];
  const waiters = failed.join(" and the "), unread = pending.join(" and the ");
  const reasons = failed.map(f => failWhy(s, f)).filter(Boolean).join(" · ");
  if (!at) fact(box, "–", "needs you", {cls: a.needs_you || "", tip: "the list of what is waiting has not been read yet"});
  else if (failed.length) fact(box, "unavailable", "needs you", {cls: a.needs_you || "",
    tip: "the " + waiters + " could not be read" + (reasons ? ": " + reasons : "") + (pending.length ? ", and the " + unread + " have not been read yet" : "")});
  else if (pending.length) fact(box, "–", "needs you", {cls: a.needs_you || "", tip: "the " + unread + " have not been read yet"});
  else {
    // A reader that capped rows out of the list never read their owner, so the
    // human's count is a floor: the strip draws "N+" rather than a number that
    // leaves the capped rows out in silence, and "?" rather than a zero that
    // passes a count nobody made off as none (gt-bi6w0). Both figures count
    // only the rows that need a person: a row in the pipeline is work already
    // in flight and clears without the human, so counting it here is what
    // buried the ones that did need them (gt-tv5v2).
    const mine = at.mine || 0, capped = at.more || 0, unknown = capped > 0 && mine === 0;
    const needs = (at.rows || []).filter(needsYou).length;
    fact(box, unknown ? "?" : String(mine) + (capped ? "+" : ""), "needs you", {cls: a.needs_you || "",
      tip: (unknown
        ? "the readers capped " + capped + " rows out of the list and none of the rows they read is the human's, so how many are is not known"
        : mine + " of the " + needs + " rows needing a person " + (mine === 1 ? "is" : "are") + " the human's" +
          (capped ? " · " + capped + " more the readers capped out, whose owner they did not read" : "")) +
        " · the Attention panel below has the rows"});
  }

  // The overseer's standing and the dispatcher's last tick: the two readings of
  // the former Overseer panel that go stale and matter when they do, one place
  // each (gt-ztrv1). The standing is the reader's own verdict against the silence
  // window the daemon's silent-overseer rule uses. The tick is aged live: the
  // dispatcher ticks every minute, so it reads amber past 150 s and alert red
  // past 300 s, the bound the dispatcher's own alert uses.
  const ov = s.overseer || null, dp = s.dispatch || null;
  const ovAlive = !!ov && !ov.unavailable && ov.status === "alive";
  const standing = !ov ? "–" : ov.unavailable ? "unavailable" : ov.status === "none" ? "no heartbeat" : ovAlive ? "alive" : "silent window " + fmtDur(ov.silent_after_sec);
  fact(box, standing, "overseer", {lead: true, cls: !ov ? "" : ovAlive ? "v" : "warn",
    tip: !ov ? "the overseer's heartbeat has not been read yet"
      : ov.unavailable ? "the overseer's heartbeat or journal could not be read"
      : ov.status === "none" ? "the overseer has never beaten"
      : ovAlive ? "the overseer's heartbeat is inside its silence window" + (ov.last_active_sec != null ? " · last active " + fmtDur(ov.last_active_sec) + " ago" : "")
      : "the overseer has been silent past its window" + (ov.last_active_sec != null ? " · last active " + fmtDur(ov.last_active_sec) + " ago" : "")});
  const tickSec = dp ? (Date.now() - new Date(dp.at).getTime()) / 1000 : null;
  fact(box, tickSec == null ? "none logged" : fmtDur(tickSec) + " ago" + (tickSec > 300 ? " · not ticking" : ""), "dispatcher last tick",
    {lead: true, cls: tickSec == null ? "" : tickSec > 300 ? "bad" : tickSec > 150 ? "warn" : "v",
     tip: tickSec == null ? "no dispatcher tick in the daemon log yet"
       : tickSec > 300 ? "the dispatcher has not ticked for " + fmtDur(tickSec) + " (it ticks every minute)"
       : "the spec dispatcher's last tick, from the daemon log (it ticks every minute)"});

  // The host: its idle share leads, and the load average trails it. macOS
  // counts running threads in its load average, so a load-led reading calls a
  // busy host a drowning one (gt-auiji). Each of the load readings is drawn on
  // its own, so one the host did not report never takes the others down with
  // it, and the colour is the reader's own verdict on the idle share.
  const m = s.machine || {};
  const host = [m.dolt_cores != null ? "dolt " + m.dolt_cores.toFixed(1) + " cores" : null,
    m.load1 == null ? null : "load " + m.load1.toFixed(1) + (m.cores ? " on " + m.cores + " cores" : ""),
    m.load5 == null ? null : "5m " + m.load5.toFixed(1),
    m.load15 == null ? null : "15m " + m.load15.toFixed(1)].filter(Boolean).join(" · ");
  fact(box, m.cpu_idle == null ? "–" : Math.round(m.cpu_idle) + "%", "idle",
    {cls: m.cpu_idle == null ? "" : (m.host_state || "v"), tip: (host ? host + " · " : "") + "the Machine pane has the curve"});

  // The install and the ship time: numbers the operator reads rather than
  // alarms, so each is drawn whatever it says. The strip is the page's only
  // readout of the install's distance from main.
  fact(box, sm.behind == null ? "–" : sm.behind === 0 ? "current" : sm.behind + " behind", "vs main",
    {cls: a.behind || "",
     tip: sm.main_tip ? "the installed gt against main " + sm.main_tip + " (" + (sm.installed_gt || "?") + "), as of the install repo's last fetch" : "the installed gt against main, as of the install repo's last fetch"});
  fact(box, sm.median_deploy_min == null ? "–" : Math.round(sm.median_deploy_min) + "m", "to ship",
    {cls: sm.median_deploy_min == null ? "" : "v", tip: "the median dispatch→deploy" + (sm.deploy_waiting ? " · " + sm.deploy_waiting + " landed and awaiting a deploy" : "") + " · the Deploys block has the runs"});
  if (sm.deploy_waiting > 0) fact(box, String(sm.deploy_waiting), "awaiting deploy",
    {tip: "beads that landed and are waiting for their deploy; the Deploys block has the runs"});
}

// The models line opens the seat table and the model-per-role table the strip's
// seats fact carries the counts of, and starts closed so the top of the page is
// one line until somebody asks for the detail. It keeps its own store: the
// panes' folds are keyed by their titles in gt-collapsed (setupCollapse), where
// a stored true means collapsed, and a key of its own needs no reader to invert
// it.
const MODELS_OPEN_KEY = "gt-models-open";
let modelsOpen = false;
try { modelsOpen = localStorage.getItem(MODELS_OPEN_KEY) === "1"; } catch (e) {}
function paintModelsLine() {
  const b = $("models");
  b.textContent = "models " + (modelsOpen ? "▾" : "▸");
  b.setAttribute("aria-expanded", modelsOpen ? "true" : "false");
  $("modelspanel").hidden = !modelsOpen;
}
function toggleModels() {
  modelsOpen = !modelsOpen;
  paintModelsLine();
  try { localStorage.setItem(MODELS_OPEN_KEY, modelsOpen ? "1" : "0"); } catch (e) {}
  renderModelsPanel(state || {});
}

// renderModelsPanel is what the models line opens: each polecat seat with its
// agent, cap and live count, and the model each role runs on with the config
// key it came from. A role whose live setting differs from the town model table
// wears a drift badge naming what the table says. Every field is a fresh read
// of the configs, and one the server could not read says unknown, never a blank
// that looks like a value. A folded line keeps no table in the DOM, and one
// with nothing to open says so in a line.
function renderModelsPanel(s) {
  if (pushSkip("models", s)) return;
  const box = $("modelspanel");
  if (!modelsOpen) { box.replaceChildren(); return; }
  const m = s.models;
  box.replaceChildren();
  const seats = (m && m.seat_rows) || [], roles = (m && m.roles) || [], activity = (m && m.activity) || [];
  const unreadable = (m && m.activity_unreadable) || [];
  if (!seats.length && !roles.length && !activity.length && !unreadable.length) { box.append(el("div", "empty", "no seats and no roles have been read yet")); return; }
  const table = (cols, rows) => {
    const t = el("table"), head = el("tr");
    cols.forEach(([h, num]) => head.append(el("th", num ? "n" : "", h)));
    t.append(head, ...rows);
    return t;
  };
  // One row per agent in the seat map, in the order gt pool show prints them.
  // A seat nothing may fill now says why: a cap of 0, or its closed window.
  const seatRows = seats.map(sr => {
    const tr = el("tr");
    const name = el("td", "", sr.unknown ? "unknown" : seatName(sr.agent));
    name.title = (sr.agent ? sr.agent + " · " : "") + sr.key;
    tr.append(name);
    tr.append(el("td", sr.closed || sr.unknown ? "title" : "", sr.unknown ? "the seat map could not be read" : sr.state || ""));
    const open = !sr.closed && !sr.unknown;
    const c = seatCount(sr, m);
    const count = el("td", "n", open ? c.text + "/" + sr.cap : "");
    if (open && c.why) count.title = c.why;
    tr.append(count);
    return tr;
  });
  const roleRows = roles.map(rr => {
    const tr = el("tr");
    const role = el("td", "", rr.role); role.title = rr.key; tr.append(role);
    const model = el("td"); model.title = rr.note || rr.key;
    model.append(el("span", rr.model ? "" : "title", rr.model || "unknown"));
    if (rr.drift) {
      const b = el("span", "badge warnc", "drift"); b.title = "the town model table (settings/models.json) says " + rr.drift;
      model.append(document.createTextNode(" "), b);
    }
    tr.append(model);
    return tr;
  });
  // Each agent's last 24 hours: what its seats landed and what the landing
  // worker refused. A record naming no agent is counted for nobody, so an
  // agent missing from the table is one no record named, never one that
  // landed nothing. A source that could not be read is named under the table,
  // because without the name a lost file and an empty window are the same
  // table (gt-h3cwd).
  const activityRows = activity.map(aa => {
    const tr = el("tr");

    tr.append(agent, el("td", "n", String(aa.landed)), el("td", "n", String(aa.rejected)));

  }
  if (unreadable.length) {
    const line = el("div", "empty warnc", "activity unreadable: " + unreadable.join(" · "));
    line.title = "these sources could not be read, so their records are not in the counts above; an agent missing from the table is one no record named, never one that landed nothing";
    box.append(line);

function copyText(text, btn) {

}
const STATE_HELP = {

// The Work panel's folds (the seats that need a look, idle seats, parked-rig

}
// Names for the polecats in view. label() is the short name, because each rig
// draws its polecats from that rig's own name theme, so the name alone places
// the polecat — except a short name that more than one rig uses, which without
// its rig would name none of them. rigOf() is the one rig using a short name,
// so a cell can carry the full rig/name in its title.
function polecatNames(polecats) {
  const rigs = new Map();

  };
}

// The Work panel: a row per seat holding something, the queue's

// worseRead picks the reading a pane joined from two sources wears, and the
// note names which of the two it was.
function worseRead(a, b) {
  if (!a) return b;
  if (!b) return a;
  if (a.stale !== b.stale) return a.stale ? a : b;
  if (a.error !== b.error) return a.error ? a : b;
  return (a.ageSec || 0) >= (b.ageSec || 0) ? a : b;
}

// workHead is a row of the seat table's grid, spanning the same five columns as

function workHead() {
  const tr = el("div", "workrow whead");

   ["Bead", "the bead on the seat's hook, with its title"], ["State", "the state the town's inventory reads the seat into"],
   ["Age", "how long the bead has waited: a queued bead since its submit, any other since the bead was dispatched; the hover repeats the dispatch time and adds how long its session has been silent"]].forEach(([h, tip]) => { const c = el("span", "", h); c.title = tip; tr.append(c); });

}

// The rows on screen, so the ages can move between redraws.
let workSeatRows = [];

// SPAWN_LONG is how long a spawning row may read before its age is warned: a
// sling this old that has not put its session up is not starting, it is stuck
// (gt-iv7jf).
const SPAWN_LONG = 5 * 60;

// paintAges writes the two readings a seat's clock moves: the state badge's
// tooltip carries how long its session has been silent, the age cell how long
// the row has been in the state it shows — a queued bead since its submit (the
// clock the Landings panel ages the same bead by), any other since the bead was
// dispatched. The dispatch time stays in the cell's tooltip, so the row still
// says how long the bead has been in progress, across every seat that worked it
// (gt-iv7jf, gt-tzbtf).
function paintAges(r, now) {
  const p = r.p;
  const dispatchedSec = p.slung ? (now - new Date(p.slung).getTime()) / 1000 : null;
  const since = p.state_since ? (now - new Date(p.state_since).getTime()) / 1000 : dispatchedSec;
  const quiet = p.has_session && p.last_active ? (now - new Date(p.last_active).getTime()) / 1000 : null;
  const silent = quiet != null ? " · its session last printed " + fmtDur(quiet) + " ago" : "";
  const stuck = p.state === "spawning" && since > SPAWN_LONG ? "still spawning after " + fmtDur(since) : "";
  const dispatched = dispatchedSec == null ? "" : " · dispatched " + fmtDur(dispatchedSec) + " ago";
  const stateTip = "in " + p.state + (since == null ? "" : " for " + fmtDur(since));
  r.badge.title = (STATE_HELP[p.state] || "") + (p.reason && p.bead ? " — " + p.reason : "") + silent;
  // A seat holding no bead has no age of its own unless its state has a clock:
  // a kept seat waits since its submit (gt-ddg96x).
  const aged = p.bead || p.state_since;
  r.age.className = "wnum" + (p.bead && (stuck || since > 5400 || (quiet != null && quiet >= 600)) ? " warnc" : "");
  r.age.textContent = aged ? (since == null ? "–" : fmtDur(since)) : "";
  r.age.title = aged ? (stuck || stateTip) + dispatched + silent : "";
}

// seatShortNames is the one table of the sandbox seats' short names, read by
// every place the page prints a seat or agent name, so a later seat is one line
// here. The seat keys, bead labels and config keep the full name.
const seatShortNames = new Map([
  ["sbx-flash", "flash"],
  ["sbx-haiku", "haiku"],
]);

// seatName is an agent's name where the strip and the models table print it: a
// sandbox seat by its short name, any other agent whole.
function seatName(agent) {
  return seatShortNames.get(agent) || agent;
}

// modelWords are the model families the town runs, the short word an operator
// asks for: the cell reads flash for deepseek-flash.
const modelWords = new Set(["sonnet", "opus", "haiku", "flash", "pro", "fable"]);

// shortAgent is the Agent cell's name: a sandbox seat by its short name, else a
// model family without its provider prefix. A name that is not one of the model
// words is a seat's own name rather than a model, and shows whole (gt-a12ozf).
function shortAgent(agent) {
  const seat = seatShortNames.get(agent);
  if (seat) return seat;
  const model = /^(?:claude|deepseek)-(.+)$/.exec(agent);
  return model && modelWords.has(model[1]) ? model[1] : agent;
}

// workRow is one seat. Every cell clips with an ellipsis and carries its whole

function workRow(names, p, now) {

    ? " · landed " + p.landed_24h + " in 24h, om approved " + Math.round(p.approved_24h / p.landed_24h * 100) + "%" +
      (p.avg_score_24h != null ? ", average score " + p.avg_score_24h.toFixed(2) : "")
    : "";
  cell("wname", names.label(p.rig, p.name), p.rig + "/" + p.name + landed);
  // A seat names a model only for a bead it holds: the agent a seat records is
  // the one its last job ran, and the model for a bead is picked when the bead

  // the inventory reads it into (gt-hnztc, gt-70txs). The cell shows the agent

// The seat order in the Work table: the seats the town is using rank first,
// and a state that wants an operator is folded below them (gt-n7yb8). A state
// this table does not name draws with the live seats, last, so a state added
// later is seen rather than hidden.
const WORK_RANK = {working: 0, spawning: 1, queued: 2, "kept (jev)": 2, gating: 3, quiet: 4,
  "needs-human": 5, "needs-overseer": 5, "needs-operator": 5, stalled: 6, unknown: 7, recovery: 8, "review-needed": 9};
const WORK_LOOK = new Set(["needs-human", "needs-overseer", "needs-operator", "stalled", "unknown", "recovery", "review-needed"]);
const workRank = p => WORK_RANK[p.state] == null ? 10 : WORK_RANK[p.state];

// workGroups is how the Polecats table splits the seats: the live seats at
// work, the seats that want a look, the parked rigs and the idle pool. The
// table draws these groups and the fold header counts the look and idle ones
// from them, so the two cannot disagree (gt-lpo20).
function workGroups(pcs) {
  pcs = pcs || [];
  return {
    live: pcs.filter(p => !p.rig_parked && p.state !== "idle" && !WORK_LOOK.has(p.state)),
    look: pcs.filter(p => !p.rig_parked && p.state !== "idle" && WORK_LOOK.has(p.state)),
    parked: pcs.filter(p => p.rig_parked),
    idle: pcs.filter(p => p.state === "idle" && !p.rig_parked),
  };
}

// workSeats draws the seats in the table: the live seats first in rank order,
// then the seats that want an operator, the parked rigs and the idle pool, each
// folded under a summary.
function workSeats(box, s, pcs, r) {
  workSeatRows = [];
  if (!pcs.length) {
    // An empty list is a town with no polecats only when the seats actually
    // read (gt-q6h8e).

    return;
  }
  const names = polecatNames(pcs);
  const now = Date.now();
  const byName = (x, y) => (x.rig + x.name).localeCompare(y.rig + y.name);
  const ranked = list => list.sort((x, y) => workRank(x) - workRank(y) || byName(x, y));
  const groups = workGroups(pcs);
  const live = ranked(groups.live);
  const look = ranked(groups.look);
  const parked = groups.parked.sort((x, y) => (x.state === "idle") - (y.state === "idle") || byName(x, y));
  const idle = groups.idle.sort((x, y) => ((y.landed_24h || 0) - (x.landed_24h || 0)) || byName(x, y));
  const table = el("div", "wtable");

  // the table's grid through a wrapper, so a collapsed group's rows still line
  // up with the live ones when it opens (gt-n7yb8).
  const fold = (label, list, open, set) => {
    const d = document.createElement("details");
    d.className = "wfold";

  };

  if (parked.length) fold(parked.length + " in parked rigs (stood down on purpose; not alerts)", parked, openParkedRig, v => { openParkedRig = v; });
  if (idle.length) fold(idle.length + " idle (free to take work; the model is chosen when work is dispatched)", idle, openIdle, v => { openIdle = v; });
}

// blockedLine counts the beads waiting on another bead apart from the leaked
// molecule step wisps, and says so when the count is not a whole reading: the
// queue read failed, the page was sent no split, or a store could not be read.
function blockedLine(q, r) {
  const line = el("div", "wblocked");
  const gap = why => {
    line.className = "wblocked warnc";
    line.append(el("b", "", "blocked: unavailable"), el("span", "", " — " + why));
    line.title = why;
    return line;
  };
  if (r && r.error) return gap("the queue read failed");
  if (typeof q.blocked_work !== "number" || typeof q.blocked_wisps !== "number") return gap("the server sent no blocked/wisp split");
  const work = q.blocked_work, wisps = q.blocked_wisps, down = q.unreadable || [];
  if (wisps > 0 || down.length) line.className = "wblocked warnc";
  if (down.length) line.append(el("span", "", "at least "));
  line.append(el("b", "", String(work)), el("span", "", work === 1 ? " bead blocked" : " beads blocked"));
  if (wisps) line.append(document.createTextNode(" · "), el("b", "", String(wisps)), el("span", "", wisps === 1 ? " leaked step wisp" : " leaked step wisps"));
  if (down.length) line.append(el("span", "", " · " + down.join(", ") + " unreadable"));
  line.title = wisps
    ? "a leaked step wisp is a molecule step nothing will run — a bead whose id carries -wisp-, or a step poured under a molecule. They are not blocked work; gt-x1d8s is the leak."
    : "beads waiting on another bead to close";
  if (down.length) line.title += " · the stores named could not be read, so their beads are not counted";
  return line;
}

// dispatchableCount is the queue's dispatchable figure: the shaped, unassigned
// ready beads outside the town store, which is the ready list's "start now"
// piece. The Beads fold header names it "dispatchable"; the panel's own header
// counts it as the partition's "start now" tile (gt-lpo20, gt-xwul0).
function dispatchableCount(q) {
  return ((q && q.ready) || []).filter(b => readyPiece(b) === "now").length;
}

// workQueue draws what is waiting: the summary, the blocked line, and the whole
// list folded below them.
function workQueue(box, s, q, r) {
  if (!q) {
    box.append(el("div", "empty", r ? "unavailable — the work queue could not be read" : "reading the work queue…"));
    return;
  }
  const sum = el("div", "kv wsum");
  const add = (v, k, tip) => { const x = el("div"); x.title = tip; x.append(el("b", "", String(v)), el("span", "", k)); sum.append(x); };
  // The header names what the ready list is made of (gt-xwul0): the same six
  // pieces the chips filter by, in the same order, each tile saying the rule it
  // counts, and a piece counting nothing left out. The pieces are the header's
  // only count of ready beads; the ready total follows them, and the fold
  // summary keeps "dispatchable" for the start-now piece it has always named.
  const pieces = {};
  ((q && q.ready) || []).forEach(b => { const k = readyPiece(b); pieces[k] = (pieces[k] || 0) + 1; });
  READY_PIECES.forEach(p => { if (pieces[p.key]) add(pieces[p.key], p.label, p.tip); });
  add(q.ready_total || 0, "ready", "open beads with nothing blocking them");
  add(q.landing_total || 0, "landing", "submitted and waiting for the landing worker");
  box.append(sum);
  box.append(blockedLine(q, r));

  const d = document.createElement("details");
  d.className = "wqueue";
  d.open = openQueueList;
  d.ontoggle = () => { openQueueList = d.open; };
  const total = (q.ready_total || 0) + (q.landing_total || 0) + (q.blocked_total || 0);
  d.append(el("summary", "title", "the full queue list · " + total + " beads"));
  const list = el("div", "qlist");
  drawQueueList(list, s);
  d.append(list);
  box.append(d);
}

// polecatsKey and beadsKey are what each panel's rows are drawn from. A panel is
// left alone while it is unchanged, so a redraw never fights the operator's own
// clicks in the list; the ages move through paintAges instead. A seat is keyed as
// JSON so a comma inside a title or description cannot make two seats read as one
// key.
function polecatsKey(s) {
  const seats = (s.polecats || []).map(p => JSON.stringify([p.rig, p.name, p.state, p.rig_parked, p.agent, p.bead, p.title, p.description, p.reason, p.slung || "", p.state_since || "", p.last_active || "", p.landed_24h, p.approved_24h, p.avg_score_24h])).join(";");
  return [s.summary_at, seats].join("|");
}
function beadsKey(s) {
  const q = s.queue;
  // The dispatcher's skips share a poll with the queue neither of them rides:
  // its own reader ticks six times as often, and it is what tags a row unshaped.
  const named = ((s.dispatch && s.dispatch.named) || []).map(n => n.bead + ":" + (n.reason || "")).join(",");
  return [q && q.at, q && q.ready_total, q && q.landing_total, q && q.blocked_total, q && q.blocked_work, q && q.blocked_wisps, q && (q.unreadable || []).join(","), named,
    qTab, qRig, qShape, qWisp, [...qOpen].join(","), Object.keys(qDetail).map(k => k + (qDetail[k].loading ? "L" : qDetail[k].error ? "E" : "D")).join(",")].join("|");
}

// renderPolecats draws the Polecats panel: the seats table and its note. The note
// and the ages are written on every call, above the unchanged-key early return,
// so they keep moving between polls (gt-q6h8e).
function renderPolecats(s, force) {
  if (!force && pushSkip("polecats", s)) return;
  const box = $("polecats");
  const pcs = s.polecats || [];
  const rSeats = readOf(s, "seats");
  paintsRead(box, $("polecatsnote"), rSeats);
  const parts = [];
  if (s.summary_at || (rSeats && rSeats.never)) parts.push(neverRead(s.summary_at) ? "seats never read" : "seats read " + age(s.summary_at) + " ago");
  // A seats read that never happened is named "never read" above, so it is not also called "old".
  if (rSeats && rSeats.stale && (rSeats.error || !rSeats.never)) {
    const seatsWhy = failWhy(s, "seats");
    parts.push(rSeats.error ? "the seats read failed" + (seatsWhy ? ": " + seatsWhy : "") : "the seats read is old");
  }
  // A kept-seat read that failed leaves the seats drawn without it; the note
  // names the failure beside them (gt-ddg96x).
  const keptError = (s.summary || {}).kept_error;
  if (keptError) parts.push("kept seats not read (" + KEPT_MEANING + "), so each shows as the recovery it is kept from: " + keptError);
  $("polecatsnote").textContent = parts.join(" · ");
  if (keptError) $("polecatsnote").classList.add("warnc");

  const key = polecatsKey(s);
  if (!force && key === pKey) { const now = Date.now(); workSeatRows.forEach(r => paintAges(r, now)); return; }
  pKey = key;
  box.replaceChildren();
  workSeats(box, s, pcs, rSeats);
}

// renderBeads draws the Beads panel: what is waiting, the blocked line and the
// queue list, with the queue read's own note.
function renderBeads(s, force) {
  if (!force && pushSkip("beads", s)) return;
  const box = $("beads");
  const q = s.queue;
  const rQueue = readOf(s, "queue");
  paintsRead(box, $("beadsnote"), rQueue);
  const parts = [];
  if (q) parts.push(neverRead(q.at) ? "queue never read" : "queue read " + age(q.at) + " ago");
  if (rQueue && rQueue.stale) parts.push(rQueue.error ? "the queue read failed" : "the queue read is old");
  $("beadsnote").textContent = parts.join(" · ");

  const key = beadsKey(s);
  if (!force && key === bKey) return;
  bKey = key;
  box.replaceChildren();
  workQueue(box, s, q, rQueue);
}

function spark(points, w, h, color) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 " + w + " " + h);
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("class", "spark");
  if (points.length < 2) return svg;
  const max = Math.max(...points, 1);
  const d = points.map((v, i) => (i / (points.length - 1) * w).toFixed(1) + "," + (h - 2 - v / max * (h - 6)).toFixed(1)).join(" ");
  const pl = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
  pl.setAttribute("points", d); pl.setAttribute("fill", "none"); pl.setAttribute("stroke", color); pl.setAttribute("stroke-width", "1.5");
  svg.append(pl);
  return svg;
}

const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
// chartSVG draws one or more time series. A null value breaks the line, so a
// gap in the data is a gap in the drawing, not a line across it.
function chartSVG(series, x0, x1, w, h, gapMs) {
  gapMs = gapMs || 45 * 60e3;   // a quiet spell is a gap, not a slope between two landings
  const svg = svgEl("svg", {viewBox: "0 0 " + w + " " + h, preserveAspectRatio: "none", class: "chart"});
  let max = 0;
  for (const s of series) for (const p of s.pts) if (p.v != null && p.v > max) max = p.v;
  if (max <= 0) return svg;
  const span = Math.max(1, x1 - x0);
  const X = t => (Math.min(Math.max(t, x0), x1) - x0) / span * (w - 6) + 3;
  const Y = v => h - 4 - v / max * (h - 10);
  series.forEach(s => {
    let run = [];
    const flush = () => {
      if (run.length > 1) svg.append(svgEl("polyline", {points: run.join(" "), fill: "none", stroke: s.color, "stroke-width": "1.2", "stroke-opacity": "0.8"}));
      run = [];
    };
    let prev = null;
    for (const p of s.pts) {
      if (p.v == null) { flush(); prev = null; continue; }
      if (prev != null && p.t - prev > gapMs) flush();
      const x = X(p.t).toFixed(1), y = Y(p.v).toFixed(1);
      run.push(x + "," + y);
      svg.append(svgEl("circle", {cx: x, cy: y, r: "1.4", fill: s.color}));
      prev = p.t;
    }
    flush();
  });
  return svg;
}
function legend(items) {
  const d = el("div", "legend");
  for (const [color, label] of items) {
    const x = el("span");
    const sw = el("i", "sw"); sw.style.background = color;
    x.append(sw, document.createTextNode(label));
    d.append(x);
  }
  return d;
}
function median(xs) {
  const v = xs.filter(x => x != null).sort((a, b) => a - b);
  if (!v.length) return null;
  const m = Math.floor(v.length / 2);
  return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
}

// Four evenly spaced time labels and "now", under a chart that spans t0..t1.
function timeAxis(t0, t1) {
  const hhmm = ms => new Date(ms).toLocaleTimeString([], {hour12: false}).slice(0, 5);
  const a = el("div", "axis");
  for (let i = 0; i < 4; i++) a.append(el("span", "", hhmm(t0 + i * (t1 - t0) / 4)));
  a.append(el("span", "", "now"));
  return a;
}

// backoffDetail is a failing landing's run of failures, its next retry and the
// last error's first line.
function backoffDetail(r) {
  const parts = [(r.failures || 0) + " in a row"];
  if (r.next_try) {
    const inSecs = (new Date(r.next_try) - Date.now()) / 1000;
    parts.push(inSecs > 0 ? "next try in " + fmtDur(inSecs) : "retrying now");
  }
  if (r.detail) parts.push(r.detail);
  return parts.join(" · ");
}

// The beads waiting for the landing worker as rows, oldest wait first: the
// Queue reader's landing list, so a bead submitted with gt done shows in the
// pane that watches landings. A bead the worker has already taken has a live
// row below, so it is dropped here — the live row wins (gt-zc45r).
const QUEUED_LANDING_MAX = 10;
function queuedLandings(s, rows) {
  const waiting = (s.queue && s.queue.landing) || [];
  const taken = new Set((rows || []).map(r => r.bead));
  const since = b => b.updated_at ? new Date(b.updated_at).getTime() : 0;
  return waiting.filter(b => !taken.has(b.id)).sort((a, b) => since(a) - since(b));
}
