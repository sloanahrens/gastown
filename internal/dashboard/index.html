// A queued bead's holder is its assignee: one naming a polecat by its store
// ("rig/polecats/name") is shown the way the By column shows a holder, a crew
// member's claim ("town/crew/name" or "rig/crew/name") by the bare name, and any
// other assignee as it was written.
function queueHolder(b) {
  const m = /^([^/]+)\/polecats\/([^/]+)$/.exec(b.assignee || "");
  if (m) return {rig: m[1], name: m[2]};
  const c = /^[^/]+\/crew\/([^/]+)$/.exec(b.assignee || "");
  return c ? {rig: "", name: c[1]} : {rig: "", name: b.assignee || ""};
}

// Each poll redraws this pane, and the landings rows open in a new scroll box at
// the top: landingsScroll reads where the old one was, and keepLandingsScroll sets
// it on the new one once the rows are drawn (gt-tjlu6).
function landingsScroll(box) {
  const rows = box.querySelector(".lrows");
  return rows ? rows.scrollTop : 0;
}

function keepLandingsScroll(box, top) {
  const rows = box.querySelector(".lrows");
  if (rows) rows.scrollTop = top;
}

// The landings head — the day's figures and the per-hour bars — folds away for
// a reader who wants the table alone. The choice is remembered per viewer, and
// storage that throws (private mode, a locked-down browser) leaves it open and
// folding still works for the session (gt-q4cac).
const LANDINGS_HEAD_KEY = "gt-landings-head";
let landingsHeadFolded = false;
try { landingsHeadFolded = localStorage.getItem(LANDINGS_HEAD_KEY) === "folded"; } catch (e) {}

// The seat class the velocity rows follow, picked above the points row. The
// choice lives here, not in the buttons, because renderTrend rebuilds the
// buttons on every redraw; storage that throws leaves the choice in place for
// the session (gt-vd91ny.8).
const VELOCITY_CLASS_KEY = "gt-landings-velocity-class";
let velocityClassChoice = "all";
try { velocityClassChoice = localStorage.getItem(VELOCITY_CLASS_KEY) || "all"; } catch (e) {}

// percentile is a reading's p-th percentile by nearest rank: the smallest value
// at or above p of the sorted readings, so it is always one landing's own time
// rather than an invented one. Nulls (a stage a landing did not run) are left
// out, as median leaves them.
function percentile(xs, p) {
  const v = xs.filter(x => x != null).sort((a, b) => a - b);
  if (!v.length) return null;
  return v[Math.min(v.length - 1, Math.max(0, Math.ceil(p * v.length) - 1))];
}

// stageSummary is the gate or om part of the compact stats line: the median,
// 90th percentile and slowest wall time over the landings in the window. A stage
// no landing ran has no reading, so the part is left out.
function stageSummary(name, secs) {
  const v = secs.filter(x => x != null);
  if (!v.length) return null;
  return name + " · median " + fmtDur(median(v)) + " · p90 " + fmtDur(percentile(v, 0.9)) + " · slowest " + fmtDur(Math.max(...v));
}

// loadSummary is the hourly load's compact stats line: the last recorded reading
// ("now"), the average and peak over the hours on record, and how many of the 24
// hours were recorded.
function loadSummary(loads) {
  if (!loads.length) return null;
  const vals = loads.map(p => p.v);
  const now = loads.reduce((a, b) => b.t > a.t ? b : a).v;
  const avg = vals.reduce((n, v) => n + v, 0) / vals.length;
  return "load · now " + now.toFixed(1) + " · 24 hour average " + avg.toFixed(1) + " · peak " + Math.max(...vals).toFixed(1) + " · " + vals.length + " of 24 hours recorded (only while a page is open)";
}

// trendClear empties the Landings body except the Polecats section. That section
// is part of the page's markup and renderPolecats draws it, so a landings redraw
// leaves it attached: a redraw that moved it would drop a reader's text selection
// and focus inside the seats table.
function trendClear(box) {
  const pol = $("polecatssec");
  Array.from(box.children).forEach(c => { if (c !== pol) c.remove(); });
}

// renderTrend draws the Landings body: the figures and notes above the Polecats
// section, and the landing rows below it.
function renderTrend(s) {
  if (pushSkip("trend", s)) return;
  const sec = $("trendsec"), box = $("trend");
  const top = landingsScroll(box);
  const t = s.trend;
  const hours = (t && t.hours) || [];
  const recent = (t && t.recent) || [];
  // A bead waiting for the worker has no row of its own in the trend: nothing
  // has landed. It comes from the Queue reader's list, and a queue alone is
  // reason to show the section (gt-zc45r). The Polecats section lives in this
  // block too, so a seats reading alone is reason to show it.
  const waiting = queuedLandings(s, recent);
  if (!hours.length && !waiting.length && !s.polecats) { sec.hidden = true; trendClear(box); return; }
  sec.hidden = false;
  trendClear(box);
  const names = polecatNames(s.polecats);
  // Nothing has landed in the window: the pane is the queue alone, rather than
  // the day's figures and charts drawn from a reading nobody has made yet.
  if (!hours.length) {
    $("trendnote").textContent = waiting.length + " queued";
    const q = landingTable(s, names, recent, waiting);
    if (q) box.append(q);
    keepLandingsScroll(box, top);
    return;
  }
  // The figures and notes gather here and go in above the Polecats section.
  const figs = [];
  const hhmm = iso => new Date(iso).toLocaleTimeString([], {hour12: false}).slice(0, 5);
  const t0 = new Date(hours[0].hour).getTime();
  const t1 = new Date(hours[hours.length - 1].hour).getTime() + 3600e3;
  const stages = t.stages || [];
  const landed = hours.reduce((n, h) => n + h.landed, 0);
  const rejected = hours.reduce((n, h) => n + h.rejected, 0);
  $("trendnote").textContent = landed + " landed · " + rejected + " rejected · " + waiting.length + " queued";

  // The figures and the per-hour bars fold away together under a head the
  // reader can close; the landings table below never folds (gt-q4cac).
  const lhead = el("div", "lhead");
  const lhbtn = el("button", "lheadbtn");
  lhbtn.type = "button";
  const lcaret = el("span", "caret", landingsHeadFolded ? "▸" : "▾");
  lhbtn.append(lcaret, el("span", "", "figures and landings per hour"));
  lhbtn.setAttribute("aria-expanded", landingsHeadFolded ? "false" : "true");
  const lhbody = el("div", "lheadbody");
  lhbody.hidden = landingsHeadFolded;
  lhbtn.addEventListener("click", () => {
    landingsHeadFolded = !landingsHeadFolded;
    lhbody.hidden = landingsHeadFolded;
    lcaret.textContent = landingsHeadFolded ? "▸" : "▾";
    lhbtn.setAttribute("aria-expanded", landingsHeadFolded ? "false" : "true");
    try { localStorage.setItem(LANDINGS_HEAD_KEY, landingsHeadFolded ? "folded" : "open"); } catch (e) {}
  });
  lhead.append(lhbtn, lhbody);
  figs.push(lhead);

  // the day in numbers
  const kv = el("div", "kv");
  const add = (v, k, tip, cls) => { const x = el("div"); if (tip) x.title = tip; x.append(el("b", cls || "", v), el("span", "", k)); kv.append(x); };
  add(String(landed), "landed");
  add(String(rejected), "rejected", "rejections in the last 24 hours, whatever the reason", rejected ? "warnc" : "");
  const attempts = landed + rejected;
  if (attempts) add(Math.round(landed / attempts * 100) + "%", "first-pass", "landings as a share of landing attempts (landed + rejected)");
  const mg = median(stages.map(p => p.gate_secs)), mo = median(stages.map(p => p.om_secs));
  const mt = median(stages.map(p => p.lint_secs + p.gate_secs + (p.om_secs || 0)));
  if (mg != null) add(fmtDur(mg), "median gate");
  if (mo != null) add(fmtDur(mo), "median om");
  if (mt != null) add(fmtDur(mt), "median total", "lint + gate + om, per landing");
  const slow = stages.length ? Math.max(...stages.map(p => p.lint_secs + p.gate_secs + (p.om_secs || 0))) : null;
  if (slow != null) add(fmtDur(slow), "slowest", "the longest landing in the window", slow > 600 ? "warnc" : "");
  // The velocity figures, when the feed carries them: the points landed in the
  // last day, the rate now against the day's average, and the median landing's
  // points. A figure the feed leaves undefined reads as a dash, never as zero.
  if (t.velocity) {
    const f = t.velocity.figures || {};
    const u = f.unweighted_24h || 0;
    add(f.points_24h != null ? String(f.points_24h) : "–", "points 24h", u ? u + (u === 1 ? " landing" : " landings") + " in the last 24 hours without a measured time, not counted" : "every landing in the last 24 hours has a measured time");
    const avg = f.avg_per_hour != null ? "24-hour average " + f.avg_per_hour.toFixed(1) + " points/h" : "no 24-hour average yet";
    add(f.now_per_hour != null ? f.now_per_hour.toFixed(1) : "–", "points/h now", "mean of the last 3 complete hours · " + avg);
    add(f.median_per_landing != null ? String(f.median_per_landing) : "–", "median points", "median points a weighted landing carried, over the last 24 hours");
  }
  lhbody.append(kv);

  // landings per hour: the blue part landed, the red part is rejections
  const max = Math.max(1, ...hours.map(h => h.landed + h.rejected));
  const bars = el("div", "hbars");
  for (const h of hours) {
    const col = el("div", "hbar");
    col.title = hhmm(h.hour) + " · " + h.landed + " landed" + (h.rejected ? " · " + h.rejected + " rejected" : "") + (h.load_avg != null ? " · load " + h.load_avg.toFixed(1) : "");
    if (h.rejected) { const r = el("i", "hrej"); r.style.height = h.rejected / max * 100 + "%"; col.append(r); }
    if (h.landed) { const l = el("i", "hok"); l.style.height = h.landed / max * 100 + "%"; col.append(l); }
    bars.append(col);
  }
  lhbody.append(el("div", "k title", "landings per hour, red = rejected"), bars);
  // With a velocity feed, the points per hour sit in a second row under the
  // landings bars, on the same hours, and the one axis labels both (gt-vd91ny.6).
  // The seat class picked above the points row sets both the points row and the
  // differences (gt-vd91ny.8).
  const vel = t.velocity ? velocityRows(t.velocity, hours, hhmm) : null;
  if (vel) lhbody.append(vel.pick, vel.points);
  lhbody.append(timeAxis(t0, t1));

  // The velocity's differences sit under the points row, over the whole window
  // the feed holds (up to 72 hours) rather than the trend's 24: the feed judges
  // each difference against the signal and noise of its whole series, and the
  // earliest hours it draws need the smoothing history before the trend window
  // (gt-vd91ny.7). D1 says whether velocity is rising or falling and D2 is its
  // acceleration.
  if (vel) lhbody.append(vel.diff);

  // The gate, om and load readings are one compact stats line each, off the
  // same reading the chart above draws.
  const stageLines = [stageSummary("gate", stages.map(p => p.gate_secs)), stageSummary("om", stages.map(p => p.om_secs))].filter(Boolean);
  if (stageLines.length) figs.push(el("div", "k title", stageLines.join("  ")));
  else figs.push(el("div", "empty", "no stage lines in the last 24 hours"));

  // hourly load average (recorded only while a page is open)
  const loads = hours.filter(h => h.load_avg != null).map(h => ({t: new Date(h.hour).getTime() + 1800e3, v: h.load_avg}));
  const loadLine = loadSummary(loads);
  if (loadLine) figs.push(el("div", "k title", loadLine));
  else figs.push(el("div", "empty", "no load history yet (it fills while a page is open)"));

  box.prepend(...figs);
  const tbl = landingTable(s, names, recent, waiting);
  if (tbl) box.append(tbl);
  keepLandingsScroll(box, top);
}

// velocityRows draws the velocity rows under the landings bars for one seat
// class at a time: the buttons that pick the class, the points row, and the two
// difference rows. A feed with no class beside the whole town draws that series
// and no buttons. A class with no landing with time draws its text in place of
// the rows, never empty rows (gt-vd91ny.8).
function velocityRows(velocity, hours, hhmm) {
  const classes = velocity.classes || null;
  const names = classes ? ["all"].concat(Object.keys(classes).filter(k => k !== "all").sort()) : [];
  const feed = name => classes ? (classes[name] || []) : (velocity.hours || []);
  const pick = el("div", "vpick");
  const points = el("div", "vpoints");
  const diff = el("div", "vdiff");
  const buttons = new Map();
  const draw = name => {
    for (const [n, b] of buttons) {
      b.className = n === name ? "vsel on" : "vsel";
      b.setAttribute("aria-pressed", n === name ? "true" : "false");
    }
    const series = feed(name);
    // Only a seat class can be empty: a feed without classes has no class to
    // name, so its rows draw as they always did.
    if (classes && !series.some(v => v.weighted > 0 || v.rejected_points > 0)) {
      points.replaceChildren(el("div", "empty", "no landings with time"));
      diff.replaceChildren();
      return;
    }
    points.replaceChildren(el("div", "k title", "points per hour, red = rejected points, hatched cap = landings without time"), velocityBars(hours, series, hhmm));
    diff.replaceChildren(
      differenceBars("D1", "d1", "points/h", "the points per hour's change over 3h: up when velocity is rising", series, hhmm),
      differenceBars("D2", "d2", "points/h²", "the acceleration: the change in D1 over 3h", series, hhmm),
      legend([
        ["var(--violet)", "D1 = the points per hour's change over 3h, up when rising · D2 = the change in D1 (acceleration)"],
        ["var(--dim)", "a muted bar is within noise"],
      ]),
    );
  };
  if (names.length > 1) {
    pick.append(el("span", "title", "seat class"));
    for (const n of names) {
      const b = el("button", "vsel", n);
      b.type = "button";
      b.addEventListener("click", () => {
        velocityClassChoice = n;
        try { localStorage.setItem(VELOCITY_CLASS_KEY, n); } catch (e) {}
        draw(n);
      });
      buttons.set(n, b);
      pick.append(b);
    }
  }
  draw(classes && names.includes(velocityClassChoice) ? velocityClassChoice : "all");
  return {pick, points, diff};
}

// velocityBars draws the points per hour under the landings bars: one column per
// trend hour, matched to the velocity hour with the same start, its height the
// hour's points against the largest hour's. An unweighted landing is a small
// hatched cap on its column and never a zero-height bar, so an hour with only
// unweighted landings draws the cap alone and says no points were measured.
// Rejected points stack as a red segment directly above the landed bar, on the
// same scale, and the tooltip counts them with the rejections without time.
function velocityBars(hours, series, hhmm) {
  const byHour = new Map(series.map(v => [new Date(v.hour).getTime(), v]));
  const at = hours.map(h => byHour.get(new Date(h.hour).getTime()) || null);
  const max = Math.max(1, ...at.map(v => v ? v.points + (v.rejected_points || 0) : 0));
  const bars = el("div", "hbars vbars");
  hours.forEach((h, i) => {
    const v = at[i];
    const col = el("div", "hbar");
    if (!v) { col.title = hhmm(h.hour) + " · no points reading"; bars.append(col); return; }
    col.title = hhmm(h.hour) + (v.weighted || !v.unweighted ? " · " + v.points + " points" : " · no points measured") + (v.unweighted ? " · " + v.unweighted + (v.unweighted === 1 ? " landing" : " landings") + " without time" : "") + (v.rejected_points ? " · " + v.rejected_points + (v.rejected_points === 1 ? " point rejected" : " points rejected") : "") + (v.rejected_unweighted ? " · " + v.rejected_unweighted + (v.rejected_unweighted === 1 ? " rejection" : " rejections") + " without time" : "");
    if (v.unweighted) col.append(el("i", "hcap"));
    if (v.rejected_points) { const r = el("i", "hrej"); r.style.height = v.rejected_points / max * 100 + "%"; col.append(r); }
    if (v.points) { const p = el("i", "hpts"); p.style.height = v.points / max * 100 + "%"; col.append(p); }
    bars.append(col);
  });
  return bars;
}

// The height of a difference bar, as a share of its row. The largest signal
// value fills the row's half above (or below) the zero line, so DIFF_ROW_FULL
// is the most a bar may take; a row with no signal value draws every defined
// bar at DIFF_ROW_FIXED. Scaling to the signals and never to the row's largest
// value keeps noise small: it is muted and, when it is larger than every
// signal, capped rather than allowed to stretch the row (gt-vd91ny.7).
const DIFF_ROW_FULL = 50;
const DIFF_ROW_FIXED = 10;

// differenceBars draws one of the velocity's differences: a thin row over the
// feed's hours, one column per hour, each bar signed about the zero line (up
// for positive, down for negative). key names the value and its state ("d1"
// reads d1 and d1_state). A value whose state is noise is muted; one whose
// state is anything else, or that is not defined, draws no bar at all and its
// tooltip says there is not enough data. A defined value of zero draws no bar
// either: a zero-height bar would read as a tiny change.
function differenceBars(name, key, unit, what, hours, hhmm) {
  const signal = hours.filter(v => v[key + "_state"] === "signal" && v[key] != null).map(v => Math.abs(v[key]));
  const scale = signal.length ? Math.max(...signal) : 0;
  const row = el("div", "dbars");
  row.title = name + ": " + what;
  row.append(el("span", "dlabel", name));
  const body = el("div", "dbody");
  for (const v of hours) {
    const col = el("div", "dcol");
    const state = v[key + "_state"], val = v[key];
    if ((state !== "signal" && state !== "noise") || val == null) {
      col.title = hhmm(v.hour) + " · " + name + " not enough data";
      body.append(col);
      continue;
    }
    col.title = hhmm(v.hour) + " · " + name + " " + (val > 0 ? "+" : "") + val.toFixed(2) + " " + unit + " · " + state;
    if (val) {
      const h = scale ? Math.min(DIFF_ROW_FULL, Math.abs(val) / scale * DIFF_ROW_FULL) : DIFF_ROW_FIXED;
      const bar = el("i", "dbar " + (val > 0 ? "dup" : "ddn") + (state === "noise" ? " dmute" : ""));
      bar.style.height = h + "%";
      col.append(bar);
    }
    body.append(col);
  }
  row.append(body);
  return row;
}

// holderCell is the Landings table's By column for one row: the holder's short
// name, its rig only where two rigs in view use that name, and the dash a row
// with no holder draws. fallback stands in for a dash on the one row that names
// its rig there instead (gt-duuq1).
function holderCell(names, rig, who, fallback) {
  const by = el("td", "title");
  if (who) { by.textContent = names.label(rig, who); by.title = rig ? rig + "/" + who : who; }
  else by.textContent = fallback || "–";
  return by;
}

// polecatTimeCell is the Landings table's Polecat column, for every kind of row:
// the dev time the row carries, by polecatDur's one computation, and on hover
// each seat's share of it, "2 attempts: 14m + 9m". An attempt whose span never
// closed adds no time to the record and reads "open", and an attempt that is
// itself a floor keeps its +, which is why the total may be a lower bound
// (gt-90wi1). A bird or crew branch's landing has no polecat, so its cell
// names the branch's agent ("crew/<agent>/...") or, when the branch names none,
// says bird — never a dash, which would look like missing data (gt-kmp7c); the
// tooltip says why there is no polecat time (gt-rxs7w, gt-830fd). A row that
// carries no reading — a queued bead, whose queue reading (QueueBead) has no
// polecat time — reads the dash, never a figure guessed from its wait
// (gt-duuq1).
function polecatTimeCell(row) {
  const pc = el("td", "n", row.crew ? (row.crew_agent || "bird") : polecatDur(row.polecat_secs, row.polecat_lower_bound, row.polecat_upper_bound));
  const attempts = row.polecat_attempts || [];
  if (row.crew) pc.title = row.crew_agent ? "crew branch: no polecat time exists" : "bird or crew branch: no polecat time exists";
  else if (attempts.length) pc.title = attempts.length + (attempts.length === 1 ? " attempt: " : " attempts: ") + attempts.map(a => a.secs > 0 ? polecatDur(a.secs, a.lower_bound, a.upper_bound) : "open").join(" + ");
  return pc;
}

// labelCells names each cell of a landings row for the stacked layout: a narrow
// page (see the max-width rule on .ltable) puts the title on a line of its own
// and hides the header row, so every other cell carries its column's heading.
function labelCells(tr, cols) {
  Array.from(tr.children).forEach((td, i) => { if (i !== 1) td.setAttribute("data-label", cols[i][0]); });
}

// The Landings table: waiting-to-land beads first, then the rows the worker
// holds, then the day's finished ones. Null when there is nothing to draw.
// Every cell goes through el(), which writes textContent, so a bead's own text
// is never markup.
function landingTable(s, names, rows, waiting) {
  const shown = waiting.slice(0, QUEUED_LANDING_MAX);
  const more = waiting.length - shown.length;
  if (!shown.length && !rows.length) return null;
  const wrap = el("div");
  const thr = s.om && s.om.threshold != null ? s.om.threshold : null;
  const tbl = el("table", "ltable");
  const hr = el("tr");
  const cols = [["When"], ["Landing"], ["By", "who built it: the polecat, or the crew member whose branch it was"], ["Polecat", "the time the bead's polecat seats spent hooked on it, read from the spans log; hover for each attempt, + marks a reading that may understate the time, and ≤ one read from the bead's dispatch, which may overstate it", 1], ["Score", "om's score", 1], ["Gate", "wall time of the gate stage", 1], ["om", "wall time of the om review", 1], ["Ship", "total ship time in minutes: dispatched to deployed, which is the staging deploy for an app rig and the daemon restart for gastown", 1]];
  cols.forEach(([h, tip, num]) => { const th = el("th", num ? "n" : "", h); if (tip) th.title = tip; hr.append(th); });
  tbl.append(hr);
  const today = new Date().toDateString();
  // A queued bead reads in the same grid as a running one (gt-duuq1): the holder
  // is the bead's assignee, so it belongs in the By column rather than riding on
  // the Landing cell's first line, and the title and every reading then sit in
  // the column the running and finished rows put them. The title no longer spans
  // the empty cells (gt-uvpo1): it sits in the Landing column, whose min-width
  // and break-word rule (.ltable td.main) keep it readable as a finished row's
  // title is, and TestLandingsTitleCellKeepsAReadableWidth pins that rule. The
  // wait is aged from the bead's last update — the label write gt done makes is
  // normally its last write. No stage has run, so Score, Gate, om and Ship hold
  // the empty-column dash a running row draws. The queue reading carries no
  // polecat time, so the Polecat cell has no reading to draw and reads the dash
  // polecatTimeCell draws for a row with none, never a time guessed from the
  // wait. The worker's order is not known to this page, so a row says waiting
  // and nothing about position.
  for (const b of shown) {
    const tr = el("tr");
    const when = el("td", "when title", b.updated_at ? "waiting " + age(b.updated_at) : "waiting");
    when.title = "submitted and waiting for the landing worker to take it; waiting since the bead's last update, which gt done moves";
    tr.append(when);
    const main = el("td", "main");
    main.append(el("span", "bead", b.id));
    const tag = el("span", "tag", "queued");
    tag.title = "submitted; the landing worker has not taken it yet";
    main.append(document.createTextNode(" "), tag);
    if (b.title) main.append(document.createElement("br"), el("span", "title", (b.rig ? b.rig + " · " : "") + b.title));
    tr.append(main);
    const h = queueHolder(b);
    tr.append(holderCell(names, h.rig, h.name, ""), polecatTimeCell(b), el("td", "n", "–"), el("td", "n", "–"), el("td", "n", "–"), el("td", "n", "–"));
    labelCells(tr, cols);
    tbl.append(tr);
  }
  for (const r of rows) {
    const tr = el("tr");
    const when = new Date(r.at);
    if (r.outcome === "running") tr.className = "live";
    tr.append(el("td", "when title", r.outcome === "running" ? "merging " + fmtDur((Date.now() - when.getTime()) / 1000) : r.outcome === "backoff" ? "checked " + clock(r.at).slice(0, 5) : (when.toDateString() === today ? clock(r.at).slice(0, 5) : when.toLocaleDateString([], {month: "short", day: "numeric"}) + " " + clock(r.at).slice(0, 5))));
    const main = el("td", "main");
    const beadEl = el("span", "bead", r.bead);
    main.append(beadEl);
    if (r.outcome === "running") { const g = el("span", "tag live", "running"); g.title = "merged; the worker is gating the merged tree and running the om review"; main.append(document.createTextNode(" "), g); }
    else if (r.outcome === "rejected") { const g = el("span", "tag badc", "rejected · " + (r.kind || "?")); main.append(document.createTextNode(" "), g); }
    else if (r.outcome === "backoff") { const g = el("span", "tag badc", "failing · " + (r.stage || "?")); g.title = "the landing worker keeps retrying this landing and losing; the stage is where the last attempt failed"; main.append(document.createTextNode(" "), g); }
    else if (r.verdict === "skipped") main.append(document.createTextNode(" "), el("span", "tag", "no review"));
    else if (r.verdict === "error") { const g = el("span", "tag warnc", "om error"); g.title = r.detail || ""; main.append(document.createTextNode(" "), g); }
    if (r.risk) { const g = el("span", "warnc", " ⚑"); g.title = "touched risk paths"; main.append(g); }
    if (r.title) main.append(document.createElement("br"), el("span", "title", r.title));
    if (r.outcome === "rejected" && r.detail) main.append(document.createElement("br"), el("span", "badc", r.detail));
    if (r.outcome === "backoff") main.append(document.createElement("br"), el("span", "badc", backoffDetail(r)));
    const total = (r.lint_secs || 0) + (r.gate_secs || 0) + (r.om_secs || 0);
    // The row's detail rides the bead id, not the whole row: a native tip opens
    // under the pointer wherever it rests, and over a row it covers that row.
    beadEl.title = [r.commit ? "commit " + r.commit : null, total ? "lint " + fmtDur(r.lint_secs || 0) + " + gate " + fmtDur(r.gate_secs || 0) + " + om " + fmtDur(r.om_secs || 0) + " = " + fmtDur(total) : null, r.route ? "route " + r.route : null].filter(Boolean).join(" · ");
    tr.append(main);
    // By names the holder the way the Work panel's seat rows do: the short name, and
    // its rig only where two rigs in view use that name. The row's own rig
    // is the holder's for a live run; for a finished one it is read back from
    // the polecat roster, so a shared short name still gets its rig. A crew
    // row names the branch's agent: its assignee is whoever the bead stays
    // slingable for, not the crew member who built it (gt-830fd).
    const who = (r.crew && r.crew_agent) || r.polecat || (r.route ? r.route.replace(/^overseer-/, "") : "");
    const rig = r.rig || names.rigOf(who);
    tr.append(holderCell(names, rig, who, r.outcome === "running" ? r.rig : ""), polecatTimeCell(r));
    tr.append(el("td", "n" + (r.score != null && thr != null && r.score < thr ? " badc" : ""), r.score != null ? r.score.toFixed(2) : "–"));
    tr.append(el("td", "n" + (r.gate_secs > 180 ? " warnc" : ""), r.gate_secs != null ? fmtDur(r.gate_secs) : "–"));
    tr.append(el("td", "n" + (r.om_secs > 240 ? " warnc" : ""), r.om_secs != null ? fmtDur(r.om_secs) : "–"));
    const ship = el("td", "n" + (r.ship_pending ? " warnc" : ""));
    const appRig = r.ship_via === "staging";
    if (r.ship_secs != null) { ship.textContent = Math.round(r.ship_secs / 60) + "m"; ship.title = appRig ? "dispatched to staging deployed" : "dispatched to deployed"; }
    else if (r.ship_failed) { ship.textContent = "staging failed"; ship.title = "the staging run that covers this landing failed: " + (r.ship_run_state || "failed"); }
    else if (r.ship_pending) { ship.textContent = "pending"; ship.title = appRig ? "landed; waiting for the staging deploy" : "landed; waiting for the restart that installs it"; }
    else ship.textContent = "–";
    tr.append(ship);
    labelCells(tr, cols);
    tbl.append(tr);
  }
  // Every finished landing of the window is a row; the rows scroll inside a fixed
  // height, the header row stays put, as the Work panel's beads table does (gt-1kttu).
  const lrows = el("div", "lrows");
  lrows.append(tbl);
  wrap.append(el("div", "k title", "landings: waiting to land first, then the ones running now and the ones failing in backoff, then every finished landing in the last 24 hours (newest first; hover a row for the commit and stage times)"), lrows);
  if (more) wrap.append(el("div", "empty", "and " + more + " more waiting to land — see the Queue pane's “Waiting to land” tab"));
  return wrap;
}

// The News pane draws the top Hacker News stories the hub fetched: one line
// each, the title linking to the story and the comment count to the discussion.
// The page never calls Hacker News itself — its CSP allows same-origin reads
// only — so these links are the one thing here that leaves the page. A refresh
// that failed keeps the stories it last read, dimmed, under a note saying how
// old they are; a pane with nothing to show says why. The section is left out
// entirely when the server sends no news, which is the pane switched off in
// settings/config.json. Every string goes through el(), which writes
// textContent, so a title carrying markup reads as that markup (gt-9ktrr).
function renderNews(s) {
  if (pushSkip("news", s)) return;
  const sec = $("newssec"), box = $("news"), note = $("newsnote");
  const f = s.news;
  if (!f) { sec.hidden = true; box.replaceChildren(); box.classList.remove("stale"); note.textContent = ""; note.className = "r"; return; }
  sec.hidden = false;
  box.replaceChildren();
  const stories = f.stories || [];
  const stale = !!f.error;
  box.classList.toggle("stale", stale && stories.length > 0);
  if (!stories.length) {
    box.append(el("div", stale ? "badc" : "empty", stale ? "unavailable: " + f.error : "no stories"));
    note.textContent = ""; note.className = "r";
    return;
  }
  for (const st of stories) {
    const row = el("div", "nrow");
    const link = el("a", "ntitle", st.rank + ". " + st.title);
    link.href = st.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    row.append(link);
    const cmt = el("a", "ncmt", st.comments + (st.comments === 1 ? " comment" : " comments"));
    cmt.href = "https://news.ycombinator.com/item?id=" + st.id;
    cmt.target = "_blank";
    cmt.rel = "noopener noreferrer";
    row.append(cmt);
    row.title = [st.title, st.points + " points", st.comments + " comments", st.at ? age(st.at) + " ago" : null, st.domain || null].filter(Boolean).join(" · ");
    box.append(row);
  }
  // The note ages the snapshot, which is what the pane's staleness turns on: a
  // story's own age is in its hover and says nothing about the read behind it.
  // age() answers for an instant the server left out, so the note spells no
  // null where an age belongs. A news read that has never happened says "never
  // read" where its age would be, inside the stale mark when it failed.
  const read = neverRead(f.at) ? "never read" : age(f.at);
  note.textContent = stale ? "stale " + read + " · " + f.error : neverRead(f.at) ? "never read" : "read " + read + " ago";
  note.className = "r" + (stale ? " badc" : "");
}

function renderMachine(s) {
  if (pushSkip("machine", s)) return;
  const box = $("machine");
  box.replaceChildren();
  const r = readOf(s, "machine");
  paintsRead(box, $("machnote"), r);
  const m = s.machine || {};
  const loads = (s.loads || []).map(p => p.load);
  box.append(spark(loads, 400, 56, "#58a6ff"));
  const note = loads.length > 1 ? "load, last " + fmtDur((new Date(s.loads[s.loads.length - 1].at) - new Date(s.loads[0].at)) / 1000) : "";
  $("machnote").textContent = readCaption(r, [note, r && r.ageSec != null ? "read " + fmtDur(r.ageSec) + " ago" : null]);
  if (r && r.stale) box.append(el("div", "empty " + (r.error ? "badc" : "warnc"), r.error ? "the machine read failed; this is the last reading" : "this reading is stale"));
  const top = m.top || [];
  if (top.length) {
    const t = el("table");
    for (const p of top) { const tr = el("tr"); tr.append(el("td", "", p.name), el("td", "n", p.cpu >= 100 ? (p.cpu / 100).toFixed(1) + " cores" : p.cpu.toFixed(0) + "%")); t.append(tr); }
    box.append(el("div", "k title", "busiest processes"), t);
  }
}

// The Cloud panel draws what the reader stripped and capped out of another
// account's report. Every cell goes through el(), which writes textContent, so
// a Detail holding an HTML tag shows as that text and never as markup. A
// finding is one line — severity, kind, resource, then as much of the Detail as
// the line holds — and opening the row shows the whole Detail under it. The
// opened rows live in cloudOpen, so the refresh that redraws the list leaves
// them open (gt-1hob8).
const CLOUD_SEV = {urgent: "sev-critical", normal: "sev-medium", low: "sev-low"};
const cloudOpen = new Set();
// A finding carries no id of its own, so a row is keyed by its own text. The
// reader strips control runes, so the separator cannot appear inside a key.
const findingID = f => [f.project, f.resource, f.kind, f.detail].join("\u0000");

// The pane's header note: the patrol's own state, and a fresh run's failures
// beside it, so the operator reads one line rather than two.
function cloudNote(c, checks) {
  const parts = [c.note || c.state || ""];
  if (checks && checks.state === "fresh" && checks.failed > 0) {
    parts.push(checks.failed + (checks.failed === 1 ? " check failing" : " checks failing"));
  }
  return parts.filter(Boolean).join(" · ");
}

// The checks line: the cloud-check plugin's latest run, above the patrol's
// findings. A missing file draws nothing at all (the plugin may not be
// installed), an unreadable or misshapen one draws one dim line, a run older
// than the plugin's own interval draws as stale in the amber, and a fresh run
// draws its counts with the failures and warnings under it. The line's colour
// follows the worst level it carries, and a stale run's items are not drawn,
// since they are no longer current. The status is another process's file, so
// every string goes through el(), which writes textContent and never markup.
function drawCloudChecks(box, checks) {
  if (!checks) return;
  if (checks.state === "error") { box.append(el("div", "empty", "cloud checks: unreadable")); return; }
  if (checks.state !== "fresh") {
    box.append(el("div", "ccheck warnc", neverRead(checks.at) ? "cloud checks: last ran never read (not running?)" : "cloud checks: last ran " + age(checks.at) + " ago (not running?)"));
    return;
  }
  const worst = checks.failed > 0 ? "badc" : (checks.warnings > 0 ? "warnc" : "");
  const counts = [checks.ok + " ok", checks.warnings + " warning" + (checks.warnings === 1 ? "" : "s"), checks.failed + " failed"];
  box.append(el("div", "ccheck" + (worst ? " " + worst : ""), neverRead(checks.at) ? "checks: " + counts.join(" · ") + " · never read" : "checks: " + counts.join(" · ") + " · " + age(checks.at) + " ago"));
  for (const it of checks.items || []) {
    const row = el("div", "ccrow");
    if (it.section) row.append(el("span", "ccsection", it.section));
    row.append(el("span", "cctext " + (it.level === "fail" ? "badc" : "warnc"), it.text || ""));
    box.append(row);
  }
}

// The app power line: one row per app, drawn above the patrol's findings so the
// operator reads which apps are off before what the patrol found. An app that is
// off takes the amber and one the reader could not place the red, so neither
// reads as on; the markers and ledgers are other accounts' files, so every cell
// goes through el(), which writes textContent and never markup.
function appPowerState(a) {
  if (a.state === "on") return "on";
  if (a.state === "off") return "off (" + (a.env || a.note || "unreadable marker") + ")";
  return "unknown (" + (a.note || "unreadable") + ")";
}

function drawAppPower(box, p) {
  if (!p) return;
  if (!p.apps || !p.apps.length) { box.append(el("div", p.note ? "badc" : "empty", p.note ? "app power: unknown (" + p.note + ")" : "app power: no apps")); return; }
  for (const a of p.apps) {
    const row = el("div", "apow");
    row.append(el("span", "apname title", a.app), el("span", "apstate " + (a.state === "on" ? "" : a.state === "off" ? "warnc" : "badc"), appPowerState(a)));
    if (a.state === "off" && a.since) {
      const who = [a.since ? "since " + age(a.since) + " ago" : "", a.by ? "by " + a.by : "", a.reason || ""].filter(Boolean);
      const why = el("span", "aptext", who.join(" · "));
      why.title = a.since ? new Date(a.since).toLocaleString() : "";
      row.append(why);
    }
    const rel = a.release;
    if (rel) row.append(el("span", "aprel", "last: " + [rel.at ? age(rel.at) + " ago" : "", rel.action || "", rel.reason || ""].filter(Boolean).join(" ")));
    else if (a.release_note) row.append(el("span", "aprel badc", "ledger: " + a.release_note));
    box.append(row);
  }
  if (p.more) box.append(el("div", "empty", "and " + p.more + " more apps"));
}

function renderCloud(s) {
  if (pushSkip("cloud", s)) return;
  const box = $("cloud"), note = $("cloudnote");
  box.replaceChildren();
  const c = s.cloud;
  if (!c) { note.className = "r"; note.textContent = ""; box.append(el("div", "empty", "reading…")); return; }
  // The checks line is drawn first and whatever the patrol's own state is: the
  // checks cover what the patrol cannot see, so a missing patrol report must
  // not hide them.
  const checks = c.checks;
  drawCloudChecks(box, checks);
  drawAppPower(box, c.apps);
  // The reader names the state — fresh, overdue, the error that stopped it, or
  // why there is no report — and overdue and error take the amber the page
  // already marks a stale reading with. A fresh run with failures adds its own
  // word to the same line, in the same amber.
  const stale = c.state === "overdue" || c.state === "error";
  const failing = checks && checks.state === "fresh" && checks.failed > 0;
  note.className = (stale || failing) ? "r warnc" : "r";
  note.textContent = cloudNote(c, checks);
  if (c.state === "missing" || c.state === "error") { box.append(el("div", c.state === "error" ? "badc" : "empty", c.note || c.state)); return; }
  const projects = c.projects || [];
  // One header line: the run, then the counts over the whole report beside it,
  // the zero counts left out. The projects the run watched ride the line's
  // title, so naming them costs no width.
  const head = el("div", "chead");
  head.title = projects.length ? projects.join(", ") : "no projects in the report";
  head.append(el("span", "title", "last run " + age(c.last_run) + " ago · " + projects.length + (projects.length === 1 ? " project" : " projects")));
  const counts = c.counts || {};
  const chips = el("span", "cchips");
  [["urgent", counts.urgent || 0], ["normal", counts.normal || 0], ["low", counts.low || 0]].forEach(([k, n]) => {
    if (n) chips.append(el("span", "tag " + (CLOUD_SEV[k] || "sev-low"), n + " " + k));
  });
  // A severity the patrol does not write yet is still a finding: count it
  // rather than dropping it.
  if (counts.other) chips.append(el("span", "tag sev-low", counts.other + " other"));
  if (chips.children.length) head.append(chips);
  box.append(head);
  if (!c.total) { box.append(el("div", "empty", "no findings")); return; }
  const findings = c.findings || [];
  // The project column is dropped when one project owns every finding — the
  // header already names it — and otherwise rides the resource as a dim prefix
  // that never takes a line of its own.
  const multi = new Set(findings.map(f => f.project || "")).size > 1;
  for (const f of findings) {
    const id = findingID(f);
    const open = cloudOpen.has(id);
    const row = el("button", "crow");
    row.setAttribute("aria-expanded", open ? "true" : "false");
    row.title = f.detail || "";
    const sev = el("span", "tag esc " + (CLOUD_SEV[f.severity] || "sev-low"), f.severity || "–");
    if (f.observed_at) sev.title = "observed " + new Date(f.observed_at).toLocaleString();
    row.append(sev, el("span", "ckind title", f.kind || "–"));
    const res = el("span", "cres");
    if (multi && f.project) res.append(el("span", "cproj title", f.project));
    res.append(el("span", "cname", f.resource || "–"));
    row.append(res, el("span", "cdetail", f.detail || ""));
    row.onclick = () => { open ? cloudOpen.delete(id) : cloudOpen.add(id); renderCloud(state); };
    box.append(row);
    if (open) box.append(el("div", "cfull", f.detail || ""));
  }
  if (c.more) box.append(el("div", "empty", "and " + c.more + " more"));
}

// The Birds panel draws the birds' daily reports, one row each: the bird's name
// and the pages it wrote, the age of the summary it left, the summary itself,
// and the bird's own ask for the operator as a badge. What a row shows is the
// sidecar the reader read, so a summary holding markup goes through el() and
// reads as that text; the name is itself the link to the bird's report, and the
// "report" and "previous" links beside it open the two pages in a new tab. The
// previous link carries when that page was written, so its label never has to
// claim it is yesterday's.
//
// The reader's verdicts are drawn rather than smoothed over: a stale row
// carries the amber the digest marks an overdue report with and says STALE
// beside the age of its last report, a row in error or withheld carries its
// note in the alarm red and no summary, and a list with no rows names that
// state instead of drawing nothing. A stale report's ask is days old, so it
// keeps no "needs the operator" badge and does not count in the heading's need
// count: the heading says what the operator has to answer today (gt-59ft9w).
// The heading's note ages the read, so rows kept through a failed read are
// drawn as the last reading they are (gt-q6h8e).
//
// The rows keep the reader's order within each group, with the stale reporters
// moved after the fresh ones: a reporter a day behind is still worth reading,
// but never in place of one that wrote today. The row the reader marks as the
// town's headline leads them all, stale or not (gt-gm9lq, gt-5c4df). The panel
// is a section of its own and the first one, and it starts closed, so its
// heading note carries the bird count and the need-you count for the operator
// who does not open it (gt-0g6z9, gt-gm9lq).
function drawBirds(box, s) {
  const r = readOf(s, "birds"), note = $("birdsnote");
  paintsRead(box, note, r);
  const all = s.birds || [];
  // A row is stale when the flag or the state says so, so a feed from a reader
  // that set only one of them still reads as stale rather than as current.
  const isStale = b => !!b.stale || b.state === "stale";
  // The reader marks the town's headline report, so the page names no reporter.
  const rest = all.filter(b => !b.headline);
  const rows = all.filter(b => b.headline)
    .concat(rest.filter(b => !isStale(b)), rest.filter(isStale));
  // The counts sit in the note, which the closed panel's header shows as its
  // summary line, so a closed panel still says whether anything waits. A stale
  // report's ask is not counted: it is what the report asked days ago, not what
  // waits on the operator now.
  const need = all.filter(b => b.needs_operator && !isStale(b)).length;
  note.textContent = readCaption(r, [
    all.length ? all.length + (all.length === 1 ? " bird" : " birds") : null,
    all.length ? need + " need you" : null,
    r && r.ageSec != null ? "read " + fmtDur(r.ageSec) + " ago" : null,
  ]);
  if (!rows.length) {
    box.append(el("div", r && r.error ? "badc" : "empty", r && r.error ? "the birds read failed" : "no bird has written a daily report yet"));
    return;
  }
  for (const b of rows) {
    const row = el("div", "brow" + (isStale(b) ? " warnc" : ""));
    const head = el("div", "bhead");
    // The bird name is the one the reader validated before it built a path,
    // and the route checks it again before it opens anything: every link is
    // joined from that name and the path is never decoded from free text.
    const birdName = el(b.has_page ? "a" : "span", "bname", b.bird || "–");
    if (b.has_page) {
      birdName.href = "/birds/" + b.bird + "/daily.html";
      birdName.target = "_blank";
      birdName.rel = "noopener";
    }
    head.append(birdName);
    if (b.has_page) {
      const page = el("a", "bpage", "report");
      page.href = "/birds/" + b.bird + "/daily.html";
      page.target = "_blank";
      page.rel = "noopener";
      head.append(page);
    }
    if (b.has_prev) {
      // The page before this one may be days old, so its label names no day;
      // its own written age, when the reader has one, goes in the hover.
      const prev = el("a", "bprev", "previous");
      prev.href = "/birds/" + b.bird + "/daily.prev.html";
      prev.target = "_blank";
      prev.rel = "noopener";
      if (b.prev_written) prev.title = "written " + age(b.prev_written) + " ago";
      head.append(prev);
    }
    if (isStale(b)) head.append(el("span", "badge warnc", "STALE"));
    else if (b.needs_operator) head.append(el("span", "badge warnc", "needs the operator"));
    if (b.written) head.append(el("span", "bage", "written " + age(b.written) + " ago"));
    row.append(head);
    if (b.state === "error" || b.state === "withheld") row.append(el("div", "badc", b.note || b.state));
    else if (b.summary) row.append(el("div", "bsum", b.summary));
    // The bird's topic pages, newest first, as links to the same sandboxed route.
    // The server lists only the names its route serves. The name is encoded as one
    // path segment, so a link stays in the bird's directory even for a name it
    // does not serve. The title is text, and a row with no pages draws nothing.
    const pages = b.pages || [];
    if (pages.length) {
      const list = el("div", "bpages");
      for (const p of pages) {
        const a = el("a", "", p.title || p.name);
        a.href = "/birds/" + b.bird + "/" + encodeURIComponent(p.name);
        a.target = "_blank";
        a.rel = "noopener";
        if (p.mtime) a.title = "written " + new Date(p.mtime).toLocaleString();
        list.append(a);
      }
      row.append(list);
    }
    box.append(row);
  }
  // The decisions the reporters put to the operator, in one list under the
  // rows so they are answered in one place. The group of the reporter that
  // wrote most recently comes first, because its question is the one the day
  // is about. The list starts open when a reporter has an item to put, so the
  // operator meets the question without opening anything, and it is left out
  // whole when no reporter has a decision to show. A reporter whose every item
  // was withheld still gets its group: the item's text is gone, so the note
  // that one was withheld is all the operator would otherwise never see.
  const asks = rows.filter(b => (b.decision_items && b.decision_items.length) ||
                                (b.decision_items_withheld && b.decision_items_withheld.length));
  // A stale reporter's group sorts after every fresh one, whatever it wrote
  // last: its question may be days old, and a fresh group is the one the day is
  // about (gt-9t6lr).
  asks.sort((a, b) => {
    if (isStale(a) !== isStale(b)) return isStale(a) ? 1 : -1;
    const at = a.written ? new Date(a.written).getTime() : 0;
    const bt = b.written ? new Date(b.written).getTime() : 0;
    if (at !== bt) return bt - at;
    return a.bird < b.bird ? -1 : a.bird > b.bird ? 1 : 0;
  });
  if (asks.length) {
    // The count is the items the operator can answer from a fresh report; a
    // stale reporter's are named apart, so the header does not call an old
    // question as urgent as a new one.
    const count = list => list.reduce((n, b) => n + (b.decision_items || []).length, 0);
    const total = count(asks.filter(b => !isStale(b)));
    const staleTotal = count(asks.filter(isStale));
    // A list holding only withheld decisions says how many were withheld
    // rather than "Needs you (0)".
    const held = asks.reduce((n, b) => n + (b.decision_items_withheld || []).length, 0);
    const needs = el("details", "needsyou");
    needs.open = true;
    needs.append(el("summary", "nysum", total || staleTotal ?
      "Needs you (" + total + (staleTotal ? ", " + staleTotal + " stale" : "") + ")" :
      "Needs you (" + held + " withheld)"));
    for (const b of asks) {
      const group = el("div", "nygroup");
      group.append(el("div", "nybird", b.bird || "–"));
      if (isStale(b)) {
        const d = b.written ? new Date(b.written) : null;
        group.append(el("div", "warnc", d ? "stale: last report " + d.toLocaleDateString([], {month: "short", day: "numeric"}) + " " + clock(b.written).slice(0, 5) : "stale: no report time"));
      }
      for (const it of b.decision_items || []) {
        group.append(el("div", "nyq", it.question || ""));
        if (it.recommendation) group.append(el("div", "nyr", "→ " + it.recommendation));
      }
      for (const why of b.decision_items_withheld || []) {
        group.append(el("div", "badc", "withheld: a decision item looks like it holds a secret (" + why + ")"));
      }
      needs.append(group);
    }
    box.append(needs);
  }
}

// renderBirds draws the Birds section: its own top-level panel, closed on a
// fresh load, so the heading's counts say whether anything waits before the
// operator opens it, while the fold key keeps it open once they do. A closed
// section's body is a detached box for the length of a push, and the note is a
// real element either way, so a panel the operator closed still ages its read
// on its heading (gt-quuq5, gt-0g6z9, gt-gm9lq).
function renderBirds(s) {
  if (pushSkip("birds", s)) return;
  const box = $("birds");
  box.replaceChildren();
  drawBirds(box, s);
}

// The Deploys block draws the deploy workflows' runs — a release and a
// landing's staging deploy — as repo, ref, commit, state, age and the stages in
// needs order, on one line while the panel is wide enough to hold them and
// wrapped when it is not. A stage name and a ref are a repository's own text,
// so every cell goes through el() and nothing here parses markup.
//
// The chips are the page's own colours for a job state: a stage that ran green,
// a failure the alert red, a running stage the live colour the landing rows
// mark a running landing with, and a stage that did not run (waiting, blocked,
// skipped, cancelled) dim. The chip carries the state's word on its title and
// the glyph of it beside the name, so a row of chips is read at a glance. A run
// nothing has picked up, and one that has not moved, carry the reader's warning
// instead.
const DEPLOY_STAGE = {success: "good", failure: "badc", running: "live", waiting: "sev-low", blocked: "sev-low", skipped: "sev-low", cancelled: "sev-low"};
const DEPLOY_GLYPH = {success: "✓", failure: "✗", running: "◌"};

// The staging workflow, as the reader names the runs of it: a landing deploys
// main to staging, where a release run deploys a v* tag, and the tag beside a
// staging run's ref keeps the two from reading alike.
const DEPLOY_STAGING = "staging.yml";

// The Ref column: the width it holds in the row's font, and the characters a
// staging run's tag spends beside its ref — "staging" at the tag's 11px, plus
// its padding, border and the gap before it. The column is measured from both,
// so neither the ref nor the tag beside it is cut (gt-2h2lx).
const DEPLOY_REF_CH = 13;
const DEPLOY_STAGING_TAG_CH = 9;

function renderDeploys(s) {
  if (pushSkip("deploys", s)) return;
  const box = $("deploys"), note = $("deploysnote");
  box.replaceChildren();
  const d = s.deploys;
  // No reader at all is no viewer token, which is the same the Forgejo panel
  // says: both are wired from the one viewer client.
  if (!d) { note.className = "r"; note.textContent = ""; box.append(el("div", "empty", "no viewer token")); return; }
  // The reader names what it could not read — the class of a refresh that read
  // nothing, the repos whose runs failed, and the repos whose scheduled checks
  // it could not fold, which have no row to draw in the block — and the patrol
  // findings above are untouched by any of them.
  const err = d.error || "", unreadable = (d.missing || []).length, unchecked = (d.health_missing || []).length;
  note.className = err || unreadable || unchecked ? "r warnc" : "r";
  note.textContent = err ? "could not read the runs: " + err : [
    unreadable ? unreadable + (unreadable === 1 ? " repo unreadable" : " repos unreadable") : "",
    unchecked ? unchecked + (unchecked === 1 ? " repo's checks unreadable" : " repos' checks unreadable") : "",
  ].filter(Boolean).join(" · ");
  const runs = d.runs || [], health = d.health || [];
  // A block with neither kind of row is still a town with no deploys: the
  // scheduled rows are drawn only where a repo deploys or has health runs, so
  // their absence is not something this note has to name.
  if (!runs.length && !health.length) { box.append(el("div", err ? "badc" : "empty", err ? "no deploy runs: " + err : "no deploy runs yet")); return; }
  // The repo column is as wide as the longest name the block lists, plus one
  // character so the rounding of a name that fits does not ellipsize it, and
  // no name is cut to make room for another (gt-1hob8, gt-egffr). The ref
  // column keeps the width it always held, and a staging run's tag rides inside
  // it, so a list holding one takes the tag's own width as well and shows no
  // ref narrower than it would among releases (gt-2h2lx). Every header cell
  // carries its column's class and the header takes the rows' font, since the
  // widths are in ch and a ch is the drawing font's own (gt-egffr). The
  // scheduled rows' app column is measured the same way, from the apps they
  // name, which are not always the repos the runs below name.
  let widest = 0, tags = false, happ = 0;
  for (const r of runs) {
    widest = Math.max(widest, repoShort(r.repo).length);
    tags = tags || r.workflow === DEPLOY_STAGING;
  }
  for (const h of health) happ = Math.max(happ, (h.app || "–").length);
  box.style.setProperty("--drepo", (widest + 1) + "ch");
  box.style.setProperty("--dref", (DEPLOY_REF_CH + (tags ? DEPLOY_STAGING_TAG_CH : 0)) + "ch");
  if (happ) box.style.setProperty("--happ", (happ + 1) + "ch");
  if (runs.length) {
    const head = el("div", "dhead");
    [["Repo", "drepo"], ["Ref", "dref"], ["Commit", "dhash"], ["State", "dstate"], ["Age", "dage"]].forEach(([h, cls]) => head.append(el("span", cls, h)));
    box.append(head);
  }
  for (const r of runs) box.append(deployRow(r));
  // The scheduled checks are the block's other kind of row, under the runs and
  // with a header of their own: one row is an app and an environment folded
  // over the day's checks, not a run, so it has no stages, commit or ref to
  // line up with (gt-t9w60).
  if (health.length) box.append(healthHead());
  for (const h of health) box.append(healthRow(h));
}

// healthHead is the scheduled rows' column names. Every header cell carries its
// column's class, and the header takes the rows' font for the reason the runs'
// header does: the widths are in ch (gt-egffr).
function healthHead() {
  const head = el("div", "hhead");
  [["App", "happ"], ["Environment", "henv"], ["Result", "hstate"], ["Age", "hage"], ["Last green", "hgreen"], ["Passed", "hpass"]].forEach(([h, cls]) => head.append(el("span", cls, h)));
  return head;
}

// One scheduled check's result as the page says it. The API's word is not
// enough: a run whose check was skipped because the app is off is "off on
// purpose" — the deployment was not tested, so it is not green and never reads
// as one — and a run the reader could not read says that rather than leaving a
// blank that reads as a clean pass.
const HEALTH_RESULT = {success: "green", failure: "failed", skipped: "off on purpose"};

// Only a pass and a failure carry a colour. Every other word — running,
// blocked, cancelled, off on purpose, not read — is the column's own dim,
// which is the rule that keeps a check nobody ran from reading as a check that
// passed.
const HEALTH_RESULT_CLASS = {success: "good", failure: "badc"};

// An app that deploys with no scheduled check yet has no run to read, so its
// row says it has no check rather than a result (the reader's NoChecks).
function healthResult(h) {
  if (h.no_checks) return "no scheduled checks yet";
  const raw = h.status || "";
  return HEALTH_RESULT[raw] || raw || "–";
}

// healthRow is one app's scheduled check in one environment: the app and the
// environment, the newest result and how long ago it ran, when this
// environment was last green, and how many of the window's runs it passed. The
// row links the newest run the way a deploy row links its run; a row the reader
// could not read has no run to send the operator to and says so.
function healthRow(h) {
  const row = h.url ? el("a", "hrow") : el("div", "hrow");
  if (h.url) { row.href = h.url; row.target = "_blank"; row.rel = "noopener"; row.title = h.url; }
  const app = el("span", "happ", h.app || "–");
  if (app.textContent !== h.repo) app.title = h.repo;
  const result = el("span", "hstate " + (HEALTH_RESULT_CLASS[h.status] || "title"), h.unread ? "not read" : healthResult(h));
  // The API's own word stays on the title where the page words it another way,
  // so an operator reading "off on purpose" can see the run itself was skipped.
  if (h.status && result.textContent !== h.status) result.title = h.status;
  const green = el("span", "hgreen", h.last_green ? age(h.last_green) + " ago" : "–");
  if (!h.last_green) green.title = "not green in the runs the reader read";
  // The count is over the runs the reader read the window for. The runs it could
  // not read carry this environment's job or not — the block cannot tell — so
  // they are neither passed nor failed, and they are said beside the count
  // rather than dropped from it.
  const passes = el("span", "hpass", (h.runs ? h.passed + "/" + h.runs : "–") + (h.not_read ? " +" + h.not_read : ""));
  if (h.not_read) passes.title = h.not_read + (h.not_read === 1 ? " run of the window was not read" : " runs of the window were not read");
  row.append(app, el("span", "henv", h.env || "–"), result,
    el("span", "hage", h.at ? age(h.at) : "–"), green, passes);
  return row;
}

// deployRow is one run: the repo, ref, commit, state and age on one line, the
// stages after them while they fit on that line, and the reader's warning under
// it. The row itself is the run's link, so the run the operator is reading is
// the one they open; a run the reader kept no URL for is the same row unlinked
// rather than a link to nowhere. The repo cell shows the shortened name with
// the whole one on its title, the way the Actions rows name a repo. A staging
// run's ref is the branch the landing deployed (main), where a release's is a
// tag, so the ref cell carries the dim tag that names the kind (gt-2h2lx).
function deployRow(r) {
  const row = r.url ? el("a", "drow") : el("div", "drow");
  if (r.url) { row.href = r.url; row.target = "_blank"; row.rel = "noopener"; row.title = r.url; }
  const repo = el("span", "drepo", repoShort(r.repo));
  if (repo.textContent !== r.repo) repo.title = r.repo;
  const ref = el("span", "dref", r.ref || "–");
  if (r.workflow === DEPLOY_STAGING) {
    const g = el("span", "tag", "staging");
    g.title = "the staging workflow's run: a landing deployed " + (r.ref || "main") + " to staging, not a release";
    ref.append(g);
  }
  const state = el("span", "dstate", deployState(r));
  // The cell says running for a run that is moving; the API's own word stays
  // on its title, since that is the status the reader inferred the run's
  // trouble from (gt-egffr).
  if (state.textContent !== (r.status || "–")) state.title = r.status;
  row.append(repo, ref, el("span", "dhash", r.hash || "–"), state, el("span", "dage", r.at ? age(r.at) : "–"), deployStages(r));
  if (r.warn) row.append(el("span", "dwarn warnc", r.warn));
  return row;
}

// deployState is the State cell's word. Forgejo calls a run "blocked" in the
// moment between one job finishing and the next being picked up, so a run the
// API calls blocked or waiting with a stage already succeeded or running is a
// run that is moving: the cell says running. A run no stage has started in is
// still waiting for its first stage and says what the API said (gt-egffr).
const DEPLOY_MOVING = {blocked: true, waiting: true};
const DEPLOY_STARTED = {success: true, running: true};

function deployState(r) {
  const raw = r.status || "–";
  if (!DEPLOY_MOVING[raw]) return raw;
  return (r.stages || []).some(st => DEPLOY_STARTED[st.status]) ? "running" : raw;
}

// The stage cell: one chip per stage, in the order the reader sorted the jobs'
// needs into, each carrying its name and the glyph of the state the API
// reported, with the state's own word on the chip's title. A run the reader
// asked for jobs of and could not have says so rather than drawing a blank the
// operator would read as a run with no stages; one past the job-fetch cap
// draws nothing, since a line on every capped row doubles the block's height
// for a stage list nobody can be shown (gt-egffr).
function deployStages(r) {
  const cell = el("span", "dstage");
  const stages = r.stages || [];
  if (!stages.length) {
    if (r.stages_unread) { cell.className += " title"; cell.textContent = "stages not read"; }
    else if (!r.stages_skipped) cell.textContent = "–";
    return cell;
  }
  for (const st of stages) {
    const chip = el("span", "tag " + (DEPLOY_STAGE[st.status] || "sev-low"), (st.name || "–") + " " + (DEPLOY_GLYPH[st.status] || "–"));
    chip.title = (st.name || "–") + " " + (st.status || "?");
    cell.append(chip);
  }
  return cell;
}

// One compact line per sweep: when, which rig and sha, a verdict per tier, and
// how long the whole cycle took. A tier the sweep did not run is left blank, and
// a RED one carries the failing units its rig's record still holds.
const TIERSWEEP_TIERS = ["shell", "integration", "race"];

// The When column's reading of a sweep's stamp, shared with the icon's tooltip
// so the two cannot disagree about which sweep a verdict came from.
function sweepWhen(at) {
  const d = new Date(at);
  return d.toDateString() === new Date().toDateString() ? clock(at).slice(0, 5) : d.toLocaleDateString([], {month: "short", day: "numeric"}) + " " + clock(at).slice(0, 5);
}

// Each tier's most recent verdict, keyed by tier. This is the rule the daemon's
// attention list holds to (internal/daemon/attention.go): a tier a sweep did
// not run keeps the result of the sweep that last did, so a newer shell-only
// GREEN cannot hide an integration RED still standing. The first row naming a
// tier wins because the reader hands them over newest first
// (dashboard_tier_sweep.go recent()).
function tierSweepLatest(sweeps) {
  const latest = {};
  for (const row of sweeps || []) (row.stages || []).forEach(x => { if (!latest[x.tier]) latest[x.tier] = {verdict: x.verdict, at: row.at}; });
  return latest;
}

// The pane's title icon, the one verdict a collapsed pane still shows. Green
// needs every tier's most recent result GREEN and red needs one RED; a tier
// that has never reported leaves it neutral, because an unknown result is
// neither. A sweep in flight is not a verdict (gt-5qk83).
function tierSweepIcon(ts) {
  const none = {glyph: "–", cls: "", title: "no tier sweep results"};
  if (!ts) return none;
  if (ts.unavailable) return {glyph: "–", cls: "", title: "the daemon log could not be read"};
  if (!(ts.sweeps || []).length) return none;
  const latest = tierSweepLatest(ts.sweeps);
  const title = TIERSWEEP_TIERS.map(tier => { const v = latest[tier]; return tier + " " + (v ? v.verdict + " " + sweepWhen(v.at) : "–"); }).join(", ");
  // RED first: one red tier outranks any number of greens.
  if (TIERSWEEP_TIERS.some(tier => latest[tier] && latest[tier].verdict === "RED")) return {glyph: "✗", cls: "badc", title};
  if (TIERSWEEP_TIERS.every(tier => latest[tier] && latest[tier].verdict === "GREEN")) return {glyph: "✓", cls: "good", title};
  return {glyph: "–", cls: "", title};
}

// The neutral state carries no colour class of its own, so the dash takes the
// h2's muted tone. Green and red reuse the page's good and badc tokens, which
// keeps colour from being the only carrier of the verdict.
function paintTierIcon(ts) {
  const ico = $("tiersweepico");
  if (!ico) return;
  const v = tierSweepIcon(ts);
  ico.textContent = v.glyph;
  ico.className = "sweepico" + (v.cls ? " " + v.cls : "");
  ico.title = v.title;
}

function renderTierSweep(s) {
  if (pushSkip("tiersweep", s)) return;
  const box = $("tiersweep");
  box.replaceChildren();
  const ts = s.tiersweep;
  // Painted ahead of the empty paths' returns, so an unreadable log reads as
  // nothing known rather than as a stale green.
  paintTierIcon(ts);
  if (!ts) { box.append(el("div", "empty", "reading the daemon log…")); $("tiersweepnote").textContent = ""; return; }
  if (ts.unavailable) { box.append(el("div", "badc", "unavailable: the daemon log could not be read")); $("tiersweepnote").textContent = ""; return; }
  const kv = el("div", "kv");
  const run = ts.running;
  const st = el("div");
  // The cycle's own stage list when the daemon logged one; an older log gives
  // only the stage the fallback inferred.
  if (run) {
    const stages = (run.tiers && run.tiers.length) ? run.tiers.join(", ") : run.tier;
    st.append(el("b", "good", "running"), el("span", "", run.rig + " · " + stages + " · " + fmtDur((Date.now() - new Date(run.since).getTime()) / 1000)));
  } else st.append(el("b", "", "idle"), el("span", "", "no sweep is running"));
  kv.append(st);
  box.append(kv);
  const rows = ts.sweeps || [];
  if (!rows.length) {
    box.append(el("div", "empty", "no sweeps in the daemon log"));
    renderTierSweepRegistry(box, ts);
    $("tiersweepnote").textContent = "";
    return;
  }
  const t = el("table");
  const hr = el("tr");
  [["When"], ["Rig"], ["Sha"], ...TIERSWEEP_TIERS.map(x => [x]), ["Total", "the whole cycle, every stage the sweep ran", 1]].forEach(([h, tip, num]) => { const th = el("th", num ? "n" : "", h); if (tip) th.title = tip; hr.append(th); });
  t.append(hr);
  for (const row of rows) {
    const tr = el("tr");
    tr.append(el("td", "title", sweepWhen(row.at)));
    tr.append(el("td", "", row.rig));
    tr.append(el("td", "title", row.sha || "–"));
    const by = {};
    (row.stages || []).forEach(x => by[x.tier] = x);
    TIERSWEEP_TIERS.forEach(tier => {
      const v = by[tier];
      if (!v) { tr.append(el("td", "title", "–")); return; }
      const cell = el("td", v.verdict === "RED" ? "badc" : v.verdict === "GREEN" ? "good" : "", v.verdict);
      if ((v.failed || []).length) cell.title = "failed: " + v.failed.join(", ");
      tr.append(cell);
    });
    tr.append(el("td", "n", row.secs == null ? "–" : fmtDur(row.secs)));
    t.append(tr);
  }
  box.append(t);
  // The newest RED the record still explains, named under the table so it reads
  // without a hover.
  const newest = rows[0];
  (newest.stages || []).filter(x => x.verdict === "RED" && (x.failed || []).length).forEach(x => {
    box.append(el("div", "badc title", newest.rig + " " + x.tier + " RED: " + x.failed.join(", ")));
  });
  renderTierSweepRegistry(box, ts);
  $("tiersweepnote").textContent = rows.length + " sweeps · last " + fmtDur((Date.now() - new Date(newest.at).getTime()) / 1000) + " ago";
}

// One wall-time trend per rig, oldest sweep at the left: a line per tier the
// rig ran plus the cycle's total, drawn with the landings trend's own chart so
// devops test speed reads the way gate time does. The reader keeps 30 sweeps
// per rig (tierSweepTrendPerRig); a rig with none says so rather than drawing
// an empty chart, and an empty trend never stops the pane.
const TIERSWEEP_TREND_COLORS = ["#58a6ff", "#d29922", "#39c5bb", "#d2a8ff"];
function tierSweepTrendSeries(trend) {
  const sweeps = trend.sweeps || [];
  const pts = sweeps.map(r => ({t: new Date(r.at).getTime(), walls: r.walls || {}, total: r.total_secs}));
  const tiers = TIERSWEEP_TIERS.filter(tier => pts.some(p => p.walls[tier] != null));
  const series = [], key = [];
  tiers.forEach((tier, i) => {
    const color = TIERSWEEP_TREND_COLORS[i % TIERSWEEP_TREND_COLORS.length];
    series.push({color, pts: pts.map(p => ({t: p.t, v: p.walls[tier]}))});
    key.push([color, tier]);
  });
  if (pts.some(p => p.total != null)) {
    series.push({color: "#8b949e", pts: pts.map(p => ({t: p.t, v: p.total}))});
    key.push(["#8b949e", "total"]);
  }
  return {series, key};
}
// renderTierSweepRegistry draws the trends, and says so when the town's rig list
// could not be read: the trends then show only the rigs the log names. It runs
// whether or not the log holds sweeps, since a rig can have a trend without one.
function renderTierSweepRegistry(box, ts) {
  if (ts.trends_unavailable) box.append(el("div", "badc", "rig list unavailable: the town's registry could not be read, so the trends show only rigs the log names"));
  renderTierSweepTrends(box, ts.trends);
}
function renderTierSweepTrends(box, trends) {
  for (const trend of trends || []) {
    const sweeps = trend.sweeps || [];
    const head = el("div", "k");
    head.append(el("b", "", trend.rig), el("span", "", sweeps.length ? " " + sweeps.length + " sweeps · wall time each" : ""));
    box.append(head);
    if (!sweeps.length) { box.append(el("div", "empty", "no sweeps yet")); continue; }
    const st = tierSweepTrendSeries(trend);
    // A series with no value at all (every tier and total absent) has no line to
    // draw and no peak to name: say so rather than draw an empty chart.
    const vals = st.series.flatMap(x => x.pts.map(p => p.v)).filter(v => v != null);
    if (!vals.length) { box.append(el("div", "empty", "no wall times recorded")); continue; }
    const t0 = Math.min(...sweeps.map(r => new Date(r.at).getTime()));
    const t1 = Math.max(...sweeps.map(r => new Date(r.at).getTime()));
    const peak = Math.max(...vals);
    box.append(el("div", "k title", "wall time per sweep · " + sweeps.length + " sweeps · peak " + fmtDur(peak)), chartSVG(st.series, t0, Math.max(t1, t0 + 1), 600, 48, 3 * 3600e3), legend(st.key));
  }
}

// The Actions section's status colours, reusing the page's own tokens: success
// green, failure red, one still waiting or running amber, cancelled or skipped
// muted. A status the page has never seen stays muted rather than guessing.
const ACT_CLASS = {success: "act-success", failure: "act-failure", running: "act-running", waiting: "act-waiting", blocked: "act-blocked", cancelled: "act-cancelled", skipped: "act-skipped"};

// secsSince is how long ago an RFC3339 stamp is, or null when it is absent or
// unreadable; fmtDur renders null as "–".
function secsSince(iso) {
  if (!iso) return null;
  const t = Date.parse(iso);
  return isNaN(t) ? null : (Date.now() - t) / 1000;
}

// actsSum is the section's one line: what is running or queued, then how the
// newest completed runs went. The tally counts the runs the stats were taken
// over — the newest twenty completed — so its denominator is what was scored,
// not the whole history; a window of nothing but cancelled or skipped runs
// reads "none" rather than pretending a zero.
function actsSum(a) {
  const st = a.stats || {};
  const ok = st.ok || 0, failed = st.failed || 0, scored = ok + failed;
  const tally = [];
  if (ok) tally.push(ok + " ok");
  if (failed) tally.push(failed + " failed");
  const parts = [(st.running || 0) + " running", (st.queued || 0) + " queued"];
  parts.push(scored ? "last " + scored + ": " + (tally.length ? tally.join(" ") : "none") : "no completed runs");
  if (scored && st.median_secs > 0) parts.push("median " + fmtDur(st.median_secs));
  const unreadable = a.errors || [];
  if (unreadable.length) parts.push(unreadable.length + " unreadable");
  return parts.join(" · ");
}

// repoShort is what the repo cell shows: the part after the last "/", because
// the owner is the same for every run the panel reads and the name is the part
// that tells rigs apart. A name already without an owner, and a trailing slash
// with nothing after it, come back as they came — never empty (gt-fn9e6.54).
function repoShort(name) {
  const s = name || "";
  const cut = s.lastIndexOf("/");
  const short = cut >= 0 ? s.slice(cut + 1) : s;
  return short || s;
}

// actCommit is the row's commit cell: the hash of the commit the run tested,
// cut to the eight characters the Actions page shows, and the run's number
// beside it ("645edaf6 #20"). The hash opens the run in a new tab, so a row can
// be matched to a commit on main and opened without hunting the pane. A run the
// API sent no sha for leaves the cell empty rather than a link to nowhere; one
// with no URL shows the same text unlinked.
function actCommit(a) {
  const cell = el("span", "acommit");
  const hash = a.hash || "";
  if (!hash) return cell;
  const text = hash + (a.number ? " #" + a.number : "");
  if (!a.url) { cell.textContent = text; return cell; }
  const link = el("a", "", text);
  link.href = a.url;
  link.target = "_blank";
  link.rel = "noopener";
  cell.append(link);
  return cell;
}

// actPolecat is the row's polecat cell: who built the landing, read off the
// branch the run's title names ("land: polecat/obsidian/gt-xvw20+..."). The
// column is a fixed width, so a run whose title names no polecat — a push, a
// probe — draws nothing there without shifting the columns after it. The name
// is truncated to the column and the whole of it rides on the cell's title.
function actPolecat(a) {
  const cell = el("span", "apolecat", a.polecat || "");
  if (a.polecat) cell.title = a.polecat;
  return cell;
}

// actRow is one compact action line: status dot, repo, bead, polecat, commit,
// how long the run took, and how long ago it finished. A run still going shows
// its elapsed in place of the duration, ticking from its start — the start is
// its only stamp, so the age cell stays empty rather than repeating that
// number; a run that has not started has neither stamp and leaves both time
// cells blank. Each cell is one line with the whole value in its title, and the
// row's title carries the line the columns ellipsized.
function actRow(a) {
  const st = a.status || "";
  const running = st === "running";
  const row = el("div", "actsrow" + (st === "failure" ? " act-failure" : ""));
  const dot = el("span", "adot " + (ACT_CLASS[st] || ""));
  dot.title = st || "unknown status";
  const repo = repoShort(a.repo);
  const repoCell = el("span", "arepo", repo);
  // The shortened cell is the one whose text no longer says which owner the
  // repo came from, so it alone carries the full name on hover.
  if (repo !== (a.repo || "")) repoCell.title = a.repo;
  row.append(dot, repoCell, el("span", "abead", a.bead || ""), actPolecat(a), actCommit(a));
  const took = el("span", "an", running || a.started ? fmtDur(running ? secsSince(a.started) : a.duration_secs) : "");
  if (running && a.started) { took.dataset.since = a.started; took.title = "running for " + fmtDur(secsSince(a.started)); }
  else took.title = a.started ? "ran " + fmtDur(a.duration_secs) : "not started";
  row.append(took);
  const ago = el("span", "an", a.stopped ? fmtDur(secsSince(a.stopped)) : "");
  if (a.stopped) { ago.dataset.since = a.stopped; ago.title = "finished " + fmtDur(secsSince(a.stopped)) + " ago"; }
  row.append(ago);
  row.title = (a.repo || "") + " " + (a.bead || "") + " · " + (st || "unknown") + (a.event ? " (" + a.event + ")" : "") + (a.sha ? "\n" + a.sha : "") + (a.url ? "\n" + a.url : "");
  return row;
}

// renderForgejoActs draws the Actions section above the feed: the stats line,
// the runs still queued or running (or a muted idle line when there are none),
// a thin divider, then the newest completed. It is left out entirely when the
// server sends no actions — an older server, or a reader that has nothing to
// report — and then the pane is the feed it was before (gt-fn9e6.48).
function renderForgejoActs(a) {
  const box = $("forgejoacts");
  box.replaceChildren();
  if (!a) return;
  const wrap = el("div", "acts");
  const sum = el("div", "actssum", actsSum(a));
  if ((a.errors || []).length) sum.title = "runs unreadable in: " + a.errors.join(", ");
  wrap.append(sum);
  const current = a.current || [], recent = a.recent || [];
  if (current.length) current.forEach(r => wrap.append(actRow(r)));
  else wrap.append(el("div", "actsidle", "idle"));
  if (recent.length) { wrap.append(el("div", "actdiv")); recent.forEach(r => wrap.append(actRow(r))); }
  box.append(wrap);
}

// The Forgejo panel is a tail like the feed: one line per event, oldest first,
// following its own end. Where it was scrolled is read before the lines are
// replaced, so a reader who has scrolled up keeps their place and following
// resumes on its own once they come back to the bottom.
function renderForgejo(s) {
  if (pushSkip("forgejo", s)) return;
  const box = $("forgejo");
  const follow = box.scrollHeight - box.scrollTop - box.clientHeight <= 4;
  box.replaceChildren();
  $("forgejonote").textContent = "";
  $("forgejonote").className = "r";
  const f = s.forgejo;
  if (!f) { renderForgejoActs(null); feedCount = null; foldFeed(false); box.append(el("div", "empty", "no viewer token")); return; }
  renderForgejoActs(f.actions);
  const events = f.events || [];
  feedCount = events.length;
  foldFeed(!!f.actions);
  // A repo the viewer's token cannot read is named, and a repo this refresh
  // could not read is named apart from it: a permission to fix and an outage
  // to retry are different answers, and silently reading a subset is how a
  // rig's landings went missing with no error anywhere (gt-faml5, gt-p7lkd).
  const missing = f.missing || [];
  if (missing.length) box.append(el("div", "badc title", "not readable by the viewer: " + missing.join(", ")));
  const failed = f.failed || [];
  if (failed.length) box.append(el("div", "badc title", "could not read this refresh: " + failed.join(", ")));
  if (!events.length) {
    if (!missing.length && !failed.length) { box.append(el("div", f.error ? "badc" : "empty", f.error ? "unavailable: " + f.error : "no activity")); return; }
  } else {
    const today = new Date().toDateString();
    for (const e of events) {
      const when = new Date(e.at);
      const stamp = when.toDateString() === today ? clock(e.at).slice(0, 5) : when.toLocaleDateString([], {month: "short", day: "numeric"});
      const row = el("div", "fev");
      row.append(el("span", "t", stamp), el("span", "a", e.actor), el("span", "s", e.summary), el("span", "rp", e.repo));
      box.append(row);
    }
  }
  // The note ages the SNAPSHOT, not the newest event. A quiet repo's feed is
  // current with its newest event hours old, and a frozen pane is the other way
  // round, so the event's age cannot tell them apart (gt-faml5).
  const read = Date.parse(f.at || "");
  const every = f.every_seconds || 0;
  const never = neverRead(f.at);
  const age = never ? null : (Date.now() - read) / 1000;
  const stale = never || (age != null && every > 0 && age > 2 * every);
  let note = (f.error ? "stale (" + f.error + ") · " : "") + events.length + " events";
  if (never) note += " · snapshot never read";
  else note += " · snapshot " + fmtDur(age) + " old";
  if (stale && !never) note += " · STALE";
  $("forgejonote").textContent = note;
  // A snapshot never read is stale the way readOf marks a source: amber, or red
  // when its read failed. An aged snapshot stays red.
  if (stale) $("forgejonote").className = "r " + (never && !f.error ? "warnc" : "badc");
