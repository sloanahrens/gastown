<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gas Town</title>
<style>
:root{
  --bg:#0d1117;--panel:#141a22;--line:#232c38;--text:#d7dee8;--dim:#7d8896;
  --green:#3fb950;--amber:#d29922;--red:#f85149;--blue:#58a6ff;--teal:#39c5bb;--violet:#b392f0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
body{padding:0 16px 24px;max-width:1500px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
h1{font-size:15px;margin:0;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.pill{padding:3px 10px;border-radius:999px;font-weight:700;font-size:12px;border:1px solid currentColor}
.pill.green{color:var(--green)}.pill.degraded{color:var(--amber)}.pill.red{color:var(--red)}.pill.unknown{color:var(--dim)}
#healthline{color:var(--dim);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#healthmark{white-space:nowrap}
#strip{color:var(--dim);min-width:0}
#strip b{font-weight:700}
#strip .v{color:var(--text)}
#strip .warnc{color:var(--amber)}
#strip .badc{color:var(--red)}
#models{background:none;border:0;padding:0;color:var(--dim);font:inherit;cursor:pointer;white-space:nowrap}
#models:hover{color:var(--text)}
#modelspanel{display:flex;gap:32px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
#modelspanel:empty{display:none}
#modelspanel table{width:auto;min-width:260px}
#conn{font-size:12px;color:var(--dim)}
#conn.on::before{content:"● ";color:var(--green)}#conn.off::before{content:"● ";color:var(--red)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:12px}
@media (max-width:1000px){.grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
section>h2{white-space:nowrap;margin:0;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);display:flex;gap:10px;align-items:center}
section>h2 .r{margin-left:auto;text-transform:none;letter-spacing:0;white-space:normal;text-align:right}
.body{padding:10px 12px}
table{border-collapse:collapse;width:100%}
th{color:var(--dim);font-weight:400;text-align:left;font-size:11px;padding:3px 8px 3px 0}
td{padding:4px 8px 4px 0;vertical-align:top;border-top:1px solid var(--line)}
td.n,th.n{text-align:right}
.bead{color:var(--blue)}.title{color:var(--dim)}
.rbead{background:none;border:0;padding:0;color:var(--blue);font:inherit;cursor:pointer;text-decoration:underline;text-decoration-style:dotted}
.rbead:hover{background:#19212b}
.rbeadrow{margin-top:6px}
.empty{color:var(--dim);padding:6px 0}
.body.stale{opacity:.55}
.spark{width:100%;height:56px;display:block}
.chart{width:100%;height:64px;display:block}
.hbars{display:flex;align-items:stretch;gap:2px;height:64px;margin:4px 0 2px}
.hbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;min-height:1px}
.hbar i{display:block;min-height:1px}
.hok{background:var(--blue);border-radius:0 0 2px 2px}
.hrej{background:var(--red);border-radius:2px 2px 0 0}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--dim);font-size:11px;margin-top:3px}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.kv{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:6px}#spend .kv{margin-bottom:2px}
.kv b{font-size:16px}.kv span{color:var(--dim);font-size:11px;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--dim);background:none;font:inherit;font-size:11px}
.chip.on{color:var(--text);border-color:var(--blue);background:#1c2a3d}
.chip b{font-weight:400;color:var(--dim);margin-left:4px}
#feed{max-height:68vh;overflow:auto;padding:4px 0}
.row{display:grid;grid-template-columns:62px 82px 1fr;gap:8px;padding:2px 12px}
[hidden]{display:none !important}
.row:hover{background:#19212b}
.row .t{color:var(--dim)}.row .g{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .x{overflow-wrap:anywhere}
.c-failure .x{color:var(--red)}.c-warning .x{color:var(--amber)}.c-success .x{color:var(--green)}
.c-landing .x{color:var(--violet)}.c-dispatch .x{color:var(--blue)}.c-restart .x{color:var(--teal)}.c-plain .x{color:var(--dim)}
.bars{display:flex;align-items:flex-end;gap:3px;height:54px;margin:4px 0 2px;position:relative}
.bars i{flex:1;background:var(--blue);min-height:1px;border-radius:2px 2px 0 0;position:relative}
.bars i.low{background:var(--red)}
.bars .thr{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--amber)}
.axis{display:flex;justify-content:space-between;color:var(--dim);font-size:10px}
.stack{display:flex;height:9px;border-radius:2px;overflow:hidden;background:var(--line);min-width:90px}
.stack i{display:block;height:100%}
.sa{background:var(--green)}.ss{background:var(--dim)}.se{background:var(--amber)}.sr{background:var(--red)}
.tag{display:inline-block;padding:0 6px;border-radius:4px;font-size:11px;border:1px solid var(--line);margin-right:4px}
.o-approved{color:var(--green)}.o-skipped{color:var(--dim)}.o-error{color:var(--amber)}.o-rejected{color:var(--red)}
.tag.live{color:var(--green);border-color:var(--green)}
tr.live{background:#101a13}
.badge{padding:1px 8px;border-radius:999px;font-size:11px;border:1px solid currentColor;white-space:nowrap}
.st-working{color:var(--green)}.st-gating{color:var(--violet)}.st-queued{color:var(--blue)}
.st-needs-human{color:var(--red)}.st-quiet{color:var(--amber)}.st-stalled{color:var(--red)}.st-review-needed,.st-recovery{color:var(--amber)}.st-spawning{color:var(--teal)}.st-parked,.st-idle,.st-unknown{color:var(--dim)}
.tag.p0,.tag.p1{color:var(--red)}.tag.p2{color:var(--amber)}.tag.p3,.tag.p4{color:var(--dim)}
.cmd{display:inline-block;margin:2px 6px 0 0;padding:0 6px;border:1px solid var(--line);border-radius:4px;color:var(--dim);background:none;font:inherit;font-size:11px;cursor:pointer;text-align:left}
.cmd:hover{color:var(--text);border-color:var(--dim)}.cmd.done{color:var(--green);border-color:var(--green)}
.skip{padding:3px 0;border-top:1px solid var(--line)}.skip .why{color:var(--dim);display:block}
.qtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qrow{border-top:1px solid var(--line)}
.qhead{display:grid;grid-template-columns:auto auto 1fr auto;gap:4px 8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:5px 0;cursor:pointer}
.qhead:hover{background:#19212b}
.qhead .t{overflow-wrap:anywhere}
.qhead .caret{color:var(--dim);width:10px;display:inline-block}
.qsub{grid-column:2 / -1;color:var(--dim);font-size:11px}
.qdetail{padding:4px 0 10px 18px;overflow-wrap:anywhere}
.qdetail h4{margin:8px 0 2px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:400}
.qdetail pre{margin:0;white-space:pre-wrap;font:inherit;background:#10161d;border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-height:320px;overflow:auto}
.qcomment{border-left:2px solid var(--line);padding-left:8px;margin:4px 0}
section>h2{cursor:pointer;user-select:none}
section>h2:hover{color:var(--text)}
section>h2 .caret{display:inline-block;width:10px;color:var(--dim)}
section.collapsed>:not(h2){display:none}
section.collapsed>h2{border-bottom:0}
#queue{max-height:70vh;overflow:auto}
#forgejo{max-height:240px;overflow:auto}
#forgejo.folded{display:none}
.feedhead{display:flex;align-items:center;gap:6px;width:100%;background:none;border:0;padding:2px 0 3px;color:var(--dim);font:inherit;font-size:11px;letter-spacing:.04em;text-align:left;cursor:pointer}
.feedhead:hover{color:var(--text)}
.feedhead .caret{display:inline-block;width:10px}
.acts{margin-bottom:6px}
.actssum{color:var(--dim);padding:1px 0 3px}
.actsrow{display:grid;grid-template-columns:10px 17ch minmax(0,1fr) 10ch 13ch 52px 46px;gap:8px;align-items:center;height:16px;line-height:16px}
.actsrow>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actsrow .an,.actsrow .apolecat{color:var(--dim)}
.actsrow .acommit a{color:var(--blue);text-decoration:none}
.actsrow .acommit a:hover{text-decoration:underline}
.actsrow.act-failure,.actsrow.act-failure .an{color:var(--red)}
.actsidle{color:var(--dim);height:16px;line-height:16px}
.actdiv{border-top:1px solid var(--line);margin:2px 0}
.adot{width:8px;height:8px;border-radius:50%;background:currentColor;justify-self:center}
.act-success{color:var(--green)}
.act-failure{color:var(--red)}
.act-running,.act-waiting,.act-blocked{color:var(--amber)}
.act-cancelled,.act-skipped{color:var(--dim)}
.fev{display:grid;grid-template-columns:52px 88px 1fr minmax(0,auto);gap:8px;align-items:baseline;padding:3px 0;border-top:1px solid var(--line)}
.fev:first-child{border-top:0}
.fev .t{color:var(--dim);white-space:nowrap}
.fev .a{color:var(--teal);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fev .s{overflow-wrap:anywhere}
.fev .rp{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltable td{vertical-align:top}
.ltable td.n,.ltable th.n{padding-left:14px}
.ltable td:nth-child(2){overflow-wrap:anywhere}
.good{color:var(--green)}.warnc{color:var(--amber)}.badc{color:var(--red)}
.sweepico{font-weight:700}
#alertsctl{cursor:pointer;background:none;font:inherit;font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
#alertsctl.on{color:var(--teal);border-color:var(--teal)}
#toasts{position:fixed;top:54px;right:16px;z-index:5;display:flex;flex-direction:column;gap:6px;width:min(420px,90vw)}
.toast{display:flex;gap:8px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--dim);border-radius:6px;padding:7px 9px}
.toast.info{border-left-color:var(--blue)}.toast.warn{border-left-color:var(--amber)}.toast.crit{border-left-color:var(--red)}
.toast .tt{font-weight:700;overflow-wrap:anywhere}
.toast .tx{color:var(--dim);overflow-wrap:anywhere}
.toast button{margin-left:auto;background:none;border:0;color:var(--dim);font:inherit;cursor:pointer}
.alvl{display:inline-block;padding:0 6px;border-radius:4px;font-size:11px;border:1px solid currentColor;margin-right:6px}
.alvl.info{color:var(--blue)}.alvl.warn{color:var(--amber)}.alvl.crit{color:var(--red)}
.arow{border-top:1px solid var(--line);padding:4px 0;overflow-wrap:anywhere}
.arow .t{color:var(--dim)}
.arow .tx{color:var(--dim)}
.esc{font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.04em;white-space:nowrap}
.sev-critical{color:var(--red)}.sev-high{color:var(--amber)}.sev-medium{color:var(--blue)}.sev-low{color:var(--dim)}
.chead{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.cchips{display:flex;gap:4px;flex-wrap:wrap}
.cchips .tag{margin-right:0}
.crow{display:flex;gap:8px;align-items:baseline;width:100%;padding:4px 0;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.crow:hover{background:#19212b}
.crow .tag{margin-right:0}
.ckind{flex:0 0 auto;white-space:nowrap}
.cres{display:flex;gap:4px;align-items:baseline;flex:0 1 auto;min-width:0}
.cproj{flex:0 0 auto;white-space:nowrap}
.cname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cdetail{flex:1 1 24ch;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfull{padding:4px 0 8px 10px;margin-bottom:4px;border-left:2px solid var(--line);overflow-wrap:anywhere}
.ccheck{margin-bottom:4px}
.ccrow{display:flex;gap:6px;align-items:baseline;padding-left:10px}
.apow{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:2px}
.apname{flex:0 0 auto;white-space:nowrap}
.apstate{flex:0 0 auto;white-space:nowrap}
.aptext{min-width:0;overflow-wrap:anywhere}
.aprel{margin-left:auto;color:var(--dim);overflow-wrap:anywhere}
.ccsection{flex:0 0 auto;white-space:nowrap;color:var(--dim)}
.cctext{min-width:0;overflow-wrap:anywhere}
.reptext{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;background:#10161d;border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-height:68vh;overflow:auto}
.reptimes{margin:2px 0 0;padding-left:18px;color:var(--dim);font-size:11px}
.rtime{background:none;border:0;padding:0;color:var(--blue);font:inherit;cursor:pointer;text-decoration:underline;text-decoration-style:dotted}
.rtime:hover{background:#19212b}
.rtime.on{color:var(--text)}
.rback{margin-bottom:4px}
.ojline{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;padding:2px 0;overflow-wrap:anywhere}
.ojage,.okind{color:var(--dim);white-space:nowrap}
.qcard{padding:4px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.qtext{margin:2px 0}
.qrec,.qheld{color:var(--dim);margin:2px 0}
.qage{color:var(--dim)}
.qpri,.qeffort{color:var(--dim);font-size:11px;white-space:nowrap}
.qpri.warnc{color:var(--amber)}
.qstate{color:var(--dim);font-size:11px;white-space:nowrap}
.qcmd{margin-top:3px;display:inline-block;background:#10161d;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:11px;user-select:all}
h3.sub{display:flex;gap:10px;align-items:center;margin:0;padding:10px 12px 0;font-size:11px;font-weight:400;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
h3.sub .r{margin-left:auto;text-transform:none;letter-spacing:0;white-space:normal;text-align:right}
.dhead,.drow{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.dhead{color:var(--dim);padding-bottom:2px}
.drow{padding:4px 0;border-top:1px solid var(--line)}
.drepo,.dref,.dhash,.dstate,.dage{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drepo{flex:0 0 var(--drepo,15ch)}
.dref{flex:0 0 var(--dref,13ch);display:flex;gap:4px;align-items:baseline}
.dref .tag{flex:0 0 auto;margin-right:0}
.dhash{flex:0 0 9ch}.dstate{flex:0 0 9ch}.dage{flex:0 0 7ch}
.drow .dref,.drow .dhash,.drow .dage{color:var(--dim)}
a.drow{color:inherit;text-decoration:none;cursor:pointer}
a.drow:hover{background:#19212b}
.dstage{flex:0 1 auto;min-width:0;display:flex;gap:4px;flex-wrap:wrap}
.dstage .tag{margin-right:0}
.dstage .live{font-weight:700}
.dwarn{flex:1 0 100%;overflow-wrap:anywhere}
.hhead,.hrow{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.hhead{color:var(--dim);padding:6px 0 2px}
.hrow{padding:4px 0;border-top:1px solid var(--line)}
.happ,.henv,.hstate,.hage,.hgreen,.hpass{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.happ{flex:0 0 var(--happ,16ch)}
.henv{flex:0 0 20ch;color:var(--dim)}
.hstate{flex:0 0 16ch}
.hage,.hgreen{flex:0 0 8ch;color:var(--dim)}
.hpass{flex:0 0 14ch;color:var(--dim)}
a.hrow{color:inherit;text-decoration:none;cursor:pointer}
a.hrow:hover{background:#19212b}
</style>
</head>
<body>
<header>
  <h1>Gas Town</h1>
  <span id="verdict" class="pill unknown">UNKNOWN</span>
  <span id="healthline">waiting for the town…</span>
  <span id="healthmark" class="pill red" hidden></span>
  <span id="strip"></span>
  <button id="models" type="button" aria-expanded="false" aria-controls="modelspanel" title="every seat, and the model each role runs">models ▸</button>
  <span id="conn" class="off">connecting</span>
  <button id="alertsctl" type="button">alerts: off</button>
</header>

<div id="modelspanel" hidden></div>

<div id="toasts"></div>

<div class="grid">
  <div class="col">
    <section><h2>Overseer <span class="r" id="overseernote"></span></h2><div class="body" id="overseer"></div></section>
    <section><h2>Questions <span class="r" id="questionsnote"></span></h2><div class="body" id="questions"></div></section>
    <section><h2>Deep review <span class="r" id="deepreviewnote"></span></h2><div class="body" id="deepreview"></div></section>
    <section><h2>Escalations <span class="r" id="escalationnote"></span></h2><div class="body" id="escalations"></div></section>
    <section><h2>Alerts <span class="r" id="alertsnote"></span></h2><div class="body" id="alerts"></div></section>
    <section><h2>Report <span class="r" id="reportnote"></span></h2><div class="body" id="report"></div></section>
    <section><h2>DeepSeek <span class="r" id="spendnote"></span></h2><div class="body" id="spend"></div></section>
    <section><h2>Usage <span class="r" id="usagenote"></span></h2><div class="body" id="usage"></div></section>
    <section><h2>Rigs <span class="r" id="rigsnote"></span></h2><div class="body" id="rigs"></div></section>
    <section><h2><span class="sweepico" id="tiersweepico"></span>Tier sweeps <span class="r" id="tiersweepnote"></span></h2><div class="body" id="tiersweep"></div></section>
    <section><h2>Polecats <span class="r" id="seatsnote"></span></h2><div class="body" id="seats"></div></section>
    <section><h2>Dispatcher <span class="r" id="dispnote"></span></h2><div class="body" id="disp"></div></section>
    <section><h2>Work queue <span class="r" id="queuenote"></span></h2><div class="body" id="queue"></div></section>
    <section>
      <h2>Feed <span class="chips" id="chips"></span></h2>
      <div id="feed"></div>
    </section>
  </div>
  <div class="col">
    <section><h2>Machine <span class="r" id="machnote"></span></h2><div class="body" id="machine"></div></section>
    <section><h2>Cloud <span class="r" id="cloudnote"></span></h2><div class="body" id="cloud"></div><h3 class="sub">Deploys <span class="r" id="deploysnote"></span></h3><div class="body" id="deploys"></div></section>
    <section><h2>Forgejo <span class="r" id="forgejonote"></span></h2><div class="body"><div id="forgejoacts"></div><button id="forgejofeedhead" type="button" class="feedhead" aria-controls="forgejo"></button><div id="forgejo"></div></div></section>
    <section><h2>om review <span class="r" id="omnote"></span></h2><div class="body" id="om"></div></section>
    <section id="trendsec" hidden><h2>Landings <span class="r" id="trendnote"></span></h2><div class="body" id="trend"></div></section>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const fmtDur = s => {
  if (s == null || s < 0) return "–";
  s = Math.round(s);
  if (s < 90) return s + "s";
  const m = Math.round(s / 60);
  if (m < 90) return m + "m";
  const h = Math.floor(m / 60);
  if (h >= 48) return Math.floor(h / 24) + "d";
  return h + "h" + String(m % 60).padStart(2, "0") + "m";
};
const age = iso => iso ? fmtDur((Date.now() - new Date(iso).getTime()) / 1000) : "–";
const clock = iso => new Date(iso).toLocaleTimeString([], {hour12: false});
const money = v => v == null ? "–" : "$" + Number(v).toFixed(2);

// readOf is one poller's last read, off the per-source status the server sends.
// A value whose read failed, or that has aged past a few of the poll's own
// intervals, is stale: the pane keeps drawing the last good value, greyed,
// rather than letting it pass as current. The server stamps the same thing
// (readStaleFactor, internal/dashboard/types.go); the age is measured again here
// because it drifts between pushes, and the two factors must agree (gt-q6h8e).
function readOf(s, source) {
  const x = (s && s.reads && s.reads[source]) || null;
  if (!x) return null;
  const ageSec = x.at ? (Date.now() - new Date(x.at).getTime()) / 1000 : null;
  const every = x.every_sec || 0;
  const stale = !!x.stale || ageSec == null || (every > 0 && ageSec > every * 3);
  return {ageSec: ageSec, error: !!x.error, stale: stale};
}
// paintsRead greys a pane whose reading is stale and colours its caption in the
// page's own idiom: red for a read that failed, amber for one gone old.
function paintsRead(box, note, r) {
  box.classList.toggle("stale", !!(r && r.stale));
  note.className = "r" + (r && r.stale ? (r.error ? " badc" : " warnc") : "");
}
// readCaption joins a pane's own words with the reason its reading is not
// current, so every pane says which of its numbers are live.
function readCaption(r, parts) {
  const why = r && r.stale ? (r.error ? "read failed" : "stale") : null;
  return parts.filter(Boolean).concat(why ? [why] : []).join(" · ");
}

let state = null;

// Every state a polecat's session is read into (the State* constants of
// internal/dashboard/types.go), and what the strip does with it: the alarm the
// state earns, whether it is work in progress — a session is on somebody's bead
// — and the word the strip names its count by beside the working number. The
// reader sends states this page has never seen the moment the town learns one,
// so the strip names a state no row here covers rather than dropping it.
const POLE_ALARM = {working: "", quiet: "warnc", gating: "", queued: "", spawning: "", stalled: "badc", "review-needed": "", recovery: "", "needs-human": "badc", parked: "", idle: "", unknown: ""};
const POLE_WORKING = {working: 1, quiet: 1, gating: 1, queued: 0, spawning: 0, stalled: 0, "review-needed": 0, recovery: 0, "needs-human": 0, parked: 0, idle: 0, unknown: 0};
const POLE_WORD = {queued: "queued", spawning: "spawning", stalled: "stalled", "review-needed": "need review", recovery: "recovering", "needs-human": "need a human", parked: "parked", unknown: "unknown (tmux unreadable)", quiet: "quiet"};

// The thresholds the strip's alarming branches read: the seconds the oldest
// waiting landing may sit before it reads warn and then bad, the load per core
// the machine may run at, and the commits the installed gt may fall behind main
// before it reads warn.
const STRIP_ALARM = {wait_warn_secs: 900, wait_bad_secs: 3600, load_warn_cores: 1, load_bad_cores: 3, behind_warn: 20};

// factBox opens one reading of the strip, joined to the one before it by the
// page's middot.
function factBox(box) {
  if (box.childElementCount) box.append(document.createTextNode(" · "));
  const x = el("span", "");
  box.append(x);
  return x;
}

// fact writes one reading: its value, the name of what it counts and the
// reading's own detail in the title. cls is the alarm class the value wears and
// defaults to the bright one, so a fact nobody has to act on is loud and a
// reading nobody has made is the strip's own dim; lead puts the name first,
// for a value that only reads as a word.
function fact(box, value, name, opts) {
  opts = opts || {};
  const x = factBox(box);
  const b = el("b", opts.cls == null ? "v" : opts.cls, value);
  if (opts.lead) x.append(document.createTextNode(name + " "), b);
  else x.append(b, document.createTextNode(" " + name));
  if (opts.extra) x.append(document.createTextNode(" · " + opts.extra));
  if (opts.tip) x.title = opts.tip;
  return x;
}

// paneCount reads a pane's own reader as a count: nothing before the read has
// come back, "unavailable" for one that failed or could not be made, else the
// rows it listed plus the ones it counted and left out.
function paneCount(pane) {
  if (!pane) return null;
  if (pane.unavailable) return "unavailable";
  return (pane.rows || []).length + (pane.more || 0);
}

// causeText keys one non-green health field the way the health line does —
// name, /rig, :subject — then the detail that explains it.
function causeText(c) {
  let k = c.name || "";
  if (c.rig) k += "/" + c.rig;
  if (c.subject) k += ":" + c.subject;
  return c.detail ? k + ": " + c.detail : k;
}

// renderHealthMark draws the strip's pill as the deploys reader decided it
// (health_mark: red, degraded or absent); an absent mark hides the pill.
function renderHealthMark(s) {
  const box = $("healthmark"), m = (s && s.deploys && s.deploys.health_mark) || null;
  box.hidden = !m;
  box.className = "pill " + (m && m.state === "red" ? "red" : "degraded");
  box.textContent = m ? m.text : "";
}

// renderHealth shows the verdict and, when it is not green, the worst cause
// beside it, so the pill answers "why" without reading the line under it.
function renderHealth(h) {
  const v = (h && h.verdict) || "unknown";
  const causes = (h && h.causes) || [];
  const p = $("verdict");
  p.className = "pill " + v;
  p.textContent = v.toUpperCase() + (causes.length ? " · " + causeText(causes[0]) : "");
  p.title = causes.map(causeText).join("\n");
  $("healthline").textContent = h && h.line ? h.line : "no health report";
}

// seatFacts is the strip's seats: what each open seat runs and how full it is,
// off the seat rows the hub fills from the same polecats the Polecats pane
// counts, so the two cannot disagree. A closed seat — nothing may fill it — is
// left to the models line, and a seat whose config nobody could read says
// unknown rather than passing as a seat nobody runs. The pro seat is named the
// reserved one, which is what the town keeps it for: work pinned to its agent
// (gt pool mix). No rows at all is a settings read that has not come back, not
// a town with no seats: the reader always sends the three.
function seatFacts(m) {
  if (!m || !(m.seat_rows || []).length) return null;
  const out = [];
  for (const sr of m.seat_rows) {
    const key = sr.key || "no config key recorded";
    if (sr.unknown) { out.push({text: (sr.seat || "seat") + " seat unknown", title: "the config this seat is read from could not be read · " + key}); continue; }
    if (sr.closed) continue;
    const where = (sr.seat === "pro" ? "the pro seat, reserved for work pinned to its agent" : "the " + (sr.seat || "unknown") + " seat") + " · " + key;
    out.push({
      text: (sr.agent || "no agent") + " " + (sr.live == null ? "–" : sr.live) + "/" + sr.cap + (sr.cap_default ? "*" : "") + (sr.seat === "pro" ? " (reserved)" : ""),
      title: where + (sr.live == null ? " · the polecats have not been read yet" : "") + (sr.cap_default ? " · the cap key is unset, so this is the default the dispatcher holds it to" : ""),
    });
  }
  return out;
}

// renderStrip is the page's one status strip, and the whole of its top: the
// day's shape and what needs the operator as one line of facts, each drawn once
// from the reader that owns it — the landings off the Landings pane's own
// window, the seats off the polecats the Polecats pane counts, the queue off
// the ready read, the machine and the install off the Machine pane's. A
// reading nobody has made says so, in the strip's own dim: a strip that drew a
// zero it had not read would answer the operator with a fact it invented.
function renderStrip(s) {
  const box = $("strip");
  box.replaceChildren();
  const sm = s.summary || {};

  // Landings: the trend's own last 24 hours. No trend is a window nobody has
  // read yet, not a day in which nothing landed.
  const t = s.trend || null;
  const landed = ((t && t.hours) || []).reduce((n, h) => n + h.landed, 0);
  fact(box, t ? String(landed) : "–", "landed/24h",
    {cls: t ? "v" : "", tip: t ? "what landed in the last 24 hours, off the Landings pane's own window" : "the landings window has not been read yet"});

  // Seats: one entry per open seat.
  const seats = seatFacts(s.models);
  const sp = factBox(box);
  if (!seats) { sp.append(el("b", "", "–"), document.createTextNode(" seats")); sp.title = "the town's settings have not been read yet"; }
  else if (!seats.length) { sp.append(el("b", "", "no open seats")); sp.title = "every seat is closed: the pool, the pro seat and the second seat name no agent the dispatcher could run"; }
  else seats.forEach((f, i) => { const x = el("span", "", (i ? " · " : "") + f.text); if (f.title) x.title = f.title; sp.append(x); });

  // Working: the polecats on the job, off POLE_WORKING, so which states are
  // work in progress is one table. A parked rig is stood down on purpose and
  // holds nothing, so it is counted nowhere; every other state the town has is
  // named beside the count, and the alarm is the worst any live state earns.
  const pcs = s.polecats || [];
  const live = pcs.filter(p => !p.rig_parked);
  const n = k => live.filter(p => p.state === k).length;
  const active = Object.keys(POLE_WORKING).reduce((sum, k) => sum + (POLE_WORKING[k] ? n(k) : 0), 0);
  const alarms = live.map(p => POLE_ALARM[p.state] || "");
  const worst = alarms.indexOf("badc") >= 0 ? "badc" : alarms.indexOf("warnc") >= 0 ? "warnc" : "";
  const rest = Object.keys(POLE_WORD).filter(k => n(k)).map(k => n(k) + " " + POLE_WORD[k]);
  const strangers = live.filter(p => !(p.state in POLE_ALARM)).length;
  if (strangers) rest.push(strangers + " in a state this page does not know");
  const parked = pcs.length - live.length;
  const also = [sm.seats_cap ? "cap " + sm.seats_cap : null, parked ? parked + " in parked rigs" : null].concat(rest).filter(Boolean).join(" · ");
  fact(box, s.polecats ? String(active) : "–", "working",
    {cls: s.polecats ? worst : "", tip: "polecats holding work with a live session" + (also ? " · " + also : "") + (worst === "badc" ? " · the Polecats pane has the rows" : "")});

  // Waiting to land: the ready reader's count, and how long the oldest has
  // waited. The count is drawn even when the read behind it failed or aged —
  // it is never a drained queue — and the alarm is the read's own state, or the
  // age of the oldest.
  const rr = readOf(s, "ready");
  const q = sm.ready_to_land;
  const oldest = sm.oldest_ready ? (Date.now() - new Date(sm.oldest_ready).getTime()) / 1000 : null;
  const why = rr && rr.stale ? (rr.error ? "the read that lists what is waiting to land failed" : "the last count of what is waiting to land is old") : null;
  const waitCls = why ? (rr.error ? "badc" : "warnc")
    : oldest > STRIP_ALARM.wait_bad_secs ? "badc" : oldest > STRIP_ALARM.wait_warn_secs ? "warnc" : "";
  if (q == null && why) fact(box, "unavailable", "waiting to land", {cls: waitCls, tip: why});
  else fact(box, q == null ? "–" : String(q), "waiting to land",
    {cls: q == null ? "" : waitCls, extra: oldest == null ? null : "oldest " + fmtDur(oldest),
     tip: ["beads submitted and waiting for the landing worker", why, q == null && !why ? "the read that lists them has not come back" : null, oldest == null ? null : "the age is the oldest one's"].filter(Boolean).join(" · ")});

  // Needs you: everything waiting on a decision — the open escalations and the
  // overseer's open questions — off the same two reads the panes below draw, so
  // the strip and the panes cannot disagree. Bead gt-bi6w0 wires this to the
  // one merged attention list; until then it is their sum.
  const esc = paneCount(s.escalations), ask = paneCount(s.questions);
  const failed = [esc === "unavailable" ? "the escalations" : null, ask === "unavailable" ? "the questions" : null].filter(Boolean);
  const pending = [esc === null ? "the escalations" : null, ask === null ? "the questions" : null].filter(Boolean);
  if (failed.length) fact(box, "unavailable", "needs you", {cls: "badc",
    tip: failed.join(" and ") + " could not be read" + (pending.length ? ", and " + pending.join(" and ") + " has not been read yet" : "")});
  else if (pending.length) fact(box, "–", "needs you", {cls: "", tip: pending.join(" and ") + " have not been read yet"});
  else fact(box, String(esc + ask), "needs you", {cls: esc + ask ? "badc" : "",
    tip: esc + " open escalation" + (esc === 1 ? "" : "s") + " · " + ask + " open question" + (ask === 1 ? "" : "s") + " · everything waiting on a decision"});

  // The machine, the install and the ship time: numbers the operator reads
  // rather than alarms, so each is drawn whatever it says and coloured only
  // when it is one. The strip is the page's only readout of them.
  const m = s.machine || {};
  const cores = navigator.hardwareConcurrency || 8;
  fact(box, m.load1 == null ? "–" : m.load1.toFixed(1), "load",
    {cls: m.load1 == null ? "" : m.load1 > cores * STRIP_ALARM.load_bad_cores ? "badc" : m.load1 > cores * STRIP_ALARM.load_warn_cores ? "warnc" : "",
     tip: "1m load over " + cores + " cores" + (m.load5 == null ? "" : " · 5m " + m.load5.toFixed(1) + " · 15m " + m.load15.toFixed(1)) + " · the Machine pane has the curve"});
  fact(box, sm.behind == null ? "–" : sm.behind === 0 ? "current" : sm.behind + " behind", "vs main",
    {cls: sm.behind == null || sm.behind <= STRIP_ALARM.behind_warn ? "" : "warnc",
     tip: sm.main_tip ? "the installed gt against main " + sm.main_tip + " (" + (sm.installed_gt || "?") + "), as of the install repo's last fetch" : "the installed gt against main, as of the install repo's last fetch"});
  fact(box, sm.median_deploy_min == null ? "–" : Math.round(sm.median_deploy_min) + "m", "to ship",
    {cls: sm.median_deploy_min == null ? "" : "v", tip: "the median dispatch→deploy" + (sm.deploy_waiting ? " · " + sm.deploy_waiting + " landed and awaiting a deploy" : "") + " · the Deploys block has the runs"});
  if (sm.deploy_waiting > 0) fact(box, String(sm.deploy_waiting), "awaiting deploy",
    {tip: "beads that landed and are waiting for their deploy; the Deploys block has the runs"});
}

// The models line opens the seat table and the model-per-role table the strip's
// seats fact carries the counts of, and starts closed so the top of the page is
// one line until somebody asks for the detail. It keeps its own store: the
// panes' folds are keyed by their titles in gt-collapsed (setupCollapse), where
// a stored true means collapsed, and a key of its own needs no reader to invert
// it.
const MODELS_OPEN_KEY = "gt-models-open";
let modelsOpen = false;
try { modelsOpen = localStorage.getItem(MODELS_OPEN_KEY) === "1"; } catch (e) {}
function paintModelsLine() {
  const b = $("models");
  b.textContent = "models " + (modelsOpen ? "▾" : "▸");
  b.setAttribute("aria-expanded", modelsOpen ? "true" : "false");
  $("modelspanel").hidden = !modelsOpen;
}
function toggleModels() {
  modelsOpen = !modelsOpen;
  paintModelsLine();
  try { localStorage.setItem(MODELS_OPEN_KEY, modelsOpen ? "1" : "0"); } catch (e) {}
  renderModelsPanel(state || {});
}

// renderModelsPanel is what the models line opens: each polecat seat with its
// agent, cap and live count, and the model each role runs on with the config
// key it came from. A role whose live setting differs from the town model table
// wears a drift badge naming what the table says. Every field is a fresh read
// of the configs, and one the server could not read says unknown, never a blank
// that looks like a value. A folded line keeps no table in the DOM, and one
// with nothing to open says so in a line.
function renderModelsPanel(s) {
  const box = $("modelspanel");
  if (!modelsOpen) { box.replaceChildren(); return; }
  const m = s.models;
  box.replaceChildren();
  const seats = (m && m.seat_rows) || [], roles = (m && m.roles) || [];
  if (!seats.length && !roles.length) { box.append(el("div", "empty", "no seats and no roles have been read yet")); return; }
  const table = (cols, rows) => {
    const t = el("table"), head = el("tr");
    cols.forEach(([h, num]) => head.append(el("th", num ? "n" : "", h)));
    t.append(head, ...rows);
    return t;
  };
  // Each seat is named as gt pool show names it, and a key this page does not
  // know is shown as the server sent it rather than as some other seat.
  const seatNames = {pool: "pool seat", pro: "pro seat", second: "second seat"};
  const capDefaultWhy = {
    pool: "max_seats is unset: sling leaves the seat uncapped and the dispatcher holds it to ",
    pro: "pro_max is unset: the dispatcher runs the pro seat at its own default of ",
  };
  const seatRows = seats.map(sr => {
    const tr = el("tr");
    const name = el("td", "", seatNames[sr.seat] || sr.seat); name.title = sr.key; tr.append(name);
    tr.append(el("td", sr.closed || sr.unknown ? "title" : "", sr.unknown ? "unknown" : sr.closed ? "closed" : sr.agent));
    const open = !sr.closed && !sr.unknown;
    const c = el("td", "n", open ? (sr.live != null ? sr.live : "–") + "/" + sr.cap + (sr.cap_default ? "*" : "") : "");
    if (sr.cap_default) c.title = (capDefaultWhy[sr.seat] || "the seat's cap is unset and the dispatcher holds it to ") + sr.cap;
    tr.append(c);
    return tr;
  });
  const roleRows = roles.map(rr => {
    const tr = el("tr");
    const role = el("td", "", rr.role); role.title = rr.key; tr.append(role);
    const model = el("td"); model.title = rr.note || rr.key;
    model.append(el("span", rr.model ? "" : "title", rr.model || "unknown"));
    if (rr.drift) {
      const b = el("span", "badge warnc", "drift"); b.title = "the town model table (settings/models.json) says " + rr.drift;
      model.append(document.createTextNode(" "), b);
    }
    tr.append(model);
    return tr;
  });
  box.append(table([["Seat"], ["Agent"], ["Live / cap", 1]], seatRows), table([["Role"], ["Model"]], roleRows));
}

function copyText(text, btn) {
  const ok = () => { const old = btn.textContent; btn.classList.add("done"); btn.textContent = "copied"; setTimeout(() => { btn.classList.remove("done"); btn.textContent = old; }, 1200); };
  const fallback = () => { const t = document.createElement("textarea"); t.value = text; document.body.append(t); t.select(); try { document.execCommand("copy"); ok(); } catch (e) {} t.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
}
const STATE_HELP = {
  working: "holds a bead and its session is producing output",
  gating: "its bead is being gated and om-reviewed by the landing worker",
  queued: "its bead is submitted and waiting to land",
  "needs-human": "its bead is waiting on an operator",
  quiet: "its session has been silent for 10 minutes or more",
  stalled: "has assigned work and no live session: nothing is doing it",
  spawning: "dispatched seconds ago, session not up yet",
  "review-needed": "a live session holding uncommitted or unpushed work",
  recovery: "idle, but its worktree needs recovery before it can be reused",
  parked: "parked by an operator",
  unknown: "tmux could not be read, so this polecat cannot be told apart from a working one",
  idle: "holds nothing"
};
let openIdle = false;
let openParkedRig = false;
// The om panel's Stats and Scores sections start closed and keep the viewer's
// choice across the periodic redraw and a reload, keyed by section name. Storage
// that throws — a locked-down browser, private mode — leaves them closed and
// folding still works for the session.
let openOMStats = false, openOMScores = false;
try {
  const saved = JSON.parse(localStorage.getItem("gt-om-open") || "{}");
  openOMStats = !!(saved && saved.stats);
  openOMScores = !!(saved && saved.scores);
} catch (e) {}
function saveOMOpen() {
  try { localStorage.setItem("gt-om-open", JSON.stringify({stats: openOMStats, scores: openOMScores})); } catch (e) {}
}
// Names for the polecats in view. label() is the short name, because each rig
// draws its polecats from that rig's own name theme, so the name alone places
// the polecat — except a short name that more than one rig uses, which without
// its rig would name none of them. rigOf() is the one rig using a short name,
// so a cell can carry the full rig/name in its title.
function polecatNames(polecats) {
  const rigs = new Map();
  for (const p of polecats || []) {
    if (!p.name) continue;
    let s = rigs.get(p.name);
    if (!s) rigs.set(p.name, s = new Set());
    s.add(p.rig || "");
  }
  return {
    label: (rig, name) => {
      const s = rigs.get(name);
      return name && s && s.size > 1 && rig ? rig + "/" + name : (name || "");
    },
    rigOf: name => { const s = rigs.get(name); return s && s.size === 1 ? [...s][0] : ""; },
  };
}
// One compact line per rig: whether it is parked, and where its work is. A
// count the dashboard could not read says so rather than showing a zero.
function renderRigs(s) {
  const box = $("rigs");
  box.replaceChildren();
  const rows = s.rigs || [];
  // Every row is joined from the queue read the Work queue pane uses, so the two
  // say the same thing about the same numbers (gt-q6h8e).
  const qr = readOf(s, "queue");
  paintsRead(box, $("rigsnote"), qr);
  if (!rows.length) { box.append(el("div", "empty", s.queue ? "no rigs" : "reading…")); $("rigsnote").textContent = ""; return; }
  const t = el("table");
  const hr = el("tr");
  [["Rig"], ["Names", "the name theme this rig draws its polecats from; hover for a few of its names", 0],
   ["State"], ["Seats", "polecats in this rig that hold nothing and are free to take work", 1],
   ["Ready", "beads in this rig open with nothing blocking them", 1],
   ["Landing", "beads in this rig submitted and waiting to land", 1]].forEach(([h, tip, num]) => {
    const th = el("th", num ? "n" : "", h);
    if (tip) th.title = tip;
    hr.append(th);
  });
  t.append(hr);
  const cell = v => { const td = el("td", "n" + (v == null ? " title" : ""), v == null ? "unavailable" : String(v)); if (v == null) td.title = "the dashboard could not read this"; return td; };
  // The theme names the pool a rig's polecats come from, and its samples are
  // the names themselves, so the rig a short name belongs to can be looked up
  // here.
  const themeCell = r => {
    const td = el("td", "title", r.theme || "–");
    if (r.theme) td.title = (r.names || []).length ? r.theme + ": " + r.names.join(", ") : r.theme;
    else td.title = "this rig's polecat names are an explicit list: it has no name theme";
    return td;
  };
  for (const r of rows) {
    const tr = el("tr");
    tr.append(el("td", "", r.name), themeCell(r));
    const st = el("td");
    const badge = el("span", "badge st-" + (r.parked ? "parked" : "working"), r.parked ? "parked" : "active");
    if (r.parked) badge.title = "stood down by an operator: the dispatcher does not serve it";
    st.append(badge);
    tr.append(st, cell(r.seats), cell(r.ready), cell(r.landing));
    t.append(tr);
  }
  box.append(t);
  const parked = rows.filter(r => r.parked).length;
  const at = s.queue && s.queue.at;
  $("rigsnote").textContent = readCaption(qr, [rows.length + " rigs" + (parked ? " · " + parked + " parked" : ""), at ? "read " + age(at) + " ago" : null]);
}
function renderSeats(s) {
  const box = $("seats");
  box.replaceChildren();
  const pcs = s.polecats || [];
  const r = readOf(s, "seats");
  paintsRead(box, $("seatsnote"), r);
  if (!pcs.length) {
    // An empty list is a town with no polecats only when the seats actually
    // read. A read that failed says unavailable, never "no polecats" (gt-q6h8e).
    const why = r && r.stale ? "unavailable — the seats read failed or went stale" : s.summary ? "no polecats" : "reading…";
    box.append(el("div", "empty", why));
    $("seatsnote").textContent = "";
    return;
  }

  const by = {};
  pcs.filter(p => !p.rig_parked).forEach(p => by[p.state] = (by[p.state] || 0) + 1);
  const parkedCount = pcs.filter(p => p.rig_parked).length;
  const sum = el("div", "kv");
  ["needs-human", "unknown", "stalled", "review-needed", "recovery", "quiet", "working", "spawning", "gating", "queued", "parked", "idle"].forEach(k => {
    if (!by[k]) return;
    const x = el("div"); x.title = STATE_HELP[k];
    x.append(el("b", "st-" + k, String(by[k])), el("span", "", k));
    sum.append(x);
  });
  if (parkedCount) { const x = el("div"); x.title = "polecats in parked rigs: stood down on purpose, not counted above"; x.append(el("b", "st-parked", String(parkedCount)), el("span", "", "in parked rigs")); sum.append(x); }
  box.append(sum);

  const busy = pcs.filter(p => p.state !== "idle" && !p.rig_parked);
  const parkedRigPcs = pcs.filter(p => p.rig_parked).sort((x, y) => (x.state === "idle") - (y.state === "idle") || (x.rig + x.name).localeCompare(y.rig + y.name));
  const idle = pcs.filter(p => p.state === "idle" && !p.rig_parked).sort((x, y) => (y.landed_24h - x.landed_24h) || (x.rig + x.name).localeCompare(y.rig + y.name));
  const now = Date.now();
  const names = polecatNames(pcs);
  // The short name places the polecat; the full rig/name stays on the cell.
  const nameCell = p => { const td = el("td", "", names.label(p.rig, p.name)); td.title = p.rig + "/" + p.name; return td; };
  // The three right-hand columns are the polecat's last 24 hours of landings.
  const R = [
    ["Landed", "beads this polecat landed in the last 24 hours", p => p.landed_24h ? String(p.landed_24h) : "–"],
    ["om ok", "share of those landings om approved (the rest landed without a review or after an error)", p => p.landed_24h ? Math.round(p.approved_24h / p.landed_24h * 100) + "%" : "–"],
    ["Score", "average om score on its approved landings", p => p.avg_score_24h != null ? p.avg_score_24h.toFixed(2) : "–"],
  ];
  const head = cols => { const hr = el("tr"); cols.forEach(([h, tip, num]) => { const th = el("th", num ? "n" : "", h); if (tip) th.title = tip; hr.append(th); }); return hr; };
  const rightCells = (tr, p) => R.forEach(([, , f]) => tr.append(el("td", "n", f(p))));
  const busyTable = list => {
    const t = el("table");
    t.append(head([["Polecat"], ["State"], ["Model", "the agent this polecat's session was started with"], ["Bead"], ["On it", "time since the bead was dispatched", 1], ["Quiet", "time since its session last printed anything", 1], ...R.map(r => [r[0], r[1], 1])]));
    for (const p of list) {
      const tr = el("tr");
      tr.append(nameCell(p));
      const st = el("td"); const badge = el("span", "badge st-" + p.state, p.state); badge.title = (STATE_HELP[p.state] || "") + (p.reason && p.bead ? " — " + p.reason : ""); st.append(badge); tr.append(st);
      tr.append(el("td", p.agent ? "" : "title", p.agent || (p.has_session ? "–" : "")));
      const bd = el("td");
      if (p.bead) {
        bd.append(el("span", "bead", p.bead));
        if (p.priority != null) bd.append(document.createTextNode(" "), el("span", "tag p" + Math.min(p.priority, 4), "P" + p.priority));
        (p.labels || []).forEach(l => bd.append(document.createTextNode(" "), el("span", "tag warnc", l)));
        if (p.title) bd.append(document.createElement("br"), el("span", "title", p.title));
      } else bd.append(el("span", "title", p.reason || "–"));
      if ((p.hints || []).length) {
        bd.append(document.createElement("br"));
        p.hints.forEach(h => { const b = el("button", "cmd", h); b.title = "copy (the dashboard never runs it)"; b.onclick = () => copyText(h, b); bd.append(b); });
      }
      tr.append(bd);
      const on = p.slung ? (now - new Date(p.slung).getTime()) / 1000 : null;
      tr.append(el("td", "n" + (on > 5400 ? " warnc" : ""), p.bead ? (on == null ? "–" : fmtDur(on)) : ""));
      const q = p.last_active ? (now - new Date(p.last_active).getTime()) / 1000 : null;
      tr.append(el("td", "n" + (q != null && q >= 600 ? " warnc" : ""), p.bead ? (p.state === "unknown" ? "?" : p.has_session ? fmtDur(q) : "no session") : ""));
      rightCells(tr, p);
      t.append(tr);
    }
    return t;
  };
  const idleTable = list => {
    const t = el("table");
    t.append(head([["Polecat"], ...R.map(r => [r[0], r[1], 1])]));
    for (const p of list) { const tr = el("tr"); tr.append(nameCell(p)); rightCells(tr, p); t.append(tr); }
    return t;
  };
  if (busy.length) box.append(busyTable(busy));
  if (parkedRigPcs.length) {
    const d = document.createElement("details");
    d.open = openParkedRig;
    d.ontoggle = () => { openParkedRig = d.open; };
    d.append(el("summary", "title", parkedRigPcs.length + " in parked rigs (stood down on purpose; not alerts)"), busyTable(parkedRigPcs));
    box.append(d);
  }
  if (idle.length) {
    const d = document.createElement("details");
    d.open = openIdle;
    d.ontoggle = () => { openIdle = d.open; };
    d.append(el("summary", "title", idle.length + " idle (free to take work) · last 24h landings on the right"), idleTable(idle));
    box.append(d);
  }
  $("seatsnote").textContent = s.summary_at ? readCaption(r, ["read " + age(s.summary_at) + " ago"]) : "";
}

function spark(points, w, h, color) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 " + w + " " + h);
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("class", "spark");
  if (points.length < 2) return svg;
  const max = Math.max(...points, 1);
  const d = points.map((v, i) => (i / (points.length - 1) * w).toFixed(1) + "," + (h - 2 - v / max * (h - 6)).toFixed(1)).join(" ");
  const pl = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
  pl.setAttribute("points", d); pl.setAttribute("fill", "none"); pl.setAttribute("stroke", color); pl.setAttribute("stroke-width", "1.5");
  svg.append(pl);
  return svg;
}

const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
// chartSVG draws one or more time series. A null value breaks the line, so a
// gap in the data is a gap in the drawing, not a line across it.
function chartSVG(series, x0, x1, w, h, gapMs) {
  gapMs = gapMs || 45 * 60e3;   // a quiet spell is a gap, not a slope between two landings
  const svg = svgEl("svg", {viewBox: "0 0 " + w + " " + h, preserveAspectRatio: "none", class: "chart"});
  let max = 0;
  for (const s of series) for (const p of s.pts) if (p.v != null && p.v > max) max = p.v;
  if (max <= 0) return svg;
  const span = Math.max(1, x1 - x0);
  const X = t => (Math.min(Math.max(t, x0), x1) - x0) / span * (w - 6) + 3;
  const Y = v => h - 4 - v / max * (h - 10);
  series.forEach(s => {
    let run = [];
    const flush = () => {
      if (run.length > 1) svg.append(svgEl("polyline", {points: run.join(" "), fill: "none", stroke: s.color, "stroke-width": "1.2", "stroke-opacity": "0.8"}));
      run = [];
    };
    let prev = null;
    for (const p of s.pts) {
      if (p.v == null) { flush(); prev = null; continue; }
      if (prev != null && p.t - prev > gapMs) flush();
      const x = X(p.t).toFixed(1), y = Y(p.v).toFixed(1);
      run.push(x + "," + y);
      svg.append(svgEl("circle", {cx: x, cy: y, r: "1.4", fill: s.color}));
      prev = p.t;
    }
    flush();
  });
  return svg;
}
function legend(items) {
  const d = el("div", "legend");
  for (const [color, label] of items) {
    const x = el("span");
    const sw = el("i", "sw"); sw.style.background = color;
    x.append(sw, document.createTextNode(label));
    d.append(x);
  }
  return d;
}
function median(xs) {
  const v = xs.filter(x => x != null).sort((a, b) => a - b);
  if (!v.length) return null;
  const m = Math.floor(v.length / 2);
  return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
}

// Four evenly spaced time labels and "now", under a chart that spans t0..t1.
function timeAxis(t0, t1) {
  const hhmm = ms => new Date(ms).toLocaleTimeString([], {hour12: false}).slice(0, 5);
  const a = el("div", "axis");
  for (let i = 0; i < 4; i++) a.append(el("span", "", hhmm(t0 + i * (t1 - t0) / 4)));
  a.append(el("span", "", "now"));
  return a;
}

// backoffDetail is a failing landing's run of failures, its next retry and the
// last error's first line.
function backoffDetail(r) {
  const parts = [(r.failures || 0) + " in a row"];
  if (r.next_try) {
    const inSecs = (new Date(r.next_try) - Date.now()) / 1000;
    parts.push(inSecs > 0 ? "next try in " + fmtDur(inSecs) : "retrying now");
  }
  if (r.detail) parts.push(r.detail);
  return parts.join(" · ");
}

// The beads waiting for the landing worker as rows, oldest wait first: the
// Queue reader's landing list, so a bead submitted with gt done shows in the
// pane that watches landings. A bead the worker has already taken has a live
// row below, so it is dropped here — the live row wins (gt-zc45r).
const QUEUED_LANDING_MAX = 10;
function queuedLandings(s, rows) {
  const waiting = (s.queue && s.queue.landing) || [];
  const taken = new Set((rows || []).map(r => r.bead));
  const since = b => b.updated_at ? new Date(b.updated_at).getTime() : 0;
  return waiting.filter(b => !taken.has(b.id)).sort((a, b) => since(a) - since(b));
}

// A queued bead's holder is its assignee: one naming a polecat by its store
// ("rig/polecats/name") is shown the way the By column shows a holder, and any
// other assignee is shown as it was written.
function queueHolder(b) {
  const m = /^([^/]+)\/polecats\/([^/]+)$/.exec(b.assignee || "");
  return m ? {rig: m[1], name: m[2]} : {rig: "", name: b.assignee || ""};
}

function renderTrend(s) {
  const sec = $("trendsec"), box = $("trend");
  const t = s.trend;
  const hours = (t && t.hours) || [];
  const recent = (t && t.recent) || [];
  // A bead waiting for the worker has no row of its own in the trend: nothing
  // has landed. It comes from the Queue reader's list, and a queue alone is
  // reason to show the section (gt-zc45r).
  const waiting = queuedLandings(s, recent);
  if (!hours.length && !waiting.length) { sec.hidden = true; box.replaceChildren(); return; }
  sec.hidden = false;
  box.replaceChildren();
  const names = polecatNames(s.polecats);
  // Nothing has landed in the window: the pane is the queue alone, rather than
  // the day's figures and charts drawn from a reading nobody has made yet.
  if (!hours.length) {
    $("trendnote").textContent = "";
    const q = landingTable(s, names, recent, waiting);
    if (q) box.append(q);
    return;
  }
  const hhmm = iso => new Date(iso).toLocaleTimeString([], {hour12: false}).slice(0, 5);
  const t0 = new Date(hours[0].hour).getTime();
  const t1 = new Date(hours[hours.length - 1].hour).getTime() + 3600e3;
  const stages = t.stages || [];
  const landed = hours.reduce((n, h) => n + h.landed, 0);
  const rejected = hours.reduce((n, h) => n + h.rejected, 0);
  $("trendnote").textContent = landed + " landed · " + rejected + " rejected";

  // the day in numbers
  const kv = el("div", "kv");
  const add = (v, k, tip, cls) => { const x = el("div"); if (tip) x.title = tip; x.append(el("b", cls || "", v), el("span", "", k)); kv.append(x); };
  add(String(landed), "landed");
  add(String(rejected), "rejected", "rejections in the last 24 hours, whatever the reason", rejected ? "warnc" : "");
  const attempts = landed + rejected;
  if (attempts) add(Math.round(landed / attempts * 100) + "%", "first-pass", "landings as a share of landing attempts (landed + rejected)");
  const mg = median(stages.map(p => p.gate_secs)), mo = median(stages.map(p => p.om_secs));
  const mt = median(stages.map(p => p.lint_secs + p.gate_secs + (p.om_secs || 0)));
  if (mg != null) add(fmtDur(mg), "median gate");
  if (mo != null) add(fmtDur(mo), "median om");
  if (mt != null) add(fmtDur(mt), "median total", "lint + gate + om, per landing");
  const slow = stages.length ? Math.max(...stages.map(p => p.lint_secs + p.gate_secs + (p.om_secs || 0))) : null;
  if (slow != null) add(fmtDur(slow), "slowest", "the longest landing in the window", slow > 600 ? "warnc" : "");
  box.append(kv);

  // landings per hour: the blue part landed, the red part is rejections
  const max = Math.max(1, ...hours.map(h => h.landed + h.rejected));
  const bars = el("div", "hbars");
  for (const h of hours) {
    const col = el("div", "hbar");
    col.title = hhmm(h.hour) + " · " + h.landed + " landed" + (h.rejected ? " · " + h.rejected + " rejected" : "") + (h.load_avg != null ? " · load " + h.load_avg.toFixed(1) : "");
    if (h.rejected) { const r = el("i", "hrej"); r.style.height = h.rejected / max * 100 + "%"; col.append(r); }
    if (h.landed) { const l = el("i", "hok"); l.style.height = h.landed / max * 100 + "%"; col.append(l); }
    bars.append(col);
  }
  box.append(el("div", "k title", "landings per hour, red = rejected"), bars, timeAxis(t0, t1));

  // gate and om seconds per landing: dots are landings, lines join neighbours but not across a quiet spell
  if (stages.length) {
    const hasOM = stages.some(p => p.om_secs != null);
    const series = [{color: "#d29922", pts: stages.map(p => ({t: new Date(p.at).getTime(), v: p.gate_secs}))}];
    const key = [["#d29922", "gate"]];
    if (hasOM) {
      series.push({color: "#39c5bb", pts: stages.map(p => ({t: new Date(p.at).getTime(), v: p.om_secs}))});
      key.push(["#39c5bb", "om"]);
    }
    const peak = Math.max(...series.flatMap(x => x.pts.map(p => p.v == null ? 0 : p.v)));
    box.append(el("div", "k title", "gate and om time per landing · peak " + fmtDur(peak)), chartSVG(series, t0, t1, 600, 56), timeAxis(t0, t1), legend(key));
  } else box.append(el("div", "empty", "no stage lines in the last 24 hours"));

  // hourly load average (recorded only while a page is open)
  const loads = hours.filter(h => h.load_avg != null).map(h => ({t: new Date(h.hour).getTime() + 1800e3, v: h.load_avg}));
  if (loads.length) {
    const peak = Math.max(...loads.map(p => p.v));
    box.append(el("div", "k title", "hourly load average · peak " + peak.toFixed(1) + " · " + loads.length + " of 24 hours recorded (only while a page is open)"), chartSVG([{color: "#58a6ff", pts: loads}], t0, t1, 600, 44, 90 * 60e3), timeAxis(t0, t1));
  } else box.append(el("div", "empty", "no load history yet (it fills while a page is open)"));

  const tbl = landingTable(s, names, recent, waiting);
  if (tbl) box.append(tbl);
}

// The Landings table: waiting-to-land beads first, then the rows the worker
// holds, then the day's finished ones. Null when there is nothing to draw.
// Every cell goes through el(), which writes textContent, so a bead's own text
// is never markup.
function landingTable(s, names, rows, waiting) {
  const shown = waiting.slice(0, QUEUED_LANDING_MAX);
  const more = waiting.length - shown.length;
  if (!shown.length && !rows.length) return null;
  const wrap = el("div");
  const thr = s.om && s.om.threshold != null ? s.om.threshold : null;
  const tbl = el("table", "ltable");
  const hr = el("tr");
  [["When"], ["Landing"], ["By", "who built it: the polecat, or the crew member whose branch it was"], ["Score", "om's score", 1], ["Gate", "wall time of the gate stage", 1], ["om", "wall time of the om review", 1], ["Ship", "total ship time in minutes: dispatched to deployed, which is the staging deploy for an app rig and the daemon restart for gastown", 1]].forEach(([h, tip, num]) => { const th = el("th", num ? "n" : "", h); if (tip) th.title = tip; hr.append(th); });
  tbl.append(hr);
  const today = new Date().toDateString();
  // No stage has run yet, so the four cost columns are dashes and the wait is
  // aged from the bead's last update — the label write gt done makes is
  // normally its last write. The worker's order is not known to this page, so a
  // row says waiting and nothing about position.
  for (const b of shown) {
    const tr = el("tr");
    const when = el("td", "title", b.updated_at ? "waiting " + age(b.updated_at) : "waiting");
    when.title = "waiting since the bead's last update, which gt done moves";
    tr.append(when);
    const main = el("td");
    main.append(el("span", "bead", b.id));
    const tag = el("span", "tag", "queued");
    tag.title = "submitted; the landing worker has not taken it yet";
    main.append(document.createTextNode(" "), tag);
    if (b.title) main.append(document.createElement("br"), el("span", "title", (b.rig ? b.rig + " · " : "") + b.title));
    tr.append(main);
    const h = queueHolder(b);
    const by = el("td", "title");
    if (h.name) { by.textContent = names.label(h.rig, h.name); by.title = h.rig ? h.rig + "/" + h.name : h.name; }
    else by.textContent = "–";
    tr.append(by, el("td", "n", "–"), el("td", "n", "–"), el("td", "n", "–"), el("td", "n", "–"));
    tr.title = "submitted and waiting for the landing worker to take it";
    tbl.append(tr);
  }
  for (const r of rows) {
    const tr = el("tr");
    const when = new Date(r.at);
    if (r.outcome === "running") tr.className = "live";
    tr.append(el("td", "title", r.outcome === "running" ? "merging " + fmtDur((Date.now() - when.getTime()) / 1000) : r.outcome === "backoff" ? "checked " + clock(r.at).slice(0, 5) : (when.toDateString() === today ? clock(r.at).slice(0, 5) : when.toLocaleDateString([], {month: "short", day: "numeric"}) + " " + clock(r.at).slice(0, 5))));
    const main = el("td");
    main.append(el("span", "bead", r.bead));
    if (r.outcome === "running") { const g = el("span", "tag live", "running"); g.title = "merged; the worker is gating the merged tree and running the om review"; main.append(document.createTextNode(" "), g); }
    else if (r.outcome === "rejected") { const g = el("span", "tag badc", "rejected · " + (r.kind || "?")); main.append(document.createTextNode(" "), g); }
    else if (r.outcome === "backoff") { const g = el("span", "tag badc", "failing · " + (r.stage || "?")); g.title = "the landing worker keeps retrying this landing and losing; the stage is where the last attempt failed"; main.append(document.createTextNode(" "), g); }
    else if (r.verdict === "skipped") main.append(document.createTextNode(" "), el("span", "tag", "no review"));
    else if (r.verdict === "error") { const g = el("span", "tag warnc", "om error"); g.title = r.detail || ""; main.append(document.createTextNode(" "), g); }
    if (r.risk) { const g = el("span", "warnc", " ⚑"); g.title = "touched risk paths"; main.append(g); }
    if (r.title) main.append(document.createElement("br"), el("span", "title", r.title));
    if (r.outcome === "rejected" && r.detail) main.append(document.createElement("br"), el("span", "badc", r.detail));
    if (r.outcome === "backoff") main.append(document.createElement("br"), el("span", "badc", backoffDetail(r)));
    const total = (r.lint_secs || 0) + (r.gate_secs || 0) + (r.om_secs || 0);
    tr.title = [r.commit ? "commit " + r.commit : null, total ? "lint " + fmtDur(r.lint_secs || 0) + " + gate " + fmtDur(r.gate_secs || 0) + " + om " + fmtDur(r.om_secs || 0) + " = " + fmtDur(total) : null, r.route ? "route " + r.route : null].filter(Boolean).join(" · ");
    tr.append(main);
    // By names the holder the way the seats pane does: the short name, and
    // its rig only where two rigs in view use that name. The row's own rig
    // is the holder's for a live run; for a finished one it is read back from
    // the polecat roster, so a shared short name still gets its rig.
    const who = r.polecat || (r.route ? r.route.replace(/^overseer-/, "") : "");
    const rig = r.rig || names.rigOf(who);
    const by = el("td", "title");
    if (who) { by.textContent = names.label(rig, who); by.title = rig ? rig + "/" + who : who; }
    else if (r.outcome === "running" && r.rig) by.textContent = r.rig;
    else by.textContent = "–";
    tr.append(by);
    tr.append(el("td", "n" + (r.score != null && thr != null && r.score < thr ? " badc" : ""), r.score != null ? r.score.toFixed(2) : "–"));
    tr.append(el("td", "n" + (r.gate_secs > 180 ? " warnc" : ""), r.gate_secs != null ? fmtDur(r.gate_secs) : "–"));
    tr.append(el("td", "n" + (r.om_secs > 240 ? " warnc" : ""), r.om_secs != null ? fmtDur(r.om_secs) : "–"));
    const ship = el("td", "n" + (r.ship_pending ? " warnc" : ""));
    const appRig = r.ship_via === "staging";
    if (r.ship_secs != null) { ship.textContent = Math.round(r.ship_secs / 60) + "m"; ship.title = appRig ? "dispatched to staging deployed" : "dispatched to deployed"; }
    else if (r.ship_failed) { ship.textContent = "staging failed"; ship.title = "the staging run that covers this landing failed: " + (r.ship_run_state || "failed"); }
    else if (r.ship_pending) { ship.textContent = "pending"; ship.title = appRig ? "landed; waiting for the staging deploy" : "landed; waiting for the restart that installs it"; }
    else ship.textContent = "–";
    tr.append(ship);
    tbl.append(tr);
  }
  wrap.append(el("div", "k title", "landings: waiting to land first, then the ones running now and the ones failing in backoff, then the last 10 finished (newest first; hover a row for the commit and stage times)"), tbl);
  if (more) wrap.append(el("div", "empty", "and " + more + " more waiting to land — see the Queue pane's “Waiting to land” tab"));
  return wrap;
}

function renderMachine(s) {
  const box = $("machine");
  box.replaceChildren();
  const r = readOf(s, "machine");
  paintsRead(box, $("machnote"), r);
  const m = s.machine || {};
  const loads = (s.loads || []).map(p => p.load);
  box.append(spark(loads, 400, 56, "#58a6ff"));
  const note = loads.length > 1 ? "load, last " + fmtDur((new Date(s.loads[s.loads.length - 1].at) - new Date(s.loads[0].at)) / 1000) : "";
  $("machnote").textContent = readCaption(r, [note, r && r.ageSec != null ? "read " + fmtDur(r.ageSec) + " ago" : null]);
  if (r && r.stale) box.append(el("div", "empty " + (r.error ? "badc" : "warnc"), r.error ? "the machine read failed; this is the last reading" : "this reading is stale"));
  const top = m.top || [];
  if (top.length) {
    const t = el("table");
    for (const p of top) { const tr = el("tr"); tr.append(el("td", "", p.name), el("td", "n", p.cpu >= 100 ? (p.cpu / 100).toFixed(1) + " cores" : p.cpu.toFixed(0) + "%")); t.append(tr); }
    box.append(el("div", "k title", "busiest processes"), t);
  }
}

// The Cloud panel draws what the reader stripped and capped out of another
// account's report. Every cell goes through el(), which writes textContent, so
// a Detail holding an HTML tag shows as that text and never as markup. A
// finding is one line — severity, kind, resource, then as much of the Detail as
// the line holds — and opening the row shows the whole Detail under it. The
// opened rows live in cloudOpen, so the refresh that redraws the list leaves
// them open (gt-1hob8).
const CLOUD_SEV = {urgent: "sev-critical", normal: "sev-medium", low: "sev-low"};
const cloudOpen = new Set();
// A finding carries no id of its own, so a row is keyed by its own text. The
// reader strips control runes, so the separator cannot appear inside a key.
const findingID = f => [f.project, f.resource, f.kind, f.detail].join("\u0000");

// The pane's header note: the patrol's own state, and a fresh run's failures
// beside it, so the operator reads one line rather than two.
function cloudNote(c, checks) {
  const parts = [c.note || c.state || ""];
  if (checks && checks.state === "fresh" && checks.failed > 0) {
    parts.push(checks.failed + (checks.failed === 1 ? " check failing" : " checks failing"));
  }
  return parts.filter(Boolean).join(" · ");
}

// The checks line: the cloud-check plugin's latest run, above the patrol's
// findings. A missing file draws nothing at all (the plugin may not be
// installed), an unreadable or misshapen one draws one dim line, a run older
// than the plugin's own interval draws as stale in the amber, and a fresh run
// draws its counts with the failures and warnings under it. The line's colour
// follows the worst level it carries, and a stale run's items are not drawn,
// since they are no longer current. The status is another process's file, so
// every string goes through el(), which writes textContent and never markup.
function drawCloudChecks(box, checks) {
  if (!checks) return;
  if (checks.state === "error") { box.append(el("div", "empty", "cloud checks: unreadable")); return; }
  if (checks.state !== "fresh") {
    box.append(el("div", "ccheck warnc", "cloud checks: last ran " + age(checks.at) + " ago (not running?)"));
    return;
  }
  const worst = checks.failed > 0 ? "badc" : (checks.warnings > 0 ? "warnc" : "");
  const counts = [checks.ok + " ok", checks.warnings + " warning" + (checks.warnings === 1 ? "" : "s"), checks.failed + " failed"];
  box.append(el("div", "ccheck" + (worst ? " " + worst : ""), "checks: " + counts.join(" · ") + " · " + age(checks.at) + " ago"));
  for (const it of checks.items || []) {
    const row = el("div", "ccrow");
    if (it.section) row.append(el("span", "ccsection", it.section));
    row.append(el("span", "cctext " + (it.level === "fail" ? "badc" : "warnc"), it.text || ""));
    box.append(row);
  }
}

// The app power line: one row per app, drawn above the patrol's findings so the
// operator reads which apps are off before what the patrol found. An app that is
// off takes the amber and one the reader could not place the red, so neither
// reads as on; the markers and ledgers are other accounts' files, so every cell
// goes through el(), which writes textContent and never markup.
function appPowerState(a) {
  if (a.state === "on") return "on";
  if (a.state === "off") return "off (" + (a.env || a.note || "unreadable marker") + ")";
  return "unknown (" + (a.note || "unreadable") + ")";
}

function drawAppPower(box, p) {
  if (!p) return;
  if (!p.apps || !p.apps.length) { box.append(el("div", p.note ? "badc" : "empty", p.note ? "app power: unknown (" + p.note + ")" : "app power: no apps")); return; }
  for (const a of p.apps) {
    const row = el("div", "apow");
    row.append(el("span", "apname title", a.app), el("span", "apstate " + (a.state === "on" ? "" : a.state === "off" ? "warnc" : "badc"), appPowerState(a)));
    if (a.state === "off" && a.since) {
      const who = [a.since ? "since " + age(a.since) + " ago" : "", a.by ? "by " + a.by : "", a.reason || ""].filter(Boolean);
      const why = el("span", "aptext", who.join(" · "));
      why.title = a.since ? new Date(a.since).toLocaleString() : "";
      row.append(why);
    }
    const rel = a.release;
    if (rel) row.append(el("span", "aprel", "last: " + [rel.at ? age(rel.at) + " ago" : "", rel.action || "", rel.reason || ""].filter(Boolean).join(" ")));
    else if (a.release_note) row.append(el("span", "aprel badc", "ledger: " + a.release_note));
    box.append(row);
  }
  if (p.more) box.append(el("div", "empty", "and " + p.more + " more apps"));
}

function renderCloud(s) {
  const box = $("cloud"), note = $("cloudnote");
  box.replaceChildren();
  const c = s.cloud;
  if (!c) { note.className = "r"; note.textContent = ""; box.append(el("div", "empty", "reading…")); return; }
  // The checks line is drawn first and whatever the patrol's own state is: the
  // checks cover what the patrol cannot see, so a missing patrol report must
  // not hide them.
  const checks = c.checks;
  drawCloudChecks(box, checks);
  drawAppPower(box, c.apps);
  // The reader names the state — fresh, overdue, the error that stopped it, or
  // why there is no report — and overdue and error take the amber the page
  // already marks a stale reading with. A fresh run with failures adds its own
  // word to the same line, in the same amber.
  const stale = c.state === "overdue" || c.state === "error";
  const failing = checks && checks.state === "fresh" && checks.failed > 0;
  note.className = (stale || failing) ? "r warnc" : "r";
  note.textContent = cloudNote(c, checks);
  if (c.state === "missing" || c.state === "error") { box.append(el("div", c.state === "error" ? "badc" : "empty", c.note || c.state)); return; }
  const projects = c.projects || [];
  // One header line: the run, then the counts over the whole report beside it,
  // the zero counts left out. The projects the run watched ride the line's
  // title, so naming them costs no width.
  const head = el("div", "chead");
  head.title = projects.length ? projects.join(", ") : "no projects in the report";
  head.append(el("span", "title", "last run " + age(c.last_run) + " ago · " + projects.length + (projects.length === 1 ? " project" : " projects")));
  const counts = c.counts || {};
  const chips = el("span", "cchips");
  [["urgent", counts.urgent || 0], ["normal", counts.normal || 0], ["low", counts.low || 0]].forEach(([k, n]) => {
    if (n) chips.append(el("span", "tag " + (CLOUD_SEV[k] || "sev-low"), n + " " + k));
  });
  // A severity the patrol does not write yet is still a finding: count it
  // rather than dropping it.
  if (counts.other) chips.append(el("span", "tag sev-low", counts.other + " other"));
  if (chips.children.length) head.append(chips);
  box.append(head);
  if (!c.total) { box.append(el("div", "empty", "no findings")); return; }
  const findings = c.findings || [];
  // The project column is dropped when one project owns every finding — the
  // header already names it — and otherwise rides the resource as a dim prefix
  // that never takes a line of its own.
  const multi = new Set(findings.map(f => f.project || "")).size > 1;
  for (const f of findings) {
    const id = findingID(f);
    const open = cloudOpen.has(id);
    const row = el("button", "crow");
    row.setAttribute("aria-expanded", open ? "true" : "false");
    row.title = f.detail || "";
    const sev = el("span", "tag esc " + (CLOUD_SEV[f.severity] || "sev-low"), f.severity || "–");
    if (f.observed_at) sev.title = "observed " + new Date(f.observed_at).toLocaleString();
    row.append(sev, el("span", "ckind title", f.kind || "–"));
    const res = el("span", "cres");
    if (multi && f.project) res.append(el("span", "cproj title", f.project));
    res.append(el("span", "cname", f.resource || "–"));
    row.append(res, el("span", "cdetail", f.detail || ""));
    row.onclick = () => { open ? cloudOpen.delete(id) : cloudOpen.add(id); renderCloud(state); };
    box.append(row);
    if (open) box.append(el("div", "cfull", f.detail || ""));
  }
  if (c.more) box.append(el("div", "empty", "and " + c.more + " more"));
}

// The bead ids the reader has opened in the report, and what opening one read,
// keyed "rig/id" the way the Work queue keys its own opens.
const rOpen = new Set();
const rDetail = {};
let rKey = "";
// The earlier report the reader chose, by the name its file carries, and what
// fetching it read. The pane shows the latest until a reader picks one and
// keeps their choice across a poll refresh, so the report being read does not
// fall back to the latest under them.
let rPick = "";
const rRead = {};

// A bead id as the overseer writes one: a lowercase prefix, a hyphen, then the
// bead's own id. A word like "re-run" has this shape too, so the shape alone is
// not enough to link it — its prefix must also name a store the page carries.
const BEAD_TOKEN = /^[a-z][a-z0-9]*-[a-z0-9][a-z0-9.]*$/;
// The characters a bead id is written with, so the report's text is scanned for
// runs that might be one and everything between them stays the text it is.
const BEAD_RUN = /[a-z0-9][a-z0-9.-]*/g;

// reportNodes is the report's text as nodes: every run that is a bead id whose
// prefix names a store becomes a button that opens that bead, and every other
// run stays plain text. Nothing here parses markup — the button carries the id
// through el(), which writes textContent, and the rest is a text node — so a tag
// written in the report is shown as that text and no element is created for it.
function reportNodes(text, prefixes) {
  const s = String(text || ""), map = prefixes || {}, out = [];
  let last = 0, plain = "", m;
  const flush = () => { if (plain) { out.push(document.createTextNode(plain)); plain = ""; } };
  BEAD_RUN.lastIndex = 0;
  while ((m = BEAD_RUN.exec(s))) {
    const part = m[0];
    plain += s.slice(last, m.index);
    last = m.index + part.length;
    // A sentence's full stop is not the id's (gt-1h5gx): the dots that trail a
    // run are cut before the id is tested and linked, and put back as the plain
    // text they are. A dot inside the id — dv-1fel.4 — is the id's own.
    const id = part.replace(/\.+$/, "");
    const dash = id.indexOf("-");
    const p = dash > 0 ? id.slice(0, dash) : "";
    // A prefix off Object.prototype ("constructor") is not a store's.
    const rig = p && Object.prototype.hasOwnProperty.call(map, p) ? map[p] : "";
    if (!rig || !BEAD_TOKEN.test(id)) { plain += part; continue; }
    flush();
    const b = el("button", "rbead", id);
    b.type = "button";
    b.title = "open " + rig + "/" + id;
    b.onclick = () => openReportBead(rig, id);
    out.push(b);
    plain += part.slice(id.length);
  }
  plain += s.slice(last);
  flush();
  return out;
}

// openReportBead opens or closes a bead written in the report: the detail draws
// under the report, and a second click on the id takes it away.
function openReportBead(rig, id) {
  const key = rig + "/" + id;
  if (rOpen.has(key)) { rOpen.delete(key); renderReports(state); return; }
  rOpen.add(key);
  beadDetailFor(rig, id, rDetail, () => renderReports(state));
  renderReports(state);
}

// reportFile is the name a report's file carries: the UTC instant of its write
// in the shape the reader lists, which is also what /api/report reads one by.
function reportFile(t) {
  const d = new Date(t), p = n => String(n).padStart(2, "0");
  return d.getUTCFullYear() + p(d.getUTCMonth() + 1) + p(d.getUTCDate()) + "T" + p(d.getUTCHours()) + p(d.getUTCMinutes()) + p(d.getUTCSeconds()) + "Z";
}

// reportTime is the instant a report's name carries: the shape reportFile
// writes, read back into the date the pane dates the shown report by.
function reportTime(name) {
  return new Date(name.slice(0, 4) + "-" + name.slice(4, 6) + "-" + name.slice(6, 8) + "T" + name.slice(9, 11) + ":" + name.slice(11, 13) + ":" + name.slice(13, 15) + "Z");
}

// openReport draws an earlier report in place of the latest. The route returns
// the report's text or nothing, and a fetch that failed is remembered as the
// failure it was; a report already read is not fetched twice.
function openReport(name) {
  rPick = name;
  if (!rRead[name]) {
    rRead[name] = {loading: true};
    fetch("/api/report?name=" + encodeURIComponent(name))
      .then(res => res.ok ? res.json() : Promise.reject(new Error(String(res.status))))
      .then(d => { rRead[name] = {text: d.text || ""}; renderReports(state); })
      .catch(() => { rRead[name] = {error: true}; renderReports(state); });
  }
  renderReports(state);
}

// showLatest returns the pane to the latest report, the one the hub polls.
function showLatest() { rPick = ""; renderReports(state); }

// The Report panel draws the overseer's own hourly report: the latest one the
// hub polled, or, once a reader has chosen from the list, an earlier one. Every
// cell goes through el(), which writes textContent, so a tag in the report
// shows as that text and never as markup. The report's own line breaks and tabs
// are kept and the box wraps them, so the pane shows the report the way its
// writer shaped it.
//
// A bead id in the report opens that bead under the report — the same detail
// the Work queue's rows draw — so an id never has to be copied into a terminal.
//
// The pane dates that reading in its header the way every other pane does: the
// report's age sits beside the title, and a latest report past its hour reads
// as overdue in the amber the page marks every other stale reading with. The
// writes before the latest are listed behind a disclosure, so however many the
// town keeps the pane is one report tall; each of those is a button that reads
// that report in place of the latest, with a control back to it (gt-4e065).
function renderReports(s) {
  const box = $("report"), note = $("reportnote");
  box.replaceChildren();
  note.className = "r";
  note.textContent = "";
  note.title = "";
  const r = s.reports;
  if (!r) { box.append(el("div", "empty", "reading…")); return; }
  // A directory or a report the reader could not read is a named state, and
  // never an empty pane: "no reports yet" and "could not be read" must not look
  // alike. Neither state has a write to date, so its header note stays empty.
  if (r.state === "missing" || r.state === "error") {
    box.append(el("div", r.state === "error" ? "badc" : "empty", r.note || r.state));
    return;
  }
  const times = r.times || [];
  // A report the pane no longer lists — it aged out of the day the list holds —
  // is not one the route would read, so the pane falls back to the latest.
  if (rPick && !times.some(t => reportFile(t) === rPick)) rPick = "";
