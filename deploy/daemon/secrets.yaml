# The files the daemon reads from the town's config directory (~/.config/gt),
# one entry each. `gt daemon compose write --config-dir D --secrets-manifest
# deploy/daemon/secrets.yaml` mounts exactly these files read-only, at their own
# path and at the container's XDG_CONFIG_HOME path, and mounts no directory of
# the config tree. The same list becomes the cluster Secrets when the daemon
# moves into the cluster (gt-gg9hv.66, gt-gg9hv.30).
#
# Fields, defined here and nowhere else:
#   name      the file's name in the config directory, never a path: an
#             absolute path, a separator, . or .. is refused.
#   consumer  the daemon code or setting that reads the file. An entry without
#             one is refused; a file no code or setting was found to read
#             belongs under `unclaimed`.
#   mode      the MAXIMUM permission the file may have, four octal digits with
#             no group or other bits. The render lstats each file and refuses
#             one readable by group or other, one carrying any bit beyond this
#             maximum, a symlink, a directory and a special file, naming the
#             entry and the mode on disk. A file with fewer bits is allowed.
#   required  true when a daemon start or a landing fails without the file, so
#             a missing required file refuses the render, naming the entry. An
#             optional missing file is a comment in the compose file and no
#             mount.
#   unclaimed files found in the config directory that no daemon code or
#             setting was found to read, each with the search that found no
#             consumer. They are recorded, never mounted: an unread file is not
#             a secret the daemon needs.
#
# rotating any listed secret requires recreating the daemon service (a bind mount of one file pins its inode)
#
# The promote keys: each rig whose settings name a merge_queue.forgejo.
# promote_key_file was read 2026-11-06 as gastown, om, hm, beads, mango and
# fractals, each naming ~/.config/gt/promote-<rig>.key; devops, beaver and
# agentlab name none. An optional entry, because the daemon starts without the
# key and the promotion records its own failure until the key is there.
files:
  - name: forgejo-landing.env
    consumer: "the landing bot's token: internal/daemon/landing_worker.go (forgejo.NewClient(config.ForgejoRoleLanding)) and internal/daemon/landing_infra.go, read from LandingWorkerConfig.ForgejoTokenDir"
    mode: "0600"
    required: true

  - name: forgejo-viewer.env
    consumer: "the read-only Forgejo token: internal/daemon/deploy_watch.go (productionDeployWatch) and internal/daemon/landing_infra.go (readInfraViewerToken) read config.ForgejoRoleViewer's file"
    mode: "0600"
    required: false

  - name: promote-gastown.key
    consumer: "forgejo.promote_key_file in gastown's settings (the promoter, internal/promote)"
    mode: "0600"
    required: false

  - name: promote-om.key
    consumer: "forgejo.promote_key_file in om's settings (the promoter, internal/promote)"
    mode: "0600"
    required: false

  - name: promote-hm.key
    consumer: "forgejo.promote_key_file in hm's settings (the promoter, internal/promote)"
    mode: "0600"
    required: false

  - name: promote-beads.key
    consumer: "forgejo.promote_key_file in beads's settings (the promoter, internal/promote)"
    mode: "0600"
    required: false

  - name: promote-mango.key
    consumer: "forgejo.promote_key_file in mango's settings (the promoter, internal/promote)"
    mode: "0600"
    required: false

  - name: promote-fractals.key
    consumer: "forgejo.promote_key_file in fractals's settings (the promoter, internal/promote)"
    mode: "0600"
    required: false

  - name: om-daemon-token
    consumer: "gt daemon compose write --om-token-file, whose host path the render mounts at LiveOMTokenPath for `gt daemon container-entrypoint` to load into the daemon's environment (internal/cmd/daemon_compose.go, internal/cmd/daemon_container_entrypoint.go)"
    mode: "0600"
    required: true

  - name: om-daemon-token.meta
    consumer: "daemon.om_token_meta, the expiry sidecar internal/config/daemon_config.go OMTokenMeta names and the daemon's token check reads"
    mode: "0600"
    required: false

  - name: jev.env
    consumer: "the jev key file internal/jev/key.go reads from the config home, used by the daemon's jev patrols (internal/jev)"
    mode: "0600"
    required: false

unclaimed:
  - name: promote-gastown.key.pub
    search: "grep -rn 'promote-\\.\\+\\.pub\\|promotePubPath\\|\\.pub' internal cmd: internal/forgejocut/promotekey.go derives the public half and gh registers it, both on the host; no daemon code reads a promote key's public half, so it is not mounted"

  - name: promote-om.key.pub
    search: "grep -rn 'promote-\\.\\+\\.pub\\|promotePubPath\\|\\.pub' internal cmd: internal/forgejocut/promotekey.go derives the public half and gh registers it, both on the host; no daemon code reads a promote key's public half, so it is not mounted"

  - name: promote-hm.key.pub
    search: "grep -rn 'promote-\\.\\+\\.pub\\|promotePubPath\\|\\.pub' internal cmd: internal/forgejocut/promotekey.go derives the public half and gh registers it, both on the host; no daemon code reads a promote key's public half, so it is not mounted"

  - name: promote-beads.key.pub
    search: "grep -rn 'promote-\\.\\+\\.pub\\|promotePubPath\\|\\.pub' internal cmd: internal/forgejocut/promotekey.go derives the public half and gh registers it, both on the host; no daemon code reads a promote key's public half, so it is not mounted"

  - name: promote-mango.key.pub
    search: "grep -rn 'promote-\\.\\+\\.pub\\|promotePubPath\\|\\.pub' internal cmd: internal/forgejocut/promotekey.go derives the public half and gh registers it, both on the host; no daemon code reads a promote key's public half, so it is not mounted"

  - name: promote-fractals.key.pub
    search: "grep -rn 'promote-\\.\\+\\.pub\\|promotePubPath\\|\\.pub' internal cmd: internal/forgejocut/promotekey.go derives the public half and gh registers it, both on the host; no daemon code reads a promote key's public half, so it is not mounted"

  - name: ntfy-push.sh
    search: "grep -rn 'ntfy-push' internal cmd plugins deploy, and the town's settings/config.json: the only names are internal/cmd/daemon_rehearse.go's accepted-path list and the notify.commands.ntfy key, which name no file in this checkout; no daemon code opens the path"

  - name: forgejo-polecat.env
    search: "grep -rn 'forgejo-polecat.env' internal cmd plugins deploy: only internal/openshellprov/run.go names it, run by cmd/openshell-providers on the host; no daemon code reads it"

  - name: forgejo-registry.env
    search: "grep -rn 'forgejo-registry' internal cmd plugins deploy: only the config.ForgejoRoleRegistry constant; no code in internal/, cmd/ or plugins/ reads the file, and the CI image push has its own token"

  - name: deepseek.env
    search: "grep -rn 'deepseek.env' internal cmd plugins deploy: only internal/openshellprov/run.go names it, run by cmd/openshell-providers on the host; no daemon code reads it"

  - name: dolt-archive.key
    search: "grep -rn 'dolt-archive.key\\|archive.key\\|ArchiveKey\\|archive_key' internal cmd plugins deploy: no key file; the history archive's setting is patrols.scheduled_maintenance.archive_dir (internal/config/daemon_config.go ParseArchiveDir) and internal/daemon/jsonl_git_backup.go pushes through git to <town>/.dolt-archive/git with no key file, so no daemon code reads one"

  - name: hm-config.json
    search: "grep -rn 'hm-config\\|hm_config\\|hmconfig' internal cmd plugins deploy: no match; the daemon runs hm through its exec seam without a config file argument"

  - name: claude-sbx-haiku-token
    search: "grep -rn 'claude-sbx-haiku-token\\|sbx-haiku-token\\|claude-sbx' internal cmd plugins deploy: no match; the sandbox seats' credentials are configured on the host side"

  - name: probe-gastown.record
    search: "grep -rn 'probe-.*\\.record\\|RecordPath\\|recordPath' internal cmd plugins deploy: internal/forgejoprobe/record.go writes <config-dir>/probe-<rig>.record for the cutover probe on the host; no daemon code reads a probe record"
