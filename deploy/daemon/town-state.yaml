# The town root's ownership split (gt-gg9hv.67).
# internal/townstate holds this list as Go data; TestManifestMirrorMatches
# fails when this mirror and the Go data differ. Do not edit one without the other.
# The rollback rationale lives on townstate.Default; read it before changing a rollback: true row.
entries:
  - path: daemon
    owner: daemon
    rollback: true
    why: the daemon's own state, settings and patrol records; rollback replays it
  - path: logs
    owner: daemon
    why: daemon and session logs the daemon rotates
  - path: events
    owner: daemon
    rollback: true
    why: the town event store the daemon appends; rollback replays it
  - path: .events.jsonl
    owner: daemon
    rollback: true
    why: the town event feed the daemon appends; rollback replays it
  - path: .feed.jsonl
    owner: daemon
    rollback: true
    why: the feed the daemon appends; rollback replays it
  - path: mayor
    owner: daemon
    why: town config and the pool and roster records it writes
  - path: .beads
    owner: daemon
    why: workspace metadata the daemon reads and writes
  - path: plugins
    owner: daemon
    why: installed plugins the daemon loads
  - path: .claude-town
    owner: daemon
    why: the daemon's liveness probe reads session transcripts under it (internal/liveness)
  - path: settings
    owner: shared
    why: edited by gt config daemon, read by the daemon (gt-yjzepk.4)
  - path: seat-refill.hold
    owner: shared
    why: the operator's dispatch hold, written on the Mac and read by the pod each tick; internal/dispatch/hold.go HoldFilePath is its path and OperatorHold reads it
  - path: ESTOP
    owner: shared
    why: the town-wide ESTOP sentinel, written on the Mac and read by the pod each tick; internal/estop/estop.go FilePath is its path and internal/dispatch/hold.go estopHold reads it
  - path: ESTOP.<rig>
    owner: shared
    why: the per-rig ESTOP sentinel, written on the Mac and read by the pod each tick; internal/estop/estop.go RigFilePath is its path and internal/dispatch/hold.go RigHold reads it
  - path: .events.jsonl.lock
    owner: daemon
    why: the flock internal/events/events.go takes beside .events.jsonl before an append, so two writers cannot interleave
  - path: .dolt-archive
    owner: daemon
    why: the JSONL git backup repository internal/daemon/jsonl_git_backup.go pushes each database's history into
  - path: .beads-wisp
    owner: daemon
    why: the wisp config layer internal/wisp/config.go writes and internal/rig/config.go reads
  - path: <rig>/config.json
    owner: daemon
    why: the rig's registry record the daemon and landing worker read
  - path: <rig>/.repo.git
    owner: daemon
    why: the rig's bare repository the landing worker fetches and merges into; the name is constants.DirRepoGit, which internal/rig and the daemon build the path from
  - path: <rig>/mayor/rig
    owner: daemon
    why: the rig's canonical clone the landing worker and promoter land on; the name is constants.DirMayor and constants.DirRig, which rig.RepoPath resolves (all nine rigs of this town have it, read 2026-11-06)
  - path: <rig>/.beads
    owner: daemon
    why: the rig's beads workspace internal/rig/manager.go InitBeads creates and bd writes, as the town-level .beads row
  - path: <rig>/plugins
    owner: daemon
    why: the plugins the daemon's scanner loads from each rig (internal/plugin/scanner.go DiscoverAll); internal/cmd/daemon_rehearse_plugins.go reads it
  - path: <rig>/settings
    owner: shared
    why: the rig's behavioral settings gt config writes (internal/config/loader.go SaveRigSettings) and the daemon's landing worker reads (internal/daemon/landing_worker.go rigPostLandCommand), as the town-level settings row
  - path: <rig>/directives
    owner: shared
    why: directives a person writes and internal/config/directives.go reads as the rig's layer (two rigs of this town have it)
  - path: <rig>/scripts
    owner: shared
    why: harness scripts a person writes by running the om repo's deploy.sh (contrib/gastown), which internal/doctor/harness_drift_check.go hashes; the refinery it deployed to is retired
  - path: <rig>/.gastown-harness-manifest.json
    owner: shared
    why: the deploy-managed file list the om repo's deploy.sh (contrib/gastown) writes and internal/doctor/harness_drift_check.go reads; the refinery it deployed to is retired
  - path: <rig>/.runtime/namepool-state.json
    owner: daemon
    why: the name pool's state internal/polecat/namepool.go writes when a polecat is named
  - path: <rig>/.runtime/locks
    owner: daemon
    why: rig lock files a polecat session takes (internal/polecat/manager.go) as the town-level .runtime/locks row; export skips the files themselves and keeps the directory
  - path: <rig>/.runtime/session_id
    owner: session
    why: the session ID gt prime writes in the cwd of a session started at the rig root (internal/cmd/prime_session.go persistSessionID)
  - path: <rig>/.runtime/session_start_emitted
    owner: session
    why: the ID whose session_start gt prime has emitted, written in that session's cwd (internal/cmd/prime_session.go recordSessionStartEmitted)
  - path: <rig>/.runtime/last_handoff_ts
    owner: session
    why: the handoff cooldown gt handoff writes in the session's cwd (internal/cmd/handoff.go recordHandoffTimeIn)
  - path: <rig>/.runtime/agent.lock
    owner: session
    why: the identity lock gt prime takes for a worker directory (internal/lock/lock.go New)
  - path: <rig>/.runtime/agent.lock.flock
    owner: session
    why: the flock internal/lock/lock.go takes beside agent.lock so two Acquire calls cannot race
  - path: <rig>/.runtime/handoff_to_successor
    owner: session
    why: the marker gt handoff leaves for the successor's gt prime (internal/cmd/handoff.go writeHandoffMarker)
  # The daemon's subsystem directories under .runtime and the state only gt
  # commands write. The .runtime/agents row states the ownership reason for the
  # gt-command rows, which name that row.
  - path: .runtime/jev
    owner: daemon
    why: jev's dataset the daemon writes
  - path: .runtime/polecat-spans
    owner: daemon
    why: polecat span records the daemon writes
  - path: .runtime/agents
    owner: daemon
    why: "agent intent records and the bird registry. Every writer is the daemon or a gt command (gt done, gt sling, the bird commands). Owner daemon because after the wrapper cutover every gt command runs in the container, so the volume holds the only copy of what a gt command writes; until then a gt command on the Mac also writes the host's tree, a cutover prerequisite (gt-yjzepk.10). The gt-command rows below say their owner is as this row says"
  - path: .runtime/landings
    owner: daemon
    rollback: true
    why: landing ledgers the daemon writes; rollback replays the landing records
  - path: .runtime/usage
    owner: daemon
    why: usage records the daemon writes
  - path: .runtime/sweep-runs
    owner: daemon
    why: tier sweep output the daemon writes
  - path: .runtime/overrun-guard
    owner: daemon
    why: overrun guard state the daemon writes
  - path: .runtime/metrics
    owner: daemon
    why: resource samples the daemon writes
  - path: .runtime/landing-om
    owner: daemon
    why: landing om evidence the daemon writes
  - path: .runtime/spec_dispatch
    owner: daemon
    rollback: true
    why: spec dispatcher state the daemon writes; rollback replays it
  - path: .runtime/heartbeats
    owner: daemon
    why: daemon heartbeats
  - path: .runtime/sandboxes
    owner: daemon
    why: sandbox records the daemon writes
  - path: .runtime/landing-logs
    owner: daemon
    why: landing stage logs the daemon writes
  - path: .runtime/attention
    owner: daemon
    why: the attention queue the daemon writes
  - path: .runtime/red-main
    owner: daemon
    rollback: true
    why: red-main status the landing worker writes; rollback replays the statuses
  - path: .runtime/locks
    owner: daemon
    why: town lock files the daemon takes; export skips the files themselves and keeps the directory
  - path: .runtime/container
    owner: daemon
    private: true
    why: the container's kubeconfig and state the daemon writes; the kubeconfig and the 0600 configs beside it must keep their modes through a copy
  - path: .runtime/daemon-image
    owner: daemon
    why: the daemon image build record
  - path: .runtime/reports
    owner: daemon
    why: the published bird reports gt report publish writes, one directory per bird (gt-yjzepk.3)
  - path: .runtime/ci-failures.jsonl
    owner: daemon
    why: the CI failure ledger internal/daemon/cifailures.go writes, one JSON line per failure
  - path: .runtime/cloud-check
    owner: daemon
    why: the cloud-check plugin's status.json, read by internal/cmd/dashboard.go dashboardCloudChecksPath
  - path: .runtime/deploy-watch.json
    owner: daemon
    why: the deploy watch's state internal/daemon/deploy_watch.go writes
  - path: .runtime/diskmaint
    owner: daemon
    why: the disk maintenance ledger gt maint writes (internal/cmd/maint.go) and internal/polecatimage reads before it prunes a registry
  - path: .runtime/dolt-archive
    owner: daemon
    why: the history archive internal/daemon/scheduled_maintenance_archive.go appends each database's dolt_log rows to, as dolt-log-<db>-<UTC date>.csv.gz; the path is the town's configured archive_dir (internal/config/daemon_config.go ArchiveDir), not a code default
  - path: .runtime/gate-logs
    owner: daemon
    private: true
    why: the landing worker's gate logs, one directory per rig (internal/land/gatelog.go); captured gate output can echo a token
  - path: .runtime/hm-src
    owner: daemon
    private: true
    why: the daemon's hm skew monitor's clone (internal/daemon/hm_skew.go hmSkewCloneDir); the clone's .git/config holds the rig's origin URL, which can carry credentials
  - path: .runtime/om-src
    owner: daemon
    private: true
    why: the om install's checkout, the default internal/ominstaller/resolve.go uses; the clone's .git/config holds the origin URL rebuild_om.go copies, which can carry credentials
  - path: .runtime/host
    owner: daemon
    why: the host probe file, written by the Mac's gt-mac-watch (internal/hostprobe/probes.go) and read by the daemon (internal/daemon/attention_host_file.go, disk_maintenance_disks.go)
  - path: .runtime/nudge_poller
    owner: daemon
    why: the nudge poller's PID files, written by internal/nudge/poller.go startPoller and pruned by the daemon (internal/daemon/pollution.go)
  - path: .runtime/openshell
    owner: daemon
    private: true
    why: the OpenShell gateway's log directory; the gt-installer gateway step that made it is deleted (gt-a2uug4.18); the gateway holds the provider credentials internal/seatprovider/seatprovider.go registers, so the directory is private
  - path: .runtime/patrol_scan
    owner: daemon
    why: the witness patrol's ledger internal/patrolscan/ledger.go writes and the daemon's patrol_scan step reads
  - path: .runtime/pids
    owner: daemon
    why: the pid files internal/session/pidtrack.go TrackSessionPID writes when a session starts; internal/doctor/stale_runtime_files_check.go reads them
  - path: .runtime/polecat-image-install.log
    owner: daemon
    why: the install log internal/installer/image.go writes when gt-installer installs the polecat image
  - path: .runtime/polecat-image.lock.flock
    owner: daemon
    why: the flock internal/polecatimage/lock.go takes beside the polecat-image lock directory so two image runs cannot claim it
  - path: .runtime/polecat-image.published
    owner: daemon
    why: the publish record internal/polecatimage/program.go writes and reads, so a push that did not finish is retried
  - path: .runtime/rigs
    owner: daemon
    why: the per-rig ready-to-land stamp internal/land/readystamp.go TouchReadyStamp writes and the dock stamp internal/rig/dockstamp.go writes
  - path: .runtime/sandbox-seat-ends
    owner: daemon
    why: the pending sandbox seat ends internal/daemon/sandbox_seat_end_pending.go writes
  - path: .runtime/sbx-k8s
    owner: daemon
    private: true
    why: the gt-sbx kind cluster's kubeconfig and manifests, written by deploy/k8s/kind/common.sh and read by internal/diskmaint/kubectl.go and internal/cmd/maint.go; the kubeconfig must keep its mode through a copy
  - path: .runtime/scheduler-dispatch.lock
    owner: daemon
    why: the dispatch lock internal/schedulerrun/schedulerrun.go takes
  - path: .runtime/signing
    owner: daemon
    private: true
    why: the keychain, its 0600 password file and the identity gt-installer signs with (internal/installer/sign.go ResolveSigning), which internal/binaryinstall/sign.go reads; the password file must keep its mode through a copy
  - path: .runtime/sling-startup-failures
    owner: daemon
    why: the per-bead startup failure records gt sling writes (internal/dispatch/startup_backoff.go), which the daemon's dispatchers read before re-slinging
  - path: .runtime/spec-lint
    owner: daemon
    why: the manual lint ledger gt spec lint appends (internal/specdispatch/lintlog.go)
  - path: .runtime/supervisor
    owner: daemon
    why: the action log internal/supervisor/supervisor.go writes when it restarts a session
  - path: .runtime/tier-sweep
    owner: daemon
    why: the tier sweep's per-rig records internal/daemon/tier_sweep.go writes
  - path: .runtime/tiertiming
    owner: shared
    why: the shell timing log shelltier.TimingPath names (internal/shelltier/timing.go), which the shelltier runner appends to; the daemon's tier sweep (internal/daemon/tier_sweep.go tierSweepShellRunner) and make test-slow (Makefile SHELL_TESTS) both run that runner, so both write
  - path: .runtime/tiertrigger
    owner: daemon
    why: the tier trigger's state and per-tier run files cmd/tiertrigger writes through internal/tiertrigger/state.go
  - path: .runtime/town-metrics.lock
    owner: daemon
    why: the lock gt metrics takes while it samples (internal/cmd/metrics_run.go), run by the town-metrics daemon plugin
  - path: .runtime/townhealth.json
    owner: daemon
    why: the town health snapshot internal/townhealth/file.go records, the one file the daemon writes
  - path: .runtime/update
    owner: daemon
    why: the update run's state and history internal/update/state.go writes
  - path: .runtime/daemon-liveness.json
    owner: daemon
    why: the daemon liveness baseline the doctor check writes (internal/doctor/daemon_liveness_check.go), run by the daemon's doctor_dog
  - path: .runtime/daemon-respawn.json
    owner: daemon
    why: the daemon respawn baseline a retired doctor check wrote; that check is deleted (docs/design/gt-in-container.md lists the launchd-era daemon checks), and no code writes the file now, so a town may still hold it
  - path: .runtime/polecat-admission
    owner: daemon
    why: admission reservations gt sling writes (internal/cmd/polecat_capacity.go writePolecatAdmissionReservation); owner as the .runtime/agents row says
  - path: .runtime/polecat-pool-claims
    owner: daemon
    why: seat claims gt sling writes (internal/cmd/sling_pool.go poolSeatClaimDir); owner as the .runtime/agents row says
  - path: .runtime/polecat-prompts
    owner: daemon
    why: the polecat system prompts gt sling stores (internal/session/prompt_store.go storePolecatPrompt), read back by the landing worker for a rejection (internal/land/promptstamp.go); owner as the .runtime/agents row says
  - path: .runtime/rehearsal
    owner: daemon
    why: the container rehearsal's run directories, written and deleted by gt daemon rehearse (internal/cmd/daemon_rehearse.go chooseRunDir)
  - path: .runtime/hooks
    owner: daemon
    why: the hooks sync report gt hooks sync writes (internal/hooks/sync_report.go) and the hooks-sync doctor check reads
  - path: .runtime/composer_pending
    owner: daemon
    why: the composer stall clock the daemon heartbeat and the witness patrol write (internal/tmux/pending_input_clock.go)
  - path: .runtime/nudge_queue
    owner: daemon
    why: the queued nudges gt nudge writes (internal/nudge/queue.go Enqueue) and the target session's hook drains; owner as the .runtime/agents row says
  - path: .runtime/seat-refill.json
    owner: daemon
    why: the seat-refill plugin's episode state, read by internal/report/hour.go refillEpisodes
  - path: .runtime/bead-respawn-counts.json
    owner: daemon
    why: the per-bead respawn counts gt sling records (internal/polecat/respawn_count.go RecordBeadRespawnMark), read by the jev scorecard (internal/jev/scorecard/thrash.go)
  - path: .runtime/bead-respawn-counts.json.flock
    owner: daemon
    why: the flock internal/polecat/respawn_count.go takes beside bead-respawn-counts.json
  - path: .runtime/claude-plan
    owner: daemon
    why: the Claude plan samples ~/.claude/statusline-command.sh appends, with the closeouts and trim gt dashboard writes (internal/dashboard/claude_plan_month.go)
  - path: .runtime/watch
    owner: daemon
    why: the watch feed gt tail and gt report read (internal/cmd/tail_sources.go); gt dashboard rewrites spend.json there while a page is open (internal/cmd/dashboard.go)
  - path: .runtime/jev-dataset
    owner: daemon
    why: the dataset tables gt jev dataset writes (internal/jev/dataset/dataset.go)
  - path: .runtime/dashboard-load.jsonl
    owner: daemon
    why: the dashboard's host load history, appended by internal/cmd/dashboard_trend.go dashLoads.append
  - path: .runtime/sling-context-scan
    owner: daemon
    why: the full sling-context scan's outcome marker, recorded by the heartbeat (internal/schedulerrun/contexts.go) through internal/beads/sling_context_stamp.go RecordSlingContextScan
  - path: .runtime/session_id
    owner: session
    why: the session ID gt prime writes in the cwd of a session started at the town root (internal/cmd/prime_session.go persistSessionID)
  - path: .runtime/session_start_emitted
    owner: session
    why: the ID whose session_start gt prime has emitted, written in that session's cwd (internal/cmd/prime_session.go recordSessionStartEmitted)
  - path: .runtime/last_handoff_ts
    owner: session
    why: the handoff cooldown gt handoff writes in the session's cwd (internal/cmd/handoff.go recordHandoffTimeIn)
  - path: <rig>/crew
    owner: session
    why: each crew worker's persistent workspace
  - path: <rig>/polecats
    owner: session
    why: each polecat's worktree
  - path: <rig>/witness
    owner: session
    why: the witness session's own tree
  - path: <rig>/refinery
    owner: session
    why: the refinery session's own tree
  - path: .runtime/<bird>
    owner: session
    why: each bird session's own directory; gt report publish writes its daily report under .runtime/reports instead (gt-yjzepk.3)
