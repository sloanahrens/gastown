# The two deployer credentials (gt-57u2we): client certificates whose subject
# names the role (operator decision 2026-11-18, map ticket claude-30uf).
# deployer-apply writes the five namespaced workload kinds in gt;
# deployer-policy writes RBAC, admission policies, priority classes and
# namespaces, and is issued per use. Both certificates carry the organization
# gt-deployers, so the group binding below gives both the read supplement: the
# cluster-scoped kinds an all-objects drift compare reads that the
# gt-drift-reader ClusterRole in drift-rbac.yaml does not name.
#
# This file is not applied by the daemon. The overseer applies it with the admin
# credential (gt-77r621). TestDeployerRBAC* in deploy/k8s holds it to these
# grants.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer-apply
  namespace: gt
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer-apply
  namespace: gt
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer-apply
subjects:
  - kind: User
    name: gt-deployer-apply
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deployer-policy
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Creating or updating a role that grants verbs the caller does not hold is an
  # escalation, and binding a role is what makes it reach a subject; both need
  # their own verb.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "clusterroles"]
    verbs: ["escalate", "bind"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deployer-policy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deployer-policy
subjects:
  - kind: User
    name: gt-deployer-policy
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gt-deployer-reader-extra
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get", "list"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gt-deployer-reader-extra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gt-deployer-reader-extra
subjects:
  - kind: Group
    name: gt-deployers
    apiGroup: rbac.authorization.k8s.io
