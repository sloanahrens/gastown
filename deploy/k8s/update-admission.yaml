# The ValidatingAdmissionPolicy that bounds what a Job the daemon starts may be
# (gt-j571bu). deploy/k8s/update-rbac.yaml grants the daemon ServiceAccount create,
# get, list, watch and delete on Jobs in gt; a Job's pod spec is chosen by whoever
# creates it, so that grant alone reaches any Secret in gt, any image the nodes can
# pull and the gt-update ServiceAccount's own Role. This policy admits only the Job
# deploy/k8s/update-job renders: a name starting gt-update-, the pod running as the
# gt-update ServiceAccount, every container image a forgejo:3000/bot-registry digest
# of gastown-daemon, exactly two volumes, the town-state claim and the viewer-token
# Secret the template names, no hostPath, no host network, PID or IPC namespace, no
# privileged container, and no Secret through a container's environment.
#
# The binding holds the policy to the daemon: its matchConditions name the daemon's
# ServiceAccount, so the operator's own apply (which runs as the operator) and a
# hand-run Job the overseer creates are unaffected, and a request from any other
# account never reaches these validations. matchConstraints names Job creation only:
# the daemon's Role has no update verb on Jobs, and a Job's pod template is immutable
# after creation, so an update could not widen what this admits anyway.
#
# This file is not applied by the daemon. The operator applies it with the Job's
# manifests, and the cluster must serve admissionregistration.k8s.io/v1
# ValidatingAdmissionPolicy, which Kubernetes serves from 1.30 (v1beta1 from 1.28).
# The operator checks the CEL with the API server's own evaluator before relying on
# the policy: the real Job and four mutated Jobs are created with --dry-run=server,
# impersonating the daemon's ServiceAccount, since the binding's matchConditions
# otherwise leave the request unvalidated. TestUpdateAdmissionPolicy holds these
# expressions and the rendered Job to the renderer's constants, without needing a
# CEL library.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: gt-update-jobs
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        resources: ["jobs"]
        operations: ["CREATE"]
  validations:
    # The daemon names each Job it creates gt-update-<green short sha>
    # (updatejob.JobNamePrefix and internal/daemon's updateJobName).
    - expression: >-
        object.metadata.name.startsWith('gt-update-')
      message: >-
        the Job's name must start gt-update-, the name the daemon gives the update
        Job it creates
    # The deprecated serviceAccount alias is refused unless it names the same
    # account, so a request cannot name one account in each field.
    - expression: >-
        object.spec.template.spec.serviceAccountName == 'gt-update' &&
        (!has(object.spec.template.spec.serviceAccount) ||
        object.spec.template.spec.serviceAccount == 'gt-update')
      message: >-
        the Job's pod must run as the gt-update ServiceAccount, which is the account
        the update-rbac Role grants
    - expression: >-
        (!has(object.spec.template.spec.hostNetwork) || !object.spec.template.spec.hostNetwork) &&
        (!has(object.spec.template.spec.hostPID) || !object.spec.template.spec.hostPID) &&
        (!has(object.spec.template.spec.hostIPC) || !object.spec.template.spec.hostIPC)
      message: >-
        the Job's pod must not join the node's network, PID or IPC namespace
    - expression: >-
        object.spec.template.spec.containers.all(c,
        !has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged) &&
        (!has(object.spec.template.spec.initContainers) ||
        object.spec.template.spec.initContainers.all(c,
        !has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged))
      message: >-
        the Job's containers must not be privileged
    # The two volumes the renderer names: the town-state claim and the viewer-token
    # Secret. Size two plus one branch per volume leaves no room for a third volume,
    # for a hostPath, or for another volume source, and the Secret name pins which
    # Secret is mounted. The renderer's images are pinned below, so a Job cannot run
    # a container of its own choosing either.
    - expression: >-
        has(object.spec.template.spec.volumes) &&
        size(object.spec.template.spec.volumes) == 2 &&
        object.spec.template.spec.volumes.all(v,
        (v.name == 'town-state' && has(v.persistentVolumeClaim) &&
        v.persistentVolumeClaim.claimName == 'town-state' && !has(v.hostPath)) ||
        (v.name == 'viewer-token' && has(v.secret) &&
        v.secret.secretName == 'daemon-forgejo-viewer.env' && !has(v.hostPath)))
      message: >-
        the Job may mount only the town-state claim and the viewer-token Secret, and
        no hostPath
    # The daemon image by digest, from this town's registry and account. The
    # renderer accepts any repo@sha256 reference, so this expression is what holds
    # the image to forgejo:3000/bot-registry/gastown-daemon.
    - expression: >-
        object.spec.template.spec.containers.all(c,
        c.image.matches('^forgejo:3000/bot-registry/gastown-daemon@sha256:[0-9a-f]{64}$')) &&
        (!has(object.spec.template.spec.initContainers) ||
        object.spec.template.spec.initContainers.all(c,
        c.image.matches('^forgejo:3000/bot-registry/gastown-daemon@sha256:[0-9a-f]{64}$')))
      message: >-
        every container and init container image must be gastown-daemon from
        forgejo:3000/bot-registry by sha256 digest
    # A volume pin does not stop a container reading a Secret through its
    # environment: secretKeyRef and envFrom.secretRef both name any Secret in gt. The
    # rendered Job sets no environment from a Secret, so none is admitted.
    - expression: >-
        object.spec.template.spec.containers.all(c,
        (!has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef))) &&
        (!has(c.envFrom) || c.envFrom.all(f, !has(f.secretRef)))) &&
        (!has(object.spec.template.spec.initContainers) ||
        object.spec.template.spec.initContainers.all(c,
        (!has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef))) &&
        (!has(c.envFrom) || c.envFrom.all(f, !has(f.secretRef)))))
      message: >-
        the Job's containers must not read a Secret through env secretKeyRef or
        envFrom secretRef
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: gt-update-jobs
spec:
  policyName: gt-update-jobs
  validationActions: [Deny]
  matchResources:
    # The namespace the daemon's Role lives in, named by the label every namespace
    # carries (kubernetes.io/metadata.name).
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: gt
  # Only the daemon's own requests are validated. The overseer's hand run and the
  # operator's apply run as other accounts, so this policy never refuses them.
  matchConditions:
    - name: daemon-service-account
      expression: >-
        request.userInfo.username == 'system:serviceaccount:gt:daemon'
