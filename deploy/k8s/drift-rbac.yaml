# The cluster reads the drift compare makes: the gt-drift-reader ClusterRole the
# daemon's service account in gt reads the rendered control-cluster objects
# through, and its binding. The compare reads a Deployment, a Service, a claim,
# the ServiceAccount, the tracker backup CronJob and the gate runner's ConfigMap
# by name, the hand-applied admission policies, their bindings and the update
# Job's Roles and RoleBindings, and every other object the static manifests hold:
# the static ClusterRoles and ClusterRoleBindings, their Roles and RoleBindings,
# the PriorityClasses and the Namespace, so the grant is get and list on those
# kinds and nothing else: no Secret, no write verb, no wildcard. A kind the
# compare comes to read joins this file and internal/cmd/testdata/drift-reads.golden
# together. The deployer read supplement, gt-deployer-reader-extra in
# deployer-rbac.yaml, names the same cluster-scoped kinds for the gt-deployers
# group; the two grants name the same kinds for different subjects, and each is
# held to its own allowlist.
#
# This file is not applied by the daemon: the overseer applies it with the admin
# credential and turns the drift patrol on (gt-p2katm). TestDriftRBAC* in
# deploy/k8s holds it to the reads the golden lists.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gt-drift-reader
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  # The gate runner's ConfigMap, the Services, the claims, the ServiceAccounts
  # and the static Namespace are all core-group objects.
  - apiGroups: [""]
    resources: ["configmaps", "services", "persistentvolumeclaims", "serviceaccounts", "namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]
  # The admission policies and their bindings are cluster-scoped.
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["get", "list"]
  # The static PriorityClasses.
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list"]
  # The update Job's and the static manifests' Roles, RoleBindings, ClusterRoles
  # and ClusterRoleBindings.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gt-drift-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gt-drift-reader
subjects:
  - kind: ServiceAccount
    name: daemon
    namespace: gt
