apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: town-state
  namespace: gt
  labels:
    app.kubernetes.io/managed-by: gt
    app.kubernetes.io/name: daemon
  annotations:
    gt/size-enforced: "false"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
