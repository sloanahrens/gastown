apiVersion: batch/v1
kind: CronJob
metadata:
  name: tracker-backup
  namespace: gt
  labels:
    app.kubernetes.io/managed-by: gt
    app.kubernetes.io/name: tracker-backup
spec:
  schedule: 30 3 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/managed-by: gt
            app.kubernetes.io/name: tracker-backup
        spec:
          automountServiceAccountToken: false
          initContainers:
            - name: trackerbackup-copy
              image: registry.example.com/gt/gastown-daemon@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
              command:
                - cp
                - -p
                - /usr/local/bin/trackerbackup
                - /opt/trackerbackup/trackerbackup
              volumeMounts:
                - name: trackerbackup-bin
                  mountPath: /opt/trackerbackup
          containers:
            - name: trackerbackup
              image: registry.example.com/library/postgres@sha256:5e6f7a8b9c0d1e2f5e6f7a8b9c0d1e2f5e6f7a8b9c0d1e2f5e6f7a8b9c0d1e2f
              command:
                - /opt/trackerbackup/trackerbackup
              args:
                - -dir
                - /backups
                - -keep
                - "7"
                - -pg-bin
                - /usr/lib/postgresql/17/bin
              env:
                - name: TRACKER_DSN
                  valueFrom:
                    secretKeyRef:
                      name: town-tracker-dsn
                      key: dsn
              volumeMounts:
                - name: tracker-backup
                  mountPath: /backups
                - name: trackerbackup-bin
                  mountPath: /opt/trackerbackup
                  readOnly: true
          volumes:
            - name: tracker-backup
              persistentVolumeClaim:
                claimName: tracker-backup
            - name: trackerbackup-bin
              emptyDir: {}
          restartPolicy: Never
