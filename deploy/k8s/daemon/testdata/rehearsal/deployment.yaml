# no hostAliases: this pod has no gateway alias, so host.docker.internal does not resolve in it
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daemon
  namespace: gt-rehearsal
  labels:
    app.kubernetes.io/managed-by: gt
    app.kubernetes.io/name: daemon
  annotations:
    gt/town-owner: rehearsal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: daemon
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: gt
        app.kubernetes.io/name: daemon
    spec:
      serviceAccountName: daemon
      terminationGracePeriodSeconds: 180
      containers:
        - name: daemon
          image: registry.example.com/gt/gastown-daemon@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          args:
            - --forge-host
            - forgejo:3000
            - --forge-token-file
            - /run/secrets/forge-token
          workingDir: /Users/sloan/gt
          env:
            - name: GT_TOWN_ROOT
              value: /Users/sloan/gt
            - name: XDG_CONFIG_HOME
              value: /run/gt/xdg
            - name: GT_DAEMON_CONTAINER_NAME
              value: daemon
            - name: GT_DAEMON_SUPERVISOR
              value: container
            - name: TZ
              value: America/Chicago
            - name: AWS_REGION
              value: us-east-1
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: town-state
              mountPath: /Users/sloan/gt
            - name: dolt-backup
              mountPath: /Users/sloan/gt-backups/dolt
              readOnly: true
            - name: gotmp
              mountPath: /Users/Shared/gt-gotmp.noindex
            - name: daemon-forgejo-viewer-env
              mountPath: /run/gt/xdg/gt/forgejo-viewer.env
              subPath: forgejo-viewer.env
              readOnly: true
            - name: daemon-forgejo-viewer-env
              mountPath: /run/secrets/forge-token
              subPath: forgejo-viewer.env
              readOnly: true
          readinessProbe:
            exec:
              command:
                - gt
                - status
                - --line
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - gt
                - daemon
                - status
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 5
      volumes:
        - name: town-state
          persistentVolumeClaim:
            claimName: town-state
        - name: dolt-backup
          persistentVolumeClaim:
            claimName: dolt-backup
        - name: gotmp
          emptyDir: {}
        - name: daemon-forgejo-viewer-env
          secret:
            secretName: daemon-forgejo-viewer.env
