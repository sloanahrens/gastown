apiVersion: apps/v1
kind: Deployment
metadata:
  name: bd-gateway
  namespace: gt
  labels:
    app.kubernetes.io/managed-by: gt
    app.kubernetes.io/name: bd-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bd-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: gt
        app.kubernetes.io/name: bd-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      hostAliases:
        - ip: 192.168.5.2
          hostnames:
            - host.docker.internal
      containers:
        - name: bd-gateway
          image: registry.example.com/gt/bdgw@sha256:abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
          command:
            - bdgw
            - serve
            - --tokens-dir
            - /run/bdgw/tokens
            - --verbs
            - /etc/bdgw/verbs.json
            - --log-dir
            - /var/log/bdgw
            - --workspace
            - /var/lib/bdgw/ws
            - --dolt-host
            - host.docker.internal
            - --dolt-port
            - "3307"
          volumeMounts:
            - name: bd-gateway-tokens
              mountPath: /run/bdgw/tokens
              readOnly: true
            - name: bd-gateway-log
              mountPath: /var/log/bdgw
            - name: bd-gateway-workspace
              mountPath: /var/lib/bdgw
          readinessProbe:
            exec:
              command:
                - bdgw
                - ready
                - --workspace
                - /var/lib/bdgw/ws
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: bd-gateway-tokens
          secret:
            secretName: bd-gateway-tokens
            defaultMode: 288
        - name: bd-gateway-log
          emptyDir: {}
        - name: bd-gateway-workspace
          persistentVolumeClaim:
            claimName: bd-gateway-workspace
