apiVersion: v1
kind: Pod
metadata:
  name: seed-helper
  namespace: gt
  labels:
    app.kubernetes.io/managed-by: gt
    gt/role: seed-helper
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 0
    runAsGroup: 0
  containers:
    - name: seed-helper
      image: registry.example.com/gt/gastown-daemon@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      command:
        - sleep
        - "2147483647"
      volumeMounts:
        - name: town-state
          mountPath: /Users/sloan/gt
        - name: landing-work
          mountPath: /Users/sloan/gt-landing.noindex
  volumes:
    - name: town-state
      persistentVolumeClaim:
        claimName: town-state
    - name: landing-work
      persistentVolumeClaim:
        claimName: landing-work
