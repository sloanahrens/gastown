# Names a sandbox uses for the control plane, all resolving to the Mac as seen
# from the kind node (host.lima.internal). They are ExternalName Services, so
# the cluster DNS answers with the Mac's address and the sandbox policy pins
# that address (see render-policy.sh). `control-plane` serves a profile with a
# single control_plane_host; `dolt` and `forgejo` are the names to use once the
# profile can name Forgejo separately. Moving a service into the cluster later
# replaces its ExternalName with a selector Service of the same name.
apiVersion: v1
kind: Service
metadata: {name: control-plane, namespace: openshell}
spec: {type: ExternalName, externalName: host.lima.internal}
---
apiVersion: v1
kind: Service
metadata: {name: dolt, namespace: openshell}
spec: {type: ExternalName, externalName: host.lima.internal}
---
apiVersion: v1
kind: Service
metadata: {name: forgejo, namespace: openshell}
spec: {type: ExternalName, externalName: host.lima.internal}
