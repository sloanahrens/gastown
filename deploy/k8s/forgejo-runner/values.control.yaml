# The Values the control cluster's forgejo-runner is built from, read from the
# cluster on 2026-11-18: the runner's ConfigMap labels, the address the forgejo
# alias resolves to, the claim sizes the claims hold, and each container's
# share, with the engine's requests below its limit so a tier sweep beside it
# still fits. Decoded by ControlValues; a key Values does not have is refused, so
# a knob added here must first exist in Values (gt-q2nigb). It holds labels, an
# address and sizes, and no credential.
namespace: forgejo
# Two concurrent jobs until the load scenario has run, so one change to the
# runner is measured at a time; three jobs (gt-jp8axa, gt-s47qp4.10) return
# after that test.
capacity: 2
labels:
  - "docker-cli:docker://data.forgejo.org/oci/docker:28.5-cli"
  - "node:docker://data.forgejo.org/oci/node:20.19"
  - "ci-base:docker://ci-base:latest"
forgejoHostIP: "10.43.130.32"
dindStorage: 40Gi
runnerStorage: 1Gi
runnerResources:
  cpu: "1"
  memory: 1Gi
dindResources:
  cpu: "6"
  memory: 12Gi
dindRequests:
  cpu: "4"
  memory: 8Gi
