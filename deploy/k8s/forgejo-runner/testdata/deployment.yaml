apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo
  labels:
    app.kubernetes.io/managed-by: gt
    app.kubernetes.io/name: forgejo-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: gt
        app.kubernetes.io/name: forgejo-runner
    spec:
      priorityClassName: gt-ci-gate
      hostAliases:
        - ip: 192.168.5.2
          hostnames:
            - forgejo
      containers:
        - name: runner
          image: data.forgejo.org/forgejo/runner:13.2.0
          command:
            - forgejo-runner
            - --config
            - /config/config.yml
            - daemon
          workingDir: /data
          env:
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2376
            - name: DOCKER_TLS_VERIFY
              value: "1"
            - name: DOCKER_CERT_PATH
              value: /certs/client
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: docker-certs
              mountPath: /certs
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
        - name: dind
          image: data.forgejo.org/oci/docker:dind
          args:
            - --insecure-registry=forgejo:3000
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
          resources:
            requests:
              cpu: "6"
              memory: 12Gi
            limits:
              cpu: "6"
              memory: 12Gi
          securityContext:
            privileged: true
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: dind-data
              mountPath: /var/lib/docker
      volumes:
        - name: config
          configMap:
            name: forgejo-runner-config
        - name: docker-certs
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-runner-data
        - name: dind-data
          persistentVolumeClaim:
            claimName: forgejo-runner-dind
