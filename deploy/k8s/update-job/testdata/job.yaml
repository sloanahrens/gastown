apiVersion: batch/v1
kind: Job
metadata:
  name: gt-update
  namespace: gt
  labels:
    app.kubernetes.io/name: gt-update
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gt-update
    spec:
      serviceAccountName: gt-update
      automountServiceAccountToken: true
      priorityClassName: gt-control-plane
      restartPolicy: Never
      initContainers:
        - name: images
          image: forgejo:3000/bot-registry/gastown-daemon@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          command:
            - gt
          args:
            - update
            - images
            - --sha
            - abababababababababababababababababababab
            - --out
            - /Users/sloan/gt/.runtime/update/images.yaml
          workingDir: /Users/sloan/gt
          env:
            - name: XDG_CONFIG_HOME
              value: /run/gt/xdg
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: credential.http://forgejo:3000.helper
            - name: GIT_CONFIG_VALUE_0
              value: '!gt git-credential-forgejo --host forgejo:3000 --token-file /run/gt/xdg/gt/forgejo-viewer.env'
          volumeMounts:
            - name: town-state
              mountPath: /Users/sloan/gt
            - name: viewer-token
              mountPath: /run/gt/xdg/gt/forgejo-viewer.env
              subPath: forgejo-viewer.env
              readOnly: true
      containers:
        - name: update
          image: forgejo:3000/bot-registry/gastown-daemon@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          command:
            - gt
          args:
            - update
            - --images
            - /Users/sloan/gt/.runtime/update/images.yaml
            - --pod-in-cluster
            - --pod-namespace
            - gt
          workingDir: /Users/sloan/gt
          env:
            - name: XDG_CONFIG_HOME
              value: /run/gt/xdg
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: credential.http://forgejo:3000.helper
            - name: GIT_CONFIG_VALUE_0
              value: '!gt git-credential-forgejo --host forgejo:3000 --token-file /run/gt/xdg/gt/forgejo-viewer.env'
          volumeMounts:
            - name: town-state
              mountPath: /Users/sloan/gt
            - name: viewer-token
              mountPath: /run/gt/xdg/gt/forgejo-viewer.env
              subPath: forgejo-viewer.env
              readOnly: true
      volumes:
        - name: town-state
          persistentVolumeClaim:
            claimName: town-state
        - name: viewer-token
          secret:
            secretName: daemon-forgejo-viewer.env
            defaultMode: 256
