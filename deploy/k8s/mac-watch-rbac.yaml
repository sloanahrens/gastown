# The cluster access the Mac's gt-mac-watch publishes with (gt-a2uug4.22): the
# mac-watch ServiceAccount in the gt namespace, the Role that lets it exec into
# the daemon pod, and the RoleBinding that grants it. The launchd job writes
# probes.json by running kubectl exec into the daemon container
# (docs/design/pod-host-probes.md, Credential scope). Before this file it ran as
# cluster admin through the operator's kubeconfig, so a bug or a compromised job
# on the Mac held the whole cluster. The rule reaches the pods it needs and no
# further: a rule cannot name the daemon pod, because its Deployment generates
# the name, so get and list on pods reach every pod in gt.
#
# This file is not applied by the daemon. Applying it, minting a token or a
# kubeconfig from the ServiceAccount and pointing gt-mac-watch at that kubeconfig
# are the operator's and devops' steps. TestMacWatchRBACRules and
# TestMacWatchRBACRefusesWidening hold the file to this one job's reads.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mac-watch
  namespace: gt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mac-watch
  namespace: gt
rules:
  # The exec's read of the daemon pod and the list of the pods its Deployment's
  # selector matches.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # The exec itself, which writes probes.json through the daemon container.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mac-watch
  namespace: gt
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mac-watch
subjects:
  - kind: ServiceAccount
    name: mac-watch
    namespace: gt
