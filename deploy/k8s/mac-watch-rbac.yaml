# The grant the Mac's gt-mac-watch publishes probes.json through (gt-a2uug4.22):
# get and list on pods in gt, create on pods/exec, for one ServiceAccount,
# Role and RoleBinding. A rule cannot name the daemon pod because its Deployment
# generates the name; before changing a grant, read docs/design/pod-host-probes.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mac-watch
  namespace: gt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mac-watch
  namespace: gt
rules:
  # The exec's read of the daemon pod and the list of the pods its Deployment's
  # selector matches.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # The exec itself, which writes probes.json through the daemon container.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mac-watch
  namespace: gt
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mac-watch
subjects:
  - kind: ServiceAccount
    name: mac-watch
    namespace: gt
