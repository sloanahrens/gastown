# The cluster access the tier sweep runs with (gt-gg9hv.55): the gt-sweeps
# namespace, the sweep-runner service account the Kubernetes backend's Job runs
# as, its namespaced Role and binding, the token Secret, the gt-sweep-reader
# ClusterRole the capacity, priority and control-disk guards read through, and
# the gt-ci-cache-trim Role and binding in the forgejo namespace the CI cache
# trim execs through. Two of the grants reach wider than the one call that needs
# each, because a rule cannot name the path or the container that would bound
# them; each rule says how far.
#
# This file is not applied by the daemon. The operator's apply step is in
# docs/reference.md, Tier sweep runner. TestSweepRBACManifestParses,
# TestSweepRBACCoversEveryRead and TestSweepRBACClusterGrantIsReadOnly hold it to
# the reads in internal/sweeprunner/testdata/rbac-reads.golden.
apiVersion: v1
kind: Namespace
metadata:
  name: gt-sweeps
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sweep-runner
  namespace: gt-sweeps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sweep-runner
  namespace: gt-sweeps
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sweep-runner
  namespace: gt-sweeps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sweep-runner
subjects:
  - kind: ServiceAccount
    name: sweep-runner
    namespace: gt-sweeps
---
# The token Secret is declared here for its annotations only: the control
# cluster fills in the token, and the file carries no data.
apiVersion: v1
kind: Secret
metadata:
  name: sweep-runner-token
  namespace: gt-sweeps
  annotations:
    kubernetes.io/service-account.name: sweep-runner
    kubernetes.io/service-account.uid: ad62749c-5263-484e-a42c-3602cf0dfb6e
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gt-sweep-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  # get on nodes/proxy is path-unbounded: RBAC cannot name a proxy path, so this
  # rule reaches every kubelet endpoint a GET reaches on every node, the stats
  # summary, logs and the rest (gt-11e5gm). It also reaches exec: the kubelet
  # authorizes a websocket connection to its exec endpoint on the initial GET, so
  # this grant can exec in pods on a reachable node through the kubelet websocket
  # (H3-2026-0002). Kubernetes calls that working as intended. The control-disk
  # read needs stats only. nodes/stats replaces nodes/proxy once the control
  # cluster is on Kubernetes 1.36 or later. It runs v1.35.0 (k3s), so this rule
  # stays until then.
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gt-sweep-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gt-sweep-reader
subjects:
  - kind: ServiceAccount
    name: sweep-runner
    namespace: gt-sweeps
---
# The CI cache trim (gt-gg9hv.57) runs as the sweep-runner service account and
# execs into the forgejo-runner's dind container in the forgejo namespace. Its
# grant lives in that namespace, not in gt-sweeps. pods/exec create is not
# bounded to that container: RBAC can name only a fixed pod and has no field for
# a container, while the forgejo-runner Deployment names each pod when its
# ReplicaSet creates it, so the rule reaches every pod in forgejo, Forgejo itself
# included (gt-11e5gm). The trim selects the runner pod by label and execs into
# its dind container (internal/daemon/ci_cache_trim.go); RBAC does not enforce
# that selection.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gt-ci-cache-trim
  namespace: forgejo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gt-ci-cache-trim
  namespace: forgejo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gt-ci-cache-trim
subjects:
  - kind: ServiceAccount
    name: sweep-runner
    namespace: gt-sweeps
