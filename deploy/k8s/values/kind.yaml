# OpenShell Helm values for the local kind environment (chart 0.1.4).
# Local trusted development only: the gateway accepts unauthenticated users
# behind mTLS on a loopback port. GKE gets its own values file with real auth.
server:
  auth:
    allowUnauthenticatedUsers: true
  drivers:
    kubernetes:
      # Lets gt (and the proofs) send per-sandbox node selectors, tolerations,
      # a priority class and resources as driver config. Off by default.
      allowDriverConfig: true
# Sandboxes run gastown-polecat:dev, a mutable tag that each install pushes
# anew. The chart's default leaves the Kubernetes default, which pulls only
# when the node lacks the image, so a node kept the first build and ran it
# after every later push (gt-t39cu). This renders the gateway's
# image_pull_policy = "always". The key is sandbox.image.pullPolicy, not
# global.image.pullPolicy, which sets the runtime and supervisor images only.
sandbox:
  image:
    pullPolicy: Always
# The gateway is a control-plane workload: keep it on the core node, off the
# tainted sandbox node.
nodeSelector:
  gt.dev/pool: core
