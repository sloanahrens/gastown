# OpenShell Helm values for the local kind environment (chart 0.1.4).
# Local trusted development only: the gateway accepts unauthenticated users
# behind mTLS on a loopback port. GKE gets its own values file with real auth.
server:
  auth:
    allowUnauthenticatedUsers: true
  drivers:
    kubernetes:
      # Lets gt (and the proofs) send per-sandbox node selectors, tolerations,
      # a priority class and resources as driver config. Off by default.
      allowDriverConfig: true
# Sandboxes run gastown-polecat:dev, a mutable tag that each install pushes
# anew, so pull it on every sandbox start (gt-t39cu). This renders the
# gateway's image_pull_policy = "always". The key is sandbox.image.pullPolicy,
# not global.image.pullPolicy, which sets the runtime and supervisor images
# only.
sandbox:
  image:
    pullPolicy: Always
# A saturated VM stalls the gateway's Dolt acquire for 8 to 22 s, past the
# chart's 15 s liveness window, and the kubelet restarts it, dropping every
# supervisor session (gt-8i4ziw). Six 10 s checks with a 5 s timeout make the
# window 60 s. The readiness timeout is 3 s so a loaded gateway is not pulled
# from the Service before it answers.
probes:
  liveness:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readiness:
    timeoutSeconds: 3
# The gateway is a control-plane workload: keep it on the core node, off the
# tainted sandbox node.
nodeSelector:
  gt.dev/pool: core
