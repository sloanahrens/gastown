# The control cluster's Forgejo server: the forgejo Namespace, the data claim, the
# forgejo Service and the forgejo Deployment, as the live read of 2026-11-27 recorded
# them after the cluster-set fields are stripped (testdata/live-2026-11-27), except the
# two Deployment values server_test.go names.
#
# The database password comes from Secret pg, key PASSWD, made by hand. Never apply
# this file as it stands: Manifest fills CONTROL_PLANE_HOST from the environment's
# values/<env>/hosts.yaml (control_plane_host).
#
# Applied only by the overseer's adoption step. gt town cluster render never reads
# this file, so no applied set owns it.
# Never delete or replace the data claim: its volume holds every repository.
---
apiVersion: v1
kind: Namespace
metadata:
  name: forgejo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: forgejo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 6Gi
  storageClassName: local-path
  volumeMode: Filesystem
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo
  namespace: forgejo
spec:
  allocateLoadBalancerNodePorts: true
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: http
      port: 3000
      protocol: TCP
      targetPort: 3000
    - name: ssh
      port: 2222
      protocol: TCP
      targetPort: 22
  selector:
    app: forgejo
  sessionAffinity: None
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: forgejo
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      containers:
        - env:
            - name: FORGEJO__database__DB_TYPE
              value: postgres
            - name: FORGEJO__database__HOST
              value: CONTROL_PLANE_HOST:5442
            - name: FORGEJO__database__NAME
              value: forgejo
            - name: FORGEJO__database__USER
              value: forgejo
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  key: PASSWD
                  name: pg
            - name: FORGEJO__server__DOMAIN
              value: forgejo
            - name: FORGEJO__server__ROOT_URL
              value: http://forgejo:3000/
            - name: FORGEJO__server__SSH_DOMAIN
              value: forgejo
            - name: FORGEJO__server__SSH_PORT
              value: "2222"
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "true"
            - name: FORGEJO__actions__ENABLED
              value: "true"
            - name: FORGEJO__packages__ENABLED
              value: "true"
          image: data.forgejo.org/forgejo/forgejo:16.0.5
          imagePullPolicy: IfNotPresent
          name: forgejo
          ports:
            - containerPort: 3000
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/healthz
              port: 3000
              scheme: HTTP
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 750m
              memory: 512Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /data
              name: data
      dnsPolicy: ClusterFirst
      priorityClassName: gt-control-plane
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      tolerations:
        - effect: NoSchedule
          key: node.kubernetes.io/disk-pressure
          operator: Exists
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
