# A trimmed copy of agent-sandbox v1.0.7's sandbox.yaml for the tests in this
# package: one document of each kind the release carries, with the controller
# Deployment cut to two containers and one init container. Its digest is not the
# release's, so it is only rendered through agentSandbox with its own digest.
apiVersion: v1
kind: Namespace
metadata:
  name: agent-sandbox-system
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxes.agents.x-k8s.io
spec:
  group: agents.x-k8s.io
  scope: Namespaced
  names:
    kind: Sandbox
    plural: sandboxes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-sandbox-controller
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-sandbox-controller
  namespace: agent-sandbox-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-sandbox-controller
  namespace: agent-sandbox-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-sandbox-controller
  template:
    metadata:
      labels:
        app: agent-sandbox-controller
    spec:
      serviceAccountName: agent-sandbox-controller
      initContainers:
        - name: warm-cache
          image: registry.k8s.io/pause:3.10
      containers:
        - name: agent-sandbox-controller
          image: registry.k8s.io/agent-sandbox-controller:v1.0.7
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
        - name: metrics
          image: registry.k8s.io/agent-sandbox-metrics:v1.0.7
