# The town's data unit on the Mac: Dolt and the bd gateway, one compose project
# (gt-data). docs/design/bd-container.md, "The compose unit".
#
# Nothing here is a secret or a host path. The image digests, the host
# directories and the token directory come from the environment that starts
# the unit (gt dolt start, G15):
#   GT_DOLT_IMAGE   the dolt-sql-server image, pinned by digest
#   GT_DOLT_CONFIG  the Dolt config file, mounted read-only
#   GT_DOLT_DATA    the .dolt-data directory, the same path inside the container
#   GT_DOLT_BACKUPS the backups directory, the same path inside the container
#   BD_IMAGE        the gt-bd image as a digest reference (name@sha256:...),
#                   never a tag; the one variable that names the bd image
#   GT_BD_TOKEN_DIR the gateway's token directory (0600 files), read-only
#   GT_TRACKER_URL  the tracker endpoint; empty when the town runs no tracker
#
# Each path has no default, so an unset variable stops compose instead of
# writing data to a path nobody chose.
name: gt-data

services:
  dolt:
    image: ${GT_DOLT_IMAGE:?set GT_DOLT_IMAGE to the dolt-sql-server image pinned by digest}
    container_name: gt-dolt
    restart: unless-stopped
    command:
      - --config
      - ${GT_DOLT_CONFIG:?set GT_DOLT_CONFIG to the Dolt config file}
    labels:
      org.gastown.keep: "true"
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - dolt-var:/var/lib/dolt
      - "${GT_DOLT_DATA:?set GT_DOLT_DATA to the .dolt-data directory}:${GT_DOLT_DATA}"
      - "${GT_DOLT_BACKUPS:?set GT_DOLT_BACKUPS to the Dolt backups directory}:${GT_DOLT_BACKUPS}"
      - "${GT_DOLT_CONFIG}:${GT_DOLT_CONFIG}:ro"
    mem_limit: 8g
    memswap_limit: 8g
    healthcheck:
      test: ["CMD", "dolt", "--host", "127.0.0.1", "--port", "3306", "-u", "root", "sql", "-q", "select 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  bd:
    image: ${BD_IMAGE:?set BD_IMAGE to the gt-bd image as a digest reference (name@sha256:...)}
    container_name: gt-bd
    restart: unless-stopped
    depends_on:
      dolt:
        condition: service_healthy
    # The image's entrypoint is bdgw serve; these are its flags.
    command:
      - --tokens-dir
      - /run/bdgw/tokens
      - --verbs
      - /etc/bdgw/verbs.json
      - --log-dir
      - /var/log/bdgw
      - --workspace
      - /ws
    environment:
      HOME: /home/bdgw
      TRACKER_URL: "${GT_TRACKER_URL:-}"
      TRACKER_TOKEN_FILE: /run/bdgw/tokens/tracker
    labels:
      org.gastown.keep: "true"
    ports:
      - "127.0.0.1:7440:7440"
    volumes:
      - "${GT_BD_TOKEN_DIR:?set GT_BD_TOKEN_DIR to the gateway token directory}:/run/bdgw/tokens:ro"
      - bd-logs:/var/log/bdgw
      - bd-ws:/ws
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD", "/usr/local/bin/bdgw", "ready", "--tokens-dir", "/run/bdgw/tokens", "--verbs", "/etc/bdgw/verbs.json", "--workspace", "/ws"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dolt-var:
  bd-logs:
  bd-ws:
