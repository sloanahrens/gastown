# Local Postgres for the tracker (gt-n2z79).
#
# trackerd reaches this database by DSN. The daemon bounds its own pool, so the
# DSN carries the cap it uses:
#   postgres://tracker@127.0.0.1:5432/tracker?pool_max_conns=30
# 30 leaves 20 of max_connections=50 for backups, migrations and admin.
#
# In the cloud this file is replaced by a managed database (Cloud SQL, RDS or
# equivalent); only TRACKER_DSN changes, one per workspace.
#
# TRACKER_PG_DATA is the host directory for the cluster, under ~/gt. The
# password lives in tracker-db.env beside this file, never in this file.
#
# tracker-db-ensure creates the tracker database a first init can leave out:
# its server fails on a fresh bind mount ("data directory has wrong ownership"),
# so the entrypoint never creates POSTGRES_DB (gt-caf0o6).
services:
  tracker-db:
    image: postgres:17.5
    restart: unless-stopped
    env_file: tracker-db.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - "${TRACKER_PG_DATA:?set TRACKER_PG_DATA to a directory under ~/gt}:/var/lib/postgresql/data"
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=512MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  tracker-db-ensure:
    image: postgres:17.5
    restart: "no"
    env_file: tracker-db.env
    depends_on:
      tracker-db:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        present=$$(psql -h tracker-db -U tracker -d postgres -v ON_ERROR_STOP=1 \
          -tAc "SELECT 1 FROM pg_database WHERE datname = 'tracker'") || exit 1
        if [ -n "$$present" ]; then
          echo "tracker database already present"
        else
          psql -h tracker-db -U tracker -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE tracker OWNER tracker" || exit 1
          echo "tracker database created"
        fi
