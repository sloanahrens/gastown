# Gas Town polecat sandbox policy, phase 0 draft (claude-q3f.1).
#
# Deny by default. The control plane stays on the Mac: Dolt on :3307 and
# Forgejo on :3000 are reached through Docker Desktop's host alias. The model
# endpoint comes from the attached provider profile (deepseek), not from here.
# Audit first, enforce after the proof; tighten paths in the hardening ticket.
version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /usr
    - /lib
    - /etc
    - /proc
    - /dev/urandom
    - /var/log
  read_write:
    - /tmp
    - /dev/null

landlock:
  compatibility: hard_requirement

network_policies:
  # git fetch/push against Forgejo over plain HTTP on the Mac.
  forgejo_git:
    endpoints:
      - host: host.docker.internal
        port: 3000
        protocol: rest
        access: full
        enforcement: audit
    binaries:
      - path: /usr/bin/git
      - path: /usr/local/bin/gt

  # bd and gt talk to the Dolt SQL server (MySQL wire; the server speaks first).
  dolt:
    endpoints:
      - host: host.docker.internal
        port: 3307
        protocol: tcp
        tls: skip
    binaries:
      - path: /usr/local/bin/bd
      - path: /usr/local/bin/gt

  # Go module downloads during build and test inside the sandbox.
  go_modules:
    endpoints:
      - host: proxy.golang.org
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: sum.golang.org
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: storage.googleapis.com
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
    binaries:
      - path: /usr/local/go/bin/go
