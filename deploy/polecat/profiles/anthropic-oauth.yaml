# Provider profile for the sbx-haiku seat: Claude Code with a setup-token subscription
# token, sent as a bearer placeholder the proxy swaps, to api.anthropic.com only.
# Modelled on deploy/polecat/profiles/deepseek-claude.yaml.
#
# What ran: the claude-q3f.13 proof passed, and the overseer's sandbox run of this narrowed
# list passed (both recorded on gt-du9v5). That run used a scratch profile built from this
# file, without /usr/bin/node, which sent a request to api.anthropic.com and got a reply.
# The live seat runs this list.
id: anthropic-oauth
display_name: Anthropic subscription token for Claude Code
description: Claude Code model requests with a setup-token subscription token, sent only to api.anthropic.com
category: inference
inference_capable: true
credentials:
  - name: oauth_token
    description: Claude subscription setup-token, sent only to api.anthropic.com
    env_vars: [CLAUDE_CODE_OAUTH_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [oauth_token]
endpoints:
  - host: api.anthropic.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/lib/node_modules/@anthropic-ai/claude-code/bin/claude.exe
