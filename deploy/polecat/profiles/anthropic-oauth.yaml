# Provider profile for the sbx-haiku seat (seagull, 2026-10-28), proven in claude-q3f.13. Modelled on
# deploy/polecat/profiles/deepseek-claude.yaml.
id: anthropic-oauth
display_name: Anthropic subscription token for Claude Code
description: Claude Code model requests with a setup-token subscription token, sent only to api.anthropic.com
category: inference
inference_capable: true
credentials:
  - name: oauth_token
    description: Claude subscription setup-token, sent only to api.anthropic.com
    env_vars: [CLAUDE_CODE_OAUTH_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [oauth_token]
endpoints:
  - host: api.anthropic.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/lib/node_modules/@anthropic-ai/claude-code/bin/claude.exe
  - /usr/bin/node
