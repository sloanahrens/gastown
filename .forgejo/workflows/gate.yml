# The landing gate, run by the local Forgejo on the candidate branch the
# landing worker pushes as land/<bead> (gt-fn9e6.10).
#
# The workflow's name and its one job key together are the required status
# context, "ci / gate (push)": internal/land reads both from this file so the
# branch-protection rule and the job that satisfies it cannot drift apart, and
# a rename here that the derivation does not follow orphans the rule instead of
# typing the string twice.
#
# runs-on is the host runner's ci-base label, the image in
# ~/forgejo/runner-image: Go with GOTOOLCHAIN=auto, libicu-dev for the DuckDB
# cgo build, an unprivileged ci user whose home holds the Go cache volumes, and
# the Node and docker CLIs. Because the image is a host file outside this repo,
# gastown's other requirements on it are called out in the landing note rather
# than committed here. It ships no lint tools, so `make lint-tools` installs
# golangci-lint at the Makefile's pinned GOLANGCI_LINT_VERSION into the image's
# PATH before the gate runs it (gt-fn9e6.17).
#
# The fetch deepens two refs, the candidate and main, and creates no other.
# The gate's history reader is `git describe --tags --always` (VERSION, hence
# the build's ldflags): it needs the candidate's ancestry back to its nearest
# tag, which a depth-1 checkout alone does not have. main is the base the
# candidate is built on, kept for the ancestry and merge-base reads around the
# landing. `fetch-depth: 0` fetched all 669 heads instead, 8s of a 49s job
# (gt-ebco0).
name: ci
on:
  push:
    branches: ["land/**"]

jobs:
  gate:
    runs-on: ci-base
    steps:
      - uses: actions/checkout@v4
      - name: fetch the candidate and main with history
        run: |
          git fetch --no-tags --prune --depth=2147483647 origin \
            "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME" \
            "+refs/heads/main:refs/remotes/origin/main"
          git fetch --no-tags --prune origin "+refs/tags/*:refs/tags/*"
      - run: make lint-tools
      - run: make gate
