name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # Guard: gastown no longer supports issues.jsonl — Dolt server is the only backend.
  check-no-issues-jsonl:
    name: Reject issues.jsonl
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Reject issues.jsonl if present
        run: |
          if [ -f .beads/issues.jsonl ]; then
            echo "ERROR: .beads/issues.jsonl must not exist in the repository."
            echo ""
            echo "Gastown requires a Dolt server — issues.jsonl is no longer supported."
            echo ""
            echo "To fix, run:"
            echo "  git rm .beads/issues.jsonl"
            echo "  git commit --amend"
            echo "  git push --force"
            echo ""
            exit 1
          fi
          echo "OK: no issues.jsonl found"

  # The one gate (docs/testing.md, "The gate"): CI runs `make gate` verbatim,
  # the same command gt done and the land path run. It lints, builds and runs
  # the unit tier, and needs no Docker. The integration tier runs daily in
  # nightly-integration.yml, not on every push.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26'
          cache: true

      - name: Install ICU4C development headers
        run: sudo apt-get install -y libicu-dev

      - name: Configure Git
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@gastown.test"

      - name: Install Dolt
        run: |
          curl -L https://github.com/dolthub/dolt/releases/download/v2.0.7/install.sh | sudo bash

      - name: Set up beads (bd)
        uses: ./.github/actions/setup-bd

      # The Makefile pins the golangci-lint version `make lint` needs.
      - name: Install golangci-lint
        run: |
          make lint-tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: make gate
        run: make gate
